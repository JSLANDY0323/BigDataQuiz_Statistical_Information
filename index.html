接詞 even though。", "w": "(A)(C)(D) 介系詞（片語），不能接子句。"}, {"g": "t_p5conj", "q": "Sales rose sharply _______ the holiday season.", "o": ["when", "during", "as", "while"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "假期期間銷售額大幅上升。", "e": "區塊 the holiday season 只有名詞 → 介系詞 during。", "w": "(A)(C)(D) 連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ the contract is signed, construction will begin immediately.", "o": ["As soon as", "Following", "After that", "Upon"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "合約一簽署，工程就會立刻開始。", "e": "區塊 the contract is signed 有真動詞 is signed → 連接詞 As soon as。", "w": "(B) Following、(D) Upon 在此不能直接接限定子句；(C) After that 是表示「在那之後」的副詞片語，不能單靠本句逗號連接兩個獨立子句。"}, {"g": "t_p5conj", "q": "The library will remain closed _______ further notice.", "o": ["while", "unless", "by the time", "until"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "圖書館將持續關閉，直到另行通知。", "e": "until further notice 表示「直到另行通知」，until 在此作介系詞接名詞片語。while、unless、by the time 在所提供的結構中不能表達此意思。", "w": "(A) while 在此需要時間子句；(B) unless 要引導條件子句；(C) by the time 通常接子句。本題考固定時間片語 until further notice。"}, {"g": "t_p5conj", "q": "_______ its small size, the new office is comfortable and well equipped.", "o": ["Unless", "Although", "Despite", "Since"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "雖然空間不大，新辦公室仍舒適且設備齊全。", "e": "區塊 its small size 只有名詞 → 介系詞 Despite。", "w": "(A)(B)(D) 連接詞，後面要有主詞＋動詞。"}, {"g": "t_p5conj", "q": "Please contact the help desk _______ you have any problems logging in.", "o": ["because of", "during", "if", "in case of"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "如果登入有任何問題，請聯絡服務台。", "e": "區塊 you have any problems… 有真動詞 have → 連接詞 if。注意 logging 是 V-ing，不是真動詞，真動詞是 have。", "w": "(A)(B)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "The shipment arrived late _______ a mistake in the delivery address.", "o": ["since", "because", "as", "because of"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "這批貨因送貨地址有誤而延遲送達。", "e": "區塊 a mistake in the delivery address 只有名詞 → 介系詞片語 because of。", "w": "(A)(B)(C) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ Ms. Wong had prepared carefully, she still felt nervous before the interview.", "o": ["Although", "Because of", "Despite", "Instead of"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "雖然黃女士做了充分準備，面試前她仍然很緊張。", "e": "區塊 Ms. Wong had prepared carefully 有真動詞 had prepared → 連接詞 Although。", "w": "(B)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "Our team finished the report _______ the deadline.", "o": ["unless", "before", "so that", "although"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "我們團隊在截止期限前完成了報告。", "e": "區塊 the deadline 只有名詞 → 需要介系詞。before 可當介系詞；其他三個只能當連接詞。", "w": "(A)(C)(D) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "_______ the merger, the two companies will share a single headquarters.", "o": ["So that", "Once", "As a result of", "Even if"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "合併之後，兩家公司將共用同一個總部。", "e": "區塊 the merger 只有名詞 → 介系詞片語 As a result of。", "w": "(A)(B)(D) 在這裡都是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "Customers will receive a full refund _______ the product is returned within 30 days.", "o": ["regardless of", "in spite of", "due to", "as long as"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "只要商品在 30 天內退回，顧客就能獲得全額退款。", "e": "區塊 the product is returned… 有真動詞 is returned → 連接詞 as long as（只要）。", "w": "(A)(B)(C) 介系詞片語，只能接名詞。"}, {"g": "t_p5conj", "q": "The museum is open every day _______ national holidays.", "o": ["although", "except", "unless", "whereas"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "除了國定假日外，博物館每天開放。", "e": "區塊 national holidays 只有名詞 → 介系詞 except（除了）。", "w": "(A)(C)(D) 連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ the CEO was traveling, the vice president chaired the board meeting.", "o": ["Because", "Owing to", "Despite", "During"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "由於執行長出差，副總裁主持了董事會。", "e": "區塊 the CEO was traveling 有真動詞 was traveling → 連接詞 Because。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "Mr. Brown was promoted _______ his excellent sales performance.", "o": ["because of", "so", "because", "since"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "Brown 先生因銷售表現優異而獲得升遷。", "e": "區塊 his excellent sales performance 只有名詞 → 介系詞片語 because of。", "w": "(B)(C) 連接詞；(D) since 當介系詞只表時間「自從」。"}, {"g": "t_p5conj", "q": "_______ the training program, new hires will learn how to use the inventory system.", "o": ["While", "As soon as", "Whereas", "Throughout"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "在整個訓練課程中，新進員工將學習如何使用庫存系統。", "e": "區塊 the training program 只有名詞 → 介系詞 Throughout（在…整段期間）。", "w": "(A)(B)(C) 連接詞，要接主詞＋動詞。"}, {"g": "t_p5conj", "q": "_______ the high cost, many companies are investing in solar energy.", "o": ["Although", "While", "Despite", "Even if"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管成本很高，許多公司仍在投資太陽能。", "e": "區塊 the high cost 只有名詞 → 介系詞 Despite。", "w": "(A)(B)(D) 連接詞，後面要接主詞＋真動詞。"}, {"g": "t_p5conj", "q": "_______ the cost is high, many companies are investing in solar energy.", "o": ["Despite", "Although", "In spite of", "Regardless of"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "雖然成本很高，許多公司仍在投資太陽能。", "e": "區塊 the cost is high 有真動詞 is → 連接詞 Although。（和上一題對照：同樣意思，名詞用 Despite，子句用 Although）", "w": "(A)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "The store will close early today _______ the national holiday.", "o": ["since", "because", "so that", "due to"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "因為國定假日，商店今天會提早打烊。", "e": "區塊 the national holiday 只有名詞 → 介系詞片語 due to。", "w": "(B)(C) 連接詞；(A) since 當介系詞只表「自從」。"}, {"g": "t_p5conj", "q": "Ms. Okafor took notes _______ the client was explaining the requirements.", "o": ["while", "within", "during", "throughout"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "客戶說明需求時，Okafor 女士做了筆記。", "e": "區塊 the client was explaining… 有真動詞 was explaining → 連接詞 while。", "w": "(B)(C)(D) 介系詞，後面只能接名詞。"}, {"g": "t_p5conj", "q": "Please remain seated _______ the flight until the seatbelt sign is turned off.", "o": ["whenever", "as", "during", "while"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "飛行期間請保持就座，直到安全帶指示燈熄滅。", "e": "區塊 the flight 只有名詞（until 之後是另一個子句）→ 介系詞 during。", "w": "(A)(B)(D) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "_______ sales were lower than expected, the company still made a profit.", "o": ["Because of", "Despite", "Instead of", "Even though"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "雖然銷售額低於預期，公司仍然獲利。", "e": "區塊 sales were lower… 有真動詞 were → 連接詞 Even though。", "w": "(A)(B)(C) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "The road was closed _______ an accident near the bridge.", "o": ["as", "because of", "because", "since"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "因為橋附近發生事故，道路封閉了。", "e": "區塊 an accident near the bridge 只有名詞 → because of。", "w": "(A)(C)(D) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ you need help with the new software, please contact IT support.", "o": ["Whenever", "During", "Because of", "In case of"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "每當你使用新軟體需要協助時，請聯絡資訊支援。", "e": "區塊 you need help… 有真動詞 need → 連接詞 Whenever。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "_______ emergency, use the stairs instead of the elevator.", "o": ["In case of", "When", "Unless", "If"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "如遇緊急情況，請走樓梯，不要搭電梯。", "e": "區塊 emergency 只有名詞 → 介系詞片語 In case of。", "w": "(B)(C)(D) 連接詞，後面要接子句（例如 If there is an emergency）。"}, {"g": "t_p5conj", "q": "The factory continued to operate _______ the power outage.", "o": ["whereas", "even though", "despite", "although"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管停電，工廠仍持續運作。", "e": "區塊 the power outage 只有名詞 → 介系詞 despite。", "w": "(A)(B)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the new system was installed, errors have decreased by half.", "o": ["Following", "Due to", "After that", "Since"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "自從新系統安裝以來，錯誤減少了一半。", "e": "區塊 the new system was installed 有真動詞 was installed → 連接詞 Since（自從），主句搭完成式 have decreased。", "w": "(A)(B) 介系詞；(C) After that 是轉承語，不能引導子句。"}, {"g": "t_p5conj", "q": "We will begin the meeting _______ everyone arrives.", "o": ["in spite of", "once", "during", "upon"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "大家一到我們就開始開會。", "e": "區塊 everyone arrives 有真動詞 arrives → 連接詞 once（一…就）。", "w": "(A)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "Mr. Diaz was late for work _______ the heavy traffic.", "o": ["so", "owing to", "as", "because"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "因為交通壅塞，Diaz 先生上班遲到了。", "e": "區塊 the heavy traffic 只有名詞 → 介系詞片語 owing to（＝because of）。", "w": "(A)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the meeting ran late, several employees missed their trains.", "o": ["Because", "Owing to", "Due to", "Because of"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "因為會議拖延，好幾位員工錯過了火車。", "e": "區塊 the meeting ran late 有真動詞 ran → 連接詞 Because。", "w": "(B)(C)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "_______ his busy schedule, Mr. Ito agreed to speak at the conference.", "o": ["Although", "Even though", "Though", "Notwithstanding"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管行程繁忙，伊藤先生仍同意在會議上演講。", "e": "區塊 his busy schedule 只有名詞 → 介系詞 Notwithstanding（＝despite，正式用語）。", "w": "(A)(B)(C) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "Visitors must sign in at the front desk _______ entering the building.", "o": ["unless", "although", "before", "so that"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "訪客進入大樓前必須在櫃台登記。", "e": "區塊 entering the building 是 V-ing（不是真動詞）→ 需要介系詞。before 可當介系詞接 V-ing。", "w": "(D) so that 後面要接完整子句；(A)(B) 語意不合（雖然／除非進入大樓），而且這兩個字通常引導子句。"}, {"g": "t_p5conj", "q": "_______ the CEO approves the budget, the project cannot begin.", "o": ["Unless", "Apart from", "Without", "Except for"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "除非執行長批准預算，否則專案無法開始。", "e": "區塊 the CEO approves… 有真動詞 approves → 連接詞 Unless（除非）。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "The project cannot begin _______ the CEO's approval.", "o": ["unless", "whereas", "if", "without"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "沒有執行長的核准，專案無法開始。", "e": "區塊 the CEO's approval 只有名詞 → 介系詞 without。（和上一題對照）", "w": "(A)(B)(C) 都是連接詞，後面要接主詞＋真動詞。"}, {"g": "t_p5conj", "q": "_______ the warranty has expired, repairs will be charged.", "o": ["Due to", "Owing to", "Now that", "Because of"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "既然保固已經過期，維修將會收費。", "e": "區塊 the warranty has expired 有真動詞 has expired → 連接詞 Now that（既然）。", "w": "(A)(B)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "Prices may change _______ notice.", "o": ["unless", "without", "whereas", "although"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "價格可能隨時變動，恕不另行通知。", "e": "區塊 notice 只有名詞 → 介系詞 without（without notice 恕不另行通知）。", "w": "(A)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "The CEO approved the plan _______ several board members opposed it.", "o": ["even though", "in spite of", "despite", "regardless of"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管幾位董事反對，執行長仍批准了計畫。", "e": "區塊 several board members opposed it 有真動詞 opposed → 連接詞 even though。", "w": "(B)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "_______ its success in Asia, the company plans to enter the European market.", "o": ["As", "Given", "Since", "Because"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "鑑於在亞洲的成功，公司計畫進軍歐洲市場。", "e": "區塊 its success in Asia 只有名詞 → Given 當介系詞（考慮到、鑑於）。", "w": "(A)(C)(D) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "Please keep your receipt _______ you need to return the item.", "o": ["due to", "in case of", "because of", "in case"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "請保留收據，以防需要退貨。", "e": "區塊 you need to return… 有真動詞 need → 連接詞 in case（以防）。", "w": "(A)(B)(C) 介系詞片語。陷阱：in case 是連接詞，in case of 是介系詞。"}, {"g": "t_p5conj", "q": "The museum has been closed _______ last Monday.", "o": ["for", "during", "since", "while"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "博物館從上週一開始就一直關閉。", "e": "區塊 last Monday 只有名詞（時間點）＋ 完成式 → since 當介系詞（自從）。", "w": "(A) for 接時間長度；(B) during 不搭時間點；(D) while 是連接詞。"}, {"g": "t_p5conj", "q": "_______ Ms. Han was on leave, her team completed the project.", "o": ["During", "Within", "While", "Throughout"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "韓女士休假期間，她的團隊完成了專案。", "e": "區塊 Ms. Han was on leave 有真動詞 was → 連接詞 While。", "w": "(A)(B)(D) 介系詞。"}, {"g": "t_p5conj", "q": "The concert was canceled _______ low ticket sales.", "o": ["on account of", "because", "now that", "so that"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "演唱會因票房不佳而取消。", "e": "區塊 low ticket sales 只有名詞 → 介系詞片語 on account of（因為）。", "w": "(B)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the new rules, all visitors must wear a badge.", "o": ["Whereas", "Although", "Unless", "Under"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "根據新規定，所有訪客都必須配戴證件。", "e": "區塊 the new rules 只有名詞 → 介系詞 Under（在…規定之下）。", "w": "(A)(B)(C) 連接詞。"}, {"g": "t_p5conj", "q": "The shipment will be delivered on Tuesday _______ there are no delays at customs.", "o": ["except for", "as long as", "because of", "in spite of"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "只要海關沒有延誤，貨物將在週二送達。", "e": "區塊 there are no delays… 有真動詞 are → 連接詞 as long as。", "w": "(A)(C)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "_______ several attempts, the technician could not fix the printer.", "o": ["Despite", "Even though", "While", "Although"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管試了好幾次，技師還是修不好印表機。", "e": "區塊 several attempts 只有名詞 → 介系詞 Despite。", "w": "(B)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "The office will be closed _______ the holidays, from December 24 to January 1.", "o": ["since", "while", "when", "over"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "辦公室在假期期間（12 月 24 日到 1 月 1 日）關閉。", "e": "區塊 the holidays 只有名詞 → 介系詞 over（在…期間）。", "w": "(B)(C) 連接詞；(A) since 搭完成式，表「自從」。"}, {"g": "t_p5conj", "q": "_______ the bad weather, the delivery arrived on time.", "o": ["Unless", "Although", "Despite", "Because"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管天氣惡劣，貨物仍準時送達。", "e": "區塊 the bad weather 是名詞片語，沒有子句 → 介系詞 Despite；語意是讓步（儘管）。", "w": "(A)(B)(D) 連接詞，後面要接主詞＋動詞的子句；而且 because、unless 語意也不合。"}, {"g": "t_p5conj", "q": "The workshop was postponed _______ the speaker had a scheduling conflict.", "o": ["because", "because of", "despite", "due to"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "因為講者行程衝突，工作坊延期了。", "e": "區塊 the speaker had a scheduling conflict 是完整子句（had 是限定動詞）→ 連接詞 because。", "w": "(B)(C)(D) 介系詞（片語），後面接名詞片語，不能直接接子句。"}, {"g": "t_p5conj", "q": "_______ the conference, attendees can visit the exhibition hall during breaks.", "o": ["While", "When", "As soon as", "Throughout"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "在整場會議期間，與會者可以在休息時間參觀展覽廳。", "e": "區塊 the conference 是名詞片語 → 介系詞 Throughout（在整段期間）。", "w": "(A)(B)(C) 是連接詞，後面要接子句，例如 while the conference is held。"}, {"g": "t_p5conj", "q": "Please do not use your phone _______ you are driving a company vehicle.", "o": ["throughout", "while", "during", "within"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "駕駛公司車輛時請勿使用手機。", "e": "區塊 you are driving… 是完整子句 → 連接詞 while（在…的時候）。", "w": "(A)(C)(D) 介系詞，後面不能直接接子句。"}, {"g": "t_p5conj", "q": "_______ its high price, the new model sold out in a week.", "o": ["Although", "Whereas", "Even though", "In spite of"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "儘管價格很高，新機型一週內就賣完了。", "e": "區塊 its high price 是名詞片語 → 介系詞片語 In spite of。", "w": "(A)(B)(C) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "The store will offer free delivery _______ the order total exceeds $100.", "o": ["if", "due to", "except for", "in case of"], "a": 0, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "訂單總額超過 100 美元，商店就提供免費配送。", "e": "區塊 the order total exceeds $100 是完整子句 → 表條件的連接詞 if。", "w": "(B)(C)(D) 介系詞片語，後面接名詞片語，不能接子句。"}, {"g": "t_p5conj", "q": "_______ the merger was announced, the company's stock price rose sharply.", "o": ["Due to", "After", "Upon", "Following"], "a": 1, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "合併案宣布後，公司股價大幅上漲。", "e": "區塊 the merger was announced 是完整子句 → 需要能引導子句的 After（after 可當連接詞，也可當介系詞）。", "w": "(A)(C)(D) 只能當介系詞，後面接名詞片語，例如 Following the announcement。"}, {"g": "t_p5conj", "q": "The deadline will be extended _______ more time is needed.", "o": ["in the event of", "because of", "if", "regardless of"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "如果需要更多時間，截止日將會延後。", "e": "區塊 more time is needed 是完整子句 → 連接詞 if。", "w": "(A)(B)(D) 介系詞片語，後面接名詞片語。"}, {"g": "t_p5conj", "q": "_______ several requests from staff, the cafeteria now offers vegetarian meals.", "o": ["So that", "Because", "In response to", "Although"], "a": 2, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "為回應員工的多次要求，員工餐廳現在提供素食餐點。", "e": "區塊 several requests from staff 是名詞片語 → 介系詞片語 In response to。", "w": "(A)(B)(D) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "Ms. Tran stayed late _______ she could finish the report before the meeting.", "o": ["despite", "because of", "in order to", "so that"], "a": 3, "h": "先看空格後這一段是子句還是名詞片語，再核對因果、讓步、時間或條件語意。while working、when asked 等省略子句是另一種結構。", "trans": "Tran 女士留到很晚，以便在會議前完成報告。", "e": "區塊 she could finish… 是完整子句，語意是目的 → 連接詞 so that（以便）。", "w": "(C) in order to 後面接原形動詞，不接主詞；(A)(B) 介系詞片語。"}]}, {"id": "p5_pron", "kind": "toeic", "part": 5, "stage": 1, "title": "代名詞", "sub": "依句中角色選主格、受格、所有格、反身及名詞替代形式", "qs": [{"g": "t_p5pron", "q": "Ms. Rivera asked _______ assistant to book a flight to Tokyo.", "o": ["hers", "herself", "her", "she"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Rivera 女士請她的助理訂一張飛往東京的機票。", "e": "訊號：空格後面緊接名詞 assistant → 選所有格 her。", "w": "(D) 主格；(A) 所有格代名詞（＝her＋名詞，後面不能再接名詞）；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "The engineers completed the repairs _______, without any outside help.", "o": ["themselves", "them", "their", "theirs"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "工程師們在沒有任何外援的情況下，親自完成了維修。", "e": "訊號：句子 The engineers completed the repairs 已完整，拿掉空格仍成立 → 反身代名詞 themselves（強調「親自」）。", "w": "(B) 受格，completed 已經有受詞；(C) 所有格後要接名詞；(D) theirs 語意不通。"}, {"g": "t_p5pron", "q": "Mr. Kato will present _______ findings at the conference next week.", "o": ["him", "his", "himself", "he"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "加藤先生將在下週的會議上發表他的研究結果。", "e": "訊號：空格後緊接名詞 findings → 所有格 his。", "w": "(D) 主格；(A) 受格；(C) 反身，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Please send the signed contract to Ms. Adams or _______.", "o": ["I", "my", "mine", "me"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "請把簽好的合約寄給 Adams 女士或我。", "e": "訊號：空格是介系詞 to 的受詞（to Ms. Adams or ___）→ 受格 me。", "w": "(A) I 是主格；(B) my 須限定名詞；(C) mine 表「我的東西」，不指寄件對象本人。本題介系詞 to 的受詞用 me。"}, {"g": "t_p5pron", "q": "The company thanked _______ employees for their hard work.", "o": ["its", "itself", "it's", "it"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "公司感謝員工的辛勞付出。", "e": "訊號：空格後緊接名詞 employees → 所有格 its。", "w": "(D) 主格／受格；(C) it's ＝ it is；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "If you have any questions, please contact _______ directly.", "o": ["we", "us", "ourselves", "our"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "如有任何問題，請直接與我們聯絡。", "e": "訊號：contact（及物）後缺受詞，空格後面是副詞 directly，不是名詞 → 受格 us。", "w": "(A) 主格；(D) 所有格後要接名詞；(C) 主詞是 you，不能用 ourselves。"}, {"g": "t_p5pron", "q": "The director _______ will welcome the new interns on Monday.", "o": ["he", "him", "his", "himself"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "主任將在週一親自歡迎新來的實習生。", "e": "訊號：空格緊接在主詞 The director 後面，拿掉後句子仍完整 → 反身代名詞 himself（強調親自）。", "w": "(A) 主詞重複；(B) 受格；(C) 所有格後要接名詞。"}, {"g": "t_p5pron", "q": "The new laptops are lighter than _______ we currently use.", "o": ["them", "they", "those", "their"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "新筆電比我們目前使用的那些更輕。", "e": "訊號：比較對象是「筆電」（複數），後面還接關係子句 we currently use → 用 those（＝the laptops that）代替前面的複數名詞。", "w": "(A) them、(B) they 不是本句所需的名詞替代結構；(D) their 是所有格，後面缺名詞。本句用 those we currently use 表示「目前使用的那些筆電」。"}, {"g": "t_p5pron", "q": "Ms. Hall prefers to handle client complaints by _______.", "o": ["herself", "hers", "her", "she"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Hall 女士偏好獨自處理客訴。", "e": "訊號：by oneself ＝ 獨自、靠自己；主詞是 Ms. Hall → herself。", "w": "(D) 主格不能放介系詞後；(C) by her 表「被她」語意不通；(B) hers 語意不通。"}, {"g": "t_p5pron", "q": "Our sales figures this quarter were higher than _______ of our competitors.", "o": ["that", "this", "those", "them"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "我們本季的銷售數字高於競爭對手的。", "e": "訊號：比較的是 figures（複數），後接 of… → 用 those of 代替複數名詞。單數才用 that of。", "w": "(A)(B) 單數，與 figures 不一致；(D) them 不能接 of 片語。"}, {"g": "t_p5pron", "q": "The marketing team presented _______ new campaign to the board.", "o": ["them", "theirs", "they", "their"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "行銷團隊向董事會提出了他們的新活動企劃。", "e": "訊號：空格後接 形容詞＋名詞（new campaign）→ 所有格 their。", "w": "(C) 主格；(A) 受格；(B) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "Mr. Singh and _______ will attend the trade show in Berlin.", "o": ["my", "I", "me", "mine"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Singh 先生和我將參加柏林的商展。", "e": "訊號：空格在主詞位置（後面是動詞 will attend）→ 主格 I。", "w": "(C) 受格不能當主詞；(A) 所有格要接名詞；(D) mine 語意不通。"}, {"g": "t_p5pron", "q": "The report on my desk is _______, not Mr. Clark's.", "o": ["mine", "myself", "me", "my"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "我桌上那份報告是我的，不是 Clark 先生的。", "e": "訊號：be 動詞後、後面沒有名詞 → 所有格代名詞 mine（＝my report），與 Mr. Clark's 對應。", "w": "(D) my 後面必須接名詞；(C) 受格語意不通；(B) 反身代名詞不能這樣用。"}, {"g": "t_p5pron", "q": "Customers who wish to return items must bring _______ receipts.", "o": ["they", "theirs", "their", "them"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "想退貨的顧客必須攜帶收據。", "e": "訊號：空格後緊接名詞 receipts → 所有格 their。", "w": "(A) 主格；(D) 受格；(B) 所有格代名詞，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Ms. Lopez reviewed the budget _______ before submitting it.", "o": ["she", "hers", "her", "herself"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Lopez 女士在提交預算前親自審核了一遍。", "e": "訊號：Ms. Lopez reviewed the budget 已完整，空格可拿掉 → 反身代名詞 herself（親自）。", "w": "(A) 主格；(C) 受格，reviewed 已有受詞 the budget；(B) hers 語意不通。"}, {"g": "t_p5pron", "q": "The manager gave _______ a detailed explanation of the new procedure.", "o": ["our", "us", "ourselves", "we"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "經理詳細向我們說明了新流程。", "e": "訊號：give ＋ 人（受格）＋ 物 → 第一個受詞用受格 us。", "w": "(D) 主格；(A) 所有格要接名詞（our a… 不成立）；(C) 主詞是 the manager，不能用 ourselves。"}, {"g": "t_p5pron", "q": "Each employee is responsible for keeping _______ workspace clean.", "o": ["his or her", "him or her", "he or she", "himself or herself"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "每位員工都有責任保持自己的工作區域整潔。", "e": "訊號：空格後緊接名詞 workspace → 所有格 his or her。", "w": "(B) 受格；(C) 主格；(D) 反身，後面都不能接名詞。"}, {"g": "t_p5pron", "q": "The software automatically updates _______ every night, without modifying any other program.", "o": ["it", "itself", "its", "it's"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "這套軟體每晚會自動更新本身，不會修改其他程式。", "e": "主詞是 The software，更新的對象也是同一套軟體，故用反身代名詞 itself。後半句排除更新其他程式的解讀。", "w": "(A) it 會被理解為「更新另一個東西」，前文沒有可指的對象；(C) 所有格要接名詞；(D) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Mr. Evans asked that all requests be sent to _______ by e-mail.", "o": ["his", "he himself", "him", "he"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Evans 先生要求所有申請都以電子郵件寄給他。", "e": "訊號：介系詞 to 後面 → 受格 him。that 子句的主詞是 all requests，不是 Mr. Evans，所以不用 himself。", "w": "(D) he、(B) he himself 都是主格形式，不能在此作 to 的受詞；(A) his 表所有或所有物，不表示收件人本人。"}, {"g": "t_p5pron", "q": "Although the task was difficult, the interns completed it by _______.", "o": ["them", "they", "their", "themselves"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "雖然任務很困難，實習生們還是靠自己完成了。", "e": "訊號：by ＋ 反身代名詞 ＝ 獨自；主詞 the interns → themselves。", "w": "(B) 主格；(A) by them 表「被他們」；(C) 所有格要接名詞。"}, {"g": "t_p5pron", "q": "_______ who are interested in the workshop should register by Friday.", "o": ["Those", "Their", "Them", "Whoever"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "有興趣參加工作坊的人請在週五前報名。", "e": "訊號：空格後接關係代名詞 who → Those who（那些…的人）是固定用法。", "w": "(B) Their 是所有格，後面缺名詞；(C) Them 是受格，不能作本句主詞；(D) Whoever 已包含「任何…的人」的關係結構，不能再接 who。"}, {"g": "t_p5pron", "q": "The firm's lawyers advised _______ client not to sign the agreement.", "o": ["themselves", "their", "them", "they"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "事務所的律師建議他們的客戶不要簽署這份協議。", "e": "訊號：空格後緊接名詞 client → 所有格 their。", "w": "(D) 主格；(C) 受格；(A) 反身，後面都不能接名詞。"}, {"g": "t_p5pron", "q": "Ms. Moore designed the logo _______, so she knows every detail of it.", "o": ["hers", "she", "her", "herself"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "這個標誌是 Moore 女士親自設計的，所以她清楚每個細節。", "e": "訊號：Ms. Moore designed the logo 已完整，空格可拿掉 → 反身代名詞 herself。", "w": "(B) 主格；(C) 受格，designed 已有受詞；(A) hers 語意不通。"}, {"g": "t_p5pron", "q": "The CEO thanked the volunteers and gave each of _______ a gift card.", "o": ["they", "their", "them", "themselves"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "執行長感謝志工，並送給他們每人一張禮物卡。", "e": "訊號：介系詞 of 後面 → 受格 them（each of them）。", "w": "(A) 主格；(B) 所有格要接名詞；(D) 主詞是 the CEO，不能用 themselves。"}, {"g": "t_p5pron", "q": "Our products are more durable than _______ of other brands.", "o": ["these", "those", "them", "that"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "我們的產品比其他品牌的更耐用。", "e": "訊號：比較對象 products 是複數，後接 of… → those of。", "w": "(D) that of 用於單數；(A) these 不用於這種比較結構；(C) them 不能接 of 片語。"}, {"g": "t_p5pron", "q": "Mr. Grant forgot to bring _______ laptop to the meeting.", "o": ["his", "himself", "he", "him"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Grant 先生忘了帶筆電來開會。", "e": "訊號：空格後緊接名詞 laptop → 所有格 his。", "w": "(C) 主格；(D) 受格；(B) 反身，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Ms. Adams told _______ that the meeting had been canceled.", "o": ["our", "ourselves", "us", "we"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Adams 女士告訴我們會議取消了。", "e": "訊號：told 是及物動詞，後面需要受詞，空格後是 that 子句 → 受格 us。", "w": "(D) 主格；(A) 所有格要接名詞；(B) 主詞是 Ms. Adams，不能用 ourselves。"}, {"g": "t_p5pron", "q": "The members of the committee introduced _______ at the start of the meeting.", "o": ["theirs", "themselves", "their", "them"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "委員們在會議開始時自我介紹。", "e": "訊號：主詞 The members 和受詞是同一群人（介紹自己）→ 反身代名詞 themselves。", "w": "(D) them 表示介紹「別人」；(C) 所有格要接名詞；(A) theirs 語意不通。"}, {"g": "t_p5pron", "q": "Our competitors have lowered _______ prices again.", "o": ["them", "theirs", "they", "their"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "我們的競爭對手又降價了。", "e": "訊號：空格後緊接名詞 prices → 所有格 their。", "w": "(C) 主格；(A) 受格；(B) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "If you need assistance, Mr. Hill or _______ will be happy to help.", "o": ["I", "my", "me", "mine"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "如果你需要協助，Hill 先生或我都很樂意幫忙。", "e": "訊號：Mr. Hill or ___ 是主詞（後面接 will be）→ 主格 I。", "w": "(C) 受格不能當主詞；(B) 所有格要接名詞；(D) mine 是「我的東西」，語意不合。"}, {"g": "t_p5pron", "q": "The new laptop is lighter than _______.", "o": ["me", "myself", "my", "mine"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "新筆電比我的輕。", "e": "訊號：than 後面沒有名詞，比較的是「筆電」→ 所有格代名詞 mine（＝my laptop）。", "w": "(C) my 後面要接名詞；(A) 比較的是筆電不是人；(B) 反身代名詞不用於比較對象。"}, {"g": "t_p5pron", "q": "The company prides _______ on its excellent customer service.", "o": ["it's", "itself", "it", "its"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "公司以優質的客戶服務自豪。", "e": "訊號：pride oneself on（以…自豪）固定用法，主詞是 The company → itself。", "w": "(C) it 指別的東西；(D) 所有格要接名詞；(A) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Each of the managers will present _______ department's annual report.", "o": ["they", "them", "his or her", "its"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "每位經理將發表自己部門的年度報告。", "e": "訊號：Each of the managers 主詞是 Each（單數，指人）；空格後接名詞 department's → 單數人的所有格 his or her。", "w": "(A) 主格；(D) its 指物；(B) 受格，後面都不能接人的所有物。"}, {"g": "t_p5pron", "q": "The clients were satisfied with the design that we created for _______.", "o": ["themselves", "them", "they", "their"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "客戶對我們為他們設計的方案感到滿意。", "e": "訊號：介系詞 for 後面 → 受格 them。that 子句的主詞是 we，所以不用 themselves。", "w": "(C) 主格；(D) 所有格要接名詞；(A) 反身需與同一子句主詞一致。"}, {"g": "t_p5pron", "q": "Ms. Chen prefers to book _______ own flights rather than use a travel agent.", "o": ["her", "hers", "she", "herself"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "陳女士偏好自己訂機票，而不是透過旅行社。", "e": "訊號：空格後是 own ＋ 名詞 → 所有格 her（one's own ＋ 名詞）。", "w": "(C) 主格；(B) hers 後面不能接名詞；(D) herself 不能接 own。"}, {"g": "t_p5pron", "q": "Ms. Wong and _______ colleagues attended the workshop in Singapore.", "o": ["she", "herself", "her", "hers"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "黃女士和她的同事參加了新加坡的工作坊。", "e": "訊號：空格後緊接名詞 colleagues → 所有格 her。", "w": "(A) 主格；(D) hers 後面不能接名詞；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "Please let _______ know if you will attend the dinner.", "o": ["mine", "my", "I", "me"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "如果你會參加晚宴，請告訴我。", "e": "訊號：let ＋ 受詞 ＋ 原形 → 受格 me。", "w": "(C) 主格；(B) 所有格要接名詞；(A) 所有格代名詞語意不通。"}, {"g": "t_p5pron", "q": "_______ of the employees has received a copy of the handbook.", "o": ["Each", "Their", "Them", "They"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "每位員工都收到了一份員工手冊。", "e": "訊號：___ of the employees ＋ 單數動詞 has → Each of。", "w": "(B)(C)(D) 人稱代名詞不能接 of the employees 當主詞。"}, {"g": "t_p5pron", "q": "The office manager ordered the supplies _______ instead of asking an assistant.", "o": ["she", "her", "herself", "hers"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "辦公室經理親自訂購了用品，而沒有請助理代勞。", "e": "訊號：The office manager ordered the supplies 已完整，空格可拿掉，強調「親自」→ herself。", "w": "(B) 受格，ordered 已經有受詞；(D) hers 語意不通；(A) 主格不能放這裡。"}, {"g": "t_p5pron", "q": "This seat is _______; I left my bag on it.", "o": ["myself", "me", "my", "mine"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "這個座位是我的，我把包包放在上面。", "e": "訊號：be 動詞後、後面沒有名詞 → 所有格代名詞 mine。", "w": "(C) my 後面要接名詞；(B) 受格語意不通；(A) 反身代名詞不能這樣用。"}, {"g": "t_p5pron", "q": "The engineers checked the equipment and found _______ in good condition.", "o": ["it's", "it", "itself", "its"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "工程師檢查設備後發現它狀況良好。", "e": "訊號：found ＋ 受詞 ＋ 補語；受詞是前面的 equipment（不可數、單數）→ it。", "w": "(D) 所有格要接名詞；(C) 主詞是 engineers，不能用 itself；(A) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Mr. Ross and Ms. Kent will share _______ ideas at the planning meeting.", "o": ["theirs", "them", "they", "their"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "Ross 先生和 Kent 女士將在企劃會議上分享他們的想法。", "e": "訊號：空格後緊接名詞 ideas → 所有格 their。", "w": "(C) 主格；(B) 受格；(A) 所有格代名詞，後面不能再接名詞。"}, {"g": "t_p5pron", "q": "The two companies agreed to share _______ research data.", "o": ["theirs", "them", "their", "they"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "兩家公司同意共享研究資料。", "e": "訊號：空格後接名詞 research data → 所有格 their。", "w": "(D) 主格；(B) 受格；(A) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "Ms. Ito, _______ is the head of marketing, will lead the session.", "o": ["who", "her", "which", "she"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "身為行銷主管的伊藤女士將主持這場會議。", "e": "訊號：逗號中間的子句缺主詞，且要連接到主句 → 關係代名詞 who（人）。用 she 會變成兩個句子沒有連接詞。", "w": "(D) she 不能連接子句；(B) 受格；(C) which 指物。"}, {"g": "t_p5pron", "q": "The manager asked the interns to introduce _______ to the team.", "o": ["them", "themselves", "their", "theirs"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "經理請實習生向團隊自我介紹。", "e": "訊號：introduce 的動作者是 the interns（不定詞的意義主詞），介紹的對象也是他們自己 → themselves。", "w": "(A) them 會變成介紹別人；(C)(D) 所有格語意不合。"}, {"g": "t_p5pron", "q": "The CEO and _______ assistant will arrive at noon.", "o": ["his", "himself", "him", "he"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "執行長和他的助理將於中午抵達。", "e": "訊號：空格後緊接名詞 assistant → 所有格 his。", "w": "(D) 主格；(C) 受格；(B) 反身，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Please return the completed form to _______ by Friday.", "o": ["mine", "I", "my", "me"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "請在週五前把填好的表格交回給我。", "e": "訊號：介系詞 to 後面需要受格 → me。", "w": "(B) 主格不能放在介系詞後；(C) 所有格要接名詞；(A) mine 是「我的東西」，語意不合。"}, {"g": "t_p5pron", "q": "The interns organized the entire event by _______.", "o": ["they", "them", "themselves", "their"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "實習生們獨力籌辦了整場活動。", "e": "訊號：by ＋ 反身代名詞 ＝ 獨自、靠自己；主詞是 The interns → themselves。", "w": "(A) 主格不能放在介系詞後；(B) by them 會變成「被他們（另一群人）」；(D) 所有格要接名詞。"}, {"g": "t_p5pron", "q": "Our new laptop is lighter than _______ of our main competitor.", "o": ["these", "that", "those", "them"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "我們的新筆電比主要競爭對手的還輕。", "e": "訊號：比較對象 laptop 是單數，後面接 of… → 用 that of 代替單數名詞（the laptop of）。", "w": "(C) those of 用於複數名詞；(A) these 不這樣用來代替；(D) them 不能接 of 片語。"}, {"g": "t_p5pron", "q": "Each department must submit _______ budget proposal by May 1.", "o": ["it", "it's", "itself", "its"], "a": 3, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "每個部門都必須在 5 月 1 日前提交預算提案。", "e": "訊號：空格後緊接名詞片語 budget proposal → 所有格 its（Each department 是單數）。", "w": "(B) it's ＝ it is；(A) it 是主格／受格；(C) 反身代名詞，後面都不能接名詞。"}, {"g": "t_p5pron", "q": "The manager told _______ that the project had been approved.", "o": ["us", "ours", "we", "our"], "a": 0, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "經理告訴我們專案已經獲得核准。", "e": "訊號：told 後面需要受詞（告訴誰）→ 受格 us。", "w": "(C) 主格；(D) 所有格要接名詞；(B) ours 是「我們的東西」，語意不合。"}, {"g": "t_p5pron", "q": "Mr. Lim gave his old laptop to a colleague and bought a new _______.", "o": ["ones", "one", "other", "it"], "a": 1, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "林先生把舊筆電送給同事，買了一台新的。", "e": "訊號：a new ＋ [空格]，代替前面提過的單數可數名詞 laptop（但不是同一台）→ one。", "w": "(D) it 指同一台，而且不能被 a new 修飾；(A) ones 是複數，不能接在 a 後；(C) other 是形容詞，後面要接名詞。"}, {"g": "t_p5pron", "q": "The two managers share an office, but each has _______ own desk.", "o": ["himself or herself", "he or she", "his or her", "him or her"], "a": 2, "h": "判斷空格是主詞、受詞、名詞前的所有格，還是強調「親自」。反身代名詞須有適當指涉，不能只因刪掉空格後句子完整就選反身。", "trans": "兩位經理共用一間辦公室，但各有自己的辦公桌。", "e": "訊號：空格後是 own ＋ 名詞 → 所有格（one's own）；each 指單數的人 → his or her。", "w": "(D) 受格；(B) 主格；(A) 反身，都不能接 own。"}]}, {"id": "p5_fin", "kind": "toeic", "part": 5, "stage": 2, "title": "真動詞判斷", "sub": "分清子句述語與修飾語，再選限定動詞、to V、V-ing 或 p.p.", "qs": [{"g": "t_p5fin", "q": "The new manager _______ the team's performance every Friday.", "o": ["reviews", "review", "reviewing", "to review"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "新經理每週五檢視團隊績效。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 The new manager 是第三人稱單數，every Friday 表習慣 → reviews。", "w": "(C)(D) 不能當主要動詞；(B) review 主詞動詞不一致（單數主詞要加 -s）。"}, {"g": "t_p5fin", "q": "The company plans _______ a new branch in Osaka next year.", "o": ["opens", "to open", "open", "opened"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "公司計畫明年在大阪開設新分店。", "e": "Step 1：已有真動詞 plans，且沒有連接詞 → 刪掉有時態的 opens、opened 和原形 open。plan ＋ to V。", "w": "plan 表計畫做某事時接 to V；(A) opens、(C) open、(D) opened 均不能直接作 plans 的此種補語。"}, {"g": "t_p5fin", "q": "Employees _______ to attend the workshop must register by Monday.", "o": ["wish", "wished", "are wishing", "wishing"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "想參加工作坊的員工必須在週一前報名。", "e": "Step 1：真動詞已經是 must register → 空格不能再是真動詞。Employees 主動「想要」→ V-ing 修飾名詞（＝who wish）。", "w": "(A)(C) 有時態的真動詞，會變成兩個動詞；(B) wished 當 p.p. 表被動，語意不通。"}, {"g": "t_p5fin", "q": "The report _______ last week contains several errors.", "o": ["submitting", "submit", "submitted", "submits"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "上週提交的報告有幾處錯誤。", "e": "Step 1：真動詞是 contains → 空格只能是 V-ing 或 p.p.。Step 2：報告是「被提交」→ p.p. submitted。", "w": "(B)(D) 真動詞會重複；(A) V-ing 表主動，報告不會自己提交。"}, {"g": "t_p5fin", "q": "Ms. Grant _______ the client list before the meeting started.", "o": ["to update", "updated", "updating", "having updated"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "Grant 女士在會議開始前更新了客戶名單。", "e": "Step 1：主要子句 Ms. Grant ___ the client list 沒有真動詞（started 屬於 before 子句）→ 刪掉 V-ing、to V → updated。", "w": "(A)(C)(D) 都不是真動詞，主要子句會缺動詞。"}, {"g": "t_p5fin", "q": "_______ the deadline, the team worked overtime all week.", "o": ["To meet", "Meets", "Met", "Meet"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "為了趕上截止期限，團隊整週都在加班。", "e": "Step 1：真動詞是 worked，逗號前沒有連接詞 → 空格不能是真動詞，To V 放句首表目的（為了…）。", "w": "(D) 原形放句首會變祈使句；(B)(C) 有時態的動詞會變成兩個真動詞。"}, {"g": "t_p5fin", "q": "Customers _______ in the loyalty program receive a 10% discount.", "o": ["enroll", "are enrolled", "enrolled", "enrolls"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "加入會員方案的顧客可享九折優惠。", "e": "Step 1：真動詞是 receive → 空格只能是 V-ing／p.p.。be enrolled in（已加入…）→ 修飾名詞用 p.p. enrolled。", "w": "(A)(B)(D) 都是真動詞，會和 receive 重複。"}, {"g": "t_p5fin", "q": "The marketing director _______ that the campaign be extended.", "o": ["to suggest", "suggesting", "suggestion", "has suggested"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "行銷總監建議延長這項活動。", "e": "Step 1：主要子句缺真動詞（be extended 屬於 that 子句）→ 刪掉 V-ing、to V、名詞，選 has suggested。", "w": "(A)(B) 不能當主要動詞；(C) 名詞。"}, {"g": "t_p5fin", "q": "Mr. Cho spent the afternoon _______ the quarterly budget.", "o": ["prepares", "prepared", "prepare", "preparing"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "趙先生花了一整個下午準備季度預算。", "e": "Step 1：真動詞 spent 已存在 → 不能再放真動詞。固定句型 spend ＋ 時間 ＋ V-ing。", "w": "spend＋時間＋V-ing 表示花時間做某事；(A) prepares、(B) prepared、(C) prepare 都不是此結構需要的 V-ing。"}, {"g": "t_p5fin", "q": "The hotel, _______ in 1920, has recently been renovated.", "o": ["build", "built", "builds", "building"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "這間建於 1920 年的飯店最近剛整修完。", "e": "Step 1：真動詞是 has been renovated → 逗號中的插入語不能是真動詞。Step 2：飯店是「被建造」→ p.p. built。", "w": "(A)(C) 真動詞；(D) V-ing 表主動「正在建造」，語意不通。"}, {"g": "t_p5fin", "q": "Visitors to the factory _______ safety goggles at all times.", "o": ["to wear", "wearing", "wear", "wears"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "參觀工廠的訪客必須全程配戴護目鏡。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 Visitors 是複數 → 原形 wear。", "w": "(A)(B) 不能當主要動詞；(D) wears 用於單數主詞。陷阱：factory 是單數，但主詞核心是 Visitors。"}, {"g": "t_p5fin", "q": "The committee decided _______ the proposal until next month.", "o": ["to postpone", "postponing", "postpone", "postponed"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "委員會決定把提案延到下個月。", "e": "Step 1：已有真動詞 decided → 不能再接有時態的動詞。decide ＋ to V。", "w": "decide 表決定做某事時接 to V；(B) postponing、(C) postpone、(D) postponed 均不符合本題句型。"}, {"g": "t_p5fin", "q": "Products _______ after 6 P.M. will be shipped the next business day.", "o": ["ordered", "order", "ordering", "orders"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "晚上六點後訂購的商品將於下一個工作日出貨。", "e": "Step 1：真動詞是 will be shipped → 空格是修飾語。Step 2：商品是「被訂購」→ p.p. ordered。", "w": "(B)(D) 真動詞會重複；(C) V-ing 表主動，商品不會自己下單。"}, {"g": "t_p5fin", "q": "The CEO, _______ the importance of teamwork, praised all departments.", "o": ["emphasized", "emphasizing", "emphasize", "emphasizes"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "執行長強調團隊合作的重要性，並表揚了所有部門。", "e": "Step 1：真動詞是 praised → 插入語不能是真動詞。Step 2：執行長「主動」強調，且後面有受詞 the importance → V-ing。", "w": "(C)(D) 真動詞；(A) p.p. 表被動，但後面有受詞，且執行長不是被強調的對象。"}, {"g": "t_p5fin", "q": "Our accountant _______ all receipts carefully before filing them.", "o": ["checking", "to check", "check", "checks"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "我們的會計師在歸檔前會仔細檢查所有收據。", "e": "Step 1：沒有真動詞（filing 是 V-ing）→ 刪掉 V-ing、to V；主詞單數 → checks。", "w": "(A)(B) 不能當主要動詞；(C) 主詞動詞不一致。"}, {"g": "t_p5fin", "q": "The goal of the workshop is _______ communication between departments.", "o": ["improve", "improves", "to improve", "improvement"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "這個工作坊的目標是改善部門間的溝通。", "e": "Step 1：已有真動詞 is → 空格是主詞補語，不能再放真動詞。The goal is ＋ to V（目標是去做…）。", "w": "(A) improve、(B) improves 不能直接接在 is 後表達目標；(D) improvement 若接 communication 須改成 improvement in communication。本題用 to improve communication 表示要達成的目標。"}, {"g": "t_p5fin", "q": "Anyone _______ assistance should contact the IT department.", "o": ["needs", "needing", "need", "needed"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "任何需要協助的人都應聯絡資訊部。", "e": "Step 1：真動詞是 should contact → 空格修飾 Anyone。Step 2：人「主動需要」，後面有受詞 assistance → V-ing。", "w": "(A)(C) 真動詞會重複；(D) p.p. 表被動語意不通。"}, {"g": "t_p5fin", "q": "When the shipment _______, please notify the warehouse manager.", "o": ["to arrive", "arrive", "arrives", "arriving"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "貨物到達時，請通知倉庫經理。", "e": "When 引導的時間子句以 the shipment 為單數主詞，需要限定動詞 arrives。主要子句 please notify… 為祈使句。時間子句在此用現在式表未來。", "w": "(A)(D) 不是真動詞；(B) 主詞 shipment 是單數，要加 -s。"}, {"g": "t_p5fin", "q": "The documents _______ on the table need to be signed by noon.", "o": ["left", "leaving", "leaves", "leave"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "放在桌上的文件需要在中午前簽好。", "e": "Step 1：真動詞是 need → 空格是修飾語。Step 2：文件是「被留下」→ p.p. left。", "w": "(C)(D) 真動詞；(B) V-ing 表主動，文件不會自己離開。"}, {"g": "t_p5fin", "q": "Mr. Ruiz _______ the conference because of a scheduling conflict.", "o": ["to miss", "having missed", "missing", "missed"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "Ruiz 先生因行程衝突而錯過了會議。", "e": "Step 1：整句沒有真動詞（because of 後面只有名詞）→ 刪掉 V-ing、to V → missed。", "w": "(A)(B)(C) 都不能當主要動詞。"}, {"g": "t_p5fin", "q": "Ms. Ford was the first employee _______ the new safety award.", "o": ["to receive", "receives", "receive", "received"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "Ford 女士是第一位獲得新安全獎的員工。", "e": "Step 1：已有真動詞 was → 不能再放真動詞。the first ＋ 名詞 ＋ to V 是固定句型。", "w": "(B) receives、(C) receive 不能在沒有關係詞的情況下直接作 employee 的後置修飾語；(D) received 不能表達員工主動獲獎。the first employee to receive… 表第一位獲獎的員工。"}, {"g": "t_p5fin", "q": "The software, _______ by our in-house team, is easy to use.", "o": ["develops", "develop", "developed", "developing"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "這套由我們內部團隊開發的軟體很容易使用。", "e": "Step 1：真動詞是 is → 插入語不能是真動詞。Step 2：後面接 by（沒有受詞）→ 被動 p.p. developed。", "w": "(A)(B) 真動詞；(D) V-ing 表主動，但軟體是被開發的。"}, {"g": "t_p5fin", "q": "Although the store _______ at 9 A.M., customers were already waiting outside at 8.", "o": ["opening", "open", "to open", "opened"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "雖然店家九點才開門，顧客八點就已在外面等候。", "e": "Although 引導的子句缺少述語；主詞 the store 是單數，且後文 were waiting 指過去情境，所以選 opened。主要子句已有 were waiting，仍不影響從屬子句需要自己的述語。", "w": "(B) 單數主詞不能用原形；(A)(C) 不是真動詞。"}, {"g": "t_p5fin", "q": "_______ the survey results carefully, the team decided to revise the design.", "o": ["Analyzes", "Having analyzed", "Analyze", "Analyzed"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "仔細分析問卷結果後，團隊決定修改設計。", "e": "Step 1：真動詞是 decided，逗號前沒有連接詞 → 空格不能是真動詞。Step 2：團隊「主動」分析且後面有受詞 → 分詞構句 Having analyzed（先分析、後決定）。", "w": "(C) 原形會變祈使句；(D) p.p. 表被動，後面卻有受詞；(A) 真動詞。"}, {"g": "t_p5fin", "q": "The manager asked us _______ the report by Friday.", "o": ["finished", "to finish", "finishing", "finish"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "經理要求我們在週五前完成報告。", "e": "Step 1：已有真動詞 asked → 不能再放真動詞。ask ＋ 人 ＋ to V。", "w": "ask someone to do something 表要求某人做事；(A) finished、(C) finishing、(D) finish 都不符合本題 ask us ___ the report 的句型。"}, {"g": "t_p5fin", "q": "The director _______ all department heads to a meeting every Monday.", "o": ["inviting", "to invite", "invite", "invites"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "主任每週一都會邀請所有部門主管開會。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 The director 單數＋every Monday 習慣 → invites。", "w": "(A)(B) 不能當主要動詞；(C) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "Passengers _______ to Seoul should proceed to Gate 12.", "o": ["travel", "traveling", "traveled", "travels"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "前往首爾的旅客請到 12 號登機門。", "e": "Step 1：真動詞是 should proceed → 空格修飾 Passengers。Step 2：旅客主動旅行 → V-ing traveling。", "w": "(A)(D) 會變成第二個真動詞；(C) traveled 當 p.p. 表被動，語意不合。"}, {"g": "t_p5fin", "q": "The manager wants _______ the new procedures to all staff.", "o": ["explains", "explain", "to explain", "explained"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "經理想向所有員工說明新程序。", "e": "Step 1：已有真動詞 wants，沒有連接詞 → 不能再放有時態的動詞。want ＋ to V。", "w": "(A)(B)(D) 都會成為第二個真動詞。"}, {"g": "t_p5fin", "q": "The brochures _______ at the trade show contained outdated prices.", "o": ["distributed", "distributing", "distributes", "distribute"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "在商展上發放的手冊上印的是過時的價格。", "e": "Step 1：真動詞是 contained → 空格是修飾語。Step 2：手冊是被發放的 → p.p. distributed。", "w": "(C)(D) 真動詞會重複；(B) V-ing 表主動，手冊不會自己發放。"}, {"g": "t_p5fin", "q": "_______ your login information, please click the link below.", "o": ["Resetting is", "Resets", "To reset", "Reset"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "若要重設登入資訊，請點選下方連結。", "e": "Step 1：逗號後 please click 已是祈使句（真動詞 click），前面沒有連接詞 → 空格不能是真動詞。To V 放句首表目的。", "w": "(D) 原形放句首會變成另一個祈使句，兩句間沒有連接詞；(A)(B) 有時態的動詞。"}, {"g": "t_p5fin", "q": "Ms. Jung _______ the budget proposal to the board yesterday afternoon.", "o": ["presented", "having presented", "presenting", "to present"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "鄭女士昨天下午向董事會提交了預算提案。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V、having p.p. → presented。", "w": "(B)(C)(D) 都不能當主要動詞。"}, {"g": "t_p5fin", "q": "The team leader encouraged everyone _______ new ideas.", "o": ["shared", "to share", "share", "sharing"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "組長鼓勵大家分享新想法。", "e": "Step 1：已有真動詞 encouraged → 不能再放真動詞。encourage ＋ 人 ＋ to V。", "w": "(A)(C) 第二個真動詞；(D) encourage 後面接人時不接 V-ing。"}, {"g": "t_p5fin", "q": "Any items _______ in the lobby will be taken to the lost-and-found office.", "o": ["leaving", "leave", "leaves", "left"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "遺留在大廳的任何物品將送到失物招領處。", "e": "Step 1：真動詞是 will be taken → 空格是修飾語。Step 2：物品是被留下的 → p.p. left。", "w": "(B)(C) 真動詞；(A) V-ing 表主動，物品不會自己離開。"}, {"g": "t_p5fin", "q": "If the client _______ any changes, we will update the contract.", "o": ["requests", "to request", "requesting", "request"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "如果客戶要求任何修改，我們會更新合約。", "e": "Step 1：If 引導的子句需要自己的限定動詞。主句已有 will update，If 子句還缺；主詞單數 → requests（條件子句用現在式）。", "w": "(D) 單數主詞要加 -s；(B)(C) 不是真動詞。"}, {"g": "t_p5fin", "q": "The new employee spent two days _______ the company's policies.", "o": ["learned", "learning", "to learn", "learn"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "新進員工花了兩天學習公司的政策。", "e": "Step 1：已有真動詞 spent → spend ＋ 時間 ＋ V-ing。", "w": "(A)(D) 第二個真動詞；(C) spend 不接 to V。"}, {"g": "t_p5fin", "q": "Staff members _______ to work overtime will receive extra pay.", "o": ["ask", "asks", "asked", "asking"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "被要求加班的員工將獲得額外薪資。", "e": "Step 1：真動詞是 will receive → 空格修飾 Staff members。Step 2：員工是被要求的 → p.p. asked。", "w": "(A)(B) 真動詞；(D) V-ing 表主動「要求別人」，語意不合。"}, {"g": "t_p5fin", "q": "The restaurant _______ a special menu during the festival.", "o": ["offering", "to offer", "offer", "offers"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "這家餐廳在節慶期間提供特別菜單。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V；主詞單數 → offers。", "w": "(A)(B) 不能當主要動詞；(C) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "_______ for its excellent service, the hotel attracts many business travelers.", "o": ["Knows", "Know", "Known", "Knowing"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "這家飯店以優質服務聞名，吸引許多商務旅客。", "e": "Step 1：真動詞是 attracts，逗號前沒有連接詞 → 空格不能是真動詞。Step 2：飯店是「被知道」→ p.p. Known（be known for）。", "w": "(A)(B) 真動詞；(D) V-ing 表主動，飯店不會主動「知道」。"}, {"g": "t_p5fin", "q": "The board plans to vote on the proposal after it _______ the financial report.", "o": ["review", "reviewing", "to review", "reviews"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "董事會打算在審閱財務報告後對提案進行表決。", "e": "Step 1：after 是連接詞 → after 子句需要真動詞。主詞 it（＝the board）單數，時間子句用現在式代替未來 → reviews。", "w": "(B)(C) 不是真動詞；(A) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "The company is looking for ways _______ costs.", "o": ["to reduce", "reduce", "reduced", "reduces"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "公司正在尋找降低成本的方法。", "e": "Step 1：已有真動詞 is looking → 不能再放真動詞。ways ＋ to V（做…的方法）。", "w": "(B)(D) 第二個真動詞；(C) reduced 表被動，後面又有受詞 costs，不合。"}, {"g": "t_p5fin", "q": "_______ in 1985, Ellis Corporation now has offices in 20 countries.", "o": ["Found", "Founded", "Founds", "Founding"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "成立於 1985 年的 Ellis 公司，現在在 20 個國家設有辦公室。", "e": "Step 1：真動詞是 has，逗號前不能再有真動詞。Step 2：公司是被創立的 → p.p. Founded。", "w": "(A)(C) 真動詞；(D) V-ing 表主動「創立別人」，語意不合。"}, {"g": "t_p5fin", "q": "The supervisor reminded the staff _______ the doors before leaving.", "o": ["locked", "to lock", "lock", "locking"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "主管提醒員工離開前要鎖門。", "e": "Step 1：已有真動詞 reminded → remind ＋ 人 ＋ to V。", "w": "(A)(C) 第二個真動詞；(D) remind 接人時不接 V-ing。"}, {"g": "t_p5fin", "q": "The machines in the factory _______ inspected once a month.", "o": ["to be", "being", "are", "is"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "工廠裡的機器每月檢查一次。", "e": "Step 1：整句沒有真動詞 → 刪掉 being、to be。主詞 The machines 是複數 → are。", "w": "(A)(B) 不是真動詞；(D) 被 factory 誤導成單數。"}, {"g": "t_p5fin", "q": "Mr. Brooks, _______ the meeting, thanked everyone for their hard work.", "o": ["opening", "open", "opened", "opens"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "Brooks 先生在會議開場時感謝大家的辛勞。", "e": "Step 1：真動詞是 thanked → 插入語不能是真動詞。Step 2：他主動開場，後面有受詞 the meeting → V-ing opening。", "w": "(B)(D) 真動詞；(C) p.p. 表被動，但後面有受詞。"}, {"g": "t_p5fin", "q": "The goal is _______ customer satisfaction by 15 percent.", "o": ["increase", "increases", "to be increased", "increasing"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "目標是將顧客滿意度提升 15%。", "e": "Step 1：已有真動詞 is → 空格是主詞補語，表示「目標是做某件事」，可用 to V 或 V-ing（動名詞）；後面還有受詞 customer satisfaction，選項中只有主動的 increasing 符合。", "w": "(A)(B) 是動詞原形或第三人稱動詞，不能放在 is 後；(C) to be increased 是被動，但目標是「去提升滿意度」，customer satisfaction 是提升的對象。"}, {"g": "t_p5fin", "q": "When Ms. Kim _______ the office, the meeting had already started.", "o": ["arriving", "to arrive", "arrive", "arrived"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "金女士抵達辦公室時，會議已經開始了。", "e": "Step 1：連接詞 When → When 子句要有真動詞。主句是過去完成式 → When 子句用過去式 arrived。", "w": "(C) 時態與主詞都不合；(A)(B) 不是真動詞。"}, {"g": "t_p5fin", "q": "Customers _______ more than $100 will receive free shipping.", "o": ["spending", "spends", "spend", "spent"], "a": 0, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "消費超過 100 美元的顧客可享免運。", "e": "Step 1：真動詞是 will receive → 空格修飾 Customers。Step 2：顧客主動花錢，後面有受詞 → spending。", "w": "(B)(C) 真動詞；(D) p.p. 表被動，語意不合。"}, {"g": "t_p5fin", "q": "The CEO's decision _______ many employees by surprise.", "o": ["taking", "took", "take", "to take"], "a": 1, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "執行長的決定讓許多員工感到意外。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V；主詞 decision 單數，原形 take 不合 → took。", "w": "(C) 單數主詞不用原形；(A)(D) 不是真動詞。"}, {"g": "t_p5fin", "q": "We need someone _______ the new accounting software.", "o": ["installs", "installed", "to install", "install"], "a": 2, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "我們需要有人來安裝新的會計軟體。", "e": "Step 1：已有真動詞 need → someone ＋ to V（做某事的人）。", "w": "(A)(D) 第二個真動詞；(B) installed 表被動，後面又有受詞。"}, {"g": "t_p5fin", "q": "Although the product _______ well in Europe, it failed in the Asian market.", "o": ["sell", "to sell", "selling", "sold"], "a": 3, "h": "先分出主要子句、從屬子句與修飾片語，確認每個子句的述語。再依句型選限定動詞、to V、V-ing 或 p.p.；不能單靠連接詞數量計算動詞。", "trans": "雖然這項產品在歐洲賣得很好，但在亞洲市場失敗了。", "e": "Step 1：連接詞 Although → 子句需要真動詞；主詞 product 單數，與 failed 時態一致 → sold。", "w": "(B)(C) 不是真動詞；(A) 單數主詞不用原形。"}]}, {"id": "p5_voice", "kind": "toeic", "part": 5, "stage": 2, "title": "主動／被動", "sub": "依主詞與動作的關係判斷主被動，再核對動詞的受詞與補語", "qs": [{"g": "t_p5voice", "q": "The annual report _______ to all shareholders last week.", "o": ["sending", "sent", "was sent", "has sent"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "年度報告上週已寄給所有股東。", "e": "Step 2：主詞是物（報告）；send 是及物動詞，空格後直接接介系詞 to，沒有受詞 → 被動 was sent。last week → 過去式。", "w": "(B)(D) 主動，後面需要受詞；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Ms. Young _______ the contract terms with the supplier yesterday.", "o": ["is negotiated", "negotiated", "was negotiated", "negotiating"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "Young 女士昨天和供應商協商了合約條款。", "e": "Step 2：空格後直接接名詞受詞 the contract terms → 主動。yesterday → 過去式 negotiated。", "w": "(A)(C) 不符合本句 negotiate the contract terms 的主動結構；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "All new employees _______ to complete the online training by Friday.", "o": ["are required", "requiring", "require", "have required"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "所有新進員工必須在週五前完成線上訓練。", "e": "Step 2：空格後是 to V，沒有名詞受詞；員工是「被要求」→ be required to V。", "w": "(C)(D) 主動表示「員工要求…」，語意不通且缺受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The new policy _______ next month.", "o": ["will implement", "has implemented", "implementing", "will be implemented"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "新政策將於下個月實施。", "e": "Step 2：主詞是物（政策）；implement 及物，後面直接接時間 next month、沒有受詞 → 被動 will be implemented。", "w": "(A)(B) 主動需要受詞；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The manager _______ the staff about the schedule change this morning.", "o": ["was informed", "informing", "has been informed", "informed"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "經理今天早上通知員工行程有異動。", "e": "Step 2：空格後直接接受詞 the staff → 主動 informed。", "w": "(A)(C) 不符合本句 inform the staff about the change 的主動結構；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The conference room _______ for the board meeting at 3 P.M.", "o": ["has been reserved", "reserves", "reserving", "has reserved"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "會議室已預約給下午三點的董事會使用。", "e": "Step 2：主詞是物（會議室）；reserve 及物，空格後接介系詞 for → 沒受詞 → 被動 has been reserved。", "w": "(B)(D) 主動需要受詞；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "Several candidates _______ by the hiring committee so far.", "o": ["interview", "interviewing", "have been interviewed", "have interviewed"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "到目前為止，已有數位應徵者接受招募委員會的面試。", "e": "Step 2：空格後接 by（動作執行者）→ 被動。so far → 現在完成式 have been interviewed。", "w": "(A)(D) 主動，後面需要受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The technician _______ the printer within an hour.", "o": ["was repaired", "repaired", "has been repaired", "repairing"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "技師在一小時內修好了印表機。", "e": "Step 2：主詞是人，空格後直接接受詞 the printer → 主動 repaired。", "w": "(A)(C) 被動，表示技師被修理；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "Your order _______ within three business days.", "o": ["will deliver", "delivering", "will be delivered", "delivers"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "您的訂單將在三個工作天內送達。", "e": "Step 2：主詞是物（訂單）；deliver 及物，後面接 within…，沒有受詞 → 被動 will be delivered。", "w": "(A)(D) 主動，訂單不會自己運送；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The museum _______ over two million visitors last year.", "o": ["attracted", "was attracted", "attracting", "has been attracted"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "博物館去年吸引了超過兩百萬名遊客。", "e": "Step 2：雖然主詞是物，但空格後有受詞 over two million visitors → 主動。last year → 過去式。這題提醒：物當主詞「高機率」被動，最後還是要看有沒有受詞。", "w": "(B)(D) 不符合本句 attract visitors 的主動結構；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "Mr. Diaz _______ as the new head of sales at yesterday's meeting.", "o": ["announcing", "was announced", "announces", "announced"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "Diaz 先生在昨天的會議上被宣布為新任業務主管。", "e": "Step 2：announce 及物，空格後是 as…（介系詞），沒有受詞 → 被動 was announced。", "w": "(C)(D) 主動，需要受詞（宣布什麼）；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "The company _______ a new recycling program to reduce waste.", "o": ["launching", "was launched", "has been launched", "has launched"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "公司推出了新的回收計畫以減少廢棄物。", "e": "Step 2：空格後直接接受詞 a new recycling program → 主動 has launched。", "w": "(B)(C) 被動，表示公司被推出；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "The north entrance _______ by security staff every night at 10 P.M.", "o": ["is locked", "has locked", "locking", "locks"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "北側入口每晚十點由保全人員上鎖。", "e": "by security staff 指執行上鎖的人，入口是被上鎖的對象，因此用 is locked；every night 表示規律動作。", "w": "(B) has locked、(D) locks 不能在本句搭配 by security staff 表示入口被人上鎖；(C) locking 缺助動詞。lock 在別的句子可不及物，如 The door locks automatically。"}, {"g": "t_p5voice", "q": "The survey results _______ by the research team next Monday.", "o": ["presenting", "presents", "will present", "will be presented"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "問卷結果將由研究團隊在下週一發表。", "e": "Step 2：後面接 by the research team → 被動；next Monday → 未來 will be presented。", "w": "(B)(C) 主動，結果不會自己發表；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Ms. Allen _______ Employee of the Year for her outstanding service.", "o": ["has named", "naming", "was named", "named"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "Allen 女士因傑出表現被評選為年度最佳員工。", "e": "Step 2：name 的主動句型是 name ＋ 人 ＋ 頭銜（兩個名詞）。這裡空格後只剩一個頭銜，Allen 女士是被命名的人 → 被動 was named。", "w": "(A)(D) 主動，表示她為別人命名，後面卻缺「人」；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The invoices _______ to the accounting department every Friday.", "o": ["have sent", "are se 是真動詞。"}, {"g": "t_p5voice", "q": "All luggage must _______ before boarding.", "o": ["checking", "check", "have checked", "be checked"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "所有行李在登機前都必須經過檢查。", "e": "Step 2：主詞是物（行李），空格後是 before 片語，沒有受詞 → 被動 must be checked。", "w": "(B)(C) 主動，行李不會自己檢查；(A) must 後要接原形。"}, {"g": "t_p5voice", "q": "The meeting _______ until next Tuesday because the director is ill.", "o": ["has been postponed", "postponing", "postponed", "has postponed"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "因為主任生病，會議已延到下週二。", "e": "Step 2：postpone 是及物動詞，空格後接 until，沒有受詞 → 被動 has been postponed。", "w": "(C)(D) 主動，會議不會自己延期，且缺受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The manager _______ the employees' concerns at the staff meeting.", "o": ["was addressed", "has been addressed", "addressed", "addressing"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "經理在員工會議上回應了員工的疑慮。", "e": "Step 2：空格後有受詞 the employees' concerns → 主動 addressed。", "w": "(A)(B) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "The winners _______ by e-mail within two weeks.", "o": ["will be notified", "notifying", "will notify", "notify"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "得獎者將在兩週內收到電子郵件通知。", "e": "Step 2：notify 及物（通知某人），空格後接 by e-mail，沒有受詞 → 被動 will be notified。", "w": "(C)(D) 主動，需要受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "Our company _______ high-quality office furniture for over 40 years.", "o": ["has been manufactured", "is manufactured", "manufacturing", "has manufactured"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "我們公司生產高品質辦公家具已超過 40 年。", "e": "Step 2：空格後有受詞 high-quality office furniture → 主動；for over 40 years → 現在完成式。", "w": "(A)(B) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The parking lot _______ while new lighting is installed.", "o": ["repaves", "will be repaved", "repaving", "will repave"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "在安裝新照明期間，停車場將重新鋪設路面。", "e": "Step 2：主詞是物（停車場），repave 及物，空格後接 while 子句，沒有受詞 → 被動 will be repaved。", "w": "(A)(D) 主動，停車場不會自己鋪路；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The client _______ the final design before it went into production.", "o": ["approving", "approved", "has been approved", "was approved"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "客戶在投入生產前核准了最終設計。", "e": "Step 2：空格後有受詞 the final design → 主動 approved。", "w": "(C)(D) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Several new products _______ at the trade fair next month.", "o": ["displaying", "display", "will display", "will be displayed"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "數項新產品將在下個月的商展中展出。", "e": "Step 2：產品是被展示的，空格後接 at，沒有受詞 → 被動 will be displayed。", "w": "(B)(C) 主動，產品不會自己展示；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "The building's elevators _______ every six months by a licensed technician.", "o": ["inspecting", "inspect", "are inspected", "have inspected"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "大樓電梯每半年由合格技師檢查一次。", "e": "Step 2：後面有 by a licensed technician → 被動 are inspected。", "w": "(B)(D) 主動；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Ms. Novak _______ a promotion after only two years at the firm.", "o": ["was offered", "offering", "offered", "has offered"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "Novak 女士進公司僅兩年就獲得升遷機會。", "e": "Step 2：offer 是雙受詞動詞（offer 人 物）。主詞是收到的人，後面只剩「物」a promotion → 被動 was offered（人被提供某物）。", "w": "(C)(D) 主動表示她提供升遷給別人，但後面缺「人」；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The training session _______ by more than 80 employees.", "o": ["was attended", "has attended", "attending", "attended"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "有 80 多位員工參加了這場訓練課程。", "e": "Step 2：後面接 by ＋ 人 → 被動 was attended。", "w": "(B)(D) 主動，課程不會參加別人；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The marketing department _______ a survey of 1,000 customers.", "o": ["was conducted", "conducted", "has been conducted", "conducting"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "行銷部對 1,000 位顧客進行了調查。", "e": "Step 2：空格後有受詞 a survey → 主動 conducted。", "w": "(A)(C) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "Employees _______ to submit their timesheets every Friday.", "o": ["remind", "reminding", "are reminded", "have reminded"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "員工被提醒每週五要繳交工時表。", "e": "Step 2：remind ＋ 人 ＋ to V 的被動 → 人 be reminded to V；空格後直接接 to V，沒有受詞 → 被動。", "w": "(A)(D) 主動，需要受詞（提醒誰）；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The products _______ in recyclable packaging to reduce waste.", "o": ["have shipped", "ship", "shipping", "are shipped"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "產品以可回收的包裝運送，以減少廢棄物。", "e": "Step 2：產品是被運送的，空格後接介系詞 in，沒受詞 → 被動 are shipped。", "w": "(A)(B) 主動，產品不會自己運送；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The CEO _______ the company's new strategy in her speech.", "o": ["has been outlined", "outlining", "outlined", "was outlined"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "執行長在演講中概述了公司的新策略。", "e": "Step 2：空格後有受詞 the company's new strategy → 主動 outlined。", "w": "(A)(D) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "A new manager _______ to lead the Seoul branch.", "o": ["appoints", "appointing", "has appointed", "has been appointed"], "a": 3, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "一位新經理已被任命領導首爾分店。", "e": "Step 2：appoint 及物（任命某人），空格後接 to V，沒有受詞 → 被動 has been appointed。", "w": "(A)(C) 主動，需要受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "These documents must _______ by the end of the day.", "o": ["be signed", "signing", "sign", "have signed"], "a": 0, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "這些文件必須在今天結束前簽好。", "e": "Step 2：文件是被簽的，空格後接 by the end of the day（時間），沒有受詞 → 被動 be signed。", "w": "(C)(D) 主動，文件不會自己簽；(B) must 後要接原形。"}, {"g": "t_p5voice", "q": "The technician _______ the new software on all computers yesterday.", "o": ["has been installed", "installed", "was installed", "installing"], "a": 1, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "技師昨天在所有電腦上安裝了新軟體。", "e": "Step 2：空格後有受詞 the new software → 主動 installed。", "w": "(A)(C) 被動表示主詞承受動作，但主詞在這裡是動作的執行者；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "Free samples _______ to the first 100 visitors.", "o": ["will give", "giving", "will be given", "give"], "a": 2, "h": "先判斷主詞是動作執行者還是承受者，再檢查該動詞的及物性、受詞與補語。沒有受詞不一定是被動，有些被動句也可保留另一個受詞。", "trans": "前 100 名訪客將獲贈免費樣品。", "e": "Step 2：樣品是被贈送的，空格後接 to，沒有受詞 → 被動 will be given。", "w": "(A)(D) 主動，樣品不會自己送；(B) 不是真動詞。"}]}, {"id": "p5_tense", "kind": "toeic", "part": 5, "stage": 2, "title": "時態線索", "sub": "結合時間線索與事件關係；for、currently、recently 不限定唯一時態", "qs": [{"g": "t_p5tense", "q": "Ms. Hughes _______ for the company since 2015.", "o": ["has worked", "worked", "works", "will work"], "a": 0, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "Hughes 女士自 2015 年起就在這家公司工作。", "e": "本句表示從 2015 年開始任職並延續到現在，用 has worked。時間用法的 since 是線索，仍須依整句時間關係判斷。", "w": "(B) worked 只敘述過去任職，未表達本句延續至今；(C) works 不表此段已累積的任職期間；(D) will work 指未來。不能推成任何出現 since 的句子都只能用現在完成式。"}, {"g": "t_p5tense", "q": "By the end of next year, the company _______ five new stores.", "o": ["opens", "has opened", "will have opened", "opened"], "a": 2, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "到明年年底，公司將已開設五家新店。", "e": "Step 3：by ＋ 未來時間 → 未來完成式 will have ＋ p.p.。", "w": "(A)(B)(D) 都無法表達「到未來某時已完成」。"}, {"g": "t_p5tense", "q": "The supplier _______ the shipment yesterday afternoon.", "o": ["will send", "sends", "has sent", "sent"], "a": 3, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "供應商昨天下午寄出了這批貨。", "e": "Step 3：yesterday（過去明確時間點）→ 過去式 sent。", "w": "(C) 現在完成式不能搭配明確的過去時間；(A)(B) 時態不合。"}, {"g": "t_p5tense", "q": "Over the past five years, our sales _______ steadily.", "o": ["will increase", "have increased", "increase", "are increasing"], "a": 1, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "過去五年來，我們的銷售額穩定成長。", "e": "Step 3：over the past ＋ 一段時間 → 現在完成式 have increased。", "w": "(C)(D) 現在式不搭 over the past…；(A) 未來式不合。"}, {"g": "t_p5tense", "q": "The new manager _______ next Monday.", "o": ["has started", "started", "will start", "had started"], "a": 2, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "新經理將於下週一到職。", "e": "Step 3：next Monday（未來時間）→ 未來式 will start。", "w": "(A)(B)(D) 都是過去或完成時態。"}, {"g": "t_p5tense", "q": "By the time the CEO arrives, the presentation _______.", "o": ["began", "will have begun", "has begun", "begins"], "a": 1, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "等執行長到的時候，簡報應該已經開始了。", "e": "Step 3：by the time ＋ 現在式（arrives）→ 主句用未來完成式 will have ＋ p.p.。", "w": "(A)(C)(D) 無法表達「到未來那時已經發生」。"}, {"g": "t_p5tense", "q": "Mr. Lopez _______ the report last Friday.", "o": ["completed", "has completed", "completes", "will complete"], "a": 0, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "Lopez 先生上週五完成了報告。", "e": "Step 3：last Friday（過去明確時間點）→ 過去式 completed。", "w": "(B) 現在完成式不搭配明確過去時間；(C)(D) 時態不合。"}, {"g": "t_p5tense", "q": "Our company _______ in the industry for more than 30 years and continues to serve customers today.", "o": ["is", "was", "will be", "has been"], "a": 3, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "我們公司在這個產業已有三十多年的歷史，至今仍持續服務顧客。", "e": "for more than 30 yea iz _______ three industry conferences so far this year.", "o": ["will attend", "has attended", "attends", "attended"], "a": 1, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "Ortiz 女士今年到目前為止已參加了三場產業會議。", "e": "Step 3：so far（到目前為止）→ 現在完成式 has attended。", "w": "(C) 現在簡單式表習慣；(D) 過去式不搭 so far；(A) 未來式不合「已參加」。"}, {"g": "t_p5tense", "q": "If the client _______ the contract tomorrow, we will start the project on Monday.", "o": ["signed", "will sign", "has signed", "signs"], "a": 3, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "如果客戶明天簽約，我們週一就開始執行專案。", "e": "Step 3：if 條件子句表未來時，用現在式代替未來式 → signs。", "w": "(B) 條件子句不用 will；(A)(C) 時態不合。"}, {"g": "t_p5tense", "q": "By the end of this week, we _______ all the job applications.", "o": ["reviewed", "review", "will have reviewed", "have reviewed"], "a": 2, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "到本週結束前，我們將審完所有求職申請。", "e": "Step 3：by the end of ＋ 未來時間 → will have ＋ p.p.。", "w": "(A)(B)(D) 無法表達「到未來某時已完成」。"}, {"g": "t_p5tense", "q": "The board _______ the merger proposal at yesterday's meeting.", "o": ["has approved", "approved", "will approve", "approves"], "a": 1, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "董事會在昨天的會議上通過了合併提案。", "e": "Step 3：yesterday's meeting（明確過去時間）→ 過去式 approved。", "w": "(A) 不搭明確過去時間；(C)(D) 時態不合。"}, {"g": "t_p5tense", "q": "Mr. Lee _______ for the company for 15 years next month.", "o": ["will have worked", "worked", "has worked", "will work"], "a": 0, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "到下個月，李先生就在這家公司服務滿 15 年了。", "e": "Step 3：for ＋ 一段時間 ＋ 未來時間點（next month）→ 未來完成式 will have worked。", "w": "(D) 單純未來式無法表達「累積到那時滿 15 年」；(B) 過去式；(C) 現在完成式不搭 next month。"}, {"g": "t_p5tense", "q": "Since its opening, the restaurant _______ several awards.", "o": ["wins", "has won", "will win", "won"], "a": 1, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "自開幕以來，這家餐廳已獲得數個獎項。", "e": "Step 3：Since ＋ 過去時間（its opening）→ has won。", "w": "(A)(C)(D) 都不搭 since。"}, {"g": "t_p5tense", "q": "The manager _______ a decision on the matter yet.", "o": ["had not been made", "does not make", "has not made", "will not make"], "a": 2, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "經理尚未對這件事做出決定。", "e": "Step 3：句尾 yet（尚未）→ 現在完成式否定 has not made。", "w": "(A) 被動且是過去完成式，後面卻有受詞 a decision；(B)(D) 現在簡單式、未來式不搭 yet。"}, {"g": "t_p5tense", "q": "Ms. Brown _______ the report when the fire alarm went off.", "o": ["was writing", "has written", "writes", "will write"], "a": 0, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "火警警報響起時，Brown 女士正在寫報告。", "e": "Step 3：when ＋ 過去式（went off）表示當時正在進行的動作被打斷 → 過去進行式 was writing。", "w": "(B)(C)(D) 時態與過去時間點不合。"}, {"g": "t_p5tense", "q": "Our sales _______ by 10 percent last quarter.", "o": ["have increased", "will increase", "increase", "increased"], "a": 3, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "我們的銷售額上一季增加了 10%。", "e": "Step 3：last quarter（明確過去時間）→ 過去式 increased。", "w": "(A) 不搭明確過去時間；(B)(C) 時態不合。"}, {"g": "t_p5tense", "q": "The company _______ new employees every spring.", "o": ["hired", "will have hired", "hires", "has hired"], "a": 2, "h": "找時間線索並確認動作是否延續至今、早於另一事件，或預計於未來完成。for、currently、recently 都不能單獨決定時態。", "trans": "公司每年春天都會招募新員工。", "e": "Step 3：every spring（反覆、習慣）→ 現在簡單式 hires。", "w": "(A)(B)(D) 不表示固定習慣。"}]}, {"id": "p5_chunk", "kind": "toeic", "part": 5, "stage": 3, "title": "固定搭配", "sub": "不背單字中文，背「字＋介系詞」的整塊搭配", "qs": [{"g": "t_p5chunk", "q": "All factory workers must _______ with the new safety regulations.", "o": ["observe", "comply", "obey", "follow"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "所有工廠員工都必須遵守新的安全規定。", "e": "搭配：comply with ＋ 規定。看到空格後是 with，四個「遵守」中只有 comply 接 with。", "w": "follow / obey / observe 都是及物動詞，直接接受詞，不加 with。"}, {"g": "t_p5chunk", "q": "Full-time employees are _______ for the annual bonus.", "o": ["capable", "able", "possible", "eligible"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "全職員工有資格領取年終獎金。", "e": "搭配：be eligible for ＋ 補助／獎金／晉升（有資格獲得）。", "w": "be capable of；be able to V；possible 不用來形容人有資格。"}, {"g": "t_p5chunk", "q": "Passengers are asked to _______ from smoking anywhere in the airport.", "o": ["avoid", "stop", "refrain", "prevent"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "請旅客在機場內任何地方都不要吸菸。", "e": "搭配：refrain from ＋ V-ing（克制不做）。看到 from ＋ V-ing 就選 refrain。", "w": "avoid / stop 直接接 V-ing，不加 from；prevent 要用 prevent sb from V-ing，中間要有受詞。"}, {"g": "t_p5chunk", "q": "The two companies finally _______ an agreement after months of negotiations.", "o": ["reached", "came", "arrived", "went"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "經過數月協商，兩家公司終於達成協議。", "e": "搭配：reach an agreement / a consensus / a decision（達成）。reach 是及物動詞，直接接受詞。", "w": "arrive at、come to 才能接 agreement，空格後沒有介系詞；go 不搭。"}, {"g": "t_p5chunk", "q": "To put the approved plan into practice, the new manager will _______ a policy that allows flexible working hours.", "o": ["implement", "perform", "proceed", "oppose"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "為了將核准的計畫付諸實行，新經理將實施允許彈性工時的政策。", "e": "put…into practice 明確表示「付諸實行」，對應 implement a policy。", "w": "(B) perform 不用於本句「實施政策」；(C) proceed 須另有 with 等結構；(D) oppose 表反對，與付諸實行相反。"}, {"g": "t_p5chunk", "q": "Ms. Kim is _______ for managing the company's social media accounts.", "o": ["capable", "aware", "responsible", "dependent"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "金女士負責管理公司的社群媒體帳號。", "e": "搭配：be responsible for ＋ N／V-ing（負責）。", "w": "capable of；dependent on；aware of，介系詞都不是 for。"}, {"g": "t_p5chunk", "q": "The team w
