(A) V-ing 表主動「正在指定」，語意不合；(B) 名詞，designation meeting room 不是慣用說法。"}, {"n": 142, "p": 2, "g": "t_p6gram", "q": "", "o": ["will be able to", "have been able to", "had been able to", "were able to"], "a": 0, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "請在週一前回覆，確認您能出席。", "e": "面試在 5 月 8 日，是未來的事 → will be able to attend。", "w": "(B)(C)(D) 都表示過去或已完成，與尚未發生的面試矛盾。"}, {"n": 143, "p": 3, "g": "t_p6word", "q": "", "o": ["throughout", "while", "among", "during"], "a": 0, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "工人會在整棟建築安裝新照明。", "e": "後面接名詞 the building，語意是「遍及整棟大樓」→ throughout。", "w": "(D) during 接一段期間，不接地點；(B) while 是連接詞；(C) among 接複數的一群人或物。"}, {"n": 144, "p": 3, "g": "t_p6word", "q": "", "o": ["costs", "fees", "fares", "prices"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "閉館期間到期的書可在重新開館後歸還，不收逾期費。", "e": "固定說法 late fees（逾期費、滯納金）。", "w": "prices、costs、fares 不與 late 構成「逾期罰款」的意思；fares 指車資。"}, {"n": 145, "p": 3, "g": "t_p6sent", "q": "", "o": ["The book drop will also be closed during this period.", "The Oakdale Branch Library is closed for renovations as well.", "Late fees have been increased to $1 per day.", "Other library locations will remain open as usual."], "a": 3, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "其他分館將照常開放。", "e": "後一句具體介紹 Oakdale 分館會延長開放，(D) 先說「其他分館照常開放」，再舉例說明，銜接最自然。", "w": "(A) 與上一段「還書箱持續開放」矛盾；(B) 與下一句「Oakdale 分館延長開放」矛盾；(C) 與上一段「不收逾期費」矛盾。"}, {"n": 146, "p": 3, "g": "t_p6gram", "q": "", "o": ["welcome", "to welcome", "welcoming", "welcomed"], "a": 2, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "期待在煥然一新的館舍迎接您。", "e": "look forward to 的 to 是介系詞，後面接 V-ing → welcoming。", "w": "(A)(B) 原形或 to V 不能接在介系詞 to 後；(D) p.p. 語意變成被動。"}]}, {"id": "p6_3", "kind": "toeic", "part": 6, "title": "Part 6 Test 3", "sub": "4 篇文章 × 4 題（含句子插入題）．先讀空格前後句再作答", "passages": [{"kind": "電子郵件 E-mail", "head": "To: Maria Gonzalez\nFrom: Bright Paper Supplies\nSubject: Your order #48213", "text": "Dear Ms. Gonzalez,\n\nThank you for your recent order. Unfortunately, one of the items you ordered, the A4 copy paper, is temporarily out of stock. We expect to receive a new {{131}} from our supplier next Wednesday.\n\nThe rest of your order {{132}} yesterday and should arrive by Friday. The copy paper will be sent separately as soon as it becomes available. {{133}}\n\n{{134}}, if you would prefer to cancel the copy paper from your order, simply reply to this e-mail, and we will issue a full refund for that item.\n\nSincerely,\nBright Paper Supplies Customer Care", "trans": "Gonzalez 女士您好：感謝您近期的訂購。很抱歉，您訂購的 A4 影印紙暫時缺貨，我們預計下週三會收到供應商的新貨。訂單中的其他商品已於昨天寄出，應在週五前送達；影印紙到貨後會另外寄送，第二次寄送不會向您加收任何運費。或者，如果您想取消影印紙，只要回覆這封郵件，我們會全額退還該項商品的費用。", "en": "Questions 131-134 refer to the following e-mail."}, {"kind": "備忘錄 Memo", "head": "To: All Staff\nFrom: Facilities Management\nDate: September 2", "text": "The north parking lot will be repaved next week. Work will begin on Monday, September 9, and is expected to {{135}} by Thursday. During this time, the north lot will be closed to all vehicles.\n\nEmployees who usually park in the north lot should use the south lot {{136}}. Because the south lot has fewer spaces, we encourage staff to carpool or take public transportation if possible. {{137}}\n\nWe understand that this may cause some {{138}}, and we thank you for your patience.", "trans": "北側停車場下週將重新鋪設路面。工程將於 9 月 9 日週一開始，預計週四前完成，期間北側停車場禁止所有車輛進入。平常停北側的員工請改停南側。由於南側車位較少，建議盡量共乘或搭乘大眾運輸，櫃台可購買優惠公車票。我們了解這可能造成一些不便，感謝大家的耐心。", "en": "Questions 135-138 refer to the following memo."}, {"kind": "報導 Article", "head": "SEOUL (March 20)", "text": "TravelMate, a popular travel-booking app, has released a new version that lets users book train tickets in addition to flights and hotels. The update is now {{139}} for both iOS and Android devices.\n\nThe company said the new feature was developed in response to user feedback. \"Many of our customers told us they wanted to plan {{140}} entire trip in one place,\" said product manager Jiwon Lee.\n\nTravelMate now has more than five million users in Asia. {{141}} The company also plans to expand into Europe, {{142}} it will partner with several national railway operators.", "trans": "熱門訂票 App TravelMate 推出新版本，除了機票與飯店，使用者現在也能訂火車票。更新已開放 iOS 與 Android 裝置下載。公司表示，新功能是根據使用者意見開發的。產品經理 Jiwon Lee 說：「很多顧客告訴我們，他們想在同一個地方規劃整趟旅程。」TravelMate 目前在亞洲有五百多萬名使用者，預計明年底將倍增。公司也計畫進軍歐洲，並將在當地與數家國營鐵路業者合作。", "en": "Questions 139-142 refer to the following article."}, {"kind": "信件 Letter", "head": "Dear Dr. Ahmed,", "text": "On behalf of the Riverside Business Association, I would like to thank you for speaking at our annual conference last Friday. Your presentation on digital marketing was one of the most {{143}} sessions of the day.\n\nMany attendees told us that they found your advice practical and easy to apply. {{144}} Several members have already asked whether you would be willing to return next year.\n\nAs a token of our {{145}}, we have enclosed a gift certificate for dinner at the Lakeside Restaurant. We hope you will enjoy {{146}}.\n\nWith sincere thanks,\nPaula Grant\nPresident, Riverside Business Association", "trans": "Ahmed 博士您好：謹代表 Riverside 商業協會，感謝您上週五在年會上演講。您關於數位行銷的簡報是當天最受歡迎的場次之一。許多與會者表示您的建議實用又容易應用。事實上，您的場次在我們的問卷中獲得最高評分，已有數位會員詢問您明年是否願意再來。為表謝意，隨信附上 Lakeside 餐廳的晚餐禮券，希望您會喜歡。", "en": "Questions 143-146 refer to the following letter."}], "qs": [{"n": 131, "p": 0, "g": "t_p6word", "q": "", "o": ["ship", "shipper", "shipped", "shipment"], "a": 3, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "我們預計下週三會收到供應商的新貨。", "e": "a new ＋ ＿：形容詞 new 後面需要名詞，而且是從供應商「收到」的東西 → shipment（一批貨）。", "w": "(A) 動詞（或名詞「船」，語意不合）；(C) 過去式／p.p.；(B) shipper 是貨運業者，不會從供應商那裡「收到」。"}, {"n": 132, "p": 0, "g": "t_p6gram", "q": "", "o": ["was shipped", "is shipping", "will ship", "ships"], "a": 0, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "訂單中的其他商品已於昨天寄出。", "e": "時間線索 yesterday → 過去式；訂單是「被寄出」→ 被動 was shipped。", "w": "(B)(D) 現在式與 yesterday 不合；(C) 未來式與 yesterday 矛盾。"}, {"n": 133, "p": 0, "g": "t_p6sent", "q": "", "o": ["Your entire order will therefore arrive next Wednesday.", "The copy paper has already been delivered to your office.", "You will not be charged any additional shipping fees for the second delivery.", "We have canceled the rest of your order."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "第二次寄送不會向您加收任何運費。", "e": "前一句說影印紙會「另外寄送」，(C) 接著說明第二次寄送不加收運費，順著同一件事補充。", "w": "(A) 與前文「其他商品週五前送達、影印紙另寄」矛盾；(B) 與「影印紙缺貨、到貨後另寄」矛盾；(D) 與「其他商品已於昨天寄出」矛盾。"}, {"n": 134, "p": 0, "g": "t_p6conn", "q": "", "o": ["Therefore", "Alternatively", "Similarly", "As a result"], "a": 1, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "或者，如果您想取消影印紙，只要回覆這封郵件即可。", "e": "前一段的方案是「之後另寄」，這一段提供另一個選擇「取消並退款」→ Alternatively（或者、另一個選擇是）。", "w": "(A)(D) 表因果；(C) 表相似，語意都不合。"}, {"n": 135, "p": 1, "g": "t_p6gram", "q": "", "o": ["completing", "completion", "completed", "be completed"], "a": 3, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "工程預計週四前完成。", "e": "主詞 Work（工程）是「被完成」的一方，complete 後面沒有受詞 → is expected to be completed。", "w": "(B) 名詞，to completion 前要有動詞（如 come to completion）；(A)(C) 不能接在不定詞 to 後面。"}, {"n": 136, "p": 1, "g": "t_p6conn", "q": "", "o": ["instead", "instead of", "rather", "alternative"], "a": 0, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "平常停北側的員工請改停南側。", "e": "空格在句尾，後面沒有名詞 → 副詞 instead（改為、取而代之）。", "w": "(B) instead of 是介系詞片語，後面要接名詞；(C) rather 不單獨放句尾表「改為」；(D) alternative 是名詞／形容詞。"}, {"n": 137, "p": 1, "g": "t_p6sent", "q": "", "o": ["The south lot will also be closed next week.", "Bus passes are available at a discount from the front desk.", "Carpooling is not permitted in the south lot.", "The north lot will reopen on Monday, September 9."], "a": 1, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "櫃台可購買優惠公車票。", "e": "前一句鼓勵共乘或搭大眾運輸，(B) 提供具體協助（優惠公車票），自然延續。", "w": "(A) 與前文「請改停南側」矛盾；(C) 與前一句「鼓勵共乘」矛盾；(D) 9 月 9 日是開工日，與「週四前完工、施工期間封閉」矛盾。"}, {"n": 138, "p": 1, "g": "t_p6word", "q": "", "o": ["disrupt", "disruptively", "disruption", "disruptive"], "a": 2, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "我們了解這可能造成一些不便。", "e": "some ＋ ＿，且是 cause 的受詞 → 名詞 disruption（干擾、不便）。", "w": "(A) 動詞；(D) 形容詞；(B) 副詞，都不能當受詞。"}, {"n": 139, "p": 2, "g": "t_p6word", "q": "", "o": ["eligible", "capable", "available", "responsible"], "a": 2, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "更新已開放 iOS 與 Android 裝置下載。", "e": "語意：更新「可以取得、可使用」→ available for ＋ 裝置。", "w": "(B) 有能力的；(A) 有資格的；(D) 負責的，都不能形容軟體更新可供使用。"}, {"n": 140, "p": 2, "g": "t_p6gram", "q": "", "o": ["theirs", "their", "them", "they"], "a": 1, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "他們想在同一個地方規劃整趟旅程。", "e": "空格後是名詞片語 entire trip → 所有格 their（指 customers）。", "w": "(D) 主格；(C) 受格；(A) 所有格代名詞，後面不能再接名詞。"}, {"n": 141, "p": 2, "g": "t_p6sent", "q": "", "o": ["Most of these users live in Europe.", "The app will stop offering hotel bookings next month.", "That number has declined since the update was released.", "That number is expected to double by the end of next year."], "a": 3, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "預計明年底這個數字將倍增。", "e": "前一句提到「五百多萬名使用者」，(D) 的 That number 正好指這個數字，並延伸到未來成長，接著再說擴展到歐洲，邏輯連貫。", "w": "(A) 與前一句「使用者在亞洲」矛盾，下一句才說要進軍歐洲；(B) 與「除了機票與飯店，還能訂火車票」的報導重點矛盾；(C) 與前文的成長脈絡矛盾，也沒有任何根據。"}, {"n": 142, "p": 2, "g": "t_p6gram", "q": "", "o": ["where", "when", "which", "what"], "a": 0, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "公司也計畫進軍歐洲，並將在當地與數家國營鐵路業者合作。", "e": "先行詞是地點 Europe，空格後 it will partner with… 是完整子句 → 關係副詞 where（在那裡）。", "w": "(C) which 後面的子句要缺主詞或受詞；(B) when 的先行詞要是時間；(D) what 不接先行詞。"}, {"n": 143, "p": 3, "g": "t_p6word", "q": "", "o": ["popularity", "popular", "popularly", "popularize"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "您的簡報是當天最受歡迎的場次之一。", "e": "the most ＋ ＿ ＋ 名詞 sessions：最高級修飾名詞 → 形容詞 popular。", "w": "(C) 副詞；(A) 名詞；(D) 動詞，都不能修飾 sessions。"}, {"n": 144, "p": 3, "g": "t_p6sent", "q": "", "o": ["Unfortunately, few attendees found your advice useful.", "Your presentation has been moved to next year's conference.", "In fact, your session received the highest rating in our survey.", "Please let us know if you are unable to attend."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "事實上，您的場次在我們的問卷中獲得最高評分。", "e": "前一句說與會者覺得建議實用，(C) 用 In fact 進一步提出具體證據，後一句再說會員希望他明年再來，全段都在讚美演講。", "w": "(A) 與前一句「與會者覺得建議實用」矛盾；(B) 演講已在上週五完成，與第一段矛盾；(D) 年會已經結束，這句話不合時序。"}, {"n": 145, "p": 3, "g": "t_p6word", "q": "", "o": ["appreciation", "appreciative", "appreciatively", "appreciate"], "a": 0, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "為表謝意，隨信附上晚餐禮券。", "e": "固定說法 as a token of our appreciation（聊表謝意）；our 後面需要名詞。", "w": "(D) 動詞；(B) 形容詞；(C) 副詞，都不能接在所有格 our 後當名詞。"}, {"n": 146, "p": 3, "g": "t_p6gram", "q": "", "o": ["them", "theirs", "its", "it"], "a": 3, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "希望您會喜歡。", "e": "enjoy 需要受詞，指前面提到的單數 a gift certificate for dinner → it。", "w": "(A) them 是複數，前面沒有複數名詞；(C) its 是所有格，後面要接名詞；(B) theirs 語意不合。"}]}]);
/* ===== Part 7 閱讀測驗題庫（79 題．同步獨立檔案 toeic_part7.json）===== */
const P7_DATA={"tags": {"t_p7main": {"n": "Part 7 · 主旨與目的", "t": "從信件主旨欄（Subject）、首段開頭或公告標題快速掌握寫作目的與文章核心，避免誤選只涵蓋局部段落的細節選項。"}, "t_p7detail": {"n": "Part 7 · 細節與事實查證", "t": "利用題幹中的人名、日期、金額、地點或專有名詞回原文定位，注意正確答案常以「同義改寫（paraphrase）」呈現。"}, "t_p7not": {"n": "Part 7 · 是非判斷（NOT 題）", "t": "針對 NOT / FALSE 題型，將四個選項逐一回原文核對，排除三個與原文相符的敘述，找出未提及或與原文矛盾的選項。"}, "t_p7infer": {"n": "Part 7 · 推論與暗示", "t": "針對 imply / suggest / most likely 題型，必須以原文提供的客觀線索為依據做合理推導，切勿過度延伸文中沒有的資訊。"}, "t_p7vocab": {"n": "Part 7 · 同義字與句意理解", "t": "測驗一字多義或特定句子的言外之意，務必將選項代入原句上下文，檢查語氣與商業邏輯是否完全吻合。"}, "t_p7sent": {"n": "Part 7 · 句子插入", "t": "分析待插入句中的代名詞（this、these、such）、轉折詞與時態，檢查 [1] [2] [3] [4] 哪個位置前後文銜接最自然。"}, "t_p7cross": {"n": "Part 7 · 跨篇整合（雙篇／三篇）", "t": "找出各篇文章的共同關聯點（訂單、日期、場次、價目表、人名），把一篇的條件和另一篇的資訊交叉比對才能得出正解；三篇閱讀常要先在第二、三篇找出變動，再回第一篇查規則或數字。"}}, "exams": [{"id": "p7_t1", "kind": "toeic", "part": 7, "title": "Part 7 Test 1", "sub": "正式結構：單篇 147–175、雙篇 176–185、三篇 186–200", "passages": [{"kind": "手機簡訊討論串 Text Message Chain (Questions 159–161)", "head": "Participants: Liam Chen, Priya Nair, Derek Moss", "text": "Liam Chen (11:15 A.M.):\nHi Priya and Derek. I'm at the convention center setting up our booth for the CleanTech Expo, but I only see three boxes of promotional tote bags. Didn't we order five boxes?\n\nPriya Nair (11:17 A.M.):\nWe did. Five boxes were delivered to the office yesterday afternoon. Wait—Derek loaded the company van this morning. Derek, did all five make it in?\n\nDerek Moss (11:20 A.M.):\nOh, no! I just checked the storage closet by the loading dock. Two boxes were sitting behind the poster stands, so I missed them when loading the van. I'm really sorry about that.\n\nLiam Chen (11:22 A.M.):\nDon't worry about it. The expo floor doesn't open to attendees until 2:00 P.M., and three boxes are more than enough for the afternoon session anyway.\n\nDerek Moss (11:24 A.M.):\nI'm driving over at 1:30 P.M. to take the first shift at the booth with you, Liam. I can easily put the remaining two boxes in the trunk of my car and bring them straight to Hall B.\n\nPriya Nair (11:26 A.M.):\nThat works out well. While you're still at the office, Derek, could you also grab the extra power strip from my desk drawer? The booth lighting needs an extra outlet.\n\nDerek Moss (11:27 A.M.):\nConsider it done! See you both soon.", "trans": "Liam Chen (上午 11:15)：\n嗨 Priya、Derek。我人正在會展中心布置我們 CleanTech 博覽會的攤位，但我只看到三箱宣傳托特包。我們不是訂了五箱嗎？\n\nPriya Nair (上午 11:17)：\n我們確實訂了五箱。昨天下午有五箱送到辦公室。等等——今天早上是 Derek 把東西搬上公司廂型車的。Derek，五箱都有搬上車嗎？\n\nDerek Moss (上午 11:20)：\n糟了！我剛去檢查了卸貨區旁邊的儲藏室。有兩箱放在海報架後面，所以我裝車時漏掉了。真的很抱歉。\n\nLiam Chen (上午 11:22)：\n別擔心。展場下午 2:00 才對與會者開放，而且不管怎樣，三箱應付下午的場次已經綽綽有餘了。\n\nDerek Moss (上午 11:24)：\nLiam，我下午 1:30 會開車過去跟你一起負責攤位的第一班輪值。我可以順便把剩下的兩箱放進我後車廂，直接帶去 B 展廳。\n\nPriya Nair (上午 11:26)：\n那太好了。Derek，趁你還在辦公室，可以幫我從我辦公桌抽屜拿那條備用延長線嗎？攤位燈光需要多一個插座。\n\nDerek Moss (上午 11:27)：\n包在我身上！待會見。", "en": "Questions 147-148 refer to the following text-message chain."}, {"kind": "徵才啟事 Advertisement (Questions 156–158)", "head": "Vanguard Logistics — Regional Fleet Coordinator (Denver, CO)", "text": "Vanguard Logistics, a premier freight and cold-chain transportation provider serving the Mountain West, is seeking a detail-oriented Regional Fleet Coordinator to join our Denver operations center.\n\nKey Responsibilities:\n• Monitor daily dispatch schedules for a fleet of 65 refrigerated delivery trucks.\n• Coordinate preventive maintenance and emergency repairs with certified external service garages.\n• Review driver electronic logs to ensure full compliance with federal transportation safety regulations.\n• Prepare monthly fuel-efficiency and on-time delivery reports for senior management.\n\nQualifications:\n• Bachelor's degree in supply chain management, business administration, or a related field (or at least four years of equivalent dispatch experience).\n• Proficiency in fleet-tracking software and spreadsheet analysis.\n• Strong problem-solving skills and the ability to handle time-sensitive routing changes calmly.\n• Commercial driver's license (CDL) is NOT required, though familiarity with cold-storage freight handling is a distinct advantage.\n\nApplication Process:\nInterested candidates should submit a résumé and a brief cover letter to careers@vanguardlogistics.com by November 10. Please include job code Den-FC26 in the subject line. Only applicants selected for an initial video interview will be contacted.", "trans": "Vanguard 物流公司是服務美國山間西部地區的頂尖貨運與冷鏈運輸供應商，目前正徵求一位注重細節的「區域車隊協調員」加入我們的丹佛營運中心。\n\n主要職責：\n• 監控 65 輛冷藏配送卡車車隊的每日派遣時程。\n• 與認證的外部維修廠協調預防性保養及緊急維修事宜。\n• 審查駕駛員電子行車紀錄，確保完全符合聯邦運輸安全法規。\n• 為高階管理層編製每月的燃油效率與準時交貨報告。\n\n資格條件：\n• 供應鏈管理、企業管理或相關領域學士學位（或至少四年同等派遣調度工作經驗）。\n• 熟練操作車隊追蹤軟體與試算表分析。\n• 具備強大的問題解決能力，能冷靜應對具時效壓力的路線變更。\n• 「不」需具備職業駕照（CDL），但熟悉冷藏貨運處理者尤佳。\n\n應徵方式：\n有意應徵者請於 11 月 10 日前將履歷與簡短求職信寄至 careers@vanguardlogistics.com，並請於郵件主旨欄註明職缺代碼 Den-FC26。僅獲選參加初試視訊面試的應徵者會收到聯繫。", "en": "Questions 149-150 refer to the following advertisement."}, {"kind": "網頁政策 Webpage (Questions 165–167)", "head": "Nordic Home Goods — Return & Exchange Policy", "text": "We want you to be completely satisfied with your purchase from Nordic Home Goods. If an item does not meet your expectations, you may return or exchange it within 30 calendar days of the delivery date.\n\nEligibility Conditions:\n• Items must be unused, unassembled, and in their original packaging with all hardware and instruction manuals included.\n• Custom-upholstered sofas, clearance items marked \"Final Sale,\" and opened bedding sets cannot be returned unless they arrive damaged.\n\nHow to Initiate a Return:\n1. Log in to your account at www.nordichomegoods.com/returns and enter your order number.\n2. Print the prepaid return shipping label generated by the portal.\n3. Drop off the package at any authorized courier location within 7 days of generating the label.\n\nRefunds & Fees:\n• For standard returns, a flat return shipping fee of $15 will be deducted from your refund. However, if you opt for a store credit voucher or an exchange of equal value, the $15 shipping fee is waived.\n• If an item arrives defective or damaged in transit, please email photos of the damage to support@nordichomegoods.com within 48 hours of delivery for a free replacement.\n• Refunds are credited to the original payment method within 5 to 7 business days after our warehouse inspects the returned merchandise.", "trans": "我們希望您對在 Nordic Home Goods 購買的商品完全滿意。若商品未達您的期望，您可於交貨日起 30 個日曆天內辦理退換貨。\n\n符合退貨條件：\n• 商品必須為全新未使用、未組裝，且保留原始包裝及所有五金零件與說明書。\n• 客製化布料沙發、標示「出清特賣（Final Sale）」之商品，以及已拆封的寢具組，除運送過程損壞外，恕不接受退貨。\n\n如何申請退貨：\n1. 登入 www.nordichomegoods.com/returns 帳戶並輸入您的訂單編號。\n2. 列印系統產生的預付退貨託運單。\n3. 於產生託運單後 7 天內，將包裹交寄至任何授權快遞據點。\n\n退款與費用：\n• 一般退貨將自退款金額中扣除 15 美元的固定退貨運費。但若您選擇折換商店購物金抵用券或等值換貨，則免收 15 美元運費。\n• 若商品送達時有瑕疵或於運送途中受損，請於交貨後 48 小時內將損壞照片寄至 support@nordichomegoods.com，以免費換領新品。\n• 我們的倉庫檢驗完退回商品後，退款將於 5 至 7 個工作天內退回原付款方式。", "en": "Questions 151-152 refer to the following Web page."}, {"kind": "服務帳單明細 Invoice (Questions 171–173)", "head": " Apex Event Catering — Invoice #INV-9034", "text": "Client: Horizon Biotech Inc. (Attn: Samuel Lindqvist)\nEvent Date: September 24\nEvent Location: Horizon Biotech Conference Hall, Boston\nInvoice Date: September 26 | Payment Due: October 26\n\n------------------------------------------------------------\nItem Description                     Qty    Unit Price   Total\n------------------------------------------------------------\n1. Executive Morning Coffee & Pastry  60     $14.00      $840.00\n   Service (8:30 A.M.)\n2. Mediterranean Hot Lunch Buffet     60     $32.00    $1,920.00\n   (Includes vegetarian & vegan options)\n3. Afternoon Sparkling Water & Fruit  60      $8.00      $480.00\n   Platter (3:00 P.M.)\n4. On-site Serving Staff (4 servers,   6    $120.00      $720.00\n   billed per hour)\n------------------------------------------------------------\nSubtotal:                                              $3,960.00\nCorporate Partner Discount (10% on food & beverage):    -$324.00\nDelivery & Setup Fee (Waived for orders over $2,500):      $0.00\nTotal Amount Due:                                      $3,636.00\n\nNotes:\n• A 50% deposit ($1,818.00) was paid by corporate credit card on September 10.\n• Remaining balance ($1,818.00) is payable via bank transfer or check within 30 days of the invoice date. Late payments are subject to a 2% monthly finance charge.", "trans": "Apex 活動外燴公司 — 發票編號 #INV-9034\n客戶：Horizon 生技公司（收件人：Samuel Lindqvist）\n活動日期：9 月 24 日\n活動地點：波士頓 Horizon 生技公司會議廳\n開立日期：9 月 26 日｜付款期限：10 月 26 日\n\n------------------------------------------------------------\n項目說明                             數量    單價        小計\n------------------------------------------------------------\n1. 主管早間咖啡與糕點服務             60     $14.00      $840.00\n   (上午 8:30)\n2. 地中海風味熱食自助午餐             60     $32.00    $1,920.00\n   (含蛋奶素與全素餐點)\n3. 午間氣泡水與水果拼盤               60      $8.00      $480.00\n   (下午 3:00)\n4. 現場服務人員（4 名服務生，          6    $120.00      $720.00\n   按小時計費）\n------------------------------------------------------------\n小計：                                                 $3,960.00\n企業夥伴折扣（餐飲項目享 9 折）：                       -$324.00\n運送與布置費（訂單滿 $2,500 免收）：                       $0.00\n應付總額：                                             $3,636.00\n\n備註：\n• 50% 訂金（$1,818.00）已於 9 月 10 日以公司信用卡付清。\n• 剩餘尾款（$1,818.00）請於發票開立日起 30 天內以銀行匯款或支票支付。逾期付款將按月加收 2% 財務滯納金。", "en": "Questions 153-154 refer to the following invoice."}, {"kind": "電子郵件 E-mail (Questions 147–149)", "head": "To: Nadia Haddad <nhaddad@crestviewdesign.com>\nFrom: Marcus Vance <mvance@oakridgeprinting.com>\nDate: April 14\nSubject: Brochure Order #4082", "text": "Dear Ms. Haddad,\n\nThank you for choosing Oakridge Printing for your upcoming trade show materials. We have finished reviewing the digital files you uploaded this morning for the tri-fold product brochures (Order #4082).\n\nBefore we proceed with the full print run of 2,500 copies, our prepress team noticed that two photographs on the inside panel have a resolution lower than our recommended 300 DPI. While we can still print the brochures as submitted, the images may appear slightly blurry in the final product.\n\nIf you would like to send replacement high-resolution images, please upload them to your client portal by 3:00 P.M. tomorrow, April 15. Doing so will allow us to keep your original delivery date of April 19. Otherwise, any updates received after tomorrow afternoon will push the delivery back by two business days.\n\nPlease let me know how you would like to proceed.\n\nBest regards,\nMarcus Vance\nProduction Coordinator, Oakridge Printing", "trans": "Haddad 女士您好：\n\n感謝您選擇 Oakridge 印刷公司製作您即將舉辦之商展的文宣品。我們已審查完您今天早上為三折頁產品宣傳冊（訂單編號 #4082）上傳的數位檔案。\n\n在我們正式進行 2,500 份的完整印刷之前，我們的印前作業團隊發現內頁有兩張照片的解析度低於我們建議的 300 DPI。雖然我們仍可照目前提交的檔案直接印製，但成品中的圖片可能會看起來稍微模糊。\n\n如果您希望補寄高解析度的替換圖片，請於明天（4 月 15 日）下午 3 點前上傳至您的客戶專區。這樣做能讓我們維持原定的 4 月 19 日交貨日期。否則，明天下午之後才收到的任何更新，都會使交貨日順延兩個工作天。\n\n請告知我們您希望如何處理。\n\n誠摯地，\nOakridge 印刷公司製作協調員\nMarcus Vance", "en": "Questions 155-157 refer to the following e-mail."}, {"kind": "顧客通知 Notice (Questions 153–155)", "head": " Lumina Botanical Gardens — Seasonal Visitor Notice", "text": "Thank you for visiting Lumina Botanical Gardens! Please take note of several updates taking effect this autumn (October 1–November 30):\n\n1. Glasshouse Conservatory Closure\nThe Tropical Glasshouse will be closed to the public from October 12 through October 26 while technicians install a climate-control filtration system. All outdoor trails, the Japanese Maple Pavilion, and the Orchid Gallery will remain open during regular hours (8:30 A.M. to 6:00 P.M. daily).\n\n2. Reduced Admission & Member Perks\nDuring the two-week Glasshouse closure, general adult admission will be reduced from $18 to $14. In addition, annual pass holders may bring one guest free of charge on any weekday in October.\n\n3. Guided Walking Tours\nComplimentary 45-minute walking tours focusing on autumn foliage depart from the Visitor Center patio at 10:30 A.M. and 2:00 P.M. every Saturday and Sunday. Space is limited to 20 participants per group; sign-up sheets are available at the information desk starting at 8:30 A.M. on the day of the tour.\n\n4. Café Relocation\nWhile the main Garden Café terrace is being repaved, light refreshments and bottled beverages can be purchased at the pop-up kiosk next to the gift shop.", "trans": "感謝您造訪 Lumina 植物園！請留意今年秋季（10 月 1 日至 11 月 30 日）生效的幾項更新：\n\n1. 溫室保育館閉館\n熱帶溫室將於 10 月 12 日至 10 月 26 日暫停對外開放，期間技術人員將安裝恆溫空調過濾系統。所有戶外步道、日本楓葉館與蘭花展廳將於正常營業時間（每日上午 8:30 至下午 6:00）照常開放。\n\n2. 門票折抵與會員福利\n在溫室閉館的兩週期間，成人一般門票將由 18 美元調降為 14 美元。此外，年度通行證持有人於 10 月份的任何平日皆可免費攜帶一位同行貴賓入園。\n\n3. 導覽步行團\n聚焦秋季賞楓的 45 分鐘免費步行導覽團，每週六、週日上午 10:30 及下午 2:00 自遊客中心露台出發。每梯次名額限 20 人；導覽當日上午 8:30 起可於服務台登記報名。\n\n4. 咖啡廳位置調整\n在花園咖啡廳主露台重新鋪面期間，遊客可於禮品店旁的快閃服務亭購買輕食點心與瓶裝飲料。", "en": "Questions 158-160 refer to the following notice."}, {"kind": "線上團隊對話 Online Chat Discussion (Questions 168–170)", "head": "Channel: #product-launch-q4", "text": "Hannah Cho (2:05 P.M.):\nTeam, quick update on the Aurora Smart Lamp launch event in Chicago on November 6. The Grand Ballroom at the Drake Hotel just informed us that their ceiling projector is undergoing repairs that week, so we need a backup display plan for the keynote demo.\n\nVictor Alvarez (2:07 P.M.):\nThat's frustrating. Can we rent a large LED video wall from a local audiovisual vendor in Chicago?\n\nHannah Cho (2:09 P.M.):\nI already called two AV rental companies. An LED wall costs $3,200 for a single day, which puts us $1,400 over our remaining event budget. However, the hotel offered to reduce our room rental fee by $800 because of the broken projector.\n\nMei-Ling Wu (2:12 P.M.):\nWait—if the hotel gives us an $800 credit, we're only $600 short. Remember that we decided yesterday to print digital QR-code handouts instead of glossy booklets? That saved $950 in printing costs.\n\nHannah Cho (2:14 P.M.):\nYou're right, Mei-Ling! I hadn't updated the master spreadsheet with the printing savings yet. That means we can cover the LED wall after all.\n\nVictor Alvarez (2:16 P.M.):\nFantastic! The LED screen will actually look much sharper than a standard projector in a bright room. I'll adjust the presentation slides to widescreen 16:9 format this afternoon so they fit the LED wall properly.", "trans": "Hannah Cho (下午 2:05)：\n各位，快速更新一下 11 月 6 日芝加哥 Aurora 智慧檯燈發表會的狀況。Drake 飯店的大宴會廳剛通知我們，他們的天花板投影機那週正好要維修，所以我們的主題示範需要備用的顯示器方案。\n\nVictor Alvarez (下午 2:07)：\n真傷腦筋。我們能不能向芝加哥當地的影音設備廠商租借大型 LED 電視牆？\n\nHannah Cho (下午 2:09)：\n我已經問過兩家影音租賃公司了。LED 電視牆租一天要 3,200 美元，這會比我們剩餘的活動預算超出 1,400 美元。不過，因為投影機故障，飯店主動提議幫我們折抵 800 美元的場地租金。\n\nMei-Ling Wu (下午 2:12)：\n等等——如果飯店折抵 800 美元，我們就只差 600 美元。還記得我們昨天決定印製數位 QR 碼單張，而不印亮面小冊子嗎？那筆印刷費省下了 950 美元。\n\nHannah Cho (下午 2:14)：\n妳說得對，Mei-Ling！我還沒把省下的印刷費更新到總試算表裡。這表示我們終究還是負擔得起那面 LED 電視牆。\n\nVictor Alvarez (下午 2:16)：\n太棒了！在明亮的廳房裡，LED 螢幕看起來其實會比一般投影機清晰得多。我今天下午會把簡報投影片調整成 16:9 寬螢幕格式，好完美配合 LED 電視牆。", "en": "Questions 161-163 refer to the following online chat discussion."}, {"kind": "內部備忘錄 Memo (Questions 150–152)", "head": "To: All Seattle Office Staff\nFrom: Elena Rostova, Facilities Director\nDate: August 3\nSubject: Lobby Security Upgrade and ID Badges", "text": "Beginning Monday, August 17, the main lobby of our Seattle headquarters will use an automated turnstile system to enhance building security. [1] All employees will be required to scan a new chip-enabled photo ID badge to enter the workspace.\n\nTo prepare for this transition, the Security Office in Room 104 will take new photographs and issue replacement badges next week from August 10 to August 14. [2] To avoid long lines, staff members are asked to visit Room 104 according to the schedule below:\n\n• Floors 2–3 (Marketing & Sales): Monday–Tuesday, 9:00 A.M.–4:00 P.M.\n• Floors 4–5 (Product & Engineering): Wednesday–Thursday, 9:00 A.M.–4:00 P.M.\n• Floor 6 (Finance, HR & Legal): Friday, 9:00 A.M.–3:00 P.M.\n\n[3] Please bring your current employee badge with you, as it must be surrendered before a new one can be issued. Employees who are traveling on business next week may obtain their new badge upon returning, but they will need to sign in at the reception desk to receive a temporary day pass until their permanent badge is printed. [4]", "trans": "自 8 月 17 日（週一）起，我們西雅圖總部的一樓大廳將啟用自動旋轉門禁系統，以強化大樓安全。[1] 所有員工進入辦公區域時，都必須掃描新版內建晶片的附照片員工證。\n\n為準備此次轉換，104 室的安全辦公室將於下週 8 月 10 日至 8 月 14 日為員工拍攝新照片並核發新證件。[2] 為避免大排長龍，請同仁依下列時程前往 104 室辦理：\n\n• 2–3 樓（行銷與業務部）：週一至週二，上午 9:00–下午 4:00\n• 4–5 樓（產品與工程部）：週三至週四，上午 9:00–下午 4:00\n• 6 樓（財務、人資與法務部）：週五，上午 9:00–下午 3:00\n\n[3] 請務必攜帶您目前的員工證，因為必須先繳回舊證才能核發新證。下週因公出差的員工可在返院／返社後領取新證，但在正式新證印出前，須先在一樓接待櫃台登記領取臨時單日通行證。[4]", "en": "Questions 164-167 refer to the following memo."}, {"kind": "新聞報導 Article (Questions 162–164)", "head": "PORTLAND (May 18) — Business Weekly", "text": "Cascadia Roasters, a specialty coffee chain based in Portland, Oregon, announced yesterday that it will acquire Sunbelt Bakery, a family-owned wholesale pastry producer in Eugene. Financial terms of the agreement were not disclosed, though industry analysts estimate the deal to be worth approximately $12 million.\n\nFounded twelve years ago by CEO Clara Jennings, Cascadia Roasters currently operates 38 cafés across Oregon and Washington. For the past four years, Sunbelt Bakery has been the primary supplier of croissants, muffins, and artisan bread for Cascadia's southern Oregon locations. [1]\n\n\"Bringing Sunbelt Bakery into the Cascadia family is a natural next step for us,\" said Ms. Jennings at Tuesday's press briefing. \"It allows us to guarantee consistent quality across all our stores while introducing freshly baked gluten-free items to our Seattle and Tacoma branches for the first time.\" [2]\n\nUnder the agreement, Sunbelt Bakery's Eugene facility will be expanded by 15,000 square feet this autumn, creating 25 new full-time baking and packaging jobs. [3] Sunbelt's current director of operations, Mateo Silva, will stay on to oversee the Eugene plant and report directly to Ms. Jennings. [4]", "trans": "波特蘭（5 月 18 日）—《商業週刊》\n\n總部位於奧勒岡州波特蘭的精品連鎖咖啡品牌 Cascadia Roasters 昨日宣布，將收購位於尤金市（Eugene）的家族經營批發烘焙製造商 Sunbelt Bakery。該協議的財務條款並未公開，但產業分析師估計這筆交易價值約 1,200 萬美元。\n\nCascadia Roasters 由執行長 Clara Jennings 於十二年前創立，目前在奧勒岡州與華盛頓州經營 38 間咖啡館。過去四年來，Sunbelt Bakery 一直是 Cascadia 南奧勒岡州各分店可頌、瑪芬與手工麵包的主要供應商。[1]\n\nJennings 女士在週二的記者會上表示：「將 Sunbelt Bakery 納入 Cascadia 大家庭對我們而言是順理成章的下一步。這不僅能讓我們確保所有門市的品質一致，更能首次將新鮮現烤的無麩質烘焙品引進我們的西雅圖與塔科馬分店。」[2]\n\n根據該協議，Sunbelt Bakery 位於尤金市的廠房將於今年秋季擴建 15,000 平方英尺，創造 25 個新的全職烘焙與包裝工作機會。[3] Sunbelt 現任營運總監 Mateo Silva 將留任，繼續管理尤金廠並直接向 Jennings 女士報告。[4]", "en": "Questions 168-171 refer to the following article."}, {"kind": "新聞稿 Press Release (Questions 174–176)", "head": "For Immediate Release — October 8\nAether Mobility Launches Bike-Sharing Program in Austin", "text": "AUSTIN, TX — Aether Mobility today unveiled AetherRide, an electric-assist bicycle-sharing network designed to make short urban commutes faster and more sustainable. Starting October 15, residents and visitors will be able to unlock 800 pedal-assist e-bikes parked at 65 solar-powered docking stations across downtown Austin and the University District.\n\nUnlike dockless scooters that are often left on sidewalks, AetherRide bicycles must be returned to an official docking station at the end of each trip. The stations recharge the bikes' batteries automatically using overhead solar canopies.\n\n\"We worked closely with the Austin Department of Transportation for over a year to select station locations near bus hubs and major employment centers,\" said Aether Mobility Chief Operating Officer Kenji Takahashi. \"Our goal is to bridge the 'first-and-last-mile' gap for public transit riders.\"\n\nSingle rides cost $1.50 to unlock plus $0.20 per minute. Commuters can also purchase a Monthly Unlimited Pass for $29, which covers unlimited rides of up to 45 minutes each. To celebrate the launch, anyone who downloads the AetherRide mobile app before October 31 will receive three complimentary 30-minute rides.", "trans": "立即發布 — 10 月 8 日\nAether Mobility 於奧斯汀推出共享單車計畫\n\n德州奧斯汀訊 — Aether Mobility 今日發表了 AetherRide 電動輔助共享單車網路，旨在讓都會短程通勤更快速且更具永續性。自 10 月 15 日起，居民與遊客將可在奧斯汀市中心與大學區共 65 座太陽能充電樁站點，解鎖租借 800 輛電動輔助自行車。\n\n不同於常被隨意停放在人行道上的無樁滑板車，AetherRide 自行車在每趟行程結束後都必須歸還至官方站點。站點會利用頂棚的太陽能板自動為單車電池充電。\n\nAether Mobility 營運長高橋健司表示：「我們與奧斯汀交通局密切合作超過一年，挑選靠近公車轉運站與主要就業中心的站點位置。我們的目標是為大眾運輸乘客銜接『第一哩與最後一哩路』的落差。」\n\n單次騎乘解鎖費為 1.50 美元，另加每分鐘 0.20 美元。通勤族也可購買每月 29 美元的月票（Monthly Unlimited Pass），可享不限次數、每次最長 45 分鐘的騎乘。為慶祝服務上線，凡於 10 月 31 日前下載 AetherRide 手機應用程式者，皆可獲贈三次免費的 30 分鐘騎乘體驗。", "en": "Questions 172-175 refer to the following press release."}, {"kind": "雙篇閱讀 Double Passage (Questions 177–181)", "docs": [{"kind": "第一篇：研討會時程表 Conference Schedule", "head": "Pacific Northwest Retail Summit — Friday, November 14 (Grandview Convention Center)", "text": "Morning Workshops (10:00 A.M.–11:30 A.M.)\n• Session A1 (Room 201): Building Customer Loyalty Programs — Led by Sonia Verma, VP of Marketing at Kestrel Apparel\n• Session A2 (Room 204): Sustainable Packaging Solutions — Led by Dr. Julian Cho, GreenLeaf Materials\n• Session A3 (Room 208): AI-Driven Inventory Forecasting — Led by Trevor Nairn, Chief Data Officer at NexaMart\n\nNetworking Luncheon (11:45 A.M.–1:15 P.M., Crystal Ballroom)\n• Keynote Address: \"The Future of Omnichannel Commerce\" by Maya Lin, Author & Retail Strategist\n\nAfternoon Workshops (1:30 P.M.–3:00 P.M.)\n• Session B1 (Room 201): E-Commerce Checkout Optimization — Led by Carlos Mendez, StripeFlow\n• Session B2 (Room 204): Managing Seasonal Supply Chains — Led by Hannah Lind, Harbor Freight\n• Session B3 (Room 208): Storefront Visual Merchandising — Led by Chloe Park, Studio Verve\n\n*Note: Workshop rooms have a strict capacity limit. Attendees who wish to switch sessions must submit a change request via the summit app by November 10."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: Summit Registration Desk <events@pnwretailsummit.org>\nFrom: Greg Holloway <gholloway@alpineoutdoor.com>\nDate: November 11\nSubject: Registration #RS-7741 — Workshop Question", "text": "Hello,\n\nI am registered to attend the Pacific Northwest Retail Summit this Friday. When I signed up last month, I selected Session A2 for the morning slot and Session B2 for the afternoon slot.\n\nHowever, our company's logistics manager, Fiona Bell, is now also attending the summit and has signed up for Session B2 as well. So that we can cover more topics between the two of us, I would like to attend the afternoon workshop on improving online checkout rates instead.\n\nI tried to update my schedule in the summit mobile app this morning, but the option to modify workshops was locked. Is there any way I can still make this change, or are seats still available in that room?\n\nThank you,\nGreg Holloway\nE-Commerce Specialist, Alpine Outdoor Gear"}], "text": "[第一篇：研討會時程表]\nPacific Northwest Retail Summit — Friday, November 14 (Grandview Convention Center)\nMorning Workshops (10:00 A.M.–11:30 A.M.)\n• Session A1 (Room 201): Building Customer Loyalty Programs — Led by Sonia Verma\n• Session A2 (Room 204): Sustainable Packaging Solutions — Led by Dr. Julian Cho\n• Session A3 (Room 208): AI-Driven Inventory Forecasting — Led by Trevor Nairn\nNetworking Luncheon (11:45 A.M.–1:15 P.M., Crystal Ballroom)\n• Keynote Address: \"The Future of Omnichannel Commerce\" by Maya Lin\nAfternoon Workshops (1:30 P.M.–3:00 P.M.)\n• Session B1 (Room 201): E-Commerce Checkout Optimization — Led by Carlos Mendez\n• Session B2 (Room 204): Managing Seasonal Supply Chains — Led by Hannah Lind\n• Session B3 (Room 208): Storefront Visual Merchandising — Led by Chloe Park\n*Note: Attendees who wish to switch sessions must submit a change request via the summit app by November 10.\n\n[第二篇：電子郵件]\nTo: Summit Registration Desk\nFrom: Greg Holloway\nDate: November 11\nSubject: Registration #RS-7741\nI am registered to attend the Pacific Northwest Retail Summit this Friday. I selected Session A2 for the morning slot and Session B2 for the afternoon slot. However, our logistics manager, Fiona Bell, is now also attending and signed up for Session B2. So that we can cover more topics, I would like to attend the afternoon workshop on improving online checkout rates instead. I tried to update my schedule in the summit app this morning, but the option was locked.", "trans": "【第一篇：研討會時程表】\n太平洋西北地區零售高峰會 — 11 月 14 日（週五）（Grandview 會展中心）\n上午工作坊 (10:00 A.M.–11:30 A.M.)\n• 場次 A1 (201 室)：建立顧客忠誠度計畫 — Kestrel 服飾行銷副總 Sonia Verma 主講\n• 場次 A2 (204 室)：永續包裝解決方案 — GreenLeaf 材料公司 Julian Cho 博士主講\n• 場次 A3 (208 室)：AI 驅動之庫存預測 — NexaMart 資料長 Trevor Nairn 主講\n交流午宴 (11:45 A.M.–1:15 P.M.，水晶宴會廳)\n• 主題演講：「全通路商務的未來」— 作家兼零售策略家 Maya Lin 主講\n下午工作坊 (1:30 P.M.–3:00 P.M.)\n• 場次 B1 (201 室)：電商結帳流程最佳化 — StripeFlow 公司 Carlos Mendez 主講\n• 場次 B2 (204 室)：季節性供應鏈管理 — Harbor 貨運 Hannah Lind 主講\n• 場次 B3 (208 室)：店面視覺陳列設計 — Studio Verve 公司 Chloe Park 主講\n*備註：工作坊教室有嚴格人數限制。欲更換場次的與會者須於 11 月 10 日前透過高峰會 App 提交變更申請。\n\n【第二篇：電子郵件】\n收件人：高峰會報到櫃台｜寄件人：Greg Holloway｜日期：11 月 11 日\n您好：我已報名參加本週五的太平洋西北地區零售高峰會。我上個月報名時，上午時段選了場次 A2，下午時段選了場次 B2。不過，我們公司的物流經理 Fiona Bell 現在也要參加高峰會，而且也報名了場次 B2。為了讓我們兩人能涵蓋更多主題，我想改聽下午關於提升線上結帳率的工作坊。我今天早上試著在高峰會手機 App 裡更新行程，但修改工作坊的選項已經被鎖定了。請問我還有辦法更改嗎？或者該教室是否還有空位？", "en": "Questions 176-180 refer to the following schedule and e-mail."}, {"kind": "雙篇閱讀 Double Passage (Questions 182–186)", "docs": [{"kind": "第一篇：飯店促銷廣告 Advertisement", "head": "The Crestwood Suites — Corporate Stay & Meet Package", "text": "Located just ten minutes from Manchester International Airport, The Crestwood Suites offers everything business travelers need for a productive stay.\n\nBook our Corporate Stay & Meet Package for groups of 10 or more guests and enjoy:\n• Spacious executive suites with ergonomic workstations and complimentary high-speed Wi-Fi\n• Hot breakfast buffet included each morning in the Atrium Dining Room\n• Round-trip airport shuttle service running every 30 minutes\n• 25% discount on full-day conference room rentals\n\nConference Room Rates (Standard Full-Day Price before discount):\n• Cedar Boardroom (Up to 12 people): $240/day\n• Maple Room (Up to 25 people): $400/day\n• Oak Hall (Up to 60 people): $680/day\n\n*Special Bonus: Groups that reserve at least 15 guest suites for two or more consecutive nights will receive complimentary afternoon coffee and pastry service during their meeting."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: Group Reservations <groups@crestwoodsuites.co.uk>\nFrom: Arthur Pendelton <apendelton@veritaspharma.co.uk>\nDate: February 4\nSubject: Group Booking Inquiry — March 18–20", "text": "Dear Group Reservations Team,\n\nI am writing to arrange accommodations and meeting space for Veritas Pharma's regional training seminar. Our group of 18 sales representatives will arrive on the evening of Wednesday, March 18, and check out on Friday, March 20. Each representative will require an individual suite under your Corporate Stay & Meet Package.\n\nIn addition, we will need a conference room for a full-day training session on Thursday, March 19, that can comfortably seat all 18 participants plus two visiting instructors.\n\nPlease send me a formal quote that includes the discounted conference room rate and confirms whether our booking qualifies for the complimentary afternoon refreshment service mentioned in your advertisement.\n\nSincerely,\nArthur Pendelton\nTraining Coordinator, Veritas Pharma"}], "text": "[第一篇：飯店促銷廣告]\nThe Crestwood Suites — Corporate Stay & Meet Package\nBook for groups of 10 or more guests and enjoy:\n• Executive suites with complimentary Wi-Fi\n• Hot breakfast buffet included\n• Round-trip airport shuttle every 30 minutes\n• 25% discount on full-day conference room rentals\nConference Room Rates (Standard Full-Day Price before discount):\n• Cedar Boardroom (Up to 12 people): $240/day\n• Maple Room (Up to 25 people): $400/day\n• Oak Hall (Up to 60 people): $680/day\n*Special Bonus: Groups that reserve at least 15 guest suites for two or more consecutive nights will receive complimentary afternoon coffee and pastry service.\n\n[第二篇：電子郵件]\nTo: Group Reservations\nFrom: Arthur Pendelton\nDate: February 4\nSubject: Group Booking Inquiry — March 18–20\nOur group of 18 sales representatives will arrive on Wednesday, March 18, and check out on Friday, March 20. Each representative will require an individual suite under your Corporate Stay & Meet Package. We will need a conference room for a full-day session on Thursday, March 19, for 18 participants plus two instructors.", "trans": "【第一篇：飯店促銷廣告】\nThe Crestwood Suites — 企業住宿與會議專案\n距離曼徹斯特國際機場僅十分鐘車程，為商務旅客提供高效住宿所需的一切。\n10 人以上團體預訂「企業住宿與會議專案」即可享有：\n• 配備人體工學工作桌與免費高速 Wi-Fi 的寬敞主管套房\n• 每日早晨於中庭餐廳享用免費熱食自助早餐\n• 每 30 分鐘一班的往返機場接駁車服務\n• 全日會議室租借享 75 折優惠（25% discount）\n\n會議室費用（折扣前之標準全日定價）：\n• 雪松董事會議室（最多 12 人）：每日 $240\n• 楓木廳（最多 25 人）：每日 $400\n• 橡木廳（最多 60 人）：每日 $680\n*特別禮遇：凡預訂至少 15 間客房且連續住宿兩晚以上之團體，於會議期間可獲贈免費午間咖啡與糕點服務。\n\n【第二篇：電子郵件】\n收件人：團體訂房部｜寄件人：Arthur Pendelton｜日期：2 月 4 日｜主旨：團體訂房洽詢 — 3 月 18 日至 20 日\n您好：我來信欲為 Veritas 製藥的區域培訓研討會安排住宿與會議空間。我們共有 18 位業務代表，將於 3 月 18 日（週三）傍晚抵達，並於 3 月 20 日（週五）退房。每位代表都需要一間適用貴飯店「企業住宿與會議專案」的獨立套房。此外，我們在 3 月 19 日（週四）需要一間全日訓練會議室，須能舒適容納全部 18 位學員外加 2 位客座講師。請寄給我一份正式報價單，包含折扣後的會議室費用，並確認我們的預訂是否符合貴飯店廣告中提及的免費午間茶點服務資格。", "en": "Questions 181-185 refer to the following advertisement and e-mail."}, {"kind": "三篇閱讀 Triple Passage (Questions 186–190)", "docs": [{"kind": "第一篇：網頁 Web Page", "head": "Ridgeline Office Furniture — Standing Desk Collection", "text": "Model SD-100 \"Basic\" — $289\nManual crank height adjustment | Desktop: 120 × 60 cm | Finishes: white, black\n\nModel SD-200 \"Pro\" — $449\nElectric motor with 3 memory presets | Desktop: 140 × 70 cm | Finishes: white, black, walnut\n\nModel SD-300 \"Executive\" — $629\nDual electric motors with 4 memory presets and built-in USB charging ports | Desktop: 160 × 80 cm | Finishes: black, walnut\n\nOrders of five or more desks qualify for free delivery and assembly. Walnut finishes are made to order and usually ship within three weeks; all other finishes ship within five business days."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: sales@ridgelinefurniture.com\nFrom: Tanya Brooks <tbrooks@linwoodaccounting.com>\nDate: May 6\nSubject: Order request", "text": "Hello,\n\nLinwood Accounting would like to order six SD-200 standing desks for our new office on Grant Street. We chose this model because we need desks with electric height adjustment that can save at least three height settings. Built-in USB ports are not necessary, as each workstation already has a charging hub. To match our new conference table, we would like the walnut finish.\n\nOur new office opens on June 2, so the desks must be delivered and assembled before that date. Please confirm the total cost and the delivery schedule.\n\nThank you,\nTanya Brooks\nOffice Manager, Linwood Accounting"}, {"kind": "第三篇：電子郵件 E-mail", "head": "To: Tanya Brooks <tbrooks@linwoodaccounting.com>\nFrom: Owen Pratt <opratt@ridgelinefurniture.com>\nDate: May 7\nSubject: RE: Order request", "text": "Dear Ms. Brooks,\n\nThank you for your order of six SD-200 desks. Because you are ordering more than five desks, delivery and assembly will be free of charge.\n\nUnfortunately, our walnut veneer supplier has informed us of a production delay. Walnut desks ordered this week are now expected to ship on June 9. If you need the desks sooner, we can ship the same model in black within five business days. Alternatively, you may keep the walnut order, and we will provide temporary desks at no cost until your permanent desks arrive.\n\nPlease let me know which option you prefer by May 9.\n\nBest regards,\nOwen Pratt\nSales Representative, Ridgeline Office Furniture"}], "text": "[第一篇：網頁 Web Page]\nRidgeline Office Furniture — Standing Desk Collection\nModel SD-100 \"Basic\" — $289\nManual crank height adjustment | Desktop: 120 × 60 cm | Finishes: white, black\n\nModel SD-200 \"Pro\" — $449\nElectric motor with 3 memory presets | Desktop: 140 × 70 cm | Finishes: white, black, walnut\n\nModel SD-300 \"Executive\" — $629\nDual electric motors with 4 memory presets and built-in USB charging ports | Desktop: 160 × 80 cm | Finishes: black, walnut\n\nOrders of five or more desks qualify for free delivery and assembly. Walnut finishes are made to order and usually ship within three weeks; all other finishes ship within five business days.\n\n[第二篇：電子郵件 E-mail]\nTo: sales@ridgelinefurniture.com\nFrom: Tanya Brooks <tbrooks@linwoodaccounting.com>\nDate: May 6\nSubject: Order request\nHello,\n\nLinwood Accounting would like to order six SD-200 standing desks for our new office on Grant Street. We chose this model because we need desks with electric height adjustment that can save at least three height settings. Built-in USB ports are not necessary, as each workstation already has a charging hub. To match our new conference table, we would like the walnut finish.\n\nOur new office opens on June 2, so the desks must be delivered and assembled before that date. Please confirm the total cost and the delivery schedule.\n\nThank you,\nTanya Brooks\nOffice Manager, Linwood Accounting\n\n[第三篇：電子郵件 E-mail]\nTo: Tanya Brooks <tbrooks@linwoodaccounting.com>\nFrom: Owen Pratt <opratt@ridgelinefurniture.com>\nDate: May 7\nSubject: RE: Order request\nDear Ms. Brooks,\n\nThank you for your order of six SD-200 desks. Because you are ordering more than five desks, delivery and assembly will be free of charge.\n\nUnfortunately, our walnut veneer supplier has informed us of a production delay. Walnut desks ordered this week are now expected to ship on June 9. If you need the desks sooner, we can ship the same model in black within five business days. Alternatively, you may keep the walnut order, and we will provide temporary desks at no cost until your permanent desks arrive.\n\nPlease let me know which option you prefer by May 9.\n\nBest regards,\nOwen Pratt\nSales Representative, Ridgeline Office Furniture", "trans": "【第一篇：網頁】Ridgeline 辦公家具 — 升降桌系列。SD-100「基本款」289 美元：手搖曲柄調整高度，桌面 120×60 公分，白色、黑色。SD-200「專業款」449 美元：電動馬達、3 組記憶高度，桌面 140×70 公分，白色、黑色、胡桃木色。SD-300「主管款」629 美元：雙電動馬達、4 組記憶高度與內建 USB 充電孔，桌面 160×80 公分，黑色、胡桃木色。訂購五張以上可免費運送與組裝。胡桃木色為接單生產，通常三週內出貨；其他顏色五個工作天內出貨。\n【第二篇：電子郵件】寄件人：Linwood 會計事務所辦公室經理 Tanya Brooks，5 月 6 日。我們想為 Grant 街的新辦公室訂購六張 SD-200 升降桌。選擇這款是因為我們需要電動調高、至少能記憶三組高度的桌子；不需要內建 USB，因為每個座位都已有充電座。為了搭配新的會議桌，我們想要胡桃木色。新辦公室 6 月 2 日啟用，桌子必須在那之前送達並組裝完成。請確認總價與送貨時程。\n【第三篇：電子郵件】寄件人：Ridgeline 業務代表 Owen Pratt，5 月 7 日。感謝您訂購六張 SD-200。因為訂購超過五張，運送與組裝免費。很遺憾，胡桃木貼皮供應商通知生產延誤，本週訂購的胡桃木桌預計 6 月 9 日才能出貨。若需要早點拿到，我們可以在五個工作天內寄出同型號的黑色款；或者您也可以維持胡桃木訂單，在正式桌子送達前我們免費提供臨時桌。請在 5 月 9 日前告知您選擇哪個方案。", "en": "Questions 186-190 refer to the following Web page and e-mails."}, {"kind": "三篇閱讀 Triple Passage (Questions 191–195)", "docs": [{"kind": "第一篇：公告 Notice", "head": "Harborview Public Library — Spring Small Business Workshop Series", "text": "Join us on Wednesday evenings from 6:30 to 8:00 P.M. for practical workshops led by local experts.\n\nMarch 4 — Writing a Business Plan (Gloria Estes, Estes Consulting) — Room A\nMarch 11 — Social Media Marketing on a Budget (Ravi Menon, Brightpath Digital) — Room B\nMarch 18 — Bookkeeping Basics (Alan Cho, CPA) — Room A\nMarch 25 — Applying for Small Business Loans (Priya Desai, Coastline Bank) — Room A\n\nWorkshops are free for Harborview Library cardholders; the fee for all other participants is $10 per session. Each workshop is limited to 30 participants. Register online at www.harborviewlibrary.org/events."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: Nora Kim <nkim@harborviewlibrary.org>\nFrom: Ravi Menon <ravi@brightpathdigital.com>\nDate: February 20\nSubject: March workshop", "text": "Dear Ms. Kim,\n\nI'm afraid I have to ask for a change to the workshop schedule. A client has asked me to attend a product launch in Chicago on March 11, and I will not be back until the following week.\n\nWould it be possible to give my presentation on another evening? I am available on March 18 or March 25. If Mr. Cho or Ms. Desai would be willing to trade dates with me, I would be very grateful.\n\nBest regards,\nRavi Menon"}, {"kind": "第三篇：電子郵件 E-mail", "head": "To: Workshop Registrants\nFrom: Nora Kim, Adult Programs Coordinator\nDate: February 24\nSubject: Schedule change", "text": "Dear registrants,\n\nPlease note that two workshops in our spring series have switched dates. Social Media Marketing on a Budget will now take place on March 18, and Bookkeeping Basics will take place on March 11. All rooms and start times remain the same.\n\nIf you can no longer attend a session because of this change, please cancel your registration online so that someone on the waiting list can take your place. Participants in the social media workshop are encouraged to bring a laptop or tablet.\n\nThank you for your understanding.\nNora Kim"}], "text": "[第一篇：公告 Notice]\nHarborview Public Library — Spring Small Business Workshop Series\nJoin us on Wednesday evenings from 6:30 to 8:00 P.M. for practical workshops led by local experts.\n\nMarch 4 — Writing a Business Plan (Gloria Estes, Estes Consulting) — Room A\nMarch 11 — Social Media Marketing on a Budget (Ravi Menon, Brightpath Digital) — Room B\nMarch 18 — Bookkeeping Basics (Alan Cho, CPA) — Room A\nMarch 25 — Applying for Small Business Loans (Priya Desai, Coastline Bank) — Room A\n\nWorkshops are free for Harborview Library cardholders; the fee for all other participants is $10 per session. Each workshop is limited to 30 participants. Register online at www.harborviewlibrary.org/events.\n\n[第二篇：電子郵件 E-mail]\nTo: Nora Kim <nkim@harborviewlibrary.org>\nFrom: Ravi Menon <ravi@brightpathdigital.com>\nDate: February 20\nSubject: March workshop\nDear Ms. Kim,\n\nI'm afraid I have to ask for a change to the workshop schedule. A client has asked me to attend a product launch in Chicago on March 11, and I will not be back until the following week.\n\nWould it be possible to give my presentation on another evening? I am available on March 18 or March 25. If Mr. Cho or Ms. Desai would be willing to trade dates with me, I would be very grateful.\n\nBest regards,\nRavi Menon\n\n[第三篇：電子郵件 E-mail]\nTo: Workshop Registrants\nFrom: Nora Kim, Adult Programs Coordinator\nDate: February 24\nSubject: Schedule change\nDear registrants,\n\nPlease note that two workshops in our spring series have switched dates. Social Media Marketing on a Budget will now take place on March 18, and Bookkeeping Basics will take place on March 11. All rooms and start times remain the same.\n\nIf you can no longer attend a session because of this change, please cancel your registration online so that someone on the waiting list can take your place. Participants in the social media workshop are encouraged to bring a laptop or tablet.\n\nThank you for your understanding.\nNora Kim", "trans": "【第一篇：公告】Harborview 公共圖書館春季小型企業工作坊，每週三晚上 6:30–8:00。3/4 撰寫營運計畫（Gloria Estes）A 室；3/11 低預算社群行銷（Ravi Menon）B 室；3/18 記帳基礎（會計師 Alan Cho）A 室；3/25 申請小型企業貸款（Coastline 銀行 Priya Desai）A 室。持本館借書證者免費，其他參加者每場 10 美元；每場限 30 人，請上網報名。\n【第二篇：電子郵件】Ravi Menon 寫給 Nora Kim，2 月 20 日：恐怕得請您調整工作坊時程。客戶請我 3 月 11 日去芝加哥參加產品發表會，要到下一週才回來。能否改到其他晚上？我 3 月 18 日或 25 日都可以。如果 Cho 先生或 Desai 女士願意和我交換日期，我會非常感激。\n【第三篇：電子郵件】成人課程協調員 Nora Kim 寫給報名者，2 月 24 日：春季系列有兩場工作坊交換了日期：低預算社群行銷改在 3 月 18 日，記帳基礎改在 3 月 11 日；教室與開始時間不變。若因此無法出席，請上網取消報名，讓候補者遞補。參加社群行銷工作坊的學員建議攜帶筆電或平板。", "en": "Questions 191-195 refer to the following notice and e-mails."}, {"kind": "三篇閱讀 Triple Passage (Questions 196–200)", "docs": [{"kind": "第一篇：價目表 Price List", "head": "Olive & Thyme Catering — Office Lunch Packages", "text": "Package 1: Gourmet Sandwich Platter — $12 per person\nPackage 2: Pasta Buffet with Garden Salad — $18 per person\nPackage 3: Grilled Salmon Plate with Seasonal Vegetables — $25 per person\n\n• Orders for 30 or more people include a complimentary dessert tray.\n• Delivery is free within 10 kilometers of our kitchen. A $20 fee applies to all other deliveries.\n• All orders must be placed at least 48 hours in advance."}, {"kind": "第二篇：線上評論 Online Review", "head": "Reviewed by Henry Lau ★★★☆☆ (October 3)", "text": "Our company ordered the pasta buffet for 35 employees for an all-day training session last Tuesday. The food itself was excellent — the pasta was hot and the salad was very fresh, and several colleagues asked where it came from.\n\nHowever, the delivery arrived 40 minutes after the time we had requested, so our lunch break had to be shortened. I was also disappointed that the dessert tray promised on the company's price list was not included with our order. I would consider ordering again, but only if these problems are addressed."}, {"kind": "第三篇：回覆 Response", "head": "Response from Sofia Marino, Owner (October 4)", "text": "Dear Mr. Lau,\n\nThank you for your honest feedback, and I apologize for the problems with your order. On the day of your event, a road closure on Bay Street forced our driver to take a much longer route. In addition, the missing dessert tray was an oversight by a new member of our kitchen staff.\n\nSince your office is located about 15 kilometers from our kitchen, you were charged for delivery. I have refunded that fee to your credit card, and I hope you will give us another chance to serve your team."}], "text": "[第一篇：價目表 Price List]\nOlive & Thyme Catering — Office Lunch Packages\nPackage 1: Gourmet Sandwich Platter — $12 per person\nPackage 2: Pasta Buffet with Garden Salad — $18 per person\nPackage 3: Grilled Salmon Plate with Seasonal Vegetables — $25 per person\n\n• Orders for 30 or more people include a complimentary dessert tray.\n• Delivery is free within 10 kilometers of our kitchen. A $20 fee applies to all other deliveries.\n• All orders must be placed at least 48 hours in advance.\n\n[第二篇：線上評論 Online Review]\nReviewed by Henry Lau ★★★☆☆ (October 3)\nOur company ordered the pasta buffet for 35 employees for an all-day training session last Tuesday. The food itself was excellent — the pasta was hot and the salad was very fresh, and several colleagues asked where it came from.\n\nHowever, the delivery arrived 40 minutes after the time we had requested, so our lunch break had to be shortened. I was also disappointed that the dessert tray promised on the company's price list was not included with our order. I would consider ordering again, but only if these problems are addressed.\n\n[第三篇：回覆 Response]\nResponse from Sofia Marino, Owner (October 4)\nDear Mr. Lau,\n\nThank you for your honest feedback, and I apologize for the problems with your order. On the day of your event, a road closure on Bay Street forced our driver to take a much longer route. In addition, the missing dessert tray was an oversight by a new member of our kitchen staff.\n\nSince your office is located about 15 kilometers from our kitchen, you were charged for delivery. I have refunded that fee to your credit card, and I hope you will give us another chance to serve your team.", "trans": "【第一篇：價目表】Olive & Thyme 外燴 — 辦公室午餐方案：方案一 精緻三明治拼盤每人 12 美元；方案二 義大利麵自助餐附田園沙拉每人 18 美元；方案三 烤鮭魚餐附季節蔬菜每人 25 美元。30 人以上訂單贈送甜點盤；廚房 10 公里內免運，其他地區收 20 美元運費；所有訂單須至少提前 48 小時下訂。\n【第二篇：線上評論】Henry Lau，三顆星，10 月 3 日：上週二公司為全天訓練的 35 位員工訂了義大利麵自助餐。餐點本身很棒，麵是熱的、沙拉很新鮮，好幾位同事問是哪裡訂的。但送達時間比我們要求的晚了 40 分鐘，午休只好縮短；價目表上承諾的甜點盤也沒有附上，令人失望。如果這些問題能改善，我會考慮再訂。\n【第三篇：回覆】店主 Sofia Marino，10 月 4 日：感謝您坦率的意見，對訂單的問題深感抱歉。活動當天 Bay 街封路，司機只能繞遠路；甜點盤遺漏則是廚房新進員工的疏失。由於貴公司距離我們廚房約 15 公里，當時有收取運費，我已將這筆費用退回您的信用卡，希望您願意再給我們一次服務的機會。", "en": "Questions 196-200 refer to the following price list, online review, and response."}], "qs": [{"n": 147, "p": 0, "g": "t_p7detail", "q": "Why are two boxes of tote bags missing from the expo booth?", "o": ["Liam accidentally left them in the parking lot.", "The supplier failed to deliver them on time.", "Priya sent them to the wrong convention hall.", "Derek overlooked them in the storage closet."], "a": 3, "h": "看 11:20 A.M. Derek Moss 的訊息，他說兩箱袋子放在哪裡、為什麼沒搬上車？", "trans": "為什麼博覽會攤位少了兩箱托特包？", "e": "在 11:20 A.M. 的訊息中，Derek 表示那兩箱放在儲藏室的海報架後面，他裝車時沒看到而漏掉了（so I missed them when loading the van），overlooked 與 missed 同義，故選 (D)。", "w": "(B) 五箱昨天下午都已送到辦公室；(A) 是 Derek 裝車時留在辦公室儲藏室，不是 Liam 留在停車場；(C) Priya 並未寄送箱子。"}, {"n": 148, "p": 0, "g": "t_p7vocab", "q": "At 11:27 A.M., what does Mr. Moss most likely mean when he writes, \"Consider it done\"?", "o": ["He just ordered more tote bags from the vendor.", "He will certainly bring the power strip Priya requested.", "He has already finished setting up the booth lighting.", "He has completed his shift at the convention center."], "a": 1, "h": "對照前一則（11:26 A.M.）Priya 請 Derek 順便幫忙拿什麼東西。", "trans": "在上午 11:27，Derek 寫道「Consider it done（包在我身上）」是什麼意思？", "e": "11:26 A.M. Priya 請 Derek 趁還在辦公室時，順便從她辦公桌抽屜拿備用延長線（grab the extra power strip），Derek 回覆「Consider it done!」這句常見口語慣用語意為「沒問題、包在我身上（當作已經辦好了）」，表示他一定會幫她帶延長線過去，故選 (B)。", "w": "(C) 他人還在辦公室，尚未去展場裝燈；(D) 他下午 1:30 才要去值第一班；(A) 袋子沒有少訂，只是留在儲藏室。"}, {"n": 149, "p": 1, "g": "t_p7detail", "q": "What is one responsibility of the Regional Fleet Coordinator?", "o": ["Negotiating freight contracts with new retail clients", "Ensuring that drivers' logs follow safety laws", "Repairing damaged vehicles in the company garage", "Driving refrigerated trucks across the Mountain West"], "a": 1, "h": "核對 Key Responsibilities 的四個項目，注意 compliance with federal transportation safety regulations。", "trans": "區域車隊協調員的職責之一是什麼？", "e": "主要職責第三點為「Review driver electronic logs to ensure full compliance with federal transportation safety regulations」，即檢查駕駛紀錄以確保符合安全法規，與 (B) 完全相符。", "w": "(D) 資格條件說明不需職業駕照（CDL is NOT required），職責是監控派遣而非親自開車；(A) 文中未提及與新客戶洽談貨運合約；(C) 保養與維修是與「外部維修廠（external service garages）」協調，而非自己修車。"}, {"n": 150, "p": 1, "g": "t_p7detail", "q": "What gives an applicant an advantage for this position?", "o": ["Living within walking distance of the Denver office", "Speaking more than one language fluently", "Knowing how to handle temperature-controlled cargo", "Having a commercial driver's license"], "a": 2, "h": "定位 Qualifications 最後一點的「is a distinct advantage」。", "trans": "什麼條件能讓應徵者在此職缺中佔有優勢？", "e": "資格條件最後一點提到「familiarity with cold-storage freight handling is a distinct advantage」，cold-storage freight（冷藏貨運）即對應 (C) temperature-controlled cargo（溫控貨物）。", "w": "(D) 文中只說不需要 CDL，並未說有 CDL 是優勢；(A)(B) 文中均未提及。"}, {"n": 151, "p": 2, "g": "t_p7detail", "q": "According to the policy, which item is eligible for a standard return?", "o": ["An unopened set of dining chairs in its original box", "A sofa made with customer-selected fabric", "A clearance floor lamp marked \"Final Sale\"", "A package of bedsheets that has been washed once"], "a": 0, "h": "比對 Eligibility Conditions 的兩條規定：哪些不能退？哪一個符合 unused, unassembled, and in their original packaging？", "trans": "根據政策，下列哪一項商品符合一般退貨資格？", "e": "退貨條件規定商品必須「未使用、未組裝且保留原包裝（unused, unassembled, and in their original packaging）」，(A) 未拆封且在原裝箱內的餐椅組完全符合規定。", "w": "(B) 客製化布料沙發（Custom-upholstered sofas）不可退；(C) 標示 Final Sale 的出清品不可退；(D) 已拆封或洗過的寢具組（opened bedding sets）不可退。"}, {"n": 152, "p": 2, "g": "t_p7detail", "q": "How can a customer avoid paying the $15 return shipping fee on a non-defective item?", "o": ["By returning the item within 48 hours of delivery", "By paying for the original order with a credit card", "By emailing photographs of the item to customer support", "By choosing a store credit voucher instead of a refund"], "a": 3, "h": "查看 Refunds & Fees 第一點第二句「the $15 shipping fee is waived」的條件。", "trans": "對於非瑕疵商品，顧客如何免付 15 美元的退貨運費？", "e": "Refunds & Fees 第一點說明「However, if you opt for a store credit voucher or an exchange of equal value, the $15 shipping fee is waived」，選擇商店購物金抵用券或等值換貨即可免除 15 美元運費，故選 (D)。", "w": "(A)(C) 48 小時內寄照片是針對「運送損壞或瑕疵品（defective or damaged in transit）」的免費換新規定；(B) 文中未提及信用卡付款可免退貨運費。"}, {"n": 153, "p": 3, "g": "t_p7detail", "q": "Why was Horizon Biotech not charged a delivery fee?", "o": ["The total cost of the order exceeded $2,500.", "The event was held in the same building as the caterer.", "Samuel Lindqvist used a first-time customer coupon.", "Horizon Biotech picked up the food itself."], "a": 0, "h": "查看表格下方「Delivery & Setup Fee」括號內的說明。", "trans": "為什麼 Horizon 生技公司沒有被收取外送費？", "e": "帳單明細寫道「Delivery & Setup Fee (Waived for orders over $2,500): $0.00」，因為訂單金額超過 $2,500，所以免收外送與布置費，故選 (A)。", "w": "(B) 活動在 Horizon 生技公司的會議廳舉行，並非外燴公司大樓；(C) 折扣是企業夥伴 9 折優惠，非新客優惠券；(D) 外燴公司有派外送與 4 名現場服務生。"}, {"n": 154, "p": 3, "g": "t_p7detail", "q": "What is true about the payment for Invoice #INV-9034?", "o": ["A 10% late fee applies after September 26.", "The remaining balance must be paid in cash.", "The full amount of $3,636 is due immediately.", "Half of the total amount has already been paid."], "a": 3, "h": "查看底部 Notes 第一點關於 50% deposit 的說明。", "trans": "關於發票 #INV-9034 的付款，下列何者正確？", "e": "Notes 第一點指出「A 50% deposit ($1,818.00) was paid by corporate credit card on September 10」，表示總金額的一半（50% 訂金）已經付清，故選 (D)。", "w": "(C) 只需再付剩餘的一半尾款 $1,818，且期限至 10 月 26 日；(B) 尾款須以銀行匯款或支票（via bank transfer or check）支付，非現金；(A) 逾期滯納金為每月 2%，且到期日為 10 月 26 日。"}, {"n": 155, "p": 4, "g": "t_p7main", "q": "Why did Mr. Vance send the e-mail?", "o": ["To request payment for an overdue invoice", "To confirm that an order has been shipped", "To explain a change in Oakridge Printing's pricing", "To alert a client to a potential printing issue"], "a": 3, "h": "留意第二段提到的 prepress team noticed... 關於照片解析度過低可能造成模糊的問題。", "trans": "Vance 先生為何寄這封電子郵件？", "e": "第二段指出印前團隊發現內頁有兩張照片解析度低於建議的 300 DPI，直接印製可能會稍微模糊，因此寫信提醒客戶並詢問是否要替換圖檔，故選 (D)。", "w": "(B) 產品尚未開始正式印刷（Before we proceed with the full print run），還沒出貨；(A) 信中完全未提及帳單或逾期付款；(C) 信中未提及價格變動。"}, {"n": 156, "p": 4, "g": "t_p7detail", "q": "How can Ms. Haddad keep her original delivery date of April 19?", "o": ["By reducing the total number of brochures to 300", "By picking up the brochures at the printing plant in person", "By submitting new image files before 3:00 P.M. on April 15", "By paying an expedited shipping fee"], "a": 2, "h": "定位第三段「keep your original delivery date of April 19」的前一句。", "trans": "Haddad 女士如何才能維持原定的 4 月 19 日交貨日期？", "e": "第三段明確說明，若要替換高解析度圖片，請於 4 月 15 日下午 3:00 前上傳至客戶專區，這樣就能維持原定的 4 月 19 日交貨日（Doing so will allow us to keep your original delivery date of April 19），故選 (C)。", "w": "(A) 300 是建議的解析度 300 DPI，印刷數量是 2,500 份；(D) 文中未提及急件運費；(B) 文中未提及親自到印刷廠取件。"}, {"n": 157, "p": 4, "g": "t_p7infer", "q": "What is indicated about Order #4082?", "o": ["It is the first order Ms. Haddad has placed with Oakridge Printing.", "It was submitted through an online system.", "It consists of posters and banners for a conference.", "It will be delivered on April 17 if no changes are made."], "a": 1, "h": "注意第一段提到的「digital files you uploaded this morning」與第三段的「upload them to your client portal」。", "trans": "關於訂單 #4082，文中指出了什麼？", "e": "第一段提到「您今天早上上傳的數位檔案（digital files you uploaded this morning）」，第三段也提到上傳至 client portal，可知該訂單檔案是透過線上系統提交的，故選 (B)。", "w": "(A) 文中僅感謝她選擇該公司，未提及是否為首次下單；(D) 原定交貨日是 4 月 19 日，若延遲兩天則是更晚，而非 4 月 17 日；(C) 該訂單是三折頁產品宣傳冊（tri-fold product brochures），而非海報與橫幅。"}, {"n": 158, "p": 5, "g": "t_p7not", "q": "What will NOT be available to visitors from October 12 to October 26?", "o": ["The Orchid Gallery", "The outdoor walking trails", "The Japanese Maple Pavilion", "The Tropical Glasshouse"], "a": 3, "h": "注意第 1 點標題與內文：哪一個場館在 10 月 12 日至 26 日期間會關閉？", "trans": "10 月 12 日至 10 月 26 日期間，遊客「無法」使用下列哪一項設施？", "e": "第 1 點明載「The Tropical Glasshouse will be closed to the public from October 12 through October 26」，因此熱帶溫室在此期間不開放，故選 (D)。", "w": "(A) Orchid Gallery、(C) Japanese Maple Pavilion 與 (B) outdoor trails 都在第 1 點第二句被列為照常開放（remain open）。"}, {"n": 159, "p": 5, "g": "t_p7detail", "q": "According to the notice, how can visitors join a guided walking tour?", "o": ["By signing up at the information desk on the day of the tour", "By registering at the pop-up kiosk next to the gift shop", "By purchasing a special $14 tour ticket at the gate", "By reserving a spot on the garden's website in advance"], "a": 0, "h": "查看第 3 點 Guided Walking Tours 的最後一句。", "trans": "根據公告，遊客如何參加導覽步行團？", "e": "第 3 點最後一句說明「sign-up sheets are available at the information desk starting at 8:30 A.M. on the day of the tour」，即當天早上 8:30 起在服務台登記報名，故選 (A)。", "w": "(D) 文中規定當日現場登記，未提網站事先預約；(C) 導覽團為免費（Complimentary），$14 是溫室關閉期間的成人門票；(B) 禮品店旁的快閃亭是賣輕食飲料的，不是報名處。"}, {"n": 160, "p": 5, "g": "t_p7detail", "q": "What benefit is offered to annual pass holders in October?", "o": ["A 20 percent discount at the gift shop", "A free beverage at the Garden Café", "Priority access to the Tropical Glasshouse", "Complimentary admission for one guest on weekdays"], "a": 3, "h": "定位第 2 點最後一句關於 annual pass holders 的優惠。", "trans": "年度通行證持有人在 10 月份可享有什麼福利？", "e": "第 2 點指出「annual pass holders may bring one guest free of charge on any weekday in October」，即 10 月份平日可免費帶一位貴賓入園，故選 (D)。", "w": "(B) 飲料仍須於快閃亭購買；(C) 溫室於施工期間對公眾關閉；(A) 20 是導覽團每梯次人數上限（20 participants），並非禮品店折扣。"}, {"n": 161, "p": 6, "g": "t_p7detail", "q": "What problem did Hannah Cho report at 2:05 P.M.?", "o": ["A piece of equipment at the venue will be unavailable.", "The hotel ballroom was double-booked for November 6.", "The keynote speaker canceled his appearance.", "The Aurora Smart Lamp prototypes were delayed in shipping."], "a": 0, "h": "查看 2:05 P.M. 訊息中的「their ceiling projector is undergoing repairs that week」。", "trans": "Hannah Cho 在下午 2:05 回報了什麼問題？", "e": "Hannah 在 2:05 P.M. 表示飯店大宴會廳的天花板投影機那週正在維修（undergoing repairs），即活動當週場地的投影設備將無法使用，故選 (A)。", "w": "(B) 宴會廳並未重複預訂；(D) 文中未提產品原型延誤；(C) 文中未提講者取消出席。"}, {"n": 162, "p": 6, "g": "t_p7infer", "q": "How much did the team originally have left in their event budget before the hotel credit and printing savings?", "o": ["$3,200", "$1,400", "$1,800", "$800"], "a": 2, "h": "2:09 P.M. 提到租 LED 電視牆一天要 $3,200，會比剩餘預算超出 $1,400（$3,200 - $1,400 = ?）。", "trans": "在計入飯店折抵與印刷節省的費用之前，團隊原本的活動預算還剩多少錢？", "e": "Hannah 在 2:09 P.M. 說：「An LED wall costs $3,200 for a single day, which puts us $1,400 over our remaining event budget.」租金 $3,200 比原本剩餘預算超出 $1,400，因此原本剩餘預算為 $3,200 - $1,400 = $1,800（加上飯店折抵 $800 與印刷省下 $950 後共 $3,550，足以支付 $3,200），故選 (C)。", "w": "(D) $800 是飯店提供的場租折抵；(B) $1,400 是原本不足的差額；(A) $3,200 是 LED 電視牆的單日租金。"}, {"n": 163, "p": 6, "g": "t_p7detail", "q": "What will Victor Alvarez do this afternoon?", "o": ["Update the master budget spreadsheet", "Print QR-code handouts for attendees", "Negotiate a lower rental rate with the hotel", "Reformat the slides for the keynote presentation"], "a": 3, "h": "查看最後一則（2:16 P.M.）Victor Alvarez 說他今天下午要做什麼。", "trans": "Victor Alvarez 今天下午會做什麼？", "e": "在 2:16 P.M.，Victor 說「I'll adjust the presentation slides to widescreen 16:9 format this afternoon so they fit the LED wall properly」，即重新調整簡報投影片的格式，故選 (D)。", "w": "(A) 管理預算總表的是 Hannah；(B) 改印 QR 碼傳單是昨天決定的事；(C) 飯店已主動折抵 $800。"}, {"g": "t_p7main", "q": "What is the purpose of the memo?", "o": ["To announce that the Seattle office will relocate", "To introduce a new facilities director", "To ask employees for feedback on security procedures", "To explain a change to how employees enter the building"], "h": "主旨題：看標題列 Subject 與第一段。", "e": "備忘錄主旨是 Lobby Security Upgrade and ID Badges，第一段說明 8 月 17 日起大廳改用自動閘門、員工須刷新的晶片識別證才能進入，全文都在說明進出大樓方式的改變，故選 (D)。", "w": "(A) 文中沒有提到辦公室搬遷；(C) 沒有徵求意見；(B) Elena Rostova 是發文者，文中沒有介紹新主管。", "trans": "這份備忘錄的目的是什麼？", "a": 3, "n": 164, "p": 7}, {"n": 165, "p": 7, "g": "t_p7detail", "q": "When should an engineer working on the fourth floor go to Room 104?", "o": ["On Friday morning", "On Monday, August 17", "On Wednesday or Thursday", "On Monday or Tuesday"], "a": 2, "h": "查看備忘錄中間的樓層時程表：Floors 4–5 (Product & Engineering)。", "trans": "在四樓工作的工程師應該在什麼時候前往 104 室？", "e": "根據備忘錄中的排程表，「Floors 4–5 (Product & Engineering): Wednesday–Thursday, 9:00 A.M.–4:00 P.M.」，四樓工程師應於週三或週四前往，故選 (C)。", "w": "(D) 週一至週二是 2–3 樓（行銷與業務部）；(A) 週五是 6 樓（財務、人資與法務部）；(B) 8 月 17 日週一是新門禁系統正式啟用的日子。"}, {"n": 166, "p": 7, "g": "t_p7detail", "q": "What must employees do to receive their new ID badge?", "o": ["Turn in their old employee badge", "Obtain written approval from their department head", "Pay a $10 card replacement fee", "Complete an online security training module"], "a": 0, "h": "定位最後一段第一句「as it must be surrendered before a new one can be issued」。", "trans": "員工必須做什麼才能領取新的識別證？", "e": "最後一段指出「Please bring your current employee badge with you, as it must be surrendered before a new one can be issued」，surrender 意為「繳回、交出」，與 turn in 同義，故選 (A)。", "w": "(D) 文中未提線上安全訓練；(B) 文中未提需部門主管書面批准；(C) 文中未提及任何換證費用。"}, {"n": 167, "p": 7, "g": "t_p7sent", "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Badge photos will be taken only during the hours listed below.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 1, "h": "待插入句提到 the hours listed below（下方所列的時段）與拍照，找出前面剛提到拍照、後面緊接著出現時段表的位置。", "trans": "下列句子最適合填入標示 [1]、[2]、[3]、[4] 的哪一個位置？\n「證件照只會在下方所列的時段拍攝。」", "e": "[2] 的前一句說 104 室將於下週拍新照片並核發新證，後一句接著說「請依下列時程前往」並列出時段表。待插入句同時呼應「拍照」與「下方的時段」，放在 [2] 最連貫，故選 (B)。", "w": "(A) [1] 前面只提到新門禁系統，還沒提到拍照；(C) [3] 已經在時段表之後，listed below 找不到對應；(D) [4] 在講出差員工的臨時通行證，與拍照時段無關。"}, {"n": 168, "p": 8, "g": "t_p7detail", "q": "What is indicated about Cascadia Roasters?", "o": ["It already sells Sunbelt Bakery products in some of its stores.", "It disclosed that it paid $12 million for Sunbelt Bakery.", "It plans to close Sunbelt Bakery's Eugene facility.", "It was founded four years ago."], "a": 0, "h": "查看第二段最後一句關於過去四年兩家公司的合作關係。", "trans": "關於 Cascadia Roasters，文中指出了什麼？", "e": "第二段指出「For the past four years, Sunbelt Bakery has been the primary supplier of croissants, muffins, and artisan bread for Cascadia's southern Oregon locations」，表示 Cascadia 的部分門市原本就已經在販售 Sunbelt Bakery 的烘焙產品，故選 (A)。", "w": "(D) Cascadia 創立於十二年前，四年是兩家公司合作供應的時間；(C) 尤金廠不但不關閉，還要在秋季擴建；(B) 財務條款並未公開（not disclosed），1,200 萬美元是分析師的估計值。"}, {"n": 169, "p": 8, "g": "t_p7detail", "q": "What change will take place at the Eugene plant this autumn?", "o": ["It will begin roasting coffee beans.", "Its floor space will be increased.", "It will relocate to Seattle.", "Its operations director will be replaced."], "a": 1, "h": "定位最後一段第一句「expanded by 15,000 square feet this autumn」。", "trans": "尤金廠今年秋季將有什麼改變？", "e": "最後一段指出「Sunbelt Bakery's Eugene facility will be expanded by 15,000 square feet this autumn」，廠房擴建 15,000 平方英尺即代表樓地板空間將會增加（Its floor space will be increased），故選 (B)。", "w": "(D) 現任營運總監 Mateo Silva 將留任（stay on）；(A) 該廠是烘焙與包裝廠，未提烘豆；(C) 只是將無麩質產品引進西雅圖門市，工廠並未搬遷。"}, {"g": "t_p7detail", "q": "What is mentioned about Mateo Silva?", "o": ["He negotiated the price of the acquisition.", "He will continue to manage the Eugene facility.", "He will move to Seattle to open new cafés.", "He founded Cascadia Roasters."], "h": "找出 Mateo Silva 出現的段落，注意同義改寫。", "e": "最後一段說 Sunbelt 現任營運總監 Mateo Silva「will stay on to oversee the Eugene plant」，即留任並繼續管理尤金廠，故選 (B)。", "w": "(D) Cascadia 的創辦人是 Clara Jennings；(C) 西雅圖指的是引進無麩質商品的門市，與他無關；(A) 文中只說財務條款未公開，沒有提到他談判價格。", "trans": "關於 Mateo Silva，文中提到了什麼？", "a": 1, "n": 170, "p": 8}, {"n": 171, "p": 8, "g": "t_p7sent", "q": "In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"That existing partnership made the acquisition talks proceed smoothly.\"", "o": ["[1]", "[2]", "[3]", "[4]"], "a": 0, "h": "注意句中的「That existing partnership（這段既有的合作關係）」指的是前一句提到的哪件事？", "trans": "下列句子最適合填入標示 [1]、[2]、[3]、[4] 的哪一個位置？\n「這段既有的合作關係使收購談判進展得十分順利。」", "e": "[1] 的前一句剛好說明「過去四年來，Sunbelt 一直是 Cascadia 南奧勒岡分店的主要供應商」，待插入句的「That existing partnership」完美指代這段長達四年的供應商合作關係，故選 (A)。", "w": "(B) [2] 前一句在談引進無麩質商品；(C) [3] 前一句在談擴廠與徵才；(D) [4] 前一句在談營運總監留任，皆無法對應 That existing partnership。"}, {"n": 172, "p": 9, "g": "t_p7detail", "q": "How do AetherRide bicycles differ from dockless scooters?", "o": ["They do not require batteries to operate.", "They must be parked at designated stations after each use.", "They can only be rented by university students.", "They are free to use on weekends."], "a": 1, "h": "定位第二段第一句「Unlike dockless scooters...」。", "trans": "AetherRide 自行車與無樁滑板車有何不同？", "e": "第二段明確指出「Unlike dockless scooters that are often left on sidewalks, AetherRide bicycles must be returned to an official docking station at the end of each trip」，每次騎乘後都必須歸還至指定的官方站點，故選 (B)。", "w": "(C) 所有居民與遊客（residents and visitors）皆可租借；(A) 它們是配備電池並由太陽能充電的電動輔助單車；(D) 文中未提及週末免費。"}, {"g": "t_p7not", "q": "What is NOT mentioned as a feature of the AetherRide program?", "o": ["Free rides for people who download the app", "A monthly pass for frequent riders", "Helmets that are provided at every station", "Docking stations powered by solar energy"], "h": "NOT 題：把四個選項逐一回原文核對。", "e": "新聞稿提到站點用太陽能頂棚充電（B）、每月 29 美元的月票（C）、10 月 31 日前下載 App 送三次免費騎乘（D），但完全沒有提到每個站點提供安全帽，故選 (C)。", "w": "(D)(B)(A) 都在新聞稿中提到。", "trans": "下列何者「沒有」被提到是 AetherRide 計畫的特色？", "a": 2, "n": 173, "p": 9}, {"n": 174, "p": 9, "g": "t_p7vocab", "q": "In the press release, the word \"bridge\" in paragraph 3 is closest in meaning to", "o": ["delay", "construct", "close", "evaluate"], "a": 2, "h": "搭配片語「bridge the gap（彌合／縮小差距）」。", "trans": "在第三段中，「bridge」一詞的意思最接近下列何者？", "e": "片語「bridge the gap」意為「銜接、彌合、消除（差距或落差）」，在此與「close (the gap)」（縮小／消除落差）意思最接近，故選 (C)。", "w": "(B) construct 建造（用於實體建築，不用於 construct a gap）；(A) delay 延遲；(D) evaluate 評估。"}, {"n": 175, "p": 9, "g": "t_p7detail", "q": "How can users receive three free rides?", "o": ["By downloading the mobile app before the end of October", "By referring three friends to the service", "By returning a bicycle to a downtown bus hub", "By purchasing a Monthly Unlimited Pass"], "a": 0, "h": "查看最後一段最後一句「To celebrate the launch...」。", "trans": "使用者如何獲得三次免費騎乘？", "e": "最後一句說明「anyone who downloads the AetherRide mobile app before October 31 will receive three complimentary 30-minute rides」，只要在 10 月底前下載手機 App 即可獲得三次免費騎乘，故選 (A)。", "w": "(D) 月票為 $29 不限次數騎乘，並非送三次免費騎乘的條件；(B) 文中未提推薦好友；(C) 每趟本來就規定要還到站點，並無因此贈送三次免費騎乘。"}, {"n": 176, "p": 10, "g": "t_p7cross", "q": "Who was scheduled to lead the morning workshop that Mr. Holloway originally selected?", "o": ["Trevor Nairn", "Maya Lin", "Sonia Verma", "Dr. Julian Cho"], "a": 3, "h": "先在第二篇信件找出 Mr. Holloway 上午選了哪個場次（Session A2），再回第一篇時程表查誰主講。", "trans": "Holloway 先生原本選擇的上午工作坊是由誰主講？", "e": "第二篇第一段 Mr. Holloway 提到「I selected Session A2 for the morning slot」，對照第一篇時程表，Session A2（Sustainable Packaging Solutions）的主講人是 Dr. Julian Cho，故選 (D)。", "w": "(C) Sonia Verma 主講 Session A1；(A) Trevor Nairn 主講 Session A3；(B) Maya Lin 是午宴主題演講者。"}, {"n": 177, "p": 10, "g": "t_p7detail", "q": "Why does Mr. Holloway want to change his afternoon workshop?", "o": ["He wants to hear Chloe Park speak about visual merchandising.", "A colleague from his company is already attending Session B2.", "Session B2 has been canceled by the organizers.", "His flight back home was moved to an earlier time."], "a": 1, "h": "查看第二篇第二段關於 Fiona Bell 的說明。", "trans": "Holloway 先生為何想更換他的下午工作坊？", "e": "第二篇第二段說明，他們公司的物流經理 Fiona Bell 也要參加高峰會且同樣報名了 Session B2，為了讓兩人能涵蓋更多不同主題（cover more topics between the two of us），他想改聽別場，故選 (B)。", "w": "(D)(C) 文中未提及；(A) 他想改聽的是提升線上結帳率（improving online checkout rates，即 Carlos Mendez 主講的 Session B1），而非 Chloe Park 的 B3。"}, {"n": 178, "p": 10, "g": "t_p7cross", "q": "Which room does Mr. Holloway hope to move to at 1:30 P.M.?", "o": ["Crystal Ballroom", "Room 208", "Room 201", "Room 204"], "a": 2, "h": "他在第二篇說想改聽「improving online checkout rates」，對照第一篇下午 1:30 是哪一場、在哪一間教室？", "trans": "Holloway 先生希望下午 1:30 改去哪一間教室？", "e": "第二篇提到他想改聽「improving online checkout rates」，對應第一篇下午場次「Session B1 (Room 201): E-Commerce Checkout Optimization」，地點在 Room 201，故選 (C)。", "w": "(D) Room 204 是他原本報名的 Session B2；(B) Room 208 是 Session B3（視覺陳列）；(A) Crystal Ballroom 是午宴地點。"}, {"n": 179, "p": 10, "g": "t_p7cross", "q": "Why was Mr. Holloway unable to modify his schedule in the mobile app?", "o": ["He had not paid the conference luncheon fee.", "The deadline for app changes had already passed.", "The mobile app only works on Android devices.", "He forgot his registration number."], "a": 1, "h": "比對第一篇底部的 *Note 截止日期（November 10）與第二篇信件的寄信日期（November 11）。", "trans": "為什麼 Holloway 先生無法在手機 App 中修改行程？", "e": "第一篇底部的備註明載「Attendees who wish to switch sessions must submit a change request via the summit app by November 10」，而第二篇 Mr. Holloway 是在 11 月 11 日早上才嘗試修改，已超過 11 月 10 日的截止期限，故選 (B)。", "w": "(D) 主旨欄已寫出報名編號 #RS-7741；(C)(A) 文中均未提及。"}, {"n": 180, "p": 10, "g": "t_p7detail", "q": "Where will summit attendees be at 12:15 P.M.?", "o": ["In Room 201", "In Room 204", "In Room 208", "In the Crystal Ballroom"], "a": 3, "h": "查看第一篇時程表中 11:45 A.M.–1:15 P.M. 的活動與地點。", "trans": "高峰會與會者在中午 12:15 會在哪裡？", "e": "根據第一篇時程表，11:45 A.M.–1:15 P.M. 為交流午宴與主題演講（Networking Luncheon），地點在 Crystal Ballroom，12:15 P.M. 正好落在此時段內，故選 (D)。", "w": "(A)(B)(C) 皆為上下午分組工作坊的教室，中午時段並無課程。"}, {"n": 181, "p": 11, "g": "t_p7detail", "q": "What is included at no extra charge in the Corporate Stay & Meet Package for a group of 12 guests?", "o": ["Airport shuttle service every half hour", "One-on-one IT support in each suite", "Evening dinner in the Atrium Dining Room", "Full-day rental of the Cedar Boardroom"], "a": 0, "h": "查看第一篇廣告中「groups of 10 or more guests」享有的四項福利。", "trans": "12 人團體預訂「企業住宿與會議專案」可免費享有下列哪一項服務？", "e": "第一篇列出 10 人以上團體專案包含「Round-trip airport shuttle service running every 30 minutes」（每半小時一班的往返機場接駁服務），故選 (A)。", "w": "(D) 會議室租借是享 75 折（25% discount），並非免費；(C) 免費附贈的是自助早餐（Hot breakfast buffet），而非晚餐；(B) 套房提供免費高速 Wi-Fi，未提一對一 IT 支援。"}, {"n": 182, "p": 11, "g": "t_p7cross", "q": "Which conference room is the most suitable and cost-effective choice for Veritas Pharma on March 19?", "o": ["The Atrium Dining Room", "The Maple Room", "The Oak Hall", "The Cedar Boardroom"], "a": 1, "h": "第二篇第二段提到會議室需要容納 18 位學員 + 2 位講師（共 20 人），對照第一篇哪一間容量剛好符合？", "trans": "3 月 19 日對 Veritas 製藥而言，哪一間會議室最合適且最具成本效益？", "e": "第二篇指出會議室需容納「18 participants plus two visiting instructors」（共 20 人）。對照第一篇：Cedar Boardroom 僅容納 12 人（太小），Maple Room 可容納至多 25 人（$400/天，最合適），Oak Hall 可容納 60 人但價格昂貴（$680/天），故選 (B) The Maple Room。", "w": "(A) Atrium Dining Room 是吃早餐的餐廳；(D) 最多 12 人，坐不下 20 人；(C) 60 人大廳超出需求且較貴。"}, {"n": 183, "p": 11, "g": "t_p7cross", "q": "How much will Veritas Pharma pay for the Maple Room on March 19 after the package discount?", "o": ["$300", "$180", "$400", "$240"], "a": 0, "h": "Maple Room 原價 $400/天，專案享有 25% discount（75 折），計算 $400 × (1 - 0.25)。", "trans": "套用專案折扣後，Veritas 製藥在 3 月 19 日租借楓木廳需支付多少費用？", "e": "第一篇顯示 Maple Room 標準全日定價為 $400，而企業專案享有全日會議室租金 25% 折扣（75 折），因此折扣後價格為 $400 × 75% = $300，故選 (A)。", "w": "(B) $180 是 Cedar Boardroom 打 75 折後的價格；(D) $240 是 Cedar Boardroom 的原價；(C) $400 是未打折前的原價。"}, {"n": 184, "p": 11, "g": "t_p7cross", "q": "Why does Veritas Pharma qualify for the complimentary afternoon coffee and pastry service?", "o": ["Its seminar is taking place on a Thursday.", "It is renting the largest conference hall.", "It is booking 18 suites for two consecutive nights.", "Arthur Pendelton is a loyalty club member."], "a": 2, "h": "對照第一篇底部 *Special Bonus 的兩個條件（至少 15 間套房、連住兩晚以上）與第二篇的訂房內容。", "trans": "為什麼 Veritas 製藥符合免費午間咖啡與糕點服務的資格？", "e": "第一篇 *Special Bonus 規定「reserve at least 15 guest suites for two or more consecutive nights」，而第二篇說明他們有 18 位業務代表各住一間套房（18 間 ≥ 15 間），且從 3 月 18 日週三住到 3 月 20 日週五退房（連住兩晚），完全符合條件，故選 (C)。", "w": "(A)(D)(B) 皆非廣告所列的贈送條件。"}, {"n": 185, "p": 11, "g": "t_p7detail", "q": "Who is Arthur Pendelton?", "o": ["A shuttle bus driver at Manchester Airport", "One of the visiting seminar instructors", "A sales manager at The Crestwood Suites", "A training coordinator at Veritas Pharma"], "a": 3, "h": "查看第二篇信末的署名職稱。", "trans": "Arthur Pendelton 是誰？", "e": "第二篇電子郵件結尾署名「Arthur Pendelton, Training Coordinator, Veritas Pharma」，即 Veritas 製藥的培訓協調員，故選 (D)。", "w": "(C) 他是寫信向飯店訂房的客戶；(A)(B) 與信末職稱不符。"}, {"n": 186, "p": 12, "g": "t_p7detail", "q": "What is indicated about the SD-100 desk?", "o": ["Its height must be adjusted by hand.", "It is the largest desk in the collection.", "It is available in a walnut finish.", "It has built-in USB charging ports."], "a": 0, "h": "比對第一篇三款桌子的規格，逐一檢查選項。", "e": "第一篇寫 SD-100 是「Manual crank height adjustment」（手搖曲柄調整高度），也就是必須手動調整，故選 (A)。", "w": "(C) SD-100 只有白色與黑色；(D) USB 充電孔是 SD-300 才有；(B) 最大的桌面是 SD-300 的 160 × 80 公分。", "trans": "關於 SD-100 升降桌，文中指出了什麼？"}, {"n": 187, "p": 12
