const PAST=[{"id": "p104", "kind": "past", "title": "104 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 12–25、36–50 題）．官方答案", "unofficial": false, "qs": [{"n": 12, "g": "basic", "q": "下列何者不是用於資料的相關性分析(Correlation Analysis)?", "o": ["卡方檢定", "相關係數", "共變異數", "四分位數"], "a": 3}, {"n": 13, "g": "mining", "q": "分析資料、建構模型來預測顧客的貸款申請是「安全的」或「有風險的」,是下列何者?", "o": ["關聯規則探勘", "分類", "迴歸", "群集分析"], "a": 1}, {"n": 14, "g": "dw", "q": "下列何者為巨量資料最適當的定義?", "o": ["巨大資料量的資料集", "資料量大於1 TB的資料集", "資料量超出傳統資料庫的抓取、儲存、管理和分析能力的資料集", "資料量超出人類的抓取、儲存、管理和分析能力的資料集"], "a": 2}, {"n": 15, "g": "basic", "q": "巨量資料會使分析資訊的方式產生三大改變,不包括下列何者?", "o": ["能夠取得、分析的資料量大為增加", "不會堅持一切都要做到精準", "放下長久以來對於因果關係的堅持", "不需找出資料之間的相關性"], "a": 3}, {"n": 16, "g": "dw", "q": "關於巨量資料分析的概念,下列何者正確?", "o": ["巨量資料分析主要是針對量大的數據分析,因此對於資料來源多樣性和資料產生快慢等因素將不列入考慮", "巨量資料分析的資料格式僅限於結構化資料,因此非結構化與半結構化資料不納入其分析的範疇", "巨量資料分析的建模是透過由下而上(Bottom-Up)的數學歸納推理方式來解讀資料的規則,這和傳統資料庫系統以由上而下(Top-Down)的建模方式有所不同", "巨量資料分析方法可以利用現有資料庫管理系統技術來完成"], "a": 2}, {"n": 17, "g": "dw", "q": "關於分類的訓練資料集與測試資料集的敘述,下列何者有誤?", "o": ["訓練資料是從要分析的資料庫中隨機取樣", "訓練資料必須已經知道其類別", "測試資料集不應該包含訓練資料集中的資料", "測試資料可以不知道其類別"], "a": 3}, {"n": 18, "g": "mining", "q": "請問機器學習(Machine Learning)上所使用的深化學習(Deep Learning)和下列哪一個演算法有直接相關連?", "o": ["類神經網路", "迴歸分析", "貝氏網路", "決策樹"], "a": 0}, {"n": 19, "g": "prep", "q": "巨量資料分析是一連串分階段流程的處理步驟(Pipeline),針對此巨量資料分析的流程,下列何者正確?", "o": ["ETL(Extract Transform Load)的處理是屬於此分析流程中最後階段", "現階段我們已經有一套資訊系統可以完整涵蓋所有巨量資料分析的階段流程", "統計學習的建模與分析因為需大量人力介入,因此是獨立出來的步驟,所以它不屬於巨量資料分析流程的一環", "巨量資料分析流程必須要透過人為的介入與客製化的操作,因此目前整個巨量資料分析流程尚無法完全自動化完成"], "a": 3}, {"n": 20, "g": "basic", "q": "一般巨量資料處理的單位為PB級;1 PB的資料為1 GB資料的幾倍大?", "o": ["1,000", "1,000,000", "1,000,000,000", "1,000,000,000,000"], "a": 1}, {"n": 21, "g": "hadoop", "q": "下列哪一項資訊技術和巨量資料最不相關?", "o": ["資料探勘", "物件導向軟體開發", "Hadoop", "NoSQL"], "a": 1}, {"n": 22, "g": "ml", "q": "對於決策樹(Decision Tree)機器學習演算法,下列何者有誤?", "o": ["決策樹最末端葉面點(Leaves)是標示資料分類別的結果", "決策樹中間的點是提供資料分類時特徵值的判斷", "決策樹的分類需要將所有訓練資料集的資料正確分類", "隨機樹叢(Random Forest)演算法是整合多個小決策樹來進行資料分類"], "a": 2}, {"n": 23, "g": "hadoop", "q": "關於Hadoop的敘述,下列何者有誤?", "o": ["Hadoop的做法,是將資料打散成小塊,分散到不同的電腦中", "由於資料量夠大,Hadoop不會儲存資料的備份", "Hadoop預設,由於資料量十分龐大,所以不可能在處理之前就清理乾淨、排序整齊", "與過去的關聯式資料庫相比,Hadoop輸出的結果比較不準確"], "a": 1}, {"n": 24, "g": "mr", "q": "如果使用者在MapReduce中打算使用外部執行檔來定義其工作,需要利用下列何者?", "o": ["Virtual Machine", "Streaming", "Pipeline", "Filter"], "a": 1}, {"n": 25, "g": "mining", "q": "下列何者是知識發現(Knowledge Discovery)的正確程序?", "o": ["資料探勘、資料準備、樣式評估、知識呈現", "資料準備、資料探勘、樣式評估、知識呈現", "資料準備、樣式評估、資料探勘、知識呈現", "資料準備、資料探勘、知識呈現、樣式評估"], "a": 1}, {"n": 36, "g": "mining", "q": "透過迴歸分析演算法可以進行資料關連性分析。現考量運用三種行銷廣告通路:電視、廣播、報紙的預算金額分配額度大小,找出它們對於產品銷售值(sales)的影響。請問下列敘述何者有誤?", "o": ["電視、廣播、報紙三種特徵值為獨立變數,而sales是我們要預測的結果,因此為相依變數", "對於獨立變數如電視、廣播、報紙,我們允許使用連續量化變數,同時也允許使用類別式變數(categorical variable)兩種資料型態,但是我們對於相依變數sales,僅允許使用類別式變數型態,因此一般性的迴歸分析演算法可以用來進行資料分類", "三種變數是否要納入迴歸分析方程式可以透過T-statistic的檢驗,並考量其F-statistic值越大、p-value的值愈小的變數者,其較具有影響力", "迴歸分析方程式有時需要考量獨立變數所表示特徵值是否有交互作用,而判斷交互作用的影響力也可運用T-statistic的檢驗,並透過高F-statistic值和低p-value值來判斷"], "a": 1}, {"n": 37, "g": "ml", "q": "透過統計學習方法論,我們希望找出一個決策樹資料分類器以避免資料分類時的過度解讀(overfitting),請問對於資料過度解讀的現象,下列何者有誤?", "o": ["決策樹分類器對於訓練資料集過度解讀,可以提高對於訓練資料集分類結果的準確率", "過度解讀對於測試資料的分類判斷結果其準確率很低", "我們可以用簡單決策樹分類器模型,來避免產生訓練資料集過度解讀的現象", "當每一次納入新的特徵值來成長決策樹結構時,當新增特徵值對於訓練資料集無法產生有效分類就該停止,因此用事後修剪決策樹的方法將無法避免資料過度解讀"], "a": 3}, {"n": 38, "g": "spark", "q": "對於巨量資料分析Spark平台,下列何者有誤?", "o": ["Spark有提供結構化資料格式的巨量資料分析功能", "Spark能夠透過多種電腦語言,如Scala, Python, R, Java來呼叫系統引擎", "Hadoop原有的MapReduce巨量資料分析的計算原理無法在Spark上來進行", "Spark是選擇Apache開放性系統發展模式,因此我們可以看到Spark系統的原始程式碼"], "a": 2}, {"n": 39, "g": "mining", "q": "一般推薦系統(Recommender System)時常會採用下列哪一個方法作為核心技術,來估計產品與使用者間的可能關係?", "o": ["Matrix Factorization", "Hashing", "Linear Discriminative Analysis (LDA)", "Part-of-Speech (POS) Tagging"], "a": 0}, {"n": 40, "g": "mining", "q": "下列何種統計學習的演算法是用來進行資料的分群(Clustering),但不能用來進行資料分類(Classification)?", "o": ["K-Means", "Bayes Nets", "Logistic Regression", "Support Vector Machine"], "a": 0}, {"n": 41, "g": "mining", "q": "巨量資料中的資料類別出現的頻率,時常會形成所謂的長尾現象,一般可利用以下哪種統計工具來描述此種形式的資料分佈?", "o": ["Zipf", "Gaussian", "Dirichlet", "Uniform"], "a": 0}, {"n": 42, "g": "ml", "q": "以分析使用者打卡(check in)的應用為例,如果打卡的位置為變數X。使用者A習慣在一個位置打卡(如公司),其打卡位置的分佈統計模型為PA (X);使用者B時常在都市內到處打卡,其分佈統計模型為PB(X)。請問何者的entropy,也就是H(.)較高?", "o": ["使用者A", "使用者B", "兩者一樣", "無法比較"], "a": 1}, {"n": 43, "g": "viz", "q": "在視覺化工具中為了在二維畫面中檢視資料點之間的關係(相似度或距離),例如社群網路、地圖中重要都市等,一般都使用下列哪種形式的演算法?", "o": ["Inverted-based Indexing", "Multidimensional Scaling (MDS)", "Approximate Nearest Neighbor (ANN)", "Ranking Methods"], "a": 1}, {"n": 44, "g": "mining", "q": "關於Bayes Nets與Naïve Bayes兩種統計學習演算法,下列何者有誤?", "o": ["Naïve Bayes的演算法假設特徵值相互之間的關連性是獨立", "Naïve Bayes學習演算可以算是Bayes Nets的一個特例,因為Bayes Nets並未假設特徵值相互之間的關連性是獨立", "Bayes Nets的計算是用條件機率來表示特徵值之間的關連性,並利用這些條件機率的相乘積結果來表示分類別機率的大小,以判斷最後分類別", "因為Naïve Bayes演算法的侷限性,它僅能作為資料分群,而不能作為資料分類使用"], "a": 3}, {"n": 45, "g": "hadoop", "q": "Hadoop一般對於疊代式(Iterative)程序執行起來較沒效率,主要原因為下列何者?", "o": ["Iteration不易平行化", "跨Iteration間的狀態不容易維持", "Hadoop不支持Iteration", "Hadoop不支援C語言"], "a": 1}, {"n": 46, "g": "mining", "q": "對於巨量資料分析所需要的統計(或機器)學習技術,下列何者有誤?", "o": ["統計(或機器)學習主要涵蓋有監督式、半監督式、非監督式等學習型態", "監督式學習主要提供資料分類(Classification),而非監督式學習只是提供資料的分群(Clustering)", "隨機樹叢(Random Forest)演算法是整合多個決策樹(Decision Trees)分類的演算法", "迴歸分析和KMeans兩種演算法常被用來進行巨量資料的分類"], "a": 3}, {"n": 47, "g": "prep", "q": "巨量資料分析的R程式語言具有多種不同資料結構型態(data types)的表達格式,下列何者有誤?", "o": ["R的資料結構型態表達格式主要包括:vector, matrix, array, data frame, list", "Matrix可以表示二維空間的資料結構,在matrix中所有元素必須是屬於相同資料型態", "Lists可以表示最複雜的資料結構型態,舉凡vectors, arrays, data frames甚至於lists本身的資料結構都可以被包含進來", "Data Frame的資料可以用data.frame()函式呼叫來產生,在data frame資料結構中屬於不同列資料其型態必須相同"], "a": 3}, {"n": 48, "g": "mr", "q": "關於巨量資料分析系統Hadoop平台,下列何者有誤?", "o": ["是一個開放式系統軟體,具有可靠度、可擴充性與分散式處理的功能", "HDFS主要是提供分散式檔案系統功能的軟體模組", "MapReduce主要是在叢聚式電腦系統上,進行資料分析時提供有效的資源管理", "HBase是一個具有可擴充性與結構化資料庫特性的軟體模組"], "a": 2}, {"n": 49, "g": "mr", "q": "關於巨量資料分析系統Hadoop平台,下列何者正確?", "o": ["可以提供Iterative演算法的有效計算", "可以透過MapReduce運算,提供各種進階式的結構化資料分析", "容錯功能是透過資料複製多份,並每一次的執行都寫入到硬碟的方式來完成", "Hadoop和MapReduce的整合性運作,可以有效完成圖論結構資料的巨量資料分析"], "a": 2}, {"n": 50, "g": "spark", "q": "在Spark大數據分析平台上執行下列的Python程式碼:file=spark.textFile(“hdfs://...”) \n//opens a file\ncounts=file.flatMap(lambda line: line.split(“ “)) \n//iterate over the lines, split each line by space into words\n.map(lambda word: (word, 1)) \n//for each word, create the tuple (word, 1)\n.reduceByKey(lambda a, b: a+b) \n//go over the tuples “by key” (first element)and sum the second elements\ncounts.saveAsTextFile(“hdfs://...”)\n當輸入短文: a spark can start a fire that burns the entire prairie請問最後存入到 HDFS 檔案的(key, value)一共有多少對?", "o": ["8", "9", "10", "11"], "a": 2}]}, {"id": "p105", "kind": "past", "title": "105 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "nosql", "q": "費林分類法(Flynn’s Taxonomy)是一種計算機架構的分類方式,根據指令和資料的相對關係,可以區分為四種,如以單一處理器來執行單一程式段落及單一資料的模式,下列何者正確?", "o": ["MIMD", "SIMD", "SISD", "MISD"], "a": 2}, {"n": 27, "g": "nosql", "q": "在CUDA(Compute Unified Device Architecture)中,memory的分配上是相當重要的問題,GPU上具有shared memory、global memory、constant memory,下列敘述何者正確?", "o": ["存取速度: global memory > shared memory > constant memory", "容量大小: global memory > constant memory > shared memory", "要在 shared memory 中宣告變數需在前面加上 device", "使用 shared memory 配置的變數,可以被grid中的所有thread存取"], "a": 1}, {"n": 28, "g": "nosql", "q": "在CUDA(Compute Unified Device Architecture)程式編寫中,如果我們要給每一個thread唯一的ID,起始值為0,且為整數,例如:0、1、2、3...循序下去,可以透過下列何者取得?", "o": ["blockIdx.x * blockDim.x + threadIdx.x", "blockIdx.x * blockDim.x - threadIdx.x", "blockIdx.x * threadIdx.x + blockDim.x", "blockIdx.x / blockDim.x + threadIdx.x"], "a": 0}, {"n": 29, "g": "dw", "q": "關於資料庫中使用的索引結構,下列何者有誤?", "o": ["B+-Tree", "FLA-Tree", "QuadTree", "R*-Tree"], "a": 1}, {"n": 30, "g": "ml", "q": "關於支持向量機(Support Vector Machine, SVM),下列敘述何者有誤?", "o": ["Kernel Function不只一種", "使用Kernel Trick來增加效率", "可對資料進行非線性分類", "將高維度的資料降至低維度以提升準確率"], "a": 3}, {"n": 31, "g": "basic", "q": "隨著巨量資料成為許多公司的競爭優勢,所有產業的架構也將重新調整,關於巨量資料對企業的影響,下列敘述何者有誤?", "o": ["各公司能得到的利益不會是平等的", "得利最多的會是大型企業和中型企業,小型企業將遭到嚴重衝擊", "持有許多大型資料來源,能輕鬆取用資料才是優勢", "競爭優勢的最核心重點,不是擺在硬體設施本身的規模"], "a": 1}, {"n": 32, "g": "mining", "q": "分析巨量社群網路資料時,下列敘述何者有誤?", "o": ["分析使用者的朋友數對了解社群網路是有幫助的", "分析使用者打卡(check in)地點有助於了解使用者空間上的資訊", "在分析時,使用者皆被視為只有一個社群網路帳號", "社群網路上的使用者會隨著時間而增減"], "a": 2}, {"n": 33, "g": "ml", "q": "關於機器學習演算法,下列敘述何者有誤?", "o": ["AdaBoost透過調整訓練資料(training data) 被抽樣到的機率以提升效能", "K-Nearest Neighbor可用於監督式學習", "決策樹(decision tree)可以不是二元樹(binary tree)", "過度解讀(overfit)可提升機器學習演算法之準確率,故大部分機器習演算法皆嘗試過度解讀訓練資料"], "a": 3}, {"n": 34, "g": "cloud", "q": "關於巨量資料的特色,下列敘述何者有誤?", "o": ["巨量資料特點之一是產生速度很快", "線上社群網站是巨量資料來源之一", "巨量資料一定要搭配雲端運算才能處理", "使用者的網路瀏覽紀錄亦可視為巨量資料"], "a": 2}, {"n": 35, "g": "ml", "q": "關於衡量機器學習中分類器(Classifier)效能的指標,下列何者有誤?", "o": ["Walter-Kimplin Curve", "Precision", "Recall", "ROC Curve"], "a": 0}, {"n": 36, "g": "mining", "q": "關於從社群網站抓取社群網路拓撲(Social Network Topology)資料,下列敘述何者有誤?", "o": ["深度優先搜尋(Depth-First-Search)是常用的方法之一", "廣度優先搜尋(Breadth-First-Search)是常用的方法之一", "取得之社群網路拓撲可視為整個線上社群網路的抽樣(sample)", "為了避免偏差(bias),可抓取多份不同的社群網路拓撲進行分析"], "a": 0}, {"n": 37, "g": "nosql", "q": "關於巨量資料分析常使用的 NoSQL 資料庫,下列敘述何者有誤?", "o": ["NoSQL 指的是 Not only SQL,通常不使用 SQL 做為查詢語言", "NoSQL 與傳統資料庫相同,都必須隨時確保資料一致", "NoSQL 沒有資料庫 schema 的欄位架構,因此可以隨著資料變動有彈性的進行欄位調整", "NoSQL 通常不支援 Join 操作"], "a": 1}, {"n": 38, "g": "mining", "q": "對於兩事件 A, B 的關聯式規則(Association Rule),下列敘述何者有誤?", "o": ["A=>B 的支持度(Support)定義為 A, B 兩事件共同出現的機率", "A=>B 的信心度(Confidence)定義為事件 A 發生的情形下,事件 B 也同時發生的條件機率", "項目A, B順序的調換對支持度不會有影響", "項目A, B順序的調換對信心度不會有影響"], "a": 3}, {"n": 39, "g": "mining", "q": "關於分群演算法(Clustering),下列敘述何者正確?", "o": ["分群屬於非監督式學習", "k-means演算法進行分群前,可先不決定k值", "分群演算法通常計算複雜度較分類要高", "分群的效果與資料數量、群集數量都無關"], "a": 0}, {"n": 40, "g": "mr", "q": "關於 MapReduce model,下列敘述何者有誤?", "o": ["MapReduce model 是 Google 所提出,用於大規模資料的平行運算", "在 MapReduce 分散式計算 model 中,只有 Map 及 Reduce 兩種運算", "Map 和 Reduce的概念是從 functional programming 而來", "Hadoop 為目前較為知名的 open source MapReduce project"], "a": 1}, {"n": 41, "g": "hadoop", "q": "關於 HDFS 架構,下列敘述何者有誤?", "o": ["Hadoop JobTracker 必須也是 HDFS 的 Namenode", "Hadoop JobTracker 負責分配工作,而 TaskTracker 負責執行工作", "Namenode 只能有一個,而 Datanode 通常有很多個", "Namenode 主要負責儲存檔案系統的索引,而 Datanode 負責儲存檔案的 data blocks"], "a": 0}, {"n": 42, "g": "nosql", "q": "下列何種方法比較不適合進行平行化?", "o": ["K-Means clustering", "Logistic Regression", "Newton’s method for finding roots", "PageRank"], "a": 2}, {"n": 43, "g": "mining", "q": "根據巨量資料分析的資料屬性,下列何者與其他屬性差異最大?", "o": ["社群網路分析", "股市趨勢分析", "路況車流分析", "環境感測資料分析"], "a": 0}, {"n": 44, "g": "basic", "q": "我們會定義資料為巨量、大或者海量,最主要的原因,是目前的資訊科技環境,提供了以下何種重要特性,使其稱為Big Data?", "o": ["Variety", "Veracity", "Velocity", "Volume"], "a": 0}, {"n": 45, "g": "spark", "q": "Spark 的 Word Count程式片段範例如下所示,下列敘述何者有誤?\ntext_file = sc.textFile(\"hdfs://...\")\ncounts = text_file.flatMap(lambda line: line.split(\" \")) \\\n.map(lambda word: (word, 1)) \\\n.reduceByKey(lambda a, b: a + b)\ncounts.saveAsTextFile(\"hdfs://...\")", "o": ["counts 從頭到尾就是單一個 RDD", "flatMap() 是依照分隔符號 (\" \") 將文字檔分成一個一個的字", "map() 將每個字計算一次", "reduceByKey() 將相同字的值相加"], "a": 0}, {"n": 46, "g": "mining", "q": "在巨量資料的想法中,強調的是去尋找事件或事物的相互關係(Correlation),非著重在傳統因果關係(Causality)的尋找,主要是因為當今環境變遷迅速,資料可以被即時收集且運算,因此,相互關係的尋找,更優於確立因果關係。請問,以下何種模型,可以用來協助尋找相互關係?", "o": ["時間序列分析", "類神經網路分析", "關聯規則分析", "決策樹分析"], "a": 2}, {"n": 47, "g": "mining", "q": "於巨量資料當中進行關聯規則的探勘(Association Rule Mining),採用Apriori 的方法,將會於每階段產生大量的組合,使得計算顯得沒有效率。但實際上,此方法因下列何種特性,使其不用去進行每一個候選組合的測試,而可以大量減少其演算時間?", "o": ["大數法則", "反單調性", "80/20準則", "維爾特定律"], "a": 1}, {"n": 48, "g": "mr", "q": "在巨量資料的技術堆疊中,哪一層將透過MapReduce,慣用程式碼的額外處理與建構中介資料結構,諸如:統計模型或資料立方體...等,所產生的結構,做為額外分析或傳統查詢工具查詢之用,使巨量資料做好接受進一步分析的準備?", "o": ["應用程式碼", "資料", "商業觀點", "儲存"], "a": 2}, {"n": 49, "g": "nosql", "q": "雲端運算技術是巨量資料處理的基礎,關於雲端運算技術,下列敘述何者正確?", "o": ["雲端運算強調基於實體化等技術,在分散式硬體環境上提供共用資源服務", "雲端運算以伺服器集群為中心,運算和資料儲存都由網路中心的雲端完成", "雲端運算的伺服器集群仍存在不穩定性,這使得基於雲端運算實現應用的範圍受限", "雲端運算伺服器之間是分散式結構,流量具天然的對稱特點,符合現階段的網路頻寬特點"], "a": 1}, {"n": 50, "g": "mr", "q": "下列哪一項目不是Google 於2003~2006年前後,發表奠定巨量資料技術理論基石的技術?", "o": ["BigTable", "GFS", "Hadoop", "MapReduce"], "a": 2}]}, {"id": "p106", "kind": "past", "title": "106 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "hadoop", "q": "下列哪項不是Hadoop之特性?", "o": ["開放原始碼 (Open Source)", "即時性(Real Time)", "以Java為其程式基礎", "分散式計算 (Distributed Computing)"], "a": 1}, {"n": 27, "g": "spark", "q": "下列哪項不是 Apache Spark 2.0 所支援的程式語言?", "o": ["Scala", "R", "C++", "Python"], "a": 2}, {"n": 28, "g": "ml", "q": "在類神經網路(Neural Network)分類器中,一個 sigmoid node 的輸出數值是下列何者?", "o": ["沒有限制,可以是任何實數", "介於0與1之間", "沒有限制,可以是任何整數", "介於-1與1之間"], "a": 1}, {"n": 29, "g": "ml", "q": "有關類神經網路(Neural Network)之敘述,下列何者有誤?", "o": ["使用成千上萬個神經元(Neuron)作為處理器", "其學習過程是一個不斷的嘗試錯誤(Trial and Error)", "用於影響辨識時,須制訂一系列的規則來識別樣式 (Patterns)", "相較全連通網路(Fully Connected Networks),卷積神經網路 (Convolutional Neural Networks)通常擁有較少須學習的參數"], "a": 2}, {"n": 30, "g": "ml", "q": "有關應用卷積神經網路(Convolutional Neural Networks,簡稱CNNs)於影像分析之敘述,下列何者正確?① 較前面的處理層 (Layer) 過濾器通常可包含邊緣偵測器 (Edge Detector)② 和擁有相同層數以及每層內有相同神經元個數的全連通網路 (Fully-connected Networks)比起來,CNNs用有更多參數③ 一個CNN可用來訓練非監督式學習模型,但一般的類神經網路則不行④ 池化層(Pooling Layers) 可降低影像的空間解析度", "o": ["① ②", "② ③", "③ ④", "① ④"], "a": 3}, {"n": 31, "g": "mining", "q": "有關分析巨量社群網路資料之敘述,下列何者有誤?", "o": ["連結預測(Link Prediction) 之技術可用來推薦朋友", "使用者的朋友個數之分配通常遵從冪次法則(Power-law distribution)", "在計算資源有限時,我們通常對社群網路中的節點進行簡單隨機抽樣,以抽取出具有結構代表性的社群網路子圖(subgraph)", "社群網路中任兩位使用者的距離可能隨時間而增減"], "a": 2}, {"n": 32, "g": "mining", "q": "有關頻繁樣式探勘(Frequent Pattern Mining) 之敘述,下列何者有誤?", "o": ["若一項目集合之所有子集合皆為頻繁,則該項目集合必定也為頻繁", "所有最大(maximal) 頻繁項目集合都是封閉的(closed)", "對於一關聯式規則(Association Rule),若將一規則左手邊之項目搬到規則右手邊,不會降低該規則之信心度(Confidence)", "對於一關聯式規則,將規則左右兩邊之項目集合對調,不會影響支持度(Support)"], "a": 0}, {"n": 33, "g": "mr", "q": "巨量資料庫管理最常用的操作包含Selection、Projection、Union與Intersection。對於此4種資料庫操作,若想實作在Hadoop的工作任務中,哪2種操作需要同時使用一個Mapper與一個Reducer?", "o": ["Selection與Projection", "Selection與Union", "Projection與Intersection", "Union與Intersection"], "a": 0}, {"n": 34, "g": "ml", "q": "在資料分析中,經常遇到一分類或預測模型產生高或低的偏差(Bias) 與變異性(Variance)。以下有4個關於模型偏差與變異數之敘述,下列何者正確?① 過適(Overfitting)的模型通常有較高的偏差② 過適(Overfitting)的模型通常有較低的偏差③ 乏適 (Underfitting)的模型通常有較高的變異性④ 乏適 (Underfitting)的模型通常有較低的變異性", "o": ["① ③", "① ④", "② ③", "② ④"], "a": 3}, {"n": 35, "g": "dw", "q": "下列何種資料格式經常被定義為半結構化資料(Semi-structured Data)?", "o": ["關聯式資料庫中的表格(Table)資料", "影音(Video)檔案", "JSON 檔案", "Email內文文字"], "a": 2}, {"n": 36, "g": "ml", "q": "在巨量資料分析專案中,下列何者比較無助於提升分類模型準確度(Accuracy)?", "o": ["使用交叉驗證(Cross-Validation)", "增加或減少模型參數(Parameters)以提升或降低模型複雜度", "進行更進一步的特徵工程(Feature Engineering)", "取得與使用有更多變數/特徵(Variables/Features)的訓練資料"], "a": 0}, {"n": 37, "g": "ml", "q": "下列的統計學習(Statistical Learning)方法經常被用於分析巨量資料,請問何者應用的領域問題與其它不同?", "o": ["隨機森林(Random Forests)", "主成分分析(Principal Component Analysis)", "彈性網絡(Elastic Net)", "分類迴歸樹(Classification and Regression Tree)"], "a": 1}, {"n": 38, "g": "nosql", "q": "有關隨機森林(Random Forests)之敘述,下列何者正確?", "o": ["採用 Boosting 方法", "使用多個淺層決策樹 (Decision Stump) 構建整個森林", "是一種重抽樣(Re-sampling)技術的應用", "模型訓練的運算較難平行化"], "a": 2}, {"n": 39, "g": "ml", "q": "在統計學習(Statistical Learning)方法論中,有關模型的過適(Overfitting)之敘述,下列何者有誤?", "o": ["此種模型的錯誤(Error)常來自於高的方差(High Variance)", "此種模型的參數較少或複雜度過低", "此種模型過度學習訓練資料集(Training Dataset)", "採用Bagging技術有可能避免過度擬合"], "a": 1}, {"n": 40, "g": "dw", "q": "有關近年來巨量資料處理與分析的發展,下列何者有誤?", "o": ["異質運算(Heterogeneous Computing)的興起", "記憶體內運算(In-memory Computing)的普及", "資料湖(Data Lake) 的採用", "關聯式資料庫系統(Relational Database Systems)的沒落"], "a": 3}, {"n": 41, "g": "spark", "q": "有關巨量資料分析的平台環境建置之敘述,下列何者正確?", "o": ["傳統的關聯式資料庫管理系統無法處理巨量資料", "NoSQL資料庫系統已逐漸取代傳統的關聯式資料庫系統", "Apache Hadoop可用來建構資料湖(Data Lake)", "Apache Spark不適合用來處理串流(Streaming) 資料"], "a": 2}, {"n": 42, "g": "mr", "q": "有關 MapReduce程式模型(Programming Model)之敘述,下列何者有誤?", "o": ["比較不適合用來處理疊代式(Iterative) 的資料處理分析過程", "概念來自於函數式程式語言(Functional Programming Languages)", "不適合用來處理資料量相對較小,但運算量大的工作", "Combiner 的使用可以減少資料在各節點(Node)之間的傳輸"], "a": 2}, {"n": 43, "g": "ml", "q": "有關統計學習(Statistical Learning)中的非監督式學習(Unsupervised Learning)方法,下列敘述何者有誤?", "o": ["可以做為維度縮減 (Dimensionality Reduction) 的工具", "此類方法也可用於特徵工程 (Feature Engineering)", "是一種無目標變數 (Target Variable) 的模型學習方法", "Receiver Operating Characteristic (ROC) 曲線常用來評估此類模型優劣"], "a": 3}, {"n": 44, "g": "mining", "q": "下列統計學習(Statistical Learning)的方法或過程,何者不易受到變數尺度(Scale)不同的影響?", "o": ["決策樹學習(Decision Tree Induction)", "K-近鄰算法 (k-nearest Neighbors Algorithm)", "K-均值聚類算法 (K-means Clustering)", "隨機梯度下降 (Stochastic Gradient Descent)"], "a": 0}, {"n": 45, "g": "prep", "q": "如何降低模型過適(Overfitting)問題?", "o": ["降低資料量", "在目標函數中加入參數正則化(Regularization) 項", "對資料作正規化(Normalization)前處理", "使用測試資料建模"], "a": 1}, {"n": 46, "g": "mining", "q": "資料前處理在資料探勘是一個非常重要的步驟,下列哪一個步驟不屬於資料前處理?", "o": ["模型解釋", "處理遺失值", "移除離群值", "資料數值正規化"], "a": 0}, {"n": 47, "g": "mr", "q": "在Hadoop中,下列何者為有效的資料分析流程?", "o": ["Input → Reducer → Mapper → Combiner → Output", "Input → Mapper → Reducer → Combiner → Output", "Input → Mapper → Combiner → Reducer → Output", "Input → Reducer → Combiner → Mapper → Output"], "a": 2}, {"n": 48, "g": "viz", "q": "資料視覺化是資料處理中一項重要工作,通常資料視覺化需要使用到下列哪種方法?", "o": ["資料維度降維", "建立分類模型", "建立迴歸模型", "調整模型參數"], "a": 0}, {"n": 49, "g": "spark", "q": "下列何者並非Hadoop與Spark共同擁有的特色?", "o": ["皆為叢集計算環境", "皆擁有自己的檔案系統", "皆使用開放原始碼應用程式介面 (API) 來連結其他資料分析工具", "皆為資料處理平台"], "a": 3}, {"n": 50, "g": "ml", "q": "下列哪項不是主成分分析(Principal Component Analysis)之特性?", "o": ["屬於非線性降維方法", "第一主成分跟第二主成分會正交", "通常可以提升模型訓練速度", "屬於非監督式方法"], "a": 0}]}, {"id": "p107", "kind": "past", "title": "107 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "mining", "q": "下列何者不是維度縮減(dimensionality reduction)之方法?", "o": ["Random projection", "Principal component analysis (PCA)", "Clustering algorithms", "Classical multidimensional scaling (cMDS)"], "a": 2}, {"n": 27, "g": "mr", "q": "有關Hadoop的軟體疊層架構中之元素,下列何者有誤?", "o": ["Big Table", "Hadoop MapReduce", "HDFS", "HBase"], "a": 0}, {"n": 28, "g": "privacy", "  false, "qs": [{"n": 26, "g": "cloud", "q": "關於雲端運算之敘述,下列何者有誤?", "o": ["公有雲不一定免費,但可降低硬體投資和機房管理等成本", "使用雲端服務之付費方式採用「Pay-As-You-Go」", "AWS EC2 屬於雲端服務中之 SaaS", "OAuth 2.0 協議的授權碼授予模式,需要服務端之認證伺服器許可"], "a": 2}, {"n": 27, "g": "mining", "q": "何者非屬監督式學習之演算法?", "o": ["決策樹", "隨機森林", "支持向量機", "關聯規則"], "a": 3}, {"n": 28, "g": "viz", "q": "針對巨量資料之特性,下列何者有誤?", "o": ["巨量資料之巨量性質(volume)意指存放數據量超過 PB", "巨量資料之即時性質(velocity)意指數據擷取時間不到 1 秒", "巨量資料等同於巨大價值(value)", "根據巨量資料分析需求之改變趨勢,視覺化(visualization)在分析中日趨重要"], "a": 2}, {"n": 29, "g": "spark", "q": "針對 Apache Spark,下列何者有誤?", "o": ["in-memory 之計算框架", "不允許用戶將資料載入至叢集記憶體內儲存", "多次記憶體重覆運算", "非常適合用於機器學習演算法"], "a": 1}, {"n": 30, "g": "prep", "q": "影響資料分析技術之重要資料集特質,下列何者有誤?", "o": ["維度(dimensionality)", "稀疏性(sparsity)", "連續性(continuity)", "分辨度(resolution)"], "a": 2}, {"n": 31, "g": "prep", "q": "巨量資料之定義為何?", "o": ["巨量資料中有 70 % 都為結構化資料", "巨量資料除資料量龐大外,其資料特性具變化速度快及多樣性", "儲存的資料內容不包含影片或電子郵件", "巨量資料強調資料數量能為企業帶來商業機會"], "a": 1}, {"n": 32, "g": "mining", "q": "若欲將大量資料進行分群,下列何種方法不適合?", "o": ["決策樹法", "K-means法", "階層式方法", "SOM方法"], "a": 0}, {"n": 33, "g": "prep", "q": "關於巨量資料之特性,下列何者正確?", "o": ["堅持原始資料都要做到標準化與精確", "陷入資料獨裁之問題", "利用「隨機取樣」處理所有的資料", "看重資料之間的因果關係"], "a": 1}, {"n": 34, "g": "spark", "q": "下列何者非屬巨量資料分析工具?", "o": ["Spark", "Python", "Spigot", "Julia"], "a": 2}, {"n": 35, "g": "basic", "q": "關於由小到大的電腦容量(單位),下列何者正確?", "o": ["YB<GB<TB<PB", "GB<TB<PB<EB", "TB<PB<YB<EB", "GB<TB<ZB<EB"], "a": 1}, {"n": 36, "g": "basic", "q": "巨量資料分析所蒐集之資料來源,下列何者與其他來源差異最大?", "o": ["養殖水產保險", "網路溫度計", "豆腐指數", "753感冒指數"], "a": 1}, {"n": 37, "g": "basic", "q": "關於工業 4.0 製造模式轉變,下列何者正確?", "o": ["將原本 B2C 之製造模式轉變為 C2B", "將原本 B2C 之製造模式轉變為 B2B", "將原本 B2B 之製造模式轉變為 C2B", "將原本 B2B 之製造模式轉變為 C2C"], "a": 0}, {"n": 38, "g": "mining", "q": "針對巨量資料分析進行資料探勘(data mining),下列何者有誤?", "o": ["找尋趨勢", "找尋特徵", "找尋相關性", "無法發掘出各種假設"], "a": 3}, {"n": 39, "g": "ml", "q": "下列何者非屬邏輯迴歸(logistic regression)之特性?", "o": ["離散選擇法模型之一", "屬於多重變量分析範疇", "需要常態分配的假設", "羅吉斯迴歸用到的對數函數是Sigmoid函數"], "a": 2}, {"n": 40, "g": "ml", "q": "強化學習(reinforcement learning)系統中不包括下列何者?", "o": ["智能體( agent )", "獎賞( reward )", "回應( response )", "環境( environment )"], "a": 2}, {"n": 41, "g": "ml", "q": "關於遷移學習(transfer learning)特性,下列何者有誤?", "o": ["遷移學習之重點是不必儲存已解決一個問題之模型", "遷移學習被應用於認知科學", "可使用遷移學習重新利用既有神經網絡", "遷移網絡之應用包括語句分類,篩選垃圾郵件與簡訊以及發現癌症種類"], "a": 0}, {"n": 42, "g": "hadoop", "q": "配置 Hadoop 時,JAVA_HOME 包含在下列何者配置檔案中?", "o": ["hadoop-default.xml", "hadoop-site.xml", "configuration.xsl", "hadoop-env.sh"], "a": 3}, {"n": 43, "g": "dw", "q": "Java 語言之 Buffered Reader 類別是將資料讀入下列何者當緩衝區?", "o": ["陣列", "資料庫", "檔案", "變數"], "a": 0}, {"n": 44, "g": "hadoop", "q": "巨量資料分析之資料存在著資料量大、非結構化、高度異質性等特性,下列何種資料庫工具最不適宜運用在此類型工作?", "o": ["Mongodb", "Redis", "Sybase", "Hbase"], "a": 2}, {"n": 45, "g": "dw", "q": "關於關聯式資料庫資料表(table)之敘述,下列何者正確?", "o": ["是一維資料組成之集合", "資料表由橫列和直行所組成", "一般不會設定主索引鍵", "資料表每一列表示屬性"], "a": 1}, {"n": 46, "g": "ml", "q": "關於遞歸神經網路(RNN)之基本概念,下列何者有誤?", "o": ["反向傳播的權重更新不會造成梯度爆炸", "長短期記憶模組共 4 層,比 RNN 多 3 個 S 型函數層", "長短期記憶模組,能改善 RNN 在長期記憶之不足", "可用來處理時間序列資料"], "a": 0}, {"n": 47, "g": "mining", "q": "關於機器學習之敘述,下列何者正確?", "o": ["主成分分析法( PCA )是用於資料之降維", "用大量人力對訓練資料集來標籤特徵,是強化學習( RL )之特色", "Q-Learning 之 γ 數值趨向於 1 ,表示 agent 只在乎目前可獲得之獎勵", "監督式學習之演算法有邏輯迴歸和 K-means 等"], "a": 0}, {"n": 48, "g": "ml", "q": "有關卷積神經網路之基本概念,下列何者有誤?", "o": ["運作流程:輸入的圖片→特徵擷取→分類辨識", "池化層會使用到 ReLU 之激勵函數", "得到之特徵圖比原圖要小,被稱為valid padding", "可應用於人臉識別、語音識別等"], "a": 1}, {"n": 49, "g": "mr", "q": "關於巨量資料中之資料庫,下列何者有誤?", "o": ["HBase 技術提供非關聯式資料庫( NoSQL )之儲存環境", "HBase 技術支援隨機存取功能", "無法直接透過 SQL 來查詢 Hadoop 儲存之資料", "Apache Hive 就是把 SQL 編譯成 Map Reduce,從而讀取和操作 Hadoop 上之資料"], "a": 1}, {"n": 50, "g": "basic", "q": "下列何者非屬資料操作語言(data manipulation language)?", "o": ["INSERT", "UPDATE", "DELETE", "CREATE"], "a": 3}]}, {"id": "p109", "kind": "past", "title": "109 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "mr", "q": "下列何者不是Apache Hadoop之特色?", "o": ["使用MapReduce程式框架", "支援Java語言", "Apache Mahout是一種用來支援Apache Hadoop分散式工作程序管理的程式庫", "使用Hadoop Distributed File System"], "a": 2}, {"n": 27, "g": "hadoop", "q": "對於HDFS Shell指令,下列敘述何者有誤?", "o": ["Hadoop fs -ls用來列出HDFS檔案與目錄列表", "Hadoop fs -rm input/masters刪除HDFS上的檔案", "Hadoop fs -cat input/slaves壓縮HDFS內之檔案", "Hadoop fs -put conf input將本地端檔案上傳至HDFS"], "a": 2}, {"n": 28, "g": "mining", "q": "對於 k-均值(k-means)聚類演算法的敘述,下列何者有誤?", "o": ["k-均值中update的程序,將更新聚類中心", "k-均值中assign的程序,將比較各資料點之間的距離,並將各資料點以隨機方式分配至其中一個聚類", "k-均值中的k值表示資料將分成幾類,需事先給定", "每一次執行的k-均值演算法,其結果可能會不一樣"], "a": 1}, {"n": 29, "g": "nosql", "q": "對於NoSQL資料庫說明,下列何者有誤?", "o": ["可採用Key-DM資料架構來建立資料庫", "使用記憶體方式建立分散資料庫", "MongoDB是一種NoSQL的資料庫", "各種NoSQL資料庫所支援的語言可能不同"], "a": 0}, {"n": 30, "g": "ml", "q": "對監督式學習(supervised learning)的說明,下列何者有誤?", "o": ["監督式學習需要使用標記過類別的資料(labeled data)進行訓練(training)", "監督式學習可以跟非監督式學習整合,進行資料分析", "目前所有的監督式學習的方法,皆無法對線性不可分(nonlinear)的資料進行分類", "將資料的所有特徵(feature)放入監督式學習,不一定會找到最好的分類方式"], "a": 2}, {"n": 31, "g": "ml", "q": "以機器學習對於巨量資料進行分析後,通常會使用混淆矩陣(confusion matrix),對於所產生的分類器進行評估,其中將分析結果分為true positive (TP)、true negative (TN)、false positive (FP)及false negative (FN),下列敘述何者有誤?", "o": ["正確率Accuracy = (TP + TN) / (TP + TN + FP + FN)", "召回率Recall = TP / (TP + FN)", "精確率Precision = TP / (TP + FP)", "F1 Score = TP / (TP + FP + FN)"], "a": 3}, {"n": 32, "g": "ml", "q": "對於大量資料分析的技術,下列敘述何者有誤?", "o": ["PageRank是用來對於數值資料進行資料壓縮的演算法", "支持向量機(support vector machine)的核函式(kernel function)選擇會影響分析結果", "k-最近鄰居(k-nearest neighbors)是用來對於資料分類的監督式演算法", "k-中心點(k-medoids)是用來對於資料分類的非監督式演算法"], "a": 0}, {"n": 33, "g": "mr", "q": "使用MapReduce框架來設計一個字數統計(word count)程式,其程式所進行的常用標準程序應為下列何者?", "o": ["Input → Splitting → Mapping → Shuffling → Reducing → Final Result", "Input → Mapping → Splitting → Shuffling → Reducing → Final Result", "Input → Mapping → Splitting → Reducing → Shuffling → Final Result", "Input → Reducing → Splitting → Shuffling → Mapping → Final Result"], "a": 0}, {"n": 34, "g": "nosql", "q": "CAP定理可用來分析NoSQL資料庫的特性,下列對於NoSQL資料庫及CAP定理之敘述,何者有誤?", "o": ["CAP定理的「C」代表的是一致性(consi eNode非常重要,當NameNode壞掉時,所有資料儲存地址都會消失,導致資料會全部遺失。下列預防NameNode壞掉之方式,何者有誤?", "o": ["利用Network File System (NFS)將NameNode儲存資料做備份", "直接建立第2個NameNode當作備份", "每個DataNode節點都可以設置1個NameNode,避免遺失", "將NameNode執行於高階電腦上"], "a": 2}, {"n": 40, "g": "spark", "q": "一般會要求Spark的使用者將RDD(Resilient Distributed Dataset)變數宣告為唯讀性質的val,原因是下列何者?", "o": ["確保資料在平行計算時的一致性", "確保資料在平行計算時的安全性", "確保資料在分散儲存時的完整性", "確保資料在分散儲存時的獨立性"], "a": 0}, {"n": 41, "g": "mining", "q": "進行資料分群時,下列敘述何者表示好的分群結果?", "o": ["群內成員相似度高,群間成員相似度低", "群內成員相似度高,群間成員相似度高", "群內成員相似度低,群間成員相似度低", "群內成員相似度低,群間成員相似度高"], "a": 0}, {"n": 42, "g": "privacy", "q": "有關資料前處理方法-獨熱編碼(One-Hot-Encoding, OHE),下列敘述何者有誤?", "o": ["若某個資料屬性有 N 種類別，則需要 N 個維度的二位元向量來表示", "若編碼後的向量，其維度 i 之值為 1，則代表資料屬於類別 i", "若 (A) 中的 N 值很大，則編碼後的向量中，1 出現的次數可能會不只 1 次", "編碼後的向量將會是稀疏向量 (Sparse Vector)"], "a": 2}, {"n": 43, "g": "cloud", "q": "Gmail屬於下列何者服務?", "o": ["Infrastructure as a Service (IaaS)", "Platform as a Service (PaaS)", "Software as a Service (SaaS)", "Function as a Service (FaaS)"], "a": 2}, {"n": 44, "g": "mr", "q": "對於1年份刷卡資料,欄位有時間、店名、物品、刷卡金額及付款方式,若要使用MapReduce得到每家店此年銷售總額,請問應該使用下列何種Key-Value Pair?", "o": ["物品-刷卡金額", "店名-付款方式", "店名-刷卡金額", "時間-店名"], "a": 2}, {"n": 45, "g": "mr", "q": "對於為什麼HDFS的檔案塊(Blocks)預設成128MB為最佳狀態之敘述,下列何者正確?", "o": ["如設成128KB,則1個cluster會有太多檔案塊,造成NameNode很難儲存每個檔案塊之位置", "因為我們只能夠在1個節點上,存1個檔案的其中1個檔案塊", "因為若把檔案塊設成128KB,對於多個Mappers要同時處理來說太小了", "因為這樣每8個檔案塊剛好就是1GB,剛好適合伺服器核心數都是4或8的倍數"], "a": 0}, {"n": 46, "g": "ml", "q": "人工智慧(AI)、深度學習(DL)與機器學習(ML)之關係為下列何者?", "o": ["DL ⊂ ML ⊂ AI", "DL ⊂ AI ⊂ ML", "DL ⊂ ML = AI", "AI ⊂ ML ⊂ DL"], "a": 0}, {"n": 47, "g": "nosql", "q": "有關使用深度學習(Deep Learning)於序列資料中,下列敘述何者有誤?", "o": ["可以使用卷積神經網路(Convolutional Neural Networks)", "可以使用循環神經網路(Recurrent Neural Network)", "循環神經網路(Recurrent Neural Network)使用平行計算效率佳", "循環神經網路(Recurrent Neural Network)之優化較卷積神經網路(Convolutional Neural Networks)複雜"], "a": 2}, {"n": 48, "g": "viz", "q": "視覺化是從巨量資料中得到洞見之重要工具,若我們想對於不同職業之平均收入繪圖,使用下列何圖較合適?", "o": ["直方圖", "折線圖", "河流圖", "散佈圖"], "a": 0}, {"n": 49, "g": "ml", "q": "強化學習(Reinforcement Learning)容易應用在遊戲,而較難應用在真實世界的主要原因,下列何者正確?", "o": ["產生序列過長,不易訓練", "獎勵(Reward)不明確", "真實世界動作(Action)為連續動作", "對於真實世界無法完整模擬"], "a": 3}, {"n": 50, "g": "hadoop", "q": "當雲端叢集有1個DataNode故障時,系統將進行何種操作?", "o": ["資料會遺失", "Hadoop會自動複製裡面所儲存之檔案塊於其他DataNode", "Hadoop會自動寄信給管理員警告此狀況", "Hadoop會繼續執行,只是有些資料塊會只有1份備份"], "a": 1}]}, {"id": "p112", "kind": "past", "title": "112 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "ml", "q": "在機器學習中,深度強化學習(Deep Reinforcement Learning)主要面臨的挑戰為下列何者?", "o": ["過擬合(Overfitting)", "計算效率", "缺乏大規模資料", "探索與利用的平衡"], "a": 1}, {"n": 27, "g": "prep", "q": "在機器學習中,遞迴類神經網路(RNN)主要用於處理下列何種類型之資料?", "o": ["非結構化資料", "圖像資料", "時序資料", "結構化資料"], "a": 2}, {"n": 28, "g": "prep", "q": "在巨量資料分析中,下列何者為主成分分析(PCA)之用途?", "o": ["資料壓縮", "資料可視化", "資料備份", "特徵選擇與降維"], "a": 3}, {"n": 29, "g": "mining", "q": "在巨量資料分析中,推薦系統的主要目標為何?", "o": ["評估資料相關性", "預測未來趨勢", "辨識異常行為", "提供個性化建議"], "a": 3}, {"n": 30, "g": "ml", "q": "維度災難(Curse of Dimensionality)指下列何者?", "o": ["資料集的數據維度過多", "資料集的數據維度過少,導致計算困難", "資料集的數據分佈不平均", "資料集中的數據缺乏多樣性"], "a": 1}, {"n": 31, "g": "basic", "q": "考慮巨量資料的特性,下列何者最能描述「Velocity」之特性?", "o": ["資料的快速產生、傳輸、即時處理", "資料多樣性", "資料的大規模與容量", "資料的真實性與準確性"], "a": 0}, {"n": 32, "g": "nosql", "q": "當面對結構化和非結構化的巨量資料時,下列哪項存儲技術最適合存放非結構化資料?", "o": ["資料倉儲", "關聯式資料庫", "NoSQL資料庫", "OLAP立方體"], "a": 2}, {"n": 33, "g": "prep", "q": "在資料工程項目中為確保資料完整性,下列哪種技術是必要的?", "o": ["資料加密(Encryption)", "資料驗證(Validation)", "資料壓縮(Compression)", "資料隨機化(Randomization)"], "a": 1}, {"n": 34, "g": "mr", "q": "針對巨量資料處理,台灣的一家公司決定使用MapReduce進行數據處理,下列何者最能說明MapReduce之操作方式?", "o": ["首先彙整資料,然後再分配給不同的節點進行處理", "在單一伺服器上進行所有計算,然後將結果分配給客戶端", "先將資料映射到各節點,再從各節點彙整結果", "資料首先被分配給節點,每個節點獨立運算,不需要合併結果"], "a": 2}, {"n": 35, "g": "ml", "q": "在數據科學領域中,當數據分佈不均衡時,下列哪個評估指標最適合用於分類器性能評估?", "o": ["精確度(Accuracy)", "F1分數(F1-Score)", "正確率(Precision)", "召回率(Recall)"], "a": 1}, {"n": 36, "g": "ml", "q": "下列有關過擬合(Overfitting)之處理策略,何者有誤?", "o": ["利用數據增強如圖片旋轉,增加數據多樣性", "不斷增加訓練次數,直到訓練誤差趨近於零", "使用Dropout技巧隨機丟棄神經元", "使用早停法(Early Stopping)"], "a": 1}, {"n": 37, "g": "dw", "q": "下列何者屬於資料探勘研究的範疇?", "o": ["專家系統的推論", "SQL查詢處理", "敘述統計處理", "分群處理"], "a": 3}, {"n": 38, "g": "ml", "q": "使用卷積神經網路(CNN)進行圖像辨識時,下列哪一層負責提取圖像的基本特徵?", "o": ["全連接層(Fully Connected Layer)", "池化層(Pooling Layer)", "歸一化層(Normalization Layer)", "卷積層(Convolution Layer)"], "a": 3}, {"n": 39, "g": "mining", "q": "當一家醫院希望分析病人的醫療紀錄以預測其再入院的風險時,最適合使用下列哪一種機器學習任務?", "o": ["廻歸(Regression)", "分類(Classification)", "聚類(Clustering)", "降維(Dimensionality Reduction)"], "a": 1}, {"n": 40, "g": "mining", "q": "在機器學習中,哪一種演算法是基於樹狀結構,且適用於分類與預測問題?", "o": ["支持向量機(Support Vector Machine)", "隨機森林(Random Forest)", "K均值聚類法(K-Means Clustering)", "主成分分析(Principal Component Analysis)"], "a": 1}, {"n": 41, "g": "prep", "q": "在機器學習中,特徵工程(Feature Engineering)指下列何者?", "o": ["創造新的數據特徵以提高模型的特性", "調整模型的超參數以改善性能", "清理數據以去除離群值", "壓縮數據以節省儲存空間"], "a": 0}, {"n": 42, "g": "ml", "q": "在類神經網路中,反向傳播(Backpropagation)是用來執行下列哪個關鍵任務?", "o": ["將資料從輸入層傳遞至輸出層", "調整神經元的啟動函數(Activation Function)", "計算損失函數的梯度,以更新權重", "創造新的神經元層"], "a": 2}, {"n": 43, "g": "dw", "q": "假設銷售點有3類項目集{a,b,c};資料庫共有3筆交易:{b},{b、c},{a、b、c}。若關聯規則要求最小支持度為2/3,最小信心度為0.7。下列哪條關聯規則符合該要求?", "o": ["b→a", "b→c", "c→b", "ab→c"], "a": 2}, {"n": 44, "g": "mining", "q": "下列哪項目標不易透過資料探勘客戶交易資料達成?", "o": ["顧客的薪資預測", "顧客會一起購買的產品項", "猜測那些產品會先後購買", "猜測顧客信用卡被盜刷與否"], "a": 0}, {"n": 45, "g": "dw", "q": "下列何者非屬OLAP操作?", "o": ["下鑽(Drill down)", "資料修改(Update)", "切片(Slicing)", "切丁(Dicing)"], "a": 1}, {"n": 46, "g": "dw", "q": "下列何者非屬資料倉儲用的資料模型?", "o": ["物件導向(OOP)", "星型(Star)", "雪花(Snowflake)", "星雲(Constellation)"], "a": 0}, {"n": 47, "g": "ml", "q": "下列哪項方法較合適使用在進行數據分析時,可有效評估機器學習模型的性能以確保其在實際應用中具有良好的泛化能力?", "o": ["使用全部數據進行訓練", "增加特徵數量", "使用交叉驗證", "增加神經網路的深度"], "a": 2}, {"n": 48, "g": "mining", "q": "在分群演算法中,下列哪種度量不會用來衡量節點不純度(Node Impurity)?", "o": ["變異數", "TF/IDF", "基尼係數(Gini index)", "分類誤差"], "a": 1}, {"n": 49, "g": "mining", "q": "下列何者非屬基於內容推薦(Content-Based Recommendation)之優點?", "o": ["沒有稀疏(Sparsity)問題", "可建立使用者輪廓檔案", "能夠提供推薦的原因", "對於新品與冷門商品也會推薦"], "a": 1}, {"n": 50, "g": "nosql", "q": "有關分散式系統之優勢,下列何者有誤?", "o": ["彈性擴展(Scalability)", "高容錯性(Fault-tolerance)", "資料集中性(Centralization)", "資源最大化(Maximized Resource Utilization)"], "a": 2}]}, {"id": "p113", "kind": "past", "title": "113 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．答案為參考解答，非官方公布", "unofficial": true, "qs": [{"n": 26, "g": "ml", "q": "有關統計與機器學習的差異,下列敘述何者正確?", "o": ["統計是機器學習的一個子領域,兩者沒有明顯差異", "統計主要用於數據分析,機器學習主要用於模式識別和預測", "統計強調推論和參數估計,機器學習更側重模式識別和模型訓練", "統計使用傳統方法進行數據分析,機器學習使用深度學習方法進行模式識別"], "a": 2, "e": "統計重視模型假設、參數估計與推論；機器學習偏重從資料中學習模式並做預測。(A) 統計並非機器學習的子領域；(B)(D) 的區分過於片面，統計也能預測，機器學習也不只有深度學習。"}, {"n": 27, "g": "mining", "q": "下列何者非屬資料前處理(Data Preprocessing)的一環?", "o": ["特徵轉換", "資料分群", "遺失值填補", "異常值檢測與排除"], "a": 1, "e": "資料前處理包含清理、轉換、填補遺失值、處理離群值等；資料分群屬於分析建模階段的方法，不是前處理步驟。"}, {"n": 28, "g": "prep", "q": "何謂結構化資料(Structured Data)?", "o": ["由感測器產生的資料", "社群媒體上的使用者互動資料", "具固定格式,如表格資料", "無固定格式,如文字、影像"], "a": 2, "e": "結構化資料具有固定欄位與格式，例如關聯式資料表。(A)(B) 的資料可能是半結構化或非結構化；(D) 是非結構化資料的描述。"}, {"n": 29, "g": "prep", "q": "下列何者非屬低品質的資料?", "o": ["重複值", "離群值", "錯誤", "雜訊"], "a": 1, "e": "重複值、錯誤與雜訊都屬於資料品質問題；離群值可能是真實但罕見的觀測值，不一定是低品質資料，需要進一步判斷。"}, {"n": 30, "g": "mining", "q": "下列何者非屬分群的應用範圍?", "o": ["垃圾郵件過濾", "異常檢測", "顧客細分", "降維技術"], "a": 0, "e": "垃圾郵件過濾是有標籤的分類問題，屬於監督式學習；異常檢測、顧客細分都是分群常見應用，分群結果也可用於資料縮減。"}, {"n": 31, "g": "mining", "q": "下列何者非屬離群值的處理方式?", "o": ["直接刪除", "群集分析", "使用屬性絕對值", "用其他數值替換,將資料範圍正規化"], "a": 2, "e": "離群值可刪除、以其他數值取代並正規化，也可用群集分析找出；「使用屬性絕對值」並不能處理離群值。"}, {"n": 32, "g": "spark", "q": "Spark 的 DAG(Directed Acyclic Graph)在資料處理之作用,下列何者正確?", "o": ["定義資料內部的儲存結構", "定義資料處理的邏輯流程", "定義資料判斷的決策規則", "定義資料外部的呈現形式"], "a": 1, "e": "Spark 將轉換操作串成有向無環圖 (DAG)，代表資料處理的邏輯流程與依賴關係，再據此切分 stage 與排程。"}, {"n": 33, "g": "mining", "q": "下列何者非屬群集分析(Clustering Analysis)的 4 個主要階段?", "o": ["資料準備與特徵選取", "相似度計算", "非線性分類", "分群演算法"], "a": 2, "e": "群集分析的階段包含資料準備與特徵選取、相似度計算、執行分群演算法與結果評估；非線性分類是監督式分類的概念。"}, {"n": 34, "g": "mining", "q": "有關巨量資料的長尾效應(Long Tail Effect),下列敘述何者正確?", "o": ["資料量越大,價值就越大", "少數資料佔據大部分的價值", "資料的價值會隨著時間推移而衰減", "大量資料中隱藏著小眾但有價值的資訊"], "a": 3, "e": "長尾效應指大量小眾、需求零散的項目加總起來也有可觀價值，強調大量資料中隱藏著小眾但有價值的資訊。(B) 描述的是 80/20 法則。"}, {"n": 35, "g": "mining", "q": "在資料分群中,用以確定最佳聚類數量的技術為何?", "o": ["Elbow Method", "Gradient Descent", "Principal Component Analysis", "Random Forest"], "a": 0, "e": "手肘法 (Elbow Method) 繪製不同 k 值的組內誤差平方和，以曲線轉折處決定較佳群數。梯度下降是最佳化方法；PCA 是降維；隨機森林是分類迴歸模型。"}, {"n": 36, "g": "ml", "q": "何謂遷移學習(Transfer Learning)?", "o": ["在不同的環境中部署模型的過程", "在訓練模型中將資料轉移到不同存儲位置的過程", "將模型從一個硬體平台轉移到另一個硬體平台的過程", "在不同的機器學習任務之間轉移模型權重和知識的過程"], "a": 3, "e": "遷移學習把在來源任務學到的權重與知識轉用到相關的新任務，減少所需資料與訓練時間。其他選項描述的是部署或資料、硬體搬移。"}, {"n": 37, "g": "spark", "q": "Apache Spark 在巨量資料環境中的主要用途為何?", "o": ["資料清理", "即時與批次處理", "機器學習模型訓練", "資料視覺化"], "a": 1, "e": "Spark 是通用的分散式運算引擎，同時支援批次處理與即時串流處理；資料清理、機器學習與視覺化都只是其應用的一部分。"}, {"n": 38, "g": "ml", "q": "何謂交叉驗證(Cross-Validation)?", "o": ["將資料集隨機分為訓練集和測試集", "將資料集按照特徵分為訓練集和測試集", "將資料集按照時間順序分為訓練集和測試集", "將資料集多次隨機分為訓練集和測試集,取平均結果"], "a": 3, "e": "交叉驗證把資料多次切分成訓練集與驗證集，輪流訓練與評估後取平均，以更穩定地估計模型的泛化能力。(A) 只切一次是 hold-out。"}, {"n": 39, "g": "basic", "q": "有關自然語言處理(NLP)之步驟,下列何者正確?", "o": ["斷詞→詞性標記→相依剖析", "斷詞→相依剖析→詞性標記", "相依剖析→詞性標記→斷詞", "相依剖析→斷詞→詞性標記"], "a": 0, "e": "一般流程是先斷詞，再為每個詞做詞性標記，最後根據詞與詞性進行相依剖析，分析句子結構。"}, {"n": 40, "g": "mining", "q": "在機器學習演算法中,下列何者最能避免過度配適(Overfitting)?", "o": ["決策樹", "隨機森林", "羅吉斯迴歸", "K-means演算法"], "a": 1, "e": "隨機森林以多棵決策樹透過自助抽樣與隨機選特徵建立，再投票或平均，可有效降低單一決策樹的過度配適。"}, {"n": 41, "g": "hadoop", "q": "在Hadoop中,HDFS的資料冗餘機制為何?", "o": ["資料壓縮", "資料複製", "資料分片", "資料加密"], "a": 1, "e": "HDFS 以多份副本複製 (replication) 提供資料冗餘與容錯，預設副本數為 3。"}, {"n": 42, "g": "mining", "q": "假設使用半導體晶圓資料,良率資料之反應值以二元類別表示,請問上述情境最適合使用何種分析技巧?", "o": ["羅吉斯迴歸", "決策樹", "階層式聚類分析", "主成分分析"], "a": 0, "e": "反應變數為二元類別時，羅吉斯迴歸可估計良率屬於某一類別的機率，最常用於此類分析；聚類與 PCA 屬於非監督式方法。"}, {"n": 43, "g": "ml", "q": "在資料進行機器學習的過程中,正規化(Regularization)係指下列何者?", "o": ["一種降低資料維度的技術", "一種平衡類別分佈的方法", "一種改善模型可解釋性的方式", "一種透過在損失函數中添加懲罰防止過度配適的技術"], "a": 3, "e": "正規化在損失函數中加入 L1 或 L2 等懲罰項，限制參數大小，以防止過度配適。"}, {"n": 44, "g": "mining", "q": "下列何種機器學習技術適合偵測大型資料集中的異常值(Anomalies)?", "o": ["Apriori演算法", "隔離森林(Isolation Forest)", "線性迴歸(Linear Regression)", "神經網路(Neural Networks)"], "a": 1, "e": "隔離森林利用異常值較容易被隨機切分孤立的特性，適合在大型資料集中偵測異常值。Apriori 用於關聯規則；線性迴歸用於預測數值。"}, {"n": 45, "g": "ml", "q": "下列何種神經網路架構最適合分析序列資料,如時間序列或自然語言?", "o": ["生成對抗網路(GAN)", "卷積神經網路(CNN)", "前饋神經網路(FNN)", "循環神經網路(RNN)"], "a": 3, "e": "循環神經網路 (RNN) 及其變形 LSTM、GRU 具有記憶前一時間點狀態的機制，適合時間序列與自然語言等序列資料。"}, {"n": 46, "g": "ml", "q": "下列何者為使用機器學習時須注意之事項?", "o": ["確保模型訓練時間足夠長", "模型的複雜度越高越好", "需要有過去資料且資料充足", "模型的性能與模型的可解釋性無關"], "a": 2, "e": "機器學習需要足量且具代表性的歷史資料才能學習規律。訓練越久或模型越複雜不一定越好，可解釋性也是重要考量。"}, {"n": 47, "g": "ml", "q": "有關支持向量機(Support Vector Machine)中的「核技巧」(Kernel Trick),其作用為下列何者?", "o": ["處理高維資料", "減少支持向量的數量", "提高支持向量機的計算速度", "將非線性可分的資料轉換為線性可分的資料"], "a": 3, "e": "核技巧把資料隱性映射到高維空間，使原本非線性可分的資料在高維空間中變得線性可分，而且不必實際計算高維座標。"}, {"n": 48, "g": "prep", "q": "在 ETL 過程中,Transform 主要功能是將抽取之資料進行轉換,下列何者非屬其主要任務?", "o": ["資料格式轉換", "資料清洗", "資料備份", "資料聚合"], "a": 2, "e": "Transform 階段負責格式轉換、清洗、整合與聚合；資料備份屬於資料管理或維運工作，不是轉換的任務。"}, {"n": 49, "g": "ml", "q": "生成對抗網路(GAN)較常應用在下列何種技術上?", "o": ["影像生成", "語音識別", "文字分類", "物體檢測"], "a": 0, "e": "生成對抗網路由生成器與判別器互相對抗訓練，最常用於影像生成，例如人臉合成與風格轉換。"}, {"n": 50, "g": "cloud", "q": "下列何種技術可實現即時分析?", "o": ["OLAP", "串流處理", "批次處理", "資料倉儲"], "a": 1, "e": "串流處理在資料到達時就持續運算，可實現即時分析；OLAP、批次處理與資料倉儲多針對已累積的歷史資料。"}]}];

Object.assign(TAGS,{"t_p5pos": {"n": "詞性題", "t": "the／a／形容詞＋□＋of → 名詞（-tion／-ment／-ness／-ity）；be／冠詞＋□＋名詞 → 形容詞（-able／-ive／-al／-ous）；句子已完整，或夾在 be／助動詞與 p.p.／V-ing 之間 → 副詞（-ly）。"}, "t_p5conj": {"n": "連接詞 vs 介系詞", "t": "畫出空格後的區塊：有真動詞（is／was／has…）→ 連接詞 although／because／while；只有名詞或 V-ing → 介系詞 despite／due to／during。V-ing 與 to V 不是真動詞。"}, "t_p5pron": {"n": "代名詞", "t": "空格後接名詞 → 所有格；動詞或介系詞後 → 受格；句子完整、拿掉空格仍成立 → 反身代名詞（親自）；比較複數名詞用 those of，單數用 that of。"}, "t_p5fin": {"n": "真動詞判斷", "t": "1 個連接詞要 2 個真動詞。已有真動詞且沒有連接詞 → 刪掉現在式／過去式／未來式，只留 to V、V-ing、p.p.；還沒有真動詞 → 刪掉 to V 與 V-ing，再對主詞單複數。"}, "t_p5voice": {"n": "主動／被動", "t": "物當主詞先懷疑被動；最後一定要看受詞：及物動詞後面直接接名詞 → 主動；後面是 by／to／in／for 等介系詞或句號 → 被動 be＋p.p.。"}, "t_p5tense": {"n": "時態線索", "t": "since＋過去時間／for＋一段時間／over the past… → have／has＋p.p.；by＋未來時間／by the time＋現在式 → will have＋p.p.；yesterday／last…／…ago／in＋過去年份 → 過去式。"}, "t_p5vocab": {"n": "單字語意題", "t": "四個選項詞性相同時，不要逐字翻譯，先找句中的線索字（because、so、until、at no extra cost…）判斷需要的語意；再檢查動詞是否及物、後面接什麼介系詞。"}, "t_p5qty": {"n": "數量詞與可數／不可數", "t": "many／few／a few／fewer／a number of＋可數複數；much／little／a little／less／an amount of＋不可數。information、equipment、advice、furniture、baggage、feedback 都是不可數。"}, "t_p5det": {"n": "冠詞與限定詞", "t": "each／every／either／neither＋單數名詞與單數動詞；all／both／many＋複數；a／an 看發音（an hour、a university）；不可數名詞不用 a／an。"}, "t_p5indef": {"n": "不定代名詞", "t": "兩者：one…the other；三者以上的另一個：another；不特定的其他人：others；確定範圍中剩下的全部：the others；other 是形容詞，後面要接名詞；one／ones 代替前面的可數名詞。"}, "t_p5noun": {"n": "人物名詞 vs 事物名詞", "t": "四個選項都是名詞時，看主詞或受詞是否要做人的動作：applicant／application、attendee／attendance、participant／participation、supervisor／supervision。"}, "t_p5agree": {"n": "主詞動詞一致", "t": "先拿掉 of 片語、along with／as well as 片語找真主詞；the number of＋單數動詞，a number of＋複數動詞；either／neither A or／nor B 看靠近的 B；金額、時間視為單數。"}, "t_p5rel": {"n": "關係詞", "t": "先行詞是人／物，再看後面子句：缺主詞 who／which／that；缺受詞 whom／which；後面接名詞 whose；子句完整用 where／when／why；逗號後與介系詞後不用 that；沒有先行詞用 what。"}, "t_p5ncl": {"n": "名詞子句與間接問句", "t": "空格後是完整子句 → that（陳述）或 whether（是否）；缺名詞 → what／who／which；介系詞後與 to V 前只能用 whether；間接問句用「疑問詞＋主詞＋動詞」。"}, "t_p5cadv": {"n": "連接副詞與標點", "t": "however／therefore／moreover／otherwise／nevertheless 是副詞，不能只用逗號連接兩個子句，要用分號或句號；but／so／although／because 才是連接詞。"}, "t_p5corr": {"n": "相關連接詞", "t": "看到 both 選 and、either 選 or、neither 選 nor、not only 選 but also、whether 選 or；當主詞時 either／neither 句型的動詞看靠近的主詞。"}, "t_p5inv": {"n": "假設語氣與倒裝", "t": "Should＋主詞＋原形（萬一）；If＋過去式／were → would＋原形（與現在事實相反）；Had＋主詞＋p.p. → would have＋p.p.（與過去事實相反）；否定副詞放句首要倒裝。"}, "t_p5subj": {"n": "原形假設", "t": "suggest／recommend／require／request／insist／demand／ask that，以及 It is essential／important／necessary that，後面的子句都用原形動詞（被動用 be＋p.p.），主詞單數也不加 -s。"}, "t_p5comp": {"n": "比較級與最高級", "t": "有 than → 比較級；the＋最高級＋of／in 範圍；as＋原級＋as；兩者之間用比較級；修飾比較級用 much／far／even／significantly，修飾最高級用 by far；one of the＋最高級＋複數名詞。"}, "t_p5deg": {"n": "程度與結果句型", "t": "too＋形容詞＋to V（太…而不能）；形容詞＋enough＋to V；enough＋名詞；so＋形容詞／副詞＋that；such＋(a)＋形容詞＋名詞＋that。"}, "t_p5prep": {"n": "介系詞語意辨析", "t": "by＋期限（一次性動作）／until＋時間（持續狀態）；within＋時間長度（在…之內）／for＋時間長度（持續多久）；between 兩者／among 三者以上；at 時刻、on 日期、in 月份與年份。"}, "t_p5adv": {"n": "語意副詞", "t": "already 用於肯定句、yet 用於否定或疑問句句尾、still 表仍然；nearly／almost 幾乎；hardly 幾乎不；never 放在助動詞與 p.p. 之間；修飾動詞用 -ly 副詞。"}, "t_p5part": {"n": "分詞形容詞", "t": "人的感受用 -ed（interested、disappointed、excited）；事物的性質用 -ing（interesting、disappointing、confusing）；被動完成的狀態用 p.p.（attached、enclosed、limited、experienced）。"}, "t_p5ger": {"n": "動名詞 vs 不定詞", "t": "avoid／consider／finish／postpone／mind／appreciate／suggest＋V-ing；decide／agree／refuse／expect／hope／fail／plan＋to V；remember to V（還沒做）vs remember V-ing（做過）；be used to＋V-ing。"}, "t_p5caus": {"n": "使役動詞", "t": "have／let／make＋人＋原形；get／allow＋人＋to V；have／get＋物＋p.p.（請人把某物處理好）；help＋人＋(to) V。"}, "t_p5chunk": {"n": "固定搭配", "t": "不要只背中文，連前後字一起背：comply with、be eligible for、refrain from V-ing、be committed to V-ing、take effect、reach an agreement。看到空格後的介系詞就能直接秒選。"}});
TOEIC_EXAMS.push(...[{"id": "p5_pos_1", "kind": "toeic", "part": 5, "stage": 1, "title": "詞性題 1", "sub": "the／a＋□＋of → 名詞；be／冠詞＋□＋名詞 → 形容詞；句子完整或夾在 be／助動詞與 p.p.／V-ing 之間 → 副詞", "qs": [{"g": "t_p5pos", "q": "The marketing team will discuss the _______ of the new product line at Friday's meeting.", "o": ["introduced", "introduction", "introduce", "introductory"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "行銷團隊將在週五的會議上討論新產品線的推出。", "e": "訊號：the ＋ [空格] ＋ of → 名詞位置。四個選項只有 introduction（-tion）是名詞。", "w": "(C) 動詞原形；(D) 形容詞「介紹性的」；(A) 過去式／p.p.，都不能放在 the…of 中間。"}, {"g": "t_p5pos", "q": "Ms. Patel was praised for her _______ handling of the customer complaint.", "o": ["professional", "professionally", "profession", "professionalism"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Patel 女士因專業地處理客訴而受到稱讚。", "e": "訊號：所有格 her ＋ [空格] ＋ 名詞 handling → 修飾名詞要用形容詞，選 professional（-al）。", "w": "(C)(D) 是名詞，名詞前面不能再接名詞來描述「怎樣的處理」；(B) 副詞不能修飾名詞。"}, {"g": "t_p5pos", "q": "All employees must submit their expense reports _______ by the end of the month.", "o": ["prompter", "prompt", "promptness", "promptly"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "所有員工必須在月底前迅速提交費用報告。", "e": "訊號：submit（V）＋ their expense reports（O）已經是完整句 → 多出來的空格修飾動詞，選副詞 -ly。", "w": "(B) 形容詞／動詞；(C) 名詞；(A) 名詞「提詞員」或比較級形容詞，都不能修飾動詞。"}, {"g": "t_p5pos", "q": "The new software is highly _______ with most operating systems.", "o": ["compatibility", "compatibly", "compatible", "compatibilities"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新軟體與大多數作業系統高度相容。", "e": "訊號：be 動詞 is ＋ 副詞 highly ＋ [空格] → 主詞補語，選形容詞 compatible（-ible），固定搭配 be compatible with。", "w": "(A)(D) 名詞不能被 highly 修飾；(B) 副詞不能當 be 動詞的補語。"}, {"g": "t_p5pos", "q": "The board has _______ approved the merger with Delton Industries.", "o": ["unanimously", "unanimousness", "unanimity", "unanimous"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "董事會已一致通過與 Delton 工業的合併案。", "e": "訊號：空格夾在助動詞 has 與 p.p. approved 中間 → 100% 副詞，選 -ly。", "w": "(D) 形容詞；(B)(C) 名詞，都不能插在 has 與 p.p. 之間。"}, {"g": "t_p5pos", "q": "Please read the safety _______ carefully before operating the machine.", "o": ["instruct", "instructed", "instructions", "instructive"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "操作機器前請仔細閱讀安全須知。", "e": "訊號：read（及物動詞）後面需要受詞；the safety ＋ [空格] 是複合名詞（safety instructions）→ 選名詞。", "w": "(A) 動詞；(D) 形容詞「有教育意義的」；(B) 過去式／p.p.，都不能當 read 的受詞核心。"}, {"g": "t_p5pos", "q": "Greenfield Bank offers _______ rates on home loans for first-time buyers.", "o": ["compete", "competitively", "competition", "competitive"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Greenfield 銀行為首購族提供具競爭力的房貸利率。", "e": "訊號：動詞 offers ＋ [空格] ＋ 名詞 rates → 名詞前修飾語選形容詞 competitive（-ive）。", "w": "(A) 動詞；(B) 副詞不能修飾名詞；(C) 名詞，competition rates 不合文意。"}, {"g": "t_p5pos", "q": "The _______ of the annual conference has been moved to the Grand Hotel.", "o": ["locate", "location", "located", "locally"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "年度會議的地點已改到 Grand 飯店。", "e": "訊號：The ＋ [空格] ＋ of → 名詞，選 location（-tion）。而且它是主詞，後面接真動詞 has been moved。", "w": "(A) 動詞；(C) 過去式／p.p.；(D) 副詞，都不能當主詞。"}, {"g": "t_p5pos", "q": "Our customer service representatives respond _______ to all online inquiries.", "o": ["quick", "quickly", "quickening", "quickness"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們的客服人員會迅速回覆所有線上詢問。", "e": "訊號：respond 是不及物動詞，主詞＋動詞已完整 → 修飾動詞用副詞 quickly。", "w": "(A) 形容詞；(D) 名詞；(C) V-ing「加快中」，都不能修飾 respond。"}, {"g": "t_p5pos", "q": "Mr. Tanaka's _______ to the project was recognized at the awards ceremony.", "o": ["contribution", "contributed", "contribute", "contributive"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "田中先生對這個專案的貢獻在頒獎典禮上獲得肯定。", "e": "訊號：所有格 Mr. Tanaka's ＋ [空格] ＋ to → 名詞，選 contribution（-tion）。", "w": "(C) 動詞；(B) 過去式／p.p.；(D) 形容詞，所有格後面需要名詞。"}, {"g": "t_p5pos", "q": "The hotel's rooftop restaurant is _______ for its seafood dishes.", "o": ["famously", "fame", "fames", "famous"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這家飯店的頂樓餐廳以海鮮料理聞名。", "e": "訊號：be 動詞 is ＋ [空格] ＋ for → 主詞補語選形容詞，固定搭配 be famous for（-ous）。", "w": "(B)(C) 名詞，餐廳不等於「名聲」；(A) 副詞不能當 be 動詞補語。"}, {"g": "t_p5pos", "q": "The company has been growing _______ since it entered the Asian market.", "o": ["steady", "steadied", "steadily", "steadiness"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "自從進入亞洲市場以來，公司一直穩定成長。", "e": "訊號：has been growing（grow 不及物）句子已完整 → 修飾動詞用副詞 steadily。", "w": "(A) 形容詞；(D) 名詞；(B) 過去式，都不能修飾 growing。"}, {"g": "t_p5pos", "q": "Applicants must demonstrate _______ in at least two foreign languages.", "o": ["fluently", "fluency", "more fluent", "fluent"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "應徵者必須展現至少兩種外語的流利程度。", "e": "訊號：demonstrate（及物）後面缺受詞 → 名詞，選 fluency（-cy）。", "w": "(C)(D) 形容詞不能當受詞；(A) 副詞不能當受詞。"}, {"g": "t_p5pos", "q": "The finance department will conduct a _______ review of all vendor contracts.", "o": ["thoroughness", "thoroughly", "more thoroughly", "thorough"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "財務部將對所有廠商合約進行徹底的審查。", "e": "訊號：冠詞 a ＋ [空格] ＋ 名詞 review → 形容詞 thorough。", "w": "(B)(C) 副詞不能修飾名詞；(A) 名詞，a thoroughness review 不成立。"}, {"g": "t_p5pos", "q": "Visitors are _______ reminded that photography is not allowed in the gallery.", "o": ["politely", "politer", "polite", "politeness"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "敬請參觀者留意，藝廊內禁止拍照。", "e": "訊號：空格夾在 be 動詞 are 與 p.p. reminded 中間 → 100% 副詞 politely。", "w": "(B)(C) 形容詞；(D) 名詞，都不能插在 be 與 p.p. 之間。"}, {"g": "t_p5pos", "q": "The proposal was rejected because of its high _______ costs.", "o": ["operate", "operates", "operational", "operationally"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這份提案因營運成本過高而被否決。", "e": "訊號：所有格 its ＋ 形容詞 high ＋ [空格] ＋ 名詞 costs → 名詞前的修飾語，選形容詞 operational（-al）。", "w": "(A)(B) 動詞；(D) 副詞不能修飾名詞 costs。"}, {"g": "t_p5pos", "q": "Ms. Lin has worked _______ with the design team to launch the new website.", "o": ["closely", "closeness", "closure", "closed"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "林女士與設計團隊密切合作，推出了新網站。", "e": "訊號：has worked（work 不及物）已完整 → 修飾動詞用副詞 closely；work closely with 是高頻搭配。", "w": "(B)(C) 名詞；(D) 過去式／p.p.，都不能修飾 worked。"}, {"g": "t_p5pos", "q": "The manager expressed _______ that the deadline could be met.", "o": ["confidently", "confide", "confident", "confidence"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "經理表示有信心能趕上截止期限。", "e": "訊號：expressed（及物）後面缺受詞 → 名詞 confidence（-ence）。", "w": "(C) 形容詞；(A) 副詞；(B) 動詞，都不能當 expressed 的受詞。"}, {"g": "t_p5pos", "q": "Customers can track their orders _______ through our mobile app.", "o": ["easy", "easily", "easiness", "ease"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "顧客可以透過我們的手機 App 輕鬆追蹤訂單。", "e": "訊號：can track（V）＋ their orders（O）已完整 → 副詞 easily。", "w": "(A) 形容詞；(C)(D) 名詞，句子已完整不缺名詞。"}, {"g": "t_p5pos", "q": "The museum is currently seeking _______ to assist with its summer programs.", "o": ["voluntarily", "voluntary", "volunteers", "volunteer"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "博物館目前正在招募志工協助夏季活動。", "e": "訊號：seeking（及物）後缺受詞 → 名詞。volunteer 是可數名詞，前面沒有冠詞 a，所以要用複數 volunteers。", "w": "(D) 單數可數名詞前缺冠詞；(B) 形容詞；(A) 副詞。"}]}, {"id": "p5_pos_2", "kind": "toeic", "part": 5, "stage": 1, "title": "詞性題 2", "sub": "the／a＋□＋of → 名詞；be／冠詞＋□＋名詞 → 形容詞；句子完整或夾在 be／助動詞與 p.p.／V-ing 之間 → 副詞", "qs": [{"g": "t_p5pos", "q": "Due to the _______ demand for electric vehicles, the factory will hire 200 more workers.", "o": ["increases", "increasing", "increasingly", "increase"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "由於電動車需求持續增加，工廠將再招募 200 名員工。", "e": "訊號：the ＋ [空格] ＋ 名詞 demand → 形容詞位置。V-ing 可當形容詞（increasing demand 不斷增加的需求）。", "w": "(A)(D) 名詞／動詞，放在名詞前不合文法；(C) 副詞不能修飾名詞。"}, {"g": "t_p5pos", "q": "Ms. Gomez gave a very _______ presentation on market trends.", "o": ["information", "inform", "informatively", "informative"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Gomez 女士做了一場關於市場趨勢、內容非常豐富的簡報。", "e": "訊號：a ＋ very ＋ [空格] ＋ 名詞 presentation → 形容詞 informative（-ive）。", "w": "(B) 動詞；(A) 名詞（不可數）；(C) 副詞，都不能修飾 presentation。"}, {"g": "t_p5pos", "q": "Employees should keep all client information strictly _______.", "o": ["confidential", "confide", "confidentially", "confidentiality"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "員工應對所有客戶資料嚴格保密。", "e": "訊號：keep ＋ 受詞（all client information）＋ [空格] → 受詞補語用形容詞，keep sth confidential。strictly 是副詞，修飾後面的形容詞。", "w": "(B) 動詞；(C) 副詞不能當受詞補語；(D) 名詞不能被 strictly 修飾。"}, {"g": "t_p5pos", "q": "The renovation project was completed _______ ahead of schedule.", "o": ["significant", "significance", "significantly", "signify"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "整修工程比預定時間大幅提前完成。", "e": "訊號：was completed（被動）句子已完整，空格修飾後面的副詞片語 ahead of schedule → 副詞 significantly。", "w": "(B) 名詞；(A) 形容詞；(D) 動詞，都不能修飾 ahead of schedule。"}, {"g": "t_p5pos", "q": "Our _______ to quality has made us a leader in the industry.", "o": ["commitment", "commit", "committed", "committing"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們對品質的承諾使我們成為業界領導者。", "e": "訊號：所有格 Our ＋ [空格] ＋ to，並且是句子主詞 → 名詞 commitment（-ment）。", "w": "(B) 動詞；(C) 過去式／形容詞；(D) V-ing，在所有格後當主詞極不自然，多益選 -ment 名詞。"}, {"g": "t_p5pos", "q": "The new policy applies _______ to full-time employees.", "o": ["exclusiveness", "exclusively", "exclusion", "exclusive"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新政策僅適用於全職員工。", "e": "訊號：applies（不及物）＋ to … 已完整 → 副詞 exclusively。", "w": "(D) 形容詞；(A)(C) 名詞，句子不缺名詞。"}, {"g": "t_p5pos", "q": "Please make sure the documents are _______ before sending them to the client.", "o": ["accurateness", "accuracy", "accurate", "accurately"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "寄給客戶前，請確認文件內容正確。", "e": "訊號：be 動詞 are ＋ [空格] ＋ 介系詞 before → 主詞補語選形容詞 accurate。", "w": "(A)(B) 名詞，文件不等於「正確性」；(D) 副詞不能當 be 補語。"}, {"g": "t_p5pos", "q": "The airline apologized for the _______ caused by the flight delay.", "o": ["inconvenienced", "inconvenient", "inconveniently", "inconvenience"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "航空公司為班機延誤造成的不便致歉。", "e": "訊號：the ＋ [空格] ＋ p.p. 片語（caused by…）→ 名詞，選 inconvenience（-ence）。", "w": "(B) 形容詞；(C) 副詞；(A) 過去式／p.p.，the 後面需要名詞。"}, {"g": "t_p5pos", "q": "Sales of the new tablet have been _______ higher than expected.", "o": ["consider", "consideration", "considerably", "considerable"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新款平板的銷量遠高於預期。", "e": "訊號：空格修飾比較級形容詞 higher → 修飾形容詞要用副詞 considerably。", "w": "(A) 動詞；(D) 形容詞不能修飾形容詞；(B) 名詞。"}, {"g": "t_p5pos", "q": "A _______ number of customers have requested a vegetarian menu.", "o": ["growing", "grown", "growth", "grow"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "越來越多顧客要求提供素食菜單。", "e": "訊號：A ＋ [空格] ＋ 名詞 number → 形容詞位置，a growing number of 是固定說法（越來越多的）。", "w": "(D) 動詞；(C) 名詞；(B) p.p. 表「已長成的」，語意不通。"}, {"g": "t_p5pos", "q": "The training session will help new staff become more _______ with the system.", "o": ["familiarity", "familiarly", "familiarize", "familiar"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "訓練課程將幫助新進員工更熟悉系統。", "e": "訊號：連綴動詞 become ＋ more ＋ [空格] → 形容詞，become familiar with。", "w": "(A) 名詞；(B) 副詞；(C) 動詞，become 後面要接形容詞。"}, {"g": "t_p5pos", "q": "Mr. Ortiz was _______ selected to lead the regional office.", "o": ["recency", "recently", "recent", "recentness"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Ortiz 先生最近獲選帶領區域辦公室。", "e": "訊號：空格夾在 be 動詞 was 與 p.p. selected 中間 → 副詞 recently。", "w": "(C) 形容詞；(A)(D) 名詞。"}, {"g": "t_p5pos", "q": "The company will hold a press conference to announce its _______ into the European market.", "o": ["expansion", "expansively", "expand", "expansive"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "公司將舉行記者會，宣布進軍歐洲市場。", "e": "訊號：所有格 its ＋ [空格] ＋ into → 名詞 expansion（-sion），也是 announce 的受詞。", "w": "(C) 動詞；(D) 形容詞；(B) 副詞。"}, {"g": "t_p5pos", "q": "Ms. Kim responded to the client's email _______ and professionally.", "o": ["prompt", "promptness", "promptly", "prompting"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "金女士迅速且專業地回覆客戶的電子郵件。", "e": "訊號：and 前後要對稱（平行結構），and 後面是副詞 professionally → 空格也是副詞 promptly。", "w": "(A) 形容詞；(B) 名詞；(D) V-ing，都無法和 professionally 平行。"}, {"g": "t_p5pos", "q": "The report provides a _______ analysis of consumer behavior.", "o": ["detail", "detailing", "details", "detailed"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這份報告提供了消費者行為的詳細分析。", "e": "訊號：a ＋ [空格] ＋ 名詞 analysis → 形容詞。detailed（p.p. 當形容詞）＝ 詳細的。", "w": "(A)(C) 名詞；(B) V-ing 表「正在詳述」，語意不對。"}, {"g": "t_p5pos", "q": "The hotel offers _______ parking for guests staying more than three nights.", "o": ["complimentarily", "complimentary", "complimented", "compliment"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "飯店為住宿超過三晚的房客提供免費停車。", "e": "訊號：offers ＋ [空格] ＋ 名詞 parking → 形容詞 complimentary（免費贈送的，多益超高頻）。", "w": "(D) 名詞／動詞「讚美」；(A) 副詞；(C) 過去式。"}, {"g": "t_p5pos", "q": "Staff members are encouraged to share their ideas _______ during meetings.", "o": ["open", "opened", "openness", "openly"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們鼓勵員工在會議中坦率分享想法。", "e": "訊號：share（V）＋ their ideas（O）已完整 → 副詞 openly。", "w": "(A) 形容詞／動詞；(C) 名詞；(B) 過去式／p.p.。"}, {"g": "t_p5pos", "q": "The _______ of the two companies is expected to be finalized next month.", "o": ["merge", "merger", "merges", "merged"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "兩家公司的合併案預計下個月定案。", "e": "訊號：The ＋ [空格] ＋ of → 名詞 merger（合併案），同時當主詞，後接真動詞 is expected。", "w": "(A)(C) 動詞；(D) 過去式／p.p.，不能當主詞。"}, {"g": "t_p5pos", "q": "All applications will be reviewed _______ by the hiring committee.", "o": ["carefulness", "care", "carefully", "careful"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "所有申請將由招募委員會仔細審查。", "e": "訊號：will be reviewed（被動）已完整，後面 by… 只是補充 → 副詞 carefully。", "w": "(D) 形容詞；(A)(B) 名詞。"}, {"g": "t_p5pos", "q": "The CEO's speech was both inspiring and _______.", "o": ["motivational", "motivationally", "motivation", "motivate"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "執行長的演講既鼓舞人心又具激勵性。", "e": "訊號：both A and B 平行結構，A 是形容詞 inspiring → B 也要形容詞 motivational（-al）。", "w": "(D) 動詞；(C) 名詞；(B) 副詞，無法與 inspiring 平行。"}]}, {"id": "p5_pos_3", "kind": "toeic", "part": 5, "stage": 1, "title": "詞性題 3", "sub": "the／a＋□＋of → 名詞；be／冠詞＋□＋名詞 → 形容詞；句子完整或夾在 be／助動詞與 p.p.／V-ing 之間 → 副詞", "qs": [{"g": "t_p5pos", "q": "The _______ of the new shopping mall has been delayed by three months.", "o": ["constructively", "construction", "constructive", "construct"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新購物中心的建設已延後三個月。", "e": "訊號：The ＋ [空格] ＋ of → 名詞，選 -tion 結尾的 construction。它同時是主詞，後面接真動詞 has been delayed。", "w": "(D) 動詞；(C) 形容詞；(A) 副詞，都不能放在 the…of 中間。"}, {"g": "t_p5pos", "q": "Please handle the glass items _______ to avoid any damage.", "o": ["carefully", "careful", "care", "carefulness"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "請小心處理玻璃製品，避免任何損壞。", "e": "訊號：handle（V）＋ the glass items（O）已完整 → 副詞 carefully。", "w": "(C)(D) 名詞；(B) 形容詞，都不能修飾動詞。"}, {"g": "t_p5pos", "q": "Ms. Russo is known for her _______ approach to problem solving.", "o": ["creatively", "creation", "create", "creative"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Russo 女士以富有創意的解決問題方式聞名。", "e": "訊號：所有格 her ＋ [空格] ＋ 名詞 approach → 形容詞 creative（-ive）。", "w": "(C) 動詞；(B) 名詞；(A) 副詞不能修飾名詞。"}, {"g": "t_p5pos", "q": "The hotel staff were extremely _______ during our stay.", "o": ["helpfulness", "help", "helpful", "helpfully"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們住宿期間，飯店員工非常樂於助人。", "e": "訊號：be 動詞 were ＋ 副詞 extremely ＋ [空格] → 主詞補語，選形容詞 helpful（-ful）。", "w": "(A)(B) 名詞；(D) 副詞不能當 be 補語。"}, {"g": "t_p5pos", "q": "The company's profits have increased _______ over the last decade.", "o": ["dramatically", "dramatic", "dramatize", "drama"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "公司的獲利在過去十年大幅增加。", "e": "訊號：have increased（不及物）已完整 → 副詞 dramatically。", "w": "(B) 形容詞；(D) 名詞；(C) 動詞。"}, {"g": "t_p5pos", "q": "We received a large number of _______ for the marketing position.", "o": ["apply", "applications", "applicable", "applied"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們收到大量行銷職位的申請。", "e": "訊號：a number of ＋ [空格] → 可數複數名詞，選 applications。", "w": "(A) 動詞；(C) 形容詞；(D) 過去式／p.p.。"}, {"g": "t_p5pos", "q": "The new security system is _______ effective at preventing theft.", "o": ["higher", "high", "height", "highly"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新的保全系統在防竊方面非常有效。", "e": "訊號：be 動詞 is ＋ [空格] ＋ 形容詞 effective → 修飾形容詞用副詞 highly（非常）。", "w": "(B) 形容詞／副詞 high 表「高度上的高」，不修飾 effective；(A) 比較級；(C) 名詞。"}, {"g": "t_p5pos", "q": "The museum will remain closed for _______ until further notice.", "o": ["renovated", "renovating", "renovations", "renovate"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "博物館因整修將持續關閉，直到另行通知。", "e": "訊號：介系詞 for ＋ [空格] ＋ until → 介系詞後面要名詞，選 renovations。", "w": "(D) 動詞原形不能放在介系詞後；(A) 過去式／p.p.；(B) renovating 後面需要受詞。"}, {"g": "t_p5pos", "q": "Mr. Yang gave a _______ speech at the retirement party.", "o": ["memory", "memorize", "memorably", "memorable"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "楊先生在退休派對上發表了一場令人難忘的演講。", "e": "訊號：a ＋ [空格] ＋ 名詞 speech → 形容詞 memorable（-able）。", "w": "(A) 名詞；(B) 動詞；(C) 副詞。"}, {"g": "t_p5pos", "q": "All team members must arrive _______ for the 8 A.M. meeting.", "o": ["punctually", "punctuality", "punctual", "punctuate"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "所有團隊成員都必須準時出席早上八點的會議。", "e": "訊號：arrive（不及物）已完整 → 副詞 punctually。", "w": "(C) 形容詞；(B) 名詞；(D) 動詞（加標點）。"}, {"g": "t_p5pos", "q": "The _______ for the job include a degree in engineering.", "o": ["require", "requirements", "requiring", "required"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這份工作的條件包括工程學位。", "e": "訊號：The ＋ [空格] ＋ for，且後面動詞 include 是複數 → 複數名詞 requirements。", "w": "(A) 動詞；(D) 過去式／p.p.；(C) V-ing，都不能當主詞。"}, {"g": "t_p5pos", "q": "The CEO spoke _______ about the company's future plans.", "o": ["enthusiastic", "enthusiast", "enthusiastically", "enthusiasm"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "執行長熱情地談論公司的未來計畫。", "e": "訊號：spoke（不及物）＋ about… → 修飾動詞用副詞 enthusiastically。", "w": "(B)(D) 名詞；(A) 形容詞。"}, {"g": "t_p5pos", "q": "Our customers expect _______ delivery of their orders.", "o": ["time", "timed", "timely", "timing"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "我們的顧客期望訂單能及時送達。", "e": "訊號：expect（V）＋ [空格] ＋ 名詞 delivery → 形容詞。timely 雖然以 -ly 結尾，卻是形容詞（及時的）。", "w": "(A) 名詞；(D) 名詞「時機」；(B) p.p. 表「計時的」，語意不合。陷阱：-ly 不一定是副詞。"}, {"g": "t_p5pos", "q": "The proposal was _______ rejected by the committee.", "o": ["finalize", "final", "finality", "finally"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "提案最後被委員會否決了。", "e": "訊號：空格夾在 was 與 p.p. rejected 中間 → 副詞 finally。", "w": "(B) 形容詞；(A) 動詞；(C) 名詞。"}, {"g": "t_p5pos", "q": "The manager praised the team for its _______ to detail.", "o": ["attend", "attention", "attentively", "attentive"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "經理稱讚團隊注重細節。", "e": "訊號：所有格 its ＋ [空格] ＋ to → 名詞 attention（attention to detail 對細節的注意）。", "w": "(A) 動詞；(D) 形容詞；(C) 副詞。"}, {"g": "t_p5pos", "q": "The instructions in the manual are clear and _______.", "o": ["concise", "conciseness", "concision", "concisely"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "手冊裡的說明清楚又簡潔。", "e": "訊號：and 平行結構，前面是形容詞 clear → 也要形容詞 concise。", "w": "(D) 副詞；(B)(C) 名詞，無法與 clear 平行。"}, {"g": "t_p5pos", "q": "Ms. Dubois has been working _______ on the merger for several months.", "o": ["intensively", "intensity", "intensify", "intensive"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Dubois 女士幾個月來一直密集處理這起合併案。", "e": "訊號：has been working（不及物）＋ on… → 副詞 intensively。", "w": "(D) 形容詞；(B) 名詞；(C) 動詞。"}, {"g": "t_p5pos", "q": "The store offers a wide _______ of kitchen appliances.", "o": ["select", "selectively", "selective", "selection"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這家店提供種類繁多的廚房家電。", "e": "訊號：a ＋ 形容詞 wide ＋ [空格] ＋ of → 名詞 selection（a wide selection of 多種選擇）。", "w": "(A) 動詞；(C) 形容詞；(B) 副詞。"}, {"g": "t_p5pos", "q": "These figures are only _______ and may change after the final audit.", "o": ["more preliminarily", "preliminaries", "preliminary", "preliminarily"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這些數字只是初步的，最終審計後可能會改變。", "e": "訊號：be 動詞 are ＋ only ＋ [空格] → 主詞補語，選形容詞 preliminary（初步的）。", "w": "(A)(D) 副詞不能當 be 補語；(B) 名詞複數，數字不等於「初步事項」。"}, {"g": "t_p5pos", "q": "The department needs to reduce its _______ on outside consultants.", "o": ["reliably", "reliance", "rely", "reliable"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這個部門需要減少對外部顧問的依賴。", "e": "訊號：its ＋ [空格] ＋ on，同時是 reduce 的受詞 → 名詞 reliance（-ance）。", "w": "(C) 動詞；(D) 形容詞；(A) 副詞。"}]}, {"id": "p5_pos_4", "kind": "toeic", "part": 5, "stage": 1, "title": "詞性題 4", "sub": "the／a＋□＋of → 名詞；be／冠詞＋□＋名詞 → 形容詞；句子完整或夾在 be／助動詞與 p.p.／V-ing 之間 → 副詞", "qs": [{"g": "t_p5pos", "q": "The seminar was _______ attended, with more than 300 participants.", "o": ["well", "best", "better", "good"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "研討會參加踴躍，超過 300 人出席。", "e": "訊號：空格在 was 與 p.p. attended 中間 → 副詞。good 的副詞是 well（well attended 出席踴躍）。", "w": "(D) good 是形容詞；(B)(C) 比較級／最高級，句中沒有比較。"}, {"g": "t_p5pos", "q": "The new branch manager is _______ for increasing sales in the region.", "o": ["responsibility", "responsible", "respond", "responsibly"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新任分店經理負責提升區域銷售。", "e": "訊號：be 動詞 is ＋ [空格] ＋ for → 形容詞 responsible（be responsible for）。", "w": "(D) 副詞；(A) 名詞，主詞不等於「責任」；(C) 動詞。"}, {"g": "t_p5pos", "q": "The renovation will make the lobby more _______ to visitors.", "o": ["access", "accessibly", "accessibility", "accessible"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "整修後大廳將更方便訪客進出。", "e": "訊號：make ＋ 受詞 the lobby ＋ more ＋ [空格] → 受詞補語用形容詞 accessible（-ible）。", "w": "(A) 名詞／動詞；(B) 副詞；(C) 名詞。"}, {"g": "t_p5pos", "q": "The board discussed the _______ risks of the investment.", "o": ["potent", "potentiality", "potential", "potentially"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "董事會討論了這項投資的潛在風險。", "e": "訊號：the ＋ [空格] ＋ 名詞 risks → 形容詞 potential（潛在的）。", "w": "(D) 副詞；(B) 名詞；(A) potent 是「強效的」，語意不合。"}, {"g": "t_p5pos", "q": "The software update was installed _______ on all company computers.", "o": ["successfully", "successful", "success", "succeed"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "軟體更新已成功安裝在所有公司電腦上。", "e": "訊號：was installed（被動）已完整 → 副詞 successfully。", "w": "(C) 名詞；(B) 形容詞；(D) 動詞。"}, {"g": "t_p5pos", "q": "Several _______ of the board will retire at the end of the year.", "o": ["member", "memberships", "members", "membership"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "幾位董事將在年底退休。", "e": "訊號：Several ＋ [空格] ＋ of → 可數複數名詞；會退休的是人 → members。", "w": "(A) 單數，不能接在 several 後；(B)(D) membership 是「會員資格」，不會退休。"}, {"g": "t_p5pos", "q": "The factory has become more _______ since it introduced automation.", "o": ["product", "productive", "production", "productively"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "自從引進自動化後，工廠變得更有生產力。", "e": "訊號：連綴動詞 has become ＋ more ＋ [空格] → 形容詞 productive（-ive）。", "w": "(A)(C) 名詞；(D) 副詞。"}, {"g": "t_p5pos", "q": "Please read the terms of the agreement _______ before signing.", "o": ["close", "closure", "closest", "closely"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "簽署前請仔細閱讀協議條款。", "e": "訊號：read（V）＋ the terms…（O）已完整 → 副詞 closely（仔細地）。", "w": "(A) close 當副詞是「靠近」，語意不合；(C) 最高級；(B) 名詞。"}, {"g": "t_p5pos", "q": "Mr. Klein has extensive _______ in international trade law.", "o": ["expertise", "expertly", "expertness", "expert"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Klein 先生在國際貿易法方面擁有豐富的專業知識。", "e": "訊號：has ＋ 形容詞 extensive ＋ [空格] → 名詞；「專業知識」→ expertise（多益高頻字）。", "w": "(D) expert 是「專家」（人），has extensive expert 不合；(B) 副詞；(C) 不常用且不合語意。"}, {"g": "t_p5pos", "q": "The airline has introduced a more _______ check-in process.", "o": ["efficiency", "efficiently", "efficiencies", "efficient"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "航空公司推出了更有效率的報到流程。", "e": "訊號：a ＋ more ＋ [空格] ＋ 名詞 check-in process → 形容詞 efficient。", "w": "(B) 副詞；(A)(C) 名詞。"}, {"g": "t_p5pos", "q": "The new policy will be _______ implemented starting next month.", "o": ["graduation", "gradual", "gradually", "graduate"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "新政策將從下個月開始逐步實施。", "e": "訊號：空格夾在 be 與 p.p. implemented 中間 → 副詞 gradually。", "w": "(B) 形容詞；(D) 動詞／名詞「畢業」；(A) 名詞。"}, {"g": "t_p5pos", "q": "The _______ of the product depends on proper maintenance.", "o": ["durably", "durability", "durable", "durableness"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "產品的耐用性取決於適當的保養。", "e": "訊號：The ＋ [空格] ＋ of → 名詞，選 -ity 結尾的 durability。", "w": "(C) 形容詞；(A) 副詞；(D) 形式罕見，多益選 -ity 名詞。"}, {"g": "t_p5pos", "q": "The renovated hotel offers _______ views of the harbor.", "o": ["spectacular", "spectacles", "spectacularly", "spectacle"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "整修後的飯店可以欣賞壯觀的港口景色。", "e": "訊號：offers（V）＋ [空格] ＋ 名詞 views → 形容詞 spectacular（-ar）。", "w": "(B)(D) 名詞；(C) 副詞不能修飾名詞。"}, {"g": "t_p5pos", "q": "Customers have responded _______ to the new menu items.", "o": ["positive", "positively", "positiveness", "positivity"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "顧客對新菜色反應熱烈。", "e": "訊號：have responded（不及物）＋ to… → 副詞 positively。", "w": "(A) 形容詞；(C)(D) 名詞。"}, {"g": "t_p5pos", "q": "The guide provides _______ information about local restaurants.", "o": ["use", "usefulness", "usefully", "useful"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "這本指南提供關於當地餐廳的實用資訊。", "e": "訊號：provides（V）＋ [空格] ＋ 名詞 information → 形容詞 useful（-ful）。", "w": "(A) 名詞／動詞；(C) 副詞；(B) 名詞。"}, {"g": "t_p5pos", "q": "The company's _______ to expand overseas surprised many analysts.", "o": ["decide", "decisively", "decision", "decisive"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "公司決定擴展海外，令許多分析師感到意外。", "e": "訊號：所有格 company's ＋ [空格] ＋ to V，且是主詞 → 名詞 decision。", "w": "(A) 動詞；(D) 形容詞；(B) 副詞。"}, {"g": "t_p5pos", "q": "The meeting room is _______ located near the main entrance.", "o": ["conveniently", "convenient", "conveniences", "convenience"], "a": 0, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "會議室位置便利，就在主要入口附近。", "e": "訊號：空格夾在 is 與 p.p. located 中間 → 副詞 conveniently。", "w": "(C)(D) 名詞；(B) 形容詞。"}, {"g": "t_p5pos", "q": "Mr. Nolan was _______ to learn that his proposal had been accepted.", "o": ["delight", "delightful", "delighted", "delightfully"], "a": 2, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "Nolan 先生得知提案獲得採納時非常高興。", "e": "訊號：be 動詞 was ＋ [空格] ＋ to V，主詞是人的感受 → p.p. 形容詞 delighted。", "w": "(A) 名詞／動詞；(B) delightful 形容事物「令人愉快的」；(D) 副詞。"}, {"g": "t_p5pos", "q": "Employees can access the database _______ from home.", "o": ["securities", "securely", "secure", "security"], "a": 1, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "員工可以在家安全地存取資料庫。", "e": "訊號：can access（V）＋ the database（O）已完整 → 副詞 securely。", "w": "(C) 形容詞／動詞；(A)(D) 名詞。"}, {"g": "t_p5pos", "q": "A full _______ of the accident will be completed by Friday.", "o": ["investigative", "investigator", "investigate", "investigation"], "a": 3, "h": "先看選項：同一個字的不同詞性 → 不翻譯整句，只看空格前後兩個字。", "trans": "事故的全面調查將在週五前完成。", "e": "訊號：A ＋ 形容詞 full ＋ [空格] ＋ of → 名詞；要「被完成」的是調查這件事 → investigation。", "w": "(C) 動詞；(A) 形容詞；(B) investigator 是調查員（人），不會「被完成」。"}]}, {"id": "p5_conj_1", "kind": "toeic", "part": 5, "stage": 1, "title": "連接詞 vs 介系詞 1", "sub": "空格後的區塊有真動詞 → 連接詞；只有名詞或 V-ing → 介系詞", "qs": [{"g": "t_p5conj", "q": "_______ the heavy rain, the outdoor concert went ahead as planned.", "o": ["However", "Although", "Even though", "Despite"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管下著大雨，戶外音樂會仍照原定計畫舉行。", "e": "畫出空格後到逗號的區塊：the heavy rain → 只有名詞，沒有真動詞 → 選介系詞 Despite。", "w": "(B)(C) 連接詞，後面要接主詞＋真動詞；(A) However 是副詞，不能接名詞片語。"}, {"g": "t_p5conj", "q": "_______ the store was crowded, the staff handled every customer efficiently.", "o": ["Regardless of", "In spite of", "Although", "Despite"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "雖然店裡很擁擠，店員仍有效率地服務每位顧客。", "e": "區塊 the store was crowded 有真動詞 was → 選連接詞 Although。", "w": "(A)(B)(D) 都是介系詞（片語），後面只能接名詞或 V-ing。"}, {"g": "t_p5conj", "q": "The flight was delayed _______ bad weather in Chicago.", "o": ["due to", "since", "so", "because"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "班機因芝加哥天氣惡劣而延誤。", "e": "區塊 bad weather in Chicago 只有名詞 → 介系詞 due to。", "w": "(C)(D) 連接詞要接子句；(B) since 當介系詞只表「自從（時間）」，不表原因。"}, {"g": "t_p5conj", "q": "The meeting was postponed _______ the manager was ill.", "o": ["due to", "because", "owing to", "because of"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "會議因經理生病而延期。", "e": "區塊 the manager was ill 有真動詞 was → 連接詞 because。", "w": "(A)(C)(D) 都是介系詞片語，後面不能接完整子句。"}, {"g": "t_p5conj", "q": "Please turn off your mobile phones _______ the presentation.", "o": ["as", "during", "when", "while"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "簡報期間請關閉手機。", "e": "區塊 the presentation 只有名詞 → 介系詞 during。", "w": "(A)(C)(D) 連接詞，要接主詞＋動詞。"}, {"g": "t_p5conj", "q": "Mr. Lee checked his email _______ he was waiting for the train.", "o": ["for", "during", "throughout", "while"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "李先生在等火車時查看了電子郵件。", "e": "區塊 he was waiting… 有真動詞 was waiting → 連接詞 while。", "w": "(A)(B)(C) 介系詞，後面只能接名詞。"}, {"g": "t_p5conj", "q": "_______ his lack of experience, Daniel was hired because of his strong communication skills.", "o": ["Despite", "Even if", "Though", "Although"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管缺乏經驗，Daniel 仍因溝通能力強而獲得錄用。", "e": "區塊 his lack of experience 是名詞片語，沒有真動詞 → 介系詞 Despite。", "w": "(B)(C)(D) 都是連接詞，後面要有主詞＋動詞。"}, {"g": "t_p5conj", "q": "_______ receipt of your payment, we will ship your order within two days.", "o": ["Once", "As soon as", "Upon", "Whenever"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "一收到您的付款，我們會在兩天內出貨。", "e": "區塊 receipt of your payment 只有名詞 → 介系詞 Upon（＝ on，一…就）。", "w": "(A)(B)(D) 連接詞，後面要接主詞＋真動詞（例如 once we receive your payment）。"}, {"g": "t_p5conj", "q": "The new branch will open next month _______ construction is completed on time.", "o": ["provided that", "in case of", "because of", "in spite of"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "只要工程如期完工，新分店將於下個月開幕。", "e": "區塊 construction is completed 有真動詞 is completed → 連接詞 provided that（只要、前提是）。", "w": "(B)(C)(D) 都是介系詞片語，後面只能接名詞。"}, {"g": "t_p5conj", "q": "_______ the budget cuts, the department managed to complete all its projects.", "o": ["Even though", "While", "Whereas", "Despite"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管預算刪減，該部門仍設法完成了所有專案。", "e": "區塊 the budget cuts 是名詞（cuts 是名詞複數，不是動詞）→ 介系詞 Despite。", "w": "(A)(B)(C) 連接詞要接子句。陷阱：cuts 看起來像動詞，但前面有 the，是名詞。"}, {"g": "t_p5conj", "q": "The event was a great success _______ the efforts of our volunteers.", "o": ["although", "thanks to", "so that", "because"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "多虧志工們的努力，活動非常成功。", "e": "區塊 the efforts of our volunteers 只有名詞 → 介系詞片語 thanks to（多虧）。", "w": "(A)(C)(D) 連接詞，要接子句。"}, {"g": "t_p5conj", "q": "Ms. Chen will cover the front desk _______ Mr. Park is on vacation.", "o": ["within", "during", "while", "throughout"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "朴先生休假期間，陳女士會代班櫃台。", "e": "區塊 Mr. Park is on vacation 有真動詞 is → 連接詞 while。", "w": "(A)(B)(D) 介系詞。若改成 during Mr. Park's vacation 才能用 during。"}, {"g": "t_p5conj", "q": "_______ the weather improves, the company picnic will be held on Saturday.", "o": ["Regarding", "In case of", "Due to", "If"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "如果天氣好轉，公司野餐將在週六舉行。", "e": "區塊 the weather improves 有真動詞 improves → 連接詞 If。", "w": "(A)(B)(C) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "All employees must wear ID badges _______ they are in the building.", "o": ["upon", "during", "whenever", "throughout"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "所有員工在大樓內時都必須配戴識別證。", "e": "區塊 they are in the building 有真動詞 are → 連接詞 whenever。", "w": "(A)(B)(D) 介系詞，後面不能接子句。"}, {"g": "t_p5conj", "q": "_______ several complaints from customers, the restaurant changed its menu.", "o": ["Following", "Because", "Whereas", "Unless"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "在接到數件顧客投訴後，餐廳更換了菜單。", "e": "區塊 several complaints from customers 只有名詞 → 介系詞。Following 當介系詞＝after（在…之後），多益常考。", "w": "(B)(C)(D) 連接詞，後面要接子句。"}]}, {"id": "p5_conj_2", "kind": "toeic", "part": 5, "stage": 1, "title": "連接詞 vs 介系詞 2", "sub": "空格後的區塊有真動詞 → 連接詞；只有名詞或 V-ing → 介系詞", "qs": [{"g": "t_p5conj", "q": "The project was completed on time _______ the team faced many technical problems.", "o": ["because of", "even though", "despite", "in spite of"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管團隊遇到許多技術問題，專案仍如期完成。", "e": "區塊 the team faced… 有真動詞 faced → 連接詞 even though。", "w": "(A)(C)(D) 介系詞（片語），不能接子句。"}, {"g": "t_p5conj", "q": "Sales rose sharply _______ the holiday season.", "o": ["when", "during", "as", "while"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "假期期間銷售額大幅上升。", "e": "區塊 the holiday season 只有名詞 → 介系詞 during。", "w": "(A)(C)(D) 連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ the contract is signed, construction will begin immediately.", "o": ["As soon as", "Following", "After that", "Upon"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "合約一簽署，工程就會立刻開始。", "e": "區塊 the contract is signed 有真動詞 is signed → 連接詞 As soon as。", "w": "(B)(D) 介系詞，只能接名詞；(C) After that 是轉折副詞片語，不能連接兩個子句。"}, {"g": "t_p5conj", "q": "The library will remain closed _______ further notice.", "o": ["while", "unless", "by the time", "until"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "圖書館將持續關閉，直到另行通知。", "e": "區塊 further notice 只有名詞 → 需要介系詞。until 可以當介系詞也可以當連接詞；其他三個只能當連接詞。until further notice 是固定說法。", "w": "(A)(B)(C) 只能當連接詞，後面要有子句。"}, {"g": "t_p5conj", "q": "_______ its small size, the new office is comfortable and well equipped.", "o": ["Unless", "Although", "Despite", "Since"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "雖然空間不大，新辦公室仍舒適且設備齊全。", "e": "區塊 its small size 只有名詞 → 介系詞 Despite。", "w": "(A)(B)(D) 連接詞，後面要有主詞＋動詞。"}, {"g": "t_p5conj", "q": "Please contact the help desk _______ you have any problems logging in.", "o": ["because of", "during", "if", "in case of"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "如果登入有任何問題，請聯絡服務台。", "e": "區塊 you have any problems… 有真動詞 have → 連接詞 if。注意 logging 是 V-ing，不是真動詞，真動詞是 have。", "w": "(A)(B)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "The shipment arrived late _______ a mistake in the delivery address.", "o": ["since", "because", "as", "because of"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "這批貨因送貨地址有誤而延遲送達。", "e": "區塊 a mistake in the delivery address 只有名詞 → 介系詞片語 because of。", "w": "(A)(B)(C) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ Ms. Wong had prepared carefully, she still felt nervous before the interview.", "o": ["Although", "Because of", "Despite", "Instead of"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "雖然黃女士做了充分準備，面試前她仍然很緊張。", "e": "區塊 Ms. Wong had prepared carefully 有真動詞 had prepared → 連接詞 Although。", "w": "(B)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "Our team finished the report _______ the deadline.", "o": ["unless", "before", "so that", "although"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "我們團隊在截止期限前完成了報告。", "e": "區塊 the deadline 只有名詞 → 需要介系詞。before 可當介系詞；其他三個只能當連接詞。", "w": "(A)(C)(D) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "_______ the merger, the two companies will share a single headquarters.", "o": ["So that", "Once", "As a result of", "Even if"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "合併之後，兩家公司將共用同一個總部。", "e": "區塊 the merger 只有名詞 → 介系詞片語 As a result of。", "w": "(A)(B)(D) 在這裡都是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "Customers will receive a full refund _______ the product is returned within 30 days.", "o": ["regardless of", "in spite of", "due to", "as long as"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "只要商品在 30 天內退回，顧客就能獲得全額退款。", "e": "區塊 the product is returned… 有真動詞 is returned → 連接詞 as long as（只要）。", "w": "(A)(B)(C) 介系詞片語，只能接名詞。"}, {"g": "t_p5conj", "q": "The museum is open every day _______ national holidays.", "o": ["although", "except", "unless", "whereas"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "除了國定假日外，博物館每天開放。", "e": "區塊 national holidays 只有名詞 → 介系詞 except（除了）。", "w": "(A)(C)(D) 連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ the CEO was traveling, the vice president chaired the board meeting.", "o": ["Because", "Owing to", "Despite", "During"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "由於執行長出差，副總裁主持了董事會。", "e": "區塊 the CEO was traveling 有真動詞 was traveling → 連接詞 Because。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "Mr. Brown was promoted _______ his excellent sales performance.", "o": ["because of", "so", "because", "since"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "Brown 先生因銷售表現優異而獲得升遷。", "e": "區塊 his excellent sales performance 只有名詞 → 介系詞片語 because of。", "w": "(B)(C) 連接詞；(D) since 當介系詞只表時間「自從」。"}, {"g": "t_p5conj", "q": "_______ the training program, new hires will learn how to use the inventory system.", "o": ["While", "As soon as", "Whereas", "Throughout"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "在整個訓練課程中，新進員工將學習如何使用庫存系統。", "e": "區塊 the training program 只有名詞 → 介系詞 Throughout（在…整段期間）。", "w": "(A)(B)(C) 連接詞，要接主詞＋動詞。"}]}, {"id": "p5_conj_3", "kind": "toeic", "part": 5, "stage": 1, "title": "連接詞 vs 介系詞 3", "sub": "空格後的區塊有真動詞 → 連接詞；只有名詞或 V-ing → 介系詞", "qs": [{"g": "t_p5conj", "q": "_______ the high cost, many companies are investing in solar energy.", "o": ["Although", "While", "Despite", "Even if"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管成本很高，許多公司仍在投資太陽能。", "e": "區塊 the high cost 只有名詞 → 介系詞 Despite。", "w": "(A)(B)(D) 連接詞，後面要接主詞＋真動詞。"}, {"g": "t_p5conj", "q": "_______ the cost is high, many companies are investing in solar energy.", "o": ["Despite", "Although", "In spite of", "Regardless of"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "雖然成本很高，許多公司仍在投資太陽能。", "e": "區塊 the cost is high 有真動詞 is → 連接詞 Although。（和上一題對照：同樣意思，名詞用 Despite，子句用 Although）", "w": "(A)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "The store will close early today _______ the national holiday.", "o": ["since", "because", "so that", "due to"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "因為國定假日，商店今天會提早打烊。", "e": "區塊 the national holiday 只有名詞 → 介系詞片語 due to。", "w": "(B)(C) 連接詞；(A) since 當介系詞只表「自從」。"}, {"g": "t_p5conj", "q": "Ms. Okafor took notes _______ the client was explaining the requirements.", "o": ["while", "for", "during", "throughout"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "客戶說明需求時，Okafor 女士做了筆記。", "e": "區塊 the client was explaining… 有真動詞 was explaining → 連接詞 while。", "w": "(B)(C)(D) 介系詞，後面只能接名詞。"}, {"g": "t_p5conj", "q": "Please remain seated _______ the flight until the seatbelt sign is turned off.", "o": ["whenever", "as", "during", "while"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "飛行期間請保持就座，直到安全帶指示燈熄滅。", "e": "區塊 the flight 只有名詞（until 之後是另一個子句）→ 介系詞 during。", "w": "(A)(B)(D) 連接詞，後面要接子句。"}, {"g": "t_p5conj", "q": "_______ sales were lower than expected, the company still made a profit.", "o": ["Because of", "Despite", "Instead of", "Even though"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "雖然銷售額低於預期，公司仍然獲利。", "e": "區塊 sales were lower… 有真動詞 were → 連接詞 Even though。"
