, "g": "t_p7cross", "q": "Why did Ms. Brooks most likely choose the SD-200?", "o": ["It is the least expensive model in the collection.", "It meets her needs without features she does not require.", "It is the only model with an electric motor.", "It includes free delivery for any number of desks."], "a": 1, "h": "先列出 Ms. Brooks 在第二篇提出的條件，再到第一篇看哪一款剛好符合。", "e": "第二篇的條件是：電動調高、至少三組記憶高度、不需要 USB 孔、要胡桃木色。第一篇中 SD-100 是手動的；SD-200 是電動、有 3 組記憶、有胡桃木色；SD-300 雖然也符合，但多了她不需要的 USB 孔且較貴。所以 SD-200 剛好符合需求又沒有多餘功能，故選 (B)。", "w": "(A) 最便宜的是 SD-100；(C) SD-300 也有電動馬達；(D) 免費運送的條件是訂購五張以上。", "trans": "Brooks 女士最可能為什麼選擇 SD-200？"}, {"n": 188, "p": 12, "g": "t_p7vocab", "q": "In the e-mail from Ms. Brooks, the word \"match\" in paragraph 1 is closest in meaning to", "o": ["replace", "compete with", "be equal in number to", "go well with"], "a": 3, "h": "把每個選項代回原句「To ___ our new conference table」，看哪個意思通順。", "e": "To match our new conference table, we would like the walnut finish 的意思是「為了和新會議桌搭配」，這裡的 match 指顏色、風格相配，與 go well with 最接近，故選 (D)。", "w": "(B) 與…競爭；(C) 在數量上相等；(A) 取代，代回原句都不合理。", "trans": "在 Brooks 女士的電子郵件第一段中，match 一字的意思最接近下列何者？"}, {"n": 189, "p": 12, "g": "t_p7cross", "q": "Why will Ms. Brooks probably need to change her order?", "o": ["The SD-200 model is no longer being produced.", "The black finish costs more than the walnut finish.", "Walnut desks will not arrive before her office opens.", "She ordered too few desks to receive free delivery."], "a": 2, "h": "比對第二篇的期限與第三篇的出貨日期。", "e": "第二篇說新辦公室 6 月 2 日啟用，桌子必須在那之前送達；第三篇說胡桃木桌延到 6 月 9 日才出貨，晚於啟用日，所以她可能需要改單（例如改黑色），故選 (C)。", "w": "(D) 她訂了六張，已符合免運條件；(A) 只是胡桃木貼皮延誤，型號仍在生產；(B) 文中沒有提到不同顏色價格不同。", "trans": "Brooks 女士為什麼可能需要更改訂單？"}, {"n": 190, "p": 12, "g": "t_p7detail", "q": "What does Mr. Pratt ask Ms. Brooks to do?", "o": ["Send the measurements of her new office", "Visit the showroom to see the black finish", "Pay a deposit for the temporary desks", "Tell him her decision by a certain date"], "a": 3, "h": "看第三篇最後一段對 Ms. Brooks 的要求。", "e": "第三篇最後寫「Please let me know which option you prefer by May 9.」，請她在 5 月 9 日前告知選擇哪個方案，故選 (D)。", "w": "(C) 臨時桌是免費提供（at no cost）；(B)(A) 文中都沒有提到。", "trans": "Pratt 先生請 Brooks 女士做什麼？"}, {"n": 191, "p": 13, "g": "t_p7detail", "q": "What is indicated about the workshop series?", "o": ["Participants must register at the library in person.", "The workshops are held on weekends.", "Library cardholders do not have to pay to attend.", "Each session lasts two hours."], "a": 2, "h": "逐一核對第一篇公告的時間、費用與報名方式。", "e": "第一篇寫「Workshops are free for Harborview Library cardholders」，持借書證者免費參加，故選 (C)。", "w": "(D) 6:30 到 8:00 是一個半小時；(A) 報名方式是上網（Register online）；(B) 工作坊在週三晚上舉行。", "trans": "關於這個工作坊系列，文中指出了什麼？"}, {"n": 192, "p": 13, "g": "t_p7main", "q": "Why did Mr. Menon write to Ms. Kim?", "o": ["He will be unavailable on his scheduled date.", "He would like to move his session to a larger room.", "He wants to change the topic of his workshop.", "He needs the library to provide a laptop."], "a": 0, "h": "看第二篇第一段他提出什麼請求、理由是什麼。", "e": "第二篇說客戶請他 3 月 11 日去芝加哥參加產品發表會，所以無法在原定日期上課，請求改期，故選 (A)。", "w": "(C) 他沒有要求更換主題；(B) 沒有提到教室大小；(D) 攜帶筆電是第三篇對學員的建議。", "trans": "Menon 先生為什麼寫信給 Kim 女士？"}, {"n": 193, "p": 13, "g": "t_p7cross", "q": "Who will lead the workshop on March 11?", "o": ["Ravi Menon", "Alan Cho", "Gloria Estes", "Priya Desai"], "a": 1, "h": "第三篇說哪兩場交換了日期？再回第一篇查那一場的講者。", "e": "第三篇說 Bookkeeping Basics 改到 3 月 11 日；第一篇顯示 Bookkeeping Basics 的講者是會計師 Alan Cho，所以 3 月 11 日由 Alan Cho 主講，故選 (B)。", "w": "(A) Menon 原本是 3 月 11 日，現已改到 3 月 18 日；(C) Estes 是 3 月 4 日；(D) Desai 仍是 3 月 25 日。", "trans": "3 月 11 日的工作坊由誰主講？"}, {"n": 194, "p": 13, "g": "t_p7cross", "q": "Where will the social media workshop take place?", "o": ["In the main reading room", "At Brightpath Digital's office", "In Room A", "In Room B"], "a": 3, "h": "第三篇說日期換了，但教室有沒有變？再回第一篇查原本的教室。", "e": "第三篇說「All rooms and start times remain the same」，教室不變；第一篇顯示社群行銷工作坊在 Room B，故選 (D)。", "w": "(C) Room A 是其他三場的教室；(A)(B) 文中沒有提到。", "trans": "社群行銷工作坊會在哪裡舉行？"}, {"n": 195, "p": 13, "g": "t_p7infer", "q": "What is suggested about the workshops?", "o": ["They will be recorded and posted online.", "The fee for nonmembers has recently increased.", "Some of them have more applicants than available seats.", "The speakers are all employees of the library."], "a": 2, "h": "注意第三篇第二段說取消報名的原因。", "e": "第三篇請無法出席的人取消報名，好讓候補名單上的人遞補（someone on the waiting list can take your place）。有候補名單，表示有些場次報名人數超過名額，故選 (C)。", "w": "(A) 文中沒有提到錄影；(D) 講者來自顧問公司、會計師事務所、銀行等，不是圖書館員工；(B) 文中沒有提到漲價。", "trans": "關於這些工作坊，文中暗示了什麼？"}, {"n": 196, "p": 14, "g": "t_p7detail", "q": "According to the price list, what is required for all orders?", "o": ["They must be placed at least two days ahead.", "They must be delivered within 10 kilometers.", "They must be paid for with a credit card.", "They must include at least 30 meals."], "a": 0, "h": "看第一篇最後一條規定，注意同義改寫。", "e": "第一篇寫「All orders must be placed at least 48 hours in advance」，48 小時即兩天，故選 (A)。", "w": "(D) 30 人是贈送甜點盤的門檻，不是下單條件；(C) 文中沒有規定付款方式；(B) 10 公里外也能送，只是要收運費。", "trans": "根據價目表，所有訂單都必須符合什麼條件？"}, {"n": 197, "p": 14, "g": "t_p7cross", "q": "How much did Mr. Lau's company most likely pay per person for food?", "o": ["$25", "$18", "$12", "$20"], "a": 1, "h": "先在第二篇找出他們訂了哪一種餐，再回第一篇查單價。", "e": "第二篇說他們訂的是 pasta buffet；第一篇顯示 Package 2 Pasta Buffet 每人 18 美元，故選 (B)。", "w": "(C) $12 是三明治拼盤；(D) $20 是 10 公里外的運費；(A) $25 是烤鮭魚餐。", "trans": "Lau 先生的公司餐點最可能每人付多少錢？"}, {"n": 198, "p": 14, "g": "t_p7cross", "q": "Why was Mr. Lau disappointed with the order?", "o": ["The salad was missing from the buffet.", "He was charged for more meals than he ordered.", "The pasta was not hot when it arrived.", "An item that his group qualified for was not delivered."], "a": 3, "h": "第二篇提到價目表承諾的東西沒送來，回第一篇確認他們為什麼有資格拿到。", "e": "第一篇說 30 人以上訂單贈送甜點盤，第二篇他們訂了 35 人份卻沒收到甜點盤。他有資格獲得的品項沒送來，故選 (D)。（遲到也讓他失望，但選項中只有 (D) 符合文中內容。）", "w": "(C) 他說麵是熱的；(B) 文中沒有提到多收餐費；(A) 他稱讚沙拉很新鮮。", "trans": "Lau 先生為什麼對這次訂單感到失望？"}, {"n": 199, "p": 14, "g": "t_p7cross", "q": "How much money did Ms. Marino return to Mr. Lau?", "o": ["$40", "$18", "$20", "$630"], "a": 2, "h": "第三篇說退了哪一筆費用？再回第一篇查那筆費用的金額。", "e": "第三篇說公司距離廚房約 15 公里，所以被收了運費，現已退回；第一篇規定 10 公里以外運費為 20 美元，所以退回 20 美元，故選 (C)。", "w": "(B) $18 是每人餐費；(A) 40 是遲到的分鐘數；(D) $630 是 35 人 × $18 的餐點總額，並沒有退這筆錢。", "trans": "Marino 女士退給 Lau 先生多少錢？"}, {"n": 200, "p": 14, "g": "t_p7vocab", "q": "In the response, the word \"oversight\" in paragraph 1 is closest in meaning to", "o": ["mistake", "view", "plan", "supervision"], "a": 0, "h": "oversight 有兩種意思，代回原句看哪個說得通。", "e": "the missing dessert tray was an oversight by a new member of our kitchen staff：甜點盤漏送是新員工的「疏忽、失誤」，與 mistake 最接近，故選 (A)。", "w": "(D) oversight 也有「監督」的意思，但代回原句不通；(B) 景色、觀點；(C) 計畫，都不合語意。", "trans": "在回覆的第一段中，oversight 一字的意思最接近下列何者？"}]}, {"id": "p7_x2", "kind": "toeic", "part": 7, "title": "Part 7 Practice: Double Passages", "sub": "正式結構：單篇 147–175、雙篇 176–185、三篇 186–200", "passages": [{"kind": "雙篇閱讀 Double Passage (Questions 187–191)", "docs": [{"kind": "第一篇：維修工單 Service Report", "head": "Borealis Commercial HVAC — Field Service Report #SR-519", "text": "Service Date: July 22 | Technician: Marco Bellini\nClient: FreshMart Supermarket (Branch #14 — Elmwood Ave.)\nEquipment: Walk-In Dairy Cooler (Model: PolarMax 800)\n\nInspection Findings:\nArrived at 9:15 A.M. in response to an urgent call from store manager Kendra Shaw regarding rising temperatures inside the walk-in dairy cooler (measured at 9°C; normal operating range is 1°C–4°C).\n\n1. Condenser Coils: Heavily coated with dust and debris, restricting airflow. Cleaned thoroughly on-site.\n2. Door Gasket: Rubber seal along the bottom edge of the main door is torn, allowing warm air to leak into the unit. Replaced with a new PolarMax seal from service van inventory.\n3. Evaporator Fan Motor: Bearing is worn out and making a loud grinding noise. The motor is still running at reduced speed but must be replaced soon to prevent complete failure. Because the specific motor (Part #PM-44B) is out of stock locally, I have ordered it directly from the manufacturer.\n\nFollow-Up Required:\nPart #PM-44B is scheduled to arrive at our warehouse on July 27. A follow-up visit has been booked for July 28 at 8:00 A.M. to install the new motor."}, {"kind": "第二篇：內部電子郵件 E-mail", "head": "To: Regional Operations <ops@freshmartgrocers.com>\nFrom: Kendra Shaw <kshaw@freshmartgrocers.com>\nDate: July 22, 2:30 P.M.\nSubject: Dairy Cooler Repair at Branch #14", "text": "Hi everyone,\n\nI wanted to update you on the refrigeration issue at the Elmwood Avenue store this morning. When our morning shift arrived at 7:00 A.M., the walk-in dairy cooler alarm was sounding. We immediately moved all milk, yogurt, and cheese crates into the backup meat-and-produce chiller, so no inventory was spoiled.\n\nBorealis HVAC sent a technician out within two hours. Cleaning the coils and replacing a damaged door seal brought the cooler temperature back down to 3°C by noon, and we have moved the dairy products back in.\n\nHowever, the technician noted that one internal component is worn and needs a replacement part that won't arrive until next week. Once he returns on July 28 to install that part, I will ask him to inspect our frozen-food display cases as well, since they haven't had their annual maintenance check yet.\n\nBest,\nKendra Shaw\nStore Manager, Branch #14"}], "text": "[第一篇：維修工單]\nBorealis Commercial HVAC — Field Service Report #SR-519\nService Date: July 22 | Technician: Marco Bellini\nClient: FreshMart Supermarket (Branch #14 — Elmwood Ave.)\nEquipment: Walk-In Dairy Cooler (Model: PolarMax 800)\nInspection Findings:\nTemperature measured at 9°C; normal range is 1°C–4°C.\n1. Condenser Coils: Cleaned thoroughly on-site.\n2. Door Gasket: Replaced with a new PolarMax seal.\n3. Evaporator Fan Motor: Bearing is worn out. Part #PM-44B ordered from manufacturer, arriving July 27. Follow-up visit booked for July 28.\n\n[第二篇：內部電子郵件]\nTo: Regional Operations | From: Kendra Shaw | Date: July 22\nSubject: Dairy Cooler Repair at Branch #14\nWe moved all milk, yogurt, and cheese into the backup chiller, so no inventory was spoiled. Cleaning the coils and replacing a damaged door seal brought the temperature back down to 3°C by noon. When the technician returns on July 28 to install the replacement part, I will ask him to inspect our frozen-food display cases as well.", "trans": "【第一篇：維修工單】\nBorealis 商用空調冷凍公司 — 現場維修報告 #SR-519\n維修日期：7 月 22 日｜技師：Marco Bellini\n客戶：FreshMart 超市（第 14 分店 — Elmwood 大道）\n設備：步入式乳製品冷藏庫（型號：PolarMax 800）\n檢查結果：\n接獲店長 Kendra Shaw 關於步入式乳製品冷藏庫溫度上升的緊急叫修後，於上午 9:15 抵達（實測溫度為 9°C；正常運轉範圍為 1°C–4°C）。\n1. 冷凝器盤管：覆蓋厚重灰塵與碎屑，阻礙氣流。已於現場徹底清潔。\n2. 門框膠條：主門下緣橡膠封條破損，導致熱空氣滲入機組。已取用維修車庫存之全新 PolarMax 封條更換完畢。\n3. 蒸發器風扇馬達：軸承磨損並發出巨大刺耳摩擦聲。馬達目前仍以較低轉速運轉，但必須儘快更換以免完全故障。由於該特定馬達（零件編號 #PM-44B）當地缺貨，我已直接向原廠訂購。\n後續處理：零件 #PM-44B 預計 7 月 27 日抵達本倉庫，已預約 7 月 28 日上午 8:00 再次到場安裝新馬達。\n\n【第二篇：內部電子郵件】\n收件人：區域營運部｜寄件人：Kendra Shaw｜日期：7 月 22 日下午 2:30｜主旨：第 14 分店乳製品冷藏庫維修\n各位好：想向各位報告今天早上 Elmwood 大道門市冷藏設備異常的處理狀況。早班人員 7:00 到店時，步入式乳製品冷藏庫的警報正在作響。我們立即將所有牛奶、優格與起司籃移至備用的肉品蔬果冷藏室，因此沒有任何庫存報廢。Borealis 公司在兩小時內就派技師到場。清潔盤管並更換破損門封後，冷藏庫溫度在中午已降回 3°C，我們也已將乳製品移回。不過技師指出有一個內部零件磨損，替換零件要下週才會到貨。等他 7 月 28 日回來安裝該零件時，我會請他順便檢查我們的冷凍食品展示櫃，因為今年還沒做年度保養檢查。", "en": "Questions 176-180 refer to the following report and e-mail."}, {"kind": "雙篇閱讀 Double Passage (Questions 192–196)", "docs": [{"kind": "第一篇：社區課程簡章 Brochure", "head": " Oakwood Community Arts Center — Autumn Evening Workshops (October 5–November 25)", "text": "All workshops meet once a week for 8 weeks from 6:30 P.M. to 8:30 P.M. Materials are included in the tuition fee unless noted otherwise.\n\n• Watercolor Landscapes (Mondays, Studio 2)\n  Instructor: Helene Vance | Tuition: $180\n  Designed for beginners; learn color mixing, brushwork, and perspective.\n\n• Wheel-Thrown Pottery (Tuesdays, Ceramics Lab)\n  Instructor: Kenji Sato | Tuition: $240\n  Create bowls, mugs, and vases on the potter's wheel. Includes clay and kiln firing.\n\n• Digital Travel Photography (Wednesdays, Media Room B)\n  Instructor: Lucas Meyer | Tuition: $195\n  Master manual camera settings, lighting, and photo editing. Participants must bring their own DSLR or mirrorless camera.\n\n• Artisan Sourdough Baking (Thursdays, Teaching Kitchen)\n  Instructor: Chef Marie Laurent | Tuition: $210\n  Learn fermentation, shaping, and crust scoring. Take home a fresh loaf each week!\n\nRegistration Discounts:\n• Oakwood Residents: 10% off tuition (proof of address required).\n• Early-Bird Bonus: Register by September 20 to waive the $25 administrative registration fee."}, {"kind": "第二篇：學員評價 Online Review", "head": "Posted by: Clara Jenkins ★★★★★ (November 28)", "text": "I just finished my eight-week autumn workshop at the Oakwood Community Arts Center, and it exceeded all my expectations! Although I had owned a mirrorless camera for two years, I had only ever used it on automatic mode. Our instructor was incredibly patient and explained aperture, shutter speed, and night-sky composition in a way that was easy to understand.\n\nBecause I live on Maple Street right here in Oakwood AND signed up on September 15, I saved a nice amount on the registration cost. My only minor suggestion for the center is to add a few more computers with editing software in the classroom, as students occasionally had to share workstations during the second hour of class. Still, I loved the experience so much that I plan to sign up for Kenji Sato's class in the winter term!"}], "text": "[第一篇：社區課程簡章]\nOakwood Community Arts Center — Autumn Evening Workshops (October 5–November 25)\n• Watercolor Landscapes (Mondays, Studio 2) | Helene Vance | $180\n• Wheel-Thrown Pottery (Tuesdays, Ceramics Lab) | Kenji Sato | $240\n• Digital Travel Photography (Wednesdays, Media Room B) | Lucas Meyer | $195 | Must bring own DSLR or mirrorless camera.\n• Artisan Sourdough Baking (Thursdays, Teaching Kitchen) | Chef Marie Laurent | $210\nRegistration Discounts:\n• Oakwood Residents: 10% off tuition.\n• Early-Bird Bonus: Register by September 20 to waive the $25 registration fee.\n\n[第二篇：學員評價]\nPosted by: Clara Jenkins (November 28)\nI just finished my eight-week autumn workshop at Oakwood Community Arts Center. Although I had owned a mirrorless camera for two years, I had only ever used it on automatic mode. Our instructor explained aperture and shutter speed clearly. Because I live in Oakwood AND signed up on September 15, I saved on registration. My only suggestion is to add more computers in the classroom. I plan to sign up for Kenji Sato's class in the winter term!", "trans": "【第一篇：社區課程簡章】\nOakwood 社區藝術中心 — 秋季夜間工作坊（10 月 5 日至 11 月 25 日）\n所有工作坊每週上課一次，為期 8 週，時間為晚間 6:30 至 8:30。除另有說明外，學費均含材料費。\n• 水彩風景畫（週一，第 2 畫室）｜講師：Helene Vance｜學費：$180\n  專為初學者設計；學習調色、筆觸與透視法。\n• 手拉坯陶藝（週二，陶藝實驗室）｜講師：佐藤健司（Kenji Sato）｜學費：$240\n  在拉坯機上製作碗、馬克杯與花瓶。含陶土與窯燒費用。\n• 數位旅遊攝影（週三，B 媒體室）｜講師：Lucas Meyer｜學費：$195\n  掌握手動相機設定、光線運用與照片修圖。學員須自備單眼或無反光鏡相機。\n• 手工酸種麵包烘焙（週四，教學廚房）｜講師：Marie Laurent 主廚｜學費：$210\n  學習發酵、整形與割紋技巧。每週都可帶一條新鮮出爐的麵包回家！\n報名優惠：\n• Oakwood 設籍居民：學費享 9 折優惠（須出示地址證明）。\n• 早鳥禮遇：9 月 20 日前報名可免收 $25 行政報名費。\n\n【第二篇：學員評價】\n張貼者：Clara Jenkins ★★★★★（11 月 28 日）\n我剛在 Oakwood 社區藝術中心完成為期八週的秋季工作坊，課程完全超越我的期待！雖然我買無反光鏡相機已經兩年了，但以前都只會用自動模式。我們的講師非常有耐心，用淺顯易懂的方式講解光圈、快門速度與夜空構圖。因為我就住在 Oakwood 的 Maple 街，而且在 9 月 15 日就報名了，我省下了一筆可觀的報名費用。我對中心唯一的小建議是在教室裡多加幾台裝有修圖軟體的電腦，因為在課堂第二個小時，學員偶爾必須共用工作站。儘管如此，我非常喜歡這次的體驗，打算冬季班再去報名佐藤健司老師的課！", "en": "Questions 181-185 refer to the following brochure and online review."}], "qs": [{"n": 176, "p": 0, "g": "t_p7detail", "q": "Why did Kendra Shaw call Borealis Commercial HVAC on the morning of July 22?", "o": ["An annual maintenance inspection was due.", "The backup meat chiller was making a loud noise.", "The walk-in dairy cooler was too warm.", "The frozen-food display cases had stopped working."], "a": 2, "h": "查看第一篇 Inspection Findings 第一段（rising temperatures inside the walk-in dairy cooler）。", "trans": "Kendra Shaw 為何在 7 月 22 日早上致電 Borealis 商用空調冷凍公司？", "e": "第一篇指出店長緊急叫修是因為步入式乳製品冷藏庫溫度升高至 9°C（正常應為 1°C–4°C），第二篇也提到早班發現乳製品冷藏庫警報作響，故選 (C)。", "w": "(D)(A) 冷凍食品展示櫃的年度保養是她打算 7 月 28 日順便請技師做的；(B) 發出刺耳摩擦聲的是乳製品冷藏庫的蒸發器風扇馬達，備用肉品冷藏室運作正常。"}, {"n": 177, "p": 0, "g": "t_p7detail", "q": "How did FreshMart staff prevent the dairy products from spoiling?", "o": ["They packed the crates in dry ice.", "They transferred the products to another refrigerated unit.", "They sold the milk and yogurt at a 50% discount.", "They sent the inventory to Branch #15."], "a": 1, "h": "查看第二篇第一段第三句「We immediately moved all milk, yogurt, and cheese crates into...」。", "trans": "FreshMart 員工如何防止乳製品變質報廢？", "e": "第二篇第一段說明「We immediately moved all milk, yogurt, and cheese crates into the backup meat-and-produce chiller, so no inventory was spoiled」，即立刻將乳製品移至另一台備用冷藏室，故選 (B)。", "w": "(A) 未提乾冰；(C) 未提打折出售；(D) 未提移轉至其他分店。"}, {"n": 178, "p": 0, "g": "t_p7cross", "q": "What part did Marco Bellini replace on July 22?", "o": ["The rubber door seal", "The evaporator fan motor", "The condenser coils", "The digital temperature alarm"], "a": 0, "h": "比對第一篇的 1、2、3 點與第二篇第二段：哪一項是在 7 月 22 日當天更換（Replaced）的？", "trans": "Marco Bellini 在 7 月 22 日當天更換了哪個零件？", "e": "第一篇第 2 點寫道「Door Gasket: ... Replaced with a new PolarMax seal from service van inventory」，第二篇也確認「replacing a damaged door seal」，當天更換的是橡膠門封膠條，故選 (A)。", "w": "(C) 冷凝器盤管是現場清潔（Cleaned thoroughly），並非更換；(B) 蒸發器風扇馬達（Part #PM-44B）缺貨已向原廠訂購，要 7 月 28 日才安裝；(D) 溫度警報器並未損壞或更換。"}, {"n": 179, "p": 0, "g": "t_p7detail", "q": "What is Part #PM-44B?", "o": ["A frozen-food display light", "A condenser filter", "A rubber door gasket", "An evaporator fan motor"], "a": 3, "h": "查看第一篇第 3 點括號內的 Part #PM-44B。", "trans": "零件編號 #PM-44B 是什麼？", "e": "第一篇第 3 點「Evaporator Fan Motor」說明「Because the specific motor (Part #PM-44B) is out of stock locally, I have ordered it directly from the manufacturer」，故 #PM-44B 為蒸發器風扇馬達，選 (D)。", "w": "(C) 門封膠條當天已從維修車庫存更換；(B)(A) 非該零件編號所指。"}, {"n": 180, "p": 0, "g": "t_p7detail", "q": "What does Ms. Shaw plan to request during the July 28 visit?", "o": ["An inspection of the store's frozen-food cases", "Training for staff on cleaning condenser coils", "A refund on the initial service call", "A price quote for a brand-new walk-in cooler"], "a": 0, "h": "查看第二篇最後一句「Once he returns on July 28... I will ask him to...」。", "trans": "Shaw 女士打算在 7 月 28 日技師到訪時要求什麼？", "e": "第二篇最後一句明言「Once he returns on July 28 to install that part, I will ask him to inspect our frozen-food display cases as well」，她會請技師順便檢查冷凍食品展示櫃，故選 (A)。", "w": "(C)(B)(D) 文中均未提及。"}, {"n": 181, "p": 1, "g": "t_p7cross", "q": "Who taught the autumn workshop that Clara Jenkins attended?", "o": ["Kenji Sato", "Marie Laurent", "Helene Vance", "Lucas Meyer"], "a": 3, "h": "在第二篇找出 Clara Jenkins 上課使用的器材與學習內容（mirrorless camera、aperture、shutter speed），再對照第一篇是哪一門課的講師。", "trans": "Clara Jenkins 參加的秋季工作坊是由誰授課的？", "e": "第二篇中 Clara 提到自己帶無反光鏡相機（mirrorless camera），學習光圈、快門速度與修圖軟體，對應第一篇週三的「Digital Travel Photography」，授課講師為 Lucas Meyer，故選 (D)。", "w": "(C) Helene Vance 教水彩風景畫；(A) Kenji Sato 教手拉坯陶藝（Clara 打算冬季班才去報名他的課）；(B) Marie Laurent 教酸種麵包烘焙。"}, {"n": 182, "p": 1, "g": "t_p7cross", "q": "On which day of the week did Clara Jenkins attend her autumn class?", "o": ["Monday", "Wednesday", "Tuesday", "Thursday"], "a": 1, "h": "對照第一篇 Digital Travel Photography 的上課星期。", "trans": "Clara Jenkins 在秋季班每週幾去上課？", "e": "她參加的 Digital Travel Photography 在第一篇簡章標示為「(Wednesdays, Media Room B)」，即每週三上課，故選 (B)。", "w": "(A) 週一是水彩課；(C) 週二是陶藝課；(D) 週四是烘焙課。"}, {"n": 183, "p": 1, "g": "t_p7cross", "q": "How much did Clara Jenkins pay in total for her autumn workshop?", "o": ["$195.00", "$200.50", "$175.50", "$220.00"], "a": 2, "h": "攝影課學費 $195，她是 Oakwood 居民享 9 折（10% off），且在 9 月 15 日報名免收 $25 報名費：$195 × 0.9 = ?", "trans": "Clara Jenkins 為她的秋季工作坊總共支付了多少費用？", "e": "第一篇顯示數位旅遊攝影學費為 $195。第二篇 Clara 提到自己住在 Oakwood（享學費 9 折：$195 × 0.9 = $175.50），且於 9 月 15 日報名（早於 9 月 20 日早鳥期限，免收 $25 行政報名費），因此總共支付 $175.50，故選 (C)。", "w": "(A) $195.00 是未打折的學費；(B) $200.50 是打了 9 折卻誤加上 $25 報名費；(D) $220.00 是原價 $195 加上 $25 報名費。"}, {"n": 184, "p": 1, "g": "t_p7cross", "q": "Which room does Clara Jenkins suggest improving?", "o": ["Studio 2", "The Ceramics Lab", "Media Room B", "The Teaching Kitchen"], "a": 2, "h": "她在第二篇建議在她的上課教室多加幾台電腦，對照第一篇攝影課在哪間教室上課？", "trans": "Clara Jenkins 建議改善哪一間教室？", "e": "Clara 在第二篇建議在她的攝影課教室增加裝有修圖軟體的電腦，而第一篇明載數位旅遊攝影的上課地點為「Media Room B」，故選 (C)。", "w": "(A) Studio 2 是水彩教室；(B) Ceramics Lab 是陶藝教室；(D) Teaching Kitchen 是烘焙廚房。"}, {"n": 185, "p": 1, "g": "t_p7cross", "q": "What activity does Clara Jenkins plan to try in the winter term?", "o": ["Baking sourdough bread", "Making ceramic items", "Painting landscapes", "Editing travel videos"], "a": 1, "h": "查看第二篇最後一句「sign up for Kenji Sato's class in the winter term」，再對照第一篇 Kenji Sato 教什麼。", "trans": "Clara Jenkins 打算在冬季班嘗試什麼活動？", "e": "第二篇最後一句說她打算在冬季班報名 Kenji Sato 的課程，對照第一篇，Kenji Sato 教授的是「Wheel-Thrown Pottery（手拉坯陶藝：製作碗、馬克杯與花瓶）」，即製作陶器，故選 (B)。", "w": "(C) 風景畫是 Helene Vance 的課；(D) 簡章無影片剪輯課；(A) 酸種麵包是 Marie Laurent 主廚的課。"}]}, {"id": "p7_5", "kind": "toeic", "part": 7, "title": "Part 7 Practice: Triple Passages", "sub": "3 組三篇閱讀 × 5 題（題號 186–200）．比對三份文件之間的條件、日期與金額", "passages": [{"kind": "三篇閱讀 Triple Passage (Questions 186–190)", "docs": [{"kind": "第一篇：徵才廣告 Job Advertisement", "head": "Marlow Hotels — Front Desk Supervisor (Lisbon)", "text": "Marlow Hotels is seeking a full-time Front Desk Supervisor for our newly renovated property in central Lisbon.\n\nRequirements:\n• At least two years of experience at a hotel front desk\n• Fluency in Portuguese and English\n• Availability to work weekend shifts\nKnowledge of Spanish is a plus but not required.\n\nTo apply, e-mail a résumé to jobs@marlowhotels.pt by April 30. Interviews will be held at the hotel from May 6 to May 8."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: jobs@marlowhotels.pt\nFrom: Ana Ribeiro <ana.ribeiro@mailpt.com>\nDate: April 22\nSubject: Application — Front Desk Supervisor", "text": "Dear Hiring Manager,\n\nI am writing to apply for the Front Desk Supervisor position. For the past three years, I have worked at the reception desk of the Hotel Lumen in Porto, where I now train new staff members. I speak Portuguese and English fluently, and I also have a good working knowledge of French. I am happy to work weekend shifts.\n\nI will be attending a training course in Madrid on May 6 and 7. If I am selected for an interview, could it be scheduled for May 8?\n\nSincerely,\nAna Ribeiro"}, {"kind": "第三篇：面試時程表 Interview Schedule", "head": "Marlow Hotels Lisbon — Front Desk Supervisor Interviews (updated May 1)", "text": "Interviewer: Carla Mendes, Front Office Manager\nLocation: Meeting Room 2, second floor\n\nMay 6 — 10:00 A.M.  João Silva\nMay 6 — 2:00 P.M.  Lena Fischer\nMay 7 — 11:00 A.M.  Marco Duarte\nMay 8 — 9:30 A.M.  Ana Ribeiro\nMay 8 — 1:30 P.M.  Inês Costa\n\nCandidates should bring a copy of their résumé and a form of photo identification."}], "text": "[第一篇：徵才廣告 Job Advertisement]\nMarlow Hotels — Front Desk Supervisor (Lisbon)\nMarlow Hotels is seeking a full-time Front Desk Supervisor for our newly renovated property in central Lisbon.\n\nRequirements:\n• At least two years of experience at a hotel front desk\n• Fluency in Portuguese and English\n• Availability to work weekend shifts\nKnowledge of Spanish is a plus but not required.\n\nTo apply, e-mail a résumé to jobs@marlowhotels.pt by April 30. Interviews will be held at the hotel from May 6 to May 8.\n\n[第二篇：電子郵件 E-mail]\nTo: jobs@marlowhotels.pt\nFrom: Ana Ribeiro <ana.ribeiro@mailpt.com>\nDate: April 22\nSubject: Application — Front Desk Supervisor\nDear Hiring Manager,\n\nI am writing to apply for the Front Desk Supervisor position. For the past three years, I have worked at the reception desk of the Hotel Lumen in Porto, where I now train new staff members. I speak Portuguese and English fluently, and I also have a good working knowledge of French. I am happy to work weekend shifts.\n\nI will be attending a training course in Madrid on May 6 and 7. If I am selected for an interview, could it be scheduled for May 8?\n\nSincerely,\nAna Ribeiro\n\n[第三篇：面試時程表 Interview Schedule]\nMarlow Hotels Lisbon — Front Desk Supervisor Interviews (updated May 1)\nInterviewer: Carla Mendes, Front Office Manager\nLocation: Meeting Room 2, second floor\n\nMay 6 — 10:00 A.M.  João Silva\nMay 6 — 2:00 P.M.  Lena Fischer\nMay 7 — 11:00 A.M.  Marco Duarte\nMay 8 — 9:30 A.M.  Ana Ribeiro\nMay 8 — 1:30 P.M.  Inês Costa\n\nCandidates should bring a copy of their résumé and a form of photo identification.", "trans": "【第一篇：徵才廣告】Marlow 飯店徵求里斯本市中心新整修分館的全職櫃台主管。條件：至少兩年飯店櫃台經驗；葡萄牙語與英語流利；可輪週末班。會西班牙語尤佳，但非必要。請於 4 月 30 日前寄履歷至 jobs@marlowhotels.pt。面試將於 5 月 6 日至 8 日在飯店舉行。\n【第二篇：電子郵件】Ana Ribeiro，4 月 22 日：我想應徵櫃台主管一職。過去三年我在波多的 Lumen 飯店櫃台工作，目前負責訓練新進人員。我葡萄牙語和英語流利，也具備不錯的法語工作能力，可以輪週末班。我 5 月 6、7 日要在馬德里參加訓練課程，如果獲選面試，可以安排在 5 月 8 日嗎？\n【第三篇：面試時程表】Marlow 飯店里斯本分館櫃台主管面試（5 月 1 日更新）。面試官：櫃台經理 Carla Mendes；地點：二樓 2 號會議室。5/6 10:00 João Silva；5/6 14:00 Lena Fischer；5/7 11:00 Marco Duarte；5/8 9:30 Ana Ribeiro；5/8 13:30 Inês Costa。應試者請攜帶履歷影本與附照片的身分證件。", "en": "Questions 186-190 refer to the following advertisement, e-mail, and schedule."}, {"kind": "三篇閱讀 Triple Passage (Questions 191–195)", "docs": [{"kind": "第一篇：網頁 Web Page", "head": "Riverside Event Hall — Rooms and Rates", "text": "Garden Room — up to 40 guests — Half day $300 / Full day $500\nTerrace Room — up to 80 guests — Half day $550 / Full day $900\nGrand Hall — up to 200 guests — Half day $1,200 / Full day $2,000\n\nHalf-day rentals are for a maximum of four hours.\n• A 20% surcharge applies to all Saturday and Sunday bookings.\n• Our audiovisual package (projector, screen, and wireless microphones) is available for $150 per event.\n• Cancellations made at least 14 days before an event are eligible for a full refund, less a $50 processing fee."}, {"kind": "第二篇：電子郵件 E-mail", "head": "To: bookings@riversideeventhall.com\nFrom: Kevin Osei <kosei@tallisdesign.com>\nDate: September 2\nSubject: Company party", "text": "Hello,\n\nTallis Design is planning a party for our 65 employees on Saturday, October 18, from 6:00 to 10:00 P.M. We would like to rent a room that is large enough for everyone but not so large that it feels empty.\n\nWe also plan to show a slideshow of the year's projects, so we will need a projector and a screen. Could you send me an invoice for the appropriate room?\n\nThank you,\nKevin Osei\nOffice Administrator, Tallis Design"}, {"kind": "第三篇：帳單 Invoice", "head": "Riverside Event Hall — Invoice #R-2291\nClient: Tallis Design (Kevin Osei)\nInvoice Date: September 5", "text": "Event date: Saturday, October 18, 6:00–10:00 P.M.\n\nTerrace Room, half-day rental ........ $550.00\nWeekend surcharge (20%) .............. $110.00\nAudiovisual package .................. $150.00\nTotal ................................ $810.00\n\nDeposit received (September 8): $405.00\nBalance due on the day of the event: $405.00"}], "text": "[第一篇：網頁 Web Page]\nRiverside Event Hall — Rooms and Rates\nGarden Room — up to 40 guests — Half day $300 / Full day $500\nTerrace Room — up to 80 guests — Half day $550 / Full day $900\nGrand Hall — up to 200 guests — Half day $1,200 / Full day $2,000\n\nHalf-day rentals are for a maximum of four hours.\n• A 20% surcharge applies to all Saturday and Sunday bookings.\n• Our audiovisual package (projector, screen, and wireless microphones) is available for $150 per event.\n• Cancellations made at least 14 days before an event are eligible for a full refund, less a $50 processing fee.\n\n[第二篇：電子郵件 E-mail]\nTo: bookings@riversideeventhall.com\nFrom: Kevin Osei <kosei@tallisdesign.com>\nDate: September 2\nSubject: Company party\nHello,\n\nTallis Design is planning a party for our 65 employees on Saturday, October 18, from 6:00 to 10:00 P.M. We would like to rent a room that is large enough for everyone but not so large that it feels empty.\n\nWe also plan to show a slideshow of the year's projects, so we will need a projector and a screen. Could you send me an invoice for the appropriate room?\n\nThank you,\nKevin Osei\nOffice Administrator, Tallis Design\n\n[第三篇：帳單 Invoice]\nRiverside Event Hall — Invoice #R-2291\nClient: Tallis Design (Kevin Osei)\nInvoice Date: September 5\nEvent date: Saturday, October 18, 6:00–10:00 P.M.\n\nTerrace Room, half-day rental ........ $550.00\nWeekend surcharge (20%) .............. $110.00\nAudiovisual package .................. $150.00\nTotal ................................ $810.00\n\nDeposit received (September 8): $405.00\nBalance due on the day of the event: $405.00", "trans": "【第一篇：網頁】Riverside 活動館 — 場地與價格。花園廳 40 人：半天 300／全天 500 美元；露台廳 80 人：半天 550／全天 900 美元；大禮堂 200 人：半天 1,200／全天 2,000 美元。半天租借最多四小時。週六、週日預訂加收 20%。影音套組（投影機、布幕、無線麥克風）每場 150 美元。活動前至少 14 天取消可全額退款，但須扣除 50 美元手續費。\n【第二篇：電子郵件】Tallis 設計公司行政人員 Kevin Osei，9 月 2 日：公司打算在 10 月 18 日（週六）晚上 6 點到 10 點為 65 位員工舉辦派對，想租一間能容納所有人、但又不會大到顯得空曠的場地。我們也打算播放今年專案的投影片，需要投影機和布幕。能否寄給我合適場地的帳單？\n【第三篇：帳單】Riverside 活動館帳單 #R-2291，客戶 Tallis 設計（Kevin Osei），9 月 5 日開立。活動：10 月 18 日（週六）18:00–22:00。露台廳半天 550 美元；週末加價 20% 110 美元；影音套組 150 美元；合計 810 美元。訂金 405 美元已於 9 月 8 日收到；餘額 405 美元於活動當天支付。", "en": "Questions 191-195 refer to the following Web page, e-mail, and invoice."}, {"kind": "三篇閱讀 Triple Passage (Questions 196–200)", "docs": [{"kind": "第一篇：出差行程表 Itinerary", "head": "Travel Itinerary — Julia Hart, Director of Purchasing, Wexford Supplies", "text": "Sunday, October 12\n• Flight NA 208, Boston → Toronto, departs 8:05 A.M., arrives 9:50 A.M.\n• 2:00 P.M. Meeting with Dalton Tech at their downtown office\n• Hotel: Kingsley Hotel, check-in October 12, check-out October 15 (3 nights)\n\nMonday, October 13\n• North American Packaging Expo, Metro Convention Centre (all day)\n\nTuesday, October 14\n• 10:00 A.M. Meeting with Fernwood Supplies\n\nWednesday, October 15\n• Flight NA 215, Toronto → Boston, departs 11:30 A.M."}, {"kind": "第二篇：航空公司通知 Notice", "head": "From: Northair Customer Service\nTo: Julia Hart\nDate: October 5\nSubject: Schedule change — Flight NA 208", "text": "Dear Ms. Hart,\n\nWe regret to inform you that Flight NA 208 from Boston to Toronto on October 12 has been rescheduled. The flight will now depart at 12:40 P.M. and arrive at 2:25 P.M.\n\nIf the new time is not convenient, you may change to Flight NA 204, which departs at 6:15 A.M. and arrives at 8:00 A.M., at no additional cost. You may also request a full refund. Please contact us within 72 hours to make any changes."}, {"kind": "第三篇：電子郵件 E-mail", "head": "To: Ben Carter\nFrom: Julia Hart\nDate: October 5\nSubject: Toronto trip", "text": "Hi Ben,\n\nNorthair has changed the time of my flight to Toronto. Please move me to the earlier flight they offered so that I don't miss my first appointment.\n\nAlso, I just learned that the expo will close at noon on October 13 instead of running all day. Could you ask Fernwood Supplies whether they can meet me that afternoon instead? If they agree, I would like to fly home on the 14th and shorten my hotel stay by one night.\n\nThanks,\nJulia"}], "text": "[第一篇：出差行程表 Itinerary]\nTravel Itinerary — Julia Hart, Director of Purchasing, Wexford Supplies\nSunday, October 12\n• Flight NA 208, Boston → Toronto, departs 8:05 A.M., arrives 9:50 A.M.\n• 2:00 P.M. Meeting with Dalton Tech at their downtown office\n• Hotel: Kingsley Hotel, check-in October 12, check-out October 15 (3 nights)\n\nMonday, October 13\n• North American Packaging Expo, Metro Convention Centre (all day)\n\nTuesday, October 14\n• 10:00 A.M. Meeting with Fernwood Supplies\n\nWednesday, October 15\n• Flight NA 215, Toronto → Boston, departs 11:30 A.M.\n\n[第二篇：航空公司通知 Notice]\nFrom: Northair Customer Service\nTo: Julia Hart\nDate: October 5\nSubject: Schedule change — Flight NA 208\nDear Ms. Hart,\n\nWe regret to inform you that Flight NA 208 from Boston to Toronto on October 12 has been rescheduled. The flight will now depart at 12:40 P.M. and arrive at 2:25 P.M.\n\nIf the new time is not convenient, you may change to Flight NA 204, which departs at 6:15 A.M. and arrives at 8:00 A.M., at no additional cost. You may also request a full refund. Please contact us within 72 hours to make any changes.\n\n[第三篇：電子郵件 E-mail]\nTo: Ben Carter\nFrom: Julia Hart\nDate: October 5\nSubject: Toronto trip\nHi Ben,\n\nNorthair has changed the time of my flight to Toronto. Please move me to the earlier flight they offered so that I don't miss my first appointment.\n\nAlso, I just learned that the expo will close at noon on October 13 instead of running all day. Could you ask Fernwood Supplies whether they can meet me that afternoon instead? If they agree, I would like to fly home on the 14th and shorten my hotel stay by one night.\n\nThanks,\nJulia", "trans": "【第一篇：出差行程表】Wexford Supplies 採購總監 Julia Hart。10 月 12 日（週日）：NA 208 班機 波士頓→多倫多，8:05 起飛、9:50 抵達；下午 2:00 與 Dalton Tech 在其市中心辦公室開會；入住 Kingsley 飯店，10 月 12 日入住、15 日退房（3 晚）。10 月 13 日（週一）：北美包裝博覽會，Metro 會展中心（全天）。10 月 14 日（週二）：上午 10:00 與 Fernwood Supplies 開會。10 月 15 日（週三）：NA 215 班機 多倫多→波士頓，11:30 起飛。\n【第二篇：航空公司通知】Northair 客服，10 月 5 日：很遺憾通知您，10 月 12 日波士頓飛多倫多的 NA 208 班機已改期，改為 12:40 起飛、14:25 抵達。若新時間不便，您可免費改搭 NA 204，6:15 起飛、8:00 抵達；也可申請全額退款。如需更改，請於 72 小時內與我們聯絡。\n【第三篇：電子郵件】Julia Hart 寫給 Ben Carter，10 月 5 日：Northair 改了我飛多倫多的時間，請幫我改搭他們提供的較早班機，以免錯過第一個約會。另外，我剛得知博覽會 10 月 13 日中午就會結束，不是全天。能否問問 Fernwood Supplies 可不可以改在那天下午見面？如果他們同意，我想 14 日就飛回來，飯店也少住一晚。", "en": "Questions 196-200 refer to the following itinerary, notice, and e-mail."}], "qs": [{"n": 186, "p": 0, "g": "t_p7not", "q": "What is NOT a requirement for the position?", "o": ["Availability on weekends", "Knowledge of Spanish", "Fluency in English", "Experience at a hotel front desk"], "a": 1, "h": "NOT 題：把四個選項逐一和第一篇的 Requirements 對照。", "e": "第一篇列出的必要條件是兩年櫃台經驗、葡萄牙語與英語流利、可輪週末班；西班牙語是「a plus but not required」（加分但非必要），故選 (B)。", "w": "(C)(D)(A) 都列在 Requirements 中。", "trans": "下列何者「不是」這個職位的必要條件？"}, {"n": 187, "p": 0, "g": "t_p7cross", "q": "What qualification does Ms. Ribeiro have that is NOT mentioned in the advertisement?", "o": ["She has worked at a hotel front desk.", "She can work on weekends.", "She can speak French.", "She speaks Portuguese fluently."], "a": 2, "h": "比對第二篇她列出的能力與第一篇廣告的條件，找出廣告沒有提到的那一項。", "e": "第二篇她提到自己有不錯的法語能力（working knowledge of French），而第一篇只提到葡萄牙語、英語與西班牙語，完全沒有提到法語，故選 (C)。", "w": "(B)(D)(A) 都是第一篇廣告列出的條件。", "trans": "Ribeiro 女士具備的哪一項資格是廣告中「沒有」提到的？"}, {"n": 188, "p": 0, "g": "t_p7detail", "q": "Why does Ms. Ribeiro mention May 6 and May 7?", "o": ["She will be away for a training course.", "She will start a new job in Madrid.", "She wants to visit the hotel before applying.", "She will be training new staff at her hotel."], "a": 0, "h": "看第二篇第二段她提到這兩天的原因。", "e": "第二篇說她 5 月 6、7 日要在馬德里參加訓練課程（attending a training course in Madrid），所以那兩天無法面試，故選 (A)。", "w": "(D) 她在現職訓練新人，但和這兩天無關；(B) 她是去上課，不是到馬德里上新工作；(C) 文中沒有提到。", "trans": "Ribeiro 女士為什麼提到 5 月 6 日和 7 日？"}, {"n": 189, "p": 0, "g": "t_p7cross", "q": "What can be concluded about Ms. Ribeiro's interview?", "o": ["It has been canceled.", "It will take place in Madrid.", "It will be conducted by video.", "Her request regarding the date was accepted."], "a": 3, "h": "比對第二篇她的請求與第三篇的時程表。", "e": "第二篇她請求把面試安排在 5 月 8 日；第三篇時程表顯示她的面試在 May 8, 9:30 A.M.，表示她的請求被接受了，故選 (D)。", "w": "(C) 面試地點是飯店二樓會議室，不是視訊；(B) 面試在里斯本的飯店舉行；(A) 她的名字仍在時程表上。", "trans": "關於 Ribeiro 女士的面試，可以得出什麼結論？"}, {"n": 190, "p": 0, "g": "t_p7detail", "q": "Who is Carla Mendes?", "o": ["The person who wrote the job advertisement", "A manager who will interview the candidates", "A receptionist at the Hotel Lumen", "A candidate for the position"], "a": 1, "h": "看第三篇時程表的第一行。", "e": "第三篇寫「Interviewer: Carla Mendes, Front Office Manager」，她是負責面試的櫃台經理，故選 (B)。", "w": "(D) 應試者名單中沒有她；(C) Lumen 飯店是 Ribeiro 女士的現職；(A) 文中沒有說明廣告由誰撰寫。", "trans": "Carla Mendes 是誰？"}, {"n": 191, "p": 1, "g": "t_p7detail", "q": "What is indicated about Riverside Event Hall?", "o": ["It does not allow events to end after 10:00 P.M.", "It provides catering for all events.", "It offers discounts to groups of more than 50 people.", "It charges more for events held on weekends."], "a": 3, "h": "逐一核對第一篇的各項規定。", "e": "第一篇寫「A 20% surcharge applies to all Saturday and Sunday bookings」，週末預訂要加收 20%，故選 (D)。", "w": "(B) 文中沒有提到外燴；(C) 沒有提到人數折扣；(A) 沒有提到結束時間的限制。", "trans": "關於 Riverside 活動館，文中指出了什麼？"}, {"n": 192, "p": 1, "g": "t_p7vocab", "q": "On the Web page, the word \"less\" in the last line is closest in meaning to", "o": ["fewer", "smaller", "minus", "without"], "a": 2, "h": "把選項代回「a full refund, less a $50 processing fee」，看哪個意思通順。", "e": "a full refund, less a $50 processing fee 指「全額退款，但要扣掉 50 美元手續費」，這裡的 less 是介系詞「減去」，與 minus 最接近，故選 (C)。", "w": "(B)(A) smaller、fewer 是比較級形容詞，不能這樣用；(D) without 會變成「不含手續費的全額退款」，意思相反。", "trans": "在網頁最後一行中，less 一字的意思最接近下列何者？"}, {"n": 193, "p": 1, "g": "t_p7cross", "q": "Why was the Terrace Room most likely selected for Tallis Design?", "o": ["It is the smallest room that can hold all of the employees.", "It is the least expensive room for a full-day rental.", "It is the only room with audiovisual equipment.", "It is available only on Saturdays."], "a": 0, "h": "第二篇提到人數與「不要太大」的需求，回第一篇比對各場地容量。", "e": "第二篇說有 65 人，希望場地夠大但不要太空曠；第一篇中花園廳只能容納 40 人，露台廳可容納 80 人，大禮堂可容納 200 人。露台廳是能容納所有人的最小場地，故選 (A)。", "w": "(C) 影音套組是另外加購，每間都可以租；(D) 文中沒有這項限制；(B) 他們租的是半天，而且最便宜的是花園廳。", "trans": "露台廳最可能為什麼被選為 Tallis 設計的場地？"}, {"n": 194, "p": 1, "g": "t_p7cross", "q": "Why does the invoice include a $110 charge?", "o": ["The party will last more than four hours.", "The party will be held on a Saturday.", "Mr. Osei asked for extra microphones.", "The deposit was paid after the deadline."], "a": 1, "h": "第三篇的 $110 是什麼名目？再回第一篇查這筆費用的規定。", "e": "第三篇的 $110 是 Weekend surcharge (20%)；第一篇規定週六、週日預訂加收 20%，而派對在週六（$550 × 20% = $110），故選 (B)。", "w": "(A) 派對 6 點到 10 點，正好四小時，符合半天租借；(C) 麥克風包含在 $150 的影音套組裡；(D) 文中沒有提到逾期付款。", "trans": "帳單上為什麼有一筆 110 美元的費用？"}, {"n": 195, "p": 1, "g": "t_p7cross", "q": "If Mr. Osei canceled the booking on September 20, how much would he receive back?", "o": ["$355", "$810", "$760", "$405"], "a": 0, "h": "先確認 9 月 20 日距離活動有沒有超過 14 天，再看他已經付了多少錢。", "e": "9 月 20 日距離 10 月 18 日超過 14 天，依第一篇規定可全額退款但扣除 50 美元手續費。第三篇顯示他目前只付了 405 美元訂金，所以可拿回 $405 − $50 = $355，故選 (A)。", "w": "(D) $405 是已付的訂金，沒有扣手續費；(C) $760 是總額 $810 扣掉 $50，但他尚未付清總額；(B) $810 是帳單總額。", "trans": "如果 Osei 先生在 9 月 20 日取消預訂，他會拿回多少錢？"}, {"n": 196, "p": 2, "g": "t_p7detail", "q": "What is Ms. Hart scheduled to do on October 13?", "o": ["Fly back to Boston", "Visit Fernwood Supplies' factory", "Meet with representatives of Dalton Tech", "Attend an industry exhibition"], "a": 3, "h": "看第一篇 10 月 13 日的行程，注意同義改寫。", "e": "第一篇 10 月 13 日的行程是 North American Packaging Expo（全天的包裝博覽會），也就是參加產業展覽，故選 (D)。", "w": "(C) 與 Dalton Tech 開會是 10 月 12 日；(A) 回程原定 10 月 15 日；(B) 與 Fernwood 開會是 10 月 14 日，而且文中沒有說是參觀工廠。", "trans": "Hart 女士 10 月 13 日原定要做什麼？"}, {"n": 197, "p": 2, "g": "t_p7cross", "q": "Why is the new schedule for Flight NA 208 a problem for Ms. Hart?", "o": ["She would miss the opening of the expo.", "She would have to pay an additional fare.", "She would arrive after her meeting with Dalton Tech begins.", "She would not be able to check in to her hotel."], "a": 2, "h": "比對第二篇新的抵達時間與第一篇當天的第一個約會。", "e": "第二篇說 NA 208 改為下午 2:25 抵達；第一篇顯示她當天下午 2:00 要與 Dalton Tech 開會。新班機抵達時會議已經開始，所以她在第三篇要求改搭較早班機，故選 (C)。", "w": "(D) 文中沒有提到入住時間的限制；(A) 博覽會在 10 月 13 日；(B) 改搭 NA 204 不需加價。", "trans": "NA 208 班機的新時刻為什麼對 Hart 女士造成問題？"}, {"n": 198, "p": 2, "g": "t_p7detail", "q": "What does Northair offer to passengers on Flight NA 208?", "o": ["A discount on a future flight", "A free change to a different flight", "An upgrade to a higher class of service", "A hotel room in Toronto"], "a": 1, "h": "看第二篇第二段航空公司提供的選擇。", "e": "第二篇說乘客可以改搭 NA 204「at no additional cost」（不需額外費用），也就是免費改搭其他班機，故選 (B)。", "w": "(A)(D)(C) 文中都沒有提到；另一個選項是全額退款，不是折扣。", "trans": "Northair 提供 NA 208 班機乘客什麼？"}, {"n": 199, "p": 2, "g": "t_p7cross", "q": "Which appointment does Ms. Hart want to reschedule?", "o": ["Her visit to the expo", "Her meeting on October 14", "Her meeting on October 12", "Her flight on October 12"], "a": 1, "h": "第三篇她想請誰改時間？再回第一篇查那個約會原本在哪一天。", "e": const dataKey=o=>stable({ans:o.ans||{},ansT:o.ansT||{},flags:o.flags||{},flagT:o.flagT||{},cur:o.cur||{},curT:o.curT||{}});
function mergeMap(lv,lt,rv,rt){
  let ch=false;rv=rv||{};rt=rt||{};
  new Set([...Object.keys(lt),...Object.keys(rt),...Object.keys(lv),...Object.keys(rv)]).forEach(k=>{
    const a=lt[k]||0,b=rt[k]||0;
    if(b>a||(b===a&&lv[k]===undefined&&rv[k]!==undefined)){
      if(rv[k]===undefined){if(lv[k]!==undefined){delete lv[k];ch=true}}
      else if(lv[k]!==rv[k]){lv[k]=rv[k];ch=true}
      if(b)lt[k]=b;
    }
  });
  return ch;
}
function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  if(remapOpts(r))r._migrated=true;
  if(migrateData(r))r._migrated=true;
  let ch=mergeMap(st.ans,st.ansT,r.ans,r.ansT);
  ch=mergeMap(st.flags,st.flagT,r.flags,r.flagT)||ch;
  ch=mergeMap(st.cur,st.curT,r.cur,r.curT)||ch;
  prevCur={...st.cur};
  return ch;
}

const Sync={
  cfg:{token:"",gistId:"",last:0}, state:"off", msg:"", busy:false, again:false, timer:null,
  loadCfg(){try{Object.assign(this.cfg,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"))}catch(e){}this.state=this.cfg.token?"idle":"off"},
  saveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(this.cfg))}catch(e){}},
  on(){return !!this.cfg.token},
  async api(path,opt={}){
    let r;
    try{
      r=await fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{
        "Accept":"application/vnd.github+json","Authorization":"Bearer "+this.cfg.token,
        ...(opt.body?{"Content-Type":"application/json"}:{})}});
    }catch(e){throw new Error("無法連線到 GitHub，請確認網路")}
    if(r.status===401){const e=new Error("Token 無效或已過期，請重新設定");e.code=401;throw e}
    if(r.status===404){const e=new Error("找不到同步用的 Gist");e.code=404;throw e}
    if(r.status===403||r.status===429)throw new Error("GitHub 拒絕請求：Token 需要 gist 權限，或暫時超過使用額度");
    if(!r.ok)throw new Error("GitHub 回應錯誤（"+r.status+"）");
    return r.status===204?null:r.json();
  },
  async findOrCreate(){
    for(let page=1;page<=10;page++){
      const list=await this.api(`/gists?per_page=100&page=${page}`);
      const g=(list||[]).find(g=>g.files&&g.files[GIST_FILE]);
      if(g)return g.id;
      if(!list||list.length<100)break;
    }
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
    return g.id;
  },
  async pull(){
    const g=await this.api("/gists/"+this.cfg.gistId);
    const f=g&&g.files&&g.files[GIST_FILE];
    if(!f)return null;
    let txt=f.content;
    if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}
    try{return JSON.parse(txt)}catch(e){return null}
  },
  async push(){
    await this.api("/gists/"+this.cfg.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
  },
  schedule(delay=2500){
    if(!this.on())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{this.timer=null;this.run()},delay);
    if(!this.busy)this.setState("pending");
  },
  flush(){if(this.timer){clearTimeout(this.timer);this.timer=null;this.run()}},
  async run(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.setState("busy");
    let changed=false;
    try{
      if(!this.cfg.gistId){this.cfg.gistId=await this.findOrCreate();this.saveCfg()}
      let remote;
      try{remote=await this.pull()}
      catch(e){if(e.code!==404)throw e;this.cfg.gistId=await this.findOrCreate();this.saveCfg();remote=await this.pull()}
      changed=mergeRemote(remote);
      if(!remote||remote._migrated||dataKey(remote)!==dataKey(st))await this.push();
      this.cfg.last=now();this.saveCfg();persist();
      this.msg="";this.state="ok";
    }catch(e){
      this.msg=e.message||String(e);this.state="err";
      if(e.code===401){this.cfg={token:"",gistId:"",last:0};this.saveCfg()}
    }
    this.busy=false;
    if(changed||st.view==="sync")render();else renderTopbar();
    if(this.again){this.again=false;this.run()}
  },
  setState(s){this.state=s;renderTopbar()}
};


function fmtTime(t){
  if(!t)return "";const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,"0");
  const hm=p(d.getHours())+":"+p(d.getMinutes());
  return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
function syncLabel(){
  const s=Sync.on()?Sync.state:(Sync.state==="err"?"err":"off");
  return [s,{off:"未同步",idle:"同步已啟用",pending:"等待同步",busy:"同步中",ok:"已同步 "+fmtTime(Sync.cfg.last),err:"同步失敗"}[s]];
}

function showToast(msg){

function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");if(cb)cb()}catch(e){alert("複製失敗，請手動複製")}
  document.body.removeChild(ta);
}
function copyText(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(cb).catch(()=>fallbackCopy(text,cb));
  else fallbackCopy(text,cb);
}
function passageHtml(ex,q,ansMap){
  const P=(ex.passages||[])[q.p];if(!P)return "";
  if(Array.isArray(P.docs)&&P.docs.length){
    return P.docs.map(d=>`<div class="passage"><p class="p-kind">${esc(d.kind||"")}</p>${d.head?`<p class="p-head">${esc(d.head)}</p>`:""}<div class="p-body">${esc(d.text||"")}</div></div>`).join("");
  }
  const body=esc(P.text).replace(/\{\{(\d+)\}\}/g,(m0,n)=>{n=+n;
    const qi=ex.qs.findIndex(x=>x.n===n),qq=ex.qs[qi],a=ansMap[ex.id+"-"+qi];
    if(n===q.n)return `<span class="blank cur">(${n})</span>`;
    if(qq&&a!==undefined)return `<span class="blank done">${esc(qq.o[qq.a])}</span>`;
    return `<span class="blank">(${n})</span>`});
  return `<div class="passage"><p class="p-kind">${esc(P.kind||"")}</p>${P.head?`<p class="p-head">${esc(P.head)}</p>`:""}<div class="p-body">${body}</div></div>`;
}

  const filled=set.idx.filter(i=>{const id=ex.id+"-"+i;return st.ans[id]!==undefined||st.p7d[id]!==undefined}).length;

function vPrac(){
  const p=st.pr,id=p.ids[p.i];let ok=0,done=0;
  p.ids.forEach(x=>{if(p.ans[x]!==undefined){done++;if(p.ans[x]===QM[x].q.a)ok++}});
  let h=`${backHome}<h1>${p.title||"隨機抽考"}</h1><p class="sub">${scopeName(p.scope||"toeic")}${p.timed?`．<span id="timer">${timerText()}</span>`:""}</p>`;
  if(done===p.ids.length)h+=`<div class="result"><p><strong>完成：答對 ${ok}／${p.ids.length}（${Math.round(ok/p.ids.length*100)}%）${p.timed&&p.end?`．用時 ${fmtDur(p.end-p.start)}`:""}</strong></p>${p.timed?`<p class="note" style="margin-top:-6px">檢討時把錯題分成兩類記下來：結構／文法錯 → 寫「漏看了哪個訊號」；單字／搭配錯 → 只抄核心搭配詞組。</p>`:""}
  <div class="row-btns"><button class="btn primary" data-act="pstartAgain">再抽一回</button><button class="btn" data-act="go" data-v="home">回目錄</button></div></div>`;
  let cells="";p.ids.forEach((x,j)=>{cells+=gridCell(x,j+1,p.ans,j===p.i,"pgoto",j)});
  h+=sheetBlock("答案卡",`${done}/${p.ids.length}．答對 ${ok}`,cells);
  h+=`${card(id,p.i+1,p.ans,true)}
  <div class="nav"><button class="btn" data-act="prev" ${p.i===0?"disabled":""}>上一題</button>
  <button class="btn primary" data-act="next" ${p.i===p.ids.length-1?"disabled":""}>下一題</button></div>
  <div class="tools"><button data-act="optFirst">選項先看：${st.optFirst?"開":"關"}</button></div>`;
  return h;
}

function vReport(){
  const tags=scopeTags(),stat={};tags.forEach(k=>stat[k]={d:0,o:0,wr:[]});
  let D=0,O=0;
  scopeIds().forEach(id=>{const a=st.ans[id];if(a===undefined)return;const {q}=QM[id];const s=stat[q.g];
    if(s){s.d++;D++;if(a===q.a){s.o++;O++}else s.wr.push(id)}});
  let h=`${backHome}<h1>錯題分析</h1>`;
  if(!D)return h+`<p class="sub">${scopeName()}</p><p style="margin-top:22px">還沒有作答紀錄。完成一份試卷後，這裡會列出各概念的答對率與補強建議。</p>`;
  h+=`<p class="sub">${scopeName()}．作答 ${D} 題，答對 ${O} 題（${Math.round(O/D*100)}%）．不含抽考</p><h2>各概念答對率</h2><div>`;
  const rows=tags.filter(k=>stat[k].d).sort((a,b)=>stat[a].o/stat[a].d-stat[b].o/stat[b].d);
  rows.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
    h+=`<div class="tagrow"><span>${TAGS[k].n}</span><div class="bar"><i class="${p<60?"lo":""}" style="width:${p}%"></i></div><span class="pct">${s.o}/${s.d}．${p}%</span></div>`});
  h+=`</div>`;
  const untouched=tags.filter(k=>!stat[k].d);
  if(untouched.length)h+=`<p class="note">尚未作答：${untouched.map(k=>TAGS[k].n).join("、")}</p>`;
  const weak=rows.filter(k=>stat[k].wr.length);
  if(weak.length){h+=`<h2>建議補強</h2>`;
    weak.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
      h+=`<section class="weak"><h3>${TAGS[k].n}</h3><p class="stat">答對率 ${p}%．錯 ${s.wr.length} 題</p><p>${TAGS[k].t}</p><ul class="wlist">`;
      s.wr.forEach(id=>{const {q}=QM[id];h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button>　<span class="note">${esc(q.q.length>40?q.q.slice(0,40)+"…":q.q)}</span></li>`});
      h+=`</ul></section>`});
  }
  const f=flagIds();
  if(f.length){h+=`<h2>標註的題目</h2><ul class="wlist">`;f.forEach(id=>{h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button></li>`});h+=`</ul>`}
  if(weak.length||f.length)h+=`<div class="tools"><button data-act="pset" data-scope="${st.scope}">用錯題與標註題抽考</button></div>`;
  return h;
}

function render(){
  if(st.view==="prac"&&!(st.pr&&st.pr.ids.length))st.view="home";
  const isRead=st.view==="exam"&&(findEx(st.exam).part===7||findEx(st.exam).part===6);
  const v=isRead?vReading:({home:vHome,exam:vExam,pset:vPset,prac:vPrac,report:vReport,sync:vSync}[st.view]||vHome);
  const pl=document.getElementById("paneL"),pr=document.getElementById("paneR");
  const keep=pl&&pr?{k:pl.dataset.key,l:pl.scrollTop,r:pr.scrollTop}:null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toTop(){window.scrollTo(0,0)}
function qTop(){const el=app.querySelector(".panel");if(!el)return;
  const r=el.getBoundingClientRect();if(r.top<64||r.top>window.innerHeight*0.6)el.scrollIntoView({block:"start"})}
const p5Ids=base=>Object.keys(QM).filter(id=>{const e=QM[id].ex;return e.kind==="toeic"&&(e.part||5)===5&&(!base||(e.stage>=1&&e.stage<=3))});
// 每日 15 題：最多 3 題錯題複習，其餘優先出沒寫過的題目
function newDaily(base,n=15){
  const all=p5Ids(base),wr=shuffle(all.filter(isWrong)).slice(0,3),un=shuffle(all.filter(id=>st.ans[id]===undefined));
  const rest=shuffle(all.filter(id=>st.ans[id]!==undefined&&!wr.includes(id)));
  const ids=shuffle([...new Set([...wr,...un,...rest])].slice(0,n));
  return {ids,ans:{},i:0,src:"daily",base:!!base,scope:"toeic",timed:true,limit:360,start:now(),title:base?"基礎每日 15 題":"每日 15 題"};
}
function fmtDur(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function timerText(){const p=st.pr;if(!p||!p.timed)return "";const el=(p.end||now())-p.start,left=p.limit*1000-el;
  if(p.end)return "用時 "+fmtDur(el);return left>=0?"剩餘 "+fmtDur(left):"超時 "+fmtDur(-left)}
setInterval(()=>{
  const p=st.pr;if(st.view!=="prac"||!p||!p.timed||p.end)return;
  const t=document.getElementById("timer");if(t)t.textContent=timerText();
  if(!p.warned&&now()-p.start>=p.limit*1000){p.warned=true;persist();showToast("6 分鐘到！可以繼續寫完，但記得檢討速度")}
},1000);
function poolIds(pool){const w=wrongIds(),f=flagIds();
  return pool==="wrong"?w:pool==="flag"?f:pool==="both"?[...new Set([...w,...f])]:scopeIds()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||!(app.contains(t)||topbar.contains(t)))return;
  const d=t.dataset,a=d.act;
  if(d.scope)st.scope=d.scope;
  const ex=findEx(st.exam);let scroll=null;
  switch(a){
    case"go":st.view=d.v;scroll=toTop;break;
    case"open":st.view="exam";st.exam=d.ex;st.scope=findEx(d.ex).kind==="toeic"?"toeic":"bigdata";scroll=toTop;break;
    case"goto":st.cur[st.exam]=+d.i;scroll=qTop;break;
    case"pgoto":st.pr.i=+d.i;scroll=qTop;break;
    case"pick":if(st.view==="prac"){st.pr.ans[d.id]=+d.k;if(!st.pr.end&&st.pr.ids.every(x=>st.pr.ans[x]!==undefined))st.pr.end=now()}else setAns(d.id,+d.k);break;
    case"optFirst":st.optFirst=!st.optFirst;break;
    case"flag":toggleFlag(d.id);break;
    case"copy":copyQuestion(d.id);return;
    case"daily":st.pr=newDaily(!!d.base);st.scope="toeic";st.view="prac";scroll=toTop;break;
    case"pstartAgain":{
      const p=st.pr||{};let ids=[];
      if(p.src==="pset"){st.scope=p.scope;ids=shuffle([...poolIds(p.pool)]).slice(0,p.n);
        if(!ids.length){st.view="pset";scroll=toTop;break}}
      else{st.pr=newDaily(p.base);st.view="prac";scroll=toTop;break}
      st.pr={...p,ids,ans:{},i:0};st.view="prac";scroll=toTop;break;
    }
    case"prev":if(st.view==="prac")st.pr.i--;else st.cur[st.exam]=(st.cur[st.exam]||0)-1;scroll=qTop;break;
    case"next":if(st.view==="prac")st.pr.i++;else st.cur[st.exam]=(st.cur[st.exam]||0)+1;scroll=qTop;break;
    case"report":st.view="report";scroll=toTop;break;
    case"pset":st.view="pset";scroll=toTop;break;
    case"presume":st.view="prac";scroll=toTop;break;
    case"pnum":{const inp=document.getElementById("pcount");inp.value=d.n==="999"?scopeIds().length:d.n;return}
    case"pstart":{
      const pool=(app.querySelector('input[name="pool"]:checked')||{}).value;
      const ids=pool?poolIds(pool):[];
      const n=parseInt(document.getElementById("pcount").value,10);
      if(!ids.length){document.getElementById("pmsg").textContent="這個範圍目前沒有題目。";return}
      if(!(n>0)){document.getElementById("pmsg").textContent="請輸入 1 以上的題數。";return}
      st.pr={ids:shuffle([...ids]).slice(0,n),ans:{},i:0,src:"pset",pool,n,scope:st.scope};st.view="prac";scroll=toTop;break}
    case"jump":{const {ex:x,i}=QM[d.id];st.view="exam";st.exam=x.id;st.cur[x.id]=i;scroll=toTop;break}
    case"nextWrong":{const c=st.cur[ex.id]||0,n=ex.qs.length;let f=-1;
      for(let s=1;s<=n;s++){const i=(c+s)%n;if(isWrong(ex.id+"-"+i)){f=i;break}}
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=qTop;break}
    case"retryWrong":{let f=-1;ex.qs.forEach((q,i)=>{const id=ex.id+"-"+i;if(isWrong(id)){delAns(id);if(f<0)f=i}});
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=toTop;break}
    case"theme":applyTheme(d.v);renderTopbar();return;
    case"jumpblank":{const el=document.getElementById("blank-"+d.n),pl=document.getElementById("paneL");
      if(el&&pl){pl.scrollTop+=el.getBoundingClientRect().top-pl.getBoundingClientRect().top-pl.clientHeight/3;el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1200)}return}
    case"jumpq":{const el=document.getElementById("rq-"+d.n),pr=document.getElementById("paneR");
      if(el&&pr){pr.scrollTop+=el.getBoundingClientRect().top-pr.getBoundingClientRect().top-8}return}
    case"p7pick":if(!st.p7d||typeof st.p7d!=="object")st.p7d={};st.p7d[d.id]=+d.k;persist();render();return;
    case"p7set":{if(+d.i<0)return;st.cur[st.exam]=+d.i;save();render();window.scrollTo(0,0);
      const l=document.getElementById("paneL"),r=document.getElementById("paneR");if(l)l.scrollTop=0;if(r)r.scrollTop=0;return}
    case"p7submit":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(set.idx.some(i=>st.ans[ex.id+"-"+i]===undefined&&(st.p7d||{})[ex.id+"-"+i]===undefined))return;
      set.idx.forEach(i=>{const id=ex.id+"-"+i;if(st.ans[id]===undefined)setAns(id,st.p7d[id]);delete st.p7d[id]});
      p7ResetR=true;save();render();const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"p7redo":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(!confirm("清除這個題組的作答，重新作答？"))return;
      set.idx.forEach(i=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});p7ResetR=true;save();render();
      const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"resetExam":if(!confirm(`確定清除「${ex.title}」的作答紀錄？標註會保留。`))return;
      ex.qs.forEach((q,i)=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});st.cur[ex.id]=0;scroll=toTop;break;
    case"syncConnect":{
      const v=((document.getElementById("tok")||{}).value||"").trim();
      if(!v){showToast("請先貼上 Token");return}
      Sync.cfg={token:v,gistId:"",last:0};Sync.saveCfg();Sync.msg="";
      render();
      Sync.run().then(()=>{if(Sync.state==="ok")showToast("已連線並完成同步")});
      return;
    }
    case"syncNow":Sync.run().then(()=>{if(Sync.state==="ok")showToast("同步完成")});return;
    case"syncOff":if(!confirm("停用這台裝置的同步？本機與雲端紀錄都會保留。"))return;
      clearTimeout(Sync.timer);Sync.timer=null;Sync.cfg={token:"",gistId:"",last:0};Sync.saveCfg();Sync.state="off";Sync.msg="";break;
    case"exportData":{
      const code=JSON.stringify(payload());
      const ta=document.getElementById("bk");if(ta)ta.value=code;
      copyText(code,()=>showToast("備份碼已複製"));
      document.getElementById("bkmsg").textContent=`共 ${Object.keys(st.ans).length} 筆作答紀錄。`;
      return;
    }
    case"importData":{
      const msg=document.getElementById("bkmsg");
      let o;try{o=JSON.parse((document.getElementById("bk").value||"").trim())}catch(err){msg.textContent="備份碼格式不正確。";return}
      if(!o||typeof o.ans!=="object"){msg.textContent="這不是本系統的備份碼。";return}
      const before=Object.keys(st.ans).length;
      mergeRemote(o);persist();Sync.schedule(500);
      showToast(`匯入完成（${before} → ${Object.keys(st.ans).length} 筆）`);
      render();return;
    }
  }
  save();render();if(scroll)scroll();
});

// 記住資料夾與答案卡的展開狀態
document.addEventListener("toggle",e=>{
  const el=e.target;if(!el||!el.classList)return;
  if(el.classList.contains("folder")){st.open[el.dataset.key]=el.open;persist()}
  else if(el.classList.contains("sheet")){st.sheetOpen=el.open;persist()}
},true);

document.addEventListener("visibilitychange",()=>{
  if(!Sync.on())return;
  if(document.visibilityState==="visible")Sync.run();else Sync.flush();
});
window.addEventListener("pagehide",()=>Sync.flush());
window.addEventListener("online",()=>{if(Sync.on())Sync.run()});
setInterval(()=>{if(Sync.on()&&document.visibilityState==="visible"&&!Sync.timer&&!Sync.busy)Sync.run()},120000);

Sync.loadCfg();
load();prevCur={...st.cur};
render();
if(location.protocol.startsWith("http")){
  fetch("toeic_part7.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d)return;
    applyPart7Data(d);
    ALL.length=0;ALL.push(...TOEIC_EXAMS,...PAST,...EXAMS);
    ALL.forEach(ex=>ex.qs.forEach((q,i)=>{QM[ex.id+"-"+i]={ex,i,q}}));
    render();
  }).catch(()=>{});
}
if(Sync.on())Sync.run();

</script>
