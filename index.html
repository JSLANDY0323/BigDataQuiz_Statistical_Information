: 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "所有工廠員工都必須參加安全訓練。", "e": "線索：for all factory workers ＋ safety training → 強制的 mandatory。", "w": "(B)(D) 選擇性的、自願的，與 all workers 必須參加的語境不合；(A) 偶爾的。"}, {"g": "t_p5vocab", "q": "The company plans to _______ its operations into three new countries next year.", "o": ["resign", "retire", "reduce", "expand"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "公司計畫明年將業務擴展到三個新國家。", "e": "線索：into three new countries → 擴展 expand。", "w": "(C) 縮減與 into new countries 矛盾；(A)(B) 辭職、退休，主詞是人。"}, {"g": "t_p5vocab", "q": "Ms. Torres was asked to _______ the new employees during their first week.", "o": ["invest", "supervise", "resign", "apply"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Torres 女士被要求在新進員工的第一週督導他們。", "e": "線索：受詞 the new employees ＋ during their first week → 督導 supervise。", "w": "(C) 辭職，不及物；(D) apply for；(A) invest in。"}, {"g": "t_p5vocab", "q": "The new software will _______ employees to work from any location.", "o": ["enable", "suggest", "inform", "prevent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新軟體將讓員工可以在任何地點工作。", "e": "線索：enable sb to V（使能夠）。語意正面：work from any location。", "w": "(D) prevent sb from V-ing，且語意相反；(B) suggest 不接 sb to V；(C) inform sb of。"}, {"g": "t_p5vocab", "q": "Customers can _______ their membership online at any time.", "o": ["repair", "refund", "renew", "refer"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "顧客可以隨時在網路上續訂會員。", "e": "線索：membership（會員資格）→ 續訂 renew。", "w": "(B) 退款；(A) 修理；(D) 提及，都不搭 membership。"}, {"g": "t_p5vocab", "q": "The factory's production has _______ significantly since new machines were installed.", "o": ["grown up", "lifted", "raised", "increased"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "自從安裝新機器以來，工廠產量大幅增加。", "e": "線索：空格後沒有受詞（significantly 是副詞）→ 需要不及物動詞 increased。", "w": "(B)(C) raise／lift 是及物動詞，後面要有受詞；(A) grow up 指人長大。"}, {"g": "t_p5vocab", "q": "We apologize for the _______ caused by the temporary closure of the parking lot.", "o": ["inconvenience", "appreciation", "entertainment", "convenience"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "停車場暫時關閉造成不便，我們深表歉意。", "e": "線索：apologize for ＋ 負面事情 → inconvenience（不便）。", "w": "(D) 方便，語意相反；(C) 娛樂；(B) 感謝。"}]}, {"id": "p5_vocab_2", "kind": "toeic", "part": 5, "stage": 3, "title": "單字語意題 2", "sub": "四個選項詞性相同 → 找句中的線索字判斷語意", "qs": [{"g": "t_p5vocab", "q": "The CEO will _______ the opening ceremony of the new factory.", "o": ["participate", "attend", "appear", "join in"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "執行長將出席新工廠的開幕典禮。", "e": "線索：空格後直接接受詞 the opening ceremony → 及物動詞 attend。", "w": "(A) participate 要加 in；(D) join in 多用於加入活動，不用於出席典禮；(C) appear 不及物。"}, {"g": "t_p5vocab", "q": "The two companies decided to _______ in order to compete with larger rivals.", "o": ["divide", "resign", "merge", "decline"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "兩家公司決定合併，以便與更大的對手競爭。", "e": "線索：two companies ＋ compete with larger rivals → 合併 merge。", "w": "(A) 分開，語意相反；(B) 辭職；(D) 下降、婉拒。"}, {"g": "t_p5vocab", "q": "All staff must _______ their identification badges at all times while in the building.", "o": ["wear", "put", "dress", "carry on"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "在大樓內所有員工都必須隨時配戴識別證。", "e": "線索：badge（證件）的搭配動詞 → wear（配戴）。", "w": "(C) dress 的受詞是人；(B) put 要搭 on；(D) carry on 是「繼續」。"}, {"g": "t_p5vocab", "q": "The project was completed ahead of schedule and _______ budget.", "o": ["below", "under", "down", "beneath"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "專案提前完成，而且沒有超出預算。", "e": "線索：固定說法 under budget（低於預算）／over budget（超出預算）。", "w": "(A)(C)(D) 不與 budget 構成這個慣用說法。"}, {"g": "t_p5vocab", "q": "Mr. Patel has an _______ knowledge of international tax law.", "o": ["expected", "exhausted", "expensive", "extensive"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Patel 先生對國際稅法有廣泛的知識。", "e": "線索：knowledge 搭配 extensive（廣泛的、豐富的）。", "w": "(C) 昂貴的；(A) 預期的；(B) 筋疲力盡的，都不形容知識。"}, {"g": "t_p5vocab", "q": "The store manager _______ that all products are displayed neatly.", "o": ["insures", "reassures", "ensures", "assures"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "店長確保所有商品都陳列整齊。", "e": "線索：___ that ＋ 子句，語意「確保（某事發生）」→ ensure。", "w": "(D) assure 後通常接人（assure sb that）；(A) insure 投保；(B) reassure 安撫某人。"}, {"g": "t_p5vocab", "q": "The airline will _______ passengers for any lost luggage.", "o": ["compensate", "compete", "comply", "complain"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "航空公司會賠償旅客遺失的行李。", "e": "線索：compensate sb for sth（因某事賠償某人）。", "w": "(D) complain about；(B) compete with；(C) comply with，語意都不合。"}, {"g": "t_p5vocab", "q": "Before signing the agreement, please read the terms and _______ carefully.", "o": ["positions", "directions", "locations", "conditions"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "簽署協議前，請仔細閱讀條款與條件。", "e": "線索：固定搭配 terms and conditions（條款與細則）。", "w": "(A) 職位；(B) 方向、指示；(C) 地點。"}, {"g": "t_p5vocab", "q": "The research team will _______ a survey to find out what customers want.", "o": ["perform", "conduct", "make", "hold"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "研究團隊將進行一項調查，了解顧客需求。", "e": "線索：conduct a survey（進行調查）是固定搭配。", "w": "(A) perform 搭 task／operation；(D) hold 搭 meeting／event；(C) make a survey 不是慣用說法。"}, {"g": "t_p5vocab", "q": "Our sales representatives will _______ you with detailed information about the product.", "o": ["offer", "provide", "supply to", "give"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的業務代表會提供您產品的詳細資訊。", "e": "線索：___ ＋ 人 ＋ with ＋ 物 → provide sb with sth。", "w": "(A)(D) offer／give 用 offer sb sth（不加 with）；(C) supply to 後接人時不加 with。"}, {"g": "t_p5vocab", "q": "The new branch will _______ about 50 new jobs in the area.", "o": ["create", "generate up", "discover", "invent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新分店將在當地創造約 50 個工作機會。", "e": "線索：create jobs（創造工作機會）。", "w": "(D) 發明；(C) 發現；(B) generate up 不是正確片語（generate 本身可用，但不加 up）。"}, {"g": "t_p5vocab", "q": "Due to high demand, the product is temporarily out of _______.", "o": ["service", "order", "stock", "date"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於需求量大，該產品暫時缺貨。", "e": "線索：due to high demand → out of stock（缺貨）。", "w": "(B) out of order 故障；(A) out of service 停止服務；(D) out of date 過時。"}, {"g": "t_p5vocab", "q": "The museum's new exhibit has _______ thousands of visitors since it opened.", "o": ["appeared", "arrived", "attended", "attracted"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "博物館的新展覽自開幕以來已吸引數千名遊客。", "e": "線索：主詞是展覽，受詞是 visitors → 吸引 attract。", "w": "(C) attend 主詞要是人；(A)(B) 不及物，不能接受詞。"}, {"g": "t_p5vocab", "q": "Ms. Kim was _______ to the position of regional director last month.", "o": ["applied", "appealed", "appointed", "approved"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "金女士上個月被任命為區域總監。", "e": "線索：be appointed to ＋ 職位（被任命）。", "w": "(A) apply for 應徵（主動）；(D) approve 批准（受詞多為事物）；(B) appeal 呼籲、上訴。"}, {"g": "t_p5vocab", "q": "Visitors are asked to _______ from using flash photography in the gallery.", "o": ["prohibit", "refrain", "prevent", "avoid"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請參觀者在展廳內避免使用閃光燈拍照。", "e": "線索：___ from ＋ V-ing，主詞是要克制自己的人 → refrain from。", "w": "(A)(C) prohibit／prevent sb from V-ing，中間要有受詞；(D) avoid 直接接 V-ing，不加 from。"}]}, {"id": "p5_vocab_3", "kind": "toeic", "part": 5, "stage": 3, "title": "單字語意題 3", "sub": "四個選項詞性相同 → 找句中的線索字判斷語意", "qs": [{"g": "t_p5vocab", "q": "The hotel is _______ located in the city center, close to shops and restaurants.", "o": ["consequently", "conveniently", "considerably", "constantly"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "飯店位於市中心，交通便利，鄰近商店與餐廳。", "e": "線索：close to shops and restaurants（靠近商店餐廳）→ 位置「方便地」conveniently located。", "w": "(A) 因此；(C) 相當地；(D) 不斷地，都不修飾 located 的位置。"}, {"g": "t_p5vocab", "q": "Please _______ the attached invoice and let us know if you have any questions.", "o": ["review", "remind", "remove", "reply"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請查看附上的發票，如有任何問題請告訴我們。", "e": "線索：attached invoice ＋ if you have any questions → 先「查看」review。", "w": "(B) remind 的受詞是人；(C) 移除，語意不合；(D) reply 不及物，要加 to。"}, {"g": "t_p5vocab", "q": "Due to rising fuel costs, the airline will _______ its ticket prices.", "o": ["delay", "prevent", "decrease", "increase"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於燃料成本上升，航空公司將調漲票價。", "e": "線索：Due to rising fuel costs（成本上升）→ 票價「提高」increase。", "w": "(C) 降低，與成本上升矛盾；(B) 防止；(A) 延遲，都不合邏輯。"}, {"g": "t_p5vocab", "q": "The museum is _______ to the public free of charge on Sundays.", "o": ["closed", "known", "open", "hidden"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "博物館週日免費對外開放。", "e": "線索：free of charge（免費）＋ to the public → open to the public（對外開放）。", "w": "(A) 關閉時不會說免費；(D) 隱藏的；(B) known to 表為…所知，語意不合。"}, {"g": "t_p5vocab", "q": "Our _______ goal is to provide excellent service to every customer.", "o": ["former", "previous", "temporary", "primary"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的首要目標是為每位顧客提供卓越服務。", "e": "線索：goal ＋ 現在式的承諾 → 主要的 primary。", "w": "(A)(B) 先前的、前任的，與現在式 is 不合；(C) 暫時的，不適合形容核心目標。"}, {"g": "t_p5vocab", "q": "The company had to _______ 50 workers because of declining sales.", "o": ["set up", "lay off", "bring in", "take on"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "因為銷售下滑，公司不得不裁員 50 人。", "e": "線索：because of declining sales（銷售下滑）→ 裁員 lay off。", "w": "(C)(D) 招募、引進，與銷售下滑矛盾；(A) 設立，受詞不會是員工。"}, {"g": "t_p5vocab", "q": "Mr. Shaw will _______ the sales team while the manager is on vacation.", "o": ["overlook", "overcome", "oversee", "overhear"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "經理休假期間，Shaw 先生將監督業務團隊。", "e": "線索：while the manager is on vacation → 代為「監督」oversee。", "w": "(A) overlook 忽略、俯瞰；(B) 克服；(D) 無意中聽到。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The report _______ that sales will rise by 5 percent next year.", "o": ["predicts", "prepares", "prevents", "protects"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "報告預測明年銷售將成長 5%。", "e": "線索：that ＋ will rise next year（未來）→ 預測 predicts。", "w": "(C) 防止；(B) 準備；(D) 保護，都不接 that 子句表未來。"}, {"g": "t_p5vocab", "q": "The seminar provides a great _______ to network with industry leaders.", "o": ["operation", "occupation", "opportunity", "obligation"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這場研討會提供了與業界領袖交流的好機會。", "e": "線索：a great ___ to network（建立人脈）→ 機會 opportunity。", "w": "(B) 職業；(D) 義務；(A) 運作、手術，與 great … to network 不合。"}, {"g": "t_p5vocab", "q": "The office printer is out of _______; please use the one on the second floor.", "o": ["order", "reach", "date", "stock"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "辦公室印表機故障了，請使用二樓那台。", "e": "線索：please use the one on the second floor（改用別台）→ out of order（故障）。", "w": "(D) 缺貨；(C) 過時；(B) 搆不到，都不符合「改用別台」。"}, {"g": "t_p5vocab", "q": "Applicants must have at least three years of _______ experience in sales.", "o": ["relative", "relevant", "reluctant", "remote"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "應徵者必須具備至少三年的相關業務經驗。", "e": "線索：experience in sales → 相關的 relevant experience。", "w": "(A) 相對的；(C) 不情願的；(D) 遙遠的。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The CEO _______ the employees for their hard work during the busy season.", "o": ["approved", "complained", "apologized", "thanked"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "執行長感謝員工在旺季的辛勞。", "e": "線索：for their hard work（正面）＋ 受詞是人 → thank sb for sth。", "w": "(B)(C) 不及物，要加 to／about；(A) approve 的受詞多為事物（計畫、預算）。"}, {"g": "t_p5vocab", "q": "The flight was _______ due to heavy fog, so passengers had to stay overnight.", "o": ["booked", "boarded", "canceled", "landed"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "班機因濃霧取消，旅客只好留宿一晚。", "e": "線索：due to heavy fog ＋ had to stay overnight → 取消 canceled。", "w": "(B) 登機；(D) 降落；(A) 預訂，都不會導致必須過夜。"}, {"g": "t_p5vocab", "q": "To _______ for a refund, customers must present the original receipt.", "o": ["qualify", "quantify", "quality", "qualification"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "顧客必須出示原始收據才符合退款資格。", "e": "線索：To ＋ 原形 V ＋ for a refund → qualify for（符合…資格）。", "w": "(B) 量化，形近字；(C)(D) 名詞，不能接在 to 後當動詞。"}, {"g": "t_p5vocab", "q": "The new branch has been very _______, earning a profit in its first year.", "o": ["possible", "portable", "probable", "profitable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新分店非常賺錢，第一年就獲利。", "e": "線索：earning a profit → 有獲利的 profitable。", "w": "(B) 可攜帶的；(C) 很可能的；(A) 可能的。形近字陷阱。"}]}, {"id": "p5_vocab_4", "kind": "toeic", "part": 5, "stage": 3, "title": "單字語意題 4", "sub": "四個選項詞性相同 → 找句中的線索字判斷語意", "qs": [{"g": "t_p5vocab", "q": "To save money, the manager asked us to _______ our expenses by 10 percent.", "o": ["raise", "cut", "spend", "earn"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "為了省錢，經理要求我們把開支削減 10%。", "e": "線索：To save money → 削減開支 cut。", "w": "(A) 提高，與省錢矛盾；(C) 花費；(D) 賺取，受詞不會是 expenses。"}, {"g": "t_p5vocab", "q": "The store will be closed _______ for renovations and will reopen next month.", "o": ["permanently", "previously", "temporarily", "frequently"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "商店將暫時停業整修，下個月重新開幕。", "e": "線索：will reopen next month → 暫時地 temporarily。", "w": "(A) 永久地，與重新開幕矛盾；(D) 頻繁地；(B) 先前地。"}, {"g": "t_p5vocab", "q": "Ms. Lopez was _______ for her outstanding contribution to the project.", "o": ["reminded", "recognized", "replaced", "required"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Lopez 女士因對專案的傑出貢獻而獲得表揚。", "e": "線索：for her outstanding contribution（正面）→ 表揚、肯定 recognized。", "w": "(C) 被取代；(D) 被要求；(A) 被提醒，與傑出貢獻不合。"}, {"g": "t_p5vocab", "q": "Customers who are not satisfied may _______ the product within 30 days for a full refund.", "o": ["remain", "repair", "replace", "return"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "不滿意的顧客可在 30 天內退貨並獲得全額退款。", "e": "線索：for a full refund（全額退款）→ 退回 return。", "w": "(B) 修理；(C) 更換不會拿到退款；(A) 不及物。"}, {"g": "t_p5vocab", "q": "The new policy aims to _______ waste and save energy.", "o": ["reduce", "induce", "produce", "introduce"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新政策旨在減少浪費並節約能源。", "e": "線索：and save energy（環保方向）→ 減少浪費 reduce。", "w": "(C) 製造；(B) 引起；(D) 引進。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The job requires _______ travel to Asia and Europe.", "o": ["frequent", "frequency", "rare", "fluent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這份工作需要經常前往亞洲和歐洲出差。", "e": "線索：requires ＋ ___ ＋ travel → 形容詞「經常的」frequent。", "w": "(C) 「很少的」與 requires 語意不合；(B) 名詞；(D) 流利的，只形容語言。"}, {"g": "t_p5vocab", "q": "The company is _______ for new ways to attract younger customers.", "o": ["seeking", "finding", "searching", "discovering"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "公司正在尋找吸引年輕顧客的新方法。", "e": "線索：空格後是 for → search for（尋找）。", "w": "find、seek、discover 都是及物動詞，直接接受詞，不加 for。"}, {"g": "t_p5vocab", "q": "All employees must _______ the building immediately when the fire alarm sounds.", "o": ["elevate", "evacuate", "eliminate", "evaluate"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "火警警報響起時，所有員工必須立即撤離大樓。", "e": "線索：when the fire alarm sounds → 撤離 evacuate。", "w": "(D) 評估；(C) 消除；(A) 提升。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The conference will _______ experts from more than 20 countries.", "o": ["refer", "consist", "belong", "feature"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這場會議將邀請來自 20 多國的專家。", "e": "線索：空格後直接接受詞 experts → 及物動詞 feature（以…為特色、邀請演出）。", "w": "(A) refer to；(C) belong to；(B) consist of，都不能直接接受詞。"}, {"g": "t_p5vocab", "q": "Due to a technical problem, the website will be _______ for two hours tonight.", "o": ["unavailable", "unemployed", "unbelievable", "uncertain"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於技術問題，網站今晚將暫停服務兩小時。", "e": "線索：Due to a technical problem ＋ for two hours → 無法使用 unavailable。", "w": "(C) 難以置信的；(B) 失業的（形容人）；(D) 不確定的。"}, {"g": "t_p5vocab", "q": "The supervisor gave _______ instructions so that everyone understood the task.", "o": ["close", "clear", "clever", "clean"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "主管給了清楚的指示，讓每個人都了解任務。", "e": "線索：so that everyone understood → 清楚的 clear。", "w": "(D) 乾淨的；(A) 接近的；(C) 聰明的。形近字陷阱。"}, {"g": "t_p5vocab", "q": "We are pleased to _______ you that your application has been approved.", "o": ["explain", "say", "inform", "announce"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們很高興通知您，您的申請已獲核准。", "e": "線索：___ ＋ 人（you）＋ that 子句 → inform sb that。", "w": "announce、explain、say 都不能直接接「人」再接 that（要用 announce／explain／say to sb）。"}, {"g": "t_p5vocab", "q": "The new shopping mall is expected to _______ thousands of shoppers each weekend.", "o": ["deliver", "direct", "drawn", "draw"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新購物中心預計每個週末會吸引數千名購物者。", "e": "線索：受詞是 shoppers → 吸引 draw（＝attract）。", "w": "(C) p.p.，不能接在 to 後；(B) 指引；(A) 遞送，語意不合。"}, {"g": "t_p5vocab", "q": "The meeting has been _______ from Monday to Wednesday.", "o": ["improved", "moved", "proved", "removed"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "會議已從週一改到週三。", "e": "線索：from Monday to Wednesday → 改期 moved。", "w": "(D) 移除；(C) 證明；(A) 改善。形近字陷阱。"}, {"g": "t_p5vocab", "q": "Ms. Grant is a _______ employee who always finishes her work on time.", "o": ["dependent", "depending", "dependence", "dependable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Grant 女士是一位可靠的員工，總是準時完成工作。", "e": "線索：always finishes her work on time → 可靠的 dependable。", "w": "(A) dependent 是「依賴別人的」，語意相反；(B) V-ing；(C) 名詞。"}]}, {"id": "p5_qty", "kind": "toeic", "part": 5, "stage": 4, "title": "數量詞與可數／不可數", "sub": "many／few／fewer＋可數；much／little／less＋不可數；information、equipment、advice 不可數", "qs": [{"g": "t_p5qty", "q": "There is _______ information available about the new tax regulations.", "o": ["many", "few", "little", "a few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "關於新稅法的資訊很少。", "e": "訊號：information 是不可數名詞，且動詞用 is → 只能用修飾不可數的 little（幾乎沒有）。", "w": "(A)(B)(D) few／a few／many 都只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "The store sold _______ laptops this month than it did last month.", "o": ["much", "fewer", "less", "little"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "這家店本月賣出的筆電比上個月少。", "e": "訊號：laptops 是可數複數，後面有 than → 可數名詞的比較級用 fewer。", "w": "(C) less 用於不可數名詞；(A)(D) 修飾不可數，且不是比較級。"}, {"g": "t_p5qty", "q": "Our office needs _______ new equipment to handle the increased workload.", "o": ["a few", "several", "many", "some"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "我們辦公室需要一些新設備來應付增加的工作量。", "e": "訊號：equipment 是不可數名詞（不能加 s）→ some 可修飾不可數名詞。", "w": "(A)(B)(C) several／many／a few 只修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Only a _______ seats are still available for tonight's performance.", "o": ["few", "much", "less", "little"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "今晚的演出只剩下少數幾個座位。", "e": "訊號：seats 是可數複數，動詞 are → a few（還有一些）。only a few 是常見組合。", "w": "(B)(C)(D) 只能修飾不可數名詞。"}, {"g": "t_p5qty", "q": "How _______ time will it take to install the new software?", "o": ["much", "few", "many", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "安裝新軟體需要多少時間？", "e": "訊號：time 表「時間」時是不可數 → how much。", "w": "(B)(C)(D) 修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "_______ of the applicants had previous experience in sales.", "o": ["Much", "Little", "Every", "Many"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "許多應徵者過去有業務經驗。", "e": "訊號：of the applicants（可數複數）→ many of。", "w": "(A)(B) 用於不可數；(C) every 不能接 of，只能接單數名詞（every applicant）。"}, {"g": "t_p5qty", "q": "The manager gave us _______ advice on how to improve our presentation.", "o": ["several", "many", "some", "a few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "經理給了我們一些改善簡報的建議。", "e": "訊號：advice 是不可數名詞（沒有 advices）→ some。", "w": "(A)(B)(D) 只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Because of the holiday, there were _______ customers in the store than usual.", "o": ["little", "fewer", "less", "much"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "因為放假，店裡的顧客比平常少。", "e": "訊號：customers 可數複數＋than → fewer。", "w": "(C) less 修飾不可數；(A)(D) 不是比較級且用於不可數。"}, {"g": "t_p5qty", "q": "The new printer uses _______ energy than the old model.", "o": ["many", "fewer", "less", "few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "新印表機比舊機型更省電。", "e": "訊號：energy 是不可數＋than → less。", "w": "(B) fewer 用於可數複數；(A)(D) 不是比較級。"}, {"g": "t_p5qty", "q": "_______ furniture in the lobby will be replaced next week.", "o": ["Several", "Many", "Each", "All"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "大廳所有家具將於下週更換。", "e": "訊號：furniture 是不可數名詞 → all 可修飾不可數（all furniture）。", "w": "(A)(B) 只修飾可數複數；(C) each 只接可數單數。"}, {"g": "t_p5qty", "q": "A large _______ of money was spent on the advertising campaign.", "o": ["few", "amount", "many", "number"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "這次廣告活動花了一大筆錢。", "e": "訊號：money 不可數 → a large amount of。", "w": "(D) a number of 接可數複數；(A)(C) 不能放在 a large ＿ of 中。"}, {"g": "t_p5qty", "q": "A large _______ of employees signed up for the training program.", "o": ["number", "much", "amount", "deal"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "大量員工報名參加了訓練課程。", "e": "訊號：employees 可數複數 → a large number of。", "w": "(C)(D) amount of／a great deal of 接不可數；(B) much 不能這樣用。"}, {"g": "t_p5qty", "q": "There is still _______ room for improvement in our customer service.", "o": ["several", "much", "a few", "many"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "我們的客服仍有很大的改進空間。", "e": "訊號：room 表「空間、餘地」時是不可數 → much room for improvement。", "w": "(A)(C)(D) 只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Ms. Brooks has _______ experience in project management, so she needs some training.", "o": ["many", "a few", "few", "little"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "Brooks 女士幾乎沒有專案管理經驗，所以需要一些訓練。", "e": "訊號：experience 表「經驗（累積）」時是不可數；後面 so she needs training 表負面 → little（幾乎沒有）。", "w": "(A)(B)(C) 修飾可數複數；而且 a little 表「有一些」，與後半句語意不合。"}, {"g": "t_p5qty", "q": "We received _______ feedback from customers after the product launch.", "o": ["a lot of", "many", "a few", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "產品上市後，我們收到大量顧客回饋。", "e": "訊號：feedback 是不可數名詞 → a lot of（可數與不可數都能用）。", "w": "(B)(C)(D) 只修飾可數複數。"}, {"g": "t_p5qty", "q": "The company hired _______ new staff members last quarter.", "o": ["little", "much", "several", "a little"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "公司上一季聘用了幾位新員工。", "e": "訊號：staff members 是可數複數 → several。", "w": "(A)(B)(D) 只修飾不可數名詞。"}, {"g": "t_p5qty", "q": "Please pack your luggage carefully; _______ baggage over 23 kilograms will be charged extra.", "o": ["any", "many", "few", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "請謹慎打包；任何超過 23 公斤的行李都會額外收費。", "e": "訊號：baggage 是不可數名詞 → any 可修飾不可數（any baggage）。", "w": "(B)(C)(D) 只能修飾可數複數。"}, {"g": "t_p5qty", "q": "Very _______ people attended the seminar because of the heavy snow.", "o": ["much", "less", "few", "little"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "因為大雪，參加研討會的人很少。", "e": "訊號：people 是可數複數＋負面語意（because of heavy snow）→ few（很少、幾乎沒有）。", "w": "(A)(B)(D) 用於不可數名詞。"}, {"g": "t_p5qty", "q": "The research team collected a great _______ of data during the study.", "o": ["many", "number", "few", "deal"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "研究團隊在研究期間收集了大量資料。", "e": "訊號：data 在多益中常當不可數使用 → a great deal of。", "w": "(B) a great number of 接可數複數；(A)(C) 無法放在 a great ＿ of 結構中。"}, {"g": "t_p5qty", "q": "_______ of the information in the old report is outdated.", "o": ["Few", "Much", "Many", "Several"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "舊報告中的許多資訊都已經過時。", "e": "訊號：of the information（不可數）＋單數動詞 is → Much of。", "w": "(A)(C)(D) 只能用於可數複數，動詞也要用 are。"}]}, {"id": "p5_det", "kind": "toeic", "part": 5, "stage": 4, "title": "冠詞與限定詞", "sub": "each／every／either＋單數；all／both＋複數；an 看發音不看字母", "qs": [{"g": "t_p5det", "q": "_______ applicant must submit a résumé and two letters of reference.", "o": ["Both", "All", "Many", "Each"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "每位應徵者都必須繳交履歷和兩封推薦信。", "e": "訊號：applicant 是單數名詞，動詞 must submit → 選接單數可數名詞的 Each。", "w": "(B)(C) all／many 要接複數 applicants；(A) both 接兩個的複數名詞。"}, {"g": "t_p5det", "q": "_______ employees are required to attend the safety training.", "o": ["Either", "All", "Every", "Each"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "所有員工都必須參加安全訓練。", "e": "訊號：employees 是複數，動詞 are → All（接複數）。", "w": "(A)(C)(D) every／each／either 都接單數名詞。"}, {"g": "t_p5det", "q": "You may choose _______ option, as both offer the same benefits.", "o": ["all", "both", "either", "neither of"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "兩個方案你可以任選一個，因為兩者福利相同。", "e": "訊號：option 是單數，語意是「兩者任一」→ either ＋ 單數名詞。", "w": "(B) both 要接複數 options；(A) all 用於三者以上且接複數；(D) neither of 後面要接 the／所有格＋複數。"}, {"g": "t_p5det", "q": "_______ of the two candidates had the required certification, so the position remains open.", "o": ["Neither", "Both", "Either", "None"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "兩位候選人都沒有必要的證照，所以職缺仍懸而未決。", "e": "訊號：two candidates（兩者）＋後半句 position remains open 表示否定 → Neither of（兩者皆不）。", "w": "(C) Either 表任一，語意不合；(B) Both 表兩者都有，與結果矛盾；(D) None 用於三者以上。"}, {"g": "t_p5det", "q": "Mr. Wu has worked as _______ engineer at the company for ten years.", "o": ["an", "the", "any", "a"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "吳先生在這家公司擔任工程師已經十年。", "e": "訊號：單數可數名詞前要有冠詞；engineer 開頭是母音音素 /ɛ/ → an。", "w": "(D) a 用於子音音素開頭；(B) the 表特定的唯一工程師，語意不合；(C) any 不用於這個句型。"}, {"g": "t_p5det", "q": "The company plans to open _______ new branch in Kaohsiung next year.", "o": ["an", "a", "much", "the"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "公司計畫明年在高雄開一間新分店。", "e": "訊號：第一次提到、單數可數 → 不定冠詞；new 開頭是子音 /n/ → a。", "w": "(A) an 用於母音音素；(D) the 用於已知的特定事物；(C) much 修飾不可數。"}, {"g": "t_p5det", "q": "All participants will receive _______ certificate upon completion of the course.", "o": ["few", "an", "much", "a"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "所有學員完成課程後都會獲得一張證書。", "e": "訊號：certificate 是單數可數名詞，第一次提到，開頭是子音 /s/ → a。", "w": "(B) an 用於母音音素；(A)(C) 不修飾單數可數名詞。"}, {"g": "t_p5det", "q": "Ms. Park will be out of the office for _______ hour this afternoon.", "o": ["one of", "a", "an", "the"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "朴女士今天下午會離開辦公室一個小時。", "e": "訊號：hour 的 h 不發音，開頭是母音音素 /aʊ/ → an hour。", "w": "(B) 看字母不看發音的陷阱；(D) the hour 語意不合；(A) one of 要接 the＋複數。"}, {"g": "t_p5det", "q": "_______ manager in the company received a copy of the new policy.", "o": ["Several", "Many", "Every", "All"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "公司每位經理都收到了一份新政策。", "e": "訊號：manager 是單數 → Every（接單數可數名詞）。", "w": "(A)(B)(D) 都要接複數 managers。"}, {"g": "t_p5det", "q": "_______ the director nor her assistant was available to answer questions.", "o": ["Both", "Either", "Not only", "Neither"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "主任和她的助理都無法回答問題。", "e": "訊號：後面有 nor → 固定搭配 neither A nor B。", "w": "(B) either 配 or；(A) both 配 and；(C) not only 配 but also。"}, {"g": "t_p5det", "q": "Please return _______ keys to the front desk when you check out.", "o": ["the", "a", "every", "an"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "退房時請將鑰匙歸還櫃台。", "e": "訊號：keys 是複數，且指「你拿到的那些特定鑰匙」→ the。", "w": "(B)(D) a／an 不接複數；(C) every 接單數名詞。"}, {"g": "t_p5det", "q": "Each of the rooms _______ equipped with a projector and a whiteboard.", "o": ["being", "is", "be", "are"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "每個房間都配有一台投影機和一塊白板。", "e": "訊號：Each of ＋ 複數名詞，主詞是 Each（單數）→ 動詞用單數 is。", "w": "(D) 被 rooms 誤導；(A)(C) 不是真動詞的正確形式。"}, {"g": "t_p5det", "q": "Visitors can park on _______ side of the street after 6 P.M.", "o": ["all", "many", "either", "both"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "晚上六點後，訪客可以停在街道的任一側。", "e": "訊號：side 是單數 → either ＋ 單數（兩邊任一側）。", "w": "(D) both 要接 sides；(A)(B) all／many 要接複數。"}, {"g": "t_p5det", "q": "The hotel offers _______ free breakfast to all guests staying more than two nights.", "o": ["few", "a", "an", "many"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "飯店為住宿超過兩晚的房客提供免費早餐。", "e": "訊號：breakfast 前有形容詞 free 修飾時常用 a（a free breakfast）；free 開頭是子音 → a。", "w": "(C) an 用於母音音素；(A)(D) 要接可數複數。"}, {"g": "t_p5det", "q": "_______ information on the website is updated every week.", "o": ["The", "Every", "A", "An"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "網站上的資訊每週更新。", "e": "訊號：information 是不可數，不能用 a／an／every；後面有 on the website 特定範圍 → The。", "w": "(C)(D) 不可數名詞不能用不定冠詞；(B) every 接可數單數。"}]}, {"id": "p5_indef", "kind": "toeic", "part": 5, "stage": 4, "title": "不定代名詞", "sub": "兩者：one…the other；不特定：another／others；確定範圍剩下全部：the others", "qs": [{"g": "t_p5indef", "q": "Some employees work remotely; _______ work on-site.", "o": ["another", "other", "others", "the other"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "有些員工遠端工作；其他人則在公司上班。", "e": "訊號：Some … ; ___ work → 空格自己當主詞（後面沒有名詞），且動詞 work 是複數 → others（＝other employees，不特定的其他人）。", "w": "(A) another 是單數；(B) other 是形容詞，後面要接名詞；(D) the other 指兩者中的另一個（單數）。"}, {"g": "t_p5indef", "q": "This printer is out of order. Could you bring me _______ one?", "o": ["other", "another", "others", "the others"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "這台印表機故障了，可以幫我拿另一台嗎？", "e": "訊號：one 是單數，表示「再一個、另一個（不特定）」→ another。", "w": "(A) other 接單數可數名詞前通常要加 the 或 any；(C)(D) 是複數代名詞，後面不接 one。"}, {"g": "t_p5indef", "q": "Of the two proposals, one was accepted and _______ was rejected.", "o": ["the other", "others", "other", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "兩份提案中，一份被接受，另一份被拒絕。", "e": "訊號：two（兩者）→ one … the other。", "w": "(D) another 用於三者以上中的「另一個」；(C) other 不能單獨當主詞；(B) others 是複數。"}, {"g": "t_p5indef", "q": "Three candidates were interviewed. One was hired, and _______ were placed on a waiting list.", "o": ["another", "other", "the other", "the others"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "面試了三位候選人，一位被錄用，其餘的列入候補名單。", "e": "訊號：範圍確定（三人），扣掉一人後「剩下的全部」，動詞 were 是複數 → the others。", "w": "(C) the other 是單數；(A) another 單數；(B) other 是形容詞，要接名詞。"}, {"g": "t_p5indef", "q": "If this size does not fit, we can exchange it for a larger _______.", "o": ["it", "other", "one", "ones"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "如果這個尺寸不合，我們可以幫您換大一點的。", "e": "訊號：代替前面提過的單數可數名詞（size）且前面有形容詞 a larger → one。", "w": "(D) ones 是複數，不能接在 a 後面；(B) other 不能當名詞接在 a larger 後；(A) it 指同一個東西，不能被形容詞修飾。"}, {"g": "t_p5indef", "q": "The old chairs will be replaced with new _______.", "o": ["other", "ones", "another", "one"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "舊椅子將換成新的。", "e": "訊號：代替複數名詞 chairs，前面有形容詞 new → ones。", "w": "(D) one 代替單數；(A)(C) 不能被 new 修飾當名詞。"}, {"g": "t_p5indef", "q": "Ms. Chang is meeting with clients today; _______ team members are working on the report.", "o": ["other", "others", "the others", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "張女士今天與客戶會面；其他團隊成員正在撰寫報告。", "e": "訊號：空格後面接名詞 team members（複數）→ 形容詞 other。", "w": "(D) another 接單數名詞；(B)(C) others／the others 是代名詞，後面不能再接名詞。"}, {"g": "t_p5indef", "q": "The training will continue for _______ two weeks.", "o": ["others", "the others", "other", "another"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "訓練將再持續兩週。", "e": "訊號：another ＋ 數字 ＋ 複數名詞 ＝「再…」（another two weeks 視為一段時間整體）。", "w": "(C) other two weeks 不是慣用說法；(A)(B) 是代名詞，後面不能接名詞。"}, {"g": "t_p5indef", "q": "Please be considerate of _______ when using the shared kitchen.", "o": ["others", "the other", "other", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "使用共用廚房時請替別人著想。", "e": "訊號：介系詞 of 後面需要名詞（代名詞），空格後沒有名詞，泛指「別人」→ others。", "w": "(C) other 是形容詞，後面要接名詞；(B)(D) 是單數，語意不合「別人」。"}, {"g": "t_p5indef", "q": "The two departments help each _______ during busy periods.", "o": ["others", "another", "other", "one"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "兩個部門在忙碌時期會互相幫忙。", "e": "訊號：固定搭配 each other（互相）。", "w": "(D) each one 不表「互相」；(B) one another 才對，each another 錯；(A) each others 不存在。"}, {"g": "t_p5indef", "q": "We have two offices: one is in Taipei, and _______ is in Hsinchu.", "o": ["other", "another", "others", "the other"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "我們有兩間辦公室，一間在台北，另一間在新竹。", "e": "訊號：two → one … the other。", "w": "(B) another 暗示還有更多；(A) other 不能單獨當主詞；(C) others 是複數。"}, {"g": "t_p5indef", "q": "Some customers prefer to pay in cash, while _______ prefer credit cards.", "o": ["another", "others", "the other", "other"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "有些顧客偏好付現，另一些則偏好刷卡。", "e": "訊號：Some … while ___ prefer（複數動詞、後無名詞）→ others。", "w": "(A)(C) 是單數；(D) other 後面要接名詞。"}, {"g": "t_p5indef", "q": "If you have questions about the policy or any _______ matter, please contact HR.", "o": ["other", "the others", "another", "others"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "如果對政策或其他任何事項有疑問，請聯絡人資部。", "e": "訊號：any ＋ ___ ＋ 名詞 matter → 形容詞 other（any other ＋ 單數名詞 ＝ 其他任何…）。", "w": "(B)(D) 代名詞後不能接名詞；(C) any another 不合文法。"}, {"g": "t_p5indef", "q": "These brochures are outdated. Please order some new _______.", "o": ["one", "ones", "it", "them"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "這些手冊過時了，請訂一些新的。", "e": "訊號：代替複數 brochures，前面有 some new → ones。", "w": "(A) one 是單數，不能接在 some 後；(C)(D) it／them 不能被形容詞修飾。"}, {"g": "t_p5indef", "q": "Only one of the five printers is working; _______ need to be repaired.", "o": ["the other", "another", "other", "the others"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "五台印表機中只有一台正常；其餘的都需要維修。", "e": "訊號：確定範圍（五台）中「剩下的全部」＋複數動詞 need → the others。", "w": "(A)(B) 單數；(C) other 後要接名詞。"}]}, {"id": "p5_noun", "kind": "toeic", "part": 5, "stage": 4, "title": "人物名詞 vs 事物名詞", "sub": "applicant 人／application 事；attendee 人／attendance 事", "qs": [{"g": "t_p5noun", "q": "All _______ must bring a valid photo ID to the exam.", "o": ["applying", "applications", "applicants", "applied"], "a": 2, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "所有應考者都必須攜帶有效的附照片證件。", "e": "訊號：主詞要能「攜帶證件」→ 人。applicant（應徵者、申請人）是人；application 是「申請書」。", "w": "(B) 物，不會帶證件；(A)(D) 不是名詞主詞。"}, {"g": "t_p5noun", "q": "The number of _______ at this year's conference exceeded 2,000.", "o": ["attendees", "attends", "attendance", "attending"], "a": 0, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "今年會議的出席者超過 2,000 人。", "e": "訊號：the number of ＋ 可數複數名詞 → attendees（出席者，人，可數）。", "w": "(C) attendance（出席人數／出席率）是不可數，不搭 the number of；(B)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "Please send your _______ to the human resources department by Friday.", "o": ["applicable", "application", "applicant", "apply"], "a": 1, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "請在週五前把你的申請書寄到人資部。", "e": "訊號：所有格 your ＋ 名詞，且是「被寄送的東西」→ 物 application。", "w": "(C) applicant 是人，不能被寄送；(D) 動詞；(A) 形容詞。"}, {"g": "t_p5noun", "q": "Ms. Wang was promoted to _______ of the accounting team.", "o": ["supervisory", "supervision", "supervise", "supervisor"], "a": 3, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "王女士被升為會計團隊的主管。", "e": "訊號：be promoted to ＋ 職位（人）→ supervisor。", "w": "(B) supervision 是「監督」（事）；(C) 動詞；(A) 形容詞。"}, {"g": "t_p5noun", "q": "The new software requires close _______ during its first month of use.", "o": ["supervisor", "supervise", "supervision", "supervisors"], "a": 2, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "新軟體在使用的第一個月需要密切監督。", "e": "訊號：close ＋ 名詞，語意是「密切的監督」（行為、事）→ supervision。", "w": "(A)(D) 人，語意不合；(B) 動詞。"}, {"g": "t_p5noun", "q": "Our company has a strict policy regarding the _______ of client data.", "o": ["protector", "protect", "protective", "protection"], "a": 3, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "我們公司對客戶資料的保護有嚴格政策。", "e": "訊號：the ＋ 名詞 ＋ of client data，語意是「保護（行為）」→ protection。", "w": "(A) protector 是保護者（人或器具），語意不合；(C) 形容詞；(B) 動詞。"}, {"g": "t_p5noun", "q": "Each _______ will receive a welcome package on the first day.", "o": ["participant", "participation", "participatory", "participate"], "a": 0, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "每位參加者在第一天都會收到一份歡迎禮包。", "e": "訊號：Each ＋ 單數可數名詞，且能「收到禮包」→ 人 participant。", "w": "(B) participation 是「參與」（事，不可數）；(D) 動詞；(C) 形容詞。"}, {"g": "t_p5noun", "q": "Thank you for your _______ in the customer survey.", "o": ["participant", "participation", "participate", "participated"], "a": 1, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "感謝您參與顧客調查。", "e": "訊號：your ＋ 名詞 ＋ in，語意是「參與這件事」→ participation。", "w": "(A) participant 是人，thank you for your participant 語意不通；(C)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "Mr. Silva is a leading _______ in renewable energy.", "o": ["consulting", "consultation", "consultant", "consult"], "a": 2, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "Silva 先生是再生能源領域頂尖的顧問。", "e": "訊號：主詞 Mr. Silva 是人 → a leading ＋ 人 → consultant。", "w": "(B) consultation 是「諮詢」（事）；(D) 動詞；(A) consulting 作名詞是「顧問業」，不能指人。"}, {"g": "t_p5noun", "q": "The museum's _______ increased by 15 percent after the renovation.", "o": ["attendants", "attendance", "attendees", "attending"], "a": 1, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "整修後，博物館的參觀人數增加了 15%。", "e": "訊號：主詞 ＋ increased by 15 percent → 可以「增加百分比」的是人數（不可數）→ attendance，動詞 increased 也符合單數主詞。", "w": "(C) attendees 是個別的人，不用「增加 15%」形容；(A) attendants 是服務人員；(D) 不是名詞。"}, {"g": "t_p5noun", "q": "All _______ are required to wear safety helmets in the factory.", "o": ["visitors", "visits", "visiting", "visited"], "a": 0, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "所有訪客在工廠內都必須戴安全帽。", "e": "訊號：要「戴安全帽」的主詞 → 人 visitors。", "w": "(B) visits 是造訪（事）；(C)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "The _______ of the new factory will take about two years.", "o": ["constructor", "construct", "constructive", "construction"], "a": 3, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "新工廠的建造大約需要兩年。", "e": "訊號：The ＋ 名詞 ＋ of，語意是「建造（行為）」需要兩年 → construction。", "w": "(A) constructor 是建造者（人），不能「花兩年」；(B) 動詞；(C) 形容詞。"}, {"g": "t_p5noun", "q": "Several _______ have expressed interest in investing in our project.", "o": ["investing", "investments", "investors", "invest"], "a": 2, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "已有數位投資人表示有興趣投資我們的專案。", "e": "訊號：主詞要能「表達興趣」→ 人 investors。", "w": "(B) investments 是投資（事、物）；(D) 動詞；(A) V-ing。"}, {"g": "t_p5noun", "q": "We appreciate your _______ during the system upgrade.", "o": ["patiently", "patient", "patients", "patience"], "a": 3, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "感謝您在系統升級期間的耐心。", "e": "訊號：your ＋ 名詞，語意「耐心」→ patience。", "w": "(B)(C) patient 當名詞是「病人」，語意不通；(A) 副詞。"}, {"g": "t_p5noun", "q": "The hotel employs several multilingual _______ at the front desk.", "o": ["receptionists", "receive", "receptive", "receptions"], "a": 0, "h": "四個都是名詞時，問自己：這裡需要「人」還是「事／物」？", "trans": "飯店櫃台聘有數位會說多國語言的接待員。", "e": "訊號：employs（雇用）的受詞要是人 → receptionists。", "w": "(D) receptions 是招待會；(B) 動詞；(C) 形容詞。"}]}, {"id": "p5_agree", "kind": "toeic", "part": 5, "stage": 4, "title": "主詞動詞一致", "sub": "the number of＋單數動詞；a number of＋複數動詞；either／neither…or／nor 看靠近的主詞", "qs": [{"g": "t_p5agree", "q": "The number of online orders _______ increased sharply this year.", "o": ["have", "are", "were", "has"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "今年線上訂單的數量大幅增加。", "e": "訊號：the number of ＋ 複數名詞 → 主詞是 number（單數）→ has。", "w": "(A) 被 orders 誤導；(B)(C) be 動詞不搭 increased 主動完成式。"}, {"g": "t_p5agree", "q": "A number of employees _______ requested flexible working hours.", "o": ["have", "is", "was", "has"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "許多員工要求彈性工時。", "e": "訊號：a number of ＝ many → 接複數動詞 have。", "w": "(B)(C)(D) 單數動詞。"}, {"g": "t_p5agree", "q": "The list of participants _______ posted on the bulletin board.", "o": ["were", "are", "is", "have"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "參加者名單公布在佈告欄上。", "e": "訊號：主詞是 The list（單數），of participants 只是修飾語 → is。", "w": "(A)(B)(D) 被最近的 participants 誤導。"}, {"g": "t_p5agree", "q": "Each of the new products _______ a two-year warranty.", "o": ["have come with", "comes with", "come with", "coming with"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "每項新產品都附有兩年保固。", "e": "訊號：Each of ＋ 複數 → 主詞 Each 是單數 → comes。", "w": "(A)(C) 複數動詞；(D) 不是真動詞。"}, {"g": "t_p5agree", "q": "Neither the manager nor the employees _______ aware of the problem.", "o": ["has been", "were", "was", "is"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "經理和員工們都沒察覺到這個問題。", "e": "訊號：neither A nor B → 動詞與靠近的 B（employees，複數）一致 → were。", "w": "(A)(C)(D) 單數，與 employees 不一致。"}, {"g": "t_p5agree", "q": "The equipment in both laboratories _______ inspected every month.", "o": ["were", "are", "have been", "is"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "兩間實驗室的設備每月都會檢查。", "e": "訊號：主詞 equipment 是不可數（單數）→ is；every month 表習慣 → 現在式。", "w": "(A)(B)(C) 被 laboratories 誤導成複數。"}, {"g": "t_p5agree", "q": "Ms. Chen, along with her two assistants, _______ attending the trade fair.", "o": ["is", "are", "have been", "were"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "陳女士和她的兩位助理將參加商展。", "e": "訊號：A, along with B, → 動詞跟主詞 A（Ms. Chen，單數）一致 → is。", "w": "(B)(C)(D) 被 two assistants 誤導。"}, {"g": "t_p5agree", "q": "Every desk and chair in the office _______ been replaced.", "o": ["have", "were", "has", "are"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "辦公室裡的每張桌椅都已更換。", "e": "訊號：Every A and B 仍視為單數 → has。", "w": "(A) 複數；(B)(D) 不能搭 been replaced（缺 have）。"}, {"g": "t_p5agree", "q": "The results of the survey _______ that customers want faster delivery.", "o": ["has shown", "shows", "showing", "show"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "問卷結果顯示顧客希望更快到貨。", "e": "訊號：主詞是 The results（複數），of the survey 是修飾語 → show。", "w": "(A)(B) 被 survey 誤導成單數；(C) 不是真動詞。"}, {"g": "t_p5agree", "q": "Ten dollars _______ a reasonable price for this service.", "o": ["is", "are", "be", "were"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "這項服務收十美元是合理的價格。", "e": "訊號：金額、時間、距離視為一個整體 → 單數 is。", "w": "(B)(D) 被 dollars 的 -s 誤導；(C) 不是真動詞。"}, {"g": "t_p5agree", "q": "Either the regional managers or the director _______ the final decision.", "o": ["making", "make", "makes", "have made"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "最後決定由區域經理們或主任來做。", "e": "訊號：either A or B → 動詞與靠近的 B（the director，單數）一致 → makes。", "w": "(B)(D) 複數；(A) 不是真動詞。"}, {"g": "t_p5agree", "q": "Most of the information in the brochure _______ outdated.", "o": ["have", "is", "were", "are"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "手冊裡大部分的資訊都過時了。", "e": "訊號：Most of ＋ 不可數名詞（information）→ 單數 is（most of 後面的名詞決定單複數）。", "w": "(A)(C)(D) 複數；information 不可數。"}]}, {"id": "p5_rel", "kind": "toeic", "part": 5, "stage": 5, "title": "關係詞", "sub": "缺主詞 who／which；缺受詞 whom／which；後接名詞 whose；子句完整 where／when／why", "qs": [{"g": "t_p5rel", "q": "Employees _______ wish to attend the seminar should contact Ms. Ross.", "o": ["whom", "which", "who", "whose"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "想參加研討會的員工請聯絡 Ross 女士。", "e": "訊號：先行詞 Employees 是人；空格後 wish to attend 缺主詞 → 主格 who。", "w": "(B) which 指物；(D) whose 後面要接名詞；(A) whom 是受格，後面的子句不能缺主詞。"}, {"g": "t_p5rel", "q": "The report, _______ was released yesterday, shows a rise in sales.", "o": ["that", "which", "what", "who"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "昨天公布的報告顯示銷售額上升。", "e": "訊號：先行詞是物（The report）；逗號後的非限定子句缺主詞 → which（逗號後不能用 that）。", "w": "(D) who 指人；(A) that 不能用在逗號後；(C) what 不需要先行詞。"}, {"g": "t_p5rel", "q": "We hired a consultant _______ experience in retail is extensive.", "o": ["who", "whom", "which", "whose"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們聘請了一位在零售業經驗豐富的顧問。", "e": "訊號：空格後緊接名詞 experience，且子句 ___ experience in retail is extensive 不缺主詞或受詞 → 所有格 whose（顧問的經驗）。", "w": "(A)(B)(C) 後面接的子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "The candidate _______ we interviewed yesterday has accepted the offer.", "o": ["whom", "whose", "what", "which"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們昨天面試的候選人已經接受了錄取。", "e": "訊號：先行詞是人；子句 we interviewed ___ 缺受詞 → 受格 whom（也可用 who／that 或省略）。", "w": "(B) whose 要接名詞；(D) which 指物；(C) what 不接先行詞。"}, {"g": "t_p5rel", "q": "This is the hotel _______ the conference will be held next year.", "o": ["what", "whose", "which", "where"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "這就是明年要舉辦會議的飯店。", "e": "訊號：先行詞是地點，空格後 the conference will be held 是完整子句（不缺主詞或受詞）→ 關係副詞 where（＝in which）。", "w": "(C) which 後面的子句要缺名詞；(A) what 不接先行詞；(B) whose 要接名詞。"}, {"g": "t_p5rel", "q": "_______ you need for the trip is listed in the itinerary.", "o": ["Which", "Whose", "What", "That"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "你這趟旅程需要的東西都列在行程表裡。", "e": "訊號：句首沒有先行詞，子句 you need ___ 缺受詞，整個子句當主詞 → What（＝the thing that）。", "w": "(D) that 子句要完整；(A) which 當主詞子句時需有選擇範圍；(B) whose 要接名詞。"}, {"g": "t_p5rel", "q": "The machine _______ was repaired last week has broken down again.", "o": ["that", "what", "who", "whom"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "上週修好的機器又故障了。", "e": "訊號：先行詞是物，沒有逗號（限定用法），子句缺主詞 → that（也可用 which）。", "w": "(C)(D) 指人；(B) what 不接先行詞。"}, {"g": "t_p5rel", "q": "Ms. Kato, _______ office is on the third floor, will lead the training.", "o": ["whom", "whose", "which", "who"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "辦公室在三樓的加藤女士將主持訓練。", "e": "訊號：空格後緊接名詞 office，子句 ___ office is on the third floor 完整 → whose（加藤女士的辦公室）。", "w": "(A)(C)(D) 後面的子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "Please remember the date _______ the new policy takes effect.", "o": ["where", "when", "which", "what"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "請記住新政策生效的日期。", "e": "訊號：先行詞是時間 the date，子句 the new policy takes effect 完整 → 關係副詞 when。", "w": "(C) which 後面要缺名詞；(A) where 用於地點；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "The company is looking for someone _______ can speak both English and Japanese.", "o": ["which", "whom", "whose", "who"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "公司正在找一位能說英語和日語的人。", "e": "訊號：先行詞 someone 是人，子句 ___ can speak … 缺主詞 → who。", "w": "(B) whom 是受格；(C) whose 要接名詞；(A) which 指物。"}, {"g": "t_p5rel", "q": "The consultant with _______ we discussed the plan has left the firm.", "o": ["whom", "which", "who", "that"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "和我們討論過這項計畫的那位顧問已經離職了。", "e": "訊號：介系詞 with 後面接關係代名詞，先行詞 consultant 是人 → whom（介系詞後不能用 who 或 that）。", "w": "(C) 介系詞後不用 who；(B) which 指物；(D) 介系詞後不用 that。"}, {"g": "t_p5rel", "q": "The room in _______ the workshop will take place has been reserved.", "o": ["that", "where", "which", "what"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "要舉辦工作坊的那間房間已經預約了。", "e": "訊號：介系詞 in 後面 → 指物用 which（in which ＝ where）。", "w": "(B) where 前面不能再有介系詞；(A) 介系詞後不能用 that；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "Applicants _______ résumés are incomplete will not be considered.", "o": ["which", "whom", "who", "whose"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "履歷不完整的應徵者將不予考慮。", "e": "訊號：空格後緊接名詞 résumés，子句完整 → whose（應徵者的履歷）。", "w": "(A)(B)(C) 後面子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "The new branch, _______ opened last month, already has many customers.", "o": ["which", "that", "where", "what"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "上個月開幕的新分店已經有很多顧客了。", "e": "訊號：逗號後的非限定子句，先行詞是物，子句缺主詞 → which（逗號後不用 that）。", "w": "(B) that 不能用在逗號後；(C) where 後面要接完整子句；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "Thank you for _______ you have done for the project.", "o": ["who", "what", "that", "which"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "謝謝你為這個專案所做的一切。", "e": "訊號：介系詞 for 後面沒有先行詞，子句 you have done ___ 缺受詞 → what（＝the things that）。", "w": "(C)(D) 需要先行詞；(A) who 指人且後面要缺主詞。"}, {"g": "t_p5rel", "q": "The city _______ we visited last year has built a new convention center.", "o": ["whose", "where", "which", "what"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們去年造訪的城市蓋了一座新的會議中心。", "e": "訊號：雖然先行詞是地點，但子句 we visited ___ 缺受詞（visit 是及物動詞）→ 用 which，不用 where。", "w": "(B) where 後要接完整子句，但 visited 缺受詞；(A) whose 要接名詞；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "All visitors, most of _______ were tourists, enjoyed the tour.", "o": ["them", "whom", "who", "which"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "所有訪客都很喜歡這趟導覽，他們大多數是觀光客。", "e": "訊號：逗號後「數量詞 ＋ of ＋ 關係代名詞」，指人且在介系詞後 → whom。", "w": "(A) them 會讓句子有兩個子句卻沒有連接詞；(C) 介系詞後不用 who；(D) which 指物。"}, {"g": "t_p5rel", "q": "The product _______ received the best reviews will be featured in our ad.", "o": ["who", "whose", "where", "that"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "評價最好的產品將出現在我們的廣告中。", "e": "訊號：先行詞是物，子句缺主詞 → that（或 which）。", "w": "(A) who 指人；(B) whose 要接名詞；(C) where 要接完整子句。"}, {"g": "t_p5rel", "q": "The reason _______ the shipment was delayed is still unknown.", "o": ["why", "where", "what", "which"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "貨物延遲的原因仍然不明。", "e": "訊號：先行詞是 the reason，子句完整 → 關係副詞 why。", "w": "(D) which 後要缺名詞；(C) what 不接先行詞；(B) where 用於地點。"}, {"g": "t_p5rel", "q": "Mr. Han is the person to _______ all inquiries should be sent.", "o": ["whose", "who", "whom", "that"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "所有詢問都應寄給韓先生。", "e": "訊號：介系詞 to 後面、指人 → whom。", "w": "(B)(D) 介系詞後不能用 who 或 that；(A) whose 要接名詞。"}]}, {"id": "p5_ncl", "kind": "toeic", "part": 5, "stage": 5, "title": "名詞子句與間接問句", "sub": "完整子句 → that／whether；缺名詞 → what／who；間接問句用直述語序", "qs": [{"g": "t_p5ncl", "q": "Please confirm _______ the order has shipped.", "o": ["what", "whether", "which", "who"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "請確認訂單是否已出貨。", "e": "訊號：空格後是完整子句（the order has shipped，不缺主詞或受詞），語意是「是否」→ whether。", "w": "(A)(C)(D) what／which／who 引導的子句裡要缺一個名詞（主詞或受詞）。"}, {"g": "t_p5ncl", "q": "The manager explained _______ the project had been delayed.", "o": ["which", "whom", "why", "what"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "經理解釋了專案延誤的原因。", "e": "訊號：空格後是完整子句（the project had been delayed）→ 用疑問副詞 why（為什麼），語意是說明原因。", "w": "(A)(B)(D) what／which／whom 後面的子句要缺名詞。"}, {"g": "t_p5ncl", "q": "_______ the company needs most right now is a reliable supplier.", "o": ["Whether", "That", "Which", "What"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "公司現在最需要的是一家可靠的供應商。", "e": "訊號：空格後的子句 the company needs ___ most 缺受詞，整個子句當主詞 → What（＝the thing that）。", "w": "(A)(B) that／whether 後面要接完整子句；(C) which 當名詞子句時需有選擇範圍。"}, {"g": "t_p5ncl", "q": "Could you tell me where _______?", "o": ["the conference room is", "is the conference room", "the conference room", "does the conference room"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "可以告訴我會議室在哪裡嗎？", "e": "訊號：間接問句（疑問詞放在句中）→ 用直述語序：疑問詞 ＋ 主詞 ＋ 動詞 → where the conference room is。", "w": "(B) 保留疑問句倒裝語序是錯的；(D) 不能加助動詞 does；(C) 缺動詞。"}, {"g": "t_p5ncl", "q": "We have not decided _______ to hold the event indoors or outdoors.", "o": ["what", "whether", "that", "if"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "我們還沒決定活動要在室內還是戶外舉行。", "e": "訊號：空格後接 to V，且有 or → whether to V … or …（if 不能接 to V）。", "w": "(D) if 不能接 to V；(C) that 不接 to V；(A) what to V 表「該做什麼」，但後面已有 hold the event，不缺受詞。"}, {"g": "t_p5ncl", "q": "It is essential _______ all staff follow the new procedures.", "o": ["that", "whether", "what", "which"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "所有員工遵守新程序是非常重要的。", "e": "訊號：It is ＋ 形容詞 ＋ ___ ＋ 完整子句（虛主詞 It 代替真主詞子句）→ that。", "w": "(C)(D) 後面要缺名詞；(B) whether 表「是否」，語意不合 essential。"}, {"g": "t_p5ncl", "q": "The survey asked customers _______ they were satisfied with our service.", "o": ["what", "that", "whether", "which"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "問卷詢問顧客是否對我們的服務滿意。", "e": "訊號：ask 後面接「是否」的問句，空格後是完整子句 → whether。", "w": "(B) ask 後不接 that 子句；(A)(D) 後面要缺名詞。"}, {"g": "t_p5ncl", "q": "The decision will depend on _______ the budget is approved.", "o": ["what", "if", "that", "whether"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這個決定取決於預算是否通過。", "e": "訊號：介系詞 on 後面的名詞子句表「是否」→ 只能用 whether（if 不能放在介系詞後）。", "w": "(B) if 不能當介系詞受詞；(C) that 子句不放介系詞後；(A) what 後面要缺名詞。"}, {"g": "t_p5ncl", "q": "Ms. Lin is not sure _______ will be chosen as the new team leader.", "o": ["who", "what", "whose", "whom"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "林女士不確定誰會被選為新組長。", "e": "訊號：空格後 will be chosen 缺主詞，且指人 → 主格 who。", "w": "(D) whom 是受格；(C) whose 後面要接名詞；(B) what 指事物。"}, {"g": "t_p5ncl", "q": "The brochure explains _______ customers can apply for a membership card.", "o": ["what", "how", "which", "who"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這本手冊說明顧客如何申請會員卡。", "e": "訊號：空格後是完整子句（customers can apply for a membership card）→ 疑問副詞 how（如何）。", "w": "(A)(C)(D) 後面的子句都要缺一個名詞。"}, {"g": "t_p5ncl", "q": "Please let us know _______ time works best for you.", "o": ["whether", "if", "what", "that"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "請告訴我們什麼時間對您最方便。", "e": "訊號：空格後緊接名詞 time，形成「what ＋ 名詞」當子句主詞（什麼時間最合適）。", "w": "(A)(B)(D) 後面要接完整子句，不能直接接名詞 time 當疑問詞的一部分。"}, {"g": "t_p5ncl", "q": "I wonder _______ the shipment will arrive before Friday.", "o": ["that", "which", "what", "whether"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "我想知道貨物是否能在週五前送達。", "e": "訊號：wonder ＋ 是否 ＋ 完整子句 → whether（也可用 if）。", "w": "(A) wonder 不接 that 子句；(B)(C) 後面要缺名詞。"}, {"g": "t_p5ncl", "q": "The committee will announce _______ has won the design contest next week.", "o": ["which of", "who", "whom", "whose"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "委員會將於下週公布誰贏得設計比賽。", "e": "訊號：空格後 has won … 缺主詞，指人 → who。", "w": "(C) whom 是受格；(D) whose 要接名詞；(A) which of 後面要接名詞。"}, {"g": "t_p5ncl", "q": "Can you tell me how much _______?", "o": ["the service costs", "the service cost does", "does the service cost", "costs the service"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "可以告訴我這項服務要多少錢嗎？", "e": "訊號：間接問句用直述語序 → how much ＋ 主詞 ＋ 動詞 → the service costs。", "w": "(C) 疑問句語序；(B)(D) 語序錯誤。"}, {"g": "t_p5ncl", "q": "The fact _______ the store is closed on Mondays surprised many tourists.", "o": ["whether", "what", "that", "which"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這家店週一公休的事實讓很多觀光客很意外。", "e": "訊號：the fact ＋ that ＋ 完整子句（同位語子句，說明 fact 的內容）。", "w": "(B) what 要缺名詞；(D) which 是關係代名詞，後面要缺名詞；(A) whether 表是否，語意不合 fact。"}]}, {"id": "p5_cadv", "kind": "toeic", "part": 5, "stage": 5, "title": "連接副詞與標點", "sub": "; however, ／. Therefore, → 連接副詞；, but ／, so → 連接詞", "qs": [{"g": "t_p5cadv", "q": "Demand rose sharply; _______, production was increased.", "o": ["therefore", "but", "although", "because"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "需求大幅上升，因此產量增加了。", "e": "訊號：分號（;）＋ ___ ＋ 逗號 → 連接副詞。前後是因果關係 → therefore。", "w": "(B)(C)(D) 是連接詞，不能放在分號後、逗號前的位置。"}, {"g": "t_p5cadv", "q": "The product is popular; _______, its high price limits sales.", "o": ["but", "although", "despite", "however"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這項產品很受歡迎，但價格高限制了銷量。", "e": "訊號：; ___ , → 連接副詞；前後語意轉折 → however。", "w": "(A)(B) 連接詞；(C) 介系詞，都不能放在這個位置。"}, {"g": "t_p5cadv", "q": "Please register by Friday; _______, you may not get a seat.", "o": ["moreover", "otherwise", "therefore", "however"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "請在週五前報名，否則可能沒有座位。", "e": "訊號：; ___ , → 連接副詞；語意「不然的話」→ otherwise。", "w": "(C) 因此；(A) 此外；(D) 然而，語意都不合。"}, {"g": "t_p5cadv", "q": "The hotel is close to the airport. _______, it offers free shuttle service.", "o": ["Otherwise", "Although", "Moreover", "However"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這家飯店離機場很近，此外還提供免費接駁。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；語意是補充優點 → Moreover（此外）。", "w": "(D) 轉折；(A) 否則；(B) 連接詞，後面要接子句。"}, {"g": "t_p5cadv", "q": "The train was delayed, _______ we arrived at the meeting on time.", "o": ["however", "but", "therefore", "moreover"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "火車誤點了，但我們仍準時抵達會議。", "e": "訊號：兩個完整子句之間只有逗號（沒有分號或句號）→ 需要對等連接詞 but。", "w": "(A)(C)(D) 是連接副詞，不能只用逗號連接兩個子句（會造成 comma splice）。"}, {"g": "t_p5cadv", "q": "The budget was cut. _______, the team completed the project successfully.", "o": ["Although", "Because", "Despite", "Nevertheless"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "預算被刪減了，儘管如此，團隊仍成功完成專案。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；語意轉折「儘管如此」→ Nevertheless。", "w": "(A)(B) 是連接詞，後面要接子句；(C) Despite 是介系詞。"}, {"g": "t_p5cadv", "q": "_______ the price increased, sales remained strong.", "o": ["Although", "Therefore", "However", "Nevertheless"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "雖然價格上漲，銷售仍很強勁。", "e": "訊號：___ ＋ 子句 ＋ 逗號 ＋ 主要子句 → 需要從屬連接詞 Although 把兩句連起來。", "w": "(B)(C)(D) 是連接副詞，不能引導從屬子句來連接兩個句子。"}, {"g": "t_p5cadv", "q": "Our sales team exceeded its targets; _______, everyone will receive a bonus.", "o": ["although", "whereas", "consequently", "unless"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "業務團隊超越目標，因此每個人都會獲得獎金。", "e": "訊號：; ___ , → 連接副詞；因果 → consequently（因此）。", "w": "(A)(B)(D) 是連接詞，不能放在分號後接逗號的位置。"}, {"g": "t_p5cadv", "q": "The software is easy to use. _______, it is very affordable.", "o": ["Because", "Even though", "In addition", "Unless"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這套軟體很容易使用，此外價格也很實惠。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 轉承語；補充 → In addition。", "w": "(A)(B)(D) 是連接詞，後面要直接接子句。"}, {"g": "t_p5cadv", "q": "Ms. Hall prefers email; _______, Mr. Grant prefers phone calls.", "o": ["whereas", "in contrast", "although", "while"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "Hall 女士偏好電子郵件；相較之下，Grant 先生偏好打電話。", "e": "訊號：; ___ , → 轉承語；兩人對比 → in contrast。", "w": "(A)(C)(D) 是連接詞，不放在分號後接逗號的位置（whereas 要直接連接兩個子句）。"}, {"g": "t_p5cadv", "q": "The office will be closed on Monday; _______, all staff should work from home.", "o": ["instead", "because", "so that", "although"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "辦公室週一不開放，所有員工應改為在家工作。", "e": "訊號：; ___ , → 連接副詞；「取而代之」→ instead。", "w": "(B)(C)(D) 是連接詞。"}, {"g": "t_p5cadv", "q": "The weather was bad, _______ the outdoor event was canceled.", "o": ["therefore", "however", "moreover", "so"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "天氣不好，所以戶外活動取消了。", "e": "訊號：兩個完整子句之間只用逗號 → 要用對等連接詞 so（所以）。", "w": "(A)(B)(C) 是連接副詞，只用逗號連接兩句是錯的，必須用分號或句號。"}, {"g": "t_p5cadv", "q": "We tried to call you several times. _______, no one answered.", "o": ["But for", "Because of", "However", "Although"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "我們試著打給您好幾次，但沒有人接聽。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；轉折 → However。", "w": "(D) 連接詞；(A)(B) 介系詞片語，後面要接名詞。"}, {"g": "t_p5cadv", "q": "The first draft had several errors; _______, it was revised twice.", "o": ["even though", "unless", "because", "as a result"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "初稿有幾個錯誤，因此改了兩次。", "e": "訊號：; ___ , → 轉承語；因果 → as a result（結果、因此）。", "w": "(A)(B)(C) 是連接詞。"}, {"g": "t_p5cadv", "q": "The seminar is free for members. Non-members, _______, must pay a $20 fee.", "o": ["however", "unless", "but", "although"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "研討會對會員免費，然而非會員須付 20 美元。", "e": "訊號：插在主詞後、前後都有逗號 → 只有連接副詞 however 可以這樣插入句中。", "w": "(B)(C)(D) 連接詞不能插在主詞與動詞之間。"}]}, {"id": "p5_corr", "kind": "toeic", "part": 5, "stage": 5, "title": "相關連接詞", "sub": "both…and／either…or／neither…nor／not only…but also／whether…or", "qs": [{"g": "t_p5corr", "q": "Candidates should have both experience _______ strong communication skills.", "o": ["or", "nor", "but", "and"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "候選人應同時具備經驗與良好的溝通能力。", "e": "訊號：前面有 both → both A and B。", "w": "(A) 搭 either；(B) 搭 neither；(C) 搭 not only。"}, {"g": "t_p5corr", "q": "You can pay either online _______ at the front desk.", "o": ["and", "or", "nor", "but also"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "您可以線上付款或在櫃台付款。", "e": "訊號：前面有 either → either A or B。", "w": "(A) 搭 both；(C) 搭 neither；(D) 搭 not only。"}, {"g": "t_p5corr", "q": "Neither the manager _______ her assistant was aware of the change.", "o": ["but", "or", "nor", "and"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "經理和她的助理都不知道這項變更。", "e": "訊號：前面有 Neither → neither A nor B。", "w": "(B) 搭 either；(D) 搭 both；(A) 搭 not only。"}, {"g": "t_p5corr", "q": "The new phone is not only lighter _______ more durable than the previous model.", "o": ["but also", "or", "as well", "and"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "新手機不僅比上一款更輕，也更耐用。", "e": "訊號：前面有 not only → not only A but (also) B。", "w": "(B)(D) 不與 not only 搭配；(C) as well 不能放在兩者中間連接。"}, {"g": "t_p5corr", "q": "_______ you choose the standard or premium plan, you will receive free installation.", "o": ["Both", "Either", "Neither", "Whether"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "不論您選擇標準方案或進階方案，都能享有免費安裝。", "e": "訊號：___ ＋ 子句 ＋ or ＋ … ＋ 逗號 ＋ 主要子句 → Whether … or …（不論…或…）。", "w": "(B) Either 不能引導子句；(A) Both 搭 and；(C) Neither 搭 nor。"}, {"g": "t_p5corr", "q": "The workshop is designed for _______ beginners and experienced users.", "o": ["both", "whether", "neither", "either"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "這個工作坊適合新手和有經驗的使用者。", "e": "訊號：後面有 and → both A and B。", "w": "(D) 搭 or；(C) 搭 nor；(B) 搭 or 且多引導子句。"}, {"g": "t_p5corr", "q": "The report was _______ accurate nor complete, so it was sent back for revision.", "o": ["both", "not", "neither", "either"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "報告既不正確也不完整，所以被退回修改。", "e": "訊號：後面有 nor → neither A nor B。", "w": "(D) 搭 or；(A) 搭 and；(B) not 不搭 nor 形成這個句型。"}, {"g": "t_p5corr", "q": "Ms. Lopez speaks not only Spanish _______ French and German.", "o": ["and", "but also", "nor", "or"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "Lopez 女士不只會說西班牙語，還會說法語和德語。", "e": "訊號：前面有 not only → but also。", "w": "(A)(C)(D) 不與 not only 搭配。"}, {"g": "t_p5corr", "q": "Either Mr. Brown or his colleagues _______ going to present the results.", "o": ["be", "was", "are", "is"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "Brown 先生或他的同事們會發表結果。", "e": "訊號：either A or B 當主詞時，動詞與靠近的 B 一致 → colleagues（複數）→ are。", "w": "(B)(D) 單數，與靠近的 colleagues 不一致；(A) be 不是正確的真動詞形式。"}, {"g": "t_p5corr", "q": "_______ the CEO nor the board members have commented on the rumor.", "o": ["Not only", "Neither", "Either", "Both"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "執行長和董事們都尚未對傳聞發表評論。", "e": "訊號：後面有 nor → Neither。", "w": "(C) 搭 or；(D) 搭 and；(A) 搭 but also。"}, {"g": "t_p5corr", "q": "Customers can contact us by phone _______ by email.", "o": ["nor", "both", "and also", "or"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "顧客可以用電話或電子郵件聯絡我們。", "e": "訊號：兩種方式擇一 → A or B（沒有 neither，所以不用 nor）。", "w": "(A) nor 要搭 neither 或否定句；(C) and also 語意變成「兩者都要」不自然；(B) both 要放在 A 前面。"}, {"g": "t_p5corr", "q": "We have not decided _______ to expand overseas or focus on the domestic market.", "o": ["whether", "either", "both", "neither"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "我們還沒決定要擴展海外還是專注國內市場。", "e": "訊號：decided ＋ ___ ＋ to V … or … → whether to V or …（是否／還是）。", "w": "(B)(D) either／neither 不能接在 decide 後引導 to V；(C) both 搭 and。"}]}, {"id": "p5_inv", "kind": "toeic", "part": 5, "stage": 5, "title": "假設語氣與倒裝", "sub": "Should you…（未來）；Were…（現在相反）；Had…p.p.（過去相反）", "qs": [{"g": "t_p5inv", "q": "_______ you have any questions, please contact our customer service team.", "o": ["Would", "Had", "Should", "Unless"], "a": 2, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如有任何問題，請聯絡我們的客服團隊。", "e": "訊號：句首 ___ ＋ 主詞 ＋ 原形動詞（have），後面是祈使句 → Should you …（＝If you should…，省略 if 的倒裝）。", "w": "(A) Would 不用於這種倒裝；(D) Unless 是「除非」，語意相反；(B) Had 後面要接 p.p.。"}, {"g": "t_p5inv", "q": "_______ we known about the delay, we would have rescheduled the meeting.", "o": ["Had", "Were", "If", "Should"], "a": 0, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果我們早知道延誤，就會重新安排會議了。", "e": "訊號：主句是 would have p.p.（與過去事實相反）；空格後是 we known（p.p.）→ Had we known（＝If we had known）。", "w": "(D) Should 後接原形；(C) If 後面要接 we had known；(B) Were 後接名詞、形容詞或 to V。"}, {"g": "t_p5inv", "q": "If the store _______ open on Sundays, it would attract more customers.", "o": ["has been", "will be", "is", "were"], "a": 3, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果那家店週日有營業，會吸引更多顧客。", "e": "訊號：主句是 would ＋ 原形（與現在事實相反）→ if 子句用過去式，be 動詞一律用 were。", "w": "(C) 一般條件句；(B) if 子句不用 will；(A) 完成式不合。"}, {"g": "t_p5inv", "q": "If we had left earlier, we _______ the train.", "o": ["would catch", "would have caught", "will catch", "caught"], "a": 1, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果我們早點出發，就會趕上火車了。", "e": "訊號：if 子句是 had p.p.（與過去事實相反）→ 主句用 would have p.p.。", "w": "(A)(C)(D) 時態與過去假設不相配。"}, {"g": "t_p5inv", "q": "_______ it not been for your support, the project would not have succeeded.", "o": ["Were", "Had", "If", "Should"], "a": 1, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "要不是有你的支持，這個專案不會成功。", "e": "訊號：空格後是 it not been（p.p.），主句 would not have succeeded（與過去事實相反）→ Had it not been for（＝If it had not been for）。", "w": "(A) Were it not for 用於與現在事實相反，且後面不接 been；(D) Should 後接原形；(C) If 後面要接 it had not been。"}, {"g": "t_p5inv", "q": "_______ the weather be bad, the outdoor event will be moved indoors.", "o": ["Should", "Were", "Had", "If"], "a": 0, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "萬一天氣不好，戶外活動將改到室內舉行。", "e": "訊號：空格後是 the weather be（原形 be）→ Should 倒裝（＝If the weather should be bad）。", "w": "(B) Were 後面不接原形 be；(C) Had 後面接 p.p.；(D) If 後面要接 is。"}, {"g": "t_p5inv", "q": "If I _______ you, I would accept the job offer.", "o": ["was being", "am", "were", "have been"], "a": 2, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果我是你，我會接受這份工作。", "e": "訊號：與現在事實相反（我不可能是你），主句 would ＋ 原形 → if 子句 be 動詞用 were。", "w": "(B) 一般條件句；(A)(D) 時態不合。"}, {"g": "t_p5inv", "q": "_______ you require further assistance, please call the number below.", "o": ["Must", "Could", "Would", "Should"], "a": 3, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如需進一步協助，請撥打下方電話。", "e": "訊號：句首 ___ ＋ 主詞 ＋ 原形動詞，後面是祈使句 → Should 倒裝（多益信件結尾超高頻句）。", "w": "(A)(B)(C) 不能用於省略 if 的條件倒裝。"}, {"g": "t_p5inv", "q": "Had the shipment arrived on time, we _______ the order yesterday.", "o": ["would have completed", "will complete", "had completed", "would complete"], "a": 0, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果貨物準時送達，我們昨天就能完成訂單了。", "e": "訊號：Had ＋ 主詞 ＋ p.p.（過去假設倒裝）→ 主句 would have p.p.。", "w": "(B)(C)(D) 不符合與過去事實相反的句型。"}, {"g": "t_p5inv", "q": "Not only _______ the price lower, but the quality is also better.", "o": ["does", "is", "are", "it is"], "a": 1, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "不僅價格比較低，品質也比較好。", "e": "訊號：否定詞 Not only 放句首 → 倒裝：be 動詞移到主詞前 → Not only is the price lower。", "w": "(A) 句中動詞是 be 動詞，不用助動詞 does；(C) 主詞 price 單數；(D) 沒有倒裝。"}, {"g": "t_p5inv", "q": "Rarely _______ such a high level of customer satisfaction.", "o": ["we saw", "seen we have", "have we seen", "we have seen"], "a": 2, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "我們很少看到這麼高的顧客滿意度。", "e": "訊號：否定副詞 Rarely 放句首 → 助動詞移到主詞前 → have we seen。", "w": "(A)(D) 沒有倒裝；(B) 語序錯誤。"}, {"g": "t_p5inv", "q": "If the budget _______ approved next week, construction will begin in May.", "o": ["will be", "would be", "were", "is"], "a": 3, "h": "看主句是 will、would 還是 would have，再決定 Should／Were／Had。", "trans": "如果預算下週通過，工程將在五月開始。", "e": "訊號：主句是 will ＋ 原形 → 一般（可能發生的）條件句，if 子句用現在式代替未來 → is。", "w": "(B)(C) 是假設語氣，與主句 will 不相配；(A) if 子句不用 will。"}]}, {"id": "p5_subj", "kind": "toeic", "part": 5, "stage": 5, "title": "原形假設", "sub": "suggest／require／request／essential that＋主詞＋原形", "qs": [{"g": "t_p5subj", "q": "The manager suggested that the meeting _______ postponed until next week.", "o": ["was", "is", "be", "will be"], "a": 2, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "經理建議會議延到下週。", "e": "訊號：suggest ＋ that ＋ 主詞 ＋ (should) 原形 → be postponed。", "w": "(A)(B)(D) 有時態的動詞；suggest／require 等「建議、要求」動詞後的 that 子句要用原形。"}, {"g": "t_p5subj", "q": "Company policy requires that every visitor _______ in at the front desk.", "o": ["is signing", "signs", "signed", "sign"], "a": 3, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "公司規定每位訪客都必須在櫃台登記。", "e": "訊號：require that ＋ 主詞 ＋ 原形 → sign（不加 -s，即使主詞是單數）。", "w": "(B) 陷阱：主詞單數但仍用原形；(A)(C) 有時態。"}, {"g": "t_p5subj", "q": "It is essential that all employees _______ the safety guidelines.", "o": ["follow", "follows", "will follow", "followed"], "a": 0, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "所有員工務必遵守安全準則。", "e": "訊號：It is essential／important／necessary that ＋ 主詞 ＋ 原形 → follow。", "w": "(B)(C)(D) 有時態，不符合原形假設。"}, {"g": "t_p5subj", "q": "The client requested that the report _______ by Friday.", "o": ["is completed", "be completed", "was completed", "completes"], "a": 1, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "客戶要求報告在週五前完成。", "e": "訊號：request that ＋ 主詞 ＋ 原形；報告是被完成 → be completed。", "w": "(A)(C) 有時態；(D) 主動且有時態。"}, {"g": "t_p5subj", "q": "Dr. Lee recommended that Mr. Park _______ more rest.", "o": ["got", "gets", "get", "will get"], "a": 2, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "李醫師建議朴先生多休息。", "e": "訊號：recommend that ＋ 主詞 ＋ 原形 → get。", "w": "(B) 主詞單數也不加 -s；(A)(D) 有時態。"}, {"g": "t_p5subj", "q": "It is important that the contract _______ by both parties.", "o": ["is signing", "be signed", "signed", "signs"], "a": 1, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "合約必須由雙方簽署，這很重要。", "e": "訊號：It is important that ＋ 原形；合約是被簽 → be signed。", "w": "(A)(D) 主動且有時態；(C) 單獨的 signed 缺 be。"}, {"g": "t_p5subj", "q": "The board insisted that the CEO _______ the decision immediately.", "o": ["explain", "has explained", "explained", "explains"], "a": 0, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "董事會堅持執行長立刻說明這項決定。", "e": "訊號：insist（堅持要求）that ＋ 主詞 ＋ 原形 → explain。", "w": "(B)(C)(D) 有時態。"}, {"g": "t_p5subj", "q": "Ms. Gomez asked that all expense reports _______ submitted electronically.", "o": ["will be", "are", "were", "be"], "a": 3, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "Gomez 女士要求所有費用報告以電子方式提交。", "e": "訊號：ask that ＋ 主詞 ＋ 原形 → be submitted。", "w": "(A)(B)(C) 有時態。"}, {"g": "t_p5subj", "q": "It is necessary that every applicant _______ a copy of his or her diploma.", "o": ["provide", "providing", "provided", "provides"], "a": 0, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "每位應徵者都必須提供一份畢業證書影本。", "e": "訊號：It is necessary that ＋ 主詞 ＋ 原形 → provide。", "w": "(D) 主詞單數也不加 -s；(C) 有時態；(B) 不是真動詞。"}, {"g": "t_p5subj", "q": "The safety inspector demanded that the factory _______ its old equipment.", "o": ["will replace", "replaced", "replace", "replaces"], "a": 2, "h": "看到 suggest／require／request／essential that → that 子句用原形。", "trans": "安全檢查員要求工廠更換舊設備。", "e": "訊號：demand that ＋ 主詞 ＋ 原形 → replace。", "w": "(A)(B)(D) 有時態。"}]}, {"id": "p5_comp", "kind": "toeic", "part": 5, "stage": 6, "title": "比較級與最高級", "sub": "than → 比較級；the＋of／in 範圍 → 最高級；as…as 放原級；much／far／even 修飾比較級", "qs": [{"g": "t_p5comp", "q": "This model is much _______ than the one we purchased last year.", "o": ["more efficient", "efficiently", "efficient", "most efficient"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "這款機型比我們去年買的那款有效率得多。", "e": "訊號：後面有 than → 比較級；much 是修飾比較級的副詞 → much more efficient。", "w": "(C) 原級不能搭 than；(D) 最高級；(B) 副詞不能當 be 補語。"}, {"g": "t_p5comp", "q": "Kenton Hotel is one of the _______ hotels in the city.", "o": ["larger", "largest", "large", "more large"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Kenton 飯店是市內最大的飯店之一。", "e": "訊號：one of the ＋ 最高級 ＋ 複數名詞。", "w": "(C) 原級；(A) 比較級；(D) large 是單音節，不用 more。"}, {"g": "t_p5comp", "q": "The new laptop is as _______ as the previous model but much lighter.", "o": ["most powerful", "more powerful", "power", "powerful"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新筆電和舊款一樣強大，但輕很多。", "e": "訊號：as ＿ as 中間放原級形容詞。", "w": "(A)(B) as…as 中間不放比較級或最高級；(C) 名詞。"}, {"g": "t_p5comp", "q": "Of all the candidates, Ms. Diaz is the _______ qualified for the position.", "o": ["much", "very", "most", "more"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "所有候選人中，Diaz 女士最適合這個職位。", "e": "訊號：of all ＋ 範圍、前面有 the → 最高級 the most。", "w": "(D) 比較級用於兩者比較且常搭 than；(A)(B) 不構成最高級。"}, {"g": "t_p5comp", "q": "Sales this quarter were _______ higher than we had expected.", "o": ["very", "so", "most", "far"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "本季銷售額遠高於我們的預期。", "e": "訊號：修飾比較級 higher 要用 much／far／even／still → far。", "w": "(A) very 只修飾原級；(C) most 是最高級；(B) so 不修飾比較級。"}, {"g": "t_p5comp", "q": "The _______ you submit your application, the sooner we can process it.", "o": ["earliest", "earlier", "more early", "early"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "你越早提交申請，我們就能越快處理。", "e": "訊號：the ＋ 比較級, the ＋ 比較級（越…就越…）→ the earlier。", "w": "(D) 原級；(A) 最高級；(C) early 的比較級是 earlier。"}, {"g": "t_p5comp", "q": "Our prices are _______ than those of our competitors.", "o": ["low", "lowest", "lower", "more low"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "我們的價格比競爭對手低。", "e": "訊號：than → 比較級；low 是單音節 → lower。", "w": "(A) 原級；(B) 最高級；(D) 單音節不用 more。"}, {"g": "t_p5comp", "q": "This is the _______ successful product launch in the company's history.", "o": ["most", "more", "much", "many"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "這是公司史上最成功的產品發表。", "e": "訊號：the ＋ ___ ＋ 形容詞 ＋ in ＋ 範圍 → 最高級 the most。", "w": "(B) 比較級；(C)(D) 不構成最高級。"}, {"g": "t_p5comp", "q": "The second presentation was not as _______ as the first one.", "o": ["most interesting", "more interesting", "interest", "interesting"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "第二場簡報沒有第一場那麼有趣。", "e": "訊號：not as ＿ as → 原級。", "w": "(A)(B) 比較級／最高級不能放在 as…as 中；(C) 名詞。"}, {"g": "t_p5comp", "q": "Ms. Lee's report was _______ than anyone else's on the team.", "o": ["more thorough", "most thorough", "thoroughly", "thorough"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Lee 女士的報告比團隊中其他人的都詳盡。", "e": "訊號：than anyone else's → 比較級 more thorough（比較級＋than anyone else ＝ 最…）。", "w": "(D) 原級；(B) 最高級不搭 than；(C) 副詞。"}, {"g": "t_p5comp", "q": "This year's conference attracted twice as _______ participants as last year's.", "o": ["more", "many", "much", "most"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "今年的會議吸引的參加者是去年的兩倍。", "e": "訊號：倍數 ＋ as ＿ as；participants 是可數複數 → as many … as。", "w": "(C) much 修飾不可數；(A)(D) 比較級／最高級不能放在 as…as 中。"}, {"g": "t_p5comp", "q": "The new design is _______ more attractive than the original.", "o": ["most", "very", "even", "so"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新設計甚至比原版更吸引人。", "e": "訊號：修飾比較級 more attractive → even（甚至更…）。", "w": "(B) very 不修飾比較級；(A) most 是最高級；(D) so 不修飾比較級。"}, {"g": "t_p5comp", "q": "Mr. Kim works _______ than any other employee in the department.", "o": ["harder", "hardly", "hardest", "hard"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "金先生比部門裡的任何其他員工都努力。", "e": "訊號：than any other → 比較級 harder（hard 當副詞的比較級）。", "w": "(D) 原級；(C) 最高級；(B) hardly 是「幾乎不」，意思完全不同。"}, {"g": "t_p5comp", "q": "The Riverside branch is the _______ of our three locations.", "o": ["more busy", "busier", "busiest", "busy"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Riverside 分店是我們三家店中最忙的。", "e": "訊號：the ＋ ___ ＋ of our three（三者以上的範圍）→ 最高級 busiest。", "w": "(D) 原級；(B) 比較級用於兩者；(A) busy 的比較級是 busier。"}, {"g": "t_p5comp", "q": "Between the two applicants, Mr. Ross is the _______ experienced.", "o": ["most", "more", "much", "many"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "兩位應徵者中，Ross 先生較有經驗。", "e": "訊號：Between the two（兩者）→ 用比較級，即使前面有 the（the more experienced）。", "w": "(A) 最高級用於三者以上；(C)(D) 不構成比較級。"}, {"g": "t_p5comp", "q": "The shipping costs were _______ lower than originally estimated.", "o": ["more significant", "significance", "significant", "significantly"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "運費比原本估計的低很多。", "e": "訊號：修飾比較級形容詞 lower → 副詞 significantly。", "w": "(A)(C) 形容詞不能修飾形容詞；(B) 名詞。"}, {"g": "t_p5comp", "q": "The new branch is _______ the largest store in the region.", "o": ["very", "by far", "much more", "more"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新分店是區域內最大的店，而且遠遠超過其他店。", "e": "訊號：修飾最高級（the largest）→ by far。", "w": "(A) very 不能放在 the largest 前；(C)(D) 是比較級用法。"}, {"g": "t_p5comp", "q": "Online sales grew _______ quickly than in-store sales last year.", "o": ["more", "very", "most", "much"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "去年網路銷售成長得比門市銷售快。", "e": "訊號：than → 比較級；quickly 是 -ly 副詞，比較級要用 more quickly。", "w": "(C) 最高級；(B)(D) 單獨不構成比較級。"}, {"g": "t_p5comp", "q": "Please choose the _______ convenient time for the interview.", "o": ["more", "much", "most", "very"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "請選擇最方便的面試時間。", "e": "訊號：the ＋ ___ ＋ 多音節形容詞，從所有時段中選一個 → 最高級 the most。", "w": "(A) 比較級需要比較對象 than；(B)(D) 不構成最高級。"}, {"g": "t_p5comp", "q": "The updated software runs _______ faster than the previous version.", "o": ["consideration", "considerable", "consider", "considerably"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "更新後的軟體比前一版快很多。", "e": "訊號：修飾比較級 faster → 副詞 considerably。", "w": "(B) 形容詞不能修飾比較級；(C) 動詞；(A) 名詞。"}]}, {"id": "p5_deg", "kind": "toeic", "part": 5, "stage": 6, "title": "程度與結果句型", "sub": "too…to；形容詞＋enough；enough＋名詞；so＋形容詞＋that；such＋(a)＋名詞＋that", "qs": [{"g": "t_p5deg", "q": "The room is large _______ to accommodate everyone.", "o": ["enough", "so", "too", "such"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這個房間夠大，能容納所有人。", "e": "訊號：形容詞 large ＋ ___ ＋ to V → 形容詞 ＋ enough ＋ to V（enough 放在形容詞後面）。", "w": "(B) so 要搭 that 子句，且放在形容詞前；(C) too 要放在形容詞前（too large to 表「太大而不能」）；(D) such 要接名詞。"}, {"g": "t_p5deg", "q": "The package was ___
