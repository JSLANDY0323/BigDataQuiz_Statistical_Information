<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷題目錄｜巨量資料概論・TOEIC</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷題目錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --faint:#A3A3A3; --line:#E7E7E7; --soft:#F6F6F6;
  --mid:#9A9A9A; --on-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
    --mid:#5C5C5C; --on-ink:#0F0F0F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
  --mid:#5C5C5C; --on-ink:#0F0F0F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:3px}
svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px calc(80px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.wrap{padding:44px 32px 96px}}

/* 頂列 */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
@media (min-width:768px){.topbar-in{padding:12px 32px}}
.brand{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.98rem;letter-spacing:.02em}
.syncbtn{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.syncbtn:hover{color:var(--ink)}
.syncdot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.syncbtn[data-s="ok"] .syncdot,.syncbtn[data-s="idle"] .syncdot{background:var(--ink);border-color:var(--ink)}
.syncbtn[data-s="busy"] .syncdot,.syncbtn[data-s="pending"] .syncdot{background:var(--faint);border-color:var(--faint)}
.syncbtn[data-s="err"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px} .syncbtn[data-s="err"] .syncdot{background:var(--ink);border-color:var(--ink)}

/* 標題 */
h1{font-size:1.5rem;line-height:1.35;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
h2{font-size:1rem;margin:36px 0 12px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.back{appearance:none;border:0;background:none;padding:0;margin:0 0 18px;cursor:pointer;color:var(--muted);font-size:.88rem;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.note{font-size:.85rem;color:var(--muted)}

/* 目錄樹 */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{margin-top:28px;border-top:1px solid var(--line)}
.tree>li{border-bottom:1px solid var(--line)}
.tree ul{margin:0 0 10px 9px;padding-left:18px;border-left:1px solid var(--line)}
.folder>summary{list-style:none}
.folder>summary::-webkit-details-marker{display:none}
.row{appearance:none;border:0;background:none;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 6px;border-radius:6px}
.row:hover{background:var(--soft)}
.row .name{flex:1;min-width:0}
.row .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .meta b{color:var(--ink);font-weight:600}
.row .meta .bad{color:var(--ink)}
.row .chev{width:16px;height:16px;color:var(--faint);transition:transform .2s ease}
.folder[open]>summary .chev{transform:rotate(90deg)}
.tree>li>.folder>summary{min-height:60px;font-size:1.08rem;font-weight:700}
.row.off{cursor:default;color:var(--faint)} .row.off:hover{background:none}
.row.done .name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:8px;vertical-align:2px}

/* 答案卡 */
.sheet{margin:22px 0 16px;border:1px solid var(--line);border-radius:10px;padding:0 16px}
.sheet>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:.88rem}
.sheet>summary::-webkit-details-marker{display:none}
.sheet>summary .t{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sheet>summary .chev{width:14px;height:14px;color:var(--faint);transition:transform .2s ease}
.sheet[open]>summary .chev{transform:rotate(90deg)}
.sheet>summary .score{color:var(--muted);font-variant-numeric:tabular-nums}
.sheet[open]{padding-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.cell{position:relative;appearance:none;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.cell:not(.ok):not(.bad):hover{border-color:var(--ink);color:var(--ink)}
.cell.ok{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.cell.bad{background:var(--mid);border-color:var(--mid);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px}
.cell.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* 題目 */
.panel{border:1px solid var(--line);border-radius:10px;padding:20px;scroll-margin-top:72px}
@media (min-width:768px){.panel{padding:26px 28px}}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-weight:700;font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:10px}
.chip{font-weight:400;font-size:.78rem;color:var(--muted)}
.qactions{display:flex;gap:6px}
.copybtn,.flagbtn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.78rem;cursor:pointer}
.copybtn:hover,.flagbtn:hover{border-color:var(--ink);color:var(--ink)}
.copybtn.copied{border-color:var(--ink);color:var(--ink)}
.flagbtn.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.qtext{font-size:1.1rem;line-height:1.8;margin:0 0 20px;font-weight:600;white-space:pre-line}
.opts+.optfirst-q{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.src{font-size:.8rem;color:var(--muted);margin:-12px 0 16px}
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer;min-height:48px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--muted);margin-top:1px}
.opt.right{border-color:var(--ink)}
.opt.right .bub{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt.wrong{border-color:var(--mid);background:var(--soft)}
.opt.wrong>span:last-child{text-decoration:line-through;text-decoration-color:var(--mid);color:var(--muted)}
.opt.wrong .bub{background:var(--mid);border-color:var(--mid);color:#fff}
.opt:disabled:not(.right):not(.wrong){color:var(--muted)}
.hint{margin-top:16px} .hint summary{cursor:pointer;color:var(--muted);font-size:.85rem} .hint p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.exp{margin-top:22px;padding:2px 0 2px 16px;border-left:2px solid var(--ink)}
.exp.isbad{border-left-color:var(--mid)}
.verdict{font-weight:700;margin:0 0 10px}

.qtrans{background:var(--soft);padding:10px 14px;margin:10px 0 12px;border-radius:6px;font-size:.93rem;line-height:1.65}
.qexp-text{margin:0 0 10px;line-height:1.75}
.qopt-breakdown{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.9rem;line-height:1.7;color:var(--muted)}
.qopt-breakdown strong,.qtrans strong{color:var(--ink)}

/* 按鈕 */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 20px;font-size:.92rem;font-weight:500;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover:not(:disabled){opacity:.85}
.btn:disabled{opacity:.3;cursor:default}
.tools{display:flex;gap:20px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.linkbtn,.tools button{appearance:none;border:0;background:none;padding:4px 0;cursor:pointer;font-size:.84rem;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkbtn:hover,.tools button:hover{color:var(--ink);text-decoration-color:var(--ink)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.result{border:1px solid var(--ink);border-radius:10px;padding:16px 18px;margin:20px 0 0}
.result p{margin:0 0 12px}

/* 表單 */
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:700;margin-bottom:6px;font-size:.92rem}
.radio{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.radio:last-child{border-bottom:0}
.radio input{accent-color:var(--ink);width:18px;height:18px}
.count{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count input,.field input,textarea.bk{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
.count input{width:90px}
.quick{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;font-size:.84rem;cursor:pointer}
.quick:hover{border-color:var(--ink)}
.field{display:grid;gap:6px;margin:0 0 14px}
.field span{font-weight:600;font-size:.9rem}
.field input,textarea.bk{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea.bk{min-height:90px;resize:vertical;margin-top:12px}
.steps{margin:0 0 18px;padding-left:1.3em;font-size:.93rem} .steps li{margin:6px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--soft);border-radius:4px;padding:1px 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 16px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.errbox{border-left:2px solid var(--ink);color:var(--ink);padding:4px 0 4px 12px;margin:0 0 16px;font-size:.9rem}

/* 報告 */
.tagrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tagrow:last-child{border-bottom:0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

.pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;white-space:nowrap}
.weak{border-left:2px solid var(--ink);padding:0 0 0 14px;margin:0 0 26px}
.weak h3{margin:0 0 4px;font-size:1rem}
.weak .stat{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.weak p{margin:0 0 8px;font-size:.93rem}
.wlist{margin:6px 0 0;padding:0;list-style:none;font-size:.9rem}
.wlist li{margin:6px 0}
.link{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.link:hover{text-decoration-color:var(--ink)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--on-ink);padding:9px 18px;border-radius:8px;font-size:.86rem;opacity:0;transition:all .2s ease;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (hover:none){
  .row:hover{background:none}
  .opt:hover:not(:disabled){border-color:var(--line)}
  .btn:not(.primary):hover:not(:disabled){border-color:var(--line)}
  .cell:not(.ok):not(.bad):hover{border-color:var(--line);color:var(--muted)}
}
@media (max-width:560px){
  h1{font-size:1.3rem}
  .panel{padding:16px 14px}
  .qtext{font-size:1.04rem}
  .nav .btn{flex:1}
  .tagrow{grid-template-columns:1fr auto;row-gap:6px}
  .tagrow .bar{grid-column:1/-1;grid-row:2}
  .tree ul{margin-left:8px;padding-left:12px}
  .row{gap:10px;padding:8px 4px}
}
@media (prefers-reduced-motion:no-preference){.exp{animation:in .2s ease-out}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const TAGS={
  t_grammar:{n:"Part 5 · 文法題",t:"掌握時態一致性、主被動語態、條件句省略if倒裝（Should you require...）、以及關係代名詞引導詞。"},
  t_vocab:{n:"Part 5 · 商務單字",t:"加強高頻商業名詞、動詞搭配詞（如 meet the deadline、comply with、address concerns）與形容詞辨析。"},
  t_pos:{n:"Part 5 · 詞性判斷",t:"依據空格在句中的文法結構角色（名詞、形容詞、副詞、動詞）以及字尾特徵（-tion, -ive, -ly, -ment）快速秒殺。"},
  t_conn:{n:"Part 5 · 連接詞與介系詞",t:"牢記從屬連接詞（後接完整子句 S+V）與介系詞（後接名詞片語/動名詞）的區分，如 although/despite、because/due to、while/during。"},
  basic:{n:"巨量資料基本概念",t:"複習 5V 各自的定義與實例，熟記單位換算與重視相關性思維。"},
  hadoop:{n:"Hadoop 生態系",t:"畫一次 HDFS 架構，記住區塊大小與副本數，整理 YARN、Hive、HBase、Sqoop 用途表。"},
  mr:{n:"MapReduce",t:"手算一次 Map → Shuffle/Sort → Reduce 每個階段的輸入與輸出，分清 Combiner 與 Partitioner。"},
  spark:{n:"Apache Spark",t:"整理 RDD 特性、transformation 與 action、寬依賴與窄依賴，記住 Spark SQL 與 MLlib。"},
  nosql:{n:"NoSQL 與分散式理論",t:"四大 NoSQL 對照表，理解 CAP 定理、ACID 與 BASE 差異、水平擴充意義。"},
  dw:{n:"資料倉儲與 OLAP",t:"事實表與維度表、星狀與雪花綱要、五種 OLAP 操作、比較資料倉儲與資料湖。"},
  prep:{n:"資料前處理與整合",t:"釐清 ETL 與 ELT，Min-Max 標準化、Z-score 與離群值判斷計算。"},
  mining:{n:"資料探勘",t:"練習手算支持度、信賴度與提升度，Apriori 剪枝原理，比較 K-means 與 DBSCAN。"},
  ml:{n:"機器學習與模型評估",t:"Precision、Recall、F1 公式與過度擬合對策、交叉驗證、PCA 與深度學習。"},
  cloud:{n:"雲端運算與串流處理",t:"IaaS/PaaS/SaaS 代表例子，理解 Kafka 與串流視窗差異。"},
  privacy:{n:"隱私與資料治理",t:"比較 k-匿名、差分隱私、加密與 GDPR 當事人權利。"},
  viz:{n:"資料視覺化",t:"常見圖表適用情境：折線圖、長條圖、散佈圖、箱形圖。"}
};

const TOEIC_EXAMS = [{"id": "toeic_p5_full", "kind": "toeic", "part": 5, "title": "Part 5 綜合模擬測驗 (30題)", "sub": "全方位涵蓋文法題、商務單字題、詞性變化題、介系詞與連接詞題，仿真實多益題型", "qs": [{"g": "t_grammar", "q": "Mr. Henderson _______ at Apex Logistics since the company relocated its global headquarters to Chicago three years ago.", "o": ["works", "has worked", "worked", "will work"], "a": 1, "h": "注意句尾的「since + 過去時間點」結構，表示從過去持續到現在的動作。", "trans": "自從三年前該公司將全球總部遷至芝加哥以來，亨德森先生就一直在 Apex 物流公司工作。", "e": "句中出現「since + 過去時間點/過去式子句」，表示動作從過去某個時間點持續進行至今，主要子句動詞須使用「現在完成式」(has/have + p.p.)。主詞 Mr. Henderson 為第三人稱單數，故選 (B) has worked。", "w": "(A) 現在簡單式用於表示經常性習慣或真理；(C) 過去簡單式僅表示過去發生的事實，無法表達持續至現在；(D) 未來式表示將來發生的事，與 since 不合。"}, {"g": "t_grammar", "q": "All confidential financial documents must be _______ before being discarded to prevent unauthorized disclosure of client information.", "o": ["shred", "shredded", "shredding", "shreds"], "a": 1, "h": "主詞是「文件」，思考「文件」是被粉碎還是主動粉碎？注意情態助動詞 must be 後接的動詞形式。", "trans": "所有機密財務文件在丟棄前都必須被粉碎，以防止客戶資料遭到未經授權的洩漏。", "e": "主詞 All confidential financial documents（所有機密財務文件）為受動者，且助動詞結構為 must be，後方需接過去分詞 (p.p.) 構成「被動語態」(must be shredded)。shred 的過去分詞為 shredded，故選 (B)。", "w": "(A) 原形動詞；(C) 現在分詞表示主動進行；(D) 第三人稱單數現在式。"}, {"g": "t_grammar", "q": "Employees _______ have completed more than five years of continuous service are eligible for additional paid vacation days.", "o": ["which", "whom", "who", "whose"], "a": 2, "h": "先行詞是「Employees（員工）」，關係代名詞在子句中擔任動詞 have completed 的主詞。", "trans": "連續服務滿五年以上的員工，有資格獲得額外的帶薪休假天數。", "e": "先行詞為 Employees（人），後方關係子句缺少主詞（直接接動詞片語 have completed...），因此需填入主格關係代名詞 (C) who 作為主詞指代人。", "w": "(A) which 用於指代事物或動物；(B) whom 為受格關係代名詞，後方需接完整的「主詞+動詞」子句；(D) whose 為所有格關係代名詞，後方必須緊接名詞。"}, {"g": "t_grammar", "q": "_______ you require further assistance regarding your hotel reservation, please do not hesitate to contact our 24-hour support desk.", "o": ["Should", "Would", "Were", "Unless"], "a": 0, "h": "此句為省略 if 的條件句倒裝，原句是 If you should require...", "trans": "若您對於飯店預訂需要進一步的協助，請隨時聯繫我們的 24 小時支援櫃台。", "e": "此為多益極常考的「條件句省略 if 之倒裝用法」。原句為 If you should require...，省略 If 後將助動詞 Should 提前至句首倒裝成「Should + 主詞 + 原形動詞」，表示「萬一/假使」，常用於正式商務書信與顧客服務通知。故選 (A)。", "w": "(B) Would 不用於此類條件句倒裝；(C) Were 用於與現在事實相反的假設倒裝（如 Were you to require...）；(D) Unless 為連接詞，表「除非」，後方應維持正常語序且語意不合。"}, {"g": "t_grammar", "q": "The safety inspector strongly recommended that the plant supervisor _______ all fire suppression equipment without delay.", "o": ["replaces", "replace", "replaced", "replacing"], "a": 1, "h": "動詞是 recommended（建議），思考 that 子句中的動詞該用什麼形式？", "trans": "安全檢查員強烈建議廠區主管應立即更換所有滅火設備。", "e": "在表示「建議、要求、命令、堅持」的動詞（如 recommend, suggest, demand, insist, request）後的 that 子句中，述語動詞需使用「(should) + 原形動詞」，should 經常省略。因此即使主詞 supervisor 是單數，動詞仍須用原形 (B) replace。", "w": "(A) 第三人稱單數現在式 replaces 為常見陷阱；(C) 過去式 replaced 誤以為要配合主句時態；(D) 現在分詞/動名詞 replacing 無法單獨作述語動詞。"}, {"g": "t_grammar", "q": "Each of the candidates applying for the senior administrative position _______ required to submit three letters of professional reference.", "o": ["is", "are", "have", "were"], "a": 0, "h": "找出句子的真正主詞！是 Each 還是 candidates？", "trans": "每位應徵高階行政主管職位的候選人都必須繳交三封專業推薦信。", "e": "主詞核心字為「Each」（每一個），為單數代名詞，後方的 of the candidates applying... 為介系詞片語及分詞修飾語。主詞為單數，因此述語動詞必須使用單數動詞 (A) is。", "w": "(B) are 與 (D) were 為複數動詞，是受到鄰近名詞 candidates 誤導的常見陷阱；(C) have 為複數且時態與主動被動結構不符。"}, {"g": "t_grammar", "q": "_______ the quarterly sales targets ahead of schedule, the marketing team was awarded an extraordinary performance bonus.", "o": ["Achieve", "Achieved", "Having achieved", "To achieve"], "a": 2, "h": "分詞構句題型：達成目標的動作發生在獲頒獎金之前，主詞 team 與 achieve 是主動關係。", "trans": "提前達成了季度銷售目標後，行銷團隊獲得了額外的績效獎金。", "e": "此為「完成分詞構句」(Having + p.p.)。達成目標 (achieve targets) 的動作明顯先於主句的獲頒獎金 (was awarded bonus)，且主詞 the marketing team 與 achieve 為主動關係，故選 (C) Having achieved。", "w": "(A) 原形動詞無法作狀語；(B) 過去分詞 Achieved 表被動（意為「團隊被達成」），語意荒謬；(D) 不定詞 To achieve 表目的（「為了達成」），與後句獲獎因果不順。"}, {"g": "t_grammar", "q": "The fuel efficiency of our newly designed delivery vans is significantly higher than _______ of the older diesel models.", "o": ["those", "that", "these", "this"], "a": 1, "h": "比較對象需要平行！此處代替的是前面提過的「The fuel efficiency（燃油效率）」。", "trans": "我們新設計的配送貨車之燃油效率，明顯高於舊款柴油車款的效率。", "e": "在比較句型中，為了避免重複前面提過的名詞，常用 that 或 those 代替。此處比較的對象為「The fuel efficiency」（單數不可數名詞），故使用單數代名詞 (B) that；若為複數名詞則使用 those。", "w": "(A) those 用於代替前面出現的複數名詞；(C) these 與 (D) this 在正式英文比較句中不用於代替受 of 修飾的比較受詞。"}, {"g": "t_vocab", "q": "Despite severe supply chain disruptions, the engineering team managed to _______ the tight project deadline.", "o": ["meet", "lead", "stand", "afford"], "a": 0, "h": "多益超高頻商務搭配詞：_______ the deadline 表示「趕上截止期限、如期完成」。", "trans": "儘管面臨嚴重的供應鏈中斷，工程團隊仍成功趕上了緊迫的專案截止期限。", "e": "「meet the deadline」為多益必考核心搭配詞，意為「趕上截止日期、如期完成任務」。相關必背搭配詞還有 meet specifications（符合規格）、meet expectations（達到預期）。故選 (A)。", "w": "(B) lead 引領、帶領；(C) stand 站立、忍受；(D) afford 負擔得起（通常搭配 can/could afford）。"}, {"g": "t_vocab", "q": "All laboratory personnel are strictly mandated to _______ with the revised biosafety protocols set by the board.", "o": ["comply", "observe", "adhere", "abide"], "a": 0, "h": "注意空格後的介系詞「with」！四個選項都有遵守之意，但介系詞搭配不同。", "trans": "所有實驗室人員均被嚴格要求遵守董事會制定的修訂版生物安全規範。", "e": "四個選項皆有「遵守」的意思，關鍵在於後方的介系詞：comply with（遵守規章）、adhere to（堅持/遵循）、abide by（遵守承諾/規則）、observe 為及物動詞直接加受詞。空格後為「with」，故只有 (A) comply 符合用法。", "w": "(B) observe 為及物動詞，不加介系詞（observe protocols）；(C) adhere 需搭配 to (adhere to protocols)；(D) abide 需搭配 by (abide by protocols)。"}, {"g": "t_vocab", "q": "The newly renovated convention hall is spacious enough to _______ up to one thousand international attendees.", "o": ["accommodate", "collaborate", "correspond", "accumulate"], "a": 0, "h": "表示空間寬敞足以「容納」多少人或車輛。", "trans": "新翻修的會議廳空間寬敞，足以容納多達一千名國際與會者。", "e": "動詞 accommodate 為多益高頻字，在此意為「容納（特定數量的人或物）」；另一常見商務意思是「迎合、配合（客戶的需求或要求）」。故選 (A)。", "w": "(B) collaborate 合作（通常搭配 with/on）；(C) correspond 通信/相符（搭配 with/to）；(D) accumulate 累積、堆積。"}, {"g": "t_vocab", "q": "Permanent employees who have completed their probationary period are _______ to apply for corporate tuition assistance.", "o": ["eligible", "frequent", "reliable", "deliberate"], "a": 0, "h": "be _______ to + 原形動詞，表示「具備資格做某事」。", "trans": "完成試用期的正式員工有資格申請公司學費補助方案。", "e": "be eligible to do sth / be eligible for sth 意為「有資格／符合條件做某事」，在員工福利、補助申請、促銷折扣等情境中極常出現。故選 (A)。", "w": "(B) frequent 頻繁的；(C) reliable 可靠的；(D) deliberate 深思熟慮的、故意的。"}, {"g": "t_vocab", "q": "Please make sure that all proprietary research findings remain strictly _______ and are stored on encrypted servers.", "o": ["confident", "confidential", "confidence", "confidently"], "a": 1, "h": "注意容易混淆的字：confident 是「有信心的」，還是「機密的」？", "trans": "請確保所有專利研發成果維持嚴格保密，並儲存於加密伺服器中。", "e": "remain 為連繫動詞，後接形容詞作補語。confidential 意為「機密的、保密的」，常用於 confidential documents/information；而 confident 意為「有信心的、自信的」，常被考生混淆。故選 (B)。", "w": "(A) confident 有自信的，語意不通；(C) confidence 名詞（信心/信任）；(D) confidently 副詞（自信地）。"}, {"g": "t_vocab", "q": "The travel schedule provided by the organizing committee is only _______ and remains subject to change without notice.", "o": ["tentative", "substantial", "reluctant", "redundant"], "a": 0, "h": "後文提到「remains subject to change（可能隨時更改）」，代表行程目前是「暫定的」。", "trans": "籌備委員會提供的行程表僅為暫定安排，隨時可能更改，恕不另行通知。", "e": "tentative 意為「暫定的、試驗性的」，常搭配 tentative schedule/itinerary/agreement。後文「remains subject to change」提示此安排並非最終定案，故選 (A)。", "w": "(B) substantial 大量的、實質的；(C) reluctant 不情願的、勉強的；(D) redundant 多餘的、過剩的。"}, {"g": "t_vocab", "q": "Clients who require urgent overseas shipping can pay an additional fee to _______ the delivery process.", "o": ["postpone", "expedite", "detain", "suspend"], "a": 1, "h": "想要加付費用以「加快、加速」配送流程。", "trans": "需要緊急海外快遞的客戶可支付額外費用，以加快運送流程。", "e": "expedite 意為「加快、促進、加速處理（程序或運送）」，常用於商業物流、文件審批（expedite delivery / expedite processing）。故選 (B)。", "w": "(A) postpone 延期；(C) detain 扣留、耽擱；(D) suspend 暫停、中止。"}, {"g": "t_vocab", "q": "The executive director called an all-hands meeting to directly _______ employee concerns regarding the recent corporate restructuring.", "o": ["address", "locate", "converse", "retain"], "a": 0, "h": "動詞除了演講外，還有「處理、應對、解決（問題/疑慮）」的意思。", "trans": "執行董事召集了全員大會，直接回應並處理員工對近期公司改組的各項疑慮。", "e": "address 作及物動詞時，商務上常表示「處理、回應、解決（問題/疑慮/需求）」，如 address concerns/issues/problems，為多益閱讀與聽力中極高頻出現的核心用法。故選 (A)。", "w": "(B) locate 找出位置、坐落於；(C) converse 交談（不及物，需搭配 with）；(D) retain 保留、保持。"}, {"g": "t_pos", "q": "The human resources manager announced that the deadline for the _______ of quarterly performance reviews is next Monday.", "o": ["submit", "submission", "submitting", "submissively"], "a": 1, "h": "空格前面有介系詞 for the，後面有 of，這是一個標準的名詞位置！", "trans": "人資經理宣布，季度績效考核表的提交截止日為下週一。", "e": "空格位於冠詞 the 之後、介系詞 of 之前，必須填入名詞作受詞。submission（提交、呈交之件）為名詞，符合文法結構。故選 (B)。", "w": "(A) submit 為動詞原形；(C) submitting 為動名詞，若作動名詞通常直接接受詞，不需加 the ... of；(D) submissively 為副詞（順從地）。"}, {"g": "t_pos", "q": "Dr. Angela Liu provided a _______ analysis of recent consumer trends during yesterday's market research briefing.", "o": ["comprehend", "comprehension", "comprehensive", "comprehensively"], "a": 2, "h": "空格在不定冠詞「a」與名詞「analysis」之間，需要什麼詞性來修飾名詞？", "trans": "劉博士在昨天的市場研究簡報中，對近期的消費者趨勢提出了全面詳盡的分析。", "e": "空格位於冠詞「a」與名詞「analysis」之間，需要填入形容詞修飾後方的名詞。comprehensive 意為「全面的、詳盡的」，為標準形容詞（字尾 -ive）。故選 (C)。", "w": "(A) comprehend 動詞（理解）；(B) comprehension 名詞（理解力）；(D) comprehensively 副詞（全面地）。"}, {"g": "t_pos", "q": "Prior to executing the merger contract, both legal counsels reviewed every individual clause _______.", "o": ["thorough", "thoroughly", "thoroughness", "thoroughfare"], "a": 1, "h": "句子主詞 (legal counsels)、動詞 (reviewed)、受詞 (clause) 結構已經完整，空格需用副詞修飾動詞 reviewed。", "trans": "在簽署合併合約之前，雙方律師都徹底仔細地審查了每一條條款。", "e": "主要子句主謂賓完整，空格用來修飾及物動詞 reviewed，表示審查的動作方式，因此需要副詞 (B) thoroughly（徹底地、詳盡地）。", "w": "(A) thorough 形容詞（徹底的）；(C) thoroughness 名詞（徹底）；(D) thoroughfare 名詞（主要街道/通道）。"}, {"g": "t_pos", "q": "Following the introduction of the streamlined inventory management software, the logistics department became noticeably more _______.", "o": ["product", "productivity", "productive", "productively"], "a": 2, "h": "連繫動詞 became + 副詞 noticeably more，後面需要什麼詞性作補語？", "trans": "引進簡化流程的庫存管理軟體後，物流部門變得明顯更具工作效率。", "e": "became 為不完全不及物動詞（連繫動詞），後方需要形容詞作主詞補語；more + 形容詞構成比較級，故選形容詞 (C) productive（富有效率的、生產力高的）。", "w": "(A) product 名詞（產品）；(B) productivity 名詞（生產力）；(D) productively 副詞（有成效地）。"}, {"g": "t_pos", "q": "_______, the guest speaker's morning flight was grounded due to severe weather, causing a delay in the seminar schedule.", "o": ["Unfortunate", "Unfortunately", "Misfortune", "Unfavorably"], "a": 1, "h": "句首有逗號與後句隔開，修飾整個後續句子的事件，需要什麼詞性？", "trans": "遺憾的是，特邀講者的早班航班因惡劣天候停飛，導致研討會時程延誤。", "e": "空格位於句首且有逗號與子句隔開，屬於評註性副詞 (sentence adverb)，用來修飾整句話的語氣與情緒，故選副詞 (B) Unfortunately（不幸地、遺憾的是）。", "w": "(A) Unfortunate 為形容詞，無法單獨修飾整句；(C) Misfortune 為名詞（不幸/災難）；(D) Unfavorably 副詞，意為「不利地、反對地」，在此語意不如 Unfortunately 自然適切。"}, {"g": "t_pos", "q": "_______ of the new employee wellness initiative is scheduled to commence at the beginning of the next fiscal quarter.", "o": ["Implement", "Implementation", "Implementing", "Implemented"], "a": 1, "h": "空格在句首擔任全句主詞，且後方有 of the new employee...", "trans": "新員工健康促進方案的推行實施，預計將於下個會計季度初正式展開。", "e": "空格在句首充當全句主詞，後方接介系詞片語 of the new employee...，需要名詞作主詞。Implementation（實施、推行）為名詞，故選 (B)。", "w": "(A) Implement 原形動詞；(C) Implementing 動名詞（通常直接接受詞 Implementing the initiative，較少在後方加 of）；(D) Implemented 過去分詞。"}, {"g": "t_conn", "q": "_______ the global economic downturn dampened consumer demand, the technology company posted record earnings this fiscal year.", "o": ["Despite", "In spite of", "Although", "Regardless"], "a": 2, "h": "注意空格後方是完整句子（S + V）還是單純的名詞片語？", "trans": "雖然全球經濟衰退抑制了消費需求，這家科技公司本會計年度仍創下了獲利紀錄。", "e": "空格後方為「the global economic downturn（主詞）dampened（動詞）consumer demand（受詞）」，是一個完整的子句結構，因此必須使用從屬連接詞，故選 (C) Although。Despite 與 In spite of 為介系詞，只能接名詞或動名詞。", "w": "(A) Despite 為介系詞，後方只能接名詞或動名詞；(B) In spite of 亦為介系詞；(D) Regardless 需搭配 of（regardless of）且也是介系詞片語。"}, {"g": "t_conn", "q": "The outdoor charity gala had to be relocated to the hotel ballroom _______ the unexpected thunderous storm.", "o": ["because", "due to", "since", "whereas"], "a": 1, "h": "空格後是名詞片語 the unexpected thunderous storm，需填入表示原因的介系詞還是連接詞？", "trans": "由於突如其來的雷雨交加風暴，戶外慈善晚會不得不改移至飯店宴會廳舉行。", "e": "空格後方「the unexpected thunderous storm」為純名詞片語（無動詞），因此需要介系詞引導原因，故選 (B) due to（由於）。because 與 since 為連接詞，後方必須接完整子句。", "w": "(A) because 連接詞，後接完整句子；(C) since 連接詞，表原因時後接完整句子；(D) whereas 連接詞，表示「然而、對比」。"}, {"g": "t_conn", "q": "Passengers are kindly requested to remain seated with their seatbelts fastened _______ the aircraft is taxiing to the gate.", "o": ["during", "while", "between", "throughout"], "a": 1, "h": "空格後方「the aircraft is taxiing」有主詞與動詞！", "trans": "在飛機滑行前往登機門期間，請乘客務必保持就座並繫緊安全帶。", "e": "空格後方為「the aircraft（主詞）is taxiing（動詞）」，具有完整子句結構，因此需要從屬連接詞 (B) while（當...之際）。during 與 throughout 為介系詞，後方只能接名詞。", "w": "(A) during 介系詞，後方只能接名詞片語（如 during the taxi）；(C) between 介系詞（常搭配 and）；(D) throughout 介系詞（自始至終）。"}, {"g": "t_conn", "q": "Complimentary warranty repair services will not be extended _______ the customer provides the original purchase receipt.", "o": ["without", "unless", "except", "besides"], "a": 1, "h": "空格後接完整子句（the customer provides...），意為「除非」。", "trans": "除非顧客能出示原始購買收據，否則將不予提供免費保固維修服務。", "e": "空格後為完整子句「the customer provides the original purchase receipt」，表示條件否定，需填入從屬連接詞 (B) unless（除非 = if... not）。without 為介系詞，只能接名詞。", "w": "(A) without 介系詞，後接名詞；(C) except 通常為介系詞（接子句需用 except that）；(D) besides 介系詞或副詞，表「除...之外」。"}, {"g": "t_conn", "q": "All conference delegates must register at the reception counter at least thirty minutes _______ the keynote speech begins.", "o": ["prior to", "before", "ahead", "formerly"], "a": 1, "h": "空格後方「the keynote speech begins」是一個子句（S + V）！", "trans": "所有與會代表必須在專題演講開始前至少三十分鐘於接待櫃台完成報到。", "e": "空格後為完整子句「the keynote speech begins」（主詞 + 動詞），因此需要可充當連接詞的 (B) before。prior to 雖然也是「在...之前」，但它是介系詞片語，後方只能接名詞片語（如 prior to the start），不能接子句。", "w": "(A) prior to 為介系詞片語，後方接名詞，不能接子句；(C) ahead 需搭配 of（ahead of，亦為介系詞）；(D) formerly 為副詞（以前地）。"}, {"g": "t_conn", "q": "The payroll department adjusted the travel allowances in _______ with the newly revised corporate expense policy.", "o": ["agreement", "accordance", "compliance", "relation"], "a": 1, "h": "固定商務片語：in _______ with 表示「依據/按照規定政策」。", "trans": "薪資部門依據新修訂的公司報銷政策調整了差旅津貼。", "e": "「in accordance with + 規定/政策/合約」為商務英語超高頻固定搭配片語，意為「按照、依據、與...一致」。故選 (B) accordance。", "w": "(A) in agreement with 與...意見一致（通常指人與人共識）；(C) in compliance with 也是遵守，但多與法規搭配，在搭配 corporate policy 時以 in accordance with 最為標準；(D) in relation to 關於/涉及。"}, {"g": "t_conn", "q": "Should you have any specific inquiries _______ the corporate health benefits package, please contact the human resources office.", "o": ["regarding", "regard", "regarded", "regards"], "a": 0, "h": "表示「關於、有關」的介系詞，相當於 about 或 concerning。", "trans": "若您對公司的員工健康福利方案有任何具體疑問，請聯繫人資處。", "e": "regarding 為介系詞，意為「關於、至於」（同義於 about, concerning），在商務信函與公告中修飾 questions, inquiries, details 時非常常見。故選 (A)。", "w": "(B) regard 原形動詞；(C) regarded 過去分詞；(D) regards 第三人稱動詞或名詞（問候）。"}, {"g": "t_conn", "q": "The rental deposit will be reimbursed in full, _______ that written cancellation notice is received at least ten days in advance.", "o": ["provided", "providing", "provision", "provides"], "a": 0, "h": "複合連接詞：_______ that 表示「若是、只要（條件是...）」。", "trans": "只要提前至少十天收到書面取消通知，租賃保證金將全額退還。", "e": "「provided that」或「providing that」為正式複合從屬連接詞，意為「只要、倘若（在...條件下 = if / on condition that）」，其中以 provided that 最為常見且正式。故選 (A)。", "w": "(B) providing 亦可用於非正式口語，但在正式合約與多益標竿中以 provided that 最為標準；(C) provision 名詞（條款/供應）；(D) provides 第三人稱現在式動詞。"}]}, {"id": "toeic_p5_grammar", "kind": "toeic", "part": 5, "title": "Part 5 文法題專項特訓", "sub": "專攻時態、主被動語態、假設倒裝、關係代名詞、主謂一致、分詞構句等考點", "qs": [{"g": "t_grammar", "q": "Mr. Henderson _______ at Apex Logistics since the company relocated its global headquarters to Chicago three years ago.", "o": ["works", "has worked", "worked", "will work"], "a": 1, "h": "注意句尾的「since + 過去時間點」結構，表示從過去持續到現在的動作。", "trans": "自從三年前該公司將全球總部遷至芝加哥以來，亨德森先生就一直在 Apex 物流公司工作。", "e": "句中出現「since + 過去時間點/過去式子句」，表示動作從過去某個時間點持續進行至今，主要子句動詞須使用「現在完成式」(has/have + p.p.)。主詞 Mr. Henderson 為第三人稱單數，故選 (B) has worked。", "w": "(A) 現在簡單式用於表示經常性習慣或真理；(C) 過去簡單式僅表示過去發生的事實，無法表達持續至現在；(D) 未來式表示將來發生的事，與 since 不合。"}, {"g": "t_grammar", "q": "All confidential financial documents must be _______ before being discarded to prevent unauthorized disclosure of client information.", "o": ["shred", "shredded", "shredding", "shreds"], "a": 1, "h": "主詞是「文件」，思考「文件」是被粉碎還是主動粉碎？注意情態助動詞 must be 後接的動詞形式。", "trans": "所有機密財務文件在丟棄前都必須被粉碎，以防止客戶資料遭到未經授權的洩漏。", "e": "主詞 All confidential financial documents（所有機密財務文件）為受動者，且助動詞結構為 must be，後方需接過去分詞 (p.p.) 構成「被動語態」(must be shredded)。shred 的過去分詞為 shredded，故選 (B)。", "w": "(A) 原形動詞；(C) 現在分詞表示主動進行；(D) 第三人稱單數現在式。"}, {"g": "t_grammar", "q": "Employees _______ have completed more than five years of continuous service are eligible for additional paid vacation days.", "o": ["which", "whom", "who", "whose"], "a": 2, "h": "先行詞是「Employees（員工）」，關係代名詞在子句中擔任動詞 have completed 的主詞。", "trans": "連續服務滿五年以上的員工，有資格獲得額外的帶薪休假天數。", "e": "先行詞為 Employees（人），後方關係子句缺少主詞（直接接動詞片語 have completed...），因此需填入主格關係代名詞 (C) who 作為主詞指代人。", "w": "(A) which 用於指代事物或動物；(B) whom 為受格關係代名詞，後方需接完整的「主詞+動詞」子句；(D) whose 為所有格關係代名詞，後方必須緊接名詞。"}, {"g": "t_grammar", "q": "_______ you require further assistance regarding your hotel reservation, please do not hesitate to contact our 24-hour support desk.", "o": ["Should", "Would", "Were", "Unless"], "a": 0, "h": "此句為省略 if 的條件句倒裝，原句是 If you should require...", "trans": "若您對於飯店預訂需要進一步的協助，請隨時聯繫我們的 24 小時支援櫃台。", "e": "此為多益極常考的「條件句省略 if 之倒裝用法」。原句為 If you should require...，省略 If 後將助動詞 Should 提前至句首倒裝成「Should + 主詞 + 原形動詞」，表示「萬一/假使」，常用於正式商務書信與顧客服務通知。故選 (A)。", "w": "(B) Would 不用於此類條件句倒裝；(C) Were 用於與現在事實相反的假設倒裝（如 Were you to require...）；(D) Unless 為連接詞，表「除非」，後方應維持正常語序且語意不合。"}, {"g": "t_grammar", "q": "The safety inspector strongly recommended that the plant supervisor _______ all fire suppression equipment without delay.", "o": ["replaces", "replace", "replaced", "replacing"], "a": 1, "h": "動詞是 recommended（建議），思考 that 子句中的動詞該用什麼形式？", "trans": "安全檢查員強烈建議廠區主管應立即更換所有滅火設備。", "e": "在表示「建議、要求、命令、堅持」的動詞（如 recommend, suggest, demand, insist, request）後的 that 子句中，述語動詞需使用「(should) + 原形動詞」，should 經常省略。因此即使主詞 supervisor 是單數，動詞仍須用原形 (B) replace。", "w": "(A) 第三人稱單數現在式 replaces 為常見陷阱；(C) 過去式 replaced 誤以為要配合主句時態；(D) 現在分詞/動名詞 replacing 無法單獨作述語動詞。"}, {"g": "t_grammar", "q": "Each of the candidates applying for the senior administrative position _______ required to submit three letters of professional reference.", "o": ["is", "are", "have", "were"], "a": 0, "h": "找出句子的真正主詞！是 Each 還是 candidates？", "trans": "每位應徵高階行政主管職位的候選人都必須繳交三封專業推薦信。", "e": "主詞核心字為「Each」（每一個），為單數代名詞，後方的 of the candidates applying... 為介系詞片語及分詞修飾語。主詞為單數，因此述語動詞必須使用單數動詞 (A) is。", "w": "(B) are 與 (D) were 為複數動詞，是受到鄰近名詞 candidates 誤導的常見陷阱；(C) have 為複數且時態與主動被動結構不符。"}, {"g": "t_grammar", "q": "_______ the quarterly sales targets ahead of schedule, the marketing team was awarded an extraordinary performance bonus.", "o": ["Achieve", "Achieved", "Having achieved", "To achieve"], "a": 2, "h": "分詞構句題型：達成目標的動作發生在獲頒獎金之前，主詞 team 與 achieve 是主動關係。", "trans": "提前達成了季度銷售目標後，行銷團隊獲得了額外的績效獎金。", "e": "此為「完成分詞構句」(Having + p.p.)。達成目標 (achieve targets) 的動作明顯先於主句的獲頒獎金 (was awarded bonus)，且主詞 the marketing team 與 achieve 為主動關係，故選 (C) Having achieved。", "w": "(A) 原形動詞無法作狀語；(B) 過去分詞 Achieved 表被動（意為「團隊被達成」），語意荒謬；(D) 不定詞 To achieve 表目的（「為了達成」），與後句獲獎因果不順。"}, {"g": "t_grammar", "q": "The fuel efficiency of our newly designed delivery vans is significantly higher than _______ of the older diesel models.", "o": ["those", "that", "these", "this"], "a": 1, "h": "比較對象需要平行！此處代替的是前面提過的「The fuel efficiency（燃油效率）」。", "trans": "我們新設計的配送貨車之燃油效率，明顯高於舊款柴油車款的效率。", "e": "在比較句型中，為了避免重複前面提過的名詞，常用 that 或 those 代替。此處比較的對象為「The fuel efficiency」（單數不可數名詞），故使用單數代名詞 (B) that；若為複數名詞則使用 those。", "w": "(A) those 用於代替前面出現的複數名詞；(C) these 與 (D) this 在正式英文比較句中不用於代替受 of 修飾的比較受詞。"}]}, {"id": "toeic_p5_vocab", "kind": "toeic", "part": 5, "title": "Part 5 商務核心單字特訓", "sub": "高頻商業名詞、動詞搭配詞 (meet deadlines, comply with, address concerns) 與商務形容詞", "qs": [{"g": "t_vocab", "q": "Despite severe supply chain disruptions, the engineering team managed to _______ the tight project deadline.", "o": ["meet", "lead", "stand", "afford"], "a": 0, "h": "多益超高頻商務搭配詞：_______ the deadline 表示「趕上截止期限、如期完成」。", "trans": "儘管面臨嚴重的供應鏈中斷，工程團隊仍成功趕上了緊迫的專案截止期限。", "e": "「meet the deadline」為多益必考核心搭配詞，意為「趕上截止日期、如期完成任務」。相關必背搭配詞還有 meet specifications（符合規格）、meet expectations（達到預期）。故選 (A)。", "w": "(B) lead 引領、帶領；(C) stand 站立、忍受；(D) afford 負擔得起（通常搭配 can/could afford）。"}, {"g": "t_vocab", "q": "All laboratory personnel are strictly mandated to _______ with the revised biosafety protocols set by the board.", "o": ["comply", "observe", "adhere", "abide"], "a": 0, "h": "注意空格後的介系詞「with」！四個選項都有遵守之意，但介系詞搭配不同。", "trans": "所有實驗室人員均被嚴格要求遵守董事會制定的修訂版生物安全規範。", "e": "四個選項皆有「遵守」的意思，關鍵在於後方的介系詞：comply with（遵守規章）、adhere to（堅持/遵循）、abide by（遵守承諾/規則）、observe 為及物動詞直接加受詞。空格後為「with」，故只有 (A) comply 符合用法。", "w": "(B) observe 為及物動詞，不加介系詞（observe protocols）；(C) adhere 需搭配 to (adhere to protocols)；(D) abide 需搭配 by (abide by protocols)。"}, {"g": "t_vocab", "q": "The newly renovated convention hall is spacious enough to _______ up to one thousand international attendees.", "o": ["accommodate", "collaborate", "correspond", "accumulate"], "a": 0, "h": "表示空間寬敞足以「容納」多少人或車輛。", "trans": "新翻修的會議廳空間寬敞，足以容納多達一千名國際與會者。", "e": "動詞 accommodate 為多益高頻字，在此意為「容納（特定數量的人或物）」；另一常見商務意思是「迎合、配合（客戶的需求或要求）」。故選 (A)。", "w": "(B) collaborate 合作（通常搭配 with/on）；(C) correspond 通信/相符（搭配 with/to）；(D) accumulate 累積、堆積。"}, {"g": "t_vocab", "q": "Permanent employees who have completed their probationary period are _______ to apply for corporate tuition assistance.", "o": ["eligible", "frequent", "reliable", "deliberate"], "a": 0, "h": "be _______ to + 原形動詞，表示「具備資格做某事」。", "trans": "完成試用期的正式員工有資格申請公司學費補助方案。", "e": "be eligible to do sth / be eligible for sth 意為「有資格／符合條件做某事」，在員工福利、補助申請、促銷折扣等情境中極常出現。故選 (A)。", "w": "(B) frequent 頻繁的；(C) reliable 可靠的；(D) deliberate 深思熟慮的、故意的。"}, {"g": "t_vocab", "q": "Please make sure that all proprietary research findings remain strictly _______ and are stored on encrypted servers.", "o": ["confident", "confidential", "confidence", "confidently"], "a": 1, "h": "注意容易混淆的字：confident 是「有信心的」，還是「機密的」？", "trans": "請確保所有專利研發成果維持嚴格保密，並儲存於加密伺服器中。", "e": "remain 為連繫動詞，後接形容詞作補語。confidential 意為「機密的、保密的」，常用於 confidential documents/information；而 confident 意為「有信心的、自信的」，常被考生混淆。故選 (B)。", "w": "(A) confident 有自信的，語意不通；(C) confidence 名詞（信心/信任）；(D) confidently 副詞（自信地）。"}, {"g": "t_vocab", "q": "The travel schedule provided by the organizing committee is only _______ and remains subject to change without notice.", "o": ["tentative", "substantial", "reluctant", "redundant"], "a": 0, "h": "後文提到「remains subject to change（可能隨時更改）」，代表行程目前是「暫定的」。", "trans": "籌備委員會提供的行程表僅為暫定安排，隨時可能更改，恕不另行通知。", "e": "tentative 意為「暫定的、試驗性的」，常搭配 tentative schedule/itinerary/agreement。後文「remains subject to change」提示此安排並非最終定案，故選 (A)。", "w": "(B) substantial 大量的、實質的；(C) reluctant 不情願的、勉強的；(D) redundant 多餘的、過剩的。"}, {"g": "t_vocab", "q": "Clients who require urgent overseas shipping can pay an additional fee to _______ the delivery process.", "o": ["postpone", "expedite", "detain", "suspend"], "a": 1, "h": "想要加付費用以「加快、加速」配送流程。", "trans": "需要緊急海外快遞的客戶可支付額外費用，以加快運送流程。", "e": "expedite 意為「加快、促進、加速處理（程序或運送）」，常用於商業物流、文件審批（expedite delivery / expedite processing）。故選 (B)。", "w": "(A) postpone 延期；(C) detain 扣留、耽擱；(D) suspend 暫停、中止。"}, {"g": "t_vocab", "q": "The executive director called an all-hands meeting to directly _______ employee concerns regarding the recent corporate restructuring.", "o": ["address", "locate", "converse", "retain"], "a": 0, "h": "動詞除了演講外，還有「處理、應對、解決（問題/疑慮）」的意思。", "trans": "執行董事召集了全員大會，直接回應並處理員工對近期公司改組的各項疑慮。", "e": "address 作及物動詞時，商務上常表示「處理、回應、解決（問題/疑慮/需求）」，如 address concerns/issues/problems，為多益閱讀與聽力中極高頻出現的核心用法。故選 (A)。", "w": "(B) locate 找出位置、坐落於；(C) converse 交談（不及物，需搭配 with）；(D) retain 保留、保持。"}]}, {"id": "toeic_p5_pos", "kind": "toeic", "part": 5, "title": "Part 5 詞性與字尾辨析特訓", "sub": "3秒解題技巧：名詞、形容詞、副詞、動詞快速定位秒殺", "qs": [{"g": "t_pos", "q": "The human resources manager announced that the deadline for the _______ of quarterly performance reviews is next Monday.", "o": ["submit", "submission", "submitting", "submissively"], "a": 1, "h": "空格前面有介系詞 for the，後面有 of，這是一個標準的名詞位置！", "trans": "人資經理宣布，季度績效考核表的提交截止日為下週一。", "e": "空格位於冠詞 the 之後、介系詞 of 之前，必須填入名詞作受詞。submission（提交、呈交之件）為名詞，符合文法結構。故選 (B)。", "w": "(A) submit 為動詞原形；(C) submitting 為動名詞，若作動名詞通常直接接受詞，不需加 the ... of；(D) submissively 為副詞（順從地）。"}, {"g": "t_pos", "q": "Dr. Angela Liu provided a _______ analysis of recent consumer trends during yesterday's market research briefing.", "o": ["comprehend", "comprehension", "comprehensive", "comprehensively"], "a": 2, "h": "空格在不定冠詞「a」與名詞「analysis」之間，需要什麼詞性來修飾名詞？", "trans": "劉博士在昨天的市場研究簡報中，對近期的消費者趨勢提出了全面詳盡的分析。", "e": "空格位於冠詞「a」與名詞「analysis」之間，需要填入形容詞修飾後方的名詞。comprehensive 意為「全面的、詳盡的」，為標準形容詞（字尾 -ive）。故選 (C)。", "w": "(A) comprehend 動詞（理解）；(B) comprehension 名詞（理解力）；(D) comprehensively 副詞（全面地）。"}, {"g": "t_pos", "q": "Prior to executing the merger contract, both legal counsels reviewed every individual clause _______.", "o": ["thorough", "thoroughly", "thoroughness", "thoroughfare"], "a": 1, "h": "句子主詞 (legal counsels)、動詞 (reviewed)、受詞 (clause) 結構已經完整，空格需用副詞修飾動詞 reviewed。", "trans": "在簽署合併合約之前，雙方律師都徹底仔細地審查了每一條條款。", "e": "主要子句主謂賓完整，空格用來修飾及物動詞 reviewed，表示審查的動作方式，因此需要副詞 (B) thoroughly（徹底地、詳盡地）。", "w": "(A) thorough 形容詞（徹底的）；(C) thoroughness 名詞（徹底）；(D) thoroughfare 名詞（主要街道/通道）。"}, {"g": "t_pos", "q": "Following the introduction of the streamlined inventory management software, the logistics department became noticeably more _______.", "o": ["product", "productivity", "productive", "productively"], "a": 2, "h": "連繫動詞 became + 副詞 noticeably more，後面需要什麼詞性作補語？", "trans": "引進簡化流程的庫存管理軟體後，物流部門變得明顯更具工作效率。", "e": "became 為不完全不及物動詞（連繫動詞），後方需要形容詞作主詞補語；more + 形容詞構成比較級，故選形容詞 (C) productive（富有效率的、生產力高的）。", "w": "(A) product 名詞（產品）；(B) productivity 名詞（生產力）；(D) productively 副詞（有成效地）。"}, {"g": "t_pos", "q": "_______, the guest speaker's morning flight was grounded due to severe weather, causing a delay in the seminar schedule.", "o": ["Unfortunate", "Unfortunately", "Misfortune", "Unfavorably"], "a": 1, "h": "句首有逗號與後句隔開，修飾整個後續句子的事件，需要什麼詞性？", "trans": "遺憾的是，特邀講者的早班航班因惡劣天候停飛，導致研討會時程延誤。", "e": "空格位於句首且有逗號與子句隔開，屬於評註性副詞 (sentence adverb)，用來修飾整句話的語氣與情緒，故選副詞 (B) Unfortunately（不幸地、遺憾的是）。", "w": "(A) Unfortunate 為形容詞，無法單獨修飾整句；(C) Misfortune 為名詞（不幸/災難）；(D) Unfavorably 副詞，意為「不利地、反對地」，在此語意不如 Unfortunately 自然適切。"}, {"g": "t_pos", "q": "_______ of the new employee wellness initiative is scheduled to commence at the beginning of the next fiscal quarter.", "o": ["Implement", "Implementation", "Implementing", "Implemented"], "a": 1, "h": "空格在句首擔任全句主詞，且後方有 of the new employee...", "trans": "新員工健康促進方案的推行實施，預計將於下個會計季度初正式展開。", "e": "空格在句首充當全句主詞，後方接介系詞片語 of the new employee...，需要名詞作主詞。Implementation（實施、推行）為名詞，故選 (B)。", "w": "(A) Implement 原形動詞；(C) Implementing 動名詞（通常直接接受詞 Implementing the initiative，較少在後方加 of）；(D) Implemented 過去分詞。"}]}, {"id": "toeic_p5_conn", "kind": "toeic", "part": 5, "title": "Part 5 連接詞與介系詞特訓", "sub": "關鍵秒殺題：Although vs Despite、Because vs Due to、While vs During、Provided that", "qs": [{"g": "t_conn", "q": "_______ the global economic downturn dampened consumer demand, the technology company posted record earnings this fiscal year.", "o": ["Despite", "In spite of", "Although", "Regardless"], "a": 2, "h": "注意空格後方是完整句子（S + V）還是單純的名詞片語？", "trans": "雖然全球經濟衰退抑制了消費需求，這家科技公司本會計年度仍創下了獲利紀錄。", "e": "空格後方為「the global economic downturn（主詞）dampened（動詞）consumer demand（受詞）」，是一個完整的子句結構，因此必須使用從屬連接詞，故選 (C) Although。Despite 與 In spite of 為介系詞，只能接名詞或動名詞。", "w": "(A) Despite 為介系詞，後方只能接名詞或動名詞；(B) In spite of 亦為介系詞；(D) Regardless 需搭配 of（regardless of）且也是介系詞片語。"}, {"g": "t_conn", "q": "The outdoor charity gala had to be relocated to the hotel ballroom _______ the unexpected thunderous storm.", "o": ["because", "due to", "since", "whereas"], "a": 1, "h": "空格後是名詞片語 the unexpected thunderous storm，需填入表示原因的介系詞還是連接詞？", "trans": "由於突如其來的雷雨交加風暴，戶外慈善晚會不得不改移至飯店宴會廳舉行。", "e": "空格後方「the unexpected thunderous storm」為純名詞片語（無動詞），因此需要介系詞引導原因，故選 (B) due to（由於）。because 與 since 為連接詞，後方必須接完整子句。", "w": "(A) because 連接詞，後接完整句子；(C) since 連接詞，表原因時後接完整句子；(D) whereas 連接詞，表示「然而、對比」。"}, {"g": "t_conn", "q": "Passengers are kindly requested to remain seated with their seatbelts fastened _______ the aircraft is taxiing to the gate.", "o": ["during", "while", "between", "throughout"], "a": 1, "h": "空格後方「the aircraft is taxiing」有主詞與動詞！", "trans": "在飛機滑行前往登機門期間，請乘客務必保持就座並繫緊安全帶。", "e": "空格後方為「the aircraft（主詞）is taxiing（動詞）」，具有完整子句結構，因此需要從屬連接詞 (B) while（當...之際）。during 與 throughout 為介系詞，後方只能接名詞。", "w": "(A) during 介系詞，後方只能接名詞片語（如 during the taxi）；(C) between 介系詞（常搭配 and）；(D) throughout 介系詞（自始至終）。"}, {"g": "t_conn", "q": "Complimentary warranty repair services will not be extended _______ the customer provides the original purchase receipt.", "o": ["without", "unless", "except", "besides"], "a": 1, "h": "空格後接完整子句（the customer provides...），意為「除非」。", "trans": "除非顧客能出示原始購買收據，否則將不予提供免費保固維修服務。", "e": "空格後為完整子句「the customer provides the original purchase receipt」，表示條件否定，需填入從屬連接詞 (B) unless（除非 = if... not）。without 為介系詞，只能接名詞。", "w": "(A) without 介系詞，後接名詞；(C) except 通常為介系詞（接子句需用 except that）；(D) besides 介系詞或副詞，表「除...之外」。"}, {"g": "t_conn", "q": "All conference delegates must register at the reception counter at least thirty minutes _______ the keynote speech begins.", "o": ["prior to", "before", "ahead", "formerly"], "a": 1, "h": "空格後方「the keynote speech begins」是一個子句（S + V）！", "trans": "所有與會代表必須在專題演講開始前至少三十分鐘於接待櫃台完成報到。", "e": "空格後為完整子句「the keynote speech begins」（主詞 + 動詞），因此需要可充當連接詞的 (B) before。prior to 雖然也是「在...之前」，但它是介系詞片語，後方只能接名詞片語（如 prior to the start），不能接子句。", "w": "(A) prior to 為介系詞片語，後方接名詞，不能接子句；(C) ahead 需搭配 of（ahead of，亦為介系詞）；(D) formerly 為副詞（以前地）。"}, {"g": "t_conn", "q": "The payroll department adjusted the travel allowances in _______ with the newly revised corporate expense policy.", "o": ["agreement", "accordance", "compliance", "relation"], "a": 1, "h": "固定商務片語：in _______ with 表示「依據/按照規定政策」。", "trans": "薪資部門依據新修訂的公司報銷政策調整了差旅津貼。", "e": "「in accordance with + 規定/政策/合約」為商務英語超高頻固定搭配片語，意為「按照、依據、與...一致」。故選 (B) accordance。", "w": "(A) in agreement with 與...意見一致（通常指人與人共識）；(C) in compliance with 也是遵守，但多與法規搭配，在搭配 corporate policy 時以 in accordance with 最為標準；(D) in relation to 關於/涉及。"}, {"g": "t_conn", "q": "Should you have any specific inquiries _______ the corporate health benefits package, please contact the human resources office.", "o": ["regarding", "regard", "regarded", "regards"], "a": 0, "h": "表示「關於、有關」的介系詞，相當於 about 或 concerning。", "trans": "若您對公司的員工健康福利方案有任何具體疑問，請聯繫人資處。", "e": "regarding 為介系詞，意為「關於、至於」（同義於 about, concerning），在商務信函與公告中修飾 questions, inquiries, details 時非常常見。故選 (A)。", "w": "(B) regard 原形動詞；(C) regarded 過去分詞；(D) regards 第三人稱動詞或名詞（問候）。"}, {"g": "t_conn", "q": "The rental deposit will be reimbursed in full, _______ that written cancellation notice is received at least ten days in advance.", "o": ["provided", "providing", "provision", "provides"], "a": 0, "h": "複合連接詞：_______ that 表示「若是、只要（條件是...）」。", "trans": "只要提前至少十天收到書面取消通知，租賃保證金將全額退還。", "e": "「provided that」或「providing that」為正式複合從屬連接詞，意為「只要、倘若（在...條件下 = if / on condition that）」，其中以 provided that 最為常見且正式。故選 (A)。", "w": "(B) providing 亦可用於非正式口語，但在正式合約與多益標竿中以 provided that 最為標準；(C) provision 名詞（條款/供應）；(D) provides 第三人稱現在式動詞。"}]}];

const EXAMS=[
{id:"e1",title:"模擬測驗 1",qs:[
{g:"basic",q:"巨量資料的 V 特性中，「真實性 (Veracity)」主要強調下列何者？",o:["資料儲存量已超過傳統資料庫可處理的規模","資料產生與需要處理的速度非常快","資料的品質、可信度與不確定性","資料包含文字、影像、聲音等多種格式"],a:2,h:"Veracity 的字根與 verify（驗證）相同。",e:"Veracity 指資料的可信度與品質，例如雜訊、缺漏、偏差或假資料都會影響分析結果。",w:"(A) 描述的是 Volume（巨量性）；(B) 描述的是 Velocity（速度性）；(D) 描述的是 Variety（多樣性）。"},
{g:"basic",q:"以 2 進位制換算儲存單位，1 ZB (Zettabyte) 等於下列何者？",o:["1,024 PB","1,024 EB","1,024 YB","1,024² TB"],a:1,h:"順序：KB < MB < GB < TB < PB < EB < ZB < YB。",e:"依序為 GB→TB→PB→EB→ZB→YB，每一級相差 1,024 倍，所以 1 ZB = 1,024 EB。",w:"(A) 1,024 PB = 1 EB，少了一級；(C) YB 比 ZB 大，應為 1 YB = 1,024 ZB；(D) 1,024² TB = 1 EB，同樣少了一級。"},
{g:"hadoop",q:"關於 Hadoop 分散式檔案系統 (HDFS) 的架構，下列敘述何者正確？",o:["DataNode 負責記錄整個檔案系統的命名空間與區塊位置等中繼資料","NameNode 管理中繼資料 (metadata)，實際的資料區塊則存放在 DataNode","Secondary NameNode 是 NameNode 的即時熱備援，NameNode 故障時會立即接手","HDFS 特別適合儲存大量的小型檔案，以提升存取效率"],a:1,h:"想想「主管」與「倉庫」的角色分工。",e:"HDFS 採主從式架構，NameNode 管理命名空間與區塊對應表，DataNode 實際儲存區塊並定期回報心跳。",w:"(A) 管理中繼資料的是 NameNode；(C) Secondary NameNode 只負責定期合併 fsimage 與 edit log（checkpoint），熱備援要靠 HA 架構的 Standby NameNode；(D) 每個檔案的中繼資料都佔用 NameNode 記憶體，大量小檔案反而拖垮效能。"},
{g:"hadoop",q:"Hadoop 2.x 起，負責叢集運算資源管理與工作排程的元件為下列何者？",o:["ZooKeeper","Sqoop","YARN","Oozie"],a:2,h:"全名是 Yet Another Resource Negotiator。",e:"YARN 將 Hadoop 1.x 中 JobTracker 的資源管理與工作監控拆開，由 ResourceManager 與 NodeManager 負責資源分配，讓 Spark 等框架也能在叢集上執行。",w:"(A) ZooKeeper 提供分散式協調服務；(B) Sqoop 用於 RDBMS 與 Hadoop 之間的資料傳輸；(D) Oozie 是工作流程排程器，不負責分配叢集資源。"},
{g:"hadoop",q:"某公司欲將 Oracle 資料庫中的大量交易資料批次匯入 HDFS，最適合使用 Hadoop 生態系中的哪一項工具？",o:["Flume","Sqoop","Pig","Mahout"],a:1,h:"名稱由 SQL + Hadoop 組成。",e:"Sqoop (SQL-to-Hadoop) 專門在 RDBMS 與 HDFS／Hive／HBase 之間做雙向的批次資料傳輸。",w:"(A) Flume 主要收集串流型的日誌資料；(C) Pig 是以 Pig Latin 腳本做資料轉換的高階語言；(D) Mahout 是機器學習函式庫。"},
{g:"spark",q:"關於 Apache Spark 的 RDD，下列敘述何者有誤？",o:["RDD 被切割成多個分區 (partition)，分散在叢集的節點上平行處理","RDD 透過血統 (lineage) 記錄轉換過程，節點故障時可重新計算遺失的分區","轉換 (transformation) 採延遲執行，直到遇到動作 (action) 才實際運算","RDD 建立後可以直接修改其中的元素值，以節省記憶體"],a:3,h:"RDD 有一個重要特性叫「不可變」。",e:"RDD 是不可變 (immutable) 的，任何轉換都會產生新的 RDD。不可變性正是 lineage 容錯機制能成立的前提。",w:"(A)(B)(C) 都是正確敘述：分區是平行運算的基本單位；Resilient 指的就是靠 lineage 重算容錯；Lazy evaluation 讓 Spark 先建立 DAG 再最佳化執行。"},
{g:"spark",q:"下列 Spark 操作中，何者屬於「動作 (action)」，會立即觸發實際運算？",o:["map()","filter()","flatMap()","count()"],a:3,h:"哪一個會回傳結果給 Driver，而不是產生新的 RDD？",e:"count() 回傳元素數量給 Driver，屬於 action。其他 action 還有 collect()、reduce()、saveAsTextFile() 等。",w:"(A) map()、(B) filter()、(C) flatMap() 都會產生新的 RDD，屬於 transformation，不會立即運算。"},
{g:"nosql",q:"下列 NoSQL 資料庫與其資料模型的配對，何者正確？",o:["Cassandra － 文件型 (Document)","Redis － 圖形型 (Graph)","MongoDB － 欄族型 (Column-family)","Neo4j － 圖形型 (Graph)"],a:3,h:"社群網路「朋友的朋友」查詢最適合哪一種？",e:"Neo4j 以節點與關係儲存資料，是代表性的圖形資料庫。",w:"(A) Cassandra 是欄族型；(B) Redis 是鍵值型 (Key-Value)；(C) MongoDB 是文件型 (BSON)。"},
{g:"nosql",q:"關於分散式系統的 CAP 定理，下列敘述何者正確？",o:["設計良好的分散式系統可以同時完全滿足一致性、可用性與分割容錯性","CAP 中的 A 代表原子性 (Atomicity)","發生網路分割時，系統必須在一致性與可用性之間做取捨","傳統關聯式資料庫的交易設計以 BASE 原則為核心"],a:2,h:"分散式系統中網路分割幾乎無法避免。",e:"CAP 三者最多同時滿足兩者；分散式系統必須容忍分割，因此實務上在 C 與 A 之間取捨（CP 或 AP）。",w:"(A) 違反 CAP 定理；(B) CAP 的 A 是 Availability，Atomicity 是 ACID 的 A；(D) 傳統 RDBMS 以 ACID 為核心，BASE 是許多 NoSQL 的原則。"},
{g:"nosql",q:"許多 NoSQL 系統遵循 BASE 原則，其中「E」代表下列何者？",o:["Eventually consistent（最終一致性）","Exactly once（恰好一次）","Encrypted storage（加密儲存）","Elastic scaling（彈性擴充）"],a:0,h:"BASE = Basically Available, Soft state, ……",e:"BASE 為 Basically Available、Soft state、Eventually consistent，允許短暫不一致，但最終收斂到一致。",w:"(B) Exactly once 是串流處理的訊息傳遞語意；(C) 加密是資安機制；(D) 彈性擴充是雲端特性，不是 BASE 的組成。"},
{g:"mr",q:"以 MapReduce 執行 word count，輸入兩行「a b a」與「b c a」。經過 Map 與 Shuffle/Sort 後，送入 Reducer 的鍵 a 之資料形式為何？",o:["(a, 3)","(a, 1)","(a, [1, 1, 1])","([a, a, a], 1)"],a:2,h:"Shuffle 會把相同的 key 聚集在一起，但還沒加總。",e:"Map 對每個字輸出 (字, 1)，a 共 3 次；Shuffle/Sort 彙整成 (a, [1, 1, 1]) 送入 Reducer，再加總輸出 (a, 3)。",w:"(A) 是 Reducer 的輸出；(B) 是 Map 的單筆輸出；(D) key 與 value 格式顛倒。"},
{g:"mr",q:"在 MapReduce 中加入 Combiner 的主要目的為何？",o:["在 Map 端先做局部彙總，以減少傳送到 Reducer 的網路資料量","完全取代 Reducer，使工作不再需要 Reduce 階段","負責將輸入檔案切割成 input split","決定每個 key 要送往哪一個 Reducer"],a:0,h:"它常被稱為「迷你 Reducer」。",e:"Combiner 在 Map 節點本地先合併相同 key 的中間結果，可大幅降低 Shuffle 的網路傳輸量。",w:"(B) Combiner 是可選的最佳化，不能取代 Reducer；(C) 切割輸入是 InputFormat 的工作；(D) 決定 key 去向的是 Partitioner。"},
{g:"dw",q:"分析人員在資料立方體中，由檢視「各年度」銷售總額改為檢視「各月份」銷售額，這屬於何種 OLAP 操作？",o:["上捲 (Roll-up)","下鑽 (Drill-down)","切片 (Slice)","旋轉 (Pivot)"],a:1,h:"從粗粒度到細粒度。",e:"從「年」到「月」是沿時間維度往更細的層級展開，屬於下鑽。",w:"(A) 上捲是反方向（月→年）；(C) 切片是固定某一維度的單一值；(D) 旋轉是改變維度排列方向，不改變粒度。"},
{g:"dw",q:"關於資料倉儲的星狀綱要 (Star Schema)，下列敘述何者有誤？",o:["事實表存放可量化的衡量值，例如銷售金額與數量","事實表透過外來鍵連結到各個維度表","星狀綱要的維度表通常高度正規化，以減少資料重複","雪花綱要可視為將星狀綱要的維度表進一步正規化的結果"],a:2,h:"星狀綱要追求的是查詢效率。",e:"星狀綱要的維度表通常是非正規化的，刻意保留冗餘以減少 JOIN；將維度表正規化拆分的是雪花綱要。",w:"(A)(B)(D) 皆為正確敘述。"},
{g:"dw",q:"關於資料湖 (Data Lake) 與資料倉儲 (Data Warehouse) 的比較，下列敘述何者正確？",o:["資料湖在資料寫入前就必須定義好綱要 (schema-on-write)","資料湖以原始格式儲存結構化、半結構化與非結構化資料，讀取時才套用綱要","資料倉儲主要存放未經處理的原始日誌與影音檔","資料湖只能儲存結構化資料"],a:1,h:"Schema-on-read 與 schema-on-write 各屬於哪一方？",e:"資料湖保留各種格式的原始資料，採 schema-on-read，彈性高。",w:"(A) schema-on-write 是資料倉儲的特性；(C) 資料倉儲存放經 ETL 清理後的結構化資料；(D) 資料湖可容納多種類型資料。"},
{g:"prep",q:"相較於傳統 ETL，ELT 流程的主要特色為何？",o:["資料先在獨立的轉換伺服器完成轉換，再載入目標系統","資料先載入目標系統，再利用目標平台的運算能力進行轉換","ELT 完全省略資料轉換步驟","ELT 只適用於小型的單機資料庫"],a:1,h:"注意字母順序：L 在 T 之前。",e:"ELT = Extract → Load → Transform，先載入雲端資料倉儲或資料湖，再用目標平台的平行運算力轉換。",w:"(A) 描述的是傳統 ETL；(C) ELT 仍有轉換，只是順序在後；(D) ELT 因雲端大規模平台興起，適用於大量資料。"},
{g:"prep",q:"下列何者最屬於半結構化資料 (semi-structured data)？",o:["欄位固定的員工薪資關聯式資料表","網路 API 回傳的 JSON 格式訂單資料","路口監視器錄下的影片","客服中心的通話錄音檔"],a:1,h:"有標籤或鍵值描述結構，但欄位不一定固定。",e:"JSON 以鍵值對與巢狀結構自我描述，屬於半結構化資料（XML、HTML 也是）。",w:"(A) 是結構化資料；(C) 影片與 (D) 錄音檔屬於非結構化資料。"},
{g:"mining",q:"某超市有 10 筆交易，含「麵包」6 筆、含「牛奶」5 筆、同時含兩者 3 筆。規則「麵包 → 牛奶」的提升度 (lift) 為何？",o:["0.3","0.5","0.6","1.0"],a:3,h:"Lift = Confidence(A→B) ÷ Support(B)。",e:"信賴度 = 3/6 = 0.5；牛奶支持度 = 5/10 = 0.5；Lift = 0.5 ÷ 0.5 = 1.0，表示兩者大致獨立。",w:"(A) 0.3 是規則支持度；(B) 0.5 是信賴度或牛奶支持度；(C) 0.6 是麵包支持度。"},
{g:"ml",q:"某分類模型的混淆矩陣為：TP = 40、FP = 10、FN = 20、TN = 130。召回率 (Recall) 約為何？",o:["0.800","0.667","0.850","0.727"],a:1,h:"Recall = TP ÷ (TP + FN)。",e:"Recall = 40 ÷ (40 + 20) = 0.667。",w:"(A) 是 Precision = 40/50；(C) 是 Accuracy = 170/200；(D) 是 F1-score。"},
{g:"ml",q:"模型出現過度擬合 (overfitting) 時，下列哪一種做法「不適合」用來改善？",o:["加入 L1 或 L2 正則化","在神經網路中使用 Dropout","增加訓練資料量並搭配提前停止 (early stopping)","大幅增加模型參數與隱藏層數量"],a:3,h:"過度擬合代表模型把雜訊也記住了。",e:"增加參數與層數會提高模型複雜度，反而加重過度擬合；這比較適合用來改善配適不足。",w:"(A)(B)(C) 皆為有效的改善方法：正則化懲罰大權重、Dropout 降低共適應、更多資料與提前停止提升泛化能力。"},
{g:"mining",q:"關於 K-means 分群演算法，下列敘述何者正確？",o:["需事先指定群數 k，且結果容易受到離群值影響","適合找出任意形狀（如環狀、月牙狀）的群集","屬於監督式學習，需要事先標記類別","不論初始中心點如何選取，最終結果都完全相同"],a:0,h:"群中心是用「平均值」計算的。",e:"K-means 必須先給定 k；群中心是平均值，極端值會把中心拉偏。",w:"(B) 任意形狀群集應使用 DBSCAN；(C) 分群屬於非監督式學習；(D) 初始中心不同可能收斂到不同的局部最佳解。"},
{g:"ml",q:"關於主成分分析 (PCA)，下列敘述何者有誤？",o:["第一主成分是資料變異量最大的方向","各主成分之間彼此正交 (互不相關)","PCA 屬於監督式學習，必須使用類別標籤進行降維","變數尺度差異大時，通常先標準化再進行 PCA"],a:2,h:"PCA 只看資料本身的變異結構。",e:"PCA 是非監督式降維，不需要類別標籤；需要標籤的是 LDA。",w:"(A)(B)(D) 皆為正確敘述。"},
{g:"cloud",q:"下列雲端服務與其服務模式的配對，何者正確？",o:["Gmail － IaaS","AWS EC2 － SaaS","Google App Engine － PaaS","Dropbox － PaaS"],a:2,h:"PaaS 提供讓開發者部署程式的平台。",e:"Google App Engine 讓開發者上傳程式即可執行，不需管理作業系統，屬於 PaaS。",w:"(A) Gmail 是 SaaS；(B) AWS EC2 是 IaaS；(D) Dropbox 是 SaaS。"},
{g:"cloud",q:"某電商需即時收集每秒數萬筆點擊事件，並以發佈／訂閱方式供多個下游系統使用，最適合採用下列何者？",o:["Apache Kafka","Apache Hive","Apache Sqoop","Apache HBase"],a:0,h:"關鍵字是「即時串流」與「發佈／訂閱」。",e:"Kafka 是分散式訊息佇列與串流平台，以 topic 發佈／訂閱，具高吞吐量與持久化能力。",w:"(B) Hive 是批次的類 SQL 資料倉儲工具；(C) Sqoop 用於批次搬移；(D) HBase 是欄族型資料庫，不是訊息平台。"},
{g:"privacy",q:"在巨量資料隱私保護技術中，「k-匿名 (k-anonymity)」的意義為何？",o:["以金鑰長度為 k 位元的演算法將資料全部加密","每筆紀錄在準識別欄位上，至少與其他 k－1 筆紀錄無法區分","刪除資料集中所有含個人資料的欄位，只保留 k 個欄位","在查詢結果中加入隨機雜訊，使個別紀錄的影響受到控制"],a:1,h:"重點在於「躲在一群人之中」。",e:"k-匿名透過概括化或抑制處理準識別欄位，使每筆紀錄至少與 k－1 筆相同，降低再識別風險。",w:"(A) 加密是保密技術；(C) 單純刪欄位不是 k-匿名的定義；(D) 加入雜訊是差分隱私的做法。"}
]},
{id:"e2",title:"模擬測驗 2",qs:[
{g:"basic",q:"某停車場的監視器全天候錄影，一年累積大量影片，但真正對調查有幫助的畫面只有幾分鐘。這最能說明巨量資料的哪一項特性？",o:["Velocity：資料產生速度快","Value：價值密度低，需經分析才能萃取價值","Variety：資料型態多樣","Volume：資料量需以 PB 為單位"],a:1,h:"重點在「有用的部分佔比很少」。",e:"Value 強調巨量資料的價值密度低：資料總量大，但有價值的部分比例很小，必須經過篩選與分析才能萃取。",w:"(A) 題目沒有強調產生或處理速度；(C) 資料型態只有影片一種；(D) 量大是背景條件，但題目重點是有用資料佔比低，而且並未說明達到 PB。"},
{g:"hadoop",q:"一個 300 GB 的檔案存入 HDFS，副本數 (replication factor) 設為 3，區塊大小 128 MB。此檔案實際佔用叢集的總儲存空間約為多少？",o:["300 GB","600 GB","900 GB","1.2 TB"],a:2,h:"每個區塊都會被複製成 3 份。",e:"每個區塊存 3 份，總空間約為 300 GB × 3 = 900 GB。區塊大小只影響切成幾塊（300 × 1,024 ÷ 128 = 2,400 塊），不會改變總容量。",w:"(A) 只算了一份資料，忽略副本；(B) 只算了 2 份；(D) 多算了一份，或誤把區塊大小加進計算。"},
{g:"hadoop",q:"Hadoop 2.x 及 3.x 中，HDFS 預設的區塊 (block) 大小為下列何者？",o:["4 KB","64 MB","128 MB","1 GB"],a:2,h:"Hadoop 1.x 是 64 MB，之後加倍。",e:"Hadoop 2.x 起預設區塊為 128 MB。大區塊可以減少 NameNode 要管理的中繼資料數量，並降低尋址時間佔總傳輸時間的比例。",w:"(A) 4 KB 是一般本機檔案系統常見的區塊大小；(B) 64 MB 是 Hadoop 1.x 的預設值；(D) 1 GB 不是預設值，但可以自行調整。"},
{g:"hadoop",q:"關於 Apache Hive，下列敘述何者有誤？",o:["使用者可用類似 SQL 的 HiveQL 查詢 HDFS 上的資料","HiveQL 會被轉換成 MapReduce、Tez 或 Spark 等作業執行","Hive 適合處理大量歷史資料的批次分析","Hive 最適合用於高頻率、低延遲的單筆交易新增與修改 (OLTP)"],a:3,h:"Hive 的定位是資料倉儲工具。",e:"Hive 是建構在 Hadoop 上的資料倉儲工具，查詢延遲較高，適合批次分析 (OLAP)，不適合需要毫秒級回應的單筆交易處理。",w:"(A)(B)(C) 皆為正確敘述：HiveQL 類似 SQL；底層會轉成分散式運算作業；擅長大量資料的批次查詢。"},
{g:"hadoop",q:"關於 HBase，下列敘述何者正確？",o:["HBase 是關聯式資料庫，完整支援標準 SQL 的多表 JOIN","HBase 參考 Google BigTable 的設計，建構於 HDFS 之上，支援大量資料的隨機即時讀寫","HBase 是圖形資料庫，以節點與邊表示資料","HBase 的資料只存在記憶體中，關機後就會遺失"],a:1,h:"它是 Hadoop 生態系中的欄族型資料庫。",e:"HBase 是欄族型 NoSQL 資料庫，以 BigTable 為藍本、以 HDFS 為底層儲存，彌補 HDFS 只適合循序批次讀取、不擅長隨機存取的弱點。",w:"(A) HBase 不是關聯式資料庫，本身不支援標準 SQL JOIN；(C) 圖形資料庫的代表是 Neo4j；(D) HBase 的資料會持久化寫入 HDFS，並以 WAL 日誌防止遺失。"},
{g:"spark",q:"下列 Spark 元件與功能的配對，何者有誤？",o:["Spark SQL － 以 SQL 或 DataFrame 處理結構化資料","Spark Streaming － 處理即時串流資料","MLlib － 提供機器學習演算法函式庫","GraphX － 提供深度學習的影像辨識模型"],a:3,h:"GraphX 的 Graph 指的是「圖」的結構。",e:"GraphX 是圖形運算函式庫，用於 PageRank、社群偵測等以節點和邊表示的圖形分析，並不是影像辨識模型。",w:"(A)(B)(C) 皆為正確配對。"},
{g:"spark",q:"下列 Spark 操作中，何者屬於寬依賴 (wide dependency)，通常會引發 shuffle？",o:["map()","filter()","groupByKey()","union()"],a:2,h:"需要把相同 key 的資料從各分區集中起來的操作。",e:"groupByKey() 必須把分散在各分區、key 相同的資料重新分配到同一分區，屬於寬依賴，會產生跨節點的 shuffle。reduceByKey()、join() 也常屬於這一類。",w:"(A) map() 與 (B) filter() 都是一對一處理同一分區內的元素，屬於窄依賴；(D) union() 只是把兩個 RDD 的分區合併在一起，不需要重新分配資料，也屬於窄依賴。"},
{g:"spark",q:"執行需要多次迭代的機器學習演算法時，Spark 通常比 Hadoop MapReduce 快很多，主要原因為何？",o:["Spark 可將中間結果保留在記憶體中重複使用，減少磁碟讀寫","Spark 不需要叢集，只在單一機器上執行","Spark 取代了 HDFS，自己擁有更快的檔案系統","Spark 只能處理小型資料，所以速度較快"],a:0,h:"MapReduce 每一輪都要寫回磁碟。",e:"MapReduce 每個作業結束都會把結果寫回 HDFS，下一輪迭代再重新讀取；Spark 則可用 cache()／persist() 把資料保留在記憶體，大幅減少 I/O。",w:"(B) Spark 是為分散式叢集設計的；(C) Spark 本身沒有儲存系統，常搭配 HDFS、S3 等使用；(D) Spark 正是用來處理大量資料的框架。"},
{g:"nosql",q:"關於 MongoDB，下列敘述何者有誤？",o:["以類似 JSON 的 BSON 格式儲存文件","支援以分片 (sharding) 進行水平擴充","同一集合 (collection) 中的所有文件，欄位結構都必須完全相同","屬於文件型 NoSQL 資料庫"],a:2,h:"文件型資料庫最大的特色是綱要彈性。",e:"MongoDB 採彈性綱要 (schema-less)，同一集合中的文件可以有不同的欄位，因此適合快速變動的資料結構。",w:"(A)(B)(D) 皆為正確敘述。"},
{g:"nosql",q:"下列何者屬於「水平擴充 (scale-out)」的做法？",o:["將單一伺服器的 CPU 升級為更多核心","將單一伺服器的記憶體從 64 GB 擴充到 512 GB","增加多台一般等級的伺服器組成叢集，共同分擔資料與運算","把傳統硬碟更換為 SSD"],a:2,h:"水平是「加機器」，垂直是「把機器變強」。",e:"水平擴充是增加節點數量分擔負載，理論上可近乎線性擴展，也是 Hadoop 與 NoSQL 的設計核心。",w:"(A)(B)(D) 都是提升單一機器的硬體規格，屬於垂直擴充 (scale-up)，會受到單機硬體上限與成本限制。"},
{g:"nosql",q:"某社群平台依使用者 ID 的範圍，將資料分別存放在不同的資料庫節點上，以分散讀寫負載。此技術稱為下列何者？",o:["複寫 (Replication)","分片 (Sharding)","正規化 (Normalization)","快取 (Caching)"],a:1,h:"每個節點只保存「一部分」資料。",e:"分片是依分片鍵 (shard key) 將資料水平切割，分散到不同節點，每個節點只負責一部分資料。",w:"(A) 複寫是把相同資料複製到多個節點，提高可用性與容錯，不是分散不同資料；(C) 正規化是關聯式資料庫減少重複的設計方法；(D) 快取是把熱門資料暫存在高速儲存中，加快讀取。"},
{g:"cloud",q:"Lambda 架構常用於同時兼顧批次與即時分析。下列何者「不是」Lambda 架構的組成層？",o:["批次層 (Batch layer)","速度層 (Speed layer)","服務層 (Serving layer)","交易層 (Transaction layer)"],a:3,h:"Lambda 架構共有三層。",e:"Lambda 架構由批次層（處理完整歷史資料）、速度層（處理即時資料以彌補延遲）與服務層（合併兩者結果供查詢）組成。",w:"(A)(B)(C) 都是 Lambda 架構的組成層；交易層並不在 Lambda 架構中。"},
{g:"cloud",q:"串流處理系統每 5 分鐘統計一次交易筆數，且每個統計區間互不重疊（0–5、5–10、10–15 分鐘……）。此種視窗稱為下列何者？",o:["滑動視窗 (Sliding window)","會話視窗 (Session window)","滾動視窗 (Tumbling window)","全域視窗 (Global window)"],a:2,h:"視窗像滾動的輪子，一格接一格不重疊。",e:"滾動視窗的大小固定且彼此不重疊，每筆資料只屬於一個視窗。",w:"(A) 滑動視窗的區間會重疊，例如每 1 分鐘計算一次過去 5 分鐘；(B) 會話視窗依使用者活動的間隔切分，大小不固定；(D) 全域視窗把所有資料放在同一個視窗，需要自訂觸發條件。"},
{g:"prep",q:"某變數的第一四分位數 Q1 = 20、第三四分位數 Q3 = 40。若以 1.5 × IQR 規則判斷離群值，下列哪一個數值會被視為離群值？",o:["25","55","68","75"],a:3,h:"上界 = Q3 + 1.5 × IQR。",e:"IQR = 40 − 20 = 20；上界 = 40 + 1.5 × 20 = 70；下界 = 20 − 30 = −10。只有 75 超出上界。",w:"(A) 25 落在 Q1 與 Q3 之間；(B) 55 與 (C) 68 雖然大於 Q3，但都還在上界 70 以內，不算離群值。"},
{g:"prep",q:"某欄位的最小值為 20、最大值為 120。以 Min-Max 正規化將資料轉換到 [0, 1] 區間，原始值 60 轉換後為何？",o:["0.33","0.40","0.50","0.60"],a:1,h:"(x − min) ÷ (max − min)。",e:"(60 − 20) ÷ (120 − 20) = 40 ÷ 100 = 0.40。",w:"(A) 0.33 可能是誤算成 40 ÷ 120；(C) 0.50 可能是誤用 60 ÷ 120；(D) 0.60 可能是誤用 60 ÷ 100，忘了先減掉最小值。"},
{g:"dw",q:"下列何者屬於線上分析處理 (OLAP) 系統的特性？",o:["大量短小的交易，需要即時新增、修改與刪除","資料表高度正規化，以避免更新異常","以歷史彙總資料支援複雜的多維度分析查詢","主要使用者是第一線櫃台人員，處理日常作業"],a:2,h:"OLAP 是給決策分析用的。",e:"OLAP 以資料倉儲中整合過的歷史資料為基礎，查詢多為讀取與彙總，支援管理者進行多維度的決策分析。",w:"(A)(B)(D) 都是 OLTP（線上交易處理）的特性：交易頻繁、強調正規化與資料一致性、服務日常作業。"},
{g:"dw",q:"分析師在銷售資料立方體中，只想看「2025 年」、「北區與中區」、「家電類」的資料，同時對三個維度設定條件取出子立方體。這屬於何種 OLAP 操作？",o:["切片 (Slice)","切塊 (Dice)","上捲 (Roll-up)","下鑽 (Drill-down)"],a:1,h:"條件不只一個維度。",e:"切塊是在兩個以上的維度設定條件，取出一個較小的子立方體。",w:"(A) 切片只固定「一個」維度的單一值；(C) 上捲是往較粗的層級彙總；(D) 下鑽是往較細的層級展開，兩者都沒有篩選子集的意思。"},
{g:"mining",q:"以 Apriori 演算法探勘時，頻繁 2-項目集只有 {A,B}、{A,C}、{B,C}、{B,D}。下列哪一個 3-項目集在剪枝後仍會保留為候選？",o:["{A, B, C}","{A, B, D}","{B, C, D}","{A, C, D}"],a:0,h:"候選集的每一個 2-子集都必須是頻繁的。",e:"依據反單調性，頻繁項目集的所有子集也必須頻繁。{A,B,C} 的子集 {A,B}、{A,C}、{B,C} 都是頻繁的，所以保留。",w:"(B) 子集 {A,D} 不頻繁；(C) 子集 {C,D} 不頻繁；(D) 子集 {A,D} 與 {C,D} 都不頻繁，三者都會被剪枝。"},
{g:"ml",q:"決策樹的某個節點共有 8 筆資料，其中 6 筆屬於「是」、2 筆屬於「否」。此節點的 Gini 不純度為何？",o:["0.250","0.375","0.500","0.625"],a:1,h:"Gini = 1 − Σ pᵢ²。",e:"p(是) = 0.75、p(否) = 0.25；Gini = 1 − (0.75² + 0.25²) = 1 − 0.625 = 0.375。",w:"(A) 0.25 只是 p(否) 本身；(C) 0.5 是兩類各半時的最大 Gini 值；(D) 0.625 是 Σ pᵢ²，忘了用 1 去減。"},
{g:"ml",q:"下列哪一項任務最適合使用非監督式學習？",o:["依據過去標記好的郵件判斷新郵件是否為垃圾郵件","根據坪數、屋齡與地段預測房價","在沒有事先定義類別的情況下，依消費行為將顧客分成若干群","依據歷史資料預測客戶下個月是否會流失"],a:2,h:"關鍵在於資料有沒有「標準答案」。",e:"沒有預先定義類別、讓演算法自行找出相似群組，屬於分群，是典型的非監督式學習。",w:"(A) 與 (D) 有已知標籤，屬於監督式的分類問題；(B) 預測連續數值，屬於監督式的迴歸問題。"},
{g:"ml",q:"關於 5 折交叉驗證 (5-fold cross validation)，下列敘述何者正確？",o:["資料分成 5 份，每份輪流當一次驗證集，共訓練與評估 5 次模型","只把資料分成訓練集與測試集，並且只評估一次","用訓練資料直接測試模型，就能得到可靠的泛化表現","交叉驗證的目的是增加資料筆數"],a:0,h:"每一份資料都有機會當驗證集。",e:"k 折交叉驗證把資料分成 k 份，每次用 k−1 份訓練、1 份驗證，重複 k 次後取平均，可更穩定地估計泛化能力。",w:"(B) 描述的是單次的 hold-out 驗證；(C) 用訓練資料測試會高估表現，無法看出過度擬合；(D) 交叉驗證並不會增加資料量，只是更有效率地利用既有資料。"},
{g:"ml",q:"某信用卡詐欺資料中，99% 為正常交易、1% 為詐欺。某模型把所有交易都判為正常，準確率達 99%。下列敘述何者最正確？",o:["準確率 99%，代表模型表現優異，可以直接上線","此模型的召回率為 0，應改用召回率、F1 或 PR 曲線等指標評估","應直接刪除少數的詐欺樣本，讓資料更單純","類別不平衡不會影響模型訓練與評估"],a:1,h:"它抓到了幾筆詐欺？",e:"模型一筆詐欺都沒抓到，TP = 0，所以召回率為 0。類別不平衡時，準確率容易誤導，應改看召回率、F1、PR-AUC，並可搭配過採樣、欠採樣或調整類別權重。",w:"(A) 高準確率只是反映多數類別的比例；(C) 刪掉詐欺樣本會讓模型完全學不到要偵測的目標；(D) 類別不平衡會讓模型偏向多數類別，影響很大。"},
{g:"ml",q:"下列深度學習模型與其主要用途的配對，何者正確？",o:["CNN － 專門找出購物籃中的關聯規則","LSTM － 處理時間序列等序列資料，改善長期依賴問題","K-means － 用來生成擬真影像的深度生成模型","Transformer － 以卷積層取代注意力機制"],a:1,h:"LSTM 是一種改良的 RNN。",e:"LSTM 以輸入閘、遺忘閘、輸出閘控制資訊流動，緩解 RNN 的梯度消失，適合處理文字、語音、時間序列等序列資料。",w:"(A) CNN 主要用於影像等具有空間結構的資料，關聯規則用的是 Apriori 等演算法；(C) K-means 是分群演算法，生成影像的是 GAN、擴散模型等；(D) Transformer 的核心正是自注意力機制，不是卷積。"},
{g:"cloud",q:"某醫院將病歷等敏感資料保留在院內自建的雲端環境，掛號系統遇到流量尖峰時再租用公有雲資源支援。此種部署方式稱為下列何者？",o:["公有雲 (Public cloud)","私有雲 (Private cloud)","混合雲 (Hybrid cloud)","社群雲 (Community cloud)"],a:2,h:"同時使用了兩種雲。",e:"混合雲結合私有雲與公有雲，敏感資料留在私有環境，尖峰時再借用公有雲的彈性資源 (cloud bursting)。",w:"(A) 只使用公有雲；(B) 只使用私有雲；(D) 社群雲是由多個需求相似的組織共同建置與使用的雲端。"},
{g:"privacy",q:"依據歐盟《一般資料保護規則》(GDPR)，當事人在符合條件時要求企業刪除其個人資料的權利，一般稱為下列何者？",o:["資料可攜權","被遺忘權（刪除權）","資料近用權","限制處理權"],a:1,h:"讓網路上的資料「被忘記」。",e:"GDPR 第 17 條規定刪除權，常稱為被遺忘權：資料已無蒐集必要、當事人撤回同意等情形下，可要求控管者刪除其個資。",w:"(A) 資料可攜權是要求以通用格式取得或轉移自己的資料；(C) 資料近用權是查詢與取得自己被處理的資料；(D) 限制處理權是要求暫停或限制處理，但資料不一定刪除。"}
]},
{id:"e3",title:"模擬測驗 3",qs:[
{"g":"basic","q":"Google 流感趨勢 (Google Flu Trends) 曾以搜尋關鍵字預測流感病例，後來卻多次大幅高估實際病例數。此案例最主要提醒巨量資料分析的何種風險？","o":["資料量太少，無法建立模型","搜尋資料無法被數位化儲存","只依賴相關性而缺乏校正，搜尋行為受媒體報導等因素干擾，使模型失準","伺服器運算速度太慢，來不及即時預測"],"a":2,"h":"搜尋「流感」的人不一定真的得了流感。","e":"搜尋量與病例數只是相關，並非因果。媒體大量報導、搜尋引擎演算法改變都會影響搜尋行為，若只依賴相關性又沒有用傳統監測資料持續校正，模型就會失準。這也提醒我們資料量大不代表資料具代表性。","w":"(A) Google 擁有的搜尋資料量非常龐大；(B) 搜尋紀錄本來就是數位資料；(D) 問題出在預測偏誤，不是運算速度。"},
{"g":"basic","q":"某工廠有 1,000 個感測器，每個感測器每秒產生 1 KB 的資料。一天 (24 小時) 累積的資料量約為多少？","o":["約 8.6 GB","約 86 GB","約 864 GB","約 8.6 TB"],"a":1,"h":"一天有 86,400 秒。","e":"1 KB × 1,000 × 86,400 秒 = 86,400,000 KB。以 1,000 進位約為 86.4 GB，以 1,024 進位約為 82.4 GB，都最接近 86 GB。","w":"(A) 少算了 10 倍，可能把一天算成 8,640 秒；(C) 多算了 10 倍；(D) 多算了 100 倍，可能把 KB 與 MB 弄混。"},
{"g":"hadoop","q":"HDFS 在副本數為 3 時，預設的機架感知 (rack awareness) 副本放置策略為何？","o":["第一份放在寫入端所在節點，第二份放在不同機架，第三份放在與第二份相同機架的另一個節點","三份副本都放在同一個機架，以加快傳輸速度","三份副本分別放在三個不同的資料中心","副本位置完全隨機，與機架無關"],"a":0,"h":"要同時兼顧容錯與網路頻寬。","e":"預設策略讓資料分布在兩個機架：即使整個機架故障仍有副本可用；同時只有一次跨機架傳輸，節省機架間的頻寬。","w":"(B) 同一機架故障時三份會同時遺失，失去容錯意義；(C) HDFS 預設的副本策略是以機架為單位，不是跨資料中心；(D) HDFS 會依機架拓撲刻意安排位置，並非隨機。"},
{"g":"hadoop","q":"在 HDFS 高可用 (HA) 架構中，負責協助偵測 Active NameNode 故障並自動切換到 Standby NameNode 的協調服務為何？","o":["Oozie","Flume","Pig","ZooKeeper"],"a":3,"h":"這個元件的名字和「動物園管理員」有關。","e":"ZooKeeper 提供分散式協調服務。HDFS HA 透過 ZKFC (ZKFailoverController) 搭配 ZooKeeper 監控 NameNode 狀態，並在故障時選出新的 Active NameNode。","w":"(A) Oozie 是工作流程排程器；(B) Flume 用於收集日誌資料；(C) Pig 是資料處理的腳本語言，三者都不負責故障切換。"},
{"g":"hadoop","q":"關於 HDFS 的設計特性，下列敘述何者有誤？","o":["採「一次寫入、多次讀取」的存取模式","重視高吞吐量 (throughput) 更甚於低延遲","可以部署在一般商用等級的硬體上","支援在檔案任意位置隨機改寫內容，適合頻繁的小筆更新"],"a":3,"h":"HDFS 為大型檔案的循序讀取而設計。","e":"HDFS 檔案寫入後不能在中間位置改寫，只支援在檔尾附加 (append)。需要隨機讀寫的情境應使用 HBase 等資料庫。","w":"(A)(B)(C) 皆為 HDFS 的正確設計特性。"},
{"g":"mr","q":"某 MapReduce 作業設定了 4 個 Reducer，執行完成後，在輸出目錄中通常會產生幾個結果檔 (如 part-r-00000)？","o":["1 個","4 個","與 Mapper 的數量相同","與輸入檔案的區塊數相同"],"a":1,"h":"每個 Reducer 各自寫出自己的結果。","e":"每個 Reducer 會輸出一個結果檔，所以 4 個 Reducer 產生 part-r-00000 到 part-r-00003 共 4 個檔案。","w":"(A) 只有設定 1 個 Reducer 時才會只有 1 個檔；(C)(D) Mapper 數量通常由輸入區塊數決定，但只有在沒有 Reducer 的 map-only 作業時，輸出檔數才會等於 Mapper 數。"},
{"g":"mr","q":"MapReduce 排程 Map 任務時，會優先把任務分派到存放該資料區塊的節點上執行。此設計原則稱為下列何者？","o":["負載平衡 (Load balancing)","推測執行 (Speculative execution)","資料本地性 (Data locality)","檢查點 (Checkpoint)"],"a":2,"h":"「移動運算比移動資料便宜」。","e":"資料本地性是把程式送到資料所在處執行，避免透過網路搬移大量資料，是 Hadoop 能有效處理巨量資料的關鍵設計。","w":"(A) 負載平衡是平均分配工作量；(B) 推測執行是針對落後任務另開備份；(D) 檢查點是定期保存狀態以便故障復原。"},
{"g":"mr","q":"某個 Map 任務因所在節點效能不佳而明顯落後，框架便在另一個節點啟動相同任務，並採用先完成者的結果。此機制稱為下列何者？","o":["推測執行 (Speculative execution)","資料本地性","Combiner 合併","分區 (Partitioning)"],"a":0,"h":"框架「猜測」這個任務會拖累整體進度。","e":"推測執行針對落後任務 (straggler) 啟動備份，兩者誰先完成就採用誰的結果，避免少數慢節點拖慢整個作業。","w":"(B) 資料本地性與排程位置有關，不處理落後任務；(C) Combiner 是在 Map 端做局部彙總；(D) 分區是決定 key 送往哪個 Reducer。"},
{"g":"spark","q":"關於 Spark 的 DataFrame，下列敘述何者正確？","o":["DataFrame 不能使用 SQL 語法進行查詢","DataFrame 只能在單一機器上執行","RDD 在任何情況下都比 DataFrame 執行得更快","DataFrame 具有欄位結構 (schema)，可透過 Catalyst 最佳化器自動最佳化查詢"],"a":3,"h":"DataFrame 就像分散式的資料表。","e":"DataFrame 以具名欄位組織資料，Spark 能利用 schema 資訊，透過 Catalyst 最佳化器與 Tungsten 執行引擎自動最佳化，通常比直接操作 RDD 更有效率。","w":"(A) DataFrame 可註冊成暫存表後用 Spark SQL 查詢；(B) DataFrame 與 RDD 一樣是分散式資料集；(C) 因為有最佳化器，DataFrame 經常比手寫 RDD 更快。"},
{"g":"spark","q":"執行迭代演算法時，同一份 RDD 會被反覆使用多次。為避免每次都從頭重新計算，最適合呼叫下列哪一個方法？","o":["cache()","collect()","saveAsTextFile()","count()"],"a":0,"h":"把資料「留在記憶體」。","e":"cache()（或 persist()）會在第一次計算後把 RDD 保存在記憶體，之後的迭代直接重複使用，省去重新計算與讀取磁碟的成本。","w":"(B) collect() 會把所有資料拉回 Driver，資料量大時可能造成記憶體不足；(C) saveAsTextFile() 是把結果寫出到儲存系統；(D) count() 只是計算筆數的 action，不會保存資料。"},
{"g":"spark","q":"關於 Spark 應用程式中 Driver 與 Executor 的分工，下列敘述何者有誤？","o":["Driver 執行主程式並建立 SparkContext 或 SparkSession","Driver 將程式轉換為 DAG，並切分成 stage 與 task 進行排程","Executor 在工作節點上執行 task，並可快取資料","Executor 負責將整個程式轉換為 DAG，並排程所有節點的任務"],"a":3,"h":"誰是指揮官，誰是執行者？","e":"建立 DAG 與排程任務是 Driver 的工作；Executor 只負責執行分配到的 task 並回報結果。","w":"(A)(B)(C) 皆為正確敘述。"},
{"g":"nosql","q":"某電商網站希望把熱門商品資訊與購物車資料放在記憶體中，以毫秒等級回應大量讀取，最適合採用下列何者？","o":["Neo4j","Hive","Redis","HDFS"],"a":2,"h":"記憶體型的鍵值資料庫。","e":"Redis 是以記憶體為主的鍵值資料庫，讀寫延遲極低，常用於快取、工作階段 (session)、排行榜與計數器。","w":"(A) Neo4j 是圖形資料庫，擅長關係查詢；(B) Hive 偏向高延遲的批次分析；(D) HDFS 是分散式檔案系統，重視吞吐量而非低延遲。"},
{"g":"nosql","q":"許多分散式資料庫採用一致性雜湊 (consistent hashing) 來分配資料，其主要好處為何？","o":["保證所有節點的資料完全一致","讓所有資料都集中存放在同一個節點","讓資料自動加密，提升安全性","新增或移除節點時，只需要重新分配少部分資料"],"a":3,"h":"想想節點變動時，要搬多少資料。","e":"一致性雜湊把節點與資料對應到同一個雜湊環上。節點增減時，只影響環上相鄰區段的資料，不必像一般取餘數雜湊那樣大量重新分配。","w":"(A) 名稱中的「一致性」指的是對應關係穩定，不是資料複本一致；(B) 目的正是把資料分散到多個節點；(C) 雜湊用於定位資料，不是加密。"},
{"g":"nosql","q":"某分散式資料庫的每筆資料有 N = 3 份副本。若寫入時需 W = 2 份副本確認，為確保讀取一定能讀到最新寫入的值，讀取時至少需要讀取幾份副本 (R)？","o":["0","1","2","3"],"a":2,"h":"條件是 R + W > N。","e":"當 R + W > N 時，讀取與寫入的副本集合必定重疊，至少會讀到一份最新的資料。N = 3、W = 2，所以 R > 1，至少為 2。","w":"(A)(B) R + W ≤ 3，讀取的副本可能剛好都是尚未更新的那一份；(D) R = 3 也能保證，但不是「至少」所需的最小值。"},
{"g":"dw","q":"某客戶搬家後更新了地址，資料倉儲希望保留舊地址的歷史，以便分析不同時期的銷售。依據緩慢變化維度 (SCD) 的做法，最適合採用下列何者？","o":["Type 2：新增一筆維度紀錄，並以有效期間或目前版本旗標區分新舊資料","Type 1：直接以新地址覆寫舊地址","Type 3：只新增一個「前一個地址」欄位，保留最近一次的舊值","直接刪除舊紀錄，只保留新地址"],"a":0,"h":"題目要求「保留完整歷史」。","e":"SCD Type 2 每次變更都新增一列，搭配生效與失效日期或代理鍵，可完整保留所有歷史版本。","w":"(B) Type 1 覆寫後就失去歷史；(C) Type 3 只能保留有限的前一個值，無法保留完整歷史；(D) 刪除舊紀錄同樣會失去歷史。"},
{"g":"dw","q":"關於資料市集 (Data Mart)，下列敘述何者正確？","o":["資料市集的範圍必定大於企業級資料倉儲","資料市集是針對特定部門或主題建置的小型資料倉儲","資料市集主要用於處理日常的線上交易","資料市集只能存放非結構化資料"],"a":1,"h":"Mart 是「市場、商店」，規模比倉庫小。","e":"資料市集聚焦單一部門或主題，例如行銷或財務，資料可來自企業資料倉儲，也可直接由來源系統整合，查詢更聚焦、建置也較快。","w":"(A) 資料市集通常是資料倉儲的子集合，範圍較小；(C) 日常交易屬於 OLTP 系統；(D) 資料市集與資料倉儲一樣，以整理過的結構化資料為主。"},
{"g":"prep","q":"某「年所得」欄位呈現明顯的右偏分布，且有部分缺失值。若要補值，使用下列哪一個統計量較不受極端值影響？","o":["平均數","最大值","中位數","全距"],"a":2,"h":"右偏代表有少數極大的值。","e":"中位數只看資料的位置，不受少數極端高所得影響，在偏態分布中比平均數更能代表典型值。","w":"(A) 平均數會被極大值往上拉；(B) 最大值顯然不具代表性；(D) 全距是離散程度的統計量，不能拿來代表典型數值。"},
{"g":"prep","q":"某次測驗的平均數為 70 分、標準差為 8 分。小明得到 82 分，他的 Z 分數 (Z-score) 為何？","o":["0.67","1.5","1.2","12"],"a":1,"h":"Z = (x − μ) ÷ σ。","e":"Z = (82 − 70) ÷ 8 = 12 ÷ 8 = 1.5，代表小明的分數比平均高 1.5 個標準差。","w":"(A) 0.67 是誤算成 8 ÷ 12；(C) 1.2 可能是 12 ÷ 10 之類的誤算；(D) 12 只是與平均數的差距，忘了除以標準差。"},
{"g":"prep","q":"某欄位「城市」有臺北、臺中、高雄三種類別，彼此沒有大小順序。若要輸入線性迴歸模型，較適合的編碼方式為何？","o":["標籤編碼：臺北 = 1、臺中 = 2、高雄 = 3","獨熱編碼 (One-hot encoding)，每個類別各用一個 0/1 欄位表示","直接刪除這個欄位","把三個城市的名稱長度當作數值"],"a":1,"h":"標籤編碼會讓模型以為 3 比 1 大。","e":"名目尺度資料沒有大小順序，獨熱編碼可避免模型誤判順序或距離。實務上常刪去其中一欄作為基準類別 (dummy coding)，以避免完全共線性。","w":"(A) 會讓模型誤以為高雄是臺北的 3 倍，或存在等距關係；(C) 直接刪除會失去可能有用的資訊；(D) 名稱長度與城市特性無關，沒有意義。"},
{"g":"mining","q":"關於 DBSCAN 分群演算法，下列敘述何者正確？","o":["必須事先指定群數 k","每一個資料點最後一定會被分到某一群","只能找出球狀的群集","以半徑 ε 與最少點數 MinPts 定義密度，能找出任意形狀的群並辨識雜訊點"],"a":3,"h":"DBSCAN 的 D 是 Density（密度）。","e":"DBSCAN 把半徑 ε 內至少有 MinPts 個點的點視為核心點，由核心點向外擴張成群，不需指定群數，能找出不規則形狀的群，並把密度不足的點標為雜訊。","w":"(A) 需要指定 k 的是 K-means；(B) DBSCAN 會把不屬於任何群的點標記為雜訊 (noise)；(C) 只擅長球狀群的也是 K-means。"},
{"g":"mining","q":"在階層式分群中，若以「兩群之間距離最近的兩個點」的距離作為群間距離，此方法稱為下列何者？","o":["單一連結法 (Single linkage)","完全連結法 (Complete linkage)","平均連結法 (Average linkage)","華德法 (Ward's method)"],"a":0,"h":"只看「最近」的那一對點。","e":"單一連結法取兩群間最近點對的距離，容易形成細長的鏈狀群 (chaining effect)。","w":"(B) 完全連結法取最遠點對的距離；(C) 平均連結法取所有點對距離的平均；(D) 華德法以合併後組內變異增加量最小為準則。"},
{"g":"ml","q":"某分類模型的混淆矩陣為：TP = 30、FP = 20、FN = 10、TN = 180。此模型的特異度 (Specificity) 為何？","o":["0.60","0.75","0.84","0.90"],"a":3,"h":"Specificity = TN ÷ (TN + FP)，也就是實際為負的資料中，正確判為負的比例。","e":"Specificity = 180 ÷ (180 + 20) = 0.90。","w":"(A) 0.60 是 Precision = 30 ÷ 50；(B) 0.75 是 Recall = 30 ÷ 40；(C) 0.84 是 Accuracy = 210 ÷ 250。"},
{"g":"ml","q":"關於集成學習 (Ensemble learning) 中的 Bagging 與 Boosting，下列敘述何者正確？","o":["隨機森林屬於 Boosting 方法","Bagging 以自助抽樣平行訓練多個模型；Boosting 依序訓練模型，並加重前一個模型分錯的樣本","Boosting 中的每個模型都完全獨立平行訓練，彼此互不影響","Bagging 主要用來降低模型的偏差 (bias)，而非變異 (variance)"],"a":1,"h":"一個是「平行」，一個是「接力」。","e":"Bagging（如隨機森林）透過自助抽樣 (bootstrap) 平行訓練再投票或平均，主要降低變異；Boosting（如 AdaBoost、XGBoost）依序訓練，讓後面的模型修正前面的錯誤，主要降低偏差。","w":"(A) 隨機森林屬於 Bagging；(C) 描述的是 Bagging，Boosting 的模型之間有先後依賴；(D) Bagging 主要降低變異，降低偏差是 Boosting 的強項。"},
{"g":"cloud","q":"關於無伺服器運算 (Serverless，如 AWS Lambda、Google Cloud Functions)，下列敘述何者正確？","o":["使用者必須自行管理作業系統更新與伺服器硬體","程式由事件觸發執行，平台自動擴充資源，並依實際執行時間與次數計費","就算沒有任何請求，也必須持續支付整台主機的租金","無伺服器代表程式完全不在任何伺服器上執行"],"a":1,"h":"Serverless 又稱 FaaS (Function as a Service)。","e":"無伺服器運算讓開發者只需撰寫函式，由平台負責佈建、擴充與維運，閒置時不計費，適合事件驅動、流量變化大的工作。","w":"(A) 伺服器與作業系統由雲端業者管理；(C) 閒置時通常不收費，這正是它和 IaaS 租用主機的差別；(D) 程式仍在雲端業者的伺服器上執行，只是使用者不需要管理伺服器。"},
{"g":"viz","q":"分析師想觀察「廣告支出」與「銷售額」兩個連續變數之間是否存在關係，最適合使用下列哪一種圖表？","o":["散佈圖","圓餅圖","長條圖","甘特圖"],"a":0,"h":"每一筆資料都是座標平面上的一個點。","e":"散佈圖以 X、Y 軸分別表示兩個連續變數，可直觀看出正相關、負相關、非線性關係或離群值。","w":"(B) 圓餅圖用於呈現各部分佔整體的比例；(C) 長條圖用於比較不同類別的數值大小；(D) 甘特圖用於呈現專案時程與任務進度。"}
]}
];
