, "w": "(A)(B)(C) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "The road was closed _______ an accident near the bridge.", "o": ["as", "because of", "because", "since"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "因為橋附近發生事故，道路封閉了。", "e": "區塊 an accident near the bridge 只有名詞 → because of。", "w": "(A)(C)(D) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "_______ you need help with the new software, please contact IT support.", "o": ["Whenever", "During", "Because of", "In case of"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "每當你使用新軟體需要協助時，請聯絡資訊支援。", "e": "區塊 you need help… 有真動詞 need → 連接詞 Whenever。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "_______ emergency, use the stairs instead of the elevator.", "o": ["In case of", "When", "Unless", "If"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "如遇緊急情況，請走樓梯，不要搭電梯。", "e": "區塊 emergency 只有名詞 → 介系詞片語 In case of。", "w": "(B)(C)(D) 連接詞，後面要接子句（例如 If there is an emergency）。"}, {"g": "t_p5conj", "q": "The factory continued to operate _______ the power outage.", "o": ["whereas", "even though", "despite", "although"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管停電，工廠仍持續運作。", "e": "區塊 the power outage 只有名詞 → 介系詞 despite。", "w": "(A)(B)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the new system was installed, errors have decreased by half.", "o": ["Following", "Due to", "After that", "Since"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "自從新系統安裝以來，錯誤減少了一半。", "e": "區塊 the new system was installed 有真動詞 was installed → 連接詞 Since（自從），主句搭完成式 have decreased。", "w": "(A)(B) 介系詞；(C) After that 是轉承語，不能引導子句。"}, {"g": "t_p5conj", "q": "We will begin the meeting _______ everyone arrives.", "o": ["in spite of", "once", "during", "upon"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "大家一到我們就開始開會。", "e": "區塊 everyone arrives 有真動詞 arrives → 連接詞 once（一…就）。", "w": "(A)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "Mr. Diaz was late for work _______ the heavy traffic.", "o": ["so", "owing to", "as", "because"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "因為交通壅塞，Diaz 先生上班遲到了。", "e": "區塊 the heavy traffic 只有名詞 → 介系詞片語 owing to（＝because of）。", "w": "(A)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the meeting ran late, several employees missed their trains.", "o": ["Because", "Owing to", "Due to", "Because of"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "因為會議拖延，好幾位員工錯過了火車。", "e": "區塊 the meeting ran late 有真動詞 ran → 連接詞 Because。", "w": "(B)(C)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "_______ his busy schedule, Mr. Ito agreed to speak at the conference.", "o": ["Although", "Even though", "Though", "Notwithstanding"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管行程繁忙，伊藤先生仍同意在會議上演講。", "e": "區塊 his busy schedule 只有名詞 → 介系詞 Notwithstanding（＝despite，正式用語）。", "w": "(A)(B)(C) 連接詞，後面要接子句。"}]}, {"id": "p5_conj_4", "kind": "toeic", "part": 5, "stage": 1, "title": "連接詞 vs 介系詞 4", "sub": "空格後的區塊有真動詞 → 連接詞；只有名詞或 V-ing → 介系詞", "qs": [{"g": "t_p5conj", "q": "Visitors must sign in at the front desk _______ entering the building.", "o": ["unless", "although", "before", "so that"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "訪客進入大樓前必須在櫃台登記。", "e": "區塊 entering the building 是 V-ing（不是真動詞）→ 需要介系詞。before 可當介系詞接 V-ing。", "w": "(A)(B)(D) 只能當連接詞，後面要有主詞＋真動詞。"}, {"g": "t_p5conj", "q": "_______ the CEO approves the budget, the project cannot begin.", "o": ["Unless", "Apart from", "Without", "Except for"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "除非執行長批准預算，否則專案無法開始。", "e": "區塊 the CEO approves… 有真動詞 approves → 連接詞 Unless（除非）。", "w": "(B)(C)(D) 介系詞（片語），只能接名詞。"}, {"g": "t_p5conj", "q": "The project cannot begin _______ the CEO's approval.", "o": ["unless", "whereas", "if", "without"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "沒有執行長的核准，專案無法開始。", "e": "區塊 the CEO's approval 只有名詞 → 介系詞 without。（和上一題對照）", "w": "(A)(B)(C) 都是連接詞，後面要接主詞＋真動詞。"}, {"g": "t_p5conj", "q": "_______ the warranty has expired, repairs will be charged.", "o": ["Due to", "Owing to", "Now that", "Because of"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "既然保固已經過期，維修將會收費。", "e": "區塊 the warranty has expired 有真動詞 has expired → 連接詞 Now that（既然）。", "w": "(A)(B)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "Prices may change _______ notice.", "o": ["unless", "without", "whereas", "although"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "價格可能隨時變動，恕不另行通知。", "e": "區塊 notice 只有名詞 → 介系詞 without（without notice 恕不另行通知）。", "w": "(A)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "The CEO approved the plan _______ several board members opposed it.", "o": ["even though", "in spite of", "despite", "regardless of"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管幾位董事反對，執行長仍批准了計畫。", "e": "區塊 several board members opposed it 有真動詞 opposed → 連接詞 even though。", "w": "(B)(C)(D) 介系詞（片語）。"}, {"g": "t_p5conj", "q": "_______ its success in Asia, the company plans to enter the European market.", "o": ["As", "Given", "Since", "Because"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "鑑於在亞洲的成功，公司計畫進軍歐洲市場。", "e": "區塊 its success in Asia 只有名詞 → Given 當介系詞（考慮到、鑑於）。", "w": "(A)(C)(D) 表原因時是連接詞，要接子句。"}, {"g": "t_p5conj", "q": "Please keep your receipt _______ you need to return the item.", "o": ["due to", "in case of", "because of", "in case"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "請保留收據，以防需要退貨。", "e": "區塊 you need to return… 有真動詞 need → 連接詞 in case（以防）。", "w": "(A)(B)(C) 介系詞片語。陷阱：in case 是連接詞，in case of 是介系詞。"}, {"g": "t_p5conj", "q": "The museum has been closed _______ last Monday.", "o": ["for", "during", "since", "while"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "博物館從上週一開始就一直關閉。", "e": "區塊 last Monday 只有名詞（時間點）＋ 完成式 → since 當介系詞（自從）。", "w": "(A) for 接時間長度；(B) during 不搭時間點；(D) while 是連接詞。"}, {"g": "t_p5conj", "q": "_______ Ms. Han was on leave, her team completed the project.", "o": ["During", "Within", "While", "Throughout"], "a": 2, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "韓女士休假期間，她的團隊完成了專案。", "e": "區塊 Ms. Han was on leave 有真動詞 was → 連接詞 While。", "w": "(A)(B)(D) 介系詞。"}, {"g": "t_p5conj", "q": "The concert was canceled _______ low ticket sales.", "o": ["on account of", "because", "now that", "so that"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "演唱會因票房不佳而取消。", "e": "區塊 low ticket sales 只有名詞 → 介系詞片語 on account of（因為）。", "w": "(B)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "_______ the new rules, all visitors must wear a badge.", "o": ["Whereas", "Although", "Unless", "Under"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "根據新規定，所有訪客都必須配戴證件。", "e": "區塊 the new rules 只有名詞 → 介系詞 Under（在…規定之下）。", "w": "(A)(B)(C) 連接詞。"}, {"g": "t_p5conj", "q": "The shipment will be delivered on Tuesday _______ there are no delays at customs.", "o": ["except for", "as long as", "because of", "in spite of"], "a": 1, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "只要海關沒有延誤，貨物將在週二送達。", "e": "區塊 there are no delays… 有真動詞 are → 連接詞 as long as。", "w": "(A)(C)(D) 介系詞片語。"}, {"g": "t_p5conj", "q": "_______ several attempts, the technician could not fix the printer.", "o": ["Despite", "Even though", "While", "Although"], "a": 0, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "儘管試了好幾次，技師還是修不好印表機。", "e": "區塊 several attempts 只有名詞 → 介系詞 Despite。", "w": "(B)(C)(D) 連接詞。"}, {"g": "t_p5conj", "q": "The office will be closed _______ the holidays, from December 24 to January 1.", "o": ["since", "while", "when", "over"], "a": 3, "h": "畫出空格後到逗號（或句尾）的區塊：裡面有沒有真動詞？", "trans": "辦公室在假期期間（12 月 24 日到 1 月 1 日）關閉。", "e": "區塊 the holidays 只有名詞 → 介系詞 over（在…期間）。", "w": "(B)(C) 連接詞；(A) since 搭完成式，表「自從」。"}]}, {"id": "p5_pron", "kind": "toeic", "part": 5, "stage": 1, "title": "代名詞 1", "sub": "後面接名詞 → 所有格；拿掉空格仍完整 → 反身代名詞", "qs": [{"g": "t_p5pron", "q": "Ms. Rivera asked _______ assistant to book a flight to Tokyo.", "o": ["hers", "herself", "her", "she"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Rivera 女士請她的助理訂一張飛往東京的機票。", "e": "訊號：空格後面緊接名詞 assistant → 選所有格 her。", "w": "(D) 主格；(A) 所有格代名詞（＝her＋名詞，後面不能再接名詞）；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "The engineers completed the repairs _______, without any outside help.", "o": ["themselves", "them", "their", "theirs"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "工程師們在沒有任何外援的情況下，親自完成了維修。", "e": "訊號：句子 The engineers completed the repairs 已完整，拿掉空格仍成立 → 反身代名詞 themselves（強調「親自」）。", "w": "(B) 受格，completed 已經有受詞；(C) 所有格後要接名詞；(D) theirs 語意不通。"}, {"g": "t_p5pron", "q": "Mr. Kato will present _______ findings at the conference next week.", "o": ["him", "his", "himself", "he"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "加藤先生將在下週的會議上發表他的研究結果。", "e": "訊號：空格後緊接名詞 findings → 所有格 his。", "w": "(D) 主格；(A) 受格；(C) 反身，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Please send the signed contract to Ms. Adams or _______.", "o": ["I", "my", "myself", "me"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "請把簽好的合約寄給 Adams 女士或我。", "e": "訊號：空格是介系詞 to 的受詞（to Ms. Adams or ___）→ 受格 me。", "w": "(A) 主格不能當介系詞受詞；(B) 所有格後要接名詞；(C) myself 只能在主詞也是「我」時使用，這句主詞是（省略的）you。"}, {"g": "t_p5pron", "q": "The company thanked _______ employees for their hard work.", "o": ["its", "itself", "it's", "it"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "公司感謝員工的辛勞付出。", "e": "訊號：空格後緊接名詞 employees → 所有格 its。", "w": "(D) 主格／受格；(C) it's ＝ it is；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "If you have any questions, please contact _______ directly.", "o": ["we", "us", "ourselves", "our"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "如有任何問題，請直接與我們聯絡。", "e": "訊號：contact（及物）後缺受詞，空格後面是副詞 directly，不是名詞 → 受格 us。", "w": "(A) 主格；(D) 所有格後要接名詞；(C) 主詞是 you，不能用 ourselves。"}, {"g": "t_p5pron", "q": "The director _______ will welcome the new interns on Monday.", "o": ["he", "him", "his", "himself"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "主任將在週一親自歡迎新來的實習生。", "e": "訊號：空格緊接在主詞 The director 後面，拿掉後句子仍完整 → 反身代名詞 himself（強調親自）。", "w": "(A) 主詞重複；(B) 受格；(C) 所有格後要接名詞。"}, {"g": "t_p5pron", "q": "The new laptops are lighter than _______ we currently use.", "o": ["them", "they", "those", "these"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "新筆電比我們目前使用的那些更輕。", "e": "訊號：比較對象是「筆電」（複數），後面還接關係子句 we currently use → 用 those（＝the laptops that）代替前面的複數名詞。", "w": "(A)(B) 人稱代名詞後不能直接接關係子句；(D) these 指近處，不用在 than 後代替前述名詞。"}, {"g": "t_p5pron", "q": "Ms. Hall prefers to handle client complaints by _______.", "o": ["herself", "hers", "her", "she"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Hall 女士偏好獨自處理客訴。", "e": "訊號：by oneself ＝ 獨自、靠自己；主詞是 Ms. Hall → herself。", "w": "(D) 主格不能放介系詞後；(C) by her 表「被她」語意不通；(B) hers 語意不通。"}, {"g": "t_p5pron", "q": "Our sales figures this quarter were higher than _______ of our competitors.", "o": ["that", "this", "those", "them"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "我們本季的銷售數字高於競爭對手的。", "e": "訊號：比較的是 figures（複數），後接 of… → 用 those of 代替複數名詞。單數才用 that of。", "w": "(A)(B) 單數，與 figures 不一致；(D) them 不能接 of 片語。"}, {"g": "t_p5pron", "q": "The marketing team presented _______ new campaign to the board.", "o": ["them", "theirs", "they", "their"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "行銷團隊向董事會提出了他們的新活動企劃。", "e": "訊號：空格後接 形容詞＋名詞（new campaign）→ 所有格 their。", "w": "(C) 主格；(A) 受格；(B) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "Mr. Singh and _______ will attend the trade show in Berlin.", "o": ["my", "I", "me", "mine"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Singh 先生和我將參加柏林的商展。", "e": "訊號：空格在主詞位置（後面是動詞 will attend）→ 主格 I。", "w": "(C) 受格不能當主詞；(A) 所有格要接名詞；(D) mine 語意不通。"}, {"g": "t_p5pron", "q": "The report on my desk is _______, not Mr. Clark's.", "o": ["mine", "myself", "me", "my"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "我桌上那份報告是我的，不是 Clark 先生的。", "e": "訊號：be 動詞後、後面沒有名詞 → 所有格代名詞 mine（＝my report），與 Mr. Clark's 對應。", "w": "(D) my 後面必須接名詞；(C) 受格語意不通；(B) 反身代名詞不能這樣用。"}, {"g": "t_p5pron", "q": "Customers who wish to return items must bring _______ receipts.", "o": ["they", "theirs", "their", "them"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "想退貨的顧客必須攜帶收據。", "e": "訊號：空格後緊接名詞 receipts → 所有格 their。", "w": "(A) 主格；(D) 受格；(B) 所有格代名詞，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Ms. Lopez reviewed the budget _______ before submitting it.", "o": ["she", "hers", "her", "herself"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Lopez 女士在提交預算前親自審核了一遍。", "e": "訊號：Ms. Lopez reviewed the budget 已完整，空格可拿掉 → 反身代名詞 herself（親自）。", "w": "(A) 主格；(C) 受格，reviewed 已有受詞 the budget；(B) hers 語意不通。"}, {"g": "t_p5pron", "q": "The manager gave _______ a detailed explanation of the new procedure.", "o": ["our", "us", "ourselves", "we"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "經理詳細向我們說明了新流程。", "e": "訊號：give ＋ 人（受格）＋ 物 → 第一個受詞用受格 us。", "w": "(D) 主格；(A) 所有格要接名詞（our a… 不成立）；(C) 主詞是 the manager，不能用 ourselves。"}, {"g": "t_p5pron", "q": "Each employee is responsible for keeping _______ workspace clean.", "o": ["his or her", "him or her", "he or she", "himself or herself"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "每位員工都有責任保持自己的工作區域整潔。", "e": "訊號：空格後緊接名詞 workspace → 所有格 his or her。", "w": "(B) 受格；(C) 主格；(D) 反身，後面都不能接名詞。"}, {"g": "t_p5pron", "q": "The software updates _______ automatically every night.", "o": ["it", "itself", "its", "it's"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "這套軟體每晚會自動更新。", "e": "訊號：主詞 The software 和受詞是同一個東西（軟體更新自己）→ 反身代名詞 itself。", "w": "(A) it 會被理解為「更新另一個東西」，前文沒有可指的對象；(C) 所有格要接名詞；(D) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Mr. Evans asked that all requests be sent to _______ by e-mail.", "o": ["his", "himself", "him", "he"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Evans 先生要求所有申請都以電子郵件寄給他。", "e": "訊號：介系詞 to 後面 → 受格 him。that 子句的主詞是 all requests，不是 Mr. Evans，所以不用 himself。", "w": "(D) 主格；(A) 所有格要接名詞；(B) 反身需與同一子句主詞相同。"}, {"g": "t_p5pron", "q": "Although the task was difficult, the interns completed it by _______.", "o": ["them", "they", "their", "themselves"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "雖然任務很困難，實習生們還是靠自己完成了。", "e": "訊號：by ＋ 反身代名詞 ＝ 獨自；主詞 the interns → themselves。", "w": "(B) 主格；(A) by them 表「被他們」；(C) 所有格要接名詞。"}, {"g": "t_p5pron", "q": "_______ who are interested in the workshop should register by Friday.", "o": ["Those", "They", "Them", "Whoever"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "有興趣參加工作坊的人請在週五前報名。", "e": "訊號：空格後接關係代名詞 who → Those who（那些…的人）是固定用法。", "w": "(B)(C) 人稱代名詞不接 who 子句；(D) Whoever 本身已含 who，不能再接 who。"}, {"g": "t_p5pron", "q": "The firm's lawyers advised _______ client not to sign the agreement.", "o": ["themselves", "their", "them", "they"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "事務所的律師建議他們的客戶不要簽署這份協議。", "e": "訊號：空格後緊接名詞 client → 所有格 their。", "w": "(D) 主格；(C) 受格；(A) 反身，後面都不能接名詞。"}, {"g": "t_p5pron", "q": "Ms. Moore designed the logo _______, so she knows every detail of it.", "o": ["hers", "she", "her", "herself"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "這個標誌是 Moore 女士親自設計的，所以她清楚每個細節。", "e": "訊號：Ms. Moore designed the logo 已完整，空格可拿掉 → 反身代名詞 herself。", "w": "(B) 主格；(C) 受格，designed 已有受詞；(A) hers 語意不通。"}, {"g": "t_p5pron", "q": "The CEO thanked the volunteers and gave each of _______ a gift card.", "o": ["they", "their", "them", "themselves"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "執行長感謝志工，並送給他們每人一張禮物卡。", "e": "訊號：介系詞 of 後面 → 受格 them（each of them）。", "w": "(A) 主格；(B) 所有格要接名詞；(D) 主詞是 the CEO，不能用 themselves。"}, {"g": "t_p5pron", "q": "Our products are more durable than _______ of other brands.", "o": ["these", "those", "them", "that"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "我們的產品比其他品牌的更耐用。", "e": "訊號：比較對象 products 是複數，後接 of… → those of。", "w": "(D) that of 用於單數；(A) these 不用於這種比較結構；(C) them 不能接 of 片語。"}]}, {"id": "p5_pron_2", "kind": "toeic", "part": 5, "stage": 1, "title": "代名詞 2", "sub": "後面接名詞 → 所有格；拿掉空格仍完整 → 反身代名詞", "qs": [{"g": "t_p5pron", "q": "Mr. Grant forgot to bring _______ laptop to the meeting.", "o": ["his", "himself", "he", "him"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Grant 先生忘了帶筆電來開會。", "e": "訊號：空格後緊接名詞 laptop → 所有格 his。", "w": "(C) 主格；(D) 受格；(B) 反身，後面都不能直接接名詞。"}, {"g": "t_p5pron", "q": "Ms. Adams told _______ that the meeting had been canceled.", "o": ["our", "ourselves", "us", "we"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "Adams 女士告訴我們會議取消了。", "e": "訊號：told 是及物動詞，後面需要受詞，空格後是 that 子句 → 受格 us。", "w": "(D) 主格；(A) 所有格要接名詞；(B) 主詞是 Ms. Adams，不能用 ourselves。"}, {"g": "t_p5pron", "q": "The members of the committee introduced _______ at the start of the meeting.", "o": ["theirs", "themselves", "their", "them"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "委員們在會議開始時自我介紹。", "e": "訊號：主詞 The members 和受詞是同一群人（介紹自己）→ 反身代名詞 themselves。", "w": "(D) them 表示介紹「別人」；(C) 所有格要接名詞；(A) theirs 語意不通。"}, {"g": "t_p5pron", "q": "Our competitors have lowered _______ prices again.", "o": ["them", "theirs", "they", "their"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "我們的競爭對手又降價了。", "e": "訊號：空格後緊接名詞 prices → 所有格 their。", "w": "(C) 主格；(A) 受格；(B) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "If you need assistance, Mr. Hill or _______ will be happy to help.", "o": ["I", "my", "me", "myself"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "如果你需要協助，Hill 先生或我都很樂意幫忙。", "e": "訊號：Mr. Hill or ___ 是主詞（後面接 will be）→ 主格 I。", "w": "(C) 受格不能當主詞；(B) 所有格要接名詞；(D) 反身代名詞不能單獨當主詞。"}, {"g": "t_p5pron", "q": "The new laptop is lighter than _______.", "o": ["me", "myself", "my", "mine"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "新筆電比我的輕。", "e": "訊號：than 後面沒有名詞，比較的是「筆電」→ 所有格代名詞 mine（＝my laptop）。", "w": "(C) my 後面要接名詞；(A) 比較的是筆電不是人；(B) 反身代名詞不用於比較對象。"}, {"g": "t_p5pron", "q": "The company prides _______ on its excellent customer service.", "o": ["it's", "itself", "it", "its"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "公司以優質的客戶服務自豪。", "e": "訊號：pride oneself on（以…自豪）固定用法，主詞是 The company → itself。", "w": "(C) it 指別的東西；(D) 所有格要接名詞；(A) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Each of the managers will present _______ department's annual report.", "o": ["they", "them", "his or her", "its"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "每位經理將發表自己部門的年度報告。", "e": "訊號：Each of the managers 主詞是 Each（單數，指人）；空格後接名詞 department's → 單數人的所有格 his or her。", "w": "(A) 主格；(D) its 指物；(B) 受格，後面都不能接人的所有物。"}, {"g": "t_p5pron", "q": "The clients were satisfied with the design that we created for _______.", "o": ["themselves", "them", "they", "their"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "客戶對我們為他們設計的方案感到滿意。", "e": "訊號：介系詞 for 後面 → 受格 them。that 子句的主詞是 we，所以不用 themselves。", "w": "(C) 主格；(D) 所有格要接名詞；(A) 反身需與同一子句主詞一致。"}, {"g": "t_p5pron", "q": "Ms. Chen prefers to book _______ own flights rather than use a travel agent.", "o": ["her", "hers", "she", "herself"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "陳女士偏好自己訂機票，而不是透過旅行社。", "e": "訊號：空格後是 own ＋ 名詞 → 所有格 her（one's own ＋ 名詞）。", "w": "(C) 主格；(B) hers 後面不能接名詞；(D) herself 不能接 own。"}, {"g": "t_p5pron", "q": "Ms. Wong and _______ colleagues attended the workshop in Singapore.", "o": ["she", "herself", "her", "hers"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "黃女士和她的同事參加了新加坡的工作坊。", "e": "訊號：空格後緊接名詞 colleagues → 所有格 her。", "w": "(A) 主格；(D) hers 後面不能接名詞；(B) 反身代名詞。"}, {"g": "t_p5pron", "q": "Please let _______ know if you will attend the dinner.", "o": ["mine", "my", "I", "me"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "如果你會參加晚宴，請告訴我。", "e": "訊號：let ＋ 受詞 ＋ 原形 → 受格 me。", "w": "(C) 主格；(B) 所有格要接名詞；(A) 所有格代名詞語意不通。"}, {"g": "t_p5pron", "q": "_______ of the employees has received a copy of the handbook.", "o": ["Each", "Their", "Them", "They"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "每位員工都收到了一份員工手冊。", "e": "訊號：___ of the employees ＋ 單數動詞 has → Each of。", "w": "(B)(C)(D) 人稱代名詞不能接 of the employees 當主詞。"}, {"g": "t_p5pron", "q": "The office manager ordered the supplies _______ instead of asking an assistant.", "o": ["she", "her", "herself", "hers"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "辦公室經理親自訂購了用品，而沒有請助理代勞。", "e": "訊號：The office manager ordered the supplies 已完整，空格可拿掉，強調「親自」→ herself。", "w": "(B) 受格，ordered 已經有受詞；(D) hers 語意不通；(A) 主格不能放這裡。"}, {"g": "t_p5pron", "q": "This seat is _______; I left my bag on it.", "o": ["myself", "me", "my", "mine"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "這個座位是我的，我把包包放在上面。", "e": "訊號：be 動詞後、後面沒有名詞 → 所有格代名詞 mine。", "w": "(C) my 後面要接名詞；(B) 受格語意不通；(A) 反身代名詞不能這樣用。"}, {"g": "t_p5pron", "q": "The engineers checked the equipment and found _______ in good condition.", "o": ["it's", "it", "itself", "its"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "工程師檢查設備後發現它狀況良好。", "e": "訊號：found ＋ 受詞 ＋ 補語；受詞是前面的 equipment（不可數、單數）→ it。", "w": "(D) 所有格要接名詞；(C) 主詞是 engineers，不能用 itself；(A) it's ＝ it is。"}, {"g": "t_p5pron", "q": "Employees who have not yet registered should do _______ by Friday.", "o": ["this", "them", "it", "so"], "a": 3, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "尚未報名的員工應在週五前完成報名。", "e": "訊號：do so ＝ 代替前面提過的動作（register）。", "w": "(A)(C) do it／do this 要指明確的物；(B) them 是複數受格，前面沒有可指的複數名詞。"}, {"g": "t_p5pron", "q": "The two companies agreed to share _______ research data.", "o": ["theirs", "them", "their", "they"], "a": 2, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "兩家公司同意共享研究資料。", "e": "訊號：空格後接名詞 research data → 所有格 their。", "w": "(D) 主格；(B) 受格；(A) 所有格代名詞，後面不能接名詞。"}, {"g": "t_p5pron", "q": "Ms. Ito, _______ is the head of marketing, will lead the session.", "o": ["who", "her", "which", "she"], "a": 0, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "身為行銷主管的伊藤女士將主持這場會議。", "e": "訊號：逗號中間的子句缺主詞，且要連接到主句 → 關係代名詞 who（人）。用 she 會變成兩個句子沒有連接詞。", "w": "(D) she 不能連接子句；(B) 受格；(C) which 指物。"}, {"g": "t_p5pron", "q": "The manager asked the interns to introduce _______ to the team.", "o": ["them", "themselves", "their", "theirs"], "a": 1, "h": "空格後面接什麼？名詞 → 所有格；拿掉空格句子仍完整 → 反身代名詞。", "trans": "經理請實習生向團隊自我介紹。", "e": "訊號：introduce 的動作者是 the interns（不定詞的意義主詞），介紹的對象也是他們自己 → themselves。", "w": "(A) them 會變成介紹別人；(C)(D) 所有格語意不合。"}]}, {"id": "p5_fin", "kind": "toeic", "part": 5, "stage": 2, "title": "真動詞判斷 1", "sub": "Step 1：已有真動詞就只留 to V／V-ing／p.p.；沒有真動詞就刪掉 to V、V-ing", "qs": [{"g": "t_p5fin", "q": "The new manager _______ the team's performance every Friday.", "o": ["reviews", "review", "reviewing", "to review"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "新經理每週五檢視團隊績效。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 The new manager 是第三人稱單數，every Friday 表習慣 → reviews。", "w": "(C)(D) 不能當主要動詞；(B) review 主詞動詞不一致（單數主詞要加 -s）。"}, {"g": "t_p5fin", "q": "The company plans _______ a new branch in Osaka next year.", "o": ["opens", "to open", "open", "opened"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "公司計畫明年在大阪開設新分店。", "e": "Step 1：已有真動詞 plans，且沒有連接詞 → 刪掉有時態的 opens、opened 和原形 open。plan ＋ to V。", "w": "(A)(C)(D) 都會變成第二個真動詞，句子會有兩個動詞卻沒有連接詞。"}, {"g": "t_p5fin", "q": "Employees _______ to attend the workshop must register by Monday.", "o": ["wish", "wished", "are wishing", "wishing"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "想參加工作坊的員工必須在週一前報名。", "e": "Step 1：真動詞已經是 must register → 空格不能再是真動詞。Employees 主動「想要」→ V-ing 修飾名詞（＝who wish）。", "w": "(A)(C) 有時態的真動詞，會變成兩個動詞；(B) wished 當 p.p. 表被動，語意不通。"}, {"g": "t_p5fin", "q": "The report _______ last week contains several errors.", "o": ["submitting", "submit", "submitted", "submits"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "上週提交的報告有幾處錯誤。", "e": "Step 1：真動詞是 contains → 空格只能是 V-ing 或 p.p.。Step 2：報告是「被提交」→ p.p. submitted。", "w": "(B)(D) 真動詞會重複；(A) V-ing 表主動，報告不會自己提交。"}, {"g": "t_p5fin", "q": "Ms. Grant _______ the client list before the meeting started.", "o": ["to update", "updated", "updating", "having updated"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "Grant 女士在會議開始前更新了客戶名單。", "e": "Step 1：主要子句 Ms. Grant ___ the client list 沒有真動詞（started 屬於 before 子句）→ 刪掉 V-ing、to V → updated。", "w": "(A)(C)(D) 都不是真動詞，主要子句會缺動詞。"}, {"g": "t_p5fin", "q": "_______ the deadline, the team worked overtime all week.", "o": ["To meet", "Meets", "Met", "Meet"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "為了趕上截止期限，團隊整週都在加班。", "e": "Step 1：真動詞是 worked，逗號前沒有連接詞 → 空格不能是真動詞，To V 放句首表目的（為了…）。", "w": "(D) 原形放句首會變祈使句；(B)(C) 有時態的動詞會變成兩個真動詞。"}, {"g": "t_p5fin", "q": "Customers _______ in the loyalty program receive a 10% discount.", "o": ["enroll", "are enrolled", "enrolled", "enrolls"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "加入會員方案的顧客可享九折優惠。", "e": "Step 1：真動詞是 receive → 空格只能是 V-ing／p.p.。be enrolled in（已加入…）→ 修飾名詞用 p.p. enrolled。", "w": "(A)(B)(D) 都是真動詞，會和 receive 重複。"}, {"g": "t_p5fin", "q": "The marketing director _______ that the campaign be extended.", "o": ["to suggest", "suggesting", "suggestion", "has suggested"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "行銷總監建議延長這項活動。", "e": "Step 1：主要子句缺真動詞（be extended 屬於 that 子句）→ 刪掉 V-ing、to V、名詞，選 has suggested。", "w": "(A)(B) 不能當主要動詞；(C) 名詞。"}, {"g": "t_p5fin", "q": "Mr. Cho spent the afternoon _______ the quarterly budget.", "o": ["prepares", "prepared", "prepare", "preparing"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "趙先生花了一整個下午準備季度預算。", "e": "Step 1：真動詞 spent 已存在 → 不能再放真動詞。固定句型 spend ＋ 時間 ＋ V-ing。", "w": "(A)(B)(C) 會出現第二個真動詞。"}, {"g": "t_p5fin", "q": "The hotel, _______ in 1920, has recently been renovated.", "o": ["build", "built", "builds", "building"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "這間建於 1920 年的飯店最近剛整修完。", "e": "Step 1：真動詞是 has been renovated → 逗號中的插入語不能是真動詞。Step 2：飯店是「被建造」→ p.p. built。", "w": "(A)(C) 真動詞；(D) V-ing 表主動「正在建造」，語意不通。"}, {"g": "t_p5fin", "q": "Visitors to the factory _______ safety goggles at all times.", "o": ["to wear", "wearing", "wear", "wears"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "參觀工廠的訪客必須全程配戴護目鏡。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 Visitors 是複數 → 原形 wear。", "w": "(A)(B) 不能當主要動詞；(D) wears 用於單數主詞。陷阱：factory 是單數，但主詞核心是 Visitors。"}, {"g": "t_p5fin", "q": "The committee decided _______ the proposal until next month.", "o": ["to postpone", "postponing", "postpone", "postponed"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "委員會決定把提案延到下個月。", "e": "Step 1：已有真動詞 decided → 不能再接有時態的動詞。decide ＋ to V。", "w": "(C)(D) 第二個真動詞；(B) decide 不接 V-ing。"}, {"g": "t_p5fin", "q": "Products _______ after 6 P.M. will be shipped the next business day.", "o": ["ordered", "order", "ordering", "orders"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "晚上六點後訂購的商品將於下一個工作日出貨。", "e": "Step 1：真動詞是 will be shipped → 空格是修飾語。Step 2：商品是「被訂購」→ p.p. ordered。", "w": "(B)(D) 真動詞會重複；(C) V-ing 表主動，商品不會自己下單。"}, {"g": "t_p5fin", "q": "The CEO, _______ the importance of teamwork, praised all departments.", "o": ["emphasized", "emphasizing", "emphasize", "emphasizes"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "執行長強調團隊合作的重要性，並表揚了所有部門。", "e": "Step 1：真動詞是 praised → 插入語不能是真動詞。Step 2：執行長「主動」強調，且後面有受詞 the importance → V-ing。", "w": "(C)(D) 真動詞；(A) p.p. 表被動，但後面有受詞，且執行長不是被強調的對象。"}, {"g": "t_p5fin", "q": "Our accountant _______ all receipts carefully before filing them.", "o": ["checking", "to check", "check", "checks"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "我們的會計師在歸檔前會仔細檢查所有收據。", "e": "Step 1：沒有真動詞（filing 是 V-ing）→ 刪掉 V-ing、to V；主詞單數 → checks。", "w": "(A)(B) 不能當主要動詞；(C) 主詞動詞不一致。"}, {"g": "t_p5fin", "q": "The goal of the workshop is _______ communication between departments.", "o": ["improve", "improves", "to improve", "improved"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "這個工作坊的目標是改善部門間的溝通。", "e": "Step 1：已有真動詞 is → 空格是主詞補語，不能再放真動詞。The goal is ＋ to V（目標是去做…）。", "w": "(A)(B) 第二個真動詞；(D) p.p. 表被動，目標「被改善的溝通」不合文意。"}, {"g": "t_p5fin", "q": "Anyone _______ assistance should contact the IT department.", "o": ["needs", "needing", "need", "needed"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "任何需要協助的人都應聯絡資訊部。", "e": "Step 1：真動詞是 should contact → 空格修飾 Anyone。Step 2：人「主動需要」，後面有受詞 assistance → V-ing。", "w": "(A)(C) 真動詞會重複；(D) p.p. 表被動語意不通。"}, {"g": "t_p5fin", "q": "When the shipment _______, please notify the warehouse manager.", "o": ["to arrive", "arrive", "arrives", "arriving"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "貨物到達時，請通知倉庫經理。", "e": "Step 1：有 1 個連接詞 When → 全句要 2 個真動詞。主句有 notify，When 子句缺真動詞 → arrives（時間子句用現在式代替未來）。", "w": "(A)(D) 不是真動詞；(B) 主詞 shipment 是單數，要加 -s。"}, {"g": "t_p5fin", "q": "The documents _______ on the table need to be signed by noon.", "o": ["left", "leaving", "leaves", "leave"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "放在桌上的文件需要在中午前簽好。", "e": "Step 1：真動詞是 need → 空格是修飾語。Step 2：文件是「被留下」→ p.p. left。", "w": "(C)(D) 真動詞；(B) V-ing 表主動，文件不會自己離開。"}, {"g": "t_p5fin", "q": "Mr. Ruiz _______ the conference because of a scheduling conflict.", "o": ["to miss", "having missed", "missing", "missed"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "Ruiz 先生因行程衝突而錯過了會議。", "e": "Step 1：整句沒有真動詞（because of 後面只有名詞）→ 刪掉 V-ing、to V → missed。", "w": "(A)(B)(C) 都不能當主要動詞。"}, {"g": "t_p5fin", "q": "Ms. Ford was the first employee _______ the new safety award.", "o": ["to receive", "receives", "receive", "received"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "Ford 女士是第一位獲得新安全獎的員工。", "e": "Step 1：已有真動詞 was → 不能再放真動詞。the first ＋ 名詞 ＋ to V 是固定句型。", "w": "(B)(C) 第二個真動詞；(D) received 當 p.p. 表被動，後面又有受詞，不合。"}, {"g": "t_p5fin", "q": "The software, _______ by our in-house team, is easy to use.", "o": ["develops", "develop", "developed", "developing"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "這套由我們內部團隊開發的軟體很容易使用。", "e": "Step 1：真動詞是 is → 插入語不能是真動詞。Step 2：後面接 by（沒有受詞）→ 被動 p.p. developed。", "w": "(A)(B) 真動詞；(D) V-ing 表主動，但軟體是被開發的。"}, {"g": "t_p5fin", "q": "Although the store _______ at 9 A.M., customers were already waiting outside at 8.", "o": ["opening", "open", "to open", "opened"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "雖然店家九點才開門，顧客八點就已在外面等候。", "e": "Step 1：有 1 個連接詞 Although → 要 2 個真動詞。主句有 were waiting，Although 子句缺真動詞 → 刪掉 V-ing、to V。主詞 store 是單數，原形 open 不合 → opened（與 were 時態一致）。", "w": "(B) 單數主詞不能用原形；(A)(C) 不是真動詞。"}, {"g": "t_p5fin", "q": "_______ the survey results carefully, the team decided to revise the design.", "o": ["Analyzes", "Having analyzed", "Analyze", "Analyzed"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "仔細分析問卷結果後，團隊決定修改設計。", "e": "Step 1：真動詞是 decided，逗號前沒有連接詞 → 空格不能是真動詞。Step 2：團隊「主動」分析且後面有受詞 → 分詞構句 Having analyzed（先分析、後決定）。", "w": "(C) 原形會變祈使句；(D) p.p. 表被動，後面卻有受詞；(A) 真動詞。"}, {"g": "t_p5fin", "q": "The manager asked us _______ the report by Friday.", "o": ["finished", "to finish", "finishing", "finish"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "經理要求我們在週五前完成報告。", "e": "Step 1：已有真動詞 asked → 不能再放真動詞。ask ＋ 人 ＋ to V。", "w": "(A)(D) 第二個真動詞；(C) ask 不接 V-ing。"}]}, {"id": "p5_fin_2", "kind": "toeic", "part": 5, "stage": 2, "title": "真動詞判斷 2", "sub": "Step 1：已有真動詞就只留 to V／V-ing／p.p.；沒有真動詞就刪掉 to V、V-ing", "qs": [{"g": "t_p5fin", "q": "The director _______ all department heads to a meeting every Monday.", "o": ["inviting", "to invite", "invite", "invites"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "主任每週一都會邀請所有部門主管開會。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V。主詞 The director 單數＋every Monday 習慣 → invites。", "w": "(A)(B) 不能當主要動詞；(C) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "Passengers _______ to Seoul should proceed to Gate 12.", "o": ["travel", "traveling", "traveled", "travels"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "前往首爾的旅客請到 12 號登機門。", "e": "Step 1：真動詞是 should proceed → 空格修飾 Passengers。Step 2：旅客主動旅行 → V-ing traveling。", "w": "(A)(D) 會變成第二個真動詞；(C) traveled 當 p.p. 表被動，語意不合。"}, {"g": "t_p5fin", "q": "The manager wants _______ the new procedures to all staff.", "o": ["explains", "explain", "to explain", "explained"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "經理想向所有員工說明新程序。", "e": "Step 1：已有真動詞 wants，沒有連接詞 → 不能再放有時態的動詞。want ＋ to V。", "w": "(A)(B)(D) 都會成為第二個真動詞。"}, {"g": "t_p5fin", "q": "The brochures _______ at the trade show contained outdated prices.", "o": ["distributed", "distributing", "distributes", "distribute"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "在商展上發放的手冊上印的是過時的價格。", "e": "Step 1：真動詞是 contained → 空格是修飾語。Step 2：手冊是被發放的 → p.p. distributed。", "w": "(C)(D) 真動詞會重複；(B) V-ing 表主動，手冊不會自己發放。"}, {"g": "t_p5fin", "q": "_______ your login information, please click the link below.", "o": ["Resetting is", "Resets", "To reset", "Reset"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "若要重設登入資訊，請點選下方連結。", "e": "Step 1：逗號後 please click 已是祈使句（真動詞 click），前面沒有連接詞 → 空格不能是真動詞。To V 放句首表目的。", "w": "(D) 原形放句首會變成另一個祈使句，兩句間沒有連接詞；(A)(B) 有時態的動詞。"}, {"g": "t_p5fin", "q": "Ms. Jung _______ the budget proposal to the board yesterday afternoon.", "o": ["presented", "having presented", "presenting", "to present"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "鄭女士昨天下午向董事會提交了預算提案。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V、having p.p. → presented。", "w": "(B)(C)(D) 都不能當主要動詞。"}, {"g": "t_p5fin", "q": "The team leader encouraged everyone _______ new ideas.", "o": ["shared", "to share", "share", "sharing"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "組長鼓勵大家分享新想法。", "e": "Step 1：已有真動詞 encouraged → 不能再放真動詞。encourage ＋ 人 ＋ to V。", "w": "(A)(C) 第二個真動詞；(D) encourage 後面接人時不接 V-ing。"}, {"g": "t_p5fin", "q": "Any items _______ in the lobby will be taken to the lost-and-found office.", "o": ["leaving", "leave", "leaves", "left"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "遺留在大廳的任何物品將送到失物招領處。", "e": "Step 1：真動詞是 will be taken → 空格是修飾語。Step 2：物品是被留下的 → p.p. left。", "w": "(B)(C) 真動詞；(A) V-ing 表主動，物品不會自己離開。"}, {"g": "t_p5fin", "q": "If the client _______ any changes, we will update the contract.", "o": ["requests", "to request", "requesting", "request"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "如果客戶要求任何修改，我們會更新合約。", "e": "Step 1：有連接詞 If → 要 2 個真動詞。主句有 will update，If 子句缺真動詞；主詞單數 → requests（條件子句用現在式）。", "w": "(D) 單數主詞要加 -s；(B)(C) 不是真動詞。"}, {"g": "t_p5fin", "q": "The new employee spent two days _______ the company's policies.", "o": ["learned", "learning", "to learn", "learn"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "新進員工花了兩天學習公司的政策。", "e": "Step 1：已有真動詞 spent → spend ＋ 時間 ＋ V-ing。", "w": "(A)(D) 第二個真動詞；(C) spend 不接 to V。"}, {"g": "t_p5fin", "q": "Staff members _______ to work overtime will receive extra pay.", "o": ["ask", "asks", "asked", "asking"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "被要求加班的員工將獲得額外薪資。", "e": "Step 1：真動詞是 will receive → 空格修飾 Staff members。Step 2：員工是被要求的 → p.p. asked。", "w": "(A)(B) 真動詞；(D) V-ing 表主動「要求別人」，語意不合。"}, {"g": "t_p5fin", "q": "The restaurant _______ a special menu during the festival.", "o": ["offering", "to offer", "offer", "offers"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "這家餐廳在節慶期間提供特別菜單。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V；主詞單數 → offers。", "w": "(A)(B) 不能當主要動詞；(C) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "_______ for its excellent service, the hotel attracts many business travelers.", "o": ["Knows", "Know", "Known", "Knowing"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "這家飯店以優質服務聞名，吸引許多商務旅客。", "e": "Step 1：真動詞是 attracts，逗號前沒有連接詞 → 空格不能是真動詞。Step 2：飯店是「被知道」→ p.p. Known（be known for）。", "w": "(A)(B) 真動詞；(D) V-ing 表主動，飯店不會主動「知道」。"}, {"g": "t_p5fin", "q": "The board plans to vote on the proposal after it _______ the financial report.", "o": ["review", "reviewing", "to review", "reviews"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "董事會打算在審閱財務報告後對提案進行表決。", "e": "Step 1：after 是連接詞 → after 子句需要真動詞。主詞 it（＝the board）單數，時間子句用現在式代替未來 → reviews。", "w": "(B)(C) 不是真動詞；(A) 單數主詞要加 -s。"}, {"g": "t_p5fin", "q": "The company is looking for ways _______ costs.", "o": ["to reduce", "reduce", "reduced", "reduces"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "公司正在尋找降低成本的方法。", "e": "Step 1：已有真動詞 is looking → 不能再放真動詞。ways ＋ to V（做…的方法）。", "w": "(B)(D) 第二個真動詞；(C) reduced 表被動，後面又有受詞 costs，不合。"}, {"g": "t_p5fin", "q": "_______ in 1985, Ellis Corporation now has offices in 20 countries.", "o": ["Found", "Founded", "Founds", "Founding"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "成立於 1985 年的 Ellis 公司，現在在 20 個國家設有辦公室。", "e": "Step 1：真動詞是 has，逗號前不能再有真動詞。Step 2：公司是被創立的 → p.p. Founded。", "w": "(A)(C) 真動詞；(D) V-ing 表主動「創立別人」，語意不合。"}, {"g": "t_p5fin", "q": "The supervisor reminded the staff _______ the doors before leaving.", "o": ["locked", "to lock", "lock", "locking"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "主管提醒員工離開前要鎖門。", "e": "Step 1：已有真動詞 reminded → remind ＋ 人 ＋ to V。", "w": "(A)(C) 第二個真動詞；(D) remind 接人時不接 V-ing。"}, {"g": "t_p5fin", "q": "The machines in the factory _______ inspected once a month.", "o": ["to be", "being", "are", "is"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "工廠裡的機器每月檢查一次。", "e": "Step 1：整句沒有真動詞 → 刪掉 being、to be。主詞 The machines 是複數 → are。", "w": "(A)(B) 不是真動詞；(D) 被 factory 誤導成單數。"}, {"g": "t_p5fin", "q": "Mr. Brooks, _______ the meeting, thanked everyone for their hard work.", "o": ["opening", "open", "opened", "opens"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "Brooks 先生在會議開場時感謝大家的辛勞。", "e": "Step 1：真動詞是 thanked → 插入語不能是真動詞。Step 2：他主動開場，後面有受詞 the meeting → V-ing opening。", "w": "(B)(D) 真動詞；(C) p.p. 表被動，但後面有受詞。"}, {"g": "t_p5fin", "q": "The goal is _______ customer satisfaction by 15 percent.", "o": ["increase", "increases", "increased", "increasing"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "目標是將顧客滿意度提升 15%。", "e": "Step 1：已有真動詞 is → 空格是主詞補語。可用 to V 或 V-ing（動名詞），選項中只有 increasing 符合。", "w": "(A)(B) 是動詞原形或第三人稱動詞，不能放在 is 後；(C) is increased 表被動，但後面有受詞 customer satisfaction。"}, {"g": "t_p5fin", "q": "When Ms. Kim _______ the office, the meeting had already started.", "o": ["arriving", "to arrive", "arrive", "arrived"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "金女士抵達辦公室時，會議已經開始了。", "e": "Step 1：連接詞 When → When 子句要有真動詞。主句是過去完成式 → When 子句用過去式 arrived。", "w": "(C) 時態與主詞都不合；(A)(B) 不是真動詞。"}, {"g": "t_p5fin", "q": "Customers _______ more than $100 will receive free shipping.", "o": ["spending", "spends", "spend", "spent"], "a": 0, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "消費超過 100 美元的顧客可享免運。", "e": "Step 1：真動詞是 will receive → 空格修飾 Customers。Step 2：顧客主動花錢，後面有受詞 → spending。", "w": "(B)(C) 真動詞；(D) p.p. 表被動，語意不合。"}, {"g": "t_p5fin", "q": "The CEO's decision _______ many employees by surprise.", "o": ["taking", "took", "take", "to take"], "a": 1, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "執行長的決定讓許多員工感到意外。", "e": "Step 1：整句沒有真動詞 → 刪掉 V-ing、to V；主詞 decision 單數，原形 take 不合 → took。", "w": "(C) 單數主詞不用原形；(A)(D) 不是真動詞。"}, {"g": "t_p5fin", "q": "We need someone _______ the new accounting software.", "o": ["installs", "installed", "to install", "install"], "a": 2, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "我們需要有人來安裝新的會計軟體。", "e": "Step 1：已有真動詞 need → someone ＋ to V（做某事的人）。", "w": "(A)(D) 第二個真動詞；(B) installed 表被動，後面又有受詞。"}, {"g": "t_p5fin", "q": "Although the product _______ well in Europe, it failed in the Asian market.", "o": ["sell", "to sell", "selling", "sold"], "a": 3, "h": "Step 1：數一數真動詞和連接詞。1 個連接詞要 2 個真動詞。", "trans": "雖然這項產品在歐洲賣得很好，但在亞洲市場失敗了。", "e": "Step 1：連接詞 Although → 子句需要真動詞；主詞 product 單數，與 failed 時態一致 → sold。", "w": "(B)(C) 不是真動詞；(A) 單數主詞不用原形。"}]}, {"id": "p5_voice", "kind": "toeic", "part": 5, "stage": 2, "title": "主動／被動 1", "sub": "Step 2：及物動詞後有受詞 → 主動；接介系詞或句號 → 被動 be＋p.p.", "qs": [{"g": "t_p5voice", "q": "The annual report _______ to all shareholders last week.", "o": ["sending", "sent", "was sent", "has sent"], "a": 2, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "年度報告上週已寄給所有股東。", "e": "Step 2：主詞是物（報告）；send 是及物動詞，空格後直接接介系詞 to，沒有受詞 → 被動 was sent。last week → 過去式。", "w": "(B)(D) 主動，後面需要受詞；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Ms. Young _______ the contract terms with the supplier yesterday.", "o": ["is negotiated", "negotiated", "was negotiated", "negotiating"], "a": 1, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "Young 女士昨天和供應商協商了合約條款。", "e": "Step 2：空格後直接接名詞受詞 the contract terms → 主動。yesterday → 過去式 negotiated。", "w": "(A)(C) 被動後面不應再接受詞；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "All new employees _______ to complete the online training by Friday.", "o": ["are required", "requiring", "require", "have required"], "a": 0, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "所有新進員工必須在週五前完成線上訓練。", "e": "Step 2：空格後是 to V，沒有名詞受詞；員工是「被要求」→ be required to V。", "w": "(C)(D) 主動表示「員工要求…」，語意不通且缺受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The new policy _______ next month.", "o": ["will implement", "has implemented", "implementing", "will be implemented"], "a": 3, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "新政策將於下個月實施。", "e": "Step 2：主詞是物（政策）；implement 及物，後面直接接時間 next month、沒有受詞 → 被動 will be implemented。", "w": "(A)(B) 主動需要受詞；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The manager _______ the staff about the schedule change this morning.", "o": ["was informed", "informing", "has been informed", "informed"], "a": 3, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "經理今天早上通知員工行程有異動。", "e": "Step 2：空格後直接接受詞 the staff → 主動 informed。", "w": "(A)(C) 被動後不應再接受詞；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The conference room _______ for the board meeting at 3 P.M.", "o": ["has been reserved", "reserves", "reserving", "has reserved"], "a": 0, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "會議室已預約給下午三點的董事會使用。", "e": "Step 2：主詞是物（會議室）；reserve 及物，空格後接介系詞 for → 沒受詞 → 被動 has been reserved。", "w": "(B)(D) 主動需要受詞；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "Several candidates _______ by the hiring committee so far.", "o": ["interview", "interviewing", "have  office furniture → 主動；for over 40 years → 現在完成式。", "w": "(A)(B) 被動後面不應有受詞；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The parking lot _______ while new lighting is installed.", "o": ["repaves", "will be repaved", "repaving", "will repave"], "a": 1, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "在安裝新照明期間，停車場將重新鋪設路面。", "e": "Step 2：主詞是物（停車場），repave 及物，空格後接 while 子句，沒有受詞 → 被動 will be repaved。", "w": "(A)(D) 主動，停車場不會自己鋪路；(C) 不是真動詞。"}, {"g": "t_p5voice", "q": "The client _______ the final design before it went into production.", "o": ["approving", "approved", "has been approved", "was approved"], "a": 1, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "客戶在投入生產前核准了最終設計。", "e": "Step 2：空格後有受詞 the final design → 主動 approved。", "w": "(C)(D) 被動後面不應有受詞；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Several new products _______ at the trade fair next month.", "o": ["displaying", "display", "will display", "will be displayed"], "a": 3, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "數項新產品將在下個月的商展中展出。", "e": "Step 2：產品是被展示的，空格後接 at，沒有受詞 → 被動 will be displayed。", "w": "(B)(C) 主動，產品不會自己展示；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "The building's elevators _______ every six months by a licensed technician.", "o": ["inspecting", "inspect", "are inspected", "have inspected"], "a": 2, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "大樓電梯每半年由合格技師檢查一次。", "e": "Step 2：後面有 by a licensed technician → 被動 are inspected。", "w": "(B)(D) 主動；(A) 不是真動詞。"}, {"g": "t_p5voice", "q": "Ms. Novak _______ a promotion after only two years at the firm.", "o": ["was offered", "offering", "offered", "has offered"], "a": 0, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "Novak 女士進公司僅兩年就獲得升遷機會。", "e": "Step 2：offer 是雙受詞動詞（offer 人 物）。主詞是收到的人，後面只剩「物」a promotion → 被動 was offered（人被提供某物）。", "w": "(C)(D) 主動表示她提供升遷給別人，但後面缺「人」；(B) 不是真動詞。"}, {"g": "t_p5voice", "q": "The training session _______ by more than 80 employees.", "o": ["was attended", "has attended", "attending", "attended"], "a": 0, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "有 80 多位員工參加了這場訓練課程。", "e": "Step 2： , {"g": "t_p5voice", "q": "The technician _______ the new software on all computers yesterday.", "o": ["has been installed", "installed", "was installed", "installing"], "a": 1, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "技師昨天在所有電腦上安裝了新軟體。", "e": "Step 2：空格後有受詞 the new software → 主動 installed。", "w": "(A)(C) 被動後面不應有受詞；(D) 不是真動詞。"}, {"g": "t_p5voice", "q": "Free samples _______ to the first 100 visitors.", "o": ["will give", "giving", "will be given", "give"], "a": 2, "h": "Step 2：這個動詞後面有沒有直接接受詞？", "trans": "前 100 名訪客將獲贈免費樣品。", "e": "Step 2：樣品是被贈送的，空格後接 to，沒有受詞 → 被動 will be given。", "w": "(A)(D) 主動，樣品不會自己送；(B) 不是真動詞。"}]}, {"id": "p5_tense", "kind": "toeic", "part": 5, "stage": 2, "title": "時態線索 1", "sub": "Step 3：since／for → have p.p.；by＋未來 → will have p.p.；ago／last → 過去式", "qs": [{"g": "t_p5tense", "q": "Ms. Hughes _______ for the company since 2015.", "o": ["has worked", "worked", "works", "will work"], "a": 0, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "Hughes 女士自 2015 年起就在這家公司工作。", "e": "Step 3：since ＋ 過去時間點 → 現在完成式 have/has ＋ p.p.。", "w": "(C) 現在簡單式不搭 since；(B) 過去式表示已結束，但 since 延續到現在；(D) 未來式不合。"}, {"g": "t_p5tense", "q": "By the end of next year, the company _______ five new stores.", "o": ["opens", "has opened", "will have opened", "opened"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "到明年年底，公司將已開設五家新店。", "e": "Step 3：by ＋ 未來時間 → 未來完成式 will have ＋ p.p.。", "w": "(A)(B)(D) 都無法表達「到未來某時已完成」。"}, {"g": "t_p5tense", "q": "The supplier _______ the shipment yesterday afternoon.", "o": ["will send", "sends", "has sent", "sent"], "a": 3, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "供應商昨天下午寄出了這批貨。", "e": "Step 3：yesterday（過去明確時間點）→ 過去式 sent。", "w": "(C) 現在完成式不能搭配明確的過去時間；(A)(B) 時態不合。"}, {"g": "t_p5tense", "q": "Over the past five years, our sales _______ steadily.", "o": ["will increase", "have increased", "increase", "are increasing"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "過去五年來，我們的銷售額穩定成長。", "e": "Step 3：over the past ＋ 一段時間 → 現在完成式 have increased。", "w": "(C)(D) 現在式不搭 over the past…；(A) 未來式不合。"}, {"g": "t_p5tense", "q": "The new manager _______ next Monday.", "o": ["has started", "started", "will start", "had started"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "新經理將於下週一到職。", "e": "Step 3：next Monday（未來時間）→ 未來式 will start。", "w": "(A)(B)(D) 都是過去或完成時態。"}, {"g": "t_p5tense", "q": "By the time the CEO arrives, the presentation _______.", "o": ["began", "will have begun", "has begun", "begins"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "等執行長到的時候，簡報應該已經開始了。", "e": "Step 3：by the time ＋ 現在式（arrives）→ 主句用未來完成式 will have ＋ p.p.。", "w": "(A)(C)(D) 無法表達「到未來那時已經發生」。"}, {"g": "t_p5tense", "q": "Mr. Lopez _______ the report last Friday.", "o": ["completed", "has completed", "completes", "will complete"], "a": 0, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "Lopez 先生上週五完成了報告。", "e": "Step 3：last Friday（過去明確時間點）→ 過去式 completed。", "w": "(B) 現在完成式不搭配明確過去時間；(C)(D) 時態不合。"}, {"g": "t_p5tense", "q": "Our company _______ in the industry for more than 30 years.", "o": ["is", "was", "will be", "has been"], "a": 3, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "我們公司已在業界超過 30 年。", "e": "Step 3：for ＋ 一段時間（並延續到現在）→ 現在完成式 has been。", "w": "(A) 現在式不搭 for 一段時間；(B) 表示已結束；(C) 未來式不合。"}, {"g": "t_p5tense", "q": "The board _______ the proposal at next month's meeting.", "o": ["had reviewed", "will review", "has reviewed", "reviewed"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "董事會將在下個月的會議上審查這份提案。", "e": "Step 3：next month's meeting（未來）→ 未來式 will review。", "w": "(A)(C)(D) 都是過去或完成時態。"}, {"g": "t_p5tense", "q": "Ms. Nguyen _______ to Singapore three times so far this year.", "o": ["had traveled", "travels", "has traveled", "will travel"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / l s 50th anniversary next year.", "o": ["celebrated", "has celebrated", "celebrates", "will celebrate"], "a": 3, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "公司明年將慶祝成立 50 週年。", "e": "Step 3：next year（未來）→ will celebrate。", "w": "(A)(B) 過去或完成時態；(C) 現在簡單式不表這種未來事件。"}, {"g": "t_p5tense", "q": "Ms. Gupta _______ in Singapore for three years before she moved to London.", "o": ["will live", "lives", "had lived", "has lived"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "Gupta 女士搬到倫敦之前，在新加坡住了三年。", "e": "Step 3：發生在另一個過去事件（moved）之前，並持續一段時間 → 過去完成式 had lived。", "w": "(B)(D) 現在時態不合；(A) 未來式不合。"}, {"g": "t_p5tense", "q": "Ms. Ortiz _______ three industry conferences so far this year.", "o": ["will attend", "has attended", "attends", "attended"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "Ortiz 女士今年到目前為止已參加了三場產業會議。", "e": "Step 3：so far（到目前為止）→ 現在完成式 has attended。", "w": "(C) 現在簡單式表習慣；(D) 過去式不搭 so far；(A) 未來式不合「已參加」。"}, {"g": "t_p5tense", "q": "If the client _______ the contract tomorrow, we will start the project on Monday.", "o": ["signed", "will sign", "has signed", "signs"], "a": 3, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "如果客戶明天簽約，我們週一就開始執行專案。", "e": "Step 3：if 條件子句表未來時，用現在式代替未來式 → signs。", "w": "(B) 條件子句不用 will；(A)(C) 時態不合。"}, {"g": "t_p5tense", "q": "By the end of this week, we _______ all the job applications.", "o": ["reviewed", "review", "will have reviewed", "have reviewed"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "到本週結束前，我們將審完所有求職申請。", "e": "Step 3：by the end of ＋ 未來時間 → will have ＋ p.p.。", "w": "(A)(B)(D) 無法表達「到未來某時已完成」。"}, {"g": "t_p5tense", "q": "The board _______ the merger proposal at yesterday's meeting.", "o": ["has approved", "approved", "will approve", "approves"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "董事會在昨天的會議上通過了合併提案。", "e": "Step 3：yesterday's meeting（明確過去時間）→ 過去式 approved。", "w": "(A) 不搭明確過去時間；(C)(D) 時態不合。"}, {"g": "t_p5tense", "q": "Mr. Lee _______ for the company for 15 years next month.", "o": ["will have worked", "worked", "has worked", "will work"], "a": 0, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "到下個月，李先生就在這家公司服務滿 15 年了。", "e": "Step 3：for ＋ 一段時間 ＋ 未來時間點（next month）→ 未來完成式 will have worked。", "w": "(D) 單純未來式無法表達「累積到那時滿 15 年」；(B) 過去式；(C) 現在完成式不搭 next month。"}, {"g": "t_p5tense", "q": "Since its opening, the restaurant _______ several awards.", "o": ["wins", "has won", "will win", "won"], "a": 1, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "自開幕以來，這家餐廳已獲得數個獎項。", "e": "Step 3：Since ＋ 過去時間（its opening）→ has won。", "w": "(A)(C)(D) 都不搭 since。"}, {"g": "t_p5tense", "q": "The manager _______ a decision on the matter yet.", "o": ["had not been made", "does not make", "has not made", "will not make"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "經理尚未對這件事做出決定。", "e": "Step 3：句尾 yet（尚未）→ 現在完成式否定 has not made。", "w": "(A) 被動且是過去完成式，後面卻有受詞 a decision；(B)(D) 現在簡單式、未來式不搭 yet。"}, {"g": "t_p5tense", "q": "Ms. Brown _______ the report when the fire alarm went off.", "o": ["was writing", "has written", "writes", "will write"], "a": 0, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "火警警報響起時，Brown 女士正在寫報告。", "e": "Step 3：when ＋ 過去式（went off）表示當時正在進行的動作被打斷 → 過去進行式 was writing。", "w": "(B)(C)(D) 時態與過去時間點不合。"}, {"g": "t_p5tense", "q": "Our sales _______ by 10 percent last quarter.", "o": ["have increased", "will increase", "increase", "increased"], "a": 3, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "我們的銷售額上一季增加了 10%。", "e": "Step 3：last quarter（明確過去時間）→ 過去式 increased。", "w": "(A) 不搭明確過去時間；(B)(C) 時態不合。"}, {"g": "t_p5tense", "q": "The company _______ new employees every spring.", "o": ["hired", "will have hired", "hires", "has hired"], "a": 2, "h": "Step 3：找時間線索（since / for / by / ago / last / next…）。", "trans": "公司每年春天都會招募新員工。", "e": "Step 3：every spring（反覆、習慣）→ 現在簡單式 hires。", "w": "(A)(B)(D) 不表示固定習慣。"}]}, {"id": "p5_chunk_1", "kind": "toeic", "part": 5, "stage": 3, "title": "固定搭配 1", "sub": "不背單字中文，背「字＋介系詞」的整塊搭配", "qs": [{"g": "t_p5chunk", "q": "All factory workers must _______ with the new safety regulations.", "o": ["observe", "comply", "obey", "follow"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "所有工廠員工都必須遵守新的安全規定。", "e": "搭配：comply with ＋ 規定。看到空格後是 with，四個「遵守」中只有 comply 接 with。", "w": "follow / obey / observe 都是及物動詞，直接接受詞，不加 with。"}, {"g": "t_p5chunk", "q": "Full-time employees are _______ for the annual bonus.", "o": ["capable", "able", "possible", "eligible"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "全職員工有資格領取年終獎金。", "e": "搭配：be eligible for ＋ 補助／獎金／晉升（有資格獲得）。", "w": "be capable of；be able to V；possible 不用來形容人有資格。"}, {"g": "t_p5chunk", "q": "Passengers are asked to _______ from smoking anywhere in the airport.", "o": ["avoid", "stop", "refrain", "prevent"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "請旅客在機場內任何地方都不要吸菸。", "e": "搭配：refrain from ＋ V-ing（克制不做）。看到 from ＋ V-ing 就選 refrain。", "w": "avoid / stop 直接接 V-ing，不加 from；prevent 要用 prevent sb from V-ing，中間要有受詞。"}, {"g": "t_p5chunk", "q": "The two companies finally _______ an agreement after months of negotiations.", "o": ["reached", "came", "arrived", "went"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "經過數月協商，兩家公司終於達成協議。", "e": "搭配：reach an agreement / a consensus / a decision（達成）。reach 是及物動詞，直接接受詞。", "w": "arrive at、come to 才能接 agreement，空格後沒有介系詞；go 不搭。"}, {"g": "t_p5chunk", "q": "The new manager plans to _______ a policy that allows flexible working hours.", "o": ["implement", "perform", "proceed", "operate"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "新經理計畫實施允許彈性工時的政策。", "e": "搭配：implement a policy / plan / system（實施）。", "w": "perform a task；operate a machine；proceed with（不及物）。"}, {"g": "t_p5chunk", "q": "Ms. Kim is _______ for managing the company's social media accounts.", "o": ["capable", "aware", "responsible", "dependent"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "金女士負責管理公司的社群媒體帳號。", "e": "搭配：be responsible for ＋ N／V-ing（負責）。", "w": "capable of；dependent on；aware of，介系詞都不是 for。"}, {"g": "t_p5chunk", "q": "The team was able to _______ the deadline despite the technical problems.", "o": ["arrive", "take", "attend", "meet"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "儘管有技術問題，團隊仍趕上了截止期限。", "e": "搭配：meet the deadline（趕上期限）、meet the needs / requirements。", "w": "arrive 不及物；attend a meeting；take 不搭 deadline。"}, {"g": "t_p5chunk", "q": "The CEO will _______ the concerns raised by shareholders at the meeting.", "o": ["talk", "address", "speak", "respond"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "執行長將在會議上處理股東提出的疑慮。", "e": "搭配：address the concerns / issues（處理、回應）。address 及物，直接接受詞。", "w": "speak / talk 要加 about；respond 要加 to。"}, {"g": "t_p5chunk", "q": "The success of the project will _______ on the support of all departments.", "o": ["consist", "contribute", "result", "depend"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "專案的成功將取決於所有部門的支持。", "e": "搭配：depend on（取決於）。", "w": "consist of；result in / from；contribute to。"}, {"g": "t_p5chunk", "q": "Please _______ to the attached document for further details.", "o": ["check", "see", "refer", "look"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "詳情請參閱附件文件。", "e": "搭配：refer to ＋ 文件（參閱）。空格後是 to，選 refer。", "w": "look at；see 與 check 是及物，直接接受詞，不加 to。"}, {"g": "t_p5chunk", "q": "The company has decided to _______ in new technology to improve productivity.", "o": ["invest", "spend", "fund", "pay"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "公司決定投資新技術以提升生產力。", "e": "搭配：invest in（投資於）。", "w": "spend (money) on；pay for；fund 是及物，直接接受詞。"}, {"g": "t_p5chunk", "q": "Our new product line has been _______ received by customers.", "o": ["friendly", "favorably", "kindly", "pleasantly"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們的新產品線深受顧客好評。", "e": "搭配：be favorably received（獲得好評）。", "w": "kindly 表「親切地」，不搭 received；friendly 是形容詞；pleasantly 不是固定搭配。"}, {"g": "t_p5chunk", "q": "Mr. Jones will _______ for the position of branch manager.", "o": ["apply", "request", "register", "submit"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "Jones 先生將應徵分店經理一職。", "e": "搭配：apply for ＋ 職位（應徵）。", "w": "submit an application（及物）；request 及物，直接接受詞；register for 指報名課程或活動，不用於職位。"}, {"g": "t_p5chunk", "q": "The board of directors _______ of seven members.", "o": ["comprises", "includes", "contains", "consists"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "董事會由七名成員組成。", "e": "搭配：consist of（由…組成）。空格後有 of，只有 consist 能接。", "w": "includes / contains / comprises 都是及物動詞，直接接受詞，不加 of。"}, {"g": "t_p5chunk", "q": "The manager _______ the importance of customer satisfaction.", "o": ["concentrated", "emphasized", "focused", "insisted"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "經理強調了顧客滿意度的重要性。", "e": "搭配：emphasize ＋ 受詞（及物，直接接）。空格後直接接名詞，沒有介系詞。", "w": "insist on；focus on；concentrate on，都需要 on。"}, {"g": "t_p5chunk", "q": "The company will _______ its employees for any travel expenses.", "o": ["refund", "restore", "reimburse", "return"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "公司會補償員工的所有差旅費用。", "e": "搭配：reimburse sb for ＋ 費用（報銷）。人在前，for 接費用。", "w": "refund 的受詞通常是錢（refund the fee）；return 歸還；restore 恢復。"}, {"g": "t_p5chunk", "q": "Customers are _______ to present their membership cards at checkout.", "o": ["necessary", "required", "demanded", "needed"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "顧客結帳時須出示會員卡。", "e": "搭配：be required to V（被要求）。", "w": "need 不用 be needed to 表示人被要求；necessary 不以人當主詞；demand 不用「人 be demanded to」。"}, {"g": "t_p5chunk", "q": "Ms. Patel was _______ to manager after five years with the firm.", "o": ["grown", "raised", "increased", "promoted"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "Patel 女士在公司任職五年後升為經理。", "e": "搭配：be promoted to ＋ 職位（升遷）。", "w": "raise 用於薪水（get a raise）；increase / grow 用於數量。"}, {"g": "t_p5chunk", "q": "The new regulations will take _______ on January 1.", "o": ["effect", "action", "affect", "place"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "新法規將於 1 月 1 日生效。", "e": "搭配：take effect（生效）。", "w": "affect 是動詞；take place 表「舉行、發生」；take action 表「採取行動」，主詞是人。"}, {"g": "t_p5chunk", "q": "Due to high demand, the concert tickets sold _______ within an hour.", "o": ["over", "up", "out", "off"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "由於需求量大，演唱會門票一小時內就售罄。", "e": "搭配：sell out（售罄）。", "w": "sell off 表「拋售」；sell up、sell over 不是此意。"}]}, {"id": "p5_chunk_2", "kind": "toeic", "part": 5, "stage": 3, "title": "固定搭配 2", "sub": "不背單字中文，背「字＋介系詞」的整塊搭配", "qs": [{"g": "t_p5chunk", "q": "The company is _______ to providing excellent customer service.", "o": ["committed", "promised", "intended", "determined"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "公司致力於提供卓越的顧客服務。", "e": "搭配：be committed to ＋ V-ing（致力於）。這裡的 to 是介系詞，所以後面接 providing。", "w": "intended / determined / promised 後面的 to 是不定詞，要接原形 provide。"}, {"g": "t_p5chunk", "q": "Please _______ the attached file before the meeting.", "o": ["go", "review", "look", "refer"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "會議前請先看過附件檔案。", "e": "搭配：review ＋ 受詞（及物）。空格後直接接名詞，沒有介系詞。", "w": "look at；refer to；go over 都需要介系詞或副詞。"}, {"g": "t_p5chunk", "q": "The project is expected to be completed _______ schedule.", "o": ["before", "prior", "in advance", "ahead of"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "專案預計會提前完成。", "e": "搭配：ahead of schedule（提前）；behind schedule（落後）；on schedule（如期）。", "w": "prior 要用 prior to；in advance 後面不接名詞；before schedule 不是慣用說法。"}, {"g": "t_p5chunk", "q": "We look forward to _______ with you again.", "o": ["works", "worked", "working", "work"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們期待再次與您合作。", "e": "搭配：look forward to ＋ V-ing。這裡的 to 是介系詞。", "w": "其他形式都不能接在介系詞 to 後面。"}, {"g": "t_p5chunk", "q": "The seminar will _______ place in the main auditorium.", "o": ["take", "make", "hold", "have"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "研討會將在大禮堂舉行。", "e": "搭配：take place（舉行、發生）。", "w": "hold 要用被動 be held；make place、have place 不是此意。"}, {"g": "t_p5chunk", "q": "Employees are _______ to wear business attire on Mondays.", "o": ["hoped", "wanted", "waited", "expected"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "員工週一應穿著商務服裝。", "e": "搭配：be expected to V（應該、被期望）。", "w": "hope 不用於「人 be hoped to」；wanted to 多用於主動；wait 不及物。"}, {"g": "t_p5chunk", "q": "The marketing campaign had a significant _______ on sales.", "o": ["result", "outcome", "impact", "consequence"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "這次行銷活動對銷售產生了重大影響。", "e": "搭配：have an impact on（對…有影響）。空格後是 on。", "w": "result of / in；consequence of；outcome of，都不接 on。"}, {"g": "t_p5chunk", "q": "Please _______ us know if you need any further information.", "o": ["allow", "let", "make", "have"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "如需更多資訊，請告訴我們。", "e": "搭配：let sb know（告知），信件結尾的超高頻句。", "w": "make sb know 語意不對；allow sb to know 要加 to；have sb know 不是慣用說法。"}, {"g": "t_p5chunk", "q": "Mr. Chen will _______ the training session in place of the director.", "o": ["make", "conduct", "do", "perform"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "陳先生將代替主任主持這場訓練課程。", "e": "搭配：conduct a session / survey / meeting（主持、進行）。", "w": "make、do、perform 都不與 session 搭配表示主持。"}, {"g": "t_p5chunk", "q": "We apologize _______ any inconvenience this may cause.", "o": ["about", "to", "for", "of"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "若造成任何不便，我們深感抱歉。", "e": "搭配：apologize to ＋ 人 for ＋ 事。空格後是「事」（inconvenience）→ for。", "w": "to 後面接人；about、of 不是固定搭配。"}, {"g": "t_p5chunk", "q": "The firm has a reputation _______ reliable service.", "o": ["with", "at", "to", "for"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "這家公司以服務可靠著稱。", "e": "搭配：a reputation for ＋ N（以…聞名）。", "w": "to、at、with 不與 reputation 構成這個意思。"}, {"g": "t_p5chunk", "q": "Ms. Rossi is fluent _______ three languages.", "o": ["in", "with", "at", "on"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "Rossi 女士精通三種語言。", "e": "搭配：be fluent in ＋ 語言。", "w": "at、with、on 不搭 fluent。"}, {"g": "t_p5chunk", "q": "The construction of the bridge is _______ to finish next spring.", "o": ["scheduled", "prepared", "organized", "arranged"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "大橋工程預定明年春天完工。", "e": "搭配：be scheduled to V / for ＋ 時間（預定）。", "w": "arranged、organized、prepared 不用於「預定在某時間完成」。"}, {"g": "t_p5chunk", "q": "All staff members should be _______ of the new security procedures.", "o": ["concerned", "notice", "aware", "known"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "所有員工都應了解新的保全程序。", "e": "搭配：be aware of（知道、意識到）。", "w": "be known for / as；notice 是名詞或動詞；be concerned about / with。"}, {"g": "t_p5chunk", "q": "The director gave a speech to _______ the company's 50th anniversary.", "o": ["compliment", "praise", "congratulate", "celebrate"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "總監發表演說慶祝公司成立 50 週年。", "e": "搭配：celebrate ＋ 節日／週年（慶祝）。", "w": "congratulate sb on sth（受詞是人）；praise、compliment 的受詞是人或表現。"}, {"g": "t_p5chunk", "q": "Our company specializes _______ custom software solutions.", "o": ["on", "in", "with", "at"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "本公司專精於客製化軟體解決方案。", "e": "搭配：specialize in（專精於）。", "w": "on、at、with 不搭 specialize。"}, {"g": "t_p5chunk", "q": "The manager _______ the team to work harder to reach the sales target.", "o": ["suggested", "recommended", "encouraged", "insisted"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "經理鼓勵團隊更加努力以達成業績目標。", "e": "搭配：encourage sb to V（鼓勵某人去做）。", "w": "suggest / recommend 不接 sb to V（要用 suggest that…）；insist on。"}, {"g": "t_p5chunk", "q": "The price of the package _______ breakfast and airport transfer.", "o": ["includes", "belongs", "consists", "composes"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "套裝價格包含早餐與機場接送。", "e": "搭配：include ＋ 受詞（及物，直接接）。", "w": "consist of；compose 多用被動 be composed of；belong to。"}, {"g": "t_p5chunk", "q": "We are _______ to announce the opening of our new branch in Kaohsiung.", "o": ["pleasing", "pleasant", "pleasure", "pleased"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們很高興宣布高雄新分店開幕。", "e": "搭配：be pleased to V（很高興做…）。人的感受用 p.p.（-ed）。", "w": "pleasing / pleasant 形容「令人愉快的事物」；pleasure 是名詞。"}, {"g": "t_p5chunk", "q": "Please keep the receipt _______ proof of purchase.", "o": ["like", "as", "so", "such"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "請保留收據作為購買證明。", "e": "搭配：keep sth as ＋ 名詞（把…當作）。", "w": "like 表「像」；such 要用 such as；so 不接名詞。"}]}, {"id": "p5_chunk_3", "kind": "toeic", "part": 5, "stage": 3, "title": "固定搭配 3", "sub": "不背單字中文，背「字＋介系詞」的整塊搭配", "qs": [{"g": "t_p5chunk", "q": "Ms. Diaz is _______ with the new accounting software.", "o": ["used", "known", "aware", "familiar"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "Diaz 女士熟悉新的會計軟體。", "e": "搭配：be familiar with（熟悉）。空格後是 with。", "w": "be aware of；be known for／as；be used to，介系詞都不是 with。"}, {"g": "t_p5chunk", "q": "All staff are encouraged to _______ in the charity event.", "o": ["participate", "enter", "attend", "take"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "鼓勵所有員工參加慈善活動。", "e": "搭配：participate in（參加）。空格後是 in。", "w": "attend、enter 是及物動詞，直接接受詞；take part in 才對，單獨 take 不行。"}, {"g": "t_p5chunk", "q": "The new machine is _______ of producing 500 units per hour.", "o": ["possible", "available", "capable", "able"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "新機器每小時能生產 500 件。", "e": "搭配：be capable of ＋ V-ing。空格後是 of。", "w": "be able to V；possible 不以物或人當主詞表能力；available 是「可取得的」。"}, {"g": "t_p5chunk", "q": "Our customer service team will _______ with your complaint as soon as possible.", "o": ["handle", "deal", "solve", "treat"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們的客服團隊會盡快處理您的投訴。", "e": "搭配：deal with（處理）。空格後是 with。", "w": "handle、solve 是及物動詞，直接接受詞；treat 不搭 with 表處理投訴。"}, {"g": "t_p5chunk", "q": "Online sales now _______ for 40 percent of total revenue.", "o": ["account", "take", "make", "occupy"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "線上銷售現在占總營收的 40%。", "e": "搭配：account for ＋ 比例（占…）。", "w": "make up 才表「構成」；take、occupy 不接 for。"}, {"g": "t_p5chunk", "q": "Mr. Lim is in _______ of the marketing budget.", "o": ["power", "charge", "duty", "response"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "林先生負責行銷預算。", "e": "搭配：in charge of（負責、主管）。", "w": "on duty 值班；in response to 回應；in power 執政，都不是此意。"}, {"g": "t_p5chunk", "q": "I am writing on _______ of the entire team to thank you.", "o": ["part", "side", "behalf", "instead"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我謹代表全體團隊向您致謝。", "e": "搭配：on behalf of（代表）。", "w": "instead of 不加 on；on the part of 要有 the；on side of 不是慣用說法。"}, {"g": "t_p5chunk", "q": "Please book your tickets in _______ to secure a seat.", "o": ["ahead", "front", "before", "advance"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "請提前訂票以確保有座位。", "e": "搭配：in advance（事先）。", "w": "ahead of 要接名詞；in front 指空間位置；in before 不成立。"}, {"g": "t_p5chunk", "q": "Customers can take _______ of the special discount until Friday.", "o": ["profit", "advantage", "use", "benefit"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "顧客在週五前都可以利用這項特別折扣。", "e": "搭配：take advantage of（利用）。", "w": "benefit from；profit from；make use of，都不和 take…of 搭配。"}, {"g": "t_p5chunk", "q": "All prices are _______ to change without notice.", "o": ["subject", "related", "objected", "changed"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "所有價格如有變動，恕不另行通知。", "e": "搭配：be subject to ＋ N（可能受…影響）。這裡的 to 是介系詞，後面接名詞 change。", "w": "objected to 表反對；changed 語意重複；related to 表有關，語意不合。"}, {"g": "t_p5chunk", "q": "The project was carried out in _______ with the company's guidelines.", "o": ["regard", "relation", "according", "accordance"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "專案是依照公司的準則執行的。", "e": "搭配：in accordance with（依照）。", "w": "according to 不加 in 也不接 with；in relation to；in regard to，介系詞都是 to。"}, {"g": "t_p5chunk", "q": "All guests must check out _______ to 11 A.M.", "o": ["before", "earlier", "prior", "until"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "所有房客必須在上午 11 點前退房。", "e": "搭配：prior to（在…之前）。空格後是 to，只有 prior 能接。", "w": "before、until 直接接時間，不加 to；earlier than 才對。"}, {"g": "t_p5chunk", "q": "_______ of January 1, the new service fee will apply.", "o": ["As", "From", "By", "Since"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "自 1 月 1 日起，新服務費將開始適用。", "e": "搭配：as of ＋ 日期（自…起生效）。空格後是 of。", "w": "Since、From、By 都不接 of。"}, {"g": "t_p5chunk", "q": "In _______ to customer feedback, we have extended our opening hours.", "o": ["responsive", "response", "responsibility", "respond"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "為回應顧客意見，我們延長了營業時間。", "e": "搭配：in response to（回應）。", "w": "respond 是動詞；responsive 是形容詞；responsibility 是「責任」，in responsibility to 不是慣用說法。"}, {"g": "t_p5chunk", "q": "_______ to expectations, sales increased during the recession.", "o": ["Different", "Opposite", "Contrary", "Unlike"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "與預期相反，經濟衰退期間銷售額反而增加。", "e": "搭配：contrary to（與…相反）。", "w": "opposite 不接 to 當句首副詞片語；different from；unlike 直接接名詞，不加 to。"}, {"g": "t_p5chunk", "q": "Employees are _______ to working long hours during the busy season.", "o": ["familiar", "habit", "usual", "accustomed"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "員工已經習慣在旺季長時間工作。", "e": "搭配：be accustomed to ＋ V-ing（習慣於）。", "w": "usual 不這樣用；familiar with；habit 是名詞。"}, {"g": "t_p5chunk", "q": "Thank you for attending the meeting on such short _______.", "o": ["time", "warning", "note", "notice"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "謝謝您在這麼臨時的通知下出席會議。", "e": "搭配：on short notice（臨時通知）。", "w": "time、note、warning 都不與 on short 構成慣用說法。"}, {"g": "t_p5chunk", "q": "Please reply at your earliest _______.", "o": ["comfort", "convenience", "ease", "leisure"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "請在您方便時儘早回覆。", "e": "搭配：at your earliest convenience（在您方便時儘早）。商業書信高頻句。", "w": "comfort、leisure、ease 不與 earliest 構成這個說法。"}, {"g": "t_p5chunk", "q": "You can _______ an order online or by phone.", "o": ["give", "do", "place", "put"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "您可以在線上或透過電話下訂單。", "e": "搭配：place an order（下訂單）。", "w": "put、do、give 不與 order 構成「下單」。"}, {"g": "t_p5chunk", "q": "We recommend that you _______ a reservation at least one week ahead.", "o": ["make", "do", "set", "take"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們建議您至少提前一週預約。", "e": "搭配：make a reservation（預約）。", "w": "do、take、set 不與 reservation 搭配。"}]}, {"id": "p5_chunk_4", "kind": "toeic", "part": 5, "stage": 3, "title": "固定搭配 4", "sub": "不背單字中文，背「字＋介系詞」的整塊搭配", "qs": [{"g": "t_p5chunk", "q": "The charity event _______ over $50,000 for the local hospital.", "o": ["raised", "grew", "arose", "rose"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "慈善活動為當地醫院募得超過五萬美元。", "e": "搭配：raise funds／money（募款）。raise 是及物動詞，後面接受詞 $50,000。", "w": "rose、arose 是不及物動詞；grew 不表募款。"}, {"g": "t_p5chunk", "q": "Please pay close _______ to the safety instructions.", "o": ["notice", "mind", "attention", "care"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "請密切注意安全說明。", "e": "搭配：pay attention to（注意）。", "w": "take care of；take notice of；mind 是動詞，都不和 pay … to 搭配。"}, {"g": "t_p5chunk", "q": "The east wing of the hospital is currently under _______.", "o": ["foundation", "build", "establishment", "construction"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "醫院東翼目前正在施工中。", "e": "搭配：under construction（施工中）。", "w": "build 是動詞；under establishment、under foundation 不是慣用說法。"}, {"g": "t_p5chunk", "q": "The store carries a wide _______ of outdoor equipment.", "o": ["number", "range", "amount", "deal"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "這家店販售種類繁多的戶外用品。", "e": "搭配：a wide range of（各式各樣的）。", "w": "a large amount／number of，a great deal of，都不和 wide 搭配。"}, {"g": "t_p5chunk", "q": "The app helps users keep _______ of their daily expenses.", "o": ["path", "trace", "track", "line"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "這個 App 幫助使用者記錄每天的開銷。", "e": "搭配：keep track of（追蹤、記錄）。", "w": "trace、path、line 不與 keep … of 構成這個意思。"}, {"g": "t_p5chunk", "q": "Full-time employees are _______ to 15 days of paid leave per year.", "o": ["eligible", "allowed", "qualified", "entitled"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "全職員工每年享有 15 天有薪假。", "e": "搭配：be entitled to ＋ N（有權享有）。空格後是 to ＋ 名詞。", "w": "be eligible for ＋ N；be allowed to ＋ V；be qualified for ＋ N，都不能接 to ＋ 名詞。"}, {"g": "t_p5chunk", "q": "In the _______ of a fire, please use the emergency exits.", "o": ["result", "event", "moment", "time"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "萬一發生火災，請使用緊急出口。", "e": "搭配：in the event of（萬一發生…）。", "w": "time、moment、result 不與 in the … of 構成「萬一」。"}, {"g": "t_p5chunk", "q": "The train arrived exactly _______ time.", "o": ["on", "in", "by", "at"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "火車準時抵達。", "e": "搭配：on time（準時）；in time 是「及時、來得及」。exactly 修飾準時 → on time。", "w": "in time 表及時，不和 exactly 搭配；at time、by time 不是慣用說法。"}, {"g": "t_p5chunk", "q": "The design team came _______ with a creative solution.", "o": ["in", "across", "up", "over"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "設計團隊想出了一個有創意的解決方案。", "e": "搭配：come up with（想出）。", "w": "come in；come over；come across（偶然遇到），都不接 with 表想出。"}, {"g": "t_p5chunk", "q": "The research was carried _______ by an independent agency.", "o": ["away", "out", "over", "off"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "這項研究由一家獨立機構執行。", "e": "搭配：carry out（執行）。", "w": "carry off 奪走、成功做到；carry over 延續；carry away 使失控。"}, {"g": "t_p5chunk", "q": "Ms. Lee turned _______ the job offer because of the long commute.", "o": ["out", "off", "over", "down"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "因為通勤時間太長，李女士婉拒了這份工作。", "e": "搭配：turn down（拒絕）。", "w": "turn off 關掉；turn out 結果是；turn over 翻轉、移交。"}, {"g": "t_p5chunk", "q": "We need to set _______ a meeting with the client next week.", "o": ["up", "in", "out", "off"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們需要安排下週和客戶開會。", "e": "搭配：set up a meeting（安排會議）。", "w": "set off 出發；set out 開始著手；set in 開始（多指壞天氣）。"}, {"g": "t_p5chunk", "q": "The manager promised to look _______ the customer's complaint.", "o": ["into", "after", "out", "up"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "經理承諾會調查顧客的投訴。", "e": "搭配：look into（調查）。", "w": "look out 小心；look after 照顧；look up 查詢（單字、資料）。"}, {"g": "t_p5chunk", "q": "In _______ of quality, our products are the best on the market.", "o": ["spite", "terms", "sense", "case"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "就品質而言，我們的產品是市場上最好的。", "e": "搭配：in terms of（就…而言）。", "w": "in a sense 不接 of；in spite of 儘管；in case of 萬一，語意不合。"}, {"g": "t_p5chunk", "q": "I am writing with _______ to your recent inquiry.", "o": ["regarding", "relate", "regard", "concerning"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我寫信是為了回覆您最近的詢問。", "e": "搭配：with regard to（關於）。", "w": "relate 是動詞；concerning、regarding 本身就是介系詞，不加 with … to。"}, {"g": "t_p5chunk", "q": "The company succeeded _______ reducing its costs by 10 percent.", "o": ["at", "on", "to", "in"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "公司成功將成本降低了 10%。", "e": "搭配：succeed in ＋ V-ing（成功做到）。", "w": "at、to、on 不與 succeed 搭配。"}, {"g": "t_p5chunk", "q": "The new flexible schedule has resulted _______ higher employee satisfaction.", "o": ["in", "from", "to", "of"], "a": 0, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "新的彈性工時帶來更高的員工滿意度。", "e": "搭配：result in ＋ 結果（導致）；result from ＋ 原因（由…造成）。彈性工時是原因，滿意度是結果 → result in。", "w": "result from 方向相反；result of、result to 不是正確搭配。"}, {"g": "t_p5chunk", "q": "The equipment is inspected on a regular _______.", "o": ["base", "period", "term", "basis"], "a": 3, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "設備會定期檢查。", "e": "搭配：on a regular basis（定期地）。", "w": "base 是基地；period、term 不與 on a regular 搭配。"}, {"g": "t_p5chunk", "q": "Delivery is free of _______ for orders over $50.", "o": ["money", "charge", "pay", "price"], "a": 1, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "訂單超過 50 美元即可免運費。", "e": "搭配：free of charge（免費）。", "w": "price、pay、money 不與 free of 構成慣用說法。"}, {"g": "t_p5chunk", "q": "We are proud to _______ excellent service to all our clients.", "o": ["offered", "offering", "offer", "offers"], "a": 2, "h": "不要翻譯四個選項，先看空格後面接的介系詞或搭配字。", "trans": "我們很自豪能為所有客戶提供卓越的服務。", "e": "搭配：be proud to ＋ 原形 V（很自豪能…）。", "w": "(A)(B)(D) 不能接在不定詞 to 後面。"}]}, {"id": "p5_vocab_1", "kind": "toeic", "part": 5, "stage": 3, "title": "單字語意題 1", "sub": "四個選項詞性相同 → 找句中的線索字判斷語意", "qs": [{"g": "t_p5vocab", "q": "The conference room is not _______ on Friday because it has been reserved for a client meeting.", "o": ["capable", "eligible", "available", "reliable"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "會議室週五無法使用，因為已被預約開客戶會議。", "e": "線索：because it has been reserved（已被預約）→ 不「可用的」→ available。", "w": "(A) capable 有能力的（主詞多為人）；(B) eligible 有資格的；(D) reliable 可靠的。"}, {"g": "t_p5vocab", "q": "Our delivery service is fast and _______, so customers can always count on it.", "o": ["eligible", "temporary", "available", "reliable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的配送服務快速又可靠，顧客隨時可以信賴。", "e": "線索：so customers can always count on it（可以依靠）→ reliable。", "w": "(C) 可用的；(A) 有資格的；(B) 暫時的，語意都不合 count on。"}, {"g": "t_p5vocab", "q": "Only employees who have worked here for at least one year are _______ for the bonus.", "o": ["eligible", "responsible", "reliable", "available"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "只有在此工作滿一年的員工才有資格領獎金。", "e": "線索：who have worked … at least one year（條件門檻）＋ for the bonus → eligible（有資格的）。", "w": "(C) 可靠的；(D) 可用的；(B) be responsible for 負責，語意不合「領獎金」。"}, {"g": "t_p5vocab", "q": "Due to the storm, the outdoor concert has been _______ until next weekend.", "o": ["canceled", "postponed", "attended", "expanded"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "因為暴風雨，戶外音樂會延到下週末舉行。", "e": "線索：until next weekend（到下週末）→ 延期 postponed。", "w": "(A) 取消後不會「到下週末」；(C) 參加；(D) 擴大。"}, {"g": "t_p5vocab", "q": "Please _______ your reservation by replying to this email within 24 hours.", "o": ["contain", "consist", "conduct", "confirm"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請在 24 小時內回覆此郵件確認您的預約。", "e": "線索：reservation ＋ by replying → confirm（確認）。", "w": "(C) 進行；(B) consist of 由…組成，不及物；(A) 包含。"}, {"g": "t_p5vocab", "q": "The new manager plans to _______ the hiring process to make it faster.", "o": ["complicate", "delay", "streamline", "prolong"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新經理計畫簡化招募流程，讓它更快速。", "e": "線索：to make it faster → 簡化、精簡 streamline。", "w": "(B)(D) 延長、延誤，語意相反；(A) 使複雜。"}, {"g": "t_p5vocab", "q": "The marketing campaign was very _______, increasing sales by 30 percent.", "o": ["exclusive", "effective", "expensive", "extensive"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這次行銷活動非常有效，讓銷售額增加了 30%。", "e": "線索：increasing sales by 30 percent（結果很好）→ effective（有效的）。", "w": "(C) 昂貴的；(D) 廣泛的；(A) 獨家的，都無法直接說明「增加銷售」。"}, {"g": "t_p5vocab", "q": "The hotel offers a _______ shuttle service to and from the airport at no extra cost.", "o": ["complimentary", "compulsory", "competitive", "complementary"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "飯店提供往返機場的免費接駁服務，不另收費。", "e": "線索：at no extra cost（不另收費）→ complimentary（免費贈送的）。", "w": "(D) complementary 互補的（形近陷阱）；(B) 強制的；(C) 有競爭力的。"}, {"g": "t_p5vocab", "q": "Attendance at the safety training is _______ for all factory workers.", "o": ["occasional", "voluntary", "mandatory", "optional"], "a"
