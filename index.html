const PAST=[{"id": "p104", "kind": "past", "title": "104 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 12–25、36–50 題）．官方答案", "unofficial": false, "qs": [{"n": 12, "g": "basic", "q": "下列何者不是用於資料的相關性分析(Correlation Analysis)?", "o": ["卡方檢定", "相關係數", "共變異數", "四分位數"], "a": 3}, {"n": 13, "g": "mining", "q": "分析資料、建構模型來預測顧客的貸款申請是「安全的」或「有風險的」,是下列何者?", "o": ["關聯規則探勘", "分類", "迴歸", "群集分析"], "a": 1}, {"n": 14, "g": "dw", "q": "下列何者為巨量資料最適當的定義?", "o": ["巨大資料量的資料集", "資料量大於1 TB的資料集", "資料量超出傳統資料庫的抓取、儲存、管理和分析能力的資料集", "資料量超出人類的抓取、儲存、管理和分析能力的資料集"], "a": 2}, {"n": 15, "g": "basic", "q": "巨量資料會使分析資訊的方式產生三大改變,不包括下列何者?", "o": ["能夠取得、分析的資料量大為增加", "不會堅持一切都要做到精準", "放下長久以來對於因果關係的堅持", "不需找出資料之間的相關性"], "a": 3}, {"n": 16, "g": "dw", "q": "關於巨量資料分析的概念,下列何者正確?", "o": ["巨量資料分析主要是針對量大的數據分析,因此對於資料來源多樣性和資料產生快慢等因素將不列入考慮", "巨量資料分析的資料格式僅限於結構化資料,因此非結構化與半結構化資料不納入其分析的範疇", "巨量資料分析的建模是透過由下而上(Bottom-Up)的數學歸納推理方式來解讀資料的規則,這和傳統資料庫系統以由上而下(Top-Down)的建模方式有所不同", "巨量資料分析方法可以利用現有資料庫管理系統技術來完成"], "a": 2}, {"n": 17, "g": "dw", "q": "關於分類的訓練資料集與測試資料集的敘述,下列何者有誤?", "o": ["訓練資料是從要分析的資料庫中隨機取樣", "訓練資料必須已經知道其類別", "測試資料集不應該包含訓練資料集中的資料", "測試資料可以不知道其類別"], "a": 3}, {"n": 18, "g": "mining", "q": "請問機器學習(Machine Learning)上所使用的深化學習(Deep Learning)和下列哪一個演算法有直接相關連?", "o": ["類神經網路", "迴歸分析", "貝氏網路", "決策樹"], "a": 0}, {"n": 19, "g": "prep", "q": "巨量資料分析是一連串分階段流程的處理步驟(Pipeline),針對此巨量資料分析的流程,下列何者正確?", "o": ["ETL(Extract Transform Load)的處理是屬於此分析流程中最後階段", "現階段我們已經有一套資訊系統可以完整涵蓋所有巨量資料分析的階段流程", "統計學習的建模與分析因為需大量人力介入,因此是獨立出來的步驟,所以它不屬於巨量資料分析流程的一環", "巨量資料分析流程必須要透過人為的介入與客製化的操作,因此目前整個巨量資料分析流程尚無法完全自動化完成"], "a": 3}, {"n": 20, "g": "basic", "q": "一般巨量資料處理的單位為PB級;1 PB的資料為1 GB資料的幾倍大?", "o": ["1,000", "1,000,000", "1,000,000,000", "1,000,000,000,000"], "a": 1}, {"n": 21, "g": "hadoop", "q": "下列哪一項資訊技術和巨量資料最不相關?", "o": ["資料探勘", "物件導向軟體開發", "Hadoop", "NoSQL"], "a": 1}, {"n": 22, "g": "ml", "q": "對於決策樹(Decision Tree)機器學習演算法,下列何者有誤?", "o": ["決策樹最末端葉面點(Leaves)是標示資料分類別的結果", "決策樹中間的點是提供資料分類時特徵值的判斷", "決策樹的分類需要將所有訓練資料集的資料正確分類", "隨機樹叢(Random Forest)演算法是整合多個小決策樹來進行資料分類"], "a": 2}, {"n": 23, "g": "hadoop", "q": "關於Hadoop的敘述,下列何者有誤?", "o": ["Hadoop的做法,是將資料打散成小塊,分散到不同的電腦中", "由於資料量夠大,Hadoop不會儲存資料的備份", "Hadoop預設,由於資料量十分龐大,所以不可能在處理之前就清理乾淨、排序整齊", "與過去的關聯式資料庫相比,Hadoop輸出的結果比較不準確"], "a": 1}, {"n": 24, "g": "mr", "q": "如果使用者在MapReduce中打算使用外部執行檔來定義其工作,需要利用下列何者?", "o": ["Virtual Machine", "Streaming", "Pipeline", "Filter"], "a": 1}, {"n": 25, "g": "mining", "q": "下列何者是知識發現(Knowledge Discovery)的正確程序?", "o": ["資料探勘、資料準備、樣式評估、知識呈現", "資料準備、資料探勘、樣式評估、知識呈現", "資料準備、樣式評估、資料探勘、知識呈現", "資料準備、資料探勘、知識呈現、樣式評估"], "a": 1}, {"n": 36, "g": "mining", "q": "透過迴歸分析演算法可以進行資料關連性分析。現考量運用三種行銷廣告通路:電視、廣播、報紙的預算金額分配額度大小,找出它們對於產品銷售值(sales)的影響。請問下列敘述何者有誤?", "o": ["電視、廣播、報紙三種特徵值為獨立變數,而sales是我們要預測的結果,因此為相依變數", "對於獨立變數如電視、廣播、報紙,我們允許使用連續量化變數,同時也允許使用類別式變數(categorical variable)兩種資料型態,但是我們對於相依變數sales,僅允許使用類別式變數型態,因此一般性的迴歸分析演算法可以用來進行資料分類", "三種變數是否要納入迴歸分析方程式可以透過T-statistic的檢驗,並考量其F-statistic值越大、p-value的值愈小的變數者,其較具有影響力", "迴歸分析方程式有時需要考量獨立變數所表示特徵值是否有交互作用,而判斷交互作用的影響力也可運用T-statistic的檢驗,並透過高F-statistic值和低p-value值來判斷"], "a": 1}, {"n": 37, "g": "ml", "q": "透過統計學習方法論,我們希望找出一個決策樹資料分類器以避免資料分類時的過度解讀(overfitting),請問對於資料過度解讀的現象,下列何者有誤?", "o": ["決策樹分類器對於訓練資料集過度解讀,可以提高對於訓練資料集分類結果的準確率", "過度解讀對於測試資料的分類判斷結果其準確率很低", "我們可以用簡單決策樹分類器模型,來避免產生訓練資料集過度解讀的現象", "當每一次納入新的特徵值來成長決策樹結構時,當新增特徵值對於訓練資料集無法產生有效分類就該停止,因此用事後修剪決策樹的方法將無法避免資料過度解讀"], "a": 3}, {"n": 38, "g": "spark", "q": "對於巨量資料分析Spark平台,下列何者有誤?", "o": ["Spark有提供結構化資料格式的巨量資料分析功能", "Spark能夠透過多種電腦語言,如Scala, Python, R, Java來呼叫系統引擎", "Hadoop原有的MapReduce巨量資料分析的計算原理無法在Spark上來進行", "Spark是選擇Apache開放性系統發展模式,因此我們可以看到Spark系統的原始程式碼"], "a": 2}, {"n": 39, "g": "mining", "q": "一般推薦系統(Recommender System)時常會採用下列哪一個方法作為核心技術,來估計產品與使用者間的可能關係?", "o": ["Matrix Factorization", "Hashing", "Linear Discriminative Analysis (LDA)", "Part-of-Speech (POS) Tagging"], "a": 0}, {"n": 40, "g": "mining", "q": "下列何種統計學習的演算法是用來進行資料的分群(Clustering),但不能用來進行資料分類(Classification)?", "o": ["K-Means", "Bayes Nets", "Logistic Regression", "Support Vector Machine"], "a": 0}, {"n": 41, "g": "mining", "q": "巨量資料中的資料類別出現的頻率,時常會形成所謂的長尾現象,一般可利用以下哪種統計工具來描述此種形式的資料分佈?", "o": ["Zipf", "Gaussian", "Dirichlet", "Uniform"], "a": 0}, {"n": 42, "g": "ml", "q": "以分析使用者打卡(check in)的應用為例,如果打卡的位置為變數X。使用者A習慣在一個位置打卡(如公司),其打卡位置的分佈統計模型為PA (X);使用者B時常在都市內到處打卡,其分佈統計模型為PB(X)。請問何者的entropy,也就是H(.)較高?", "o": ["使用者A", "使用者B", "兩者一樣", "無法比較"], "a": 1}, {"n": 43, "g": "viz", "q": "在視覺化工具中為了在二維畫面中檢視資料點之間的關係(相似度或距離),例如社群網路、地圖中重要都市等,一般都使用下列哪種形式的演算法?", "o": ["Inverted-based Indexing", "Multidimensional Scaling (MDS)", "Approximate Nearest Neighbor (ANN)", "Ranking Methods"], "a": 1}, {"n": 44, "g": "mining", "q": "關於Bayes Nets與Naïve Bayes兩種統計學習演算法,下列何者有誤?", "o": ["Naïve Bayes的演算法假設特徵值相互之間的關連性是獨立", "Naïve Bayes學習演算可以算是Bayes Nets的一個特例,因為Bayes Nets並未假設特徵值相互之間的關連性是獨立", "Bayes Nets的計算是用條件機率來表示特徵值之間的關連性,並利用這些條件機率的相乘積結果來表示分類別機率的大小,以判斷最後分類別", "因為Naïve Bayes演算法的侷限性,它僅能作為資料分群,而不能作為資料分類使用"], "a": 3}, {"n": 45, "g": "hadoop", "q": "Hadoop一般對於疊代式(Iterative)程序執行起來較沒效率,主要原因為下列何者?", "o": ["Iteration不易平行化", "跨Iteration間的狀態不容易維持", "Hadoop不支持Iteration", "Hadoop不支援C語言"], "a": 1}, {"n": 46, "g": "mining", "q": "對於巨量資料分析所需要的統計(或機器)學習技術,下列何者有誤?", "o": ["統計(或機器)學習主要涵蓋有監督式、半監督式、非監督式等學習型態", "監督式學習主要提供資料分類(Classification),而非監督式學習只是提供資料的分群(Clustering)", "隨機樹叢(Random Forest)演算法是整合多個決策樹(Decision Trees)分類的演算法", "迴歸分析和KMeans兩種演算法常被用來進行巨量資料的分類"], "a": 3}, {"n": 47, "g": "prep", "q": "巨量資料分析的R程式語言具有多種不同資料結構型態(data types)的表達格式,下列何者有誤?", "o": ["R的資料結構型態表達格式主要包括:vector, matrix, array, data frame, list", "Matrix可以表示二維空間的資料結構,在matrix中所有元素必須是屬於相同資料型態", "Lists可以表示最複雜的資料結構型態,舉凡vectors, arrays, data frames甚至於lists本身的資料結構都可以被包含進來", "Data Frame的資料可以用data.frame()函式呼叫來產生,在data frame資料結構中屬於不同列資料其型態必須相同"], "a": 3}, {"n": 48, "g": "mr", "q": "關於巨量資料分析系統Hadoop平台,下列何者有誤?", "o": ["是一個開放式系統軟體,具有可靠度、可擴充性與分散式處理的功能", "HDFS主要是提供分散式檔案系統功能的軟體模組", "MapReduce主要是在叢聚式電腦系統上,進行資料分析時提供有效的資源管理", "HBase是一個具有可擴充性與結構化資料庫特性的軟體模組"], "a": 2}, {"n": 49, "g": "mr", "q": "關於巨量資料分析系統Hadoop平台,下列何者正確?", "o": ["可以提供Iterative演算法的有效計算", "可以透過MapReduce運算,提供各種進階式的結構化資料分析", "容錯功能是透過資料複製多份,並每一次的執行都寫入到硬碟的方式來完成", "Hadoop和MapReduce的整合性運作,可以有效完成圖論結構資料的巨量資料分析"], "a": 2}, {"n": 50, "g": "spark", "q": "在Spark大數據分析平台上執行下列的Python程式碼:file=spark.textFile(“hdfs://...”) \n//opens a file\ncounts=file.flatMap(lambda line: line.split(“ “)) \n//iterate over the lines, split each line by space into words\n.map(lambda word: (word, 1)) \n//for each word, create the tuple (word, 1)\n.reduceByKey(lambda a, b: a+b) \n//go over the tuples “by key” (first element)and sum the second elements\ncounts.saveAsTextFile(“hdfs://...”)\n當輸入短文: a spark can start a fire that burns the entire prairie請問最後存入到 HDFS 檔案的(key, value)一共有多少對?", "o": ["8", "9", "10", "11"], "a": 2}]}, {"id": "p105", "kind": "past", "title": "105 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "nosql", "q": "費林分類法(Flynn’s Taxonomy)是一種計算機架構的分類方式,根據指令和資料的相對關係,可以區分為四種,如以單一處理器來執行單一程式段落及單一資料的模式,下列何者正確?", "o": ["MIMD", "SIMD", "SISD", "MISD"], "a": 2}, {"n": 27, "g": "nosql", "q": "在CUDA(Compute Unified Device Architecture)中,memory的分配上是相當重要的問題,GPU上具有shared memory、global memory、constant memory,下列敘述何者正確?", "o": ["存取速度: global memory > shared memory > constant memory", "容量大小: global memory > constant memory > shared memory", "要在 shared memory 中宣告變數需在前面加上 device", "使用 shared memory 配置的變數,可以被grid中的所有thread存取"], "a": 1}, {"n": 28, "g": "nosql", "q": "在CUDA(Compute Unified Device Architecture)程式編寫中,如果我們要給每一個thread唯一的ID,起始值為0,且為整數,例如:0、1、2、3...循序下去,可以透過下列何者取得?", "o": ["blockIdx.x * blockDim.x + threadIdx.x", "blockIdx.x * blockDim.x - threadIdx.x", "blockIdx.x * threadIdx.x + blockDim.x", "blockIdx.x / blockDim.x + threadIdx.x"], "a": 0}, {"n": 29, "g": "dw", "q": "關於資料庫中使用的索引結構,下列何者有誤?", "o": ["B+-Tree", "FLA-Tree", "QuadTree", "R*-Tree"], "a": 1}, {"n": 30, "g": "ml", "q": "關於支持向量機(Support Vector Machine, SVM),下列敘述何者有誤?", "o": ["Kernel Function不只一種", "使用Kernel Trick來增加效率", "可對資料進行非線性分類", "將高維度的資料降至低維度以提升準確率"], "a": 3}, {"n": 31, "g": "basic", "q": "隨著巨量資料成為許多公司的競爭優勢,所有產業的架構也將重新調整,關於巨量資料對企業的影響,下列敘述何者有誤?", "o": ["各公司能得到的利益不會是平等的", "得利最多的會是大型企業和中型企業,小型企業將遭到嚴重衝擊", "持有許多大型資料來源,能輕鬆取用資料才是優勢", "競爭優勢的最核心重點,不是擺在硬體設施本身的規模"], "a": 1}, {"n": 32, "g": "mining", "q": "分析巨量社群網路資料時,下列敘述何者有誤?", "o": ["分析使用者的朋友數對了解社群網路是有幫助的", "分析使用者打卡(check in)地點有助於了解使用者空間上的資訊", "在分析時,使用者皆被視為只有一個社群網路帳號", "社群網路上的使用者會隨著時間而增減"], "a": 2}, {"n": 33, "g": "ml", "q": "關於機器學習演算法,下列敘述何者有誤?", "o": ["AdaBoost透過調整訓練資料(training data) 被抽樣到的機率以提升效能", "K-Nearest Neighbor可用於監督式學習", "決策樹(decision tree)可以不是二元樹(binary tree)", "過度解讀(overfit)可提升機器學習演算法之準確率,故大部分機器習演算法皆嘗試過度解讀訓練資料"], "a": 3}, {"n": 34, "g": "cloud", "q": "關於巨量資料的特色,下列敘述何者有誤?", "o": ["巨量資料特點之一是產生速度很快", "線上社群網站是巨量資料來源之一", "巨量資料一定要搭配雲端運算才能處理", "使用者的網路瀏覽紀錄亦可視為巨量資料"], "a": 2}, {"n": 35, "g": "ml", "q": "關於衡量機器學習中分類器(Classifier)效能的指標,下列何者有誤?", "o": ["Walter-Kimplin Curve", "Precision", "Recall", "ROC Curve"], "a": 0}, {"n": 36, "g": "mining", "q": "關於從社群網站抓取社群網路拓撲(Social Network Topology)資料,下列敘述何者有誤?", "o": ["深度優先搜尋(Depth-First-Search)是常用的方法之一", "廣度優先搜尋(Breadth-First-Search)是常用的方法之一", "取得之社群網路拓撲可視為整個線上社群網路的抽樣(sample)", "為了避免偏差(bias),可抓取多份不同的社群網路拓撲進行分析"], "a": 0}, {"n": 37, "g": "nosql", "q": "關於巨量資料分析常使用的 NoSQL 資料庫,下列敘述何者有誤?", "o": ["NoSQL 指的是 Not only SQL,通常不使用 SQL 做為查詢語言", "NoSQL 與傳統資料庫相同,都必須隨時確保資料一致", "NoSQL 沒有資料庫 schema 的欄位架構,因此可以隨著資料變動有彈性的進行欄位調整", "NoSQL 通常不支援 Join 操作"], "a": 1}, {"n": 38, "g": "mining", "q": "對於兩事件 A, B 的關聯式規則(Association Rule),下列敘述何者有誤?", "o": ["A=>B 的支持度(Support)定義為 A, B 兩事件共同出現的機率", "A=>B 的信心度(Confidence)定義為事件 A 發生的情形下,事件 B 也同時發生的條件機率", "項目A, B順序的調換對支持度不會有影響", "項目A, B順序的調換對信心度不會有影響"], "a": 3}, {"n": 39, "g": "mining", "q": "關於分群演算法(Clustering),下列敘述何者正確?", "o": ["分群屬於非監督式學習", "k-means演算法進行分群前,可先不決定k值", "分群演算法通常計算複雜度較分類要高", "分群的效果與資料數量、群集數量都無關"], "a": 0}, {"n": 40, "g": "mr", "q": "關於 MapReduce model,下列敘述何者有誤?", "o": ["MapReduce model 是 Google 所提出,用於大規模資料的平行運算", "在 MapReduce 分散式計算 model 中,只有 Map 及 Reduce 兩種運算", "Map 和 Reduce的概念是從 functional programming 而來", "Hadoop 為目前較為知名的 open source MapReduce project"], "a": 1}, {"n": 41, "g": "hadoop", "q": "關於 HDFS 架構,下列敘述何者有誤?", "o": ["Hadoop JobTracker 必須也是 HDFS 的 Namenode", "Hadoop JobTracker 負責分配工作,而 TaskTracker 負責執行工作", "Namenode 只能有一個,而 Datanode 通常有很多個", "Namenode 主要負責儲存檔案系統的索引,而 Datanode 負責儲存檔案的 data blocks"], "a": 0}, {"n": 42, "g": "nosql", "q": "下列何種方法比較不適合進行平行化?", "o": ["K-Means clustering", "Logistic Regression", "Newton’s method for finding roots", "PageRank"], "a": 2}, {"n": 43, "g": "mining", "q": "根據巨量資料分析的資料屬性,下列何者與其他屬性差異最大?", "o": ["社群網路分析", "股市趨勢分析", "路況車流分析", "環境感測資料分析"], "a": 0}, {"n": 44, "g": "basic", "q": "我們會定義資料為巨量、大或者海量,最主要的原因,是目前的資訊科技環境,提供了以下何種重要特性,使其稱為Big Data?", "o": ["Variety", "Veracity", "Velocity", "Volume"], "a": 0}, {"n": 45, "g": "spark", "q": "Spark 的 Word Count程式片段範例如下所示,下列敘述何者有誤?\ntext_file = sc.textFile(\"hdfs://...\")\ncounts = text_file.flatMap(lambda line: line.split(\" \")) \\\n.map(lambda word: (word, 1)) \\\n.reduceByKey(lambda a, b: a + b)\ncounts.saveAsTextFile(\"hdfs://...\")", "o": ["counts 從頭到尾就是單一個 RDD", "flatMap() 是依照分隔符號 (\" \") 將文字檔分成一個一個的字", "map() 將每個字計算一次", "reduceByKey() 將相同字的值相加"], "a": 0}, {"n": 46, "g": "mining", "q": "在巨量資料的想法中,強調的是去尋找事件或事物的相互關係(Correlation),非著重在傳統因果關係(Causality)的尋找,主要是因為當今環境變遷迅速,資料可以被即時收集且運算,因此,相互關係的尋找,更優於確立因果關係。請問,以下何種模型,可以用來協助尋找相互關係?", "o": ["時間序列分析", "類神經網路分析", "關聯規則分析", "決策樹分析"], "a": 2}, {"n": 47, "g": "mining", "q": "於巨量資料當中進行關聯規則的探勘(Association Rule Mining),採用Apriori 的方法,將會於每階段產生大量的組合,使得計算顯得沒有效率。但實際上,此方法因下列何種特性,使其不用去進行每一個候選組合的測試,而可以大量減少其演算時間?", "o": ["大數法則", "反單調性", "80/20準則", "維爾特定律"], "a": 1}, {"n": 48, "g": "mr", "q": "在巨量資料的技術堆疊中,哪一層將透過MapReduce,慣用程式碼的額外處理與建構中介資料結構,諸如:統計模型或資料立方體...等,所產生的結構,做為額外分析或傳統查詢工具查詢之用,使巨量資料做好接受進一步分析的準備?", "o": ["應用程式碼", "資料", "商業觀點", "儲存"], "a": 2}, {"n": 49, "g": "nosql", "q": "雲端運算技術是巨量資料處理的基礎,關於雲端運算技術,下列敘述何者正確?", "o": ["雲端運算強調基於實體化等技術,在分散式硬體環境上提供共用資源服務", "雲端運算以伺服器集群為中心,運算和資料儲存都由網路中心的雲端完成", "雲端運算的伺服器集群仍存在不穩定性,這使得基於雲端運算實現應用的範圍受限", "雲端運算伺服器之間是分散式結構,流量具天然的對稱特點,符合現階段的網路頻寬特點"], "a": 1}, {"n": 50, "g": "mr", "q": "下列哪一項目不是Google 於2003~2006年前後,發表奠定巨量資料技術理論基石的技術?", "o": ["BigTable", "GFS", "Hadoop", "MapReduce"], "a": 2}]}, {"id": "p106", "kind": "past", "title": "106 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "hadoop", "q": "下列哪項不是Hadoop之特性?", "o": ["開放原始碼 (Open Source)", "即時性(Real Time)", "以Java為其程式基礎", "分散式計算 (Distributed Computing)"], "a": 1}, {"n": 27, "g": "spark", "q": "下列哪項不是 Apache Spark 2.0 所支援的程式語言?", "o": ["Scala", "R", "C++", "Python"], "a": 2}, {"n": 28, "g": "ml", "q": "在類神經網路(Neural Network)分類器中,一個 sigmoid node 的輸出數值是下列何者?", "o": ["沒有限制,可以是任何實數", "介於0與1之間", "沒有限制,可以是任何整數", "介於-1與1之間"], "a": 1}, {"n": 29, "g": "ml", "q": "有關類神經網路(Neural Network)之敘述,下列何者有誤?", "o": ["使用成千上萬個神經元(Neuron)作為處理器", "其學習過程是一個不斷的嘗試錯誤(Trial and Error)", "用於影響辨識時,須制訂一系列的規則來識別樣式 (Patterns)", "相較全連通網路(Fully Connected Networks),卷積神經網路 (Convolutional Neural Networks)通常擁有較少須學習的參數"], "a": 2}, {"n": 30, "g": "ml", "q": "有關應用卷積神經網路(Convolutional Neural Networks,簡稱CNNs)於影像分析之敘述,下列何者正確?① 較前面的處理層 (Layer) 過濾器通常可包含邊緣偵測器 (Edge Detector)② 和擁有相同層數以及每層內有相同神經元個數的全連通網路 (Fully-connected Networks)比起來,CNNs用有更多參數③ 一個CNN可用來訓練非監督式學習模型,但一般的類神經網路則不行④ 池化層(Pooling Layers) 可降低影像的空間解析度", "o": ["① ②", "② ③", "③ ④", "① ④"], "a": 3}, {"n": 31, "g": "mining", "q": "有關分析巨量社群網路資料之敘述,下列何者有誤?", "o": ["連結預測(Link Prediction) 之技術可用來推薦朋友", "使用者的朋友個數之分配通常遵從冪次法則(Power-law distribution)", "在計算資源有限時,我們通常對社群網路中的節點進行簡單隨機抽樣,以抽取出具有結構代表性的社群網路子圖(subgraph)", "社群網路中任兩位使用者的距離可能隨時間而增減"], "a": 2}, {"n": 32, "g": "mining", "q": "有關頻繁樣式探勘(Frequent Pattern Mining) 之敘述,下列何者有誤?", "o": ["若一項目集合之所有子集合皆為頻繁,則該項目集合必定也為頻繁", "所有最大(maximal) 頻繁項目集合都是封閉的(closed)", "對於一關聯式規則(Association Rule),若將一規則左手邊之項目搬到規則右手邊,不會降低該規則之信心度(Confidence)", "對於一關聯式規則,將規則左右兩邊之項目集合對調,不會影響支持度(Support)"], "a": 0}, {"n": 33, "g": "mr", "q": "巨量資料庫管理最常用的操作包含Selection、Projection、Union與Intersection。對於此4種資料庫操作,若想實作在Hadoop的工作任務中,哪2種操作需要同時使用一個Mapper與一個Reducer?", "o": ["Selection與Projection", "Selection與Union", "Projection與Intersection", "Union與Intersection"], "a": 0}, {"n": 34, "g": "ml", "q": "在資料分析中,經常遇到一分類或預測模型產生高或低的偏差(Bias) 與變異性(Variance)。以下有4個關於模型偏差與變異數之敘述,下列何者正確?① 過適(Overfitting)的模型通常有較高的偏差② 過適(Overfitting)的模型通常有較低的偏差③ 乏適 (Underfitting)的模型通常有較高的變異性④ 乏適 (Underfitting)的模型通常有較低的變異性", "o": ["① ③", "① ④", "② ③", "② ④"], "a": 3}, {"n": 35, "g": "dw", "q": "下列何種資料格式經常被定義為半結構化資料(Semi-structured Data)?", "o": ["關聯式資料庫中的表格(Table)資料", "影音(Video)檔案", "JSON 檔案", "Email內文文字"], "a": 2}, {"n": 36, "g": "ml", "q": "在巨量資料分析專案中,下列何者比較無助於提升分類模型準確度(Accuracy)?", "o": ["使用交叉驗證(Cross-Validation)", "增加或減少模型參數(Parameters)以提升或降低模型複雜度", "進行更進一步的特徵工程(Feature Engineering)", "取得與使用有更多變數/特徵(Variables/Features)的訓練資料"], "a": 0}, {"n": 37, "g": "ml", "q": "下列的統計學習(Statistical Learning)方法經常被用於分析巨量資料,請問何者應用的領域問題與其它不同?", "o": ["隨機森林(Random Forests)", "主成分分析(Principal Component Analysis)", "彈性網絡(Elastic Net)", "分類迴歸樹(Classification and Regression Tree)"], "a": 1}, {"n": 38, "g": "nosql", "q": "有關隨機森林(Random Forests)之敘述,下列何者正確?", "o": ["採用 Boosting 方法", "使用多個淺層決策樹 (Decision Stump) 構建整個森林", "是一種重抽樣(Re-sampling)技術的應用", "模型訓練的運算較難平行化"], "a": 2}, {"n": 39, "g": "ml", "q": "在統計學習(Statistical Learning)方法論中,有關模型的過適(Overfitting)之敘述,下列何者有誤?", "o": ["此種模型的錯誤(Error)常來自於高的方差(High Variance)", "此種模型的參數較少或複雜度過低", "此種模型過度學習訓練資料集(Training Dataset)", "採用Bagging技術有可能避免過度擬合"], "a": 1}, {"n": 40, "g": "dw", "q": "有關近年來巨量資料處理與分析的發展,下列何者有誤?", "o": ["異質運算(Heterogeneous Computing)的興起", "記憶體內運算(In-memory Computing)的普及", "資料湖(Data Lake) 的採用", "關聯式資料庫系統(Relational Database Systems)的沒落"], "a": 3}, {"n": 41, "g": "spark", "q": "有關巨量資料分析的平台環境建置之敘述,下列何者正確?", "o": ["傳統的關聯式資料庫管理系統無法處理巨量資料", "NoSQL資料庫系統已逐漸取代傳統的關聯式資料庫系統", "Apache Hadoop可用來建構資料湖(Data Lake)", "Apache Spark不適合用來處理串流(Streaming) 資料"], "a": 2}, {"n": 42, "g": "mr", "q": "有關 MapReduce程式模型(Programming Model)之敘述,下列何者有誤?", "o": ["比較不適合用來處理疊代式(Iterative) 的資料處理分析過程", "概念來自於函數式程式語言(Functional Programming Languages)", "不適合用來處理資料量相對較小,但運算量大的工作", "Combiner 的使用可以減少資料在各節點(Node)之間的傳輸"], "a": 2}, {"n": 43, "g": "ml", "q": "有關統計學習(Statistical Learning)中的非監督式學習(Unsupervised Learning)方法,下列敘述何者有誤?", "o": ["可以做為維度縮減 (Dimensionality Reduction) 的工具", "此類方法也可用於特徵工程 (Feature Engineering)", "是一種無目標變數 (Target Variable) 的模型學習方法", "Receiver Operating Characteristic (ROC) 曲線常用來評估此類模型優劣"], "a": 3}, {"n": 44, "g": "mining", "q": "下列統計學習(Statistical Learning)的方法或過程,何者不易受到變數尺度(Scale)不同的影響?", "o": ["決策樹學習(Decision Tree Induction)", "K-近鄰算法 (k-nearest Neighbors Algorithm)", "K-均值聚類算法 (K-means Clustering)", "隨機梯度下降 (Stochastic Gradient Descent)"], "a": 0}, {"n": 45, "g": "prep", "q": "如何降低模型過適(Overfitting)問題?", "o": ["降低資料量", "在目標函數中加入參數正則化(Regularization) 項", "對資料作正規化(Normalization)前處理", "使用測試資料建模"], "a": 1}, {"n": 46, "g": "mining", "q": "資料前處理在資料探勘是一個非常重要的步驟,下列哪一個步驟不屬於資料前處理?", "o": ["模型解釋", "處理遺失值", "移除離群值", "資料數值正規化"], "a": 0}, {"n": 47, "g": "mr", "q": "在Hadoop中,下列何者為有效的資料分析流程?", "o": ["Input → Reducer → Mapper → Combiner → Output", "Input → Mapper → Reducer → Combiner → Output", "Input → Mapper → Combiner → Reducer → Output", "Input → Reducer → Combiner → Mapper → Output"], "a": 2}, {"n": 48, "g": "viz", "q": "資料視覺化是資料處理中一項重要工作,通常資料視覺化需要使用到下列哪種方法?", "o": ["資料維度降維", "建立分類模型", "建立迴歸模型", "調整模型參數"], "a": 0}, {"n": 49, "g": "spark", "q": "下列何者並非Hadoop與Spark共同擁有的特色?", "o": ["皆為叢集計算環境", "皆擁有自己的檔案系統", "皆使用開放原始碼應用程式介面 (API) 來連結其他資料分析工具", "皆為資料處理平台"], "a": 3}, {"n": 50, "g": "ml", "q": "下列哪項不是主成分分析(Principal Component Analysis)之特性?", "o": ["屬於非線性降維方法", "第一主成分跟第二主成分會正交", "通常可以提升模型訓練速度", "屬於非監督式方法"], "a": 0}]}, {"id": "p107", "kind": "past", "title": "107 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "mining", "q": "下列何者不是維度縮減(dimensionality reduction)之方法?", "o": ["Random projection", "Principal component analysis (PCA)", "Clustering algorithms", "Classical multidimensional scaling (cMDS)"], "a": 2}, {"n": 27, "g": "mr", "q": "有關Hadoop的軟體疊層架構中之元素,下列何者有誤?", "o": ["Big Table", "Hadoop MapReduce", "HDFS", "HBase"], "a": 0}, {"n": 28, "g": "privacy", "  false, "qs": [{"n": 26, "g": "cloud", "q": "關於雲端運算之敘述,下列何者有誤?", "o": ["公有雲不一定免費,但可降低硬體投資和機房管理等成本", "使用雲端服務之付費方式採用「Pay-As-You-Go」", "AWS EC2 屬於雲端服務中之 SaaS", "OAuth 2.0 協議的授權碼授予模式,需要服務端之認證伺服器許可"], "a": 2}, {"n": 27, "g": "mining", "q": "何者非屬監督式學習之演算法?", "o": ["決策樹", "隨機森林", "支持向量機", "關聯規則"], "a": 3}, {"n": 28, "g": "viz", "q": "針對巨量資料之特性,下列何者有誤?", "o": ["巨量資料之巨量性質(volume)意指存放數據量超過 PB", "巨量資料之即時性質(velocity)意指數據擷取時間不到 1 秒", "巨量資料等同於巨大價值(value)", "根據巨量資料分析需求之改變趨勢,視覺化(visualization)在分析中日趨重要"], "a": 2}, {"n": 29, "g": "spark", "q": "針對 Apache Spark,下列何者有誤?", "o": ["in-memory 之計算框架", "不允許用戶將資料載入至叢集記憶體內儲存", "多次記憶體重覆運算", "非常適合用於機器學習演算法"], "a": 1}, {"n": 30, "g": "prep", "q": "影響資料分析技術之重要資料集特質,下列何者有誤?", "o": ["維度(dimensionality)", "稀疏性(sparsity)", "連續性(continuity)", "分辨度(resolution)"], "a": 2}, {"n": 31, "g": "prep", "q": "巨量資料之定義為何?", "o": ["巨量資料中有 70 % 都為結構化資料", "巨量資料除資料量龐大外,其資料特性具變化速度快及多樣性", "儲存的資料內容不包含影片或電子郵件", "巨量資料強調資料數量能為企業帶來商業機會"], "a": 1}, {"n": 32, "g": "mining", "q": "若欲將大量資料進行分群,下列何種方法不適合?", "o": ["決策樹法", "K-means法", "階層式方法", "SOM方法"], "a": 0}, {"n": 33, "g": "prep", "q": "關於巨量資料之特性,下列何者正確?", "o": ["堅持原始資料都要做到標準化與精確", "陷入資料獨裁之問題", "利用「隨機取樣」處理所有的資料", "看重資料之間的因果關係"], "a": 1}, {"n": 34, "g": "spark", "q": "下列何者非屬巨量資料分析工具?", "o": ["Spark", "Python", "Spigot", "Julia"], "a": 2}, {"n": 35, "g": "basic", "q": "關於由小到大的電腦容量(單位),下列何者正確?", "o": ["YB<GB<TB<PB", "GB<TB<PB<EB", "TB<PB<YB<EB", "GB<TB<ZB<EB"], "a": 1}, {"n": 36, "g": "basic", "q": "巨量資料分析所蒐集之資料來源,下列何者與其他來源差異最大?", "o": ["養殖水產保險", "網路溫度計", "豆腐指數", "753感冒指數"], "a": 1}, {"n": 37, "g": "basic", "q": "關於工業 4.0 製造模式轉變,下列何者正確?", "o": ["將原本 B2C 之製造模式轉變為 C2B", "將原本 B2C 之製造模式轉變為 B2B", "將原本 B2B 之製造模式轉變為 C2B", "將原本 B2B 之製造模式轉變為 C2C"], "a": 0}, {"n": 38, "g": "mining", "q": "針對巨量資料分析進行資料探勘(data mining),下列何者有誤?", "o": ["找尋趨勢", "找尋特徵", "找尋相關性", "無法發掘出各種假設"], "a": 3}, {"n": 39, "g": "ml", "q": "下列何者非屬邏輯迴歸(logistic regression)之特性?", "o": ["離散選擇法模型之一", "屬於多重變量分析範疇", "需要常態分配的假設", "羅吉斯迴歸用到的對數函數是Sigmoid函數"], "a": 2}, {"n": 40, "g": "ml", "q": "強化學習(reinforcement learning)系統中不包括下列何者?", "o": ["智能體( agent )", "獎賞( reward )", "回應( response )", "環境( environment )"], "a": 2}, {"n": 41, "g": "ml", "q": "關於遷移學習(transfer learning)特性,下列何者有誤?", "o": ["遷移學習之重點是不必儲存已解決一個問題之模型", "遷移學習被應用於認知科學", "可使用遷移學習重新利用既有神經網絡", "遷移網絡之應用包括語句分類,篩選垃圾郵件與簡訊以及發現癌症種類"], "a": 0}, {"n": 42, "g": "hadoop", "q": "配置 Hadoop 時,JAVA_HOME 包含在下列何者配置檔案中?", "o": ["hadoop-default.xml", "hadoop-site.xml", "configuration.xsl", "hadoop-env.sh"], "a": 3}, {"n": 43, "g": "dw", "q": "Java 語言之 Buffered Reader 類別是將資料讀入下列何者當緩衝區?", "o": ["陣列", "資料庫", "檔案", "變數"], "a": 0}, {"n": 44, "g": "hadoop", "q": "巨量資料分析之資料存在著資料量大、非結構化、高度異質性等特性,下列何種資料庫工具最不適宜運用在此類型工作?", "o": ["Mongodb", "Redis", "Sybase", "Hbase"], "a": 2}, {"n": 45, "g": "dw", "q": "關於關聯式資料庫資料表(table)之敘述,下列何者正確?", "o": ["是一維資料組成之集合", "資料表由橫列和直行所組成", "一般不會設定主索引鍵", "資料表每一列表示屬性"], "a": 1}, {"n": 46, "g": "ml", "q": "關於遞歸神經網路(RNN)之基本概念,下列何者有誤?", "o": ["反向傳播的權重更新不會造成梯度爆炸", "長短期記憶模組共 4 層,比 RNN 多 3 個 S 型函數層", "長短期記憶模組,能改善 RNN 在長期記憶之不足", "可用來處理時間序列資料"], "a": 0}, {"n": 47, "g": "mining", "q": "關於機器學習之敘述,下列何者正確?", "o": ["主成分分析法( PCA )是用於資料之降維", "用大量人力對訓練資料集來標籤特徵,是強化學習( RL )之特色", "Q-Learning 之 γ 數值趨向於 1 ,表示 agent 只在乎目前可獲得之獎勵", "監督式學習之演算法有邏輯迴歸和 K-means 等"], "a": 0}, {"n": 48, "g": "ml", "q": "有關卷積神經網路之基本概念,下列何者有誤?", "o": ["運作流程:輸入的圖片→特徵擷取→分類辨識", "池化層會使用到 ReLU 之激勵函數", "得到之特徵圖比原圖要小,被稱為valid padding", "可應用於人臉識別、語音識別等"], "a": 1}, {"n": 49, "g": "mr", "q": "關於巨量資料中之資料庫,下列何者有誤?", "o": ["HBase 技術提供非關聯式資料庫( NoSQL )之儲存環境", "HBase 技術支援隨機存取功能", "無法直接透過 SQL 來查詢 Hadoop 儲存之資料", "Apache Hive 就是把 SQL 編譯成 Map Reduce,從而讀取和操作 Hadoop 上之資料"], "a": 1}, {"n": 50, "g": "basic", "q": "下列何者非屬資料操作語言(data manipulation language)?", "o": ["INSERT", "UPDATE", "DELETE", "CREATE"], "a": 3}]}, {"id": "p109", "kind": "past", "title": "109 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "mr", "q": "下列何者不是Apache Hadoop之特色?", "o": ["使用MapReduce程式框架", "支援Java語言", "Apache Mahout是一種用來支援Apache Hadoop分散式工作程序管理的程式庫", "使用Hadoop Distributed File System"], "a": 2}, {"n": 27, "g": "hadoop", "q": "對於HDFS Shell指令,下列敘述何者有誤?", "o": ["Hadoop fs -ls用來列出HDFS檔案與目錄列表", "Hadoop fs -rm input/masters刪除HDFS上的檔案", "Hadoop fs -cat input/slaves壓縮HDFS內之檔案", "Hadoop fs -put conf input將本地端檔案上傳至HDFS"], "a": 2}, {"n": 28, "g": "mining", "q": "對於 k-均值(k-means)聚類演算法的敘述,下列何者有誤?", "o": ["k-均值中update的程序,將更新聚類中心", "k-均值中assign的程序,將比較各資料點之間的距離,並將各資料點以隨機方式分配至其中一個聚類", "k-均值中的k值表示資料將分成幾類,需事先給定", "每一次執行的k-均值演算法,其結果可能會不一樣"], "a": 1}, {"n": 29, "g": "nosql", "q": "對於NoSQL資料庫說明,下列何者有誤?", "o": ["可採用Key-DM資料架構來建立資料庫", "使用記憶體方式建立分散資料庫", "MongoDB是一種NoSQL的資料庫", "各種NoSQL資料庫所支援的語言可能不同"], "a": 0}, {"n": 30, "g": "ml", "q": "對監督式學習(supervised learning)的說明,下列何者有誤?", "o": ["監督式學習需要使用標記過類別的資料(labeled data)進行訓練(training)", "監督式學習可以跟非監督式學習整合,進行資料分析", "目前所有的監督式學習的方法,皆無法對線性不可分(nonlinear)的資料進行分類", "將資料的所有特徵(feature)放入監督式學習,不一定會找到最好的分類方式"], "a": 2}, {"n": 31, "g": "ml", "q": "以機器學習對於巨量資料進行分析後,通常會使用混淆矩陣(confusion matrix),對於所產生的分類器進行評估,其中將分析結果分為true positive (TP)、true negative (TN)、false positive (FP)及false negative (FN),下列敘述何者有誤?", "o": ["正確率Accuracy = (TP + TN) / (TP + TN + FP + FN)", "召回率Recall = TP / (TP + FN)", "精確率Precision = TP / (TP + FP)", "F1 Score = TP / (TP + FP + FN)"], "a": 3}, {"n": 32, "g": "ml", "q": "對於大量資料分析的技術,下列敘述何者有誤?", "o": ["PageRank是用來對於數值資料進行資料壓縮的演算法", "支持向量機(support vector machine)的核函式(kernel function)選擇會影響分析結果", "k-最近鄰居(k-nearest neighbors)是用來對於資料分類的監督式演算法", "k-中心點(k-medoids)是用來對於資料分類的非監督式演算法"], "a": 0}, {"n": 33, "g": "mr", "q": "使用MapReduce框架來設計一個字數統計(word count)程式,其程式所進行的常用標準程序應為下列何者?", "o": ["Input → Splitting → Mapping → Shuffling → Reducing → Final Result", "Input → Mapping → Splitting → Shuffling → Reducing → Final Result", "Input → Mapping → Splitting → Reducing → Shuffling → Final Result", "Input → Reducing → Splitting → Shuffling → Mapping → Final Result"], "a": 0}, {"n": 34, "g": "nosql", "q": "CAP定理可用來分析NoSQL資料庫的特性,下列對於NoSQL資料庫及CAP定理之敘述,何者有誤?", "o": ["CAP定理的「C」代表的是一致性(consi eNode非常重要,當NameNode壞掉時,所有資料儲存地址都會消失,導致資料會全部遺失。下列預防NameNode壞掉之方式,何者有誤?", "o": ["利用Network File System (NFS)將NameNode儲存資料做備份", "直接建立第2個NameNode當作備份", "每個DataNode節點都可以設置1個NameNode,避免遺失", "將NameNode執行於高階電腦上"], "a": 2}, {"n": 40, "g": "spark", "q": "一般會要求Spark的使用者將RDD(Resilient Distributed Dataset)變數宣告為唯讀性質的val,原因是下列何者?", "o": ["確保資料在平行計算時的一致性", "確保資料在平行計算時的安全性", "確保資料在分散儲存時的完整性", "確保資料在分散儲存時的獨立性"], "a": 0}, {"n": 41, "g": "mining", "q": "進行資料分群時,下列敘述何者表示好的分群結果?", "o": ["群內成員相似度高,群間成員相似度低", "群內成員相似度高,群間成員相似度高", "群內成員相似度低,群間成員相似度低", "群內成員相似度低,群間成員相似度高"], "a": 0}, {"n": 42, "g": "privacy", "q": "有關資料前處理方法-獨熱編碼(One-Hot-Encoding, OHE),下列敘述何者有誤?", "o": ["若某個資料屬性有 N 種類別，則需要 N 個維度的二位元向量來表示", "若編碼後的向量，其維度 i 之值為 1，則代表資料屬於類別 i", "若 (A) 中的 N 值很大，則編碼後的向量中，1 出現的次數可能會不只 1 次", "編碼後的向量將會是稀疏向量 (Sparse Vector)"], "a": 2}, {"n": 43, "g": "cloud", "q": "Gmail屬於下列何者服務?", "o": ["Infrastructure as a Service (IaaS)", "Platform as a Service (PaaS)", "Software as a Service (SaaS)", "Function as a Service (FaaS)"], "a": 2}, {"n": 44, "g": "mr", "q": "對於1年份刷卡資料,欄位有時間、店名、物品、刷卡金額及付款方式,若要使用MapReduce得到每家店此年銷售總額,請問應該使用下列何種Key-Value Pair?", "o": ["物品-刷卡金額", "店名-付款方式", "店名-刷卡金額", "時間-店名"], "a": 2}, {"n": 45, "g": "mr", "q": "對於為什麼HDFS的檔案塊(Blocks)預設成128MB為最佳狀態之敘述,下列何者正確?", "o": ["如設成128KB,則1個cluster會有太多檔案塊,造成NameNode很難儲存每個檔案塊之位置", "因為我們只能夠在1個節點上,存1個檔案的其中1個檔案塊", "因為若把檔案塊設成128KB,對於多個Mappers要同時處理來說太小了", "因為這樣每8個檔案塊剛好就是1GB,剛好適合伺服器核心數都是4或8的倍數"], "a": 0}, {"n": 46, "g": "ml", "q": "人工智慧(AI)、深度學習(DL)與機器學習(ML)之關係為下列何者?", "o": ["DL ⊂ ML ⊂ AI", "DL ⊂ AI ⊂ ML", "DL ⊂ ML = AI", "AI ⊂ ML ⊂ DL"], "a": 0}, {"n": 47, "g": "nosql", "q": "有關使用深度學習(Deep Learning)於序列資料中,下列敘述何者有誤?", "o": ["可以使用卷積神經網路(Convolutional Neural Networks)", "可以使用循環神經網路(Recurrent Neural Network)", "循環神經網路(Recurrent Neural Network)使用平行計算效率佳", "循環神經網路(Recurrent Neural Network)之優化較卷積神經網路(Convolutional Neural Networks)複雜"], "a": 2}, {"n": 48, "g": "viz", "q": "視覺化是從巨量資料中得到洞見之重要工具,若我們想對於不同職業之平均收入繪圖,使用下列何圖較合適?", "o": ["直方圖", "折線圖", "河流圖", "散佈圖"], "a": 0}, {"n": 49, "g": "ml", "q": "強化學習(Reinforcement Learning)容易應用在遊戲,而較難應用在真實世界的主要原因,下列何者正確?", "o": ["產生序列過長,不易訓練", "獎勵(Reward)不明確", "真實世界動作(Action)為連續動作", "對於真實世界無法完整模擬"], "a": 3}, {"n": 50, "g": "hadoop", "q": "當雲端叢集有1個DataNode故障時,系統將進行何種操作?", "o": ["資料會遺失", "Hadoop會自動複製裡面所儲存之檔案塊於其他DataNode", "Hadoop會自動寄信給管理員警告此狀況", "Hadoop會繼續執行,只是有些資料塊會只有1份備份"], "a": 1}]}, {"id": "p112", "kind": "past", "title": "112 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．官方答案", "unofficial": false, "qs": [{"n": 26, "g": "ml", "q": "在機器學習中,深度強化學習(Deep Reinforcement Learning)主要面臨的挑戰為下列何者?", "o": ["過擬合(Overfitting)", "計算效率", "缺乏大規模資料", "探索與利用的平衡"], "a": 1}, {"n": 27, "g": "prep", "q": "在機器學習中,遞迴類神經網路(RNN)主要用於處理下列何種類型之資料?", "o": ["非結構化資料", "圖像資料", "時序資料", "結構化資料"], "a": 2}, {"n": 28, "g": "prep", "q": "在巨量資料分析中,下列何者為主成分分析(PCA)之用途?", "o": ["資料壓縮", "資料可視化", "資料備份", "特徵選擇與降維"], "a": 3}, {"n": 29, "g": "mining", "q": "在巨量資料分析中,推薦系統的主要目標為何?", "o": ["評估資料相關性", "預測未來趨勢", "辨識異常行為", "提供個性化建議"], "a": 3}, {"n": 30, "g": "ml", "q": "維度災難(Curse of Dimensionality)指下列何者?", "o": ["資料集的數據維度過多", "資料集的數據維度過少,導致計算困難", "資料集的數據分佈不平均", "資料集中的數據缺乏多樣性"], "a": 1}, {"n": 31, "g": "basic", "q": "考慮巨量資料的特性,下列何者最能描述「Velocity」之特性?", "o": ["資料的快速產生、傳輸、即時處理", "資料多樣性", "資料的大規模與容量", "資料的真實性與準確性"], "a": 0}, {"n": 32, "g": "nosql", "q": "當面對結構化和非結構化的巨量資料時,下列哪項存儲技術最適合存放非結構化資料?", "o": ["資料倉儲", "關聯式資料庫", "NoSQL資料庫", "OLAP立方體"], "a": 2}, {"n": 33, "g": "prep", "q": "在資料工程項目中為確保資料完整性,下列哪種技術是必要的?", "o": ["資料加密(Encryption)", "資料驗證(Validation)", "資料壓縮(Compression)", "資料隨機化(Randomization)"], "a": 1}, {"n": 34, "g": "mr", "q": "針對巨量資料處理,台灣的一家公司決定使用MapReduce進行數據處理,下列何者最能說明MapReduce之操作方式?", "o": ["首先彙整資料,然後再分配給不同的節點進行處理", "在單一伺服器上進行所有計算,然後將結果分配給客戶端", "先將資料映射到各節點,再從各節點彙整結果", "資料首先被分配給節點,每個節點獨立運算,不需要合併結果"], "a": 2}, {"n": 35, "g": "ml", "q": "在數據科學領域中,當數據分佈不均衡時,下列哪個評估指標最適合用於分類器性能評估?", "o": ["精確度(Accuracy)", "F1分數(F1-Score)", "正確率(Precision)", "召回率(Recall)"], "a": 1}, {"n": 36, "g": "ml", "q": "下列有關過擬合(Overfitting)之處理策略,何者有誤?", "o": ["利用數據增強如圖片旋轉,增加數據多樣性", "不斷增加訓練次數,直到訓練誤差趨近於零", "使用Dropout技巧隨機丟棄神經元", "使用早停法(Early Stopping)"], "a": 1}, {"n": 37, "g": "dw", "q": "下列何者屬於資料探勘研究的範疇?", "o": ["專家系統的推論", "SQL查詢處理", "敘述統計處理", "分群處理"], "a": 3}, {"n": 38, "g": "ml", "q": "使用卷積神經網路(CNN)進行圖像辨識時,下列哪一層負責提取圖像的基本特徵?", "o": ["全連接層(Fully Connected Layer)", "池化層(Pooling Layer)", "歸一化層(Normalization Layer)", "卷積層(Convolution Layer)"], "a": 3}, {"n": 39, "g": "mining", "q": "當一家醫院希望分析病人的醫療紀錄以預測其再入院的風險時,最適合使用下列哪一種機器學習任務?", "o": ["廻歸(Regression)", "分類(Classification)", "聚類(Clustering)", "降維(Dimensionality Reduction)"], "a": 1}, {"n": 40, "g": "mining", "q": "在機器學習中,哪一種演算法是基於樹狀結構,且適用於分類與預測問題?", "o": ["支持向量機(Support Vector Machine)", "隨機森林(Random Forest)", "K均值聚類法(K-Means Clustering)", "主成分分析(Principal Component Analysis)"], "a": 1}, {"n": 41, "g": "prep", "q": "在機器學習中,特徵工程(Feature Engineering)指下列何者?", "o": ["創造新的數據特徵以提高模型的特性", "調整模型的超參數以改善性能", "清理數據以去除離群值", "壓縮數據以節省儲存空間"], "a": 0}, {"n": 42, "g": "ml", "q": "在類神經網路中,反向傳播(Backpropagation)是用來執行下列哪個關鍵任務?", "o": ["將資料從輸入層傳遞至輸出層", "調整神經元的啟動函數(Activation Function)", "計算損失函數的梯度,以更新權重", "創造新的神經元層"], "a": 2}, {"n": 43, "g": "dw", "q": "假設銷售點有3類項目集{a,b,c};資料庫共有3筆交易:{b},{b、c},{a、b、c}。若關聯規則要求最小支持度為2/3,最小信心度為0.7。下列哪條關聯規則符合該要求?", "o": ["b→a", "b→c", "c→b", "ab→c"], "a": 2}, {"n": 44, "g": "mining", "q": "下列哪項目標不易透過資料探勘客戶交易資料達成?", "o": ["顧客的薪資預測", "顧客會一起購買的產品項", "猜測那些產品會先後購買", "猜測顧客信用卡被盜刷與否"], "a": 0}, {"n": 45, "g": "dw", "q": "下列何者非屬OLAP操作?", "o": ["下鑽(Drill down)", "資料修改(Update)", "切片(Slicing)", "切丁(Dicing)"], "a": 1}, {"n": 46, "g": "dw", "q": "下列何者非屬資料倉儲用的資料模型?", "o": ["物件導向(OOP)", "星型(Star)", "雪花(Snowflake)", "星雲(Constellation)"], "a": 0}, {"n": 47, "g": "ml", "q": "下列哪項方法較合適使用在進行數據分析時,可有效評估機器學習模型的性能以確保其在實際應用中具有良好的泛化能力?", "o": ["使用全部數據進行訓練", "增加特徵數量", "使用交叉驗證", "增加神經網路的深度"], "a": 2}, {"n": 48, "g": "mining", "q": "在分群演算法中,下列哪種度量不會用來衡量節點不純度(Node Impurity)?", "o": ["變異數", "TF/IDF", "基尼係數(Gini index)", "分類誤差"], "a": 1}, {"n": 49, "g": "mining", "q": "下列何者非屬基於內容推薦(Content-Based Recommendation)之優點?", "o": ["沒有稀疏(Sparsity)問題", "可建立使用者輪廓檔案", "能夠提供推薦的原因", "對於新品與冷門商品也會推薦"], "a": 1}, {"n": 50, "g": "nosql", "q": "有關分散式系統之優勢,下列何者有誤?", "o": ["彈性擴展(Scalability)", "高容錯性(Fault-tolerance)", "資料集中性(Centralization)", "資源最大化(Maximized Resource Utilization)"], "a": 2}]}, {"id": "p113", "kind": "past", "title": "113 年考古題", "sub": "經濟部所屬事業機構新進職員甄試．統計資訊類．巨量資料概論（第 26–50 題）．答案為參考解答，非官方公布", "unofficial": true, "qs": [{"n": 26, "g": "ml", "q": "有關統計與機器學習的差異,下列敘述何者正確?", "o": ["統計是機器學習的一個子領域,兩者沒有明顯差異", "統計主要用於數據分析,機器學習主要用於模式識別和預測", "統計強調推論和參數估計,機器學習更側重模式識別和模型訓練", "統計使用傳統方法進行數據分析,機器學習使用深度學習方法進行模式識別"], "a": 2, "e": "統計重視模型假設、參數估計與推論；機器學習偏重從資料中學習模式並做預測。(A) 統計並非機器學習的子領域；(B)(D) 的區分過於片面，統計也能預測，機器學習也不只有深度學習。"}, {"n": 27, "g": "mining", "q": "下列何者非屬資料前處理(Data Preprocessing)的一環?", "o": ["特徵轉換", "資料分群", "遺失值填補", "異常值檢測與排除"], "a": 1, "e": "資料前處理包含清理、轉換、填補遺失值、處理離群值等；資料分群屬於分析建模階段的方法，不是前處理步驟。"}, {"n": 28, "g": "prep", "q": "何謂結構化資料(Structured Data)?", "o": ["由感測器產生的資料", "社群媒體上的使用者互動資料", "具固定格式,如表格資料", "無固定格式,如文字、影像"], "a": 2, "e": "結構化資料具有固定欄位與格式，例如關聯式資料表。(A)(B) 的資料可能是半結構化或非結構化；(D) 是非結構化資料的描述。"}, {"n": 29, "g": "prep", "q": "下列何者非屬低品質的資料?", "o": ["重複值", "離群值", "錯誤", "雜訊"], "a": 1, "e": "重複值、錯誤與雜訊都屬於資料品質問題；離群值可能是真實但罕見的觀測值，不一定是低品質資料，需要進一步判斷。"}, {"n": 30, "g": "mining", "q": "下列何者非屬分群的應用範圍?", "o": ["垃圾郵件過濾", "異常檢測", "顧客細分", "降維技術"], "a": 0, "e": "垃圾郵件過濾是有標籤的分類問題，屬於監督式學習；異常檢測、顧客細分都是分群常見應用，分群結果也可用於資料縮減。"}, {"n": 31, "g": "mining", "q": "下列何者非屬離群值的處理方式?", "o": ["直接刪除", "群集分析", "使用屬性絕對值", "用其他數值替換,將資料範圍正規化"], "a": 2, "e": "離群值可刪除、以其他數值取代並正規化，也可用群集分析找出；「使用屬性絕對值」並不能處理離群值。"}, {"n": 32, "g": "spark", "q": "Spark 的 DAG(Directed Acyclic Graph)在資料處理之作用,下列何者正確?", "o": ["定義資料內部的儲存結構", "定義資料處理的邏輯流程", "定義資料判斷的決策規則", "定義資料外部的呈現形式"], "a": 1, "e": "Spark 將轉換操作串成有向無環圖 (DAG)，代表資料處理的邏輯流程與依賴關係，再據此切分 stage 與排程。"}, {"n": 33, "g": "mining", "q": "下列何者非屬群集分析(Clustering Analysis)的 4 個主要階段?", "o": ["資料準備與特徵選取", "相似度計算", "非線性分類", "分群演算法"], "a": 2, "e": "群集分析的階段包含資料準備與特徵選取、相似度計算、執行分群演算法與結果評估；非線性分類是監督式分類的概念。"}, {"n": 34, "g": "mining", "q": "有關巨量資料的長尾效應(Long Tail Effect),下列敘述何者正確?", "o": ["資料量越大,價值就越大", "少數資料佔據大部分的價值", "資料的價值會隨著時間推移而衰減", "大量資料中隱藏著小眾但有價值的資訊"], "a": 3, "e": "長尾效應指大量小眾、需求零散的項目加總起來也有可觀價值，強調大量資料中隱藏著小眾但有價值的資訊。(B) 描述的是 80/20 法則。"}, {"n": 35, "g": "mining", "q": "在資料分群中,用以確定最佳聚類數量的技術為何?", "o": ["Elbow Method", "Gradient Descent", "Principal Component Analysis", "Random Forest"], "a": 0, "e": "手肘法 (Elbow Method) 繪製不同 k 值的組內誤差平方和，以曲線轉折處決定較佳群數。梯度下降是最佳化方法；PCA 是降維；隨機森林是分類迴歸模型。"}, {"n": 36, "g": "ml", "q": "何謂遷移學習(Transfer Learning)?", "o": ["在不同的環境中部署模型的過程", "在訓練模型中將資料轉移到不同存儲位置的過程", "將模型從一個硬體平台轉移到另一個硬體平台的過程", "在不同的機器學習任務之間轉移模型權重和知識的過程"], "a": 3, "e": "遷移學習把在來源任務學到的權重與知識轉用到相關的新任務，減少所需資料與訓練時間。其他選項描述的是部署或資料、硬體搬移。"}, {"n": 37, "g": "spark", "q": "Apache Spark 在巨量資料環境中的主要用途為何?", "o": ["資料清理", "即時與批次處理", "機器學習模型訓練", "資料視覺化"], "a": 1, "e": "Spark 是通用的分散式運算引擎，同時支援批次處理與即時串流處理；資料清理、機器學習與視覺化都只是其應用的一部分。"}, {"n": 38, "g": "ml", "q": "何謂交叉驗證(Cross-Validation)?", "o": ["將資料集隨機分為訓練集和測試集", "將資料集按照特徵分為訓練集和測試集", "將資料集按照時間順序分為訓練集和測試集", "將資料集多次隨機分為訓練集和測試集,取平均結果"], "a": 3, "e": "交叉驗證把資料多次切分成訓練集與驗證集，輪流訓練與評估後取平均，以更穩定地估計模型的泛化能力。(A) 只切一次是 hold-out。"}, {"n": 39, "g": "basic", "q": "有關自然語言處理(NLP)之步驟,下列何者正確?", "o": ["斷詞→詞性標記→相依剖析", "斷詞→相依剖析→詞性標記", "相依剖析→詞性標記→斷詞", "相依剖析→斷詞→詞性標記"], "a": 0, "e": "一般流程是先斷詞，再為每個詞做詞性標記，最後根據詞與詞性進行相依剖析，分析句子結構。"}, {"n": 40, "g": "mining", "q": "在機器學習演算法中,下列何者最能避免過度配適(Overfitting)?", "o": ["決策樹", "隨機森林", "羅吉斯迴歸", "K-means演算法"], "a": 1, "e": "隨機森林以多棵決策樹透過自助抽樣與隨機選特徵建立，再投票或平均，可有效降低單一決策樹的過度配適。"}, {"n": 41, "g": "hadoop", "q": "在Hadoop中,HDFS的資料冗餘機制為何?", "o": ["資料壓縮", "資料複製", "資料分片", "資料加密"], "a": 1, "e": "HDFS 以多份副本複製 (replication) 提供資料冗餘與容錯，預設副本數為 3。"}, {"n": 42, "g": "mining", "q": "假設使用半導體晶圓資料,良率資料之反應值以二元類別表示,請問上述情境最適合使用何種分析技巧?", "o": ["羅吉斯迴歸", "決策樹", "階層式聚類分析", "主成分分析"], "a": 0, "e": "反應變數為二元類別時，羅吉斯迴歸可估計良率屬於某一類別的機率，最常用於此類分析；聚類與 PCA 屬於非監督式方法。"}, {"n": 43, "g": "ml", "q": "在資料進行機器學習的過程中,正規化(Regularization)係指下列何者?", "o": ["一種降低資料維度的技術", "一種平衡類別分佈的方法", "一種改善模型可解釋性的方式", "一種透過在損失函數中添加懲罰防止過度配適的技術"], "a": 3, "e": "正規化在損失函數中加入 L1 或 L2 等懲罰項，限制參數大小，以防止過度配適。"}, {"n": 44, "g": "mining", "q": "下列何種機器學習技術適合偵測大型資料集中的異常值(Anomalies)?", "o": ["Apriori演算法", "隔離森林(Isolation Forest)", "線性迴歸(Linear Regression)", "神經網路(Neural Networks)"], "a": 1, "e": "隔離森林利用異常值較容易被隨機切分孤立的特性，適合在大型資料集中偵測異常值。Apriori 用於關聯規則；線性迴歸用於預測數值。"}, {"n": 45, "g": "ml", "q": "下列何種神經網路架構最適合分析序列資料,如時間序列或自然語言?", "o": ["生成對抗網路(GAN)", "卷積神經網路(CNN)", "前饋神經網路(FNN)", "循環神經網路(RNN)"], "a": 3, "e": "循環神經網路 (RNN) 及其變形 LSTM、GRU 具有記憶前一時間點狀態的機制，適合時間序列與自然語言等序列資料。"}, {"n": 46, "g": "ml", "q": "下列何者為使用機器學習時須注意之事項?", "o": ["確保模型訓練時間足夠長", "模型的複雜度越高越好", "需要有過去資料且資料充足", "模型的性能與模型的可解釋性無關"], "a": 2, "e": "機器學習需要足量且具代表性的歷史資料才能學習規律。訓練越久或模型越複雜不一定越好，可解釋性也是重要考量。"}, {"n": 47, "g": "ml", "q": "有關支持向量機(Support Vector Machine)中的「核技巧」(Kernel Trick),其作用為下列何者?", "o": ["處理高維資料", "減少支持向量的數量", "提高支持向量機的計算速度", "將非線性可分的資料轉換為線性可分的資料"], "a": 3, "e": "核技巧把資料隱性映射到高維空間，使原本非線性可分的資料在高維空間中變得線性可分，而且不必實際計算高維座標。"}, {"n": 48, "g": "prep", "q": "在 ETL 過程中,Transform 主要功能是將抽取之資料進行轉換,下列何者非屬其主要任務?", "o": ["資料格式轉換", "資料清洗", "資料備份", "資料聚合"], "a": 2, "e": "Transform 階段負責格式轉換、清洗、整合與聚合；資料備份屬於資料管理或維運工作，不是轉換的任務。"}, {"n": 49, "g": "ml", "q": "生成對抗網路(GAN)較常應用在下列何種技術上?", "o": ["影像生成", "語音識別", "文字分類", "物體檢測"], "a": 0, "e": "生成對抗網路由生成器與判別器互相對抗訓練，最常用於影像生成，例如人臉合成與風格轉換。"}, {"n": 50, "g": "cloud", "q": "下列何種技術可實現即時分析?", "o": ["OLAP", "串流處理", "批次處理", "資料倉儲"], "a": 1, "e": "串流處理在資料到達時就持續運算，可實現即時分析；OLAP、批次處理與資料倉儲多針對已累積的歷史資料。"}]}];

function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.className="toast";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>t.classList.remove("show"),2200);
}

function fallbackCopy(text, cb){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{
    document.execCommand("copy");
    if(cb) cb();
  }catch(e){
    alert("複製失敗，請手動複製");
  }
  document.body.removeChild(ta);
}

function copyQuestion(id){
  const item=QM[id];
  if(!item)return;
  const {ex,i,q}=item;
  const tag=TAGS[q.g]?TAGS[q.g].n:"";
  let text=`【${ex.title} 第 ${qNo(id)} 題】${tag?`[${tag}]`:""}\n`;
  text+=`${q.q}\n\n`;
  q.o.forEach((opt,idx)=>{
    text+=`(${L[idx]}) ${opt}\n`;
  });
  text+=`\n【正解】(${L[q.a]})\n`;
  if(q.trans) text+=`【中文翻譯】${q.trans}\n`;
  if(q.e) text+=`【考點詳解】${q.e}\n`;
  if(q.w) text+=`【其他選項解析】${q.w}\n`;

  const afterCopy=()=>{
    showToast("✓ 題目與解析已複製到剪貼簿！");
    const btn=document.querySelector(`.copybtn[data-id="${id}"]`);
    if(btn){
      const origText=btn.innerHTML;
      btn.innerHTML=`✓ 已複製！`;
      btn.classList.add("copied");
      setTimeout(()=>{
        btn.innerHTML=origText;
        btn.classList.remove("copied");
      },2000);
    }
  };

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(afterCopy).catch(()=>fallbackCopy(text,afterCopy));
  }else{
    fallbackCopy(text,afterCopy);
  }
}

function card(id,num,ansMap,showSrc){
  const {ex,i,q}=QM[id],a=ansMap[id],done=a!==undefined,fl=!!st.flags[id];
  const isCardTheme=ex.kind!=="toeic";
  let h=`<div class="panel ${isCardTheme?"card-theme":""}"><div class="qtop">
  <span class="qno">第 ${num} 題<span class="chip">${TAGS[q.g]?TAGS[q.g].n:""}</span></span>
  <div class="qactions">
    <button class="copybtn" data-act="copy" data-id="${id}" title="複製此題、選項與解析到剪貼簿">📋 複製題目</button>
    <button class="flagbtn ${fl?"on":""}" data-act="flag" data-id="${id}" aria-pressed="${fl}">${fl?"已標註":"標註此題"}</button>
  </div></div>
  <p class="qtext">${esc(q.q)}</p>`;
  if(showSrc)h+=`<p class="src">出自${qLabel(id)}</p>`;
  h+=`<div class="opts">`;
  q.o.forEach((t,k)=>{let c="opt";if(done){if(k===q.a)c+=" right";else if(k===a)c+=" wrong"}
    h+=`<button class="${c}" data-act="pick" data-id="${id}" data-k="${k}" ${done?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(t)}</span></button>`});
  h+=`</div>`;
  if(!done&&q.h)h+=`<details class="hint"><summary>看提示</summary><p>${esc(q.h)}</p></details>`;
  else if(done){
    const g=a===q.a;
    h+=`<div class="exp ${g?"":"isbad"}">
    <p class="verdict">${g?"✓ 答對了！":"✗ 答錯了，你選 ("+L[a]+")"}，正解為 (${L[q.a]})</p>
    ${q.trans?`<div class="qtrans"><strong>中文翻譯：</strong>${esc(q.trans)}</div>`:""}
    ${q.e?`<p class="qexp-text"><strong>${ex.unofficial?"參考解析":"詳解"}：</strong>${esc(q.e)}</p>`:`<p class="note">此題目前收錄${ex.kind==="past"?"官方公布答案":"答案"}，尚未建立詳解。</p>`}
    ${q.w?`<div class="qopt-breakdown"><strong>其他選項解析：</strong>${esc(q.w)}</div>`:""}
    ${ex.unofficial?`<p class="note">本年度答案為參考解答，並非官方公布答案。</p>`:""}
    </div>`
  }
  return h+`</div>`;
}

function getToeicP5Stats(){
  const fullEx = findEx("toeic_p5_full");
  let d=0, o=0, fl=0, wr=0;
  fullEx.qs.forEach((q,i)=>{
    const id = "toeic_p5_full-" + i;
    const a = st.ans[id];
    if(a!==undefined){
      d++;
      if(a===q.a) o++;
      else wr++;
    }
    if(st.flags[id]) fl++;
  });
  return {d, o, fl, wr, total: fullEx.qs.length};
}

  rows.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
    h+=`<div class="tagrow"><span>${TAGS[k].n}</span><div class="bar"><i class="${p<60?"lo":p<80?"mid":""}" style="width:${p}%"></i></div><span class="pct">${s.o}／${s.d}（${p}%）</span></div>`});
  const untouched=Object.keys(TAGS).filter(k=>!stat[k].d);
  h+=`</div>`;if(untouched.length)h+=`<p class="note">尚未作答到的概念：${untouched.map(k=>TAGS[k].n).join("、")}</p>`;
  const weak=rows.filter(k=>stat[k].wr.length);
  h+=`<h2>建議優先補強的概念</h2>`;
  if(!weak.length)h+=`<div class="panel"><p style="margin:0">目前作答過的概念全部答對。可以繼續完成其他模擬測驗，讓報告涵蓋更多題型。</p></div>`;
  weak.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
    h+=`<section class="weak"><h3>${TAGS[k].n}</h3><p class="stat">答對率 ${p}%，錯 ${s.wr.length} 題${p<60?"，需要優先複習":p<80?"，建議加強":"，小幅複習即可"}</p>
    <p><strong>補強建議：</strong>${TAGS[k].t}</p><p><strong>回頭看錯題：</strong></p><ul class="wlist">`;
    s.wr.forEach(id=>{const {ex,i,q}=QM[id];h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button>：${esc(q.q.length>45?q.q.slice(0,45)+"……":q.q)}</li>`});
    h+=`</ul></section>`});
  const f=flagIds();
  if(f.length){h+=`<h2>已標註的題目</h2><ul class="wlist">`;f.forEach(id=>{const {ex,i,q}=QM[id];h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button>（${TAGS[q.g]?TAGS[q.g].n:""}）</li>`});h+=`</ul>`}
  if(weak.length||f.length)h+=`<div class="tools"><button class="btn" data-act="pset">用錯題與標註題隨機抽考</button></div>`;
  return h;
}

function render(){
  const v={home:vHome,list:vList,exam:vExam,pset:vPset,prac:vPrac,report:vReport}[st.view]||vHome;
  if(st.view==="prac"&&!(st.pr&&st.pr.ids.length))st.view="home";
  app.innerHTML=(st.view==="prac"?vPrac:v)();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toTop(){window.scrollTo(0,0)}
function qTop(){const p=app.querySelectorAll(".panel");const el=p[p.length-1];if(el)el.scrollIntoView({block:"start"})}

app.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,a=d.act;
  const ex=findEx(st.exam);let scroll=null;
  switch(a){
    case"home":st.view="home";scroll=toTop;break;
    case"list":st.view="list";st.kind=d.kind;scroll=toTop;break;
    case"open":st.view="exam";st.exam=d.ex;st.kind=findEx(d.ex).kind;scroll=toTop;break;
    case"goto":st.cur[st.exam]=+d.i;break;
    case"pgoto":st.pr.i=+d.i;break;
    case"pick":if(st.view==="prac")st.pr.ans[d.id]=+d.k;else st.ans[d.id]=+d.k;break;
    case"flag":if(st.flags[d.id])delete st.flags[d.id];else st.flags[d.id]=true;break;
    case"copy":copyQuestion(d.id);return;
    case"toeicTab":st.toeicPart=+d.part;render();return;
    case"toeicQuickPset":{
      const fullEx=findEx("toeic_p5_full");
      let ids=[];
      if(d.mode==="wrong"){
        ids=fullEx.qs.map((q,i)=>"toeic_p5_full-"+i).filter(isWrong);
        if(!ids.length){alert("太棒了！目前 Part 5 還沒有錯題紀錄。");return}
      }else{
        ids=shuffle(fullEx.qs.map((q,i)=>"toeic_p5_full-"+i)).slice(0,10);
      }
      st.pr={ids,ans:{},i:0,lastMode:d.mode};
      st.view="prac";
      scroll=toTop;
      break;
    }
    case"pstartAgain":{
      const fullEx=findEx("toeic_p5_full");
      const mode=st.pr&&st.pr.lastMode==="wrong"?"wrong":"random";
      let ids=[];
      if(mode==="wrong"){
        ids=fullEx.qs.map((q,i)=>"toeic_p5_full-"+i).filter(isWrong);
        if(!ids.length)ids=shuffle(fullEx.qs.map((q,i)=>"toeic_p5_full-"+i)).slice(0,10);
      }else{
        ids=shuffle(fullEx.qs.map((q,i)=>"toeic_p5_full-"+i)).slice(0,10);
      }
      st.pr={ids,ans:{},i:0,lastMode:mode};
      st.view="prac";
      scroll=toTop;
      break;
    }
    case"prev":if(st.view==="prac")st.pr.i--;else st.cur[st.exam]=(st.cur[st.exam]||0)-1;scroll=qTop;break;
    case"next":if(st.view==="prac")st.pr.i++;else st.cur[st.exam]=(st.cur[st.exam]||0)+1;scroll=qTop;break;
    case"report":st.view="report";scroll=toTop;break;
    case"pset":st.view="pset";scroll=toTop;break;
    case"presume":st.view="prac";scroll=toTop;break;
    case"pnum":{const inp=document.getElementById("pcount");inp.value=d.n==="999"?Object.keys(QM).length:d.n;return}
    case"pstart":{
      const pool=(app.querySelector('input[name="pool"]:checked')||{}).value;
      const w=wrongIds(),f=flagIds();
      const ids=pool==="wrong"?w:pool==="flag"?f:pool==="both"?[...new Set([...w,...f])]:Object.keys(QM);
      const n=parseInt(document.getElementById("pcount").value,10);
      if(!ids.length){document.getElementById("pmsg").textContent="這個範圍目前沒有題目，請改選其他範圍。";return}
      if(!(n>0)){document.getElementById("pmsg").textContent="請輸入 1 以上的題數。";return}
      st.pr={ids:shuffle([...ids]).slice(0,n),ans:{},i:0};st.view="prac";scroll=toTop;break}
    case"jump":{const {ex:x,i}=QM[d.id];st.view="exam";st.exam=x.id;st.cur[x.id]=i;scroll=toTop;break}
    case"nextWrong":{const c=st.cur[ex.id]||0,n=ex.qs.length;let f=-1;
      for(let s=1;s<=n;s++){const i=(c+s)%n;if(isWrong(ex.id+"-"+i)){f=i;break}}
      if(f<0){alert("本卷目前沒有錯題");return}st.cur[ex.id]=f;scroll=qTop;break}
    case"retryWrong":{let f=-1;ex.qs.forEach((q,i)=>{const id=ex.id+"-"+i;if(isWrong(id)){delete st.ans[id];if(f<0)f=i}});
      if(f<0){alert("本卷目前沒有錯題");return}st.cur[ex.id]=f;scroll=toTop;break}
    case"resetExam":if(!confirm(`確定清除${ex.title}的作答紀錄？標註會保留。`))return;
      ex.qs.forEach((q,i)=>delete st.ans[ex.id+"-"+i]);st.cur[ex.id]=0;scroll=toTop;break;
  }
  save();render();if(scroll)scroll();
});

// Listen for archive details toggle to save preference
document.addEventListener("toggle", e => {
  if(e.target && e.target.id === "archiveDetails"){
    st.archiveOpen = e.target.open;
    save();
  }
}, true);

load();render();
</script>
