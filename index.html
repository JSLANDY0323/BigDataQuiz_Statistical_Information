", "who"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "請確認訂單是否已出貨。", "e": "訊號：空格後是完整子句（the order has shipped，不缺主詞或受詞），語意是「是否」→ whether。", "w": "(A)(C)(D) what／which／who 引導的子句裡要缺一個名詞（主詞或受詞）。"}, {"g": "t_p5ncl", "q": "The manager explained _______ the project had been delayed.", "o": ["which", "whom", "why", "what"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "經理解釋了專案延誤的原因。", "e": "訊號：空格後是完整子句（the project had been delayed）→ 用疑問副詞 why（為什麼），語意是說明原因。", "w": "(A)(B)(D) what／which／whom 後面的子句要缺名詞。"}, {"g": "t_p5ncl", "q": "_______ the company needs most right now is a reliable supplier.", "o": ["Whether", "That", "Which", "What"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "公司現在最需要的是一家可靠的供應商。", "e": "訊號：空格後的子句 the company needs ___ most 缺受詞，整個子句當主詞 → What（＝the thing that）。", "w": "(A)(B) that／whether 後面要接完整子句；(C) which 當名詞子句時需有選擇範圍。"}, {"g": "t_p5ncl", "q": "Could you tell me where _______?", "o": ["the conference room is", "is the conference room", "the conference room", "does the conference room"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "可以告訴我會議室在哪裡嗎？", "e": "訊號：間接問句（疑問詞放在句中）→ 用直述語序：疑問詞 ＋ 主詞 ＋ 動詞 → where the conference room is。", "w": "(B) 保留疑問句倒裝語序是錯的；(D) 不能加助動詞 does；(C) 缺動詞。"}, {"g": "t_p5ncl", "q": "We have not decided _______ to hold the event indoors or outdoors.", "o": ["what", "whether", "that", "if"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "我們還沒決定活動要在室內還是戶外舉行。", "e": "訊號：空格後接 to V，且有 or → whether to V … or …（if 不能接 to V）。", "w": "(D) if 不能接 to V；(C) that 不接 to V；(A) what to V 表「該做什麼」，但後面已有 hold the event，不缺受詞。"}, {"g": "t_p5ncl", "q": "It is essential _______ all staff follow the new procedures.", "o": ["that", "whether", "what", "which"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "所有員工遵守新程序是非常重要的。", "e": "訊號：It is ＋ 形容詞 ＋ ___ ＋ 完整子句（虛主詞 It 代替真主詞子句）→ that。", "w": "(C)(D) 後面要缺名詞；(B) whether 表「是否」，語意不合 essential。"}, {"g": "t_p5ncl", "q": "The survey asked customers _______ they were satisfied with our service.", "o": ["what", "that", "whether", "which"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "問卷詢問顧客是否對我們的服務滿意。", "e": "訊號：ask 後面接「是否」的問句，空格後是完整子句 → whether。", "w": "(B) ask that 可表示「要求」，但本句是問卷詢問滿意與否，且 were satisfied 是陳述狀態，故用 whether；(A)(D) 不符合本句所問的是否滿意。"}, {"g": "t_p5ncl", "q": "The decision will depend on _______ the budget is approved.", "o": ["what", "if", "that", "whether"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這個決定取決於預算是否通過。", "e": "訊號：介系詞 on 後面的名詞子句表「是否」→ 只能用 whether（if 不能放在介系詞後）。", "w": "(B) if 不能當介系詞受詞；(C) that 子句不放介系詞後；(A) what 後面要缺名詞。"}, {"g": "t_p5ncl", "q": "Ms. Lin is not sure _______ will be chosen as the new team leader.", "o": ["who", "what", "whose", "whom"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "林女士不確定誰會被選為新組長。", "e": "訊號：空格後 will be chosen 缺主詞，且指人 → 主格 who。", "w": "(D) whom 是受格；(C) whose 後面要接名詞；(B) what 指事物。"}, {"g": "t_p5ncl", "q": "The brochure explains _______ customers can apply for a membership card.", "o": ["what", "how", "which", "who"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這本手冊說明顧客如何申請會員卡。", "e": "訊號：空格後是完整子句（customers can apply for a membership card）→ 疑問副詞 how（如何）。", "w": "(A)(C)(D) 後面的子句都要缺一個名詞。"}, {"g": "t_p5ncl", "q": "Please let us know at _______ time you would like the interview to begin.", "o": ["whether", "if", "what", "that"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "請告訴我們您希望面試在什麼時間開始。", "e": "本句詢問開始面試的時間，at what time 引導間接問句，後接直述語序 you would like…。", "w": "(A)(B) whether／if 不能構成 at ___ time 這個疑問片語；(D) that 會變成 at that time，無法引導本句所需的間接問句。"}, {"g": "t_p5ncl", "q": "I wonder _______ the shipment will arrive before Friday.", "o": ["that", "which", "what", "whether"], "a": 3, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "我想知道貨物是否能在週五前送達。", "e": "訊號：wonder ＋ 是否 ＋ 完整子句 → whether（也可用 if）。", "w": "(A) wonder 不接 that 子句；(B)(C) 後面要缺名詞。"}, {"g": "t_p5ncl", "q": "Next week, the committee will announce _______ has won the design contest.", "o": ["which of", "who", "whom", "whose"], "a": 1, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "委員會將於下週公布誰贏得設計比賽。", "e": "訊號：空格後 has won … 缺主詞，指人 → who。", "w": "(C) whom 是受格；(D) whose 要接名詞；(A) which of 後面要接名詞。"}, {"g": "t_p5ncl", "q": "Can you tell me how much _______?", "o": ["the service costs", "the service cost does", "does the service cost", "costs the service"], "a": 0, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "可以告訴我這項服務要多少錢嗎？", "e": "訊號：間接問句用直述語序 → how much ＋ 主詞 ＋ 動詞 → the service costs。", "w": "(C) 疑問句語序；(B)(D) 語序錯誤。"}, {"g": "t_p5ncl", "q": "The fact _______ the store is closed on Mondays surprised many tourists.", "o": ["whether", "what", "that", "which"], "a": 2, "h": "空格後的子句缺不缺名詞？語意是「是否」還是「什麼」？", "trans": "這家店週一公休的事實讓很多觀光客很意外。", "e": "訊號：the fact ＋ that ＋ 完整子句（同位語子句，說明 fact 的內容）。", "w": "(B) what 要缺名詞；(D) which 是關係代名詞，後面要缺名詞；(A) whether 表是否，語意不合 fact。"}]}, {"id": "p5_cadv", "kind": "toeic", "part": 5, "stage": 5, "title": "連接副詞與標點", "sub": "; however, ／. Therefore, → 連接副詞；, but ／, so → 連接詞", "qs": [{"g": "t_p5cadv", "q": "Demand rose sharply; _______, production was increased.", "o": ["therefore", "but", "although", "because"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "需求大幅上升，因此產量增加了。", "e": "訊號：分號（;）＋ ___ ＋ 逗號 → 連接副詞。前後是因果關係 → therefore。", "w": "(B)(C)(D) 是連接詞，不能放在分號後、逗號前的位置。"}, {"g": "t_p5cadv", "q": "The product is popular; _______, its high price limits sales.", "o": ["but", "although", "despite", "however"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這項產品很受歡迎，但價格高限制了銷量。", "e": "訊號：; ___ , → 連接副詞；前後語意轉折 → however。", "w": "(A)(B) 連接詞；(C) 介系詞，都不能放在這個位置。"}, {"g": "t_p5cadv", "q": "Please register by Friday; _______, you may not get a seat.", "o": ["moreover", "otherwise", "therefore", "however"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "請在週五前報名，否則可能沒有座位。", "e": "訊號：; ___ , → 連接副詞；語意「不然的話」→ otherwise。", "w": "(C) 因此；(A) 此外；(D) 然而，語意都不合。"}, {"g": "t_p5cadv", "q": "The hotel is close to the airport. _______, it offers free shuttle service.", "o": ["Otherwise", "Although", "Moreover", "However"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這家飯店離機場很近，此外還提供免費接駁。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；語意是補充優點 → Moreover（此外）。", "w": "(D) 轉折；(A) 否則；(B) 連接詞，後面要接子句。"}, {"g": "t_p5cadv", "q": "The train was delayed, _______ we arrived at the meeting on time.", "o": ["however", "but", "therefore", "moreover"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "火車誤點了，但我們仍準時抵達會議。", "e": "訊號：兩個完整子句之間只有逗號（沒有分號或句號）→ 需要對等連接詞 but。", "w": "(A)(C)(D) 是連接副詞，不能只用逗號連接兩個子句（會造成 comma splice）。"}, {"g": "t_p5cadv", "q": "The budget was cut. _______, the team completed the project successfully.", "o": ["Although", "Because", "Despite", "Nevertheless"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "預算被刪減了，儘管如此，團隊仍成功完成專案。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；語意轉折「儘管如此」→ Nevertheless。", "w": "(A)(B) 是連接詞，後面要接子句；(C) Despite 是介系詞。"}, {"g": "t_p5cadv", "q": "_______ the price increased, sales remained strong.", "o": ["Although", "Therefore", "However", "Nevertheless"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "雖然價格上漲，銷售仍很強勁。", "e": "訊號：___ ＋ 子句 ＋ 逗號 ＋ 主要子句 → 需要從屬連接詞 Although 把兩句連起來。", "w": "(B)(C)(D) 是連接副詞，不能引導從屬子句來連接兩個句子。"}, {"g": "t_p5cadv", "q": "Our sales team exceeded its targets; _______, everyone will receive a bonus.", "o": ["although", "whereas", "consequently", "unless"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "業務團隊超越目標，因此每個人都會獲得獎金。", "e": "訊號：; ___ , → 連接副詞；因果 → consequently（因此）。", "w": "(A)(B)(D) 是連接詞，不能放在分號後接逗號的位置。"}, {"g": "t_p5cadv", "q": "The software is easy to use. _______, it is very affordable.", "o": ["Because", "Even though", "In addition", "Unless"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "這套軟體很容易使用，此外價格也很實惠。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 轉承語；補充 → In addition。", "w": "(A)(B)(D) 是連接詞，後面要直接接子句。"}, {"g": "t_p5cadv", "q": "Ms. Hall prefers email; _______, Mr. Grant prefers phone calls.", "o": ["whereas", "in contrast", "although", "while"], "a": 1, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "Hall 女士偏好電子郵件；相較之下，Grant 先生偏好打電話。", "e": "訊號：; ___ , → 轉承語；兩人對比 → in contrast。", "w": "(A)(C)(D) 是連接詞，不放在分號後接逗號的位置（whereas 要直接連接兩個子句）。"}, {"g": "t_p5cadv", "q": "The office will be closed on Monday; _______, all staff should work from home.", "o": ["instead", "because", "so that", "although"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "辦公室週一不開放，所有員工應改為在家工作。", "e": "訊號：; ___ , → 連接副詞；「取而代之」→ instead。", "w": "(B)(C)(D) 是連接詞。"}, {"g": "t_p5cadv", "q": "The weather was bad, _______ the outdoor event was canceled.", "o": ["therefore", "however", "moreover", "so"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "天氣不好，所以戶外活動取消了。", "e": "訊號：兩個完整子句之間只用逗號 → 要用對等連接詞 so（所以）。", "w": "(A)(B)(C) 是連接副詞，只用逗號連接兩句是錯的，必須用分號或句號。"}, {"g": "t_p5cadv", "q": "We tried to call you several times. _______, no one answered.", "o": ["But for", "Because of", "However", "Although"], "a": 2, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "我們試著打給您好幾次，但沒有人接聽。", "e": "訊號：句號後 ＋ ___ ＋ 逗號 → 連接副詞；轉折 → However。", "w": "(D) 連接詞；(A)(B) 介系詞片語，後面要接名詞。"}, {"g": "t_p5cadv", "q": "The first draft had several errors; _______, it was revised twice.", "o": ["even though", "unless", "because", "as a result"], "a": 3, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "初稿有幾個錯誤，因此改了兩次。", "e": "訊號：; ___ , → 轉承語；因果 → as a result（結果、因此）。", "w": "(A)(B)(C) 是連接詞。"}, {"g": "t_p5cadv", "q": "The seminar is free for members. Non-members, _______, must pay a $20 fee.", "o": ["however", "unless", "but", "although"], "a": 0, "h": "看標點：分號／句號＋□＋逗號 → 連接副詞；只用逗號連兩句 → 連接詞。", "trans": "研討會對會員免費，然而非會員須付 20 美元。", "e": "訊號：插在主詞後、前後都有逗號 → 只有連接副詞 however 可以這樣插入句中。", "w": "(B)(C)(D) 連接詞不能插在主詞與動詞之間。"}]}, {"id": "p5_corr", "kind": "toeic", "part": 5, "stage": 5, "title": "相關連接詞", "sub": "both…and／either…or／neither…nor／not only…but also／whether…or", "qs": [{"g": "t_p5corr", "q": "Candidates should have both experience _______ strong communication skills.", "o": ["or", "nor", "but", "and"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "候選人應同時具備經驗與良好的溝通能力。", "e": "訊號：前面有 both → both A and B。", "w": "(A) 搭 either；(B) 搭 neither；(C) 搭 not only。"}, {"g": "t_p5corr", "q": "You can pay either online _______ at the front desk.", "o": ["and", "or", "nor", "but also"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "您可以線上付款或在櫃台付款。", "e": "訊號：前面有 either → either A or B。", "w": "(A) 搭 both；(C) 搭 neither；(D) 搭 not only。"}, {"g": "t_p5corr", "q": "Neither the manager _______ her assistant was aware of the change.", "o": ["but", "or", "nor", "and"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "經理和她的助理都不知道這項變更。", "e": "訊號：前面有 Neither → neither A nor B。", "w": "(B) 搭 either；(D) 搭 both；(A) 搭 not only。"}, {"g": "t_p5corr", "q": "The new phone is not only lighter _______ more durable than the previous model.", "o": ["but also", "or", "as well", "and"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "新手機不僅比上一款更輕，也更耐用。", "e": "訊號：前面有 not only → not only A but (also) B。", "w": "(B)(D) 不與 not only 搭配；(C) as well 不能放在兩者中間連接。"}, {"g": "t_p5corr", "q": "_______ you choose the standard or premium plan, you will receive free installation.", "o": ["Both", "Either", "Neither", "Whether"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "不論您選擇標準方案或進階方案，都能享有免費安裝。", "e": "訊號：___ ＋ 子句 ＋ or ＋ … ＋ 逗號 ＋ 主要子句 → Whether … or …（不論…或…）。", "w": "(B) Either 不能引導子句；(A) Both 搭 and；(C) Neither 搭 nor。"}, {"g": "t_p5corr", "q": "The workshop is designed for _______ beginners and experienced users.", "o": ["both", "whether", "neither", "either"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "這個工作坊適合新手和有經驗的使用者。", "e": "訊號：後面有 and → both A and B。", "w": "(D) 搭 or；(C) 搭 nor；(B) 搭 or 且多引導子句。"}, {"g": "t_p5corr", "q": "The report was _______ accurate nor complete, so it was sent back for revision.", "o": ["both", "whether", "neither", "either"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "報告既不正確也不完整，所以被退回修改。", "e": "訊號：後面有 nor → neither A nor B。", "w": "(A) both 搭 and；(D) either 搭 or；(B) whether 搭 or，均不能構成本題 neither…nor 的成對結構。"}, {"g": "t_p5corr", "q": "Ms. Lopez speaks not only Spanish _______ French and German.", "o": ["and", "but also", "nor", "or"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "Lopez 女士不只會說西班牙語，還會說法語和德語。", "e": "訊號：前面有 not only → but also。", "w": "(A)(C)(D) 不與 not only 搭配。"}, {"g": "t_p5corr", "q": "Either Mr. Brown or his colleagues _______ going to present the results.", "o": ["be", "was", "are", "is"], "a": 2, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "Brown 先生或他的同事們會發表結果。", "e": "訊號：either A or B 當主詞時，動詞與靠近的 B 一致 → colleagues（複數）→ are。", "w": "(B)(D) 單數，與靠近的 colleagues 不一致；(A) be 不是正確的真動詞形式。"}, {"g": "t_p5corr", "q": "_______ the CEO nor the board members have commented on the rumor.", "o": ["Not only", "Neither", "Either", "Both"], "a": 1, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "執行長和董事們都尚未對傳聞發表評論。", "e": "訊號：後面有 nor → Neither。", "w": "(C) 搭 or；(D) 搭 and；(A) 搭 but also。"}, {"g": "t_p5corr", "q": "Customers can contact us either by phone _______ by email.", "o": ["nor", "both", "and also", "or"], "a": 3, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "顧客可以選擇用電話或電子郵件聯絡我們。", "e": "前面明確有 either，成對結構為 either…or，選 or。", "w": "(A) nor 配 neither；(B) both 要放在第一個並列項前；(C) and also 不與本句 either 配對。單獨的 can… and also 並不表示兩種方式都必須用。"}, {"g": "t_p5corr", "q": "We have not decided _______ to expand overseas or focus on the domestic market.", "o": ["whether", "unless", "both", "neither"], "a": 0, "h": "先找句中已經出現的 both／either／neither／not only／whether。", "trans": "我們還沒決定要擴展海外還是專注國內市場。", "e": "訊號：decided ＋ ___ ＋ to V … or … → whether to V or …（是否／還是）。", "w": "(B) unless 引導條件子句，不能接本題 to V；(C) both 要搭 and；(D) neither 要搭 nor。whether to…or… 表尚未決定的兩個選項。"}]}, {"id": "p5_inv", "kind": "toeic", "part": 5, "stage": 5, "title": "假設語氣與倒裝", "sub": "Should you…（未來）；Were…（現在相反）；Had…p.p.（過去相反）", "qs": [{"g": "t_p5inv", "q": "_______ you have any questions, please contact our customer service team.", "o": ["Would", "Had", "Should", "Unless"], "a": 2, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如有任何問題，請聯絡我們的客服團隊。", "e": "訊號：句首 ___ ＋ 主詞 ＋ 原形動詞（have），後面是祈使句 → Should you …（＝If you should…，省略 if 的倒裝）。", "w": "(A) Would 不用於這種倒裝；(D) Unless 是「除非」，語意相反；(B) Had 後面要接 p.p.。"}, {"g": "t_p5inv", "q": "_______ we known about the delay, we would have rescheduled the meeting.", "o": ["Had", "Were", "If", "Should"], "a": 0, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果我們早知道延誤，就會重新安排會議了。", "e": "訊號：主句是 would have p.p.（與過去事實相反）；空格後是 we known（p.p.）→ Had we known（＝If we had known）。", "w": "(D) Should 後接原形；(C) If 後面要接 we had known；(B) Were 後接名詞、形容詞或 to V。"}, {"g": "t_p5inv", "q": "If the store _______ open on Sundays, it would attract more customers.", "o": ["has been", "will be", "is", "were"], "a": 3, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果那家店週日有營業，會吸引更多顧客。", "e": "此處用 would attract 描述假設結果，選 were 表示非真實或較不可能的條件；正式用法常採 were。口語中單數主詞也可能用 was，不能說所有語域一律只用 were。", "w": "(C) 一般條件句；(B) if 子句不用 will；(A) 完成式不合。"}, {"g": "t_p5inv", "q": "If we had left earlier, we _______ the train.", "o": ["would catch", "would have caught", "will catch", "caught"], "a": 1, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果我們早點出發，就會趕上火車了。", "e": "訊號：if 子句是 had p.p.（與過去事實相反）→ 主句用 would have p.p.。", "w": "(A)(C)(D) 時態與過去假設不相配。"}, {"g": "t_p5inv", "q": "_______ it not been for your support, the project would not have succeeded.", "o": ["Were", "Had", "If", "Should"], "a": 1, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "要不是有你的支持，這個專案不會成功。", "e": "訊號：空格後是 it not been（p.p.），主句 would not have succeeded（與過去事實相反）→ Had it not been for（＝If it had not been for）。", "w": "(A) Were it not for 用於與現在事實相反，且後面不接 been；(D) Should 後接原形；(C) If 後面要接 it had not been。"}, {"g": "t_p5inv", "q": "_______ the weather be bad, the outdoor event will be moved indoors.", "o": ["Should", "Were", "Had", "If"], "a": 0, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "萬一天氣不好，戶外活動將改到室內舉行。", "e": "訊號：空格後是 the weather be（原形 be）→ Should 倒裝（＝If the weather should be bad）。", "w": "(B) Were 後面不接原形 be；(C) Had 後面接 p.p.；(D) If 後面要接 is。"}, {"g": "t_p5inv", "q": "If I _______ you, I would accept the job offer.", "o": ["was being", "am", "were", "have been"], "a": 2, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果我是你，我會接受這份工作。", "e": "訊號：與現在事實相反（我不可能是你），主句 would ＋ 原形 → if 子句 be 動詞用 were。", "w": "(B) 一般條件句；(A)(D) 時態不合。"}, {"g": "t_p5inv", "q": "_______ you require further assistance, please call the number below.", "o": ["Must", "Could", "Would", "Should"], "a": 3, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如需進一步協助，請撥打下方電話。", "e": "訊號：句首 ___ ＋ 主詞 ＋ 原形動詞，後面是祈使句 → Should 倒裝（常見商務信件結尾句）。", "w": "(A)(B)(C) 不能用於省略 if 的條件倒裝。"}, {"g": "t_p5inv", "q": "Had the shipment arrived on time, we _______ the order yesterday.", "o": ["would have completed", "will complete", "had completed", "would complete"], "a": 0, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果貨物準時送達，我們昨天就能完成訂單了。", "e": "訊號：Had ＋ 主詞 ＋ p.p.（過去假設倒裝）→ 主句 would have p.p.。", "w": "(B)(C)(D) 不符合與過去事實相反的句型。"}, {"g": "t_p5inv", "q": "Not only _______ the price lower, but the quality is also better.", "o": ["does", "is", "are", "it is"], "a": 1, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "不僅價格比較低，品質也比較好。", "e": "訊號：否定詞 Not only 放句首 → 倒裝：be 動詞移到主詞前 → Not only is the price lower。", "w": "(A) 句中動詞是 be 動詞，不用助動詞 does；(C) 主詞 price 單數；(D) 沒有倒裝。"}, {"g": "t_p5inv", "q": "Rarely _______ such a high level of customer satisfaction.", "o": ["we saw", "seen we have", "have we seen", "we have seen"], "a": 2, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "我們很少看到這麼高的顧客滿意度。", "e": "訊號：否定副詞 Rarely 放句首 → 助動詞移到主詞前 → have we seen。", "w": "(A)(D) 沒有倒裝；(B) 語序錯誤。"}, {"g": "t_p5inv", "q": "If the budget _______ approved next week, construction will begin in May.", "o": ["will be", "would be", "were", "is"], "a": 3, "h": "先判斷是真實條件、非真實假設，還是否定副詞引起的倒裝；綜合時間語意、主句與空格後的動詞形式判斷。", "trans": "如果預算下週通過，工程將在五月開始。", "e": "訊號：主句是 will ＋ 原形 → 一般（可能發生的）條件句，if 子句用現在式代替未來 → is。", "w": "(A) will be 不用於本句一般未來條件；(B)(C) 不符合這裡以 will begin 描述的真實可能條件。本題不是表意願的 if 子句，也不是表示「是否」的名詞子句。"}]}, {"id": "p5_subj", "kind": "toeic", "part": 5, "stage": 5, "title": "原形假設", "sub": "正式美式原形假設：表示建議／要求的 that 子句用原形；被動用 be＋p.p.", "qs": [{"g": "t_p5subj", "q": "The manager suggested that the meeting _______ postponed until next week.", "o": ["was", "is", "be", "will be"], "a": 2, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "經理建議會議延到下週。", "e": "訊號：suggest ＋ that ＋ 主詞 ＋ (should) 原形 → be postponed。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) was、(B) is、(D) will be 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "Company policy requires that every visitor _______ in at the front desk.", "o": ["is signing", "signs", "signed", "sign"], "a": 3, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "公司規定每位訪客都必須在櫃台登記。", "e": "訊號：require that ＋ 主詞 ＋ 原形 → sign（不加 -s，即使主詞是單數）。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) is signing、(B) signs、(C) signed 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "It is essential that all employees _______ the safety guidelines.", "o": ["follow", "follows", "will follow", "followed"], "a": 0, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "所有員工務必遵守安全準則。", "e": "訊號：It is essential／important／necessary that ＋ 主詞 ＋ 原形 → follow。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(B) follows、(C) will follow、(D) followed 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "The client requested that the report _______ by Friday.", "o": ["is completed", "be completed", "was completed", "completes"], "a": 1, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "客戶要求報告在週五前完成。", "e": "訊號：request that ＋ 主詞 ＋ 原形；報告是被完成 → be completed。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) is completed、(C) was completed、(D) completes 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "Dr. Lee recommended that Mr. Park _______ more rest.", "o": ["got", "gets", "get", "will get"], "a": 2, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "李醫師建議朴先生多休息。", "e": "訊號：recommend that ＋ 主詞 ＋ 原形 → get。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) got、(B) gets、(D) will get 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "It is important that the contract _______ by both parties.", "o": ["is signing", "be signed", "signed", "signs"], "a": 1, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "合約必須由雙方簽署，這很重要。", "e": "訊號：It is important that ＋ 原形；合約是被簽 → be signed。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) is signing、(C) signed、(D) signs 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "As a formal instruction, the board demanded that the CEO _______ the decision immediately.", "o": ["explain", "has explained", "explained", "explains"], "a": 0, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "董事會正式要求執行長立刻說明這項決定。", "e": "demanded 在此明確表示提出正式要求；本題採正式美式原形假設，that 子句用原形 explain，不因 CEO 是單數而加 -s。", "w": "(B) has explained、(C) explained、(D) explains 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "Ms. Gomez asked that all expense reports _______ submitted electronically.", "o": ["will be", "are", "were", "be"], "a": 3, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "Gomez 女士要求所有費用報告以電子方式提交。", "e": "訊號：ask that ＋ 主詞 ＋ 原形 → be submitted。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) will be、(B) are、(C) were 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "It is necessary that every applicant _______ a copy of his or her diploma.", "o": ["provide", "providing", "provided", "provides"], "a": 0, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "每位應徵者都必須提供一份畢業證書影本。", "e": "訊號：It is necessary that ＋ 主詞 ＋ 原形 → provide。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(B) providing、(C) provided、(D) provides 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}, {"g": "t_p5subj", "q": "The safety inspector demanded that the factory _______ its old equipment.", "o": ["will replace", "replaced", "replace", "replaces"], "a": 2, "h": "本組練習正式美式的建議／要求型原形假設：that＋主詞＋原形。先確認是提出要求，不能把 suggest「顯示」或 insist「堅稱事實」也套入。", "trans": "安全檢查員要求工廠更換舊設備。", "e": "訊號：demand that ＋ 主詞 ＋ 原形 → replace。 本題依正式美式原形假設選答；英式用法亦常用 should＋原形，部分語境可見直述形式，不能只憑動詞字面就斷定所有其他形式都不合文法。", "w": "(A) will replace、(B) replaced、(D) replaces 均不是本題指定的原形假設答案；判斷也須考慮主被動。不要把「未採用本題句型」誤記為所有情境都不能使用這些形式。"}]}, {"id": "p5_comp", "kind": "toeic", "part": 5, "stage": 6, "title": "比較級與最高級", "sub": "比較級、最高級與 as…as；留意比較對象、修飾語及可省略的 than", "qs": [{"g": "t_p5comp", "q": "This model is much _______ than the one we purchased last year.", "o": ["more efficient", "efficiently", "efficient", "most efficient"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "這款機型比我們去年買的那款有效率得多。", "e": "訊號：後面有 than → 比較級；much 是修飾比較級的副詞 → much more efficient。", "w": "(B) efficiently 是修飾動作的副詞，不能在此取代表示機型效率特質的形容詞；(C) efficient 沒有比較級形式；(D) most efficient 是最高級，與本句 than 不搭。"}, {"g": "t_p5comp", "q": "Kenton Hotel is one of the _______ hotels in the city.", "o": ["largeness", "largest", "largely", "more large"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Kenton 飯店是市內最大的飯店之一。", "e": "本題選項中，largest 可構成 one of the largest hotels（最大的飯店之一）。one of the larger hotels 在別的句子也合法，不能說 one of the 後只能放最高級。", "w": "(A) largeness 是抽象名詞；(C) largely 是副詞；(D) more large 不是 large 的一般比較級形式。largest 作形容詞修飾 hotels。"}, {"g": "t_p5comp", "q": "The new laptop is as _______ as the previous model but much lighter.", "o": ["most powerful", "more powerful", "power", "powerful"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新筆電和舊款一樣強大，但輕很多。", "e": "訊號：as ＿ as 中間放原級形容詞。", "w": "(A)(B) as…as 中間不放比較級或最高級；(C) 名詞。"}, {"g": "t_p5comp", "q": "Of all the candidates, Ms. Diaz is the _______ qualified for the position.", "o": ["much", "very", "most", "more"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "所有候選人中，Diaz 女士最適合這個職位。", "e": "訊號：of all ＋ 範圍、前面有 the → 最高級 the most。", "w": "(D) 比較級用於兩者比較且常搭 than；(A)(B) 不構成最高級。"}, {"g": "t_p5comp", "q": "Sales this quarter were _______ higher than we had expected.", "o": ["very", "so", "most", "far"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "本季銷售額遠高於我們的預期。", "e": "訊號：修飾比較級 higher 要用 much／far／even／still → far。", "w": "(A) very 只修飾原級；(C) most 是最高級；(B) so 不修飾比較級。"}, {"g": "t_p5comp", "q": "The _______ you submit your application, the sooner we can process it.", "o": ["earliest", "earlier", "more early", "early"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "你越早提交申請，我們就能越快處理。", "e": "訊號：the ＋ 比較級, the ＋ 比較級（越…就越…）→ the earlier。", "w": "(D) 原級；(A) 最高級；(C) early 的比較級是 earlier。"}, {"g": "t_p5comp", "q": "Our prices are _______ than those of our competitors.", "o": ["low", "lowest", "lower", "more low"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "我們的價格比競爭對手低。", "e": "訊號：than → 比較級；low 是單音節 → lower。", "w": "(A) 原級；(B) 最高級；(D) 單音節不用 more。"}, {"g": "t_p5comp", "q": "Of all the company's product launches, this is the _______ successful.", "o": ["most", "more", "much", "many"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "在公司所有產品發表活動中，這次是最成功的。", "e": "Of all the company's product launches 明確表示從全部發表活動中作比較，選最高級 most successful。", "w": "(B) 比較級；(C)(D) 不構成最高級。"}, {"g": "t_p5comp", "q": "The second presentation was not as _______ as the first one.", "o": ["most interesting", "more interesting", "interest", "interesting"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "第二場簡報沒有第一場那麼有趣。", "e": "訊號：not as ＿ as → 原級。", "w": "(A)(B) 比較級／最高級不能放在 as…as 中；(C) 名詞。"}, {"g": "t_p5comp", "q": "Ms. Lee's report was _______ than anyone else's on the team.", "o": ["more thorough", "most thorough", "thoroughly", "thorough"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Lee 女士的報告比團隊中其他人的都詳盡。", "e": "訊號：than anyone else's → 比較級 more thorough（比較級＋than anyone else ＝ 最…）。", "w": "(D) 原級；(B) 最高級不搭 than；(C) 副詞。"}, {"g": "t_p5comp", "q": "This year's conference attracted twice as _______ participants as last year's.", "o": ["more", "many", "much", "most"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "今年的會議吸引的參加者是去年的兩倍。", "e": "訊號：倍數 ＋ as ＿ as；participants 是可數複數 → as many … as。", "w": "(C) much 修飾不可數；(A)(D) 比較級／最高級不能放在 as…as 中。"}, {"g": "t_p5comp", "q": "The new design is _______ more attractive than the original.", "o": ["most", "very", "even", "so"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新設計甚至比原版更吸引人。", "e": "訊號：修飾比較級 more attractive → even（甚至更…）。", "w": "(B) very 不修飾比較級；(A) most 是最高級；(D) so 不修飾比較級。"}, {"g": "t_p5comp", "q": "Mr. Kim works _______ than any other employee in the department.", "o": ["harder", "hardly", "hardest", "hard"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "金先生比部門裡的任何其他員工都努力。", "e": "訊號：than any other → 比較級 harder（hard 當副詞的比較級）。", "w": "(D) 原級；(C) 最高級；(B) hardly 是「幾乎不」，意思完全不同。"}, {"g": "t_p5comp", "q": "The Riverside branch is the _______ of our three locations.", "o": ["more busy", "busier", "busiest", "busy"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "Riverside 分店是我們三家店中最忙的。", "e": "訊號：the ＋ ___ ＋ of our three（三者以上的範圍）→ 最高級 busiest。", "w": "(D) 原級；(B) 比較級用於兩者；(A) busy 的比較級是 busier。"}, {"g": "t_p5comp", "q": "Between the two applicants, Mr. Ross is the _______ experienced.", "o": ["mostly", "more", "much", "many"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "兩位應徵者中，Ross 先生較有經驗。", "e": "訊號：Between the two（兩者）→ 用比較級，即使前面有 the（the more experienced）。", "w": "(A) mostly 是副詞「大多」；(C) much 不能直接修飾 experienced 表較有經驗；(D) many 用於可數複數。本句用 the more experienced 比較兩位候選人。"}, {"g": "t_p5comp", "q": "The shipping costs were _______ lower than originally estimated.", "o": ["more significant", "significance", "significant", "significantly"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "運費比原本估計的低很多。", "e": "訊號：修飾比較級形容詞 lower → 副詞 significantly。", "w": "(A)(C) 形容詞不能修飾形容詞；(B) 名詞。"}, {"g": "t_p5comp", "q": "The new branch is _______ the largest store in the region.", "o": ["very", "by far", "much more", "more"], "a": 1, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "新分店是區域內最大的店，而且遠遠超過其他店。", "e": "訊號：修飾最高級（the largest）→ by far。", "w": "(A) very 不能放在 the largest 前；(C)(D) 是比較級用法。"}, {"g": "t_p5comp", "q": "Online sales grew _______ quickly than in-store sales last year.", "o": ["more", "very", "most", "much"], "a": 0, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "去年網路銷售成長得比門市銷售快。", "e": "訊號：than → 比較級；quickly 是 -ly 副詞，比較級要用 more quickly。", "w": "(C) 最高級；(B)(D) 單獨不構成比較級。"}, {"g": "t_p5comp", "q": "Please choose the _______ convenient of the seven available interview times.", "o": ["mostly", "much", "most", "very"], "a": 2, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "請從七個可選的面試時段中選出最方便的一個。", "e": "在七個可選時段中選出最方便的一個，使用最高級 the most convenient。", "w": "(A) mostly 表大部分，(B) much、(D) very 不能在本句構成選出最方便時段的最高級。比較級本身不一定需要明寫 than。"}, {"g": "t_p5comp", "q": "The updated software runs _______ faster than the previous version.", "o": ["consideration", "considerable", "consider", "considerably"], "a": 3, "h": "找 than／as…as／the＋of 範圍，再看空格修飾的是原級還是比較級。", "trans": "更新後的軟體比前一版快很多。", "e": "訊號：修飾比較級 faster → 副詞 considerably。", "w": "(B) 形容詞不能修飾比較級；(C) 動詞；(A) 名詞。"}]}, {"id": "p5_deg", "kind": "toeic", "part": 5, "stage": 6, "title": "程度與結果句型", "sub": "too…to；形容詞＋enough；enough＋名詞；so＋形容詞＋that；such＋(a)＋名詞＋that", "qs": [{"g": "t_p5deg", "q": "The room is large _______ to accommodate everyone.", "o": ["enough", "so", "too", "such"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這個房間夠大，能容納所有人。", "e": "訊號：形容詞 large ＋ ___ ＋ to V → 形容詞 ＋ enough ＋ to V（enough 放在形容詞後面）。", "w": "(B) so 要搭 that 子句，且放在形容詞前；(C) too 要放在形容詞前（too large to 表「太大而不能」）；(D) such 要接名詞。"}, {"g": "t_p5deg", "q": "The package was _______ heavy to be shipped by regular mail.", "o": ["enough", "so", "very", "too"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "包裹太重了，無法以一般郵件寄送。", "e": "訊號：___ ＋ 形容詞 ＋ to V，語意是「太…而不能」→ too。", "w": "(B) so heavy 後要接 that 子句；(A) enough 要放在形容詞後；(C) very heavy to be shipped 不合文法。"}, {"g": "t_p5deg", "q": "The demand was _______ high that the factory added a night shift.", "o": ["enough", "such", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "需求高到工廠加開了夜班。", "e": "訊號：___ ＋ 形容詞（high）＋ that 子句 → so … that（如此…以致於）。", "w": "(B) such 後面要接名詞；(D) too 搭 to V；(A) enough 放在形容詞後。"}, {"g": "t_p5deg", "q": "It was _______ a popular event that tickets sold out in an hour.", "o": ["too", "such", "so", "very"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "那是場非常熱門的活動，門票一小時內就賣完。", "e": "訊號：___ ＋ a ＋ 形容詞 ＋ 名詞 ＋ that → such a … that。", "w": "(C) so 後面直接接形容詞，so a popular event 語序錯（要用 so popular an event）；(A)(D) 不搭 that 子句。"}, {"g": "t_p5deg", "q": "We do not have _______ chairs to seat all 40 participants; only 25 chairs are available.", "o": ["too", "enough", "so", "such"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "我們沒有足夠的椅子讓四十位參加者都坐下，目前只有二十五張。", "e": "四十人只有二十五張椅子，明確表示數量不足，選 enough；enough 放在名詞 chairs 前。", "w": "(A) too、(C) so 不能直接限定 chairs；(D) such chairs 表「這樣的椅子」，不表達本題數量不足。"}, {"g": "t_p5deg", "q": "The instructions were _______ clear that no one had any questions.", "o": ["enough", "such", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "說明非常清楚，沒有人有任何問題。", "e": "訊號：形容詞 clear ＋ that 子句 → so … that。", "w": "(B) such 要接名詞；(D) too 搭 to V；(A) enough 要放形容詞後。"}, {"g": "t_p5deg", "q": "Ms. Davis is experienced _______ to lead the new project team.", "o": ["such", "so", "too", "enough"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "Davis 女士經驗足夠，可以領導新專案團隊。", "e": "訊號：形容詞 experienced ＋ ___ ＋ to V → enough。", "w": "(A)(B) 要搭 that 子句；(C) too 要放在形容詞前，且語意相反。"}, {"g": "t_p5deg", "q": "The deadline is _______ close for us to make any major changes.", "o": ["too", "so", "enough", "such"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "截止期限太近了，我們無法做重大修改。", "e": "訊號：___ ＋ 形容詞 ＋ for 人 ＋ to V，語意「太…而不能」→ too。", "w": "(B) so 搭 that；(C) enough 放形容詞後；(D) such 接名詞。"}, {"g": "t_p5deg", "q": "The new software is _______ easy to use that even beginners can learn it quickly.", "o": ["such", "enough", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "新軟體非常容易使用，連新手都能很快學會。", "e": "訊號：形容詞 easy（to use 只是補充）＋ that 子句 → so … that。", "w": "(A) such 要接名詞；(D) too…to 語意相反且不接 that；(B) enough 要放在形容詞後。"}, {"g": "t_p5deg", "q": "The hotel received _______ positive reviews that it was fully booked for months.", "o": ["too", "so", "enough", "such"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這家飯店好評如潮，好幾個月都客滿。", "e": "訊號：___ ＋ 形容詞 ＋ 複數名詞（positive reviews）＋ that → such … that（複數名詞不用 a）。", "w": "(B) so 不能接「形容詞＋名詞」；(A)(C) 不搭 that 子句。"}, {"g": "t_p5deg", "q": "There was not _______ time to discuss every item on the agenda.", "o": ["enough", "very", "so", "too"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "時間不夠討論議程上的每一項。", "e": "訊號：___ ＋ 名詞 time ＋ to V → enough ＋ N ＋ to V。", "w": "(B)(C)(D) 不能直接修飾名詞 time。"}, {"g": "t_p5deg", "q": "The presentation was _______ long that some attendees left early.", "o": ["such", "so", "too", "enough"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "簡報太長了，有些與會者提早離開。", "e": "訊號：形容詞 long ＋ that 子句 → so … that。", "w": "(A) such 接名詞；(C) too 搭 to V；(D) enough 放形容詞後。"}, {"g": "t_p5deg", "q": "The item is too expensive for most customers _______.", "o": ["to afford", "afford", "to afford it", "affording"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這個商品太貴，大部分顧客負擔不起。", "e": "訊號：too ＋ 形容詞 ＋ for 人 ＋ to V。主詞 The item 就是 afford 的受詞，所以句尾不能再加 it。", "w": "(B)(D) 不是 to V；(C) 主詞已是 afford 的對象，再加 it 會重複受詞。"}, {"g": "t_p5deg", "q": "The conference hall is not big _______ to hold 500 people.", "o": ["so", "enough", "such", "too"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "會議廳不夠大，容納不了 500 人。", "e": "訊號：形容詞 big ＋ ___ ＋ to V → enough。", "w": "(D) too big 語意相反且位置錯；(A)(C) 搭 that 子句。"}, {"g": "t_p5deg", "q": "He spoke so quickly _______ many listeners missed key points.", "o": ["which", "as", "than", "that"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "他講話太快，許多聽眾漏聽了重點。", "e": "訊號：so ＋ 副詞（quickly）＋ ___ ＋ 結果子句 → that。", "w": "(A) which 是關係代名詞；(B) as 不構成結果句；(C) than 用於比較。"}]}, {"id": "p5_prep", "kind": "toeic", "part": 5, "stage": 6, "title": "介系詞語意辨析", "sub": "by 截止／until 持續；within 期間內／for 持續多久；between 明確對象之間／among 群體中", "qs": [{"g": "t_p5prep", "q": "Please submit the form _______ Friday.", "o": ["among", "until", "by", "since"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "請最遲在週五繳交表格。", "e": "submit the form 指提交動作，by Friday 表「最遲週五」，通常包含週五；until 則表示狀態或動作持續到該時點。", "w": "(A) among 不表示截止時間；(B) until 不合本句單次提交的截止要求；(D) since 指自某時點以來，不合此祈使句。"}, {"g": "t_p5prep", "q": "The store will remain open _______ 10 P.M. during the holiday season.", "o": ["until", "by", "since", "within"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "假期期間，商店將營業到晚上十點。", "e": "訊號：remain open 是「持續」狀態 ＋ 時間終點 → until。", "w": "(B) by 表最晚達成的時點，不表示持續營業至十點；(C) since 表自某時點以來，不合本句未來營業安排；(D) within 不能直接接 10 P.M. 表持續的終點。"}, {"g": "t_p5prep", "q": "All complaints must be resolved _______ 48 hours.", "o": ["for", "since", "by", "within"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "所有投訴必須在 48 小時內處理完畢。", "e": "訊號：在一段時間「之內」完成 → within ＋ 時間長度。", "w": "(A) for 表持續多久，不表期限；(B) since 接時間點；(C) by 接時間點（by Friday），不接時間長度。"}, {"g": "t_p5prep", "q": "Mr. Nakamura has worked here _______ more than ten years.", "o": ["since", "for", "by", "within"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "中村先生在這裡工作超過十年了。", "e": "訊號：完成式 ＋ 一段時間長度（ten years）→ for。", "w": "(A) since 接時間點（since 2015）；(D) within 表期限內；(C) by 表期限。"}, {"g": "t_p5prep", "q": "The profits were divided equally _______ the two partners.", "o": ["between", "within", "among", "through"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "利潤在兩位合夥人之間平分。", "e": "明確指出 two partners，表示兩位合夥人彼此間分配，選 between。between 也可以用於三個以上明確區分的對象；among 強調群體之中。", "w": "(B) within 表範圍內；(C) among 不如 between 適合本句明確的兩方分配；(D) through 表穿過或透過。"}, {"g": "t_p5prep", "q": "The new policy is popular _______ the employees.", "o": ["beside", "along", "between", "among"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "新政策在員工之間很受歡迎。", "e": "popular among the employees 表在員工這一群人中受歡迎。重點是群體中的普及，不只是數量多於二。", "w": "(C) between 不表達本句在群體中受歡迎的意思；(B) along 表沿著；(A) beside 表旁邊。between 可用於多個明確區分的對象，並非只限兩個。"}, {"g": "t_p5prep", "q": "The meeting will begin _______ 9:30 A.M.", "o": ["on", "at", "in", "among"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "會議將於上午九點半開始。", "e": "訊號：精確時刻 → at。（at ＋ 時刻、on ＋ 日期／星期、in ＋ 月／年／季節）", "w": "(A) on 用於星期或日期；(C) in 用於月份、年份等；(D) among 表群體之中。at 9:30 表確切開始時刻；原本 by 9:30 也可表最晚開始時間。"}, {"g": "t_p5prep", "q": "The annual sale starts _______ Monday, June 3.", "o": ["in", "at", "on", "for"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "年度特賣會於 6 月 3 日星期一開始。", "e": "訊號：特定日期／星期 → on。", "w": "(A) in 接月份或年份；(B) at 接時刻；(D) for 表持續。"}, {"g": "t_p5prep", "q": "The company was founded _______ 1998.", "o": ["on", "in", "among", "at"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "這家公司成立於 1998 年。", "e": "訊號：年份 → in。", "w": "(A) on 不直接接年份；(C) among 不表成立年份；(D) at 不用於這個年份結構。in 1998 表於該年成立。"}, {"g": "t_p5prep", "q": "We will contact you _______ the next few days.", "o": ["until", "since", "at", "within"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "我們將在接下來幾天內與您聯絡。", "e": "訊號：在一段時間之內 → within the next few days。", "w": "(B) since 接過去時間點；(A) until 搭持續動作；(C) at 接時刻。"}, {"g": "t_p5prep", "q": "The park is located _______ the river, so visitors can enjoy the view.", "o": ["between", "into", "along", "among"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "公園沿著河岸而建，遊客可以欣賞景色。", "e": "訊號：沿著一條線狀的東西（河、路）→ along。", "w": "(A) between 需要可辨識的相互位置或分隔對象，不能在此單用 the river 表河岸；(B) into 表進入的方向；(D) among 表群體之中。"}, {"g": "t_p5prep", "q": "Prices have risen sharply _______ the past six months.", "o": ["over", "since", "by", "at"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "過去六個月價格大幅上漲。", "e": "訊號：over the past ＋ 一段時間（在這段期間）→ over，搭配完成式。", "w": "(B) since 接時間點，不接 the past six months；(C)(D) 不能這樣搭配。"}, {"g": "t_p5prep", "q": "The office will be closed _______ the renovation.", "o": ["within", "while", "during", "when"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "辦公室在整修期間將關閉。", "e": "訊號：後面只有名詞 the renovation，表「在…期間」→ during。", "w": "(B)(D) 是連接詞，要接子句；(A) within 接時間長度。"}, {"g": "t_p5prep", "q": "Ms. Gray is responsible _______ training new employees.", "o": ["on", "for", "with", "to"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "Gray 女士負責訓練新進員工。", "e": "訊號：be responsible for ＋ N／V-ing。", "w": "(A) on、(C) with 不合本題 responsible 的搭配；(D) responsible to 通常表示向某人或機構負責，不用來接本句 training new employees 表負責的工作。"}, {"g": "t_p5prep", "q": "The shuttle bus runs every 20 minutes _______ the hotel and the airport.", "o": ["from", "through", "among", "between"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "接駁車每 20 分鐘往返飯店與機場一班。", "e": "訊號：A and B 兩個地點之間 → between A and B。", "w": "(A) from 表路線起終點時通常搭 to；(B) through 表穿過；(C) among 表群體之中，不合本句兩個端點的往返路線。"}, {"g": "t_p5prep", "q": "The report must be completed _______ the end of the month.", "o": ["by", "since", "until", "for"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "報告最遲必須在月底完成。", "e": "by the end of the month 表最遲月底須已完成，包含月底這個截止時點；不是只允許月底之前。", "w": "(C) until 搭持續動作；(D) for 接一段時間；(B) since 搭完成式。"}, {"g": "t_p5prep", "q": "The museum is open _______ 9 A.M. to 5 P.M.", "o": ["since", "from", "at", "between"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "博物館開放時間為上午九點到下午五點。", "e": "訊號：後面有 to → from A to B。", "w": "(A) since 不搭 to；(D) between 要搭 and；(C) at 接單一時刻。"}, {"g": "t_p5prep", "q": "Several new restaurants have opened _______ the downtown area.", "o": ["to", "on", "at", "in"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "市中心區域開了好幾家新餐廳。", "e": "訊號：在一個區域範圍內 → in the area。", "w": "(B) on 表在表面上；(C) at 表某個點；(A) to 表方向。"}, {"g": "t_p5prep", "q": "Applications received _______ the deadline will not be accepted.", "o": ["during", "within", "after", "until"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "截止日期後收到的申請將不受理。", "e": "訊號：語意是「截止之後」→ after。", "w": "(D) until 搭持續動作；(B) within the deadline 不合語意；(A) during 接一段期間。"}, {"g": "t_p5prep", "q": "Mr. Ford will be on vacation _______ two weeks starting Monday.", "o": ["for", "within", "by", "since"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "Ford 先生從週一開始休假兩週。", "e": "訊號：持續一段時間長度 → for two weeks。", "w": "(D) since 接時間點；(C) by 表期限；(B) within 表期限內，語意不合度假多久。"}]}, {"id": "p5_adv", "kind": "toeic", "part": 5, "stage": 6, "title": "語意副詞", "sub": "依語意與位置分辨 already／yet／still、nearly／hardly 及例外表達", "qs": [{"g": "t_p5adv", "q": "The shipment has _______ arrived, so we can start processing the orders.", "o": ["still", "ever", "already", "yet"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "貨已經到了，所以我們可以開始處理訂單。", "e": "訊號：肯定句的完成式，表示「已經」→ already（放在 has 與 p.p. 中間）。", "w": "(A) still 表持續，不能自然表達本句已抵達的完成事件；(B) ever 不合本句單次到貨；(D) yet 不用於本句肯定的 has ___ arrived 結構。這些字在其他句型也有不同用法。"}, {"g": "t_p5adv", "q": "We have not received the payment _______.", "o": ["soon", "already", "still", "yet"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "我們還沒收到款項。", "e": "訊號：否定句句尾 ＋ 完成式 → yet（尚未）。", "w": "(A) soon 指不久之後，不合本句已否定的收款情況；(B) already 不合此處「尚未收到」；(C) still 若表持續未收到，通常放在 have not 前。"}, {"g": "t_p5adv", "q": "Even after the price increase, the product is _______ very popular.", "o": ["still", "ever", "stillness", "yesterday"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "即使漲價後，這項產品仍然很受歡迎。", "e": "訊號：Even after … 表示「即使…仍然」→ still。", "w": "(B) ever 不表本句讓步後的持續狀態；(C) stillness 是名詞；(D) yesterday 指昨天，不能在此修飾 very popular 表持續。"}, {"g": "t_p5adv", "q": "The project is _______ complete; only the final review remains.", "o": ["nearby", "nearly", "nearness", "nearest"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "專案幾乎完成了，只剩最後審查。", "e": "訊號：修飾形容詞 complete，語意「幾乎」→ 副詞 nearly。", "w": "(A) nearby 表在附近；(C) nearness 是名詞；(D) nearest 是最高級形式，均不合修飾 complete 表接近完成的意思。"}, {"g": "t_p5adv", "q": "Ms. Taylor could _______ hear the speaker because of the noise.", "o": ["hardly", "hardest", "hard", "harder"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "因為太吵，Taylor 女士幾乎聽不到講者的聲音。", "e": "訊號：because of the noise 表負面結果 → hardly（幾乎不）。", "w": "(C) hard 當副詞是「努力地」；(B)(D) 比較級／最高級，語意不合。"}, {"g": "t_p5adv", "q": "The new branch opened _______ two weeks ago.", "o": ["still", "yet", "justice", "just"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "新分店兩週前才剛開幕。", "e": "訊號：搭配過去時間 two weeks ago，表「才、剛好」→ just。", "w": "(A) still 不合 opened two weeks ago 這個單次開幕事件；(B) yet 不合本句結構；(C) justice 是名詞。just two weeks ago 表才在兩週前。already 本身也能搭過去式。"}, {"g": "t_p5adv", "q": "The tickets were _______ expensive that few people bought them.", "o": ["such", "so", "very", "too"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "票價太貴，很少人買。", "e": "訊號：形容詞 expensive ＋ that 子句 → so … that。", "w": "(A) such 要接名詞；(D) too 搭 to V；(C) very 不搭 that 子句。"}, {"g": "t_p5adv", "q": "Our team members work _______ with clients to understand their needs.", "o": ["closeness", "closing", "closely", "closed"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "我們的團隊成員與客戶密切合作，了解他們的需求。", "e": "訊號：work ＿ with，語意「密切地」→ closely（close 當副詞表「距離近」）。", "w": "(A) closeness 是名詞；(B) closing、(D) closed 是動詞形式，不能在此修飾 work 表密切合作。"}, {"g": "t_p5adv", "q": "The conference room is _______ available on Friday afternoons.", "o": ["usualness", "usually", "use", "usual"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "會議室週五下午通常可以使用。", "e": "訊號：be 動詞與形容詞 available 之間 → 頻率副詞 usually。", "w": "(D) 形容詞；(A) 名詞；(C) 動詞／名詞。"}, {"g": "t_p5adv", "q": "The proposal was _______ approved by the board, with only one vote against it.", "o": ["almost unanimous", "most unanimously", "almost unanimously", "almost unanimity"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "提案幾乎全票通過，只有一票反對。", "e": "訊號：was ＋ ___ ＋ p.p. → 副詞；almost 修飾副詞 unanimously（幾乎一致地）。", "w": "(A) almost unanimous、(D) almost unanimity 不能在此修飾 approved；(B) most unanimously 不表示幾乎全票，且與一票反對的線索不符。本句用 almost unanimously 說明通過的方式。"}, {"g": "t_p5adv", "q": "The manager responded _______ to the complaint, within just one hour.", "o": ["quickness", "more quick", "quick", "quickly"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "經理在一小時內就迅速回覆了投訴。", "e": "訊號：responded（不及物）已完整 → 副詞 quickly。", "w": "(C) 形容詞；(A) 名詞；(B) quick 的比較級是 quicker，且這裡不需要比較。"}, {"g": "t_p5adv", "q": "The data has been _______ analyzed, so the results are reliable.", "o": ["thoroughly", "thoroughness", "through", "thorough"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "資料已經被徹底分析，所以結果可靠。", "e": "訊號：has been ＋ ___ ＋ p.p. → 副詞 thoroughly。", "w": "(D) 形容詞；(B) 名詞；(C) 介系詞（穿過）。"}, {"g": "t_p5adv", "q": "The store is open daily, _______ on national holidays, when it remains closed.", "o": ["ever", "only", "except", "eventually"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "商店每天營業，國定假日則休息。", "e": "when it remains closed 明確指出假日休息，故選 except，表示排除假日。這裡 except 引導例外的介系詞片語，並非單純的語意副詞。", "w": "(A) ever、(B) only、(D) eventually 均不能表達本句「假日除外」且與前後語意連貫的意思。"}, {"g": "t_p5adv", "q": "Mr. Cole has _______ been late for a meeting in ten years.", "o": ["never", "already", "yet", "ever"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "Cole 先生十年來從未在開會時遲到。", "e": "never 表「從未」，本身帶否定意義，放在 has 與 been 之間；in ten years 表示這十年來的紀錄。", "w": "(B) already 表已經，不合本句十年來從未遲到的意思；(C) yet 不合這個肯定形式的動詞片語位置；(D) ever 不能在此取代 never 表否定。"}, {"g": "t_p5adv", "q": "Prices have risen _______ in recent months, by nearly 20 percent.", "o": ["sharpen", "sharp", "sharpness", "sharply"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "近幾個月物價急遽上漲，漲幅接近 20%。", "e": "訊號：have risen（不及物）已完整 → 副詞 sharply（急遽地）。", "w": "(B) 形容詞；(C) 名詞；(A) 動詞。"}]}, {"id": "p5_part", "kind": "toeic", "part": 5, "stage": 6, "title": "分詞形容詞", "sub": "感受到 vs 引起感受；主動、被動與狀態，不只看人或物", "qs": [{"g": "t_p5part", "q": "The audience was very _______ in the speaker's presentation.", "o": ["interests", "interested", "interesting", "interest"], "a": 1, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "觀眾對講者的簡報非常感興趣。", "e": "be interested in 表對某事感興趣；本句描述觀眾感受到的興趣，因此用 interested。interesting 表令人感興趣，人和事物都可能有這種特質。", "w": "(C) interesting 表示「令人感興趣的」；(A)(D) 名詞／動詞。"}, {"g": "t_p5part", "q": "The results of the survey were quite _______.", "o": ["surprised", "surprisingly", "surprise", "surprising"], "a": 3, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "問卷結果相當令人意外。", "e": "結果引起驚訝，所以用 surprising；surprised 表感受到驚訝。判斷依感受的來源與承受者，不是只看人或物。", "w": "(A) surprised 形容人「感到驚訝」；(C) 名詞／動詞；(B) 副詞。"}, {"g": "t_p5part", "q": "Please review the _______ document before the meeting.", "o": ["attached", "attachment", "attaching", "attach"], "a": 0, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "會議前請先看過附件。", "e": "訊號：文件是「被附上的」→ p.p. attached（the attached file／document 為固定說法）。", "w": "(D) 動詞；(C) V-ing 表主動「正在附加」；(B) 名詞，不能直接修飾 document（attachment document 不自然）。"}, {"g": "t_p5part", "q": "We are looking for an _______ accountant with at least five years of experience.", "o": ["experience", "experiences", "experienced", "experiencing"], "a": 2, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "我們正在徵求一位至少有五年經驗、經驗豐富的會計師。", "e": "訊號：an ＋ ___ ＋ 名詞 → 形容詞；「有經驗的」固定用 experienced。", "w": "(D) experiencing 表正在經歷；(A)(B) 名詞／動詞。"}, {"g": "t_p5part", "q": "Customers were _______ with the quality of the new product.", "o": ["disappoint", "disappointed", "disappointment", "disappointing"], "a": 1, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "顧客對新產品的品質感到失望。", "e": "顧客對品質感到失望，使用 be disappointed with。disappointing 表令人失望，也可以形容人的表現。", "w": "(D) 表示令人失望；(C) 名詞；(A) 動詞。"}, {"g": "t_p5part", "q": "The sales figures for the third quarter were _______.", "o": ["encouraging", "encourage", "encouragement", "encouraged"], "a": 0, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "第三季的銷售數字令人振奮。", "e": "銷售數字讓人受到鼓舞，用 encouraging；encouraged 表受到鼓勵的狀態。", "w": "(D) 人感到受鼓舞；(B) 動詞；(C) 名詞。"}, {"g": "t_p5part", "q": "All _______ employees will receive a bonus at the end of the year.", "o": ["qualify", "qualification", "qualified", "qualifies"], "a": 2, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "所有符合資格的員工年底都會獲得獎金。", "e": "訊號：All ＋ ___ ＋ 名詞 → 形容詞；「符合資格的」→ qualified。", "w": "(A) qualify、(D) qualifies 是動詞；(B) qualification 是名詞，不能在此表示符合資格的員工。qualifying employees 在其他句子也可成立，不能以「修飾人只能用 qualified」排除。"}, {"g": "t_p5part", "q": "The tour guide gave a _______ explanation of the city's history.", "o": ["fascination", "fascinate", "fascinated", "fascinating"], "a": 3, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "導遊對這座城市的歷史做了引人入勝的解說。", "e": "解說吸引聽眾、令人著迷，所以用 fascinating；fascinated 表感到著迷。", "w": "(C) 形容人「著迷的」；(B) 動詞；(A) 名詞。"}, {"g": "t_p5part", "q": "Please return any _______ items in their original packaging.", "o": ["damage", "damaged", "damages", "damaging"], "a": 1, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "請將任何損壞的商品以原包裝退回。", "e": "訊號：any ＋ ___ ＋ 名詞 items → 形容詞；商品是「被損壞的」→ p.p. damaged。", "w": "(D) damaging 表「造成損害的」；(A)(C) 名詞或動詞，不能修飾 items。"}, {"g": "t_p5part", "q": "Mr. Ito felt _______ after working overtime all week.", "o": ["exhausting", "exhaustion", "exhaust", "exhausted"], "a": 3, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "加了一整週班後，伊藤先生感到筋疲力盡。", "e": "加班一整週後感到疲憊，felt 的補語用 exhausted；exhausting 表令人疲憊，也可形容人或活動。", "w": "(A) 表示「令人疲憊的」；(C) 動詞／名詞；(B) 名詞。"}, {"g": "t_p5part", "q": "The company faced a _______ situation after the supplier went bankrupt.", "o": ["challenge", "challenges", "challenging", "challenged"], "a": 2, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "供應商破產後，公司面臨艱困的處境。", "e": "訊號：修飾事物 situation → challenging（具挑戰性的）。", "w": "(A) challenge、(B) challenges 不能在此構成表示情境艱困的自然修飾語；(D) challenged 可表示受到挑戰或質疑，並不等於 challenging「具挑戰性的」，也不只用來形容人。"}, {"g": "t_p5part", "q": "Please fill out the _______ form and return it to the front desk.", "o": ["enclosed", "enclosing", "enclosure", "enclose"], "a": 0, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "請填寫隨附的表格並交回櫃台。", "e": "訊號：表格是「被附在信中的」→ enclosed（隨函附上的）。", "w": "(D) 動詞；(B) V-ing 表主動；(C) 名詞。"}, {"g": "t_p5part", "q": "The staff were _______ by the CEO's announcement of record profits.", "o": ["exciting", "excitement", "excited", "excite"], "a": 2, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "員工們因執行長宣布創紀錄獲利而感到興奮。", "e": "員工受到消息影響而感到興奮，be excited by 表受到某事激發興奮。exciting 則表令人興奮。", "w": "(A) 表令人興奮；(D) 動詞；(B) 名詞。"}, {"g": "t_p5part", "q": "This is a _______ offer, available for one week only.", "o": ["limited", "limiting", "limit", "limits"], "a": 0, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "這是限時優惠，僅限一週。", "e": "訊號：優惠是「被限制的」→ a limited offer（限定的優惠）。", "w": "(B) limiting 表「造成限制的」；(C)(D) 名詞或動詞。"}, {"g": "t_p5part", "q": "The instructions in the manual are somewhat _______.", "o": ["confusion", "confusing", "confusingly", "confuse"], "a": 1, "h": "情緒類分詞要分清「感受到」與「引起感受」；人也可以令人感興趣。其他分詞形容詞依主被動、狀態及固定用法判斷。", "trans": "手冊裡的說明有點令人困惑。", "e": "此處形容說明令人困惑，需要形容詞 confusing。confused 另可形容文字混亂不清，所以不能概括成「事物只能用 -ing，人只能用 -ed」。", "w": "(A) confusion 是名詞；(C) confusingly 是副詞；(D) confuse 是動詞，均不能在此作表示說明性質的形容詞補語。"}]}, {"id": "p5_ger", "kind": "toeic", "part": 5, "stage": 6, "title": "動名詞 vs 不定詞", "sub": "avoid／consider／finish＋V-ing；decide／agree／refuse＋to V", "qs": [{"g": "t_p5ger", "q": "Please avoid _______ your personal belongings unattended.", "o": ["leaving", "to leave", "left", "leave"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "請勿將個人物品置於無人看管的地方。", "e": "訊號：avoid ＋ V-ing。", "w": "(B)(C)(D) avoid 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The company has decided _______ its headquarters to Taichung.", "o": ["moved", "to move", "moving", "move"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "公司決定把總部搬到台中。", "e": "訊號：decide ＋ to V。", "w": "本句 decide 表達此意思時採用 to V 作補語，因此選 to move；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "Mr. Ahmed is considering _______ for the marketing position.", "o": ["applied", "apply", "to apply", "applying"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "Ahmed 先生正在考慮應徵行銷職位。", "e": "訊號：consider ＋ V-ing。", "w": "(A)(B)(C) consider 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "We agreed _______ the price by five percent.", "o": ["lower", "lowering", "to lower", "lowered"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "我們同意把價格調降 5%。", "e": "訊號：agree ＋ to V。", "w": "本句 agree 表達此意思時採用 to V 作補語，因此選 to lower；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "The board postponed _______ a decision until next month.", "o": ["making", "made", "to make", "make"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "董事會把決定延到下個月。", "e": "訊號：postpone ＋ V-ing。", "w": "(B)(C)(D) postpone 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The customer refused _______ the delivery fee.", "o": ["pay", "paid", "to pay", "paying"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "顧客拒絕支付運費。", "e": "訊號：refuse ＋ to V。", "w": "本句 refuse 表達此意思時採用 to V 作補語，因此選 to pay；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "Ms. Clark finished _______ the quarterly report this morning.", "o": ["to write", "writing", "write", "written"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "Clark 女士今天早上寫完了季度報告。", "e": "訊號：finish ＋ V-ing。", "w": "(A)(C)(D) finish 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The firm expects _______ its profits next year.", "o": ["doubled", "double", "doubling", "to double"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "公司預計明年獲利翻倍。", "e": "訊號：expect ＋ to V。", "w": "本句 expect 表達此意思時採用 to V 作補語，因此選 to double；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "Would you mind _______ the window?", "o": ["closing", "close", "closed", "to close"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "你介意把窗戶關上嗎？", "e": "訊號：mind ＋ V-ing。", "w": "(B)(C)(D) mind 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The new manager hopes _______ the team's productivity.", "o": ["improved", "improve", "to improve", "improving"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "新經理希望提升團隊的生產力。", "e": "訊號：hope ＋ to V。", "w": "本句 hope 表達此意思時採用 to V 作補語，因此選 to improve；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "Customers appreciate _______ updates about their orders.", "o": ["receives", "receiving", "to receive", "receive"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "顧客很樂意收到訂單的最新消息。", "e": "訊號：appreciate ＋ V-ing。", "w": "(A) receives 是第三人稱單數動詞；(C) to receive、(D) receive 均不符合 appreciate 後直接接動名詞表示感謝某行為的句型。"}, {"g": "t_p5ger", "q": "The supplier failed _______ the materials on time.", "o": ["delivering", "deliver", "delivered", "to deliver"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "供應商未能準時交付材料。", "e": "訊號：fail ＋ to V（未能做到）。", "w": "本句 fail 表達此意思時採用 to V 作補語，因此選 to deliver；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}, {"g": "t_p5ger", "q": "Please remember _______ the lights before you leave the office.", "o": ["turning off", "turn off", "turned off", "to turn off"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "離開辦公室前請記得關燈。", "e": "訊號：remember to V ＝ 記得「要去做」（還沒做）；remember V-ing ＝ 記得「做過」。關燈是離開前要做的事 → to turn off。", "w": "(B)(C) 不能接在 remember 後；(A) 表記得做過，語意不合。"}, {"g": "t_p5ger", "q": "After years of practice, the team is used to _______ under tight deadlines and finds the routine familiar.", "o": ["worked", "working", "works", "work"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "經過多年實務經驗，團隊已習慣在緊迫期限下工作，對這種工作方式很熟悉。", "e": "finds the routine familiar 明確指出「習慣於」，所以 be used to 中的 to 是介系詞，後接 working。", "w": "(A) worked、(C) works 不能作此介系詞的動名詞受詞；(D) work 在 be used to work 中可表示「被用來工作」，但不是本句明確的習慣語意。used to work（沒有 be）另表過去常常工作。"}, {"g": "t_p5ger", "q": "Mr. Lin suggested _______ the meeting to Thursday.", "o": ["to move", "moved", "moving", "move"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "林先生建議把會議改到週四。", "e": "訊號：suggest ＋ V-ing（或 suggest that ＋ 主詞 ＋ 原形）。", "w": "本句 suggest 表達此意思時採用 V-ing 作補語，因此選 moving；其他選項形式不符合這個直接接續的句型。不能只說原形或過去分詞一定是「第二個真動詞」。"}]}, {"id": "p5_caus", "kind": "toeic", "part": 5, "stage": 6, "title": "使役動詞", "sub": "依動詞句型與受詞的主被動關係選原形、to V 或 p.p.", "qs": [{"g": "t_p5caus", "q": "The manager had his assistant _______ the meeting room.", "o": ["booked", "books", "to book", "book"], "a": 3, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "經理請他的助理預約會議室。", "e": "訊號：have ＋ 人 ＋ 原形（叫某人去做）→ book。", "w": "(A) booked 不合本句助理主動預約房間的語意；(B) books 不能接在 had his assistant 後；(C) to book 不合此處 have＋受詞＋原形的使役結構。have＋受詞＋V-ing 在其他情境也合法。"}, {"g": "t_p5caus", "q": "We need to have the printer _______ before Monday.", "o": ["to repair", "repaired", "repairing", "repair"], "a": 1, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "我們需要在週一前把印表機修好。", "e": "訊號：have ＋ 物 ＋ p.p.（請人把某物處理好）；印表機是被修 → repaired。", "w": "(A)(C)(D) 主動形式，印表機不會自己修。"}, {"g": "t_p5caus", "q": "The new system lets customers _______ their orders online.", "o": ["tracked", "to track", "track", "tracking"], "a": 2, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "新系統讓顧客可以線上追蹤訂單。", "e": "訊號：let ＋ 人 ＋ 原形 → track。", "w": "(B) let 不接 to V；(A)(D) 不符合句型。"}, {"g": "t_p5caus", "q": "The supervisor made the team _______ the report again.", "o": ["revise", "revising", "revised", "to revise"], "a": 0, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "主管要團隊重新修改報告。", "e": "訊號：make ＋ 人 ＋ 原形（使某人做）→ revise。", "w": "(D) 主動句的 make 不接 to V；(B)(C) 不符合句型。"}, {"g": "t_p5caus", "q": "Ms. Rivera got her colleague _______ the presentation slides.", "o": ["checks", "to check", "checked", "check"], "a": 1, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "Rivera 女士請同事檢查簡報投影片。", "e": "get someone to do something 表請或促使某人做事，本題選 to check。get someone doing 另可表使某人開始或持續做事，並非錯誤句型。", "w": "(A) checks、(D) check 不合本句 get 的補語形式；(C) checked 無法表達同事主動檢查投影片的結構。"}, {"g": "t_p5caus", "q": "Please have your documents _______ before the interview.", "o": ["translate", "translating", "translated", "to translate"], "a": 2, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "請在面試前把文件翻譯好。", "e": "訊號：have ＋ 物（documents）＋ p.p. → translated。", "w": "(A)(B)(D) 主動形式，文件不會自己翻譯。"}, {"g": "t_p5caus", "q": "The new policy will help employees _______ a better work-life balance.", "o": ["achieving", "achievement", "achieved", "achieve"], "a": 3, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "新政策將幫助員工達到更好的工作與生活平衡。", "e": "訊號：help ＋ 人 ＋ (to) 原形 → achieve。", "w": "(A)(C) 不符合 help 句型；(B) 名詞。"}, {"g": "t_p5caus", "q": "The training program allows new hires _______ at their own pace.", "o": ["to learn", "learned", "learn", "learning"], "a": 0, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "訓練課程讓新進員工按照自己的步調學習。", "e": "訊號：allow ＋ 人 ＋ to V → to learn（allow 和 let 意思相近，但 allow 要接 to V）。", "w": "(C) 接原形是 let 的用法；(B)(D) 不符合句型。"}, {"g": "t_p5caus", "q": "We will get the contract _______ by the legal department.", "o": ["review", "reviewed", "reviewing", "to review"], "a": 1, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "我們會請法務部審閱合約。", "e": "訊號：get ＋ 物 ＋ p.p.，後面還有 by → reviewed。", "w": "(A)(C)(D) 主動，合約不會自己審閱。"}, {"g": "t_p5caus", "q": "The heavy rain made it difficult _______ the event outdoors.", "o": ["held", "holds", "hold", "to hold"], "a": 3, "h": "先判斷受詞與後面動作的主被動關係，再核對 have／let／make＋受詞＋原形、get／allow＋受詞＋to V、have／get＋受詞＋p.p. 等句型；have／get 也可另接 V-ing。", "trans": "大雨使得活動難以在戶外舉行。", "e": "訊號：make ＋ it（虛受詞）＋ 形容詞 ＋ to V → to hold。", "w": "(A) held、(B) holds、(C) hold 都不能在此與 made it difficult 構成完整的目的行為補語；本題用 to hold，it 作形式受詞。"}]}, {"id": "p6_1", "kind": "toeic", "part": 6, "title": "Part 6 Test 1", "sub": "4 篇文章 × 4 題（含句子插入題）．先讀空格前後句再作答", "passages": [{"kind": "電子郵件 E-mail", "head": "To: All Staff\nFrom: Karen Liu, Office Manager\nDate: March 3\nSubject: Office relocation", "text": "Dear colleagues,\n\nAs you know, our team will move to the fifth floor of the Halston Building next month. The move {{131}} on Friday, April 4, after business hours. {{132}} Please pack your personal belongings in the boxes that will be delivered to your desks next week.\n\nThe IT department will disconnect all computers on Friday afternoon. {{133}}, please save your files to the shared drive before 3:00 P.M. that day. Our new office will be fully {{134}} by Monday morning, so you can start work as usual.\n\nThank you for your cooperation.\nKaren Liu", "trans": "各位同事：如大家所知，我們團隊下個月將搬到 Halston 大樓五樓。搬遷將於 4 月 4 日星期五下班後進行。搬家公司會處理所有家具與設備。請將個人物品裝進下週會送到各位桌上的箱子裡。資訊部會在週五下午中斷所有電腦連線，因此請在當天下午三點前把檔案存到共用磁碟。新辦公室將在週一早上全面啟用，大家可以照常上班。謝謝配合。", "en": "Questions 131-134 refer to the following e-mail."}, {"kind": "公告 Notice", "head": "Greenway Fitness Center", "text": "Greenway Fitness Center is pleased to announce extended opening hours. Starting May 1, the center will open at 5:30 A.M. on weekdays, half an hour earlier than {{135}}. This change is a response to requests from members who prefer to exercise before work.\n\nIn addition, we have {{136}} our weekend schedule. On Saturdays and Sundays, the center will now close at 10:00 P.M. instead of 8:00 P.M.\n\n{{137}} To celebrate the new hours, all members who bring a friend in May will receive a free personal training session. Please speak to any staff member at the front desk for more {{138}}.", "trans": "Greenway 健身中心很高興宣布延長營業時間。自 5 月 1 日起，平日將於早上 5:30 開門，比平常提早半小時。這項調整是回應希望在上班前運動的會員要求。此外，我們也延長了週末時段：週六、週日將改為晚上 10 點關門，而非 8 點。希望這些改變讓您更容易把運動排進一天的行程。為慶祝新時段，五月帶朋友來的會員可獲得一堂免費個人訓練課。詳情請洽櫃台任何一位員工。", "en": "Questions 135-138 refer to the following notice."}, {"kind": "報導 Article", "head": "BRIDGEPORT (June 12)", "text": "Norvell Foods, a maker of frozen meals, announced yesterday that it will open a second factory in Bridgeport. The new facility is expected to create about 300 jobs. Hiring will begin in September, {{139}} construction is scheduled to be completed.\n\nAccording to CEO Dana Price, the expansion is necessary because demand for the company's products has grown {{140}} over the past two years. \"Our current factory is running at full capacity,\" Ms. Price said. \"{{141}}\"\n\nLocal officials welcomed the news. Mayor Tom Hale said the factory {{142}} the city's economy and attract other businesses to the area.", "trans": "冷凍食品製造商 Norvell Foods 昨天宣布將在 Bridgeport 開設第二座工廠，預計創造約 300 個工作機會。招募將於九月工程預定完工時開始。執行長 Dana Price 表示，過去兩年公司產品需求快速成長，因此必須擴廠。「我們現有的工廠已全速運轉，」她說，「第二個廠區能讓我們更快完成訂單。」地方官員對此表示歡迎。市長 Tom Hale 說，這座工廠將提振本市經濟，並吸引其他企業進駐。", "en": "Questions 139-142 refer to the following article."}, {"kind": "信件 Letter", "head": "Dear Mr. Alvarez,", "text": "Thank you for contacting us about the coffee maker you purchased from our online store on August 2. We are sorry to hear that the product stopped working after only one week.\n\n{{143}} Please return the item to us using the prepaid shipping label enclosed with this letter. Once we receive the coffee maker, we will send you a new one at no {{144}}.\n\nIf you would prefer a refund {{145}} a replacement, please let us know by e-mail. Refunds are usually processed within five business days.\n\nWe appreciate your patience and apologize for any {{146}} this may have caused.\n\nSincerely,\nHelen Brooks\nCustomer Service, Kitchenware Direct", "trans": "Alvarez 先生您好：感謝您來信告知 8 月 2 日在本網路商店購買的咖啡機問題。很遺憾得知產品只用一週就故障。我們很樂意為您更換。請使用隨信附上的預付運送標籤將商品寄回。收到咖啡機後，我們會免費寄給您一台新的。若您希望退款而非換貨，請以電子郵件告知，退款通常在五個工作天內完成。感謝您的耐心，對造成的不便深感抱歉。", "en": "Questions 143-146 refer to the following letter."}], "qs": [{"n": 131, "p": 0, "g": "t_p6gram", "q": "", "o": ["took place", "has taken place", "was taking place", "will take place"], "a": 3, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "搬遷將於 4 月 4 日星期五下班後進行。", "e": "前一句說 our team will move … next month（下個月才搬），所以搬遷是未來的事 → will take place。", "w": "(A)(C) 過去式；(B) 現在完成式表示已經發生，都與「下個月」矛盾。"}, {"n": 132, "p": 0, "g": "t_p6sent", "q": "", "o": ["Please return the boxes to the IT department by Friday.", "The move was completed ahead of schedule.", "Movers will handle all furniture and equipment.", "Therefore, all employees should work from home next month."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "搬家公司會處理所有家具與設備。", "e": "空格前在說搬遷時間，空格後說「請打包你的個人物品」。(C) 先說明大型家具設備由搬家公司處理，正好帶出員工只需處理個人物品，前後銜接最自然。", "w": "(A) 箱子是發給大家打包用的，不是要交回資訊部，與下一句矛盾；(B) 搬遷是下個月的事，用過去式說「已提前完成」與前文矛盾；(D) 與「週一照常在新辦公室上班」矛盾，Therefore 也找不到前因。"}, {"n": 133, "p": 0, "g": "t_p6conn", "q": "", "o": ["Therefore", "Otherwise", "Instead", "However"], "a": 0, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "因此，請在當天下午三點前把檔案存到共用磁碟。", "e": "前句：週五下午會中斷所有電腦；後句：請在三點前存檔。前因後果 → Therefore（因此）。", "w": "(D) 然而，表轉折；(B) 否則，要接「不這樣做的後果」；(C) 取而代之，語意不合。"}, {"n": 134, "p": 0, "g": "t_p6word", "q": "", "o": ["operationally", "operational", "operate", "operation"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "新辦公室將在週一早上全面啟用。", "e": "will be fully ＿：be 動詞後的補語，被副詞 fully 修飾 → 形容詞 operational（運作中的、可使用的）。", "w": "(C) 動詞；(D) 名詞；(A) 副詞，都不能當 be 動詞的補語被 fully 修飾。"}, {"n": 135, "p": 1, "g": "t_p6word", "q": "", "o": ["usual", "usually", "use", "usualness"], "a": 0, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "平日將於早上 5:30 開門，比平常提早半小時。", "e": "固定說法 earlier than usual（比平常早）。than 後面接形容詞 usual 當省略比較的對象。", "w": "(B) than usually 不是慣用說法；(D) 不常用的名詞；(C) use 語意不合。"}, {"n": 136, "p": 1, "g": "t_p6gram", "q": "", "o": ["extension", "extends", "extending", "extended"], "a": 3, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "此外，我們也延長了週末時段。", "e": "have ＋ p.p. 構成現在完成式 → extended。下一句說明週末改為 10 點關門，表示這項調整已經完成。", "w": "(C) have extending 不合文法；(B) 第三人稱現在式不能接在 have 後；(A) 名詞。"}, {"n": 137, "p": 1, "g": "t_p6sent", "q": "", "o": ["As a result, the center will no longer open on weekends.", "These classes are held in Studio B every Tuesday.", "We hope these changes make it easier for you to fit exercise into your day.", "The center's opening hours will remain the same."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "希望這些改變讓您更容易把運動排進一天的行程。", "e": "前面兩段都在說明營業時間延長（these changes），(C) 對這些改變做出總結，並自然帶到下一句「為慶祝新時段…」。", "w": "(A) 與上一段「週末延長到 10 點」矛盾；(B) These classes 在前文找不到指涉對象；(D) 整篇都在宣布延長營業時間，與主旨矛盾。"}, {"n": 138, "p": 1, "g": "t_p6word", "q": "", "o": ["informative", "information", "informed", "inform"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "詳情請洽櫃台任何一位員工。", "e": "for more ＿：more 後面接名詞 → information（for more information 詳情請洽）。", "w": "(A)(C) 形容詞，後面缺名詞；(D) 動詞。"}, {"n": 139, "p": 2, "g": "t_p6conn", "q": "", "o": ["during", "despite", "so that", "when"], "a": 3, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "招募將於九月工程預定完工時開始。", "e": "空格後 construction is scheduled to be completed 是完整子句，用來說明 September 的時間點 → when（在…的時候）。", "w": "(A)(B) 介系詞，不能接子句；(C) so that 表目的，語意不合。"}, {"n": 140, "p": 2, "g": "t_p6word", "q": "", "o": ["rapidity", "rapidly", "rapids", "rapid"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "過去兩年公司產品需求快速成長。", "e": "has grown（grow 不及物）已完整，空格修飾動詞 → 副詞 rapidly。", "w": "(D) 形容詞；(A)(C) 名詞。"}, {"n": 141, "p": 2, "g": "t_p6sent", "q": "", "o": ["A second site will allow us to meet orders more quickly.", "That is why we have decided to reduce production.", "Construction of the Bridgeport factory was finished last year.", "Our customers have complained about the new menu."], "a": 0, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "第二個廠區能讓我們更快完成訂單。", "e": "前一句說現有工廠已全速運轉（產能不足），(A) 說明新廠能解決這個問題，與「需求成長、必須擴廠」的論點一致。", "w": "(B) 需求成長、工廠滿載，要擴廠而不是減產，與前後文矛盾；(C) 與「工程預定九月完工」矛盾；(D) Norvell 是冷凍食品製造商，前一句講產能滿載，接「顧客抱怨菜單」不合邏輯。"}, {"n": 142, "p": 2, "g": "t_p6gram", "q": "", "o": ["had boosted", "has boosted", "will boost", "boosted"], "a": 2, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "市長說，這座工廠將提振本市經濟。", "e": "工廠還沒蓋好（九月才完工），對經濟的影響是未來的事 → will boost；後面 and attract 也和 will 共用。", "w": "(A)(B)(D) 都表示已經發生，與工廠尚未完工矛盾，也無法與後面的原形 attract 平行。"}, {"n": 143, "p": 3, "g": "t_p6sent", "q": "", "o": ["Unfortunately, we are unable to replace items purchased online.", "We will repair it at our service center for a small fee.", "We would be happy to replace it for you.", "Your order has already been shipped to your new address."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "我們很樂意為您更換。", "e": "後一句請顧客寄回商品，並說會免費寄一台新的 → 空格要先提出「換貨」的處理方式，(C) 最合適。", "w": "(A) 與後文「寄回後免費寄新品」矛盾；(B) 與後文 at no charge（免費）矛盾；(D) 與客訴換貨的流程無關，也接不上「請寄回商品」。"}, {"n": 144, "p": 3, "g": "t_p6word", "q": "", "o": ["payment", "charge", "price", "fare"], "a": 1, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "收到咖啡機後，我們會免費寄給您一台新的。", "e": "固定說法 at no charge（免費）。", "w": "price、payment、fare 都不與 at no 構成「免費」的慣用說法；fare 指車資、票價。"}, {"n": 145, "p": 3, "g": "t_p6conn", "q": "", "o": ["instead of", "in addition to", "because of", "according to"], "a": 0, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "若您希望退款而非換貨，請以電子郵件告知。", "e": "退款和換貨是二選一 → instead of（而不是）。", "w": "(C) 因為；(B) 除了…還（兩者都要）；(D) 根據，語意都不合。"}, {"n": 146, "p": 3, "g": "t_p6word", "q": "", "o": ["inconveniently", "inconvenient", "inconvenienced", "inconvenience"], "a": 3, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "對造成的不便深感抱歉。", "e": "any ＋ ＿ ＋ (that) this may have caused：any 後面需要名詞，而且是 caused 的受詞 → inconvenience。", "w": "(B)(C) 形容詞／p.p.；(A) 副詞，都不能當名詞。"}]}, {"id": "p6_2", "kind": "toeic", "part": 6, "title": "Part 6 Test 2", "sub": "4 篇文章 × 4 題（含句子插入題）．先讀空格前後句再作答", "passages": [{"kind": "備忘錄 Memo", "head": "To: All Employees\nFrom: Finance Department\nRe: New expense reporting system", "text": "Beginning next month, all employees must submit expense reports through our new online system, ExpenseTrack. Paper forms will no longer {{131}}.\n\nThe new system will make the process faster and more accurate. Employees will be able to upload photos of receipts {{132}} from their mobile phones. {{133}}\n\nA training session on how to use ExpenseTrack will be held on October 15 in Conference Room B. Attendance is {{134}} recommended for staff members who travel frequently.\n\nIf you have questions, please contact Linda Park in the Finance Department.", "trans": "自下個月起，所有員工都必須透過新的線上系統 ExpenseTrack 提交費用報告，紙本表格將不再受理。新系統會讓流程更快、更準確，員工可以直接用手機上傳收據照片。報告送出後會在三個工作天內完成審核。ExpenseTrack 使用訓練將於 10 月 15 日在 B 會議室舉行，強烈建議經常出差的員工參加。如有疑問，請聯絡財務部的 Linda Park。", "en": "Questions 131-134 refer to the following memo."}, {"kind": "廣告 Advertisement", "head": "Harbor View Hotel", "text": "Planning a conference or company event? Let the Harbor View Hotel take care of every detail. Our newly renovated event center {{135}} six meeting rooms of different sizes, the largest of which can hold up to 400 guests.\n\nAll rooms come with high-speed Internet and the latest audio-visual equipment. {{136}}, our experienced event coordinators will help you plan everything from seating arrangements to meals.\n\n{{137}} Book any event before December 31 and receive a 15 percent discount on room rental. To check {{138}}, visit www.harborviewhotel.com or call our events team at 555-0142.", "trans": "正在規劃會議或公司活動嗎？交給 Harbor View 飯店處理每個細節。我們新整修的活動中心有六間大小不同的會議室，最大的可容納 400 位賓客。所有會議室都配備高速網路和最新影音設備。此外，經驗豐富的活動專員會協助您規劃從座位安排到餐點的一切。限時期間，我們還提供特別優惠：12 月 31 日前預訂任何活動，場地租金享 85 折。查詢空檔請上網站或致電活動團隊 555-0142。", "en": "Questions 135-138 refer to the following advertisement."}, {"kind": "電子郵件 E-mail", "head": "To: Daniel Kim\nFrom: Rachel Moore, Human Resources\nSubject: Interview for marketing assistant position", "text": "Dear Mr. Kim,\n\nThank you for applying for the marketing assistant position at Selwyn Media. We were impressed by your résumé and would like to {{139}} you for an interview.\n\nThe interview will take place on Thursday, May 8, at 10:00 A.M. at our main office. It will last about an hour. During the interview, you will meet with the marketing director and two members of her team. {{140}}\n\nPlease bring a copy of your portfolio and a form of photo identification. When you arrive, check in at the reception desk on the first floor, and someone will escort you to the {{141}} meeting room.\n\nPlease reply to this e-mail by Monday to confirm that you {{142}} attend.\n\nBest regards,\nRachel Moore", "trans": "Kim 先生您好：感謝您應徵 Selwyn Media 的行銷助理職位。您的履歷讓我們印象深刻，想邀請您來面試。面試將於 5 月 8 日星期四上午 10 點在總公司舉行，約一小時。面試時您會與行銷總監及她團隊的兩位成員見面，也可能需要完成一份簡短的寫作測驗。請攜帶作品集一份及附照片的身分證件。抵達後請到一樓櫃台報到，會有人帶您到指定的會議室。請在週一前回覆此郵件，確認您能出席。", "en": "Questions 139-142 refer to the following e-mail."}, {"kind": "公告 Notice", "head": "Notice to Library Patrons", "text": "The Westfield Public Library will be closed from July 1 to July 21 for renovations. During this period, workers will replace the carpets, repaint the walls, and install new lighting {{143}} the building.\n\nBooks that are due during the closure may be returned after the library reopens without any late {{144}}. Patrons may also use the book drop outside the main entrance, which will remain open.\n\n{{145}} The Oakdale Branch Library, located at 220 Pine Street, will extend its hours to serve patrons during the closure.\n\nWe apologize for the inconvenience and look forward to {{146}} you in our improved facility.", "trans": "Westfield 公共圖書館將於 7 月 1 日至 21 日閉館整修。期間工人會更換地毯、重新粉刷牆面，並在整棟建築安裝新照明。閉館期間到期的書籍可在重新開館後歸還，不收逾期費；正門外的還書箱也會持續開放。其他分館將照常開放，位於 Pine 街 220 號的 Oakdale 分館將延長開放時間服務讀者。造成不便敬請見諒，期待在煥然一新的館舍迎接您。", "en": "Questions 143-146 refer to the following notice."}], "qs": [{"n": 131, "p": 0, "g": "t_p6gram", "q": "", "o": ["accept", "have accepted", "be accepted", "accepting"], "a": 2, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "紙本表格將不再受理。", "e": "主詞 Paper forms 是「被接受」的一方，accept 後面沒有受詞 → 被動 will no longer be accepted。", "w": "(A)(B) 主動，表示表格去接受別的東西，語意不通且缺受詞；(D) will no longer accepting 不合文法。"}, {"n": 132, "p": 0, "g": "t_p6word", "q": "", "o": ["direct", "director", "direction", "directly"], "a": 3, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "員工可以直接用手機上傳收據照片。", "e": "upload photos of receipts 已完整，空格修飾後面的 from their mobile phones（直接從手機）→ 副詞 directly。", "w": "(A) 形容詞或動詞；(B)(C) 名詞。"}, {"n": 133, "p": 0, "g": "t_p6sent", "q": "", "o": ["Paper forms should be submitted to Linda Park instead.", "Reports will then be reviewed and approved within three business days.", "The training session on October 15 has been canceled.", "Receipts will no longer be required for travel expenses."], "a": 1, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "報告送出後會在三個工作天內完成審核。", "e": "這一段在說明新系統的好處與流程（更快、更準確、手機上傳），(B) 接著說明送出後的審核時程，延續「更快」的主題。", "w": "(A) 與第一段「紙本表格不再受理」矛盾；(C) 與下一段仍在介紹 10 月 15 日的訓練矛盾；(D) 與前一句「可上傳收據照片」矛盾。"}, {"n": 134, "p": 0, "g": "t_p6word", "q": "", "o": ["strongly", "strengthen", "strong", "strength"], "a": 0, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "強烈建議經常出差的員工參加。", "e": "is ＋ ＿ ＋ recommended：空格在 be 動詞與 p.p. 之間，修飾 recommended → 副詞 strongly。", "w": "(C) 形容詞；(D) 名詞；(B) 動詞。"}, {"n": 135, "p": 1, "g": "t_p6gram", "q": "", "o": ["feature", "features", "featuring", "to feature"], "a": 1, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "我們新整修的活動中心有六間大小不同的會議室。", "e": "這個句子還沒有主要動詞，主詞 Our newly renovated event center 是單數 → features。", "w": "(A) 主詞單數，現在式要加 -s；(C)(D) 不能當句子的主要動詞。"}, {"n": 136, "p": 1, "g": "t_p6conn", "q": "", "o": ["Nevertheless", "Instead", "As a result", "In addition"], "a": 3, "h": "比較空格前後兩句的關係：因果、轉折、補充還是替代？", "trans": "此外，經驗豐富的活動專員會協助您規劃一切。", "e": "前句介紹設備，後句再介紹專員服務，兩者都是優點，屬於「補充」→ In addition。", "w": "(C) 結果，前後不是因果；(B) 取而代之；(A) 儘管如此，表轉折，語意都不合。"}, {"n": 137, "p": 1, "g": "t_p6sent", "q": "", "o": ["Our largest room can hold a maximum of 50 guests.", "Unfortunately, we cannot provide meals for events.", "For a limited time, we are also offering a special rate.", "This offer is available only to hotel employees."], "a": 2, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "限時期間，我們還提供特別優惠。", "e": "後一句說明 12 月 31 日前預訂可享折扣，(C) 先預告「限時優惠」，接得最自然。", "w": "(A) 與第一段「最大可容納 400 人」矛盾；(B) 與前一句「協助規劃從座位到餐點」矛盾；(D) This offer 前文沒有出現，而且廣告對象是外部客戶。"}, {"n": 138, "p": 1, "g": "t_p6word", "q": "", "o": ["availability", "avail", "available", "availably"], "a": 0, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "查詢空檔請上網站或致電活動團隊。", "e": "To check ＋ ＿：check 是及物動詞，後面需要名詞當受詞 → availability（可預訂的空檔）。", "w": "(C) 形容詞；(B) 動詞；(D) 副詞，都不能當 check 的受詞。"}, {"n": 139, "p": 2, "g": "t_p6gram", "q": "", "o": ["invited", "inviting", "invite", "invitation"], "a": 2, "h": "時態、代名詞等文法題不能只看這一句，先到前後文找時間線索或指涉對象。", "trans": "想邀請您來面試。", "e": "would like to ＋ 原形動詞 → invite。", "w": "(D) 名詞；(B) V-ing；(A) 過去式／p.p.，都不能接在不定詞 to 後面。"}, {"n": 140, "p": 2, "g": "t_p6sent", "q": "", "o": ["The position has already been filled by another candidate.", "You may also be asked to complete a short writing test.", "Please e-mail your portfolio to us before Monday.", "The marketing director will be out of the office that day."], "a": 1, "h": "看空格的前一句和後一句，選能自然銜接、且不與文章矛盾的句子。", "trans": "您也可能需要完成一份簡短的寫作測驗。", "e": "這一段在說明面試的內容與流程（時間、長度、會見誰），(B) 補充面試中可能還有的測驗，順著主題延伸。", "w": "(A) 與整封信邀請面試的目的矛盾；(C) 下一段要他面試當天攜帶作品集，前後要求不一致；(D) 與前一句「會與行銷總監見面」矛盾。"}, {"n": 141, "p": 2, "g": "t_p6word", "q": "", "o": ["designating", "designation", "designate", "designated"], "a": 3, "h": "先判斷空格需要的詞性，再用文章語意確認。", "trans": "會有人帶您到指定的會議室。", "e": "the ＋ ＿ ＋ meeting room：修飾名詞的位置；會議室是「被指定的」→ p.p. 形容詞 designated。", "w": "(C) 動詞；
