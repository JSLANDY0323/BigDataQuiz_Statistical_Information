as able to _______ the deadline despite the technical problems.", "o": ["arrive", "take", "attend", "meet"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "儘管有技術問題，團隊仍趕上了截止期限。", "e": "搭配：meet the deadline（趕上期限）、meet the needs / requirements。", "w": "arrive 不及物；attend a meeting；take 不搭 deadline。"}, {"g": "t_p5chunk", "q": "The CEO will _______ the concerns raised by shareholders at the meeting.", "o": ["talk", "address", "speak", "respond"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "執行長將在會議上處理股東提出的疑慮。", "e": "搭配：address the concerns / issues（處理、回應）。address 及物，直接接受詞。", "w": "speak / talk 要加 about；respond 要加 to。"}, {"g": "t_p5chunk", "q": "The success of the project will _______ on the support of all departments.", "o": ["consist", "contribute", "result", "depend"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "專案的成功將取決於所有部門的支持。", "e": "搭配：depend on（取決於）。", "w": "consist of；result in / from；contribute to。"}, {"g": "t_p5chunk", "q": "Please _______ to the attached document for further details.", "o": ["check", "see", "refer", "looks"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "詳情請參閱附件文件。", "e": "搭配：refer to ＋ 文件（參閱）。空格後是 to，選 refer。", "w": "(A) check、(B) see 在此直接接受詞，不接 to；(D) looks 不能用在本句祈使句的原形位置。refer to the document 表參閱文件。"}, {"g": "t_p5chunk", "q": "The company has decided to _______ in new technology to improve productivity.", "o": ["invest", "spend", "fund", "pay"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "公司決定投資新技術以提升生產力。", "e": "搭配：invest in（投資於）。", "w": "spend (money) on；pay for；fund 是及物，直接接受詞。"}, {"g": "t_p5chunk", "q": "Our new product line has been _______ received by customers.", "o": ["friendly", "favorably", "favorable", "favor"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們的新產品線深受顧客好評。", "e": "此處修飾 received 表示「獲得好評」，用副詞 favorably。kindly received 在其他情境可成立，不應只因搭配頻率較低便判錯。", "w": "(A) friendly、(C) favorable 是形容詞；(D) favor 是名詞或動詞，均不能在此修飾 received。"}, {"g": "t_p5chunk", "q": "Mr. Jones will _______ for the position of branch manager.", "o": ["apply", "request", "register", "submit"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "Jones 先生將應徵分店經理一職。", "e": "搭配：apply for ＋ 職位（應徵）。", "w": "submit an application（及物）；request 及物，直接接受詞；register for 指報名課程或活動，不用於職位。"}, {"g": "t_p5chunk", "q": "The board of directors _______ of seven members.", "o": ["comprises", "includes", "contains", "consists"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "董事會由七名成員組成。", "e": "搭配：consist of（由…組成）。空格後有 of，只有 consist 能接。", "w": "includes / contains / comprises 都是及物動詞，直接接受詞，不加 of。"}, {"g": "t_p5chunk", "q": "The manager _______ the importance of customer satisfaction.", "o": ["concentrated", "emphasized", "focused", "insisted"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "經理強調了顧客滿意度的重要性。", "e": "搭配：emphasize ＋ 受詞（及物，直接接）。空格後直接接名詞，沒有介系詞。", "w": "insist on；focus on；concentrate on，都需要 on。"}, {"g": "t_p5chunk", "q": "The company will _______ its employees for any travel expenses.", "o": ["reduce", "restore", "reimburse", "return"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "公司會補償員工的所有差旅費用。", "e": "搭配：reimburse sb for ＋ 費用（報銷）。人在前，for 接費用。", "w": "(A) reduce 表減少；(B) restore 表恢復；(D) return 表歸還，均不符合本句「報銷員工差旅費」的意思與句型。reimburse someone for expenses 是本題搭配。"}, {"g": "t_p5chunk", "q": "Customers are _______ to present their membership cards at checkout.", "o": ["necessary", "required", "demanded", "necessarily"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "顧客結帳時須出示會員卡。", "e": "搭配：be required to V（被要求）。", "w": "(A) necessary 不能在本句以 customers 為主詞表規定；(C) demanded 不用於本句 customers are ___ to 的結構；(D) necessarily 是副詞，缺少所需的補語。"}, {"g": "t_p5chunk", "q": "Ms. Patel was _______ to manager after five years with the firm.", "o": ["grown", "raised", "increased", "promoted"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "Patel 女士在公司任職五年後升為經理。", "e": "搭配：be promoted to ＋ 職位（升遷）。", "w": "raise 用於薪水（get a raise）；increase / grow 用於數量。"}, {"g": "t_p5chunk", "q": "The new regulations will take _______ on January 1.", "o": ["effect", "action", "affect", "place"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "新法規將於 1 月 1 日生效。", "e": "搭配：take effect（生效）。", "w": "affect 是動詞；take place 表「舉行、發生」；take action 表「採取行動」，主詞是人。"}, {"g": "t_p5chunk", "q": "Due to high demand, the concert tickets sold _______ within an hour.", "o": ["over", "up", "out", "off"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "由於需求量大，演唱會門票一小時內就售罄。", "e": "搭配：sell out（售罄）。", "w": "sell off 表「拋售」；sell up、sell over 不是此意。"}, {"g": "t_p5chunk", "q": "The company is _______ to providing excellent customer service.", "o": ["committed", "promised", "intended", "determined"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "公司致力於提供卓越的顧客服務。", "e": "搭配：be committed to ＋ V-ing（致力於）。這裡的 to 是介系詞，所以後面接 providing。", "w": "intended / determined / promised 後面的 to 是不定詞，要接原形 provide。"}, {"g": "t_p5chunk", "q": "Please _______ the attached file before the meeting.", "o": ["go", "review", "look", "refer"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "會議前請先看過附件檔案。", "e": "搭配：review ＋ 受詞（及物）。空格後直接接名詞，沒有介系詞。", "w": "look at；refer to；go over 都需要介系詞或副詞。"}, {"g": "t_p5chunk", "q": "The project is expected to be completed _______ schedule.", "o": ["advance", "prior", "in advance", "ahead of"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "專案預計會提前完成。", "e": "搭配：ahead of schedule（提前）；behind schedule（落後）；on schedule（如期）。", "w": "(A) advance 不能單獨接 schedule 表提前；(B) prior 須用 prior to；(C) in advance 若接名詞須加 of。ahead of schedule 表提前於預定進度。"}, {"g": "t_p5chunk", "q": "We look forward to _______ with you again.", "o": ["works", "worked", "working", "work"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們期待再次與您合作。", "e": "搭配：look forward to ＋ V-ing。這裡的 to 是介系詞。", "w": "其他形式都不能接在介系詞 to 後面。"}, {"g": "t_p5chunk", "q": "The seminar will _______ place in the main auditorium.", "o": ["take", "make", "hold", "have"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "研討會將在大禮堂舉行。", "e": "搭配：take place（舉行、發生）。", "w": "hold 要用被動 be held；make place、have place 不是此意。"}, {"g": "t_p5chunk", "q": "Under the company dress code, employees are _______ to wear business attire on Mondays.", "o": ["hoped", "wants", "waited", "expected"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "依照公司的服裝規定，員工週一應穿著商務服裝。", "e": "搭配：be expected to V（應該、被期望）。", "w": "(A) hoped 不用於本題的人作主詞結構；(B) wants 不能直接放在 are 後；(C) waited 不合此句型。"}, {"g": "t_p5chunk", "q": "The marketing campaign had a significant _______ on sales.", "o": ["result", "outcome", "impact", "consequence"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "這次行銷活動對銷售產生了重大影響。", "e": "搭配：have an impact on（對…有影響）。空格後是 on。", "w": "result of / in；consequence of；outcome of，都不接 on。"}, {"g": "t_p5chunk", "q": "Please _______ us know if you need any further information.", "o": ["allow", "let", "make", "have"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "如需更多資訊，請告訴我們。", "e": "搭配：let sb know（告知），信件結尾的超高頻句。", "w": "make sb know 語意不對；allow sb to know 要加 to；have sb know 不是慣用說法。"}, {"g": "t_p5chunk", "q": "Mr. Chen will _______ the training session in place of the director.", "o": ["make", "conduct", "attends", "perform"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "陳先生將代替主任主持這場訓練課程。", "e": "搭配：conduct a session / survey / meeting（主持、進行）。", "w": "(A) make、(D) perform 不合本句主持訓練的搭配；(C) attends 不能直接接在 will 後。"}, {"g": "t_p5chunk", "q": "We apologize _______ any inconvenience this may cause.", "o": ["about", "to", "for", "of"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "若造成任何不便，我們深感抱歉。", "e": "搭配：apologize to ＋ 人 for ＋ 事。空格後是「事」（inconvenience）→ for。", "w": "to 後面接人；about、of 不是固定搭配。"}, {"g": "t_p5chunk", "q": "The firm has a reputation _______ reliable service.", "o": ["with", "at", "to", "for"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "這家公司以服務可靠著稱。", "e": "搭配：a reputation for ＋ N（以…聞名）。", "w": "to、at、with 不與 reputation 構成這個意思。"}, {"g": "t_p5chunk", "q": "Ms. Rossi is fluent _______ three languages.", "o": ["in", "with", "at", "on"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "Rossi 女士精通三種語言。", "e": "搭配：be fluent in ＋ 語言。", "w": "at、with、on 不搭 fluent。"}, {"g": "t_p5chunk", "q": "The construction of the bridge is _______ to finish next spring.", "o": ["scheduled", "prepared", "organized", "arranged"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "大橋工程預定明年春天完工。", "e": "搭配：be scheduled to V / for ＋ 時間（預定）。", "w": "arranged、organized、prepared 不用於「預定在某時間完成」。"}, {"g": "t_p5chunk", "q": "All staff members should be _______ of the new security procedures.", "o": ["concerned", "notice", "aware", "known"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "所有員工都應了解新的保全程序。", "e": "搭配：be aware of（知道、意識到）。", "w": "be known for / as；notice 是名詞或動詞；be concerned about / with。"}, {"g": "t_p5chunk", "q": "The director gave a speech to _______ the company's 50th anniversary.", "o": ["compliment", "praise", "congratulate", "celebrate"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "總監發表演說慶祝公司成立 50 週年。", "e": "搭配：celebrate ＋ 節日／週年（慶祝）。", "w": "congratulate sb on sth（受詞是人）；praise、compliment 的受詞是人或表現。"}, {"g": "t_p5chunk", "q": "Our company specializes _______ custom software solutions.", "o": ["on", "in", "with", "at"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "本公司專精於客製化軟體解決方案。", "e": "搭配：specialize in（專精於）。", "w": "on、at、with 不搭 specialize。"}, {"g": "t_p5chunk", "q": "The manager _______ the team to work harder to reach the sales target.", "o": ["suggested", "explained", "encouraged", "insisted"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "經理鼓勵團隊更加努力以達成業績目標。", "e": "搭配：encourage sb to V（鼓勵某人去做）。", "w": "(A) suggested 不直接接 the team to work；(B) explained 不用 explain someone to do something；(D) insisted 常接 on 或 that 子句。本句用 encourage someone to do something。"}, {"g": "t_p5chunk", "q": "The price of the package _______ breakfast and airport transfer.", "o": ["includes", "belongs", "consists", "composes"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "套裝價格包含早餐與機場接送。", "e": "搭配：include ＋ 受詞（及物，直接接）。", "w": "consist of；compose 多用被動 be composed of；belong to。"}, {"g": "t_p5chunk", "q": "We are _______ to announce the opening of our new branch in Kaohsiung.", "o": ["pleasing", "pleasant", "pleasure", "pleased"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們很高興宣布高雄新分店開幕。", "e": "搭配：be pleased to V（很高興做…）。人的感受用 p.p.（-ed）。", "w": "pleasing / pleasant 形容「令人愉快的事物」；pleasure 是名詞。"}, {"g": "t_p5chunk", "q": "Please keep the receipt _______ proof of purchase.", "o": ["like", "as", "so", "such"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "請保留收據作為購買證明。", "e": "搭配：keep sth as ＋ 名詞（把…當作）。", "w": "like 表「像」；such 要用 such as；so 不接名詞。"}, {"g": "t_p5chunk", "q": "Ms. Diaz is _______ with the new accounting software.", "o": ["used", "known", "aware", "familiar"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "Diaz 女士熟悉新的會計軟體。", "e": "搭配：be familiar with（熟悉）。空格後是 with。", "w": "be aware of；be known for／as；be used to，介系詞都不是 with。"}, {"g": "t_p5chunk", "q": "All staff are encouraged to _______ in the charity event.", "o": ["participate", "enter", "attend", "involve"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "鼓勵所有員工參加慈善活動。", "e": "搭配：participate in（參加）。空格後是 in。", "w": "attend、enter、involve 是及物動詞，直接接受詞，不加 in。"}, {"g": "t_p5chunk", "q": "The new machine is _______ of producing 500 units per hour.", "o": ["possible", "available", "capable", "able"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "新機器每小時能生產 500 件。", "e": "搭配：be capable of ＋ V-ing。空格後是 of。", "w": "be able to V；possible 不以物或人當主詞表能力；available 是「可取得的」。"}, {"g": "t_p5chunk", "q": "Our customer service team will _______ with your complaint as soon as possible.", "o": ["handle", "deal", "solve", "treat"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們的客服團隊會盡快處理您的投訴。", "e": "搭配：deal with（處理）。空格後是 with。", "w": "handle、solve 是及物動詞，直接接受詞；treat 不搭 with 表處理投訴。"}, {"g": "t_p5chunk", "q": "Online sales now _______ for 40 percent of total revenue.", "o": ["account", "take", "make", "occupy"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "線上銷售現在占總營收的 40%。", "e": "搭配：account for ＋ 比例（占…）。", "w": "make up 才表「構成」；take、occupy 不接 for。"}, {"g": "t_p5chunk", "q": "Mr. Lim is in _______ of the marketing budget.", "o": ["power", "charge", "duty", "response"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "林先生負責行銷預算。", "e": "搭配：in charge of（負責、主管）。", "w": "on duty 值班；in response to 回應；in power 執政，都不是此意。"}, {"g": "t_p5chunk", "q": "I am writing on _______ of the entire team to thank you.", "o": ["part", "side", "behalf", "instead"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我謹代表全體團隊向您致謝。", "e": "搭配：on behalf of（代表）。", "w": "instead of 不加 on；on the part of 要有 the；on side of 不是慣用說法。"}, {"g": "t_p5chunk", "q": "Please book your tickets in _______ to secure a seat.", "o": ["ahead", "front", "before", "advance"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "請提前訂票以確保有座位。", "e": "搭配：in advance（事先）。", "w": "ahead of 要接名詞；in front 指空間位置；in before 不成立。"}, {"g": "t_p5chunk", "q": "Customers can take _______ of the special discount until Friday.", "o": ["profit", "advantage", "use", "benefit"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "顧客在週五前都可以利用這項特別折扣。", "e": "搭配：take advantage of（利用）。", "w": "benefit from；profit from；make use of，都不和 take…of 搭配。"}, {"g": "t_p5chunk", "q": "All prices are _______ to change without notice.", "o": ["subject", "related", "objected", "changed"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "所有價格如有變動，恕不另行通知。", "e": "搭配：be subject to ＋ N（可能受…影響）。這裡的 to 是介系詞，後面接名詞 change。", "w": "objected to 表反對；changed 語意重複；related to 表有關，語意不合。"}, {"g": "t_p5chunk", "q": "The project was carried out in _______ with the company's guidelines.", "o": ["regard", "relation", "according", "accordance"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "專案是依照公司的準則執行的。", "e": "搭配：in accordance with（依照）。", "w": "according to 不加 in 也不接 with；in relation to；in regard to，介系詞都是 to。"}, {"g": "t_p5chunk", "q": "All guests must check out _______ to 11 A.M.", "o": ["before", "earlier", "prior", "until"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "所有房客必須在上午 11 點前退房。", "e": "搭配：prior to（在…之前）。空格後是 to，只有 prior 能接。", "w": "before、until 直接接時間，不加 to；earlier than 才對。"}, {"g": "t_p5chunk", "q": "_______ of January 1, the new service fee will apply.", "o": ["As", "From", "By", "Since"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "自 1 月 1 日起，新服務費將開始適用。", "e": "搭配：as of ＋ 日期（自…起生效）。空格後是 of。", "w": "Since、From、By 都不接 of。"}, {"g": "t_p5chunk", "q": "In _______ to customer feedback, we have extended our opening hours.", "o": ["responsive", "response", "responsibility", "respond"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "為回應顧客意見，我們延長了營業時間。", "e": "搭配：in response to（回應）。", "w": "respond 是動詞；responsive 是形容詞；responsibility 是「責任」，in responsibility to 不是慣用說法。"}, {"g": "t_p5chunk", "q": "_______ to expectations, sales increased during the recession.", "o": ["Different", "Opposite", "Contrary", "Unlike"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "與預期相反，經濟衰退期間銷售額反而增加。", "e": "搭配：contrary to（與…相反）。", "w": "opposite 不接 to 當句首副詞片語；different from；unlike 直接接名詞，不加 to。"}, {"g": "t_p5chunk", "q": "Employees are _______ to working long hours during the busy season.", "o": ["familiar", "habit", "usual", "accustomed"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "員工已經習慣在旺季長時間工作。", "e": "搭配：be accustomed to ＋ V-ing（習慣於）。", "w": "usual 不這樣用；familiar with；habit 是名詞。"}, {"g": "t_p5chunk", "q": "Thank you for attending the meeting on such short _______.", "o": ["time", "warning", "note", "notice"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "謝謝您在這麼臨時的通知下出席會議。", "e": "搭配：on short notice（臨時通知）。", "w": "time、note、warning 都不與 on short 構成慣用說法。"}, {"g": "t_p5chunk", "q": "Please reply at your earliest _______.", "o": ["comfort", "convenience", "ease", "leisure"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "請在您方便時儘早回覆。", "e": "搭配：at your earliest convenience（在您方便時儘早）。商業書信高頻句。", "w": "comfort、leisure、ease 不與 earliest 構成這個說法。"}, {"g": "t_p5chunk", "q": "You can _______ an order online or by phone.", "o": ["give", "do", "place", "put"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "您可以在線上或透過電話下訂單。", "e": "搭配：place an order（下訂單）。", "w": "put、do、give 不與 order 構成「下單」。"}, {"g": "t_p5chunk", "q": "We recommend that you _______ a reservation at least one week ahead.", "o": ["make", "do", "set", "take"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們建議您至少提前一週預約。", "e": "搭配：make a reservation（預約）。", "w": "do、take、set 不與 reservation 搭配。"}, {"g": "t_p5chunk", "q": "The charity event _______ over $50,000 for the local hospital.", "o": ["raised", "grew", "arose", "rose"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "慈善活動為當地醫院募得超過五萬美元。", "e": "搭配：raise funds／money（募款）。raise 是及物動詞，後面接受詞 $50,000。", "w": "rose、arose 是不及物動詞；grew 不表募款。"}, {"g": "t_p5chunk", "q": "Please pay close _______ to the safety instructions.", "o": ["notice", "mind", "attention", "care"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "請密切注意安全說明。", "e": "搭配：pay attention to（注意）。", "w": "take care of；take notice of；mind 是動詞，都不和 pay … to 搭配。"}, {"g": "t_p5chunk", "q": "The east wing of the hospital is currently under _______.", "o": ["foundation", "build", "establishment", "construction"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "醫院東翼目前正在施工中。", "e": "搭配：under construction（施工中）。", "w": "build 是動詞；under establishment、under foundation 不是慣用說法。"}, {"g": "t_p5chunk", "q": "The store carries a wide _______ of outdoor equipment.", "o": ["number", "range", "amount", "deal"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "這家店販售種類繁多的戶外用品。", "e": "搭配：a wide range of（各式各樣的）。", "w": "a large amount／number of，a great deal of，都不和 wide 搭配。"}, {"g": "t_p5chunk", "q": "The app helps users keep _______ of their daily expenses.", "o": ["path", "trace", "track", "line"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "這個 App 幫助使用者記錄每天的開銷。", "e": "搭配：keep track of（追蹤、記錄）。", "w": "trace、path、line 不與 keep … of 構成這個意思。"}, {"g": "t_p5chunk", "q": "Full-time employees are _______ to 15 days of paid leave per year.", "o": ["eligible", "allowed", "qualified", "entitled"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "全職員工每年享有 15 天有薪假。", "e": "搭配：be entitled to ＋ N（有權享有）。空格後是 to ＋ 名詞。", "w": "be eligible for ＋ N；be allowed to ＋ V；be qualified for ＋ N，都不能接 to ＋ 名詞。"}, {"g": "t_p5chunk", "q": "In the _______ of a fire, please use the emergency exits.", "o": ["result", "event", "moment", "time"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "萬一發生火災，請使用緊急出口。", "e": "搭配：in the event of（萬一發生…）。", "w": "time、moment、result 不與 in the … of 構成「萬一」。"}, {"g": "t_p5chunk", "q": "The train arrived exactly _______ time.", "o": ["on", "in", "by", "at"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "火車準時抵達。", "e": "搭配：on time（準時）；in time 是「及時、來得及」。exactly 修飾準時 → on time。", "w": "in time 表及時，不和 exactly 搭配；at time、by time 不是慣用說法。"}, {"g": "t_p5chunk", "q": "The design team came _______ with a creative solution.", "o": ["in", "across", "up", "over"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "設計團隊想出了一個有創意的解決方案。", "e": "搭配：come up with（想出）。", "w": "come in；come over；come across（偶然遇到），都不接 with 表想出。"}, {"g": "t_p5chunk", "q": "The research was carried _______ by an independent agency.", "o": ["away", "out", "over", "off"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "這項研究由一家獨立機構執行。", "e": "搭配：carry out（執行）。", "w": "carry off 奪走、成功做到；carry over 延續；carry away 使失控。"}, {"g": "t_p5chunk", "q": "Ms. Lee turned _______ the job offer because of the long commute.", "o": ["out", "off", "over", "down"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "因為通勤時間太長，李女士婉拒了這份工作。", "e": "搭配：turn down（拒絕）。", "w": "turn off 關掉；turn out 結果是；turn over 翻轉、移交。"}, {"g": "t_p5chunk", "q": "We need to set _______ a meeting with the client next week.", "o": ["up", "in", "out", "off"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們需要安排下週和客戶開會。", "e": "搭配：set up a meeting（安排會議）。", "w": "set off 出發；set out 開始著手；set in 開始（多指壞天氣）。"}, {"g": "t_p5chunk", "q": "The manager promised to look _______ the customer's complaint.", "o": ["into", "after", "out", "up"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "經理承諾會調查顧客的投訴。", "e": "搭配：look into（調查）。", "w": "look out 小心；look after 照顧；look up 查詢（單字、資料）。"}, {"g": "t_p5chunk", "q": "In _______ of quality, our products are the best on the market.", "o": ["spite", "terms", "sense", "case"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "就品質而言，我們的產品是市場上最好的。", "e": "搭配：in terms of（就…而言）。", "w": "in a sense 不接 of；in spite of 儘管；in case of 萬一，語意不合。"}, {"g": "t_p5chunk", "q": "I am writing with _______ to your recent inquiry.", "o": ["regarding", "relate", "regard", "concerning"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我寫信是為了回覆您最近的詢問。", "e": "搭配：with regard to（關於）。", "w": "relate 是動詞；concerning、regarding 本身就是介系詞，不加 with … to。"}, {"g": "t_p5chunk", "q": "The company succeeded _______ reducing its costs by 10 percent.", "o": ["at", "on", "to", "in"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "公司成功將成本降低了 10%。", "e": "搭配：succeed in ＋ V-ing（成功做到）。", "w": "at、to、on 不與 succeed 搭配。"}, {"g": "t_p5chunk", "q": "The new flexible schedule has resulted _______ higher employee satisfaction.", "o": ["in", "from", "to", "of"], "a": 0, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "新的彈性工時帶來更高的員工滿意度。", "e": "搭配：result in ＋ 結果（導致）；result from ＋ 原因（由…造成）。彈性工時是原因，滿意度是結果 → result in。", "w": "result from 方向相反；result of、result to 不是正確搭配。"}, {"g": "t_p5chunk", "q": "The equipment is inspected on a regular _______.", "o": ["base", "period", "term", "basis"], "a": 3, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "設備會定期檢查。", "e": "搭配：on a regular basis（定期地）。", "w": "base 是基地；period、term 不與 on a regular 搭配。"}, {"g": "t_p5chunk", "q": "Delivery is free of _______ for orders over $50.", "o": ["money", "charge", "pay", "price"], "a": 1, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "訂單超過 50 美元即可免運費。", "e": "搭配：free of charge（免費）。", "w": "price、pay、money 不與 free of 構成慣用說法。"}, {"g": "t_p5chunk", "q": "We are proud to _______ excellent service to all our clients.", "o": ["offered", "offering", "offer", "offers"], "a": 2, "h": "先確認句意，再檢查動詞的受詞和介系詞搭配；同一個字可能有多種合法句型，不能只因某個搭配較常見就排除其他合法答案。", "trans": "我們很自豪能為所有客戶提供卓越的服務。", "e": "搭配：be proud to ＋ 原形 V（很自豪能…）。", "w": "(A)(B)(D) 不能接在不定詞 to 後面。"}]}, {"id": "p5_vocab", "kind": "toeic", "part": 5, "stage": 3, "title": "單字語意題", "sub": "四個選項詞性相同 → 找句中的線索字判斷語意", "qs": [{"g": "t_p5vocab", "q": "The conference room is not _______ on Friday because it has been reserved for a client meeting.", "o": ["capable", "eligible", "available", "reliable"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "會議室週五無法使用，因為已被預約開客戶會議。", "e": "線索：because it has been reserved（已被預約）→ 不「可用的」→ available。", "w": "(A) capable 有能力的（主詞多為人）；(B) eligible 有資格的；(D) reliable 可靠的。"}, {"g": "t_p5vocab", "q": "Our delivery service is fast and _______, so customers can always count on it.", "o": ["eligible", "temporary", "available", "reliable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的配送服務快速又可靠，顧客隨時可以信賴。", "e": "線索：so customers can always count on it（可以依靠）→ reliable。", "w": "(C) 可用的；(A) 有資格的；(B) 暫時的，語意都不合 count on。"}, {"g": "t_p5vocab", "q": "Only employees who have worked here for at least one year are _______ for the bonus.", "o": ["eligible", "responsible", "reliable", "available"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "只有在此工作滿一年的員工才有資格領獎金。", "e": "線索：who have worked … at least one year（條件門檻）＋ for the bonus → eligible（有資格的）。", "w": "(C) 可靠的；(D) 可用的；(B) be responsible for 負責，語意不合「領獎金」。"}, {"g": "t_p5vocab", "q": "Due to the storm, the outdoor concert has been _______ until next weekend.", "o": ["canceled", "postponed", "attended", "expanded"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "因為暴風雨，戶外音樂會延到下週末舉行。", "e": "線索：until next weekend（到下週末）→ 延期 postponed。", "w": "(A) 取消後不會「到下週末」；(C) 參加；(D) 擴大。"}, {"g": "t_p5vocab", "q": "Please _______ your reservation by replying to this email within 24 hours.", "o": ["contain", "consist", "conduct", "confirm"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請在 24 小時內回覆此郵件確認您的預約。", "e": "線索：reservation ＋ by replying → confirm（確認）。", "w": "(C) 進行；(B) consist of 由…組成，不及物；(A) 包含。"}, {"g": "t_p5vocab", "q": "The new manager plans to _______ the hiring process to make it faster.", "o": ["complicate", "delay", "streamline", "prolong"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新經理計畫簡化招募流程，讓它更快速。", "e": "線索：to make it faster → 簡化、精簡 streamline。", "w": "(B)(D) 延長、延誤，語意相反；(A) 使複雜。"}, {"g": "t_p5vocab", "q": "The marketing campaign was very _______, increasing sales by 30 percent.", "o": ["exclusive", "effective", "expensive", "extensive"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這次行銷活動非常有效，讓銷售額增加了 30%。", "e": "線索：increasing sales by 30 percent（結果很好）→ effective（有效的）。", "w": "(C) 昂貴的；(D) 廣泛的；(A) 獨家的，都無法直接說明「增加銷售」。"}, {"g": "t_p5vocab", "q": "The hotel offers a _______ shuttle service to and from the airport at no extra cost.", "o": ["complimentary", "compulsory", "competitive", "complementary"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "飯店提供往返機場的免費接駁服務，不另收費。", "e": "線索：at no extra cost（不另收費）→ complimentary（免費贈送的）。", "w": "(D) complementary 互補的（形近陷阱）；(B) 強制的；(C) 有競爭力的。"}, {"g": "t_p5vocab", "q": "Attendance at the safety training is _______ for all factory workers; no one may skip it.", "o": ["occasional", "voluntary", "mandatory", "optional"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "所有工廠員工都必須參加安全訓練，任何人都不得缺席。", "e": "no one may skip it 明確指出不得缺席，因此選 mandatory（強制的）。", "w": "(B) voluntary、(D) optional 都表示可自行選擇，與不得缺席矛盾；(A) occasional 表偶爾的。"}, {"g": "t_p5vocab", "q": "The company plans to _______ its operations into three new countries next year.", "o": ["resign", "retire", "reduce", "expand"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "公司計畫明年將業務擴展到三個新國家。", "e": "線索：into three new countries → 擴展 expand。", "w": "(C) 縮減與 into new countries 矛盾；(A)(B) 辭職、退休，主詞是人。"}, {"g": "t_p5vocab", "q": "Ms. Torres was asked to _______ the new employees during their first week.", "o": ["invest", "supervise", "resign", "apply"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Torres 女士被要求在新進員工的第一週督導他們。", "e": "線索：受詞 the new employees ＋ during their first week → 督導 supervise。", "w": "(C) 辭職，不及物；(D) apply for；(A) invest in。"}, {"g": "t_p5vocab", "q": "The new software will _______ employees to work from any location.", "o": ["enable", "suggest", "inform", "prevent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新軟體將讓員工可以在任何地點工作。", "e": "線索：enable sb to V（使能夠）。語意正面：work from any location。", "w": "(D) prevent sb from V-ing，且語意相反；(B) suggest 不接 sb to V；(C) inform sb of。"}, {"g": "t_p5vocab", "q": "Customers can _______ their membership online at any time.", "o": ["repair", "refund", "renew", "refer"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "顧客可以隨時在網路上續訂會員。", "e": "線索：membership（會員資格）→ 續訂 renew。", "w": "(B) 退款；(A) 修理；(D) 提及，都不搭 membership。"}, {"g": "t_p5vocab", "q": "The factory's production has _______ significantly since new machines were installed.", "o": ["grown up", "lifted", "raised", "increased"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "自從安裝新機器以來，工廠產量大幅增加。", "e": "線索：空格後沒有受詞（significantly 是副詞）→ 需要不及物動詞 increased。", "w": "(A) grown up 表長大，不合產量；(C) raised 作「提高」須有受詞；(B) lifted 在此不是表達產量成長的自然選擇。lift 在其他意思中也能不及物，例如 The fog lifted。"}, {"g": "t_p5vocab", "q": "We apologize for the _______ caused by the temporary closure of the parking lot.", "o": ["inconvenience", "appreciation", "entertainment", "convenience"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "停車場暫時關閉造成不便，我們深表歉意。", "e": "線索：apologize for ＋ 負面事情 → inconvenience（不便）。", "w": "(D) 方便，語意相反；(C) 娛樂；(B) 感謝。"}, {"g": "t_p5vocab", "q": "The CEO will _______ the opening ceremony of the new factory.", "o": ["participate", "attend", "appear", "attendance"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "執行長將出席新工廠的開幕典禮。", "e": "線索：空格後直接接受詞 the opening ceremony → 及物動詞 attend。", "w": "(A) participate 表參與時須接 in；(C) appear 不直接接 the opening ceremony；(D) attendance 是名詞。attend 可直接接活動名稱。"}, {"g": "t_p5vocab", "q": "The two companies decided to _______ in order to compete with larger rivals.", "o": ["divide", "resign", "merge", "decline"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "兩家公司決定合併，以便與更大的對手競爭。", "e": "線索：two companies ＋ compete with larger rivals → 合併 merge。", "w": "(A) 分開，語意相反；(B) 辭職；(D) 下降、婉拒。"}, {"g": "t_p5vocab", "q": "All staff must _______ their identification badges at all times while in the building.", "o": ["wear", "put", "dress", "carry on"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "在大樓內所有員工都必須隨時配戴識別證。", "e": "線索：badge（證件）的搭配動詞 → wear（配戴）。", "w": "(C) dress 的受詞是人；(B) put 要搭 on；(D) carry on 是「繼續」。"}, {"g": "t_p5vocab", "q": "The project was completed ahead of schedule and _______ budget.", "o": ["across", "under", "down", "toward"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "專案提前完成，而且支出低於預算。", "e": "線索：固定說法 under budget（低於預算）／over budget（超出預算）。", "w": "(A) across、(C) down、(D) toward 均不能在此與 budget 搭配表達支出低於預算。under budget 表低於預算；below budget 也可有相同意思，因此不列為錯誤選項。"}, {"g": "t_p5vocab", "q": "Mr. Patel has an _______ knowledge of international tax law.", "o": ["expected", "exhausted", "expensive", "extensive"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Patel 先生對國際稅法有廣泛的知識。", "e": "線索：knowledge 搭配 extensive（廣泛的、豐富的）。", "w": "(C) 昂貴的；(A) 預期的；(B) 筋疲力盡的，都不形容知識。"}, {"g": "t_p5vocab", "q": "The store manager _______ that all products are displayed neatly.", "o": ["insurance", "reassures", "ensures", "assures"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "店長確保所有商品都陳列整齊。", "e": "線索：___ that ＋ 子句，語意「確保（某事發生）」→ ensure。", "w": "(A) insurance 是名詞；(B) reassures、(D) assures 在本句需要先接被安撫或被保證的人。ensure that… 表確保；美式 insure 也可有這個意思，因此不能拿來當唯一錯誤答案。"}, {"g": "t_p5vocab", "q": "The airline will _______ passengers for any lost luggage.", "o": ["compensate", "compete", "comply", "complain"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "航空公司會賠償旅客遺失的行李。", "e": "線索：compensate sb for sth（因某事賠償某人）。", "w": "(D) complain about；(B) compete with；(C) comply with，語意都不合。"}, {"g": "t_p5vocab", "q": "Before signing the agreement, please read the terms and _______ carefully.", "o": ["positions", "directions", "locations", "conditions"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "簽署協議前，請仔細閱讀條款與條件。", "e": "線索：固定搭配 terms and conditions（條款與細則）。", "w": "(A) 職位；(B) 方向、指示；(C) 地點。"}, {"g": "t_p5vocab", "q": "To collect opinions from 500 customers, the research team will _______ a survey next month.", "o": ["ignore", "conduct", "prohibit", "cancel"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "為了收集五百位顧客的意見，研究團隊將於下個月進行調查。", "e": "目的為收集五百位顧客的意見，需要進行調查，因此選 conduct。", "w": "(A) ignore 表忽略；(C) prohibit 表禁止；(D) cancel 表取消，均與本句收集意見的目的不符。perform a survey 或 make a survey 不能一概視為不合文法。"}, {"g": "t_p5vocab", "q": "Our sales representatives will _______ you with detailed information about the product.", "o": ["offer", "provide", "supply to", "give"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的業務代表會提供您產品的詳細資訊。", "e": "線索：___ ＋ 人 ＋ with ＋ 物 → provide sb with sth。", "w": "(A) offer、(D) give 在這裡用「動詞＋人＋物」，不加 with；(C) supply to you with information 的語序不成立。正確的 supply someone with something 其實也可使用，只是本題選項多了 to。"}, {"g": "t_p5vocab", "q": "The new branch will _______ about 50 new jobs in the area.", "o": ["create", "generate up", "discover", "invent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新分店將在當地創造約 50 個工作機會。", "e": "線索：create jobs（創造工作機會）。", "w": "(D) 發明；(C) 發現；(B) generate up 不是正確片語（generate 本身可用，但不加 up）。"}, {"g": "t_p5vocab", "q": "Due to high demand, the product is temporarily out of _______.", "o": ["service", "order", "stock", "date"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於需求量大，該產品暫時缺貨。", "e": "線索：due to high demand → out of stock（缺貨）。", "w": "(B) out of order 故障；(A) out of service 停止服務；(D) out of date 過時。"}, {"g": "t_p5vocab", "q": "The museum's new exhibit has _______ thousands of visitors since it opened.", "o": ["appeared", "arrived", "attended", "attracted"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "博物館的新展覽自開幕以來已吸引數千名遊客。", "e": "線索：主詞是展覽，受詞是 visitors → 吸引 attract。", "w": "(C) attend 主詞要是人；(A)(B) 不及物，不能接受詞。"}, {"g": "t_p5vocab", "q": "Ms. Kim was _______ to the position of regional director last month.", "o": ["applied", "appealed", "appointed", "approved"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "金女士上個月被任命為區域總監。", "e": "線索：be appointed to ＋ 職位（被任命）。", "w": "(A) apply for 應徵（主動）；(D) approve 批准（受詞多為事物）；(B) appeal 呼籲、上訴。"}, {"g": "t_p5vocab", "q": "Visitors are asked to _______ from using flash photography in the gallery.", "o": ["prohibit", "refrain", "prevent", "avoid"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請參觀者在展廳內避免使用閃光燈拍照。", "e": "線索：___ from ＋ V-ing，主詞是要克制自己的人 → refrain from。", "w": "(A)(C) prohibit／prevent sb from V-ing，中間要有受詞；(D) avoid 直接接 V-ing，不加 from。"}, {"g": "t_p5vocab", "q": "The hotel is _______ located in the city center, close to shops and restaurants.", "o": ["consequently", "conveniently", "considerably", "constantly"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "飯店位於市中心，交通便利，鄰近商店與餐廳。", "e": "線索：close to shops and restaurants（靠近商店餐廳）→ 位置「方便地」conveniently located。", "w": "(A) 因此；(C) 相當地；(D) 不斷地，都不修飾 located 的位置。"}, {"g": "t_p5vocab", "q": "Please _______ the attached invoice and let us know if you have any questions.", "o": ["review", "remind", "remove", "reply"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "請查看附上的發票，如有任何問題請告訴我們。", "e": "線索：attached invoice ＋ if you have any questions → 先「查看」review。", "w": "(B) remind 的受詞是人；(C) 移除，語意不合；(D) reply 不及物，要加 to。"}, {"g": "t_p5vocab", "q": "Due to rising fuel costs, the airline will _______ its ticket prices.", "o": ["delay", "prevent", "decrease", "increase"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於燃料成本上升，航空公司將調漲票價。", "e": "線索：Due to rising fuel costs（成本上升）→ 票價「提高」increase。", "w": "(C) 降低，與成本上升矛盾；(B) 防止；(A) 延遲，都不合邏輯。"}, {"g": "t_p5vocab", "q": "The museum is _______ to the public free of charge on Sundays.", "o": ["closed", "known", "open", "hidden"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "博物館週日免費對外開放。", "e": "線索：free of charge（免費）＋ to the public → open to the public（對外開放）。", "w": "(A) 關閉時不會說免費；(D) 隱藏的；(B) known to 表為…所知，語意不合。"}, {"g": "t_p5vocab", "q": "Our _______ goal is to provide excellent service to every customer.", "o": ["former", "previous", "temporary", "primary"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們的首要目標是為每位顧客提供卓越服務。", "e": "線索：goal ＋ 現在式的承諾 → 主要的 primary。", "w": "(A)(B) 先前的、前任的，與現在式 is 不合；(C) 暫時的，不適合形容核心目標。"}, {"g": "t_p5vocab", "q": "The company had to _______ 50 workers because of declining sales.", "o": ["set up", "lay off", "bring in", "take on"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "因為銷售下滑，公司不得不裁員 50 人。", "e": "線索：because of declining sales（銷售下滑）→ 裁員 lay off。", "w": "(C)(D) 招募、引進，與銷售下滑矛盾；(A) 設立，受詞不會是員工。"}, {"g": "t_p5vocab", "q": "Mr. Shaw will _______ the sales team while the manager is on vacation.", "o": ["overlook", "overcome", "oversee", "overhear"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "經理休假期間，Shaw 先生將監督業務團隊。", "e": "線索：while the manager is on vacation → 代為「監督」oversee。", "w": "(A) overlook 忽略、俯瞰；(B) 克服；(D) 無意中聽到。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The report _______ that sales will rise by 5 percent next year.", "o": ["predicts", "prepares", "prevents", "protects"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "報告預測明年銷售將成長 5%。", "e": "線索：that ＋ will rise next year（未來）→ 預測 predicts。", "w": "(C) 防止；(B) 準備；(D) 保護，都不接 that 子句表未來。"}, {"g": "t_p5vocab", "q": "The seminar provides a great _______ to network with industry leaders.", "o": ["operation", "occupation", "opportunity", "obligation"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這場研討會提供了與業界領袖交流的好機會。", "e": "線索：a great ___ to network（建立人脈）→ 機會 opportunity。", "w": "(B) 職業；(D) 義務；(A) 運作、手術，與 great … to network 不合。"}, {"g": "t_p5vocab", "q": "The office printer is out of _______; please use the one on the second floor.", "o": ["order", "reach", "date", "stock"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "辦公室印表機故障了，請使用二樓那台。", "e": "線索：please use the one on the second floor（改用別台）→ out of order（故障）。", "w": "(D) 缺貨；(C) 過時；(B) 搆不到，都不符合「改用別台」。"}, {"g": "t_p5vocab", "q": "Applicants must have at least three years of _______ experience in sales.", "o": ["relative", "relevant", "reluctant", "remote"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "應徵者必須具備至少三年的相關業務經驗。", "e": "線索：experience in sales → 相關的 relevant experience。", "w": "(A) 相對的；(C) 不情願的；(D) 遙遠的。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The CEO _______ the employees for their hard work during the busy season.", "o": ["approved", "complained", "apologized", "thanked"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "執行長感謝員工在旺季的辛勞。", "e": "線索：for their hard work（正面）＋ 受詞是人 → thank sb for sth。", "w": "(B)(C) 不及物，要加 to／about；(A) approve 的受詞多為事物（計畫、預算）。"}, {"g": "t_p5vocab", "q": "The flight was _______ due to heavy fog, so passengers had to stay overnight.", "o": ["booked", "boarded", "canceled", "landed"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "班機因濃霧取消，旅客只好留宿一晚。", "e": "線索：due to heavy fog ＋ had to stay overnight → 取消 canceled。", "w": "(B) 登機；(D) 降落；(A) 預訂，都不會導致必須過夜。"}, {"g": "t_p5vocab", "q": "To _______ for a refund, customers must present the original receipt.", "o": ["qualify", "quantify", "quality", "qualification"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "顧客必須出示原始收據才符合退款資格。", "e": "線索：To ＋ 原形 V ＋ for a refund → qualify for（符合…資格）。", "w": "(B) 量化，形近字；(C)(D) 名詞，不能接在 to 後當動詞。"}, {"g": "t_p5vocab", "q": "The new branch has been very _______, earning a profit in its first year.", "o": ["possible", "portable", "probable", "profitable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新分店非常賺錢，第一年就獲利。", "e": "線索：earning a profit → 有獲利的 profitable。", "w": "(B) 可攜帶的；(C) 很可能的；(A) 可能的。形近字陷阱。"}, {"g": "t_p5vocab", "q": "To save money, the manager asked us to _______ our expenses by 10 percent.", "o": ["raise", "cut", "spend", "earn"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "為了省錢，經理要求我們把開支削減 10%。", "e": "線索：To save money → 削減開支 cut。", "w": "(A) 提高，與省錢矛盾；(C) 花費；(D) 賺取，受詞不會是 expenses。"}, {"g": "t_p5vocab", "q": "The store will be closed _______ for renovations and will reopen next month.", "o": ["permanently", "previously", "temporarily", "frequently"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "商店將暫時停業整修，下個月重新開幕。", "e": "線索：will reopen next month → 暫時地 temporarily。", "w": "(A) 永久地，與重新開幕矛盾；(D) 頻繁地；(B) 先前地。"}, {"g": "t_p5vocab", "q": "Ms. Lopez was _______ for her outstanding contribution to the project.", "o": ["reminded", "recognized", "replaced", "required"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Lopez 女士因對專案的傑出貢獻而獲得表揚。", "e": "線索：for her outstanding contribution（正面）→ 表揚、肯定 recognized。", "w": "(C) 被取代；(D) 被要求；(A) 被提醒，與傑出貢獻不合。"}, {"g": "t_p5vocab", "q": "Customers who are not satisfied may _______ the product within 30 days for a full refund.", "o": ["remain", "repair", "replace", "return"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "不滿意的顧客可在 30 天內退貨並獲得全額退款。", "e": "線索：for a full refund（全額退款）→ 退回 return。", "w": "(B) 修理；(C) 更換不會拿到退款；(A) 不及物。"}, {"g": "t_p5vocab", "q": "The new policy aims to _______ waste and save energy.", "o": ["reduce", "induce", "produce", "introduce"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新政策旨在減少浪費並節約能源。", "e": "線索：and save energy（環保方向）→ 減少浪費 reduce。", "w": "(C) 製造；(B) 引起；(D) 引進。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The job requires _______ travel to Asia and Europe.", "o": ["frequent", "frequency", "rare", "fluent"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這份工作需要經常前往亞洲和歐洲出差。", "e": "線索：requires ＋ ___ ＋ travel → 形容詞「經常的」frequent。", "w": "(C) 「很少的」與 requires 語意不合；(B) 名詞；(D) 流利的，只形容語言。"}, {"g": "t_p5vocab", "q": "The company is _______ for new ways to attract younger customers.", "o": ["seeking", "finding", "searching", "discovering"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "公司正在尋找吸引年輕顧客的新方法。", "e": "線索：空格後是 for → search for（尋找）。", "w": "find、seek、discover 都是及物動詞，直接接受詞，不加 for。"}, {"g": "t_p5vocab", "q": "All employees must _______ the building immediately when the fire alarm sounds.", "o": ["elevate", "evacuate", "eliminate", "evaluate"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "火警警報響起時，所有員工必須立即撤離大樓。", "e": "線索：when the fire alarm sounds → 撤離 evacuate。", "w": "(D) 評估；(C) 消除；(A) 提升。形近字陷阱。"}, {"g": "t_p5vocab", "q": "The conference will _______ experts from more than 20 countries.", "o": ["refer", "consist", "belong", "feature"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "這場會議將邀請來自 20 多國的專家。", "e": "線索：空格後直接接受詞 experts → 及物動詞 feature（以…為特色、邀請演出）。", "w": "(A) refer to；(C) belong to；(B) consist of，都不能直接接受詞。"}, {"g": "t_p5vocab", "q": "Due to a technical problem, the website will be _______ for two hours tonight.", "o": ["unavailable", "unemployed", "unbelievable", "uncertain"], "a": 0, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "由於技術問題，網站今晚將暫停服務兩小時。", "e": "線索：Due to a technical problem ＋ for two hours → 無法使用 unavailable。", "w": "(C) 難以置信的；(B) 失業的（形容人）；(D) 不確定的。"}, {"g": "t_p5vocab", "q": "The supervisor gave _______ instructions so that everyone understood the task.", "o": ["close", "clear", "clever", "clean"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "主管給了清楚的指示，讓每個人都了解任務。", "e": "線索：so that everyone understood → 清楚的 clear。", "w": "(D) 乾淨的；(A) 接近的；(C) 聰明的。形近字陷阱。"}, {"g": "t_p5vocab", "q": "We are pleased to _______ you that your application has been approved.", "o": ["explain", "say", "inform", "announce"], "a": 2, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "我們很高興通知您，您的申請已獲核准。", "e": "線索：___ ＋ 人（you）＋ that 子句 → inform sb that。", "w": "announce、explain、say 都不能直接接「人」再接 that（要用 announce／explain／say to sb）。"}, {"g": "t_p5vocab", "q": "The new shopping mall is expected to _______ thousands of shoppers each weekend.", "o": ["deliver", "direct", "drawn", "draw"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "新購物中心預計每個週末會吸引數千名購物者。", "e": "線索：受詞是 shoppers → 吸引 draw（＝attract）。", "w": "(C) p.p.，不能接在 to 後；(B) 指引；(A) 遞送，語意不合。"}, {"g": "t_p5vocab", "q": "The meeting has been _______ from Monday to Wednesday.", "o": ["improved", "moved", "proved", "removed"], "a": 1, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "會議已從週一改到週三。", "e": "線索：from Monday to Wednesday → 改期 moved。", "w": "(D) 移除；(C) 證明；(A) 改善。形近字陷阱。"}, {"g": "t_p5vocab", "q": "Ms. Grant is a _______ employee who always finishes her work on time.", "o": ["dependent", "depending", "dependence", "dependable"], "a": 3, "h": "四個選項詞性相同 → 找句中的「線索字」（because／so／until／at no cost…）決定語意。", "trans": "Grant 女士是一位可靠的員工，總是準時完成工作。", "e": "線索：always finishes her work on time → 可靠的 dependable。", "w": "(A) dependent 是「依賴別人的」，語意相反；(B) V-ing；(C) 名詞。"}]}, {"id": "p5_qty", "kind": "toeic", "part": 5, "stage": 4, "title": "數量詞與可數／不可數", "sub": "many／few／fewer＋可數；much／little／less＋不可數；information、equipment、advice 不可數", "qs": [{"g": "t_p5qty", "q": "There is _______ information available about the new tax regulations.", "o": ["many", "few", "little", "a few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "關於新稅法的資訊很少。", "e": "訊號：information 是不可數名詞，且動詞用 is → 只能用修飾不可數的 little（幾乎沒有）。", "w": "(A)(B)(D) few／a few／many 都只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "The store sold _______ laptops this month than it did last month.", "o": ["much", "fewer", "less", "little"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "這家店本月賣出的筆電比上個月少。", "e": "訊號：laptops 是可數複數，後面有 than → 可數名詞的比較級用 fewer。", "w": "(C) less 用於不可數名詞；(A)(D) 修飾不可數，且不是比較級。"}, {"g": "t_p5qty", "q": "Our office needs _______ new equipment to handle the increased workload.", "o": ["a few", "several", "many", "some"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "我們辦公室需要一些新設備來應付增加的工作量。", "e": "訊號：equipment 是不可數名詞（不能加 s）→ some 可修飾不可數名詞。", "w": "(A)(B)(C) several／many／a few 只修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Only a _______ seats are still available for tonight's performance.", "o": ["few", "much", "less", "little"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "今晚的演出只剩下少數幾個座位。", "e": "訊號：seats 是可數複數，動詞 are → a few（還有一些）。only a few 是常見組合。", "w": "(B)(C)(D) 只能修飾不可數名詞。"}, {"g": "t_p5qty", "q": "How _______ time will it take to install the new software?", "o": ["much", "few", "many", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "安裝新軟體需要多少時間？", "e": "訊號：time 表「時間」時是不可數 → how much。", "w": "(B)(C)(D) 修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "_______ of the applicants had previous experience in sales.", "o": ["Much", "Little", "Every", "Many"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "許多應徵者過去有業務經驗。", "e": "訊號：of the applicants（可數複數）→ many of。", "w": "(A)(B) 用於不可數；(C) every 不能接 of，只能接單數名詞（every applicant）。"}, {"g": "t_p5qty", "q": "The manager gave us _______ advice on how to improve our presentation.", "o": ["several", "many", "some", "a few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "經理給了我們一些改善簡報的建議。", "e": "訊號：advice 是不可數名詞（沒有 advices）→ some。", "w": "(A)(B)(D) 只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Because of the holiday, there were _______ customers in the store than usual.", "o": ["little", "fewer", "less", "much"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "因為放假，店裡的顧客比平常少。", "e": "訊號：customers 可數複數＋than → fewer。", "w": "(C) less 修飾不可數；(A)(D) 不是比較級且用於不可數。"}, {"g": "t_p5qty", "q": "The new printer uses _______ energy than the old model.", "o": ["many", "fewer", "less", "few"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "新印表機比舊機型更省電。", "e": "訊號：energy 是不可數＋than → less。", "w": "(B) fewer 用於可數複數；(A)(D) 不是比較級。"}, {"g": "t_p5qty", "q": "_______ furniture in the lobby will be replaced next week.", "o": ["Several", "Many", "Each", "All"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "大廳所有家具將於下週更換。", "e": "訊號：furniture 是不可數名詞 → all 可修飾不可數（all furniture）。", "w": "(A)(B) 只修飾可數複數；(C) each 只接可數單數。"}, {"g": "t_p5qty", "q": "A large _______ of money was spent on the advertising campaign.", "o": ["few", "amount", "many", "number"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "這次廣告活動花了一大筆錢。", "e": "訊號：money 不可數 → a large amount of。", "w": "(D) a number of 接可數複數；(A)(C) 不能放在 a large ＿ of 中。"}, {"g": "t_p5qty", "q": "A large _______ of employees signed up for the training program.", "o": ["number", "much", "amount", "deal"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "大量員工報名參加了訓練課程。", "e": "訊號：employees 可數複數 → a large number of。", "w": "(C)(D) amount of／a great deal of 接不可數；(B) much 不能這樣用。"}, {"g": "t_p5qty", "q": "There is still _______ room for improvement in our customer service.", "o": ["several", "much", "a few", "many"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "我們的客服仍有很大的改進空間。", "e": "訊號：room 表「空間、餘地」時是不可數 → much room for improvement。", "w": "(A)(C)(D) 只能修飾可數複數名詞。"}, {"g": "t_p5qty", "q": "Ms. Brooks has _______ experience in project management, so she needs some training.", "o": ["many", "a few", "few", "little"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "Brooks 女士幾乎沒有專案管理經驗，所以需要一些訓練。", "e": "訊號：experience 表「經驗（累積）」時是不可數；後面 so she needs training 表負面 → little（幾乎沒有）。", "w": "(A) many、(B) a few、(C) few 修飾可數複數，不能直接修飾表示累積經驗的 experience。本題 little 表經驗很少；a little 並非永遠與需要訓練矛盾。"}, {"g": "t_p5qty", "q": "We received _______ feedback from customers after the product launch.", "o": ["a lot of", "many", "a few", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "產品上市後，我們收到大量顧客回饋。", "e": "訊號：feedback 是不可數名詞 → a lot of（可數與不可數都能用）。", "w": "(B)(C)(D) 只修飾可數複數。"}, {"g": "t_p5qty", "q": "The company hired _______ new staff members last quarter.", "o": ["little", "much", "several", "a little"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "公司上一季聘用了幾位新員工。", "e": "訊號：staff members 是可數複數 → several。", "w": "(A)(B)(D) 只修飾不可數名詞。"}, {"g": "t_p5qty", "q": "Please pack your luggage carefully; _______ baggage over 23 kilograms will be charged extra.", "o": ["any", "many", "few", "several"], "a": 0, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "請謹慎打包；任何超過 23 公斤的行李都會額外收費。", "e": "訊號：baggage 是不可數名詞 → any 可修飾不可數（any baggage）。", "w": "(B)(C)(D) 只能修飾可數複數。"}, {"g": "t_p5qty", "q": "Very _______ people attended the seminar because of the heavy snow.", "o": ["much", "less", "few", "little"], "a": 2, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "因為大雪，參加研討會的人很少。", "e": "訊號：people 是可數複數＋負面語意（because of heavy snow）→ few（很少、幾乎沒有）。", "w": "(A)(B)(D) 用於不可數名詞。"}, {"g": "t_p5qty", "q": "The research team collected a great _______ of information during the study.", "o": ["many", "number", "few", "deal"], "a": 3, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "研究團隊在研究期間收集了大量資訊。", "e": "information 是不可數名詞，搭配 a great deal of，選 deal。data 在不同語域可視為複數或不可數，不宜用來設定本題唯一答案。", "w": "(B) a great number of 接可數複數；(A)(C) 不能構成本句 a great ___ of information。"}, {"g": "t_p5qty", "q": "_______ of the information in the old report is outdated.", "o": ["Few", "Much", "Many", "Several"], "a": 1, "h": "先判斷後面的名詞：可數複數？不可數？有沒有 than？", "trans": "舊報告中的許多資訊都已經過時。", "e": "訊號：of the information（不可數）＋單數動詞 is → Much of。", "w": "(A)(C)(D) 只能用於可數複數，動詞也要用 are。"}]}, {"id": "p5_det", "kind": "toeic", "part": 5, "stage": 4, "title": "冠詞與限定詞", "sub": "each／every＋單數；all 可接複數或不可數；a／an 看發音", "qs": [{"g": "t_p5det", "q": "_______ applicant must submit a résumé and two letters of reference.", "o": ["Both", "All", "Many", "Each"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "每位應徵者都必須繳交履歷和兩封推薦信。", "e": "訊號：applicant 是單數名詞，動詞 must submit → 選接單數可數名詞的 Each。", "w": "(B)(C) all／many 要接複數 applicants；(A) both 接兩個的複數名詞。"}, {"g": "t_p5det", "q": "_______ employees are required to attend the safety training.", "o": ["Either", "All", "Every", "Each"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "所有員工都必須參加安全訓練。", "e": "訊號：employees 是複數，動詞 are → All（接複數）。", "w": "(A)(C)(D) every／each／either 都接單數名詞。"}, {"g": "t_p5det", "q": "You may choose _______ option, as both offer the same benefits.", "o": ["all", "both", "either", "neither of"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "兩個方案你可以任選一個，因為兩者福利相同。", "e": "訊號：option 是單數，語意是「兩者任一」→ either ＋ 單數名詞。", "w": "(A) all、(B) both 在本題不能直接限定單數可數名詞 option；(D) neither of 須接如 the two options 的限定複數名詞片語。all 也可限定不可數名詞，例如 all information。"}, {"g": "t_p5det", "q": "_______ of the two candidates had the required certification, so the position remains open.", "o": ["Neither", "Both", "Either", "Every"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "兩位候選人都沒有必要的證照，所以職缺仍懸而未決。", "e": "訊號：two candidates（兩者）＋後半句 position remains open 表示否定 → Neither of（兩者皆不）。", "w": "(B) Both 表兩者都有，與職缺仍懸空的結果不符；(C) Either 表任一，不表兩者皆無；(D) Every 不能直接接 of the two candidates。Neither 明確表示兩者皆不。"}, {"g": "t_p5det", "q": "Mr. Wu has worked as _______ engineer at the company for ten years.", "o": ["an", "many", "any", "a"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "吳先生在這家公司擔任工程師已經十年。", "e": "訊號：單數可數名詞前要有冠詞；engineer 開頭是母音音素 /ɛ/ → an。", "w": "(D) a 不能放在以母音音素開頭的 engineer 前；(B) many 須接複數 engineers；(C) any 不合本句介紹職業的語意。"}, {"g": "t_p5det", "q": "The company plans to open _______ new branch in Kaohsiung next year.", "o": ["an", "a", "much", "many"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "公司計畫明年在高雄開一間新分店。", "e": "訊號：第一次提到、單數可數 → 不定冠詞；new 開頭是子音 /n/ → a。", "w": "(A) an 不用於子音音素 /n/ 前；(C) much 修飾不可數名詞；(D) many 須接複數 branches。"}, {"g": "t_p5det", "q": "All participants will receive _______ certificate upon completion of the course.", "o": ["few", "an", "much", "a"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "所有學員完成課程後都會獲得一張證書。", "e": "訊號：certificate 是單數可數名詞，第一次提到，開頭是子音 /s/ → a。", "w": "(B) an 用於母音音素；(A)(C) 不修飾單數可數名詞。"}, {"g": "t_p5det", "q": "Ms. Park will be out of the office for _______ hour this afternoon.", "o": ["one of", "a", "an", "many"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "朴女士今天下午會離開辦公室一個小時。", "e": "訊號：hour 的 h 不發音，開頭是母音音素 /aʊ/ → an hour。", "w": "(B) a 不用於 hour 的母音音素前；(D) many 須接複數 hours；(A) one of 須搭配限定的複數名詞片語。"}, {"g": "t_p5det", "q": "_______ manager in the company received a copy of the new policy.", "o": ["Several", "Many", "Every", "All"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "公司每位經理都收到了一份新政策。", "e": "訊號：manager 是單數 → Every（接單數可數名詞）。", "w": "(A)(B)(D) 都要接複數 managers。"}, {"g": "t_p5det", "q": "_______ the director nor her assistant was available to answer questions.", "o": ["Both", "Either", "Not only", "Neither"], "a": 3, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "主任和她的助理都無法回答問題。", "e": "訊號：後面有 nor → 固定搭配 neither A nor B。", "w": "(B) either 配 or；(A) both 配 and；(C) not only 配 but also。"}, {"g": "t_p5det", "q": "Please return _______ keys to the front desk when you check out.", "o": ["the", "a", "every", "an"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "退房時請將鑰匙歸還櫃台。", "e": "訊號：keys 是複數，且指「你拿到的那些特定鑰匙」→ the。", "w": "(B)(D) a／an 不接複數；(C) every 接單數名詞。"}, {"g": "t_p5det", "q": "Each of the rooms _______ equipped with a projector and a whiteboard.", "o": ["being", "is", "be", "are"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "每個房間都配有一台投影機和一塊白板。", "e": "訊號：Each of ＋ 複數名詞，主詞是 Each（單數）→ 動詞用單數 is。", "w": "(D) 被 rooms 誤導；(A)(C) 不是真動詞的正確形式。"}, {"g": "t_p5det", "q": "Visitors can park on _______ side of the street after 6 P.M.", "o": ["all", "many", "either", "both"], "a": 2, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "晚上六點後，訪客可以停在街道的任一側。", "e": "訊號：side 是單數 → either ＋ 單數（兩邊任一側）。", "w": "(D) both 要接 sides；(A)(B) all／many 要接複數。"}, {"g": "t_p5det", "q": "The hotel offers _______ free breakfast to all guests staying more than two nights.", "o": ["few", "a", "an", "many"], "a": 1, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "飯店為住宿超過兩晚的房客提供免費早餐。", "e": "breakfast 在這裡指一份提供給房客的早餐，採可數用法；free 以子音音素開頭，選 a。free breakfast 也可採零冠詞，不能說有形容詞就一定要加 a。", "w": "(C) an 用於母音音素；(A)(D) 要接可數複數。"}, {"g": "t_p5det", "q": "_______ information on the website is updated every week.", "o": ["The", "Every", "A", "An"], "a": 0, "h": "看後面名詞的單複數，以及有沒有 or／nor／and 搭配。", "trans": "網站上的資訊每週更新。", "e": "訊號：information 是不可數，不能用 a／an／every；後面有 on the website 特定範圍 → The。", "w": "(C)(D) 不可數名詞不能用不定冠詞；(B) every 接可數單數。"}]}, {"id": "p5_indef", "kind": "toeic", "part": 5, "stage": 4, "title": "不定代名詞", "sub": "兩者：one…the other；不特定：another／others；確定範圍剩下全部：the others", "qs": [{"g": "t_p5indef", "q": "Some employees work remotely; _______ work on-site.", "o": ["another", "other", "others", "the other"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "有些員工遠端工作；其他人則在公司上班。", "e": "訊號：Some … ; ___ work → 空格自己當主詞（後面沒有名詞），且動詞 work 是複數 → others（＝other employees，不特定的其他人）。", "w": "(A) another 是單數；(B) other 是形容詞，後面要接名詞；(D) the other 指兩者中的另一個（單數）。"}, {"g": "t_p5indef", "q": "This printer is out of order. Could you bring me _______ one?", "o": ["other", "another", "others", "the others"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "這台印表機故障了，可以幫我拿另一台嗎？", "e": "訊號：one 是單數，表示「再一個、另一個（不特定）」→ another。", "w": "(A) other 接單數可數名詞前通常要加 the 或 any；(C)(D) 是複數代名詞，後面不接 one。"}, {"g": "t_p5indef", "q": "Of the two proposals, one was accepted and _______ was rejected.", "o": ["the other", "others", "other", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "兩份提案中，一份被接受，另一份被拒絕。", "e": "訊號：two（兩者）→ one … the other。", "w": "(B) others 是複數；(C) 裸用 other 不能作本題單數主詞；(D) another 表額外或不特定的另一個，不能明確指本題兩份提案中剩下的那一份。"}, {"g": "t_p5indef", "q": "Three candidates were interviewed. One was hired, and _______ were placed on a waiting list.", "o": ["another", "other", "the other", "the others"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "面試了三位候選人，一位被錄用，其餘的列入候補名單。", "e": "訊號：範圍確定（三人），扣掉一人後「剩下的全部」，動詞 were 是複數 → the others。", "w": "(C) the other 是單數；(A) another 單數；(B) other 是形容詞，要接名詞。"}, {"g": "t_p5indef", "q": "If this jacket does not fit, we can exchange it for a larger _______.", "o": ["it", "other", "one", "ones"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "如果這件外套不合身，我們可以幫您換一件大一點的。", "e": "one 代替前文的單數可數名詞 jacket；a larger one 表「一件較大的外套」。", "w": "(D) ones 是複數，不能接在 a 後面；(B) other 不能當名詞接在 a larger 後；(A) it 指同一個東西，不能被形容詞修飾。"}, {"g": "t_p5indef", "q": "The old chairs will be replaced with new _______.", "o": ["other", "ones", "another", "one"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "舊椅子將換成新的。", "e": "訊號：代替複數名詞 chairs，前面有形容詞 new → ones。", "w": "(D) one 代替單數；(A)(C) 不能被 new 修飾當名詞。"}, {"g": "t_p5indef", "q": "Ms. Chang is meeting with clients today; _______ team members are working on the report.", "o": ["other", "others", "the others", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "張女士今天與客戶會面；其他團隊成員正在撰寫報告。", "e": "訊號：空格後面接名詞 team members（複數）→ 形容詞 other。", "w": "(D) another 接單數名詞；(B)(C) others／the others 是代名詞，後面不能再接名詞。"}, {"g": "t_p5indef", "q": "The training will continue for _______ two weeks.", "o": ["others", "the others", "other", "another"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "訓練將再持續兩週。", "e": "訊號：another ＋ 數字 ＋ 複數名詞 ＝「再…」（another two weeks 視為一段時間整體）。", "w": "(C) other two weeks 不是慣用說法；(A)(B) 是代名詞，後面不能接名詞。"}, {"g": "t_p5indef", "q": "Please be considerate of all _______ who share the kitchen with you.", "o": ["others", "the other", "other", "another"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "請體諒所有與您共用廚房的人。", "e": "all ___ who share… 指所有共用廚房的其他人，空格需要複數代名詞 others。", "w": "(B) the other、(D) another 是單數形式，不能構成本題 all ___ who share 的複數結構；(C) other 後面缺少名詞。"}, {"g": "t_p5indef", "q": "The two departments help each _______ during busy periods.", "o": ["others", "another", "other", "one"], "a": 2, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "兩個部門在忙碌時期會互相幫忙。", "e": "訊號：固定搭配 each other（互相）。", "w": "(D) each one 不表「互相」；(B) one another 才對，each another 錯；(A) each others 不存在。"}, {"g": "t_p5indef", "q": "We have two offices: one is in Taipei, and _______ is in Hsinchu.", "o": ["other", "another", "others", "the other"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "我們有兩間辦公室，一間在台北，另一間在新竹。", "e": "訊號：two → one … the other。", "w": "(B) another 暗示還有更多；(A) other 不能單獨當主詞；(C) others 是複數。"}, {"g": "t_p5indef", "q": "Some customers prefer to pay in cash, while _______ prefer credit cards.", "o": ["another", "others", "the other", "other"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "有些顧客偏好付現，另一些則偏好刷卡。", "e": "訊號：Some … while ___ prefer（複數動詞、後無名詞）→ others。", "w": "(A)(C) 是單數；(D) other 後面要接名詞。"}, {"g": "t_p5indef", "q": "If you have questions about the policy or any _______ matter, please contact HR.", "o": ["other", "the others", "another", "others"], "a": 0, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "如果對政策或其他任何事項有疑問，請聯絡人資部。", "e": "訊號：any ＋ ___ ＋ 名詞 matter → 形容詞 other（any other ＋ 單數名詞 ＝ 其他任何…）。", "w": "(B)(D) 代名詞後不能接名詞；(C) any another 不合文法。"}, {"g": "t_p5indef", "q": "These brochures are outdated. Please order some new _______.", "o": ["one", "ones", "it", "them"], "a": 1, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "這些手冊過時了，請訂一些新的。", "e": "訊號：代替複數 brochures，前面有 some new → ones。", "w": "(A) one 是單數，不能接在 some 後；(C)(D) it／them 不能被形容詞修飾。"}, {"g": "t_p5indef", "q": "Only one of the five printers is working; _______ need to be repaired.", "o": ["the other", "another", "other", "the others"], "a": 3, "h": "空格後面有沒有名詞？是單數還是複數？範圍是兩個還是確定的一群？", "trans": "五台印表機中只有一台正常；其餘的都需要維修。", "e": "訊號：確定範圍（五台）中「剩下的全部」＋複數動詞 need → the others。", "w": "(A)(B) 單數；(C) other 後要接名詞。"}]}, {"id": "p5_noun", "kind": "toeic", "part": 5, "stage": 4, "title": "人物名詞 vs 事物名詞", "sub": "applicant 人／application 事；attendee 人／attendance 事", "qs": [{"g": "t_p5noun", "q": "All _______ must bring a valid photo ID to the exam.", "o": ["applying", "applications", "applicants", "applied"], "a": 2, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "所有應考者都必須攜帶有效的附照片證件。", "e": "訊號：主詞要能「攜帶證件」→ 人。applicant（應徵者、申請人）是人；application 是「申請書」。", "w": "(B) 物，不會帶證件；(A)(D) 不是名詞主詞。"}, {"g": "t_p5noun", "q": "The number of _______ at this year's conference exceeded 2,000.", "o": ["attendees", "attends", "attendance", "attending"], "a": 0, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "今年會議的出席者超過 2,000 人。", "e": "訊號：the number of ＋ 可數複數名詞 → attendees（出席者，人，可數）。", "w": "(C) attendance（出席人數／出席率）是不可數，不搭 the number of；(B)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "Please complete your _______ online and send it to the human resources department by Friday.", "o": ["applicable", "application", "applicant", "apply"], "a": 1, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "請在線上填妥申請書，並在週五前寄給人資部。", "e": "complete…online and send it 表示填妥並寄出文件，選 application。", "w": "(C) applicant 是申請人，不是本句可填寫的表單；(A) applicable 是形容詞；(D) apply 是動詞。send 本身也能接人作受詞，不能只靠「人不能被寄送」排除。"}, {"g": "t_p5noun", "q": "Ms. Wang was promoted to _______ of the accounting team.", "o": ["supervisory", "supervision", "supervise", "supervisor"], "a": 3, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "王女士被升為會計團隊的主管。", "e": "訊號：be promoted to ＋ 職位（人）→ supervisor。", "w": "(B) supervision 是「監督」（事）；(C) 動詞；(A) 形容詞。"}, {"g": "t_p5noun", "q": "The new software requires close _______ during its first month of use.", "o": ["supervisor", "supervise", "supervision", "supervisors"], "a": 2, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "新軟體在使用的第一個月需要密切監督。", "e": "訊號：close ＋ 名詞，語意是「密切的監督」（行為、事）→ supervision。", "w": "(A)(D) 人，語意不合；(B) 動詞。"}, {"g": "t_p5noun", "q": "Our company has a strict policy regarding the _______ of client data.", "o": ["protector", "protect", "protective", "protection"], "a": 3, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "我們公司對客戶資料的保護有嚴格政策。", "e": "訊號：the ＋ 名詞 ＋ of client data，語意是「保護（行為）」→ protection。", "w": "(A) protector 是保護者（人或器具），語意不合；(C) 形容詞；(B) 動詞。"}, {"g": "t_p5noun", "q": "Each _______ will receive a welcome package on the first day.", "o": ["participant", "participation", "participatory", "participate"], "a": 0, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "每位參加者在第一天都會收到一份歡迎禮包。", "e": "訊號：Each ＋ 單數可數名詞，且能「收到禮包」→ 人 participant。", "w": "(B) participation 是「參與」（事，不可數）；(D) 動詞；(C) 形容詞。"}, {"g": "t_p5noun", "q": "Thank you for your _______ in the customer survey.", "o": ["participant", "participation", "participate", "participated"], "a": 1, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "感謝您參與顧客調查。", "e": "訊號：your ＋ 名詞 ＋ in，語意是「參與這件事」→ participation。", "w": "(A) participant 是人，thank you for your participant 語意不通；(C)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "Mr. Silva is a leading _______ in renewable energy.", "o": ["consulting", "consultation", "consultant", "consult"], "a": 2, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "Silva 先生是再生能源領域頂尖的顧問。", "e": "訊號：主詞 Mr. Silva 是人 → a leading ＋ 人 → consultant。", "w": "(B) consultation 是「諮詢」（事）；(D) 動詞；(A) consulting 作名詞是「顧問業」，不能指人。"}, {"g": "t_p5noun", "q": "Annual _______ at the museum is now 15 percent higher than it was before the renovation.", "o": ["attendants", "attendance", "attendees", "attending"], "a": 1, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "博物館目前每年的參觀人次比整修前高出 15%。", "e": "attendance 在此表示參觀人次，採不可數用法，與單數動詞 is 配合；15 percent higher 比較的是總人次。", "w": "(A) attendants、(C) attendees 是可數複數，與 is 不一致；(D) attending 不能在此與 Annual 構成所需的出席人次名詞。原句的 increased 本身無法判斷主詞單複數。"}, {"g": "t_p5noun", "q": "All _______ are required to wear safety helmets in the factory.", "o": ["visitors", "visits", "visiting", "visited"], "a": 0, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "所有訪客在工廠內都必須戴安全帽。", "e": "訊號：要「戴安全帽」的主詞 → 人 visitors。", "w": "(B) visits 是造訪（事）；(C)(D) 不是名詞。"}, {"g": "t_p5noun", "q": "The _______ of the new factory will take about two years.", "o": ["constructor", "construct", "constructive", "construction"], "a": 3, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "新工廠的建造大約需要兩年。", "e": "訊號：The ＋ 名詞 ＋ of，語意是「建造（行為）」需要兩年 → construction。", "w": "(A) constructor 表建造者，本句要表達需要約兩年的「建造工程」；(B) construct、(C) constructive 均不是此處所需的行為名詞。"}, {"g": "t_p5noun", "q": "Several _______ have expressed interest in investing in our project.", "o": ["investing", "investments", "investors", "invest"], "a": 2, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "已有數位投資人表示有興趣投資我們的專案。", "e": "訊號：主詞要能「表達興趣」→ 人 investors。", "w": "(B) investments 是投資（事、物）；(D) 動詞；(A) V-ing。"}, {"g": "t_p5noun", "q": "We appreciate your _______ during the system upgrade.", "o": ["patiently", "patient", "patients", "patience"], "a": 3, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "感謝您在系統升級期間的耐心。", "e": "訊號：your ＋ 名詞，語意「耐心」→ patience。", "w": "(B)(C) patient 當名詞是「病人」，語意不通；(A) 副詞。"}, {"g": "t_p5noun", "q": "The hotel employs several multilingual _______ at the front desk.", "o": ["receptionists", "receive", "receptive", "receptions"], "a": 0, "h": "先辨認選項的詞性，再判斷需要人物、事物或行為名詞；也要核對可數性、單複數與整句語意。", "trans": "飯店櫃台聘有數位會說多國語言的接待員。", "e": "訊號：employs（雇用）的受詞要是人 → receptionists。", "w": "(D) receptions 是招待會；(B) 動詞；(C) 形容詞。"}]}, {"id": "p5_agree", "kind": "toeic", "part": 5, "stage": 4, "title": "主詞動詞一致", "sub": "the number of＋單數動詞；a number of＋複數動詞；either／neither…or／nor 看靠近的主詞", "qs": [{"g": "t_p5agree", "q": "The number of online orders _______ increased sharply this year.", "o": ["have", "are", "were", "has"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "今年線上訂單的數量大幅增加。", "e": "訊號：the number of ＋ 複數名詞 → 主詞是 number（單數）→ has。", "w": "(A) 被 orders 誤導；(B)(C) be 動詞不搭 increased 主動完成式。"}, {"g": "t_p5agree", "q": "A number of employees _______ requested flexible working hours.", "o": ["have", "is", "was", "has"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "許多員工要求彈性工時。", "e": "訊號：a number of ＝ many → 接複數動詞 have。", "w": "(B)(C)(D) 單數動詞。"}, {"g": "t_p5agree", "q": "The list of participants _______ posted on the bulletin board.", "o": ["were", "are", "is", "have"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "參加者名單公布在佈告欄上。", "e": "訊號：主詞是 The list（單數），of participants 只是修飾語 → is。", "w": "(A)(B)(D) 被最近的 participants 誤導。"}, {"g": "t_p5agree", "q": "Each of the new products _______ a two-year warranty.", "o": ["have come with", "comes with", "come with", "coming with"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "每項新產品都附有兩年保固。", "e": "訊號：Each of ＋ 複數 → 主詞 Each 是單數 → comes。", "w": "(A)(C) 複數動詞；(D) 不是真動詞。"}, {"g": "t_p5agree", "q": "Neither the manager nor the employees _______ aware of the problem.", "o": ["has been", "were", "was", "is"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "經理和員工們都沒察覺到這個問題。", "e": "訊號：neither A nor B → 動詞與靠近的 B（employees，複數）一致 → were。", "w": "(A)(C)(D) 單數，與 employees 不一致。"}, {"g": "t_p5agree", "q": "The equipment in both laboratories _______ inspected every month.", "o": ["were", "are", "have been", "is"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "兩間實驗室的設備每月都會檢查。", "e": "訊號：主詞 equipment 是不可數（單數）→ is；every month 表習慣 → 現在式。", "w": "(A)(B)(C) 被 laboratories 誤導成複數。"}, {"g": "t_p5agree", "q": "Ms. Chen, along with her two assistants, _______ attending the trade fair.", "o": ["is", "are", "have been", "were"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "陳女士和她的兩位助理正在參加商展。", "e": "訊號：A, along with B, → 動詞跟主詞 A（Ms. Chen，單數）一致 → is。", "w": "(B)(C)(D) 被 two assistants 誤導。"}, {"g": "t_p5agree", "q": "Every desk and chair in the office _______ been replaced.", "o": ["have", "were", "has", "are"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "辦公室裡的每張桌椅都已更換。", "e": "訊號：Every A and B 仍視為單數 → has。", "w": "(A) 複數；(B)(D) 不能搭 been replaced（缺 have）。"}, {"g": "t_p5agree", "q": "The results of the survey _______ that customers want faster delivery.", "o": ["has shown", "shows", "showing", "show"], "a": 3, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "問卷結果顯示顧客希望更快到貨。", "e": "訊號：主詞是 The results（複數），of the survey 是修飾語 → show。", "w": "(A)(B) 被 survey 誤導成單數；(C) 不是真動詞。"}, {"g": "t_p5agree", "q": "Ten dollars _______ a reasonable price for this service.", "o": ["is", "are", "be", "were"], "a": 0, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "這項服務收十美元是合理的價格。", "e": "訊號：金額、時間、距離視為一個整體 → 單數 is。", "w": "(B)(D) 被 dollars 的 -s 誤導；(C) 不是真動詞。"}, {"g": "t_p5agree", "q": "Either the regional managers or the director _______ the final decision.", "o": ["making", "make", "makes", "have made"], "a": 2, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "最後決定由區域經理們或主任來做。", "e": "訊號：either A or B → 動詞與靠近的 B（the director，單數）一致 → makes。", "w": "(B)(D) 複數；(A) 不是真動詞。"}, {"g": "t_p5agree", "q": "Most of the information in the brochure _______ outdated.", "o": ["have", "is", "were", "are"], "a": 1, "h": "把 of 片語、along with 片語拿掉，找真正的主詞。", "trans": "手冊裡大部分的資訊都過時了。", "e": "訊號：Most of ＋ 不可數名詞（information）→ 單數 is（most of 後面的名詞決定單複數）。", "w": "(C) were、(D) are 與不可數 information 不一致；(A) have 既不符合單數主詞，也不能直接用 have outdated 表示資訊已過時。"}]}, {"id": "p5_rel", "kind": "toeic", "part": 5, "stage": 5, "title": "關係詞", "sub": "缺主詞 who／which；缺受詞 whom／which；後接名詞 whose；子句完整 where／when／why", "qs": [{"g": "t_p5rel", "q": "Employees _______ wish to attend the seminar should contact Ms. Ross.", "o": ["whom", "which", "who", "whose"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "想參加研討會的員工請聯絡 Ross 女士。", "e": "訊號：先行詞 Employees 是人；空格後 wish to attend 缺主詞 → 主格 who。", "w": "(B) which 指物；(D) whose 後面要接名詞；(A) whom 是受格，後面的子句不能缺主詞。"}, {"g": "t_p5rel", "q": "The report, _______ was released yesterday, shows a rise in sales.", "o": ["that", "which", "what", "who"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "昨天公布的報告顯示銷售額上升。", "e": "訊號：先行詞是物（The report）；逗號後的非限定子句缺主詞 → which（逗號後不能用 that）。", "w": "(D) who 指人；(A) that 不能用在逗號後；(C) what 不需要先行詞。"}, {"g": "t_p5rel", "q": "We hired a consultant _______ experience in retail is extensive.", "o": ["who", "whom", "which", "whose"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們聘請了一位在零售業經驗豐富的顧問。", "e": "訊號：空格後緊接名詞 experience，且子句 ___ experience in retail is extensive 不缺主詞或受詞 → 所有格 whose（顧問的經驗）。", "w": "(A)(B)(C) 後面接的子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "The candidate _______ we interviewed yesterday has accepted the offer.", "o": ["whom", "whose", "what", "which"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們昨天面試的候選人已經接受了錄取。", "e": "訊號：先行詞是人；子句 we interviewed ___ 缺受詞 → 受格 whom（也可用 who／that 或省略）。", "w": "(B) whose 要接名詞；(D) which 指物；(C) what 不接先行詞。"}, {"g": "t_p5rel", "q": "This is the hotel _______ the conference will be held next year.", "o": ["what", "whose", "which", "where"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "這就是明年要舉辦會議的飯店。", "e": "訊號：先行詞是地點，空格後 the conference will be held 是完整子句（不缺主詞或受詞）→ 關係副詞 where（＝in which）。", "w": "(C) which 後面的子句要缺名詞；(A) what 不接先行詞；(B) whose 要接名詞。"}, {"g": "t_p5rel", "q": "_______ you need for the trip is listed in the itinerary.", "o": ["Which", "Whose", "What", "That"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "你這趟旅程需要的東西都列在行程表裡。", "e": "訊號：句首沒有先行詞，子句 you need ___ 缺受詞，整個子句當主詞 → What（＝the thing that）。", "w": "(D) that 子句要完整；(A) which 當主詞子句時需有選擇範圍；(B) whose 要接名詞。"}, {"g": "t_p5rel", "q": "The machine _______ was repaired last week has broken down again.", "o": ["that", "what", "who", "whom"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "上週修好的機器又故障了。", "e": "訊號：先行詞是物，沒有逗號（限定用法），子句缺主詞 → that（也可用 which）。", "w": "(C)(D) 指人；(B) what 不接先行詞。"}, {"g": "t_p5rel", "q": "Ms. Kato, _______ office is on the third floor, will lead the training.", "o": ["whom", "whose", "which", "who"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "辦公室在三樓的加藤女士將主持訓練。", "e": "訊號：空格後緊接名詞 office，子句 ___ office is on the third floor 完整 → whose（加藤女士的辦公室）。", "w": "(A)(C)(D) 後面的子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "Please remember the date _______ the new policy takes effect.", "o": ["where", "when", "which", "what"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "請記住新政策生效的日期。", "e": "訊號：先行詞是時間 the date，子句 the new policy takes effect 完整 → 關係副詞 when。", "w": "(C) which 後面要缺名詞；(A) where 用於地點；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "The company is looking for someone _______ can speak both English and Japanese.", "o": ["which", "whom", "whose", "who"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "公司正在找一位能說英語和日語的人。", "e": "訊號：先行詞 someone 是人，子句 ___ can speak … 缺主詞 → who。", "w": "(B) whom 是受格；(C) whose 要接名詞；(A) which 指物。"}, {"g": "t_p5rel", "q": "The consultant with _______ we discussed the plan has left the firm.", "o": ["whom", "which", "who", "that"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "和我們討論過這項計畫的那位顧問已經離職了。", "e": "訊號：介系詞 with 後面接關係代名詞，先行詞 consultant 是人 → whom（介系詞後不能用 who 或 that）。", "w": "(C) 介系詞後不用 who；(B) which 指物；(D) 介系詞後不用 that。"}, {"g": "t_p5rel", "q": "The room in _______ the workshop will take place has been reserved.", "o": ["that", "where", "which", "what"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "要舉辦工作坊的那間房間已經預約了。", "e": "訊號：介系詞 in 後面 → 指物用 which（in which ＝ where）。", "w": "(A) that 不能作此處前置介系詞 in 的關係代名詞；(B) in where 不符合本句地點關係結構，單用 where 才相當於 in which；(D) what 不能在本句修飾既有先行詞 the room。"}, {"g": "t_p5rel", "q": "Applicants _______ résumés are incomplete will not be considered.", "o": ["which", "whom", "who", "whose"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "履歷不完整的應徵者將不予考慮。", "e": "訊號：空格後緊接名詞 résumés，子句完整 → whose（應徵者的履歷）。", "w": "(A)(B)(C) 後面子句要缺主詞或受詞。"}, {"g": "t_p5rel", "q": "The new branch, _______ opened last month, already has many customers.", "o": ["which", "that", "where", "what"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "上個月開幕的新分店已經有很多顧客了。", "e": "訊號：逗號後的非限定子句，先行詞是物，子句缺主詞 → which（逗號後不用 that）。", "w": "(B) that 不能用在逗號後；(C) where 後面要接完整子句；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "Thank you for _______ you have done for the project.", "o": ["who", "what", "that", "which"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "謝謝你為這個專案所做的一切。", "e": "訊號：介系詞 for 後面沒有先行詞，子句 you have done ___ 缺受詞 → what（＝the things that）。", "w": "(A) who 指人，不符合「為專案所做的事」；(C) that 不能在此單獨引導此種介系詞受詞結構；(D) which 需要可辨識的選擇範圍，本句是泛指做過的一切。"}, {"g": "t_p5rel", "q": "The city _______ we visited last year has built a new convention center.", "o": ["whose", "where", "which", "what"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "我們去年造訪的城市蓋了一座新的會議中心。", "e": "訊號：雖然先行詞是地點，但子句 we visited ___ 缺受詞（visit 是及物動詞）→ 用 which，不用 where。", "w": "(B) where 後要接完整子句，但 visited 缺受詞；(A) whose 要接名詞；(D) what 不接先行詞。"}, {"g": "t_p5rel", "q": "All visitors, most of _______ were tourists, enjoyed the tour.", "o": ["them", "whom", "who", "which"], "a": 1, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "所有訪客都很喜歡這趟導覽，他們大多數是觀光客。", "e": "訊號：逗號後「數量詞 ＋ of ＋ 關係代名詞」，指人且在介系詞後 → whom。", "w": "(A) them 會讓句子有兩個子句卻沒有連接詞；(C) 介系詞後不用 who；(D) which 指物。"}, {"g": "t_p5rel", "q": "The product _______ received the best reviews will be featured in our ad.", "o": ["who", "whose", "where", "that"], "a": 3, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "評價最好的產品將出現在我們的廣告中。", "e": "訊號：先行詞是物，子句缺主詞 → that（或 which）。", "w": "(A) who 指人；(B) whose 要接名詞；(C) where 要接完整子句。"}, {"g": "t_p5rel", "q": "The reason _______ the shipment was delayed is still unknown.", "o": ["why", "where", "what", "which"], "a": 0, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "貨物延遲的原因仍然不明。", "e": "訊號：先行詞是 the reason，子句完整 → 關係副詞 why。", "w": "(D) which 後要缺名詞；(C) what 不接先行詞；(B) where 用於地點。"}, {"g": "t_p5rel", "q": "Mr. Han is the person to _______ all inquiries should be sent.", "o": ["whose", "who", "whom", "that"], "a": 2, "h": "先看先行詞是人、物、時間還是地點，再看後面子句缺什麼。", "trans": "所有詢問都應寄給韓先生。", "e": "訊號：介系詞 to 後面、指人 → whom。", "w": "(B)(D) 介系詞後不能用 who 或 that；(A) whose 要接名詞。"}]}, {"id": "p5_ncl", "kind": "toeic", "part": 5, "stage": 5, "title": "名詞子句與間接問句", "sub": "完整子句 → that／whether；缺名詞 → what／who；間接問句用直述語序", "qs": [{"g": "t_p5ncl", "q": "Please confirm _______ the order has shipped.", "o": ["what", "whether", "which
