____ heavy to be shipped by regular mail.", "o": ["enough", "so", "very", "too"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "包裹太重了，無法以一般郵件寄送。", "e": "訊號：___ ＋ 形容詞 ＋ to V，語意是「太…而不能」→ too。", "w": "(B) so heavy 後要接 that 子句；(A) enough 要放在形容詞後；(C) very heavy to be shipped 不合文法。"}, {"g": "t_p5deg", "q": "The demand was _______ high that the factory added a night shift.", "o": ["enough", "such", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "需求高到工廠加開了夜班。", "e": "訊號：___ ＋ 形容詞（high）＋ that 子句 → so … that（如此…以致於）。", "w": "(B) such 後面要接名詞；(D) too 搭 to V；(A) enough 放在形容詞後。"}, {"g": "t_p5deg", "q": "It was _______ a popular event that tickets sold out in an hour.", "o": ["too", "such", "so", "very"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "那是場非常熱門的活動，門票一小時內就賣完。", "e": "訊號：___ ＋ a ＋ 形容詞 ＋ 名詞 ＋ that → such a … that。", "w": "(C) so 後面直接接形容詞，so a popular event 語序錯（要用 so popular an event）；(A)(D) 不搭 that 子句。"}, {"g": "t_p5deg", "q": "We do not have _______ chairs for all the participants.", "o": ["too", "enough", "so", "such"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "我們沒有足夠的椅子給所有參加者。", "e": "訊號：___ ＋ 名詞 chairs → enough 放在名詞前面（enough ＋ N）。", "w": "(A)(C) too／so 不直接修飾名詞；(D) such chairs 語意不合「足夠」。"}, {"g": "t_p5deg", "q": "The instructions were _______ clear that no one had any questions.", "o": ["enough", "such", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "說明非常清楚，沒有人有任何問題。", "e": "訊號：形容詞 clear ＋ that 子句 → so … that。", "w": "(B) such 要接名詞；(D) too 搭 to V；(A) enough 要放形容詞後。"}, {"g": "t_p5deg", "q": "Ms. Davis is experienced _______ to lead the new project team.", "o": ["such", "so", "too", "enough"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "Davis 女士經驗足夠，可以領導新專案團隊。", "e": "訊號：形容詞 experienced ＋ ___ ＋ to V → enough。", "w": "(A)(B) 要搭 that 子句；(C) too 要放在形容詞前，且語意相反。"}, {"g": "t_p5deg", "q": "The deadline is _______ close for us to make any major changes.", "o": ["too", "so", "enough", "such"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "截止期限太近了，我們無法做重大修改。", "e": "訊號：___ ＋ 形容詞 ＋ for 人 ＋ to V，語意「太…而不能」→ too。", "w": "(B) so 搭 that；(C) enough 放形容詞後；(D) such 接名詞。"}, {"g": "t_p5deg", "q": "The new software is _______ easy to use that even beginners can learn it quickly.", "o": ["such", "enough", "so", "too"], "a": 2, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "新軟體非常容易使用，連新手都能很快學會。", "e": "訊號：形容詞 easy（to use 只是補充）＋ that 子句 → so … that。", "w": "(A) such 要接名詞；(D) too…to 語意相反且不接 that；(B) enough 要放在形容詞後。"}, {"g": "t_p5deg", "q": "The hotel received _______ positive reviews that it was fully booked for months.", "o": ["too", "so", "enough", "such"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這家飯店好評如潮，好幾個月都客滿。", "e": "訊號：___ ＋ 形容詞 ＋ 複數名詞（positive reviews）＋ that → such … that（複數名詞不用 a）。", "w": "(B) so 不能接「形容詞＋名詞」；(A)(C) 不搭 that 子句。"}, {"g": "t_p5deg", "q": "There was not _______ time to discuss every item on the agenda.", "o": ["enough", "very", "so", "too"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "時間不夠討論議程上的每一項。", "e": "訊號：___ ＋ 名詞 time ＋ to V → enough ＋ N ＋ to V。", "w": "(B)(C)(D) 不能直接修飾名詞 time。"}, {"g": "t_p5deg", "q": "The presentation was _______ long that some attendees left early.", "o": ["such", "so", "too", "enough"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "簡報太長了，有些與會者提早離開。", "e": "訊號：形容詞 long ＋ that 子句 → so … that。", "w": "(A) such 接名詞；(C) too 搭 to V；(D) enough 放形容詞後。"}, {"g": "t_p5deg", "q": "The item is too expensive for most customers _______.", "o": ["to afford", "afford", "to afford it", "affording"], "a": 0, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "這個商品太貴，大部分顧客負擔不起。", "e": "訊號：too ＋ 形容詞 ＋ for 人 ＋ to V。主詞 The item 就是 afford 的受詞，所以句尾不能再加 it。", "w": "(B)(D) 不是 to V；(C) 主詞已是 afford 的對象，再加 it 會重複受詞。"}, {"g": "t_p5deg", "q": "The conference hall is not big _______ to hold 500 people.", "o": ["so", "enough", "such", "too"], "a": 1, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "會議廳不夠大，容納不了 500 人。", "e": "訊號：形容詞 big ＋ ___ ＋ to V → enough。", "w": "(D) too big 語意相反且位置錯；(A)(C) 搭 that 子句。"}, {"g": "t_p5deg", "q": "He spoke so quickly _______ many listeners missed key points.", "o": ["which", "as", "than", "that"], "a": 3, "h": "空格後接形容詞＋that、a＋名詞＋that，還是 to V？enough 的位置在哪？", "trans": "他講話太快，許多聽眾漏聽了重點。", "e": "訊號：so ＋ 副詞（quickly）＋ ___ ＋ 結果子句 → that。", "w": "(A) which 是關係代名詞；(B) as 不構成結果句；(C) than 用於比較。"}]}, {"id": "p5_prep", "kind": "toeic", "part": 5, "stage": 6, "title": "介系詞語意辨析", "sub": "by 期限／until 持續；within 期限內／for 一段時間；between 兩者／among 三者以上", "qs": [{"g": "t_p5prep", "q": "Please submit the form _______ Friday.", "o": ["during", "until", "by", "since"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "請在週五前繳交表格。", "e": "訊號：submit 是「一次完成」的動作 ＋ 期限 → by（最晚在…之前）。", "w": "(B) until 搭「持續」動作（stay until Friday）；(D) since 搭完成式；(A) during 接一段期間。"}, {"g": "t_p5prep", "q": "The store will remain open _______ 10 P.M. during the holiday season.", "o": ["until", "by", "since", "within"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "假期期間，商店將營業到晚上十點。", "e": "訊號：remain open 是「持續」狀態 ＋ 時間終點 → until。", "w": "(B) by 搭一次性動作的期限；(D) within 接一段時間長度；(C) since 搭完成式。"}, {"g": "t_p5prep", "q": "All complaints must be resolved _______ 48 hours.", "o": ["for", "since", "by", "within"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "所有投訴必須在 48 小時內處理完畢。", "e": "訊號：在一段時間「之內」完成 → within ＋ 時間長度。", "w": "(A) for 表持續多久，不表期限；(B) since 接時間點；(C) by 接時間點（by Friday），不接時間長度。"}, {"g": "t_p5prep", "q": "Mr. Nakamura has worked here _______ more than ten years.", "o": ["since", "for", "by", "within"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "中村先生在這裡工作超過十年了。", "e": "訊號：完成式 ＋ 一段時間長度（ten years）→ for。", "w": "(A) since 接時間點（since 2015）；(D) within 表期限內；(C) by 表期限。"}, {"g": "t_p5prep", "q": "The profits were divided equally _______ the two partners.", "o": ["between", "within", "among", "through"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "利潤在兩位合夥人之間平分。", "e": "訊號：兩者之間 → between。", "w": "(C) among 用於三者以上；(B) within 表範圍內；(D) through 表穿過或透過。"}, {"g": "t_p5prep", "q": "The new policy is popular _______ the employees.", "o": ["beside", "along", "between", "among"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "新政策在員工之間很受歡迎。", "e": "訊號：在一群人（三者以上）之中 → among。", "w": "(C) between 用於兩者；(B) along 沿著；(A) beside 在旁邊。"}, {"g": "t_p5prep", "q": "The meeting will begin _______ 9:30 A.M.", "o": ["on", "at", "in", "by"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "會議將於上午九點半開始。", "e": "訊號：精確時刻 → at。（at ＋ 時刻、on ＋ 日期／星期、in ＋ 月／年／季節）", "w": "(C) in 接月份、年份；(A) on 接日期、星期；(D) by 表最晚期限，與 begin 搭配語意不同。"}, {"g": "t_p5prep", "q": "The annual sale starts _______ Monday, June 3.", "o": ["in", "at", "on", "for"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "年度特賣會於 6 月 3 日星期一開始。", "e": "訊號：特定日期／星期 → on。", "w": "(A) in 接月份或年份；(B) at 接時刻；(D) for 表持續。"}, {"g": "t_p5prep", "q": "The company was founded _______ 1998.", "o": ["on", "in", "by", "at"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "這家公司成立於 1998 年。", "e": "訊號：年份 → in。", "w": "(D) at 接時刻；(A) on 接日期；(C) by 表期限。"}, {"g": "t_p5prep", "q": "We will contact you _______ the next few days.", "o": ["until", "since", "at", "within"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "我們將在接下來幾天內與您聯絡。", "e": "訊號：在一段時間之內 → within the next few days。", "w": "(B) since 接過去時間點；(A) until 搭持續動作；(C) at 接時刻。"}, {"g": "t_p5prep", "q": "The park is located _______ the river, so visitors can enjoy the view.", "o": ["between", "into", "along", "among"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "公園沿著河岸而建，遊客可以欣賞景色。", "e": "訊號：沿著一條線狀的東西（河、路）→ along。", "w": "(D) among 用於一群東西之中；(A) between 需要兩個對象；(B) into 表進入的動作。"}, {"g": "t_p5prep", "q": "Prices have risen sharply _______ the past six months.", "o": ["over", "since", "by", "at"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "過去六個月價格大幅上漲。", "e": "訊號：over the past ＋ 一段時間（在這段期間）→ over，搭配完成式。", "w": "(B) since 接時間點，不接 the past six months；(C)(D) 不能這樣搭配。"}, {"g": "t_p5prep", "q": "The office will be closed _______ the renovation.", "o": ["within", "while", "during", "when"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "辦公室在整修期間將關閉。", "e": "訊號：後面只有名詞 the renovation，表「在…期間」→ during。", "w": "(B)(D) 是連接詞，要接子句；(A) within 接時間長度。"}, {"g": "t_p5prep", "q": "Ms. Gray is responsible _______ training new employees.", "o": ["on", "for", "with", "to"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "Gray 女士負責訓練新進員工。", "e": "訊號：be responsible for ＋ N／V-ing。", "w": "(A)(C)(D) 不與 responsible 搭配表示負責。"}, {"g": "t_p5prep", "q": "The shuttle bus runs every 20 minutes _______ the hotel and the airport.", "o": ["from", "through", "among", "between"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "接駁車每 20 分鐘往返飯店與機場一班。", "e": "訊號：A and B 兩個地點之間 → between A and B。", "w": "(C) among 用於三者以上；(A) from 要搭 to（from A to B）；(B) through 表穿過。"}, {"g": "t_p5prep", "q": "The report must be completed _______ the end of the month.", "o": ["by", "since", "until", "for"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "報告必須在月底前完成。", "e": "訊號：be completed 是一次性完成動作 ＋ 期限 → by。", "w": "(C) until 搭持續動作；(D) for 接一段時間；(B) since 搭完成式。"}, {"g": "t_p5prep", "q": "The museum is open _______ 9 A.M. to 5 P.M.", "o": ["since", "from", "at", "between"], "a": 1, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "博物館開放時間為上午九點到下午五點。", "e": "訊號：後面有 to → from A to B。", "w": "(A) since 不搭 to；(D) between 要搭 and；(C) at 接單一時刻。"}, {"g": "t_p5prep", "q": "Several new restaurants have opened _______ the downtown area.", "o": ["to", "on", "at", "in"], "a": 3, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "市中心區域開了好幾家新餐廳。", "e": "訊號：在一個區域範圍內 → in the area。", "w": "(B) on 表在表面上；(C) at 表某個點；(A) to 表方向。"}, {"g": "t_p5prep", "q": "Applications received _______ the deadline will not be accepted.", "o": ["during", "within", "after", "until"], "a": 2, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "截止日期後收到的申請將不受理。", "e": "訊號：語意是「截止之後」→ after。", "w": "(D) until 搭持續動作；(B) within the deadline 不合語意；(A) during 接一段期間。"}, {"g": "t_p5prep", "q": "Mr. Ford will be on vacation _______ two weeks starting Monday.", "o": ["for", "within", "by", "since"], "a": 0, "h": "先判斷是時間點、時間長度、一次性動作還是持續狀態。", "trans": "Ford 先生從週一開始休假兩週。", "e": "訊號：持續一段時間長度 → for two weeks。", "w": "(D) since 接時間點；(C) by 表期限；(B) within 表期限內，語意不合度假多久。"}]}, {"id": "p5_adv", "kind": "toeic", "part": 5, "stage": 6, "title": "語意副詞", "sub": "already 肯定／yet 否定／still 仍然；nearly／hardly；never 放在助動詞後", "qs": [{"g": "t_p5adv", "q": "The shipment has _______ arrived, so we can start processing the orders.", "o": ["still", "ever", "already", "yet"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "貨已經到了，所以我們可以開始處理訂單。", "e": "訊號：肯定句的完成式，表示「已經」→ already（放在 has 與 p.p. 中間）。", "w": "(D) yet 用於否定句或疑問句；(A) still 表「仍然」；(B) ever 用於疑問句或否定句。"}, {"g": "t_p5adv", "q": "We have not received the payment _______.", "o": ["soon", "already", "still", "yet"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "我們還沒收到款項。", "e": "訊號：否定句句尾 ＋ 完成式 → yet（尚未）。", "w": "(B) already 用於肯定句；(C) still 要放在 have not 前（still haven't）；(A) soon 不搭完成式。"}, {"g": "t_p5adv", "q": "Even after the price increase, the product is _______ very popular.", "o": ["still", "ever", "already", "yet"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "即使漲價後，這項產品仍然很受歡迎。", "e": "訊號：Even after … 表示「即使…仍然」→ still。", "w": "(C) 已經；(D) 用於否定或疑問；(B) 用於疑問或比較。"}, {"g": "t_p5adv", "q": "The project is _______ complete; only the final review remains.", "o": ["nearby", "nearly", "near", "nearest"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "專案幾乎完成了，只剩最後審查。", "e": "訊號：修飾形容詞 complete，語意「幾乎」→ 副詞 nearly。", "w": "(C) near 表空間上的靠近；(A) nearby 表附近；(D) 最高級。"}, {"g": "t_p5adv", "q": "Ms. Taylor could _______ hear the speaker because of the noise.", "o": ["hardly", "hardest", "hard", "harder"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "因為太吵，Taylor 女士幾乎聽不到講者的聲音。", "e": "訊號：because of the noise 表負面結果 → hardly（幾乎不）。", "w": "(C) hard 當副詞是「努力地」；(B)(D) 比較級／最高級，語意不合。"}, {"g": "t_p5adv", "q": "The new branch opened _______ two weeks ago.", "o": ["still", "yet", "already", "just"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "新分店兩週前才剛開幕。", "e": "訊號：搭配過去時間 two weeks ago，表「才、剛好」→ just。", "w": "(C) already 多搭完成式；(B) yet 用於否定或疑問；(A) still 表仍然。"}, {"g": "t_p5adv", "q": "The tickets were _______ expensive that few people bought them.", "o": ["such", "so", "very", "too"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "票價太貴，很少人買。", "e": "訊號：形容詞 expensive ＋ that 子句 → so … that。", "w": "(A) such 要接名詞；(D) too 搭 to V；(C) very 不搭 that 子句。"}, {"g": "t_p5adv", "q": "Our team members work _______ with clients to understand their needs.", "o": ["closer", "close", "closely", "closeness"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "我們的團隊成員與客戶密切合作，了解他們的需求。", "e": "訊號：work ＿ with，語意「密切地」→ closely（close 當副詞表「距離近」）。", "w": "(B) close 當副詞是「靠近」，語意不合；(A) 比較級；(D) 名詞。"}, {"g": "t_p5adv", "q": "The conference room is _______ available on Friday afternoons.", "o": ["usualness", "usually", "use", "usual"], "a": 1, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "會議室週五下午通常可以使用。", "e": "訊號：be 動詞與形容詞 available 之間 → 頻率副詞 usually。", "w": "(D) 形容詞；(A) 名詞；(C) 動詞／名詞。"}, {"g": "t_p5adv", "q": "The proposal was _______ approved by the board, with only one vote against it.", "o": ["almost unanimous", "most unanimously", "almost unanimously", "almost unanimity"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "提案幾乎全票通過，只有一票反對。", "e": "訊號：was ＋ ___ ＋ p.p. → 副詞；almost 修飾副詞 unanimously（幾乎一致地）。", "w": "(A) 形容詞不能放在 was 與 p.p. 中間；(B) most 語意不對；(D) 名詞。"}, {"g": "t_p5adv", "q": "The manager responded _______ to the complaint, within just one hour.", "o": ["quickness", "more quick", "quick", "quickly"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "經理在一小時內就迅速回覆了投訴。", "e": "訊號：responded（不及物）已完整 → 副詞 quickly。", "w": "(C) 形容詞；(A) 名詞；(B) quick 的比較級是 quicker，且這裡不需要比較。"}, {"g": "t_p5adv", "q": "The data has been _______ analyzed, so the results are reliable.", "o": ["thoroughly", "thoroughness", "through", "thorough"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "資料已經被徹底分析，所以結果可靠。", "e": "訊號：has been ＋ ___ ＋ p.p. → 副詞 thoroughly。", "w": "(D) 形容詞；(B) 名詞；(C) 介系詞（穿過）。"}, {"g": "t_p5adv", "q": "The store is open daily, _______ on national holidays.", "o": ["ever", "only", "except", "even"], "a": 2, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "商店每天營業，國定假日除外。", "e": "訊號：前面 open daily，後面 on national holidays 是例外 → except（除了）。", "w": "(B) only 表「只有」，語意相反；(D) even 表「甚至」；(A) ever 用於疑問或否定。"}, {"g": "t_p5adv", "q": "Mr. Cole has _______ been late for a meeting in ten years.", "o": ["never", "already", "yet", "ever"], "a": 0, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "Cole 先生十年來從未在開會時遲到。", "e": "訊號：肯定句結構（沒有 not），語意「從未」→ never 放在 has 與 p.p. 中間。", "w": "(D) ever 用於疑問句或否定句；(C) yet 放在否定句句尾；(B) already 語意不合 in ten years。"}, {"g": "t_p5adv", "q": "Prices have risen _______ in recent months, by nearly 20 percent.", "o": ["sharpen", "sharp", "sharpness", "sharply"], "a": 3, "h": "先看句子是肯定還是否定，再看副詞修飾的對象。", "trans": "近幾個月物價急遽上漲，漲幅接近 20%。", "e": "訊號：have risen（不及物）已完整 → 副詞 sharply（急遽地）。", "w": "(B) 形容詞；(C) 名詞；(A) 動詞。"}]}, {"id": "p5_part", "kind": "toeic", "part": 5, "stage": 6, "title": "分詞形容詞", "sub": "人的感受 → -ed；事物的性質 → -ing；attached／enclosed／experienced", "qs": [{"g": "t_p5part", "q": "The audience was very _______ in the speaker's presentation.", "o": ["interests", "interested", "interesting", "interest"], "a": 1, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "觀眾對講者的簡報非常感興趣。", "e": "訊號：主詞是人（audience）的感受 → p.p. 形容詞 interested（人感到…）。", "w": "(C) interesting 形容事物「令人感興趣的」；(A)(D) 名詞／動詞。"}, {"g": "t_p5part", "q": "The results of the survey were quite _______.", "o": ["surprised", "surprisingly", "surprise", "surprising"], "a": 3, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "問卷結果相當令人意外。", "e": "訊號：主詞是事物（results），描述其性質 → V-ing 形容詞 surprising（令人驚訝的）。", "w": "(A) surprised 形容人「感到驚訝」；(C) 名詞／動詞；(B) 副詞。"}, {"g": "t_p5part", "q": "Please review the _______ document before the meeting.", "o": ["attached", "attachment", "attaching", "attach"], "a": 0, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "會議前請先看過附件。", "e": "訊號：文件是「被附上的」→ p.p. attached（the attached file／document 為固定說法）。", "w": "(D) 動詞；(C) V-ing 表主動「正在附加」；(B) 名詞，不能直接修飾 document（attachment document 不自然）。"}, {"g": "t_p5part", "q": "We are looking for an _______ accountant with at least five years of experience.", "o": ["experience", "experiences", "experienced", "experiencing"], "a": 2, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "我們正在徵求一位至少有五年經驗、經驗豐富的會計師。", "e": "訊號：an ＋ ___ ＋ 名詞 → 形容詞；「有經驗的」固定用 experienced。", "w": "(D) experiencing 表正在經歷；(A)(B) 名詞／動詞。"}, {"g": "t_p5part", "q": "Customers were _______ with the quality of the new product.", "o": ["disappoint", "disappointed", "disappointment", "disappointing"], "a": 1, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "顧客對新產品的品質感到失望。", "e": "訊號：主詞是人＋感受，搭配 with → disappointed（感到失望的）。", "w": "(D) 形容事物令人失望；(C) 名詞；(A) 動詞。"}, {"g": "t_p5part", "q": "The sales figures for the third quarter were _______.", "o": ["encouraging", "encourage", "encouragement", "encouraged"], "a": 0, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "第三季的銷售數字令人振奮。", "e": "訊號：主詞是事物（figures）→ V-ing 形容詞 encouraging（令人鼓舞的）。", "w": "(D) 人感到受鼓舞；(B) 動詞；(C) 名詞。"}, {"g": "t_p5part", "q": "All _______ employees will receive a bonus at the end of the year.", "o": ["qualify", "qualification", "qualified", "qualifying"], "a": 2, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "所有符合資格的員工年底都會獲得獎金。", "e": "訊號：All ＋ ___ ＋ 名詞 → 形容詞；「符合資格的」→ qualified。", "w": "(A) 動詞；(D) qualifying 多指「資格賽、取得資格的（過程）」，修飾人時用 qualified；(B) 名詞。"}, {"g": "t_p5part", "q": "The tour guide gave a _______ explanation of the city's history.", "o": ["fascination", "fascinate", "fascinated", "fascinating"], "a": 3, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "導遊對這座城市的歷史做了引人入勝的解說。", "e": "訊號：修飾事物 explanation → V-ing fascinating（令人著迷的）。", "w": "(C) 形容人「著迷的」；(B) 動詞；(A) 名詞。"}, {"g": "t_p5part", "q": "Please return any _______ items in their original packaging.", "o": ["damage", "damaged", "damages", "damaging"], "a": 1, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "請將任何損壞的商品以原包裝退回。", "e": "訊號：any ＋ ___ ＋ 名詞 items → 形容詞；商品是「被損壞的」→ p.p. damaged。", "w": "(D) damaging 表「造成損害的」；(A)(C) 名詞或動詞，不能修飾 items。"}, {"g": "t_p5part", "q": "Mr. Ito felt _______ after working overtime all week.", "o": ["exhausting", "exhaustion", "exhaust", "exhausted"], "a": 3, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "加了一整週班後，伊藤先生感到筋疲力盡。", "e": "訊號：連綴動詞 felt ＋ 人的感受 → exhausted。", "w": "(A) 形容事物「令人疲憊的」；(C) 動詞／名詞；(B) 名詞。"}, {"g": "t_p5part", "q": "The company faced a _______ situation after the supplier went bankrupt.", "o": ["challenge", "challenges", "challenging", "challenged"], "a": 2, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "供應商破產後，公司面臨艱困的處境。", "e": "訊號：修飾事物 situation → challenging（具挑戰性的）。", "w": "(D) challenged 多形容人「有障礙的」；(A)(B) 名詞或動詞。"}, {"g": "t_p5part", "q": "Please fill out the _______ form and return it to the front desk.", "o": ["enclosed", "enclosing", "enclosure", "enclose"], "a": 0, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "請填寫隨附的表格並交回櫃台。", "e": "訊號：表格是「被附在信中的」→ enclosed（隨函附上的）。", "w": "(D) 動詞；(B) V-ing 表主動；(C) 名詞。"}, {"g": "t_p5part", "q": "The staff were _______ by the CEO's announcement of record profits.", "o": ["exciting", "excitement", "excited", "excite"], "a": 2, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "員工們因執行長宣布創紀錄獲利而感到興奮。", "e": "訊號：主詞是人，be ＋ ___ ＋ by → excited（人感到興奮）。", "w": "(A) 形容事物；(D) 動詞；(B) 名詞。"}, {"g": "t_p5part", "q": "This is a _______ offer, available for one week only.", "o": ["limited", "limiting", "limit", "limits"], "a": 0, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "這是限時優惠，僅限一週。", "e": "訊號：優惠是「被限制的」→ a limited offer（限定的優惠）。", "w": "(B) limiting 表「造成限制的」；(C)(D) 名詞或動詞。"}, {"g": "t_p5part", "q": "The instructions in the manual are somewhat _______.", "o": ["confusion", "confusing", "confused", "confuse"], "a": 1, "h": "被修飾的是「人的感受」還是「事物的性質」？", "trans": "手冊裡的說明有點令人困惑。", "e": "訊號：主詞是事物（instructions）→ confusing（令人困惑的）。", "w": "(C) confused 形容人「感到困惑」；(D) 動詞；(A) 名詞。"}]}, {"id": "p5_ger", "kind": "toeic", "part": 5, "stage": 6, "title": "動名詞 vs 不定詞", "sub": "avoid／consider／finish＋V-ing；decide／agree／refuse＋to V", "qs": [{"g": "t_p5ger", "q": "Please avoid _______ your personal belongings unattended.", "o": ["leaving", "to leave", "left", "leave"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "請勿將個人物品置於無人看管的地方。", "e": "訊號：avoid ＋ V-ing。", "w": "(B)(C)(D) avoid 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The company has decided _______ its headquarters to Taichung.", "o": ["moved", "to move", "moving", "move"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "公司決定把總部搬到台中。", "e": "訊號：decide ＋ to V。", "w": "(A)(D) 會變成第二個真動詞；(C) decide 不接 V-ing。"}, {"g": "t_p5ger", "q": "Mr. Ahmed is considering _______ for the marketing position.", "o": ["applied", "apply", "to apply", "applying"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "Ahmed 先生正在考慮應徵行銷職位。", "e": "訊號：consider ＋ V-ing。", "w": "(A)(B)(C) consider 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "We agreed _______ the price by five percent.", "o": ["lower", "lowering", "to lower", "lowered"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "我們同意把價格調降 5%。", "e": "訊號：agree ＋ to V。", "w": "(A)(D) 第二個真動詞；(B) agree 不接 V-ing。"}, {"g": "t_p5ger", "q": "The board postponed _______ a decision until next month.", "o": ["making", "made", "to make", "make"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "董事會把決定延到下個月。", "e": "訊號：postpone ＋ V-ing。", "w": "(B)(C)(D) postpone 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The customer refused _______ the delivery fee.", "o": ["pay", "paid", "to pay", "paying"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "顧客拒絕支付運費。", "e": "訊號：refuse ＋ to V。", "w": "(A)(B) 第二個真動詞；(D) refuse 不接 V-ing。"}, {"g": "t_p5ger", "q": "Ms. Clark finished _______ the quarterly report this morning.", "o": ["to write", "writing", "write", "written"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "Clark 女士今天早上寫完了季度報告。", "e": "訊號：finish ＋ V-ing。", "w": "(A)(C)(D) finish 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The firm expects _______ its profits next year.", "o": ["doubled", "double", "doubling", "to double"], "a": 3, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "公司預計明年獲利翻倍。", "e": "訊號：expect ＋ to V。", "w": "(A)(B) 第二個真動詞；(C) expect 不接 V-ing。"}, {"g": "t_p5ger", "q": "Would you mind _______ the window?", "o": ["closing", "close", "closed", "to close"], "a": 0, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "你介意把窗戶關上嗎？", "e": "訊號：mind ＋ V-ing。", "w": "(B)(C)(D) mind 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The new manager hopes _______ the team's productivity.", "o": ["improved", "improve", "to improve", "improving"], "a": 2, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "新經理希望提升團隊的生產力。", "e": "訊號：hope ＋ to V。", "w": "(A)(B) 第二個真動詞；(D) hope 不接 V-ing。"}, {"g": "t_p5ger", "q": "Customers appreciate _______ updates about their orders.", "o": ["received", "receiving", "to receive", "receive"], "a": 1, "h": "先記動詞：avoid／consider／finish／postpone／mind＋V-ing；decide／agree／refuse／expect＋to V。", "trans": "顧客很樂意收到訂單的最新消息。", "e": "訊號：appreciate ＋ V-ing。", "w": "(A)(C)(D) appreciate 不接原形、to V 或 p.p.。"}, {"g": "t_p5ger", "q": "The supplier failed _______ the materials on time.", "o": ["delivering", const SYNC_KEY="quiz-sync-v1", GIST_FILE="quiz-progress.json", GIST_DESC="刷題學習系統｜作答紀錄同步（請勿刪除）";
function payload(){return {app:"quiz-sync",v:1,updatedAt:now(),ans:st.ans,ansT:st.ansT,flags:st.flags,flagT:st.flagT,cur:st.cur,curT:st.curT}}
function stable(o){if(o===null||typeof o!=="object")return JSON.stringify(o);if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";
  return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}"}
const dataKey=o=>stable({ans:o.ans||{},ansT:o.ansT||{},flags:o.flags||{},flagT:o.flagT||{},cur:o.cur||{},curT:o.curT||{}});
function mergeMap(lv,lt,rv,rt){
  let ch=false;rv=rv||{};rt=rt||{};
  new Set([...Object.keys(lt),...Object.keys(rt),...Object.keys(lv),...Object.keys(rv)]).forEach(k=>{
    const a=lt[k]||0,b=rt[k]||0;
    if(b>a||(b===a&&lv[k]===undefined&&rv[k]!==undefined)){
      if(rv[k]===undefined){if(lv[k]!==undefined){delete lv[k];ch=true}}
      else if(lv[k]!==rv[k]){lv[k]=rv[k];ch=true}
      if(b)lt[k]=b;
    }
  });
  return ch;
}
function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  let ch=mergeMap(st.ans,st.ansT,r.ans,r.ansT);
  ch=mergeMap(st.flags,st.flagT,r.flags,r.flagT)||ch;
  ch=mergeMap(st.cur,st.curT,r.cur,r.curT)||ch;
  prevCur={...st.cur};
  return ch;
}

const Sync={
  cfg:{token:"",gistId:"",last:0}, state:"off", msg:"", busy:false, again:false, timer:null,
  loadCfg(){try{Object.assign(this.cfg,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"))}catch(e){}this.state=this.cfg.token?"idle":"off"},
  saveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(this.cfg))}catch(e){}},
  on(){return !!this.cfg.token},
  async api(path,opt={}){
    let r;
    try{
      r=await fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{
        "Accept":"application/vnd.github+json","Authorization":"Bearer "+this.cfg.token,
        ...(opt.body?{"Content-Type":"application/json"}:{})}});
    }catch(e){throw new Error("無法連線到 GitHub，請確認網路")}
    if(r.status===401){const e=new Error("Token 無效或已過期，請重新設定");e.code=401;throw e}
    if(r.status===404){const e=new Error("找不到同步用的 Gist");e.code=404;throw e}
    if(r.status===403||r.status===429)throw new Error("GitHub 拒絕請求：Token 需要 gist 權限，或暫時超過使用額度");
    if(!r.ok)throw new Error("GitHub 回應錯誤（"+r.status+"）");
    return r.status===204?null:r.json();
  },
  async findOrCreate(){
    for(let page=1;page<=10;page++){
      const list=await this.api(`/gists?per_page=100&page=${page}`);
      const g=(list||[]).find(g=>g.files&&g.files[GIST_FILE]);
      if(g)return g.id;
      if(!list||list.length<100)break;
    }
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
    return g.id;
  },
  async pull(){
    const g=await this.api("/gists/"+this.cfg.gistId);
    const f=g&&g.files&&g.files[GIST_FILE];
    if(!f)return null;
    let txt=f.content;
    if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}
    try{return JSON.parse(txt)}catch(e){return null}
  },
  async push(){
    await this.api("/gists/"+this.cfg.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
  },
  schedule(delay=2500){
    if(!this.on())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{this.timer=null;this.run()},delay);
    if(!this.busy)this.setState("pending");
  },
  flush(){if(this.timer){clearTimeout(this.timer);this.timer=null;this.run()}},
  async run(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.setState("busy");
    let changed=false;
    try{
      if(!this.cfg.gistId){this.cfg.gistId=await this.findOrCreate();this.saveCfg()}
      let remote;
      try{remote=await this.pull()}
      catch(e){if(e.code!==404)throw e;this.cfg.gistId=await this.findOrCreate();this.saveCfg();remote=await this.pull()}
      changed=mergeRemote(remote);
      if(!remote||dataKey(remote)!==dataKey(st))await this.push();
      this.cfg.last=now();this.saveCfg();persist();
      this.msg="";this.state="ok";
    }catch(e){
      this.msg=e.message||String(e);this.state="err";
      if(e.code===401){this.cfg={token:"",gistId:"",last:0};this.saveCfg()}
    }
    this.busy=false;
    if(changed||st.view==="sync")render();else renderTopbar();
    if(this.again){this.again=false;this.run()}
  },
  setState(s){this.state=s;renderTopbar()}
};


function fmtTime(t){
  if(!t)return "";const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,"0");
  const hm=p(d.getHours())+":"+p(d.getMinutes());
  return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
function syncLabel(){
  const s=Sync.on()?Sync.state:(Sync.state==="err"?"err":"off");
  return [s,{off:"未同步",idle:"同步已啟用",pending:"等待同步",busy:"同步中",ok:"已同步 "+fmtTime(Sync.cfg.last),err:"同步失敗"}[s]];
}

/* ---------- 共用元件 ---------- */
function examStats(ex){let d=0,o=0;ex.qs.forEach((q,i)=>{const a=st.ans[ex.id+"-"+i];if(a!==undefined){d++;if(a===q.a)o++}});return{d,o}}
function scopeStats(sc){const ids=scopeIds(sc);let d=0,o=0;ids.forEach(id=>{const a=st.ans[id];if(a!==undefined){d++;if(a===QM[id].q.a)o++}});return{n:ids.length,d,o}}

function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),2000);
}
function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");if(cb)cb()}catch(e){alert("複製失敗，請手動複製")}
  document.body.removeChild(ta);
}
function copyText(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(cb).catch(()=>fallbackCopy(text,cb));
  else fallbackCopy(text,cb);
}
function copyQuestion(id){
  const item=QM[id];if(!item)return;
  const {ex,q}=item,tag=TAGS[q.g]?TAGS[q.g].n:"";
  let text=`【${ex.title} 第 ${qNo(id)} 題】${tag?`[${tag}]`:""}\n${q.q}\n\n`;
  q.o.forEach((opt,idx)=>{text+=`(${L[idx]}) ${opt}\n`});
  text+=`\n【正解】(${L[q.a]})\n`;
  if(q.trans)text+=`【中文翻譯】${q.trans}\n`;
  if(q.e)text+=`【考點詳解】${q.e}\n`;
  if(q.w)text+=`【其他選項解析】${q.w}\n`;
  copyText(text,()=>{
    showToast("已複製題目與解析");
    const btn=document.querySelector(`.copybtn[data-id="${id}"]`);
    if(btn){btn.textContent="已複製";btn.classList.add("copied");setTimeout(()=>{btn.textContent="複製";btn.classList.remove("copied")},1800)}
  });
}

function card(id,num,ansMap,showSrc){
  const {ex,q}=QM[id],a=ansMap[id],done=a!==undefined,fl=!!st.flags[id];
  let h=`<div class="panel"><div class="qtop">
  <span class="qno">第 ${num} 題<span class="chip">${TAGS[q.g]?TAGS[q.g].n:""}</span></span>
  <div class="qactions">
    <button class="copybtn" data-act="copy" data-id="${id}" title="複製此題、選項與解析">複製</button>
    <button class="flagbtn ${fl?"on":""}" data-act="flag" data-id="${id}" aria-pressed="${fl}">${fl?"已標註":"標註"}</button>
  </div></div>
`;
  let qt=`<p class="qtext">${esc(q.q)}</p>`;
  if(showSrc)qt+=`<p class="src">出自${qLabel(id)}</p>`;
  let op=`<div class="opts">`;
  q.o.forEach((t,k)=>{let c="opt";if(done){if(k===q.a)c+=" right";else if(k===a)c+=" wrong"}
    op+=`<button class="${c}" data-act="pick" data-id="${id}" data-k="${k}" ${done?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(t)}</span></button>`});
  op+=`</div>`;
  h+=st.optFirst&&!done?`${op}<div class="optfirst-q">${qt}</div>`:qt+op;
  if(!done&&q.h)h+=`<details class="hint"><summary>提示</summary><p>${esc(q.h)}</p></details>`;
  else if(done){
    const g=a===q.a;
    h+=`<div class="exp ${g?"":"isbad"}">
    <p class="verdict">${g?"答對":"答錯．你選 ("+L[a]+")"}，正解 (${L[q.a]})</p>
    ${q.trans?`<div class="qtrans"><strong>中文翻譯　</strong>${esc(q.trans)}</div>`:""}
    ${q.e?`<p class="qexp-text"><strong>${ex.unofficial?"參考解析":"詳解"}　</strong>${esc(q.e)}</p>`:`<p class="note">此題目前僅收錄${ex.kind==="past"?"官方公布答案":"答案"}。</p>`}
    ${q.w?`<div class="qopt-breakdown"><strong>其他選項　</strong>${esc(q.w)}</div>`:""}
    ${ex.unofficial?`<p class="note">本年度為參考解答，非官方公布答案。</p>`:""}
    </div>`;
  }
  return h+`</div>`;
}

function gridCell(id,label,ansMap,cur,act,idx){
  const a=ansMap[id],q=QM[id].q;let c="cell";
  if(a!==undefined)c+=a===q.a?" ok":" bad";if(cur)c+=" cur";if(st.flags[id])c+=" fl";
  return `<button class="${c}" data-act="${act}" data-i="${idx}" aria-label="第 ${label} 題">${label}</button>`;
}
const legend=`<div class="legend"><span><i style="background:var(--ink)"></i>答對</span><span><i style="background:var(--mid)"></i>答錯</span><span><i style="border:1px solid var(--faint)"></i>未作答</span><span><i style="background:var(--ink);border-radius:50%;transform:scale(.8)"></i>標註</span></div>`;
function sheetBlock(title,score,cells){
  const open=st.sheetOpen===null||st.sheetOpen===undefined?isWide():st.sheetOpen;
  return `<details class="sheet" ${open?"open":""}><summary><span class="t">${I.chev}${title}</span><span class="score">${score}</span></summary>
  <div class="grid">${cells}</div>${legend}</details>`;
}

/* ---------- 首頁：目錄 ---------- */
function examLeaf(ex){
  const s=examStats(ex),n=ex.qs.length,w=s.d-s.o;
  const meta=s.d?`<b>${s.d}</b>/${n}${w?`<span class="bad">．錯 ${w}</span>`:""}`:`${n} 題`;
  return `<li><button class="row ${s.d===n?"done":""}" data-act="open" data-ex="${ex.id}"><span class="name">${esc(ex.title)}</span><span class="meta">${meta}</span></button></li>`;
}
function folder(key,name,meta,inner){
  return `<details class="folder" data-key="${key}" ${st.open[key]?"open":""}>
    <summary class="row"><span class="name">${name}</span><span class="meta">${meta}</span>${I.chev}</summary>
    <ul>${inner}</ul></details>`;
}
function toolLeaf(label,act,sc,meta){
  return `<li><button class="row" data-act="${act}" data-scope="${sc}"><span class="name">${label}</span><span class="meta">${meta||""}</span></button></li>`;
}
function progMeta(s){return s.d?`<b>${s.d}</b>/${s.n}．${Math.round(s.o/s.d*100)}%`:`${s.n} 題`}
function groupMeta(list){let d=0,n=0;list.forEach(e=>{d+=examStats(e).d;n+=e.qs.length});return d?`<b>${d}</b>/${n}`:`${n} 題`}
function vHome(){
  const B=scopeStats("bigdata"),T=scopeStats("toeic");
  const past=[...PAST].reverse();

  const bigdata=folder("bigdata","巨量資料概論",progMeta(B),
      `<li>${folder("past","考古題",`${PAST.length} 份`,past.map(examLeaf).join(""))}</li>`+
      `<li>${folder("mock","模擬考",`${EXAMS.length} 份`,EXAMS.map(examLeaf).join(""))}</li>`+

      toolLeaf("錯題抽考","pset","bigdata",wf(bw,bf)));
  const p5all=TOEIC_EXAMS.filter(e=>(e.part||5)===5),byStage=n=>p5all.filter(e=>(e.stage||0)===n);
  const sub=(key,name,list)=>`<li>${folder(key,name,groupMeta(list),list.map(examLeaf).join(""))}</li>`;
  const p5=sub("p5s1","第一階段　保底秒殺題",byStage(1))+

      sub("p5s3","第三階段　單字與搭配",byStage(3))+
      sub("p5s4","進階　名詞與限定詞",byStage(4))+
      sub("p5s5","進階　子句與連接",byStage(5))+
      sub("p5s6","進階　修飾與動詞用法",byStage(6))+
      sub("p5mix","綜合模擬",byStage(0))+
      toolLeaf("每日 15 題．限時 6 分鐘","daily","toeic","")+
      `<li><button class="row" data-act="daily" data-scope="toeic" data-base="1"><span class="name">基礎每日 15 題．只出第一～三階段</span><span class="meta"></span></button></li>`;
  const toeic=folder("toeic","TOEIC",progMeta(T),

      `<li><div class="row off"><span class="name">Part 6　段落填空</span><span class="meta">準備中</span></div></li>`+
      `<li><div class="row off"><span class="name">Part 7　閱讀測驗</span><span class="meta">準備中</span></div></li>`+

  return `<h1>目錄</h1><p class="sub">選擇資料夾開始練習</p>

/* ---------- 作答 ---------- */
const backHome=`<button class="back" data-act="go" data-v="home">← 目錄</button>`;
function vExam(){
  const ex=findEx(st.exam),cur=st.cur[ex.id]||0,s=examStats(ex),id=ex.id+"-"+cur;
  let h=`${backHome}<h1>${esc(ex.title)}</h1>`;
  if(ex.sub)h+=`<p class="sub">${esc(ex.sub)}</p>`;
  let cells="";ex.qs.forEach((q,i)=>{cells+=gridCell(ex.id+"-"+i,q.n||i+1,st.ans,i===cur,"goto",i)});
  h+=sheetBlock("答案卡",`${s.d}/${ex.qs.length}．答對 ${s.o}`,cells);
  h+=`${card(id,qNo(id),st.ans,false)}
  <div class="nav"><button class="btn" data-act="prev" ${cur===0?"disabled":""}>上一題</button>
  <button class="btn primary" data-act="next" ${cur===ex.qs.length-1?"disabled":""}>下一題</button></div>
  <div class="tools"><button data-act="nextWrong">下一個錯題</button><button data-act="retryWrong">錯題重做</button><button data-act="resetExam">清除本卷紀錄</button><button data-act="optFirst">選項先看：${st.optFirst?"開":"關"}</button></div>`;
  return h;
}

function vPset(){
  const w=wrongIds(),f=flagIds(),u=[...new Set([...w,...f])],all=scopeIds();
  const pools=[["wrong","錯題",w.length],["flag","標註",f.length],["both","錯題＋標註",u.length],["all","全部題目",all.length]];
  const first=pools.findIndex(p=>p[2]>0);
  let h=`${backHome}<h1>錯題抽考</h1><p class="sub">${scopeName()}．抽考作答不會覆蓋原本試卷的紀錄</p>
  <div class="panel" style="margin-top:22px"><fieldset><legend>範圍</legend>`;
  pools.forEach(([k,n,c],j)=>{h+=`<label class="radio"><input type="radio" name="pool" value="${k}" ${j===first?"checked":""} ${c?"":"disabled"}> ${n}（${c} 題）</label>`});
  h+=`</fieldset><fieldset><legend>題數</legend><div class="count"><input id="pcount" type="number" min="1" value="10" inputmode="numeric" aria-label="題數">
  <button class="quick" data-act="pnum" data-n="5">5</button><button class="quick" data-act="pnum" data-n="10">10</button><button class="quick" data-act="pnum" data-n="20">20</button><button class="quick" data-act="pnum" data-n="999">全部</button></div></fieldset>
  <button class="btn primary" data-act="pstart">開始</button><p class="note" id="pmsg"></p></div>`;
  if(st.pr&&st.pr.ids.length&&(st.pr.scope||"toeic")===st.scope)h+=`<p class="note" style="margin-top:16px"><button class="linkbtn" data-act="presume">繼續上一回抽考</button></p>`;
  return h;
}

function vPrac(){
  const p=st.pr,id=p.ids[p.i];let ok=0,done=0;
  p.ids.forEach(x=>{if(p.ans[x]!==undefined){done++;if(p.ans[x]===QM[x].q.a)ok++}});
  let h=`${backHome}<h1>${p.title||"隨機抽考"}</h1><p class="sub">${scopeName(p.scope||"toeic")}${p.timed?`．<span id="timer">${timerText()}</span>`:""}</p>`;
  if(done===p.ids.length)h+=`<div class="result"><p><strong>完成：答對 ${ok}／${p.ids.length}（${Math.round(ok/p.ids.length*100)}%）${p.timed&&p.end?`．用時 ${fmtDur(p.end-p.start)}`:""}</strong></p>${p.timed?`<p class="note" style="margin-top:-6px">檢討時把錯題分成兩類記下來：結構／文法錯 → 寫「漏看了哪個訊號」；單字／搭配錯 → 只抄核心搭配詞組。</p>`:""}
  <div class="row-btns"><button class="btn primary" data-act="pstartAgain">再抽一回</button><button class="btn" data-act="go" data-v="home">回目錄</button></div></div>`;
  let cells="";p.ids.forEach((x,j)=>{cells+=gridCell(x,j+1,p.ans,j===p.i,"pgoto",j)});
  h+=sheetBlock("答案卡",`${done}/${p.ids.length}．答對 ${ok}`,cells);
  h+=`${card(id,p.i+1,p.ans,true)}
  <div class="nav"><button class="btn" data-act="prev" ${p.i===0?"disabled":""}>上一題</button>
  <button class="btn primary" data-act="next" ${p.i===p.ids.length-1?"disabled":""}>下一題</button></div>
  <div class="tools"><button data-act="optFirst">選項先看：${st.optFirst?"開":"關"}</button></div>`;
  return h;
}

function vReport(){
  const tags=scopeTags(),stat={};tags.forEach(k=>stat[k]={d:0,o:0,wr:[]});
  let D=0,O=0;
  scopeIds().forEach(id=>{const a=st.ans[id];if(a===undefined)return;const {q}=QM[id];const s=stat[q.g];
    if(s){s.d++;D++;if(a===q.a){s.o++;O++}else s.wr.push(id)}});
  let h=`${backHome}<h1>錯題分析</h1>`;
  if(!D)return h+`<p class="sub">${scopeName()}</p><p style="margin-top:22px">還沒有作答紀錄。完成一份試卷後，這裡會列出各概念的答對率與補強建議。</p>`;
  h+=`<p class="sub">${scopeName()}．作答 ${D} 題，答對 ${O} 題（${Math.round(O/D*100)}%）．不含抽考</p><h2>各概念答對率</h2><div>`;
  const rows=tags.filter(k=>stat[k].d).sort((a,b)=>stat[a].o/stat[a].d-stat[b].o/stat[b].d);
  rows.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
    h+=`<div class="tagrow"><span>${TAGS[k].n}</span><div class="bar"><i class="${p<60?"lo":""}" style="width:${p}%"></i></div><span class="pct">${s.o}/${s.d}．${p}%</span></div>`});
  h+=`</div>`;
  const untouched=tags.filter(k=>!stat[k].d);
  if(untouched.length)h+=`<p class="note">尚未作答：${untouched.map(k=>TAGS[k].n).join("、")}</p>`;
  const weak=rows.filter(k=>stat[k].wr.length);
  if(weak.length){h+=`<h2>建議補強</h2>`;
    weak.forEach(k=>{const s=stat[k],p=Math.round(s.o/s.d*100);
      h+=`<section class="weak"><h3>${TAGS[k].n}</h3><p class="stat">答對率 ${p}%．錯 ${s.wr.length} 題</p><p>${TAGS[k].t}</p><ul class="wlist">`;
      s.wr.forEach(id=>{const {q}=QM[id];h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button>　<span class="note">${esc(q.q.length>40?q.q.slice(0,40)+"…":q.q)}</span></li>`});
      h+=`</ul></section>`});
  }
  const f=flagIds();
  if(f.length){h+=`<h2>標註的題目</h2><ul class="wlist">`;f.forEach(id=>{h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button></li>`});h+=`</ul>`}
  if(weak.length||f.length)h+=`<div class="tools"><button data-act="pset" data-scope="${st.scope}">用錯題與標註題抽考</button></div>`;
  return h;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toTop(){window.scrollTo(0,0)}
function qTop(){const el=app.querySelector(".panel");if(!el)return;
  const r=el.getBoundingClientRect();if(r.top<64||r.top>window.innerHeight*0.6)el.scrollIntoView({block:"start"})}
const p5Ids=base=>Object.keys(QM).filter(id=>{const e=QM[id].ex;return e.kind==="toeic"&&(e.part||5)===5&&(!base||(e.stage>=1&&e.stage<=3))});
// 每日 15 題：最多 3 題錯題複習，其餘優先出沒寫過的題目
function newDaily(base,n=15){
  const all=p5Ids(base),wr=shuffle(all.filter(isWrong)).slice(0,3),un=shuffle(all.filter(id=>st.ans[id]===undefined));
  const rest=shuffle(all.filter(id=>st.ans[id]!==undefined&&!wr.includes(id)));
  const ids=shuffle([...new Set([...wr,...un,...rest])].slice(0,n));
  return {ids,ans:{},i:0,src:"daily",base:!!base,scope:"toeic",timed:true,limit:360,start:now(),title:base?"基礎每日 15 題":"每日 15 題"};
}
function fmtDur(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function timerText(){const p=st.pr;if(!p||!p.timed)return "";const el=(p.end||now())-p.start,left=p.limit*1000-el;
  if(p.end)return "用時 "+fmtDur(el);return left>=0?"剩餘 "+fmtDur(left):"超時 "+fmtDur(-left)}
setInterval(()=>{
  const p=st.pr;if(st.view!=="prac"||!p||!p.timed||p.end)return;
  const t=document.getElementById("timer");if(t)t.textContent=timerText();
  if(!p.warned&&now()-p.start>=p.limit*1000){p.warned=true;persist();showToast("6 分鐘到！可以繼續寫完，但記得檢討速度")}
},1000);
function poolIds(pool){const w=wrongIds(),f=flagIds();
  return pool==="wrong"?w:pool==="flag"?f:pool==="both"?[...new Set([...w,...f])]:scopeIds()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||!(app.contains(t)||topbar.contains(t)))return;
  const d=t.dataset,a=d.act;
  if(d.scope)st.scope=d.scope;
  const ex=findEx(st.exam);let scroll=null;
  switch(a){
    case"go":st.view=d.v;scroll=toTop;break;
    case"open":st.view="exam";st.exam=d.ex;st.scope=findEx(d.ex).kind==="toeic"?"toeic":"bigdata";scroll=toTop;break;
    case"goto":st.cur[st.exam]=+d.i;scroll=qTop;break;
    case"pgoto":st.pr.i=+d.i;scroll=qTop;break;
    case"pick":if(st.view==="prac"){st.pr.ans[d.id]=+d.k;if(!st.pr.end&&st.pr.ids.every(x=>st.pr.ans[x]!==undefined))st.pr.end=now()}else setAns(d.id,+d.k);break;
    case"optFirst":st.optFirst=!st.optFirst;break;
    case"flag":toggleFlag(d.id);break;
    case"copy":copyQuestion(d.id);return;
    case"daily":st.pr=newDaily(!!d.base);st.scope="toeic";st.view="prac";scroll=toTop;break;
    case"pstartAgain":{
      const p=st.pr||{};let ids=[];
      if(p.src==="pset"){st.scope=p.scope;ids=shuffle([...poolIds(p.pool)]).slice(0,p.n);
        if(!ids.length){st.view="pset";scroll=toTop;break}}
      else{st.pr=newDaily(p.base);st.view="prac";scroll=toTop;break}
      st.pr={...p,ids,ans:{},i:0};st.view="prac";scroll=toTop;break;
    }
    case"prev":if(st.view==="prac")st.pr.i--;else st.cur[st.exam]=(st.cur[st.exam]||0)-1;scroll=qTop;break;
    case"next":if(st.view==="prac")st.pr.i++;else st.cur[st.exam]=(st.cur[st.exam]||0)+1;scroll=qTop;break;
    case"report":st.view="report";scroll=toTop;break;
    case"pset":st.view="pset";scroll=toTop;break;
    case"presume":st.view="prac";scroll=toTop;break;
    case"pnum":{const inp=document.getElementById("pcount");inp.value=d.n==="999"?scopeIds().length:d.n;return}
    case"pstart":{
      const pool=(app.querySelector('input[name="pool"]:checked')||{}).value;
      const ids=pool?poolIds(pool):[];
      const n=parseInt(document.getElementById("pcount").value,10);
      if(!ids.length){document.getElementById("pmsg").textContent="這個範圍目前沒有題目。";return}
      if(!(n>0)){document.getElementById("pmsg").textContent="請輸入 1 以上的題數。";return}
      st.pr={ids:shuffle([...ids]).slice(0,n),ans:{},i:0,src:"pset",pool,n,scope:st.scope};st.view="prac";scroll=toTop;break}
    case"jump":{const {ex:x,i}=QM[d.id];st.view="exam";st.exam=x.id;st.cur[x.id]=i;scroll=toTop;break}
    case"nextWrong":{const c=st.cur[ex.id]||0,n=ex.qs.length;let f=-1;
      for(let s=1;s<=n;s++){const i=(c+s)%n;if(isWrong(ex.id+"-"+i)){f=i;break}}
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=qTop;break}
    case"retryWrong":{let f=-1;ex.qs.forEach((q,i)=>{const id=ex.id+"-"+i;if(isWrong(id)){delAns(id);if(f<0)f=i}});
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=toTop;break}
    case"resetExam":if(!confirm(`確定清除「${ex.title}」的作答紀錄？標註會保留。`))return;
      ex.qs.forEach((q,i)=>delAns(ex.id+"-"+i));st.cur[ex.id]=0;scroll=toTop;break;
    case"syncConnect":{
      const v=((document.getElementById("tok")||{}).value||"").trim();
      if(!v){showToast("請先貼上 Token");return}
      Sync.cfg={token:v,gistId:"",last:0};Sync.saveCfg();Sync.msg="";
      render();
      Sync.run().then(()=>{if(Sync.state==="ok")showToast("已連線並完成同步")});
      return;
    }
    case"syncNow":Sync.run().then(()=>{if(Sync.state==="ok")showToast("同步完成")});return;
    case"syncOff":if(!confirm("停用這台裝置的同步？本機與雲端紀錄都會保留。"))return;
      clearTimeout(Sync.timer);Sync.timer=null;Sync.cfg={token:"",gistId:"",last:0};Sync.saveCfg();Sync.state="off";Sync.msg="";break;
    case"exportData":{
      const code=JSON.stringify(payload());
      const ta=document.getElementById("bk");if(ta)ta.value=code;
      copyText(code,()=>showToast("備份碼已複製"));
      document.getElementById("bkmsg").textContent=`共 ${Object.keys(st.ans).length} 筆作答紀錄。`;
      return;
    }
    case"importData":{
      const msg=document.getElementById("bkmsg");
      let o;try{o=JSON.parse((document.getElementById("bk").value||"").trim())}catch(err){msg.textContent="備份碼格式不正確。";return}
      if(!o||typeof o.ans!=="object"){msg.textContent="這不是本系統的備份碼。";return}
      const before=Object.keys(st.ans).length;
      mergeRemote(o);persist();Sync.schedule(500);
      showToast(`匯入完成（${before} → ${Object.keys(st.ans).length} 筆）`);
      render();return;
    }
  }
  save();render();if(scroll)scroll();
});

// 記住資料夾與答案卡的展開狀態
document.addEventListener("toggle",e=>{
  const el=e.target;if(!el||!el.classList)return;
  if(el.classList.contains("folder")){st.open[el.dataset.key]=el.open;persist()}
  else if(el.classList.contains("sheet")){st.sheetOpen=el.open;persist()}
},true);

document.addEventListener("visibilitychange",()=>{
  if(!Sync.on())return;
  if(document.visibilityState==="visible")Sync.run();else Sync.flush();
});
window.addEventListener("pagehide",()=>Sync.flush());
window.addEventListener("online",()=>{if(Sync.on())Sync.run()});
setInterval(()=>{if(Sync.on()&&document.visibilityState==="visible"&&!Sync.timer&&!Sync.busy)Sync.run()},120000);

Sync.loadCfg();
load();prevCur={...st.cur};
render();
if(Sync.on())Sync.run();

</script>
</body>
</html>
